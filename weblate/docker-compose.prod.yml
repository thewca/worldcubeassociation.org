# Production Weblate stack. Runs on the single EC2 instance described in
# README.md, behind the wca-on-rails ALB on translate.worldcubeassociation.org.
#
#   docker compose -f /opt/wca/weblate/docker-compose.prod.yml up -d
#
# Started by the instance user-data at boot.
#
# Differences from docker-compose.yml (the local development stack):
#   - reads ./environment.prod, rendered at boot from SSM by render-env.sh,
#     never committed
#   - no ../:/wca-repo mount — production clones GitHub, not your working tree
#   - log rotation, because this host runs for months rather than an afternoon
#   - restart: always, so the stack returns after a reboot or crash
name: wca-weblate

# Docker's json-file driver is unbounded by default. Left alone it will fill the
# 50 GB data volume and take Weblate down in a way that looks like a disk fault.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  cache:
    image: valkey/valkey:9.1.1
    command: [valkey-server, --save, '60', '1', --loglevel, warning]
    volumes:
      - redis-data:/data
    restart: always
    read_only: true
    logging: *default-logging

  database:
    # Pinned deliberately: a major PostgreSQL bump needs an explicit pg_upgrade
    # or dump/restore and must never happen via an unattended pull.
    image: postgres:18-alpine
    volumes:
      - postgres-data:/var/lib/postgresql
    env_file:
      - ./environment.prod
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weblate"]
      interval: 5s
      timeout: 3s
      retries: 20

  weblate:
    # Weblate uses CalVer and requires SEQUENTIAL upgrades across major
    # versions — you cannot jump 2026.8 -> 2027.x in one step. Snapshot the EBS
    # volume before changing this tag; migrations run on start and there is no
    # down-migration.
    image: weblate/weblate:2026.8
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_started
    ports:
      # The ALB health-checks and forwards to this port. Reaching it is gated by
      # the instance security group, which admits only the load balancer's SG.
      - "8080:8080"
    volumes:
      - weblate-data:/app/data
      - weblate-cache:/app/cache
      # Translator permissions come from the WCA `translations` OIDC claim via a
      # custom pipeline step; neither the extra scope nor the pipeline entry is
      # reachable through a WEBLATE_* variable. See README.md.
      - ./customize:/app/data/python/customize:ro
      - ./settings-override.py:/app/data/settings-override.py:ro
    env_file:
      - ./environment.prod
    restart: always
    read_only: true
    tmpfs:
      - /run
      - /tmp
    logging: *default-logging
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz/"]
      interval: 10s
      timeout: 5s
      retries: 30
      # First boot runs migrations and builds the search index.
      start_period: 5m

# Named volumes live under /var/lib/docker on the instance's root volume, which
# is created with DeleteOnTermination=false (see README.md). All Weblate
# state — database, repo checkouts, search index — is in here.
volumes:
  weblate-data:
  weblate-cache:
  postgres-data:
  redis-data:
