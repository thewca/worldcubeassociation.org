name: 'Builds a whole environment of docker images'
description: 'A custom action to build and push all Docker images of an environment.'
inputs:
  environment:
    description: 'Deployment environment (e.g., staging, production)'
    required: true
  build_tag:
    description: 'The build tag of the current code state'
    required: true
  registry:
    description: 'Docker registry to push the image to'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Set environment variables
      shell: bash
      run: |
        if [ "${{ inputs.environment }}" == "staging" ]; then
          echo "ASSET_BUCKET=assets-staging.worldcubeassociation.org" >> $GITHUB_ENV
          echo "MONOLITH_TAG=staging" >> $GITHUB_ENV
          echo "SHAKAPACKER_ASSET_HOST=https://assets-staging.worldcubeassociation.org" >> $GITHUB_ENV
          echo "WCA_LIVE_SITE=false" >> $GITHUB_ENV
        elif [ "${{ inputs.environment }}" == "production" ]; then
          echo "ASSET_BUCKET=assets.worldcubeassociation.org" >> $GITHUB_ENV
          echo "MONOLITH_TAG=latest" >> $GITHUB_ENV
          echo "SHAKAPACKER_ASSET_HOST=https://assets.worldcubeassociation.org" >> $GITHUB_ENV
          echo "WCA_LIVE_SITE=true" >> $GITHUB_ENV
        fi
    - name: Build and push all images
      uses: docker/bake-action@v7
      env:
        REGISTRY: ${{ inputs.registry }}
        BUILD_TAG: ${{ inputs.build_tag }}
        ENVIRONMENT: ${{ inputs.environment }}
        MONOLITH_TAG: ${{ env.MONOLITH_TAG }}
        WCA_LIVE_SITE: ${{ env.WCA_LIVE_SITE }}
        SHAKAPACKER_ASSET_HOST: ${{ env.SHAKAPACKER_ASSET_HOST }}
      with:
        source: .
        files: ./docker-bake.hcl
    - name: Push assets to S3
      shell: bash
      run: | # ./assets comes from the same `build` stage as the images just pushed
        aws s3 sync ./assets s3://${{ env.ASSET_BUCKET }}/assets/${{ inputs.build_tag }} --cache-control "public, max-age=31536000, immutable"
