name: Deploy Nextjs to Production
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::285938427530:role/wca-on-rails-github-deploy-production
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push nextjs Image
        uses: ./.github/actions/build-js-image
        with:
          registry: ${{ steps.login-ecr.outputs.registry }}/wca-nextjs
          tag: nextjs-production
          asset_bucket: assets.worldcubeassociation.org
          base_url: www.worldcubeassociation.org
      - name: Deploy new nextjs Image
        run: |
          aws ecs update-service --cluster wca-on-rails --service wca-on-rails-prod-nextjs-production --force-new-deployment
          aws ecs update-service --cluster wca-on-rails --service wca-on-rails-prod-nextjs-production-results --force-new-deployment
