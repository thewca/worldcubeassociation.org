name: Style guide review

# Reviews pull requests against docs/STYLE_GUIDE.md and leaves inline comments.
# Advisory only: this workflow never fails a PR, it just comments.
#
# Uses `pull_request_target` so that fork PRs (which is most contributions) can
# be reviewed at all -- `pull_request` runs from forks get no secrets, and this
# job needs AWS credentials to reach Bedrock.
#
# Because `pull_request_target` runs in the context of the BASE repo with
# secrets available, this job must never execute code from the PR:
#   * no `yarn install`, no `bundle install`, no build, no tests
#   * Claude runs with Read/Grep/Glob only -- no Bash, no Write, no Edit
#   * the style guide is restored from the base branch, so a PR cannot edit
#     the rules it is about to be judged against
# Keep it that way when editing this file.
#
# NOTE ON TOOL RESTRICTION: `--allowedTools` does NOT restrict anything. It only
# marks tools as not needing an interactive permission prompt; every other tool
# stays available. A run on 2026-08-03 called Bash despite the allowlist below,
# with no permission denial. `--disallowedTools` is what actually enforces the
# contract above -- do not drop it, and add to it if new tools appear.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    paths:
      - 'app/**'
      - 'lib/**'
      - 'spec/**'
      - 'db/**'
      - 'config/**'
      - 'next-frontend/**'
      - 'docs/STYLE_GUIDE.md'
      - '.github/workflows/style-guide-review.yml'

# A new push supersedes the review of the previous one.
concurrency:
  group: style-guide-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  # Not needed for the static access keys below, but the action requests an OIDC
  # token, and it is what you would need if AWS auth is ever moved to a role.
  id-token: write

jobs:
  review:
    # Draft PRs are still work in progress; don't spend tokens on them.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR merge commit
        uses: actions/checkout@v7
        with:
          # The merge ref is what the PR would look like once merged, which is
          # what we want to review. fetch-depth 0 so we can diff against base.
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          persist-credentials: false

      - name: Restore style guide from base branch
        # The PR must not be able to weaken the rules it is reviewed against.
        # If the guide does not exist on base yet, fall back to the PR's copy.
        run: |
          git checkout ${{ github.event.pull_request.base.sha }} -- docs/STYLE_GUIDE.md \
            || echo "::notice::docs/STYLE_GUIDE.md not found on base, using the PR's version"

      - name: Compute PR diff
        # Precomputed so that Claude never needs a shell to inspect the PR.
        # Capped so a huge PR cannot blow up the context window (or the bill);
        # beyond the cap Claude falls back to reading the changed files.
        #
        # 60KB is roughly 15k tokens. The cap is the tail-risk control: the whole
        # diff sits in the cached prefix and is re-read on every turn, so an
        # uncapped 400KB diff could cost several dollars on its own.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --stat "$BASE_SHA"...HEAD > pr-changed-files.txt
          git diff "$BASE_SHA"...HEAD > pr.diff
          if [ "$(wc -c < pr.diff)" -gt 60000 ]; then
            echo "DIFF TRUNCATED -- too large to include in full. Read the changed files directly instead." > pr.diff
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.CI_CD_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.CI_CD_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Review against the style guide
        uses: anthropics/claude-code-action@v1
        env:
          # Billing goes through Bedrock in the WCA AWS account. Claude Code
          # picks the credentials up from the standard AWS SDK chain, which the
          # step above populated.
          CLAUDE_CODE_USE_BEDROCK: '1'
          # configure-aws-credentials already exports AWS_REGION; setting it
          # again is deliberate. Without it Bedrock would silently fall back to
          # us-east-1, where the models are not enabled, and the `us.` inference
          # profile below only resolves in a US region anyway.
          AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          # Matching code against a written rulebook is closer to classification
          # than open-ended reasoning, and thinking tokens bill as output. A run
          # that produced ~1.5k tokens of actual comments spent ~14k output
          # tokens in total, nearly all of it thinking.
          MAX_THINKING_TOKENS: '0'
        with:
          use_bedrock: 'true'
          # Using the built-in GITHUB_TOKEN means this works without installing
          # the Claude GitHub App. Comments appear as github-actions[bot].
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # TEMPORARY: without this the action prints is_error:true but swallows
          # the model's actual error text, which makes every failure look alike.
          # Remove once this run has confirmed the cost, and note that it prints
          # the whole session into a log anyone can read.
          show_full_output: 'true'
          # On the model choice: Haiku 4.5 was tried on 2026-08-04 and found 3 of
          # 6 known violations on the same PR where Sonnet found all 6. Roughly a
          # third of the price, but a reviewer that misses half the findings is
          # not worth the saving. Don't switch back without re-testing.
          claude_args: |
            --model us.anthropic.claude-sonnet-5
            --max-turns 8
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Bash,Write,Edit,MultiEdit,NotebookEdit,WebFetch,WebSearch,Task,KillShell,BashOutput"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a pull request for compliance with this project's
            style guide, and for nothing else.

            ## How to do this review

            1. Read `docs/STYLE_GUIDE.md` in full. It is the ONLY standard you
               are reviewing against.
            2. Read `pr.diff` for the changes (`pr-changed-files.txt` lists the
               changed files). If the diff says it was truncated, read the
               changed files directly instead.
            3. Read surrounding code where you need context to judge whether
               something is actually a violation.
            4. Post inline comments on the specific lines that violate the guide,
               using the `mcp__github_inline_comment__create_inline_comment` tool
               with `confirmed: true`.

            Inline comments are your ONLY means of output. You have no tool for
            posting a general PR comment, so do not try: if you find nothing,
            call no tools and simply end your turn.

            ## What to flag

            ONLY flag a clear violation of a specific rule in the style guide.
            Every comment you post must:
              * cite the section it comes from, e.g. "Style guide §3.2 (query
                performance)";
              * say concretely what to change, not just what is wrong;
              * be about a line that this PR actually changed.

            ## What NOT to flag

            * Anything not covered by the style guide. General code review,
              architecture opinions, bug hunting and test coverage are out of
              scope. Someone else does those.
            * Anything RuboCop, ESLint or Prettier already enforces. They run in
              their own jobs and they are the authority on formatting.
            * Pre-existing code the PR merely moved or touched incidentally.
              Only new and modified lines are in scope.
            * Style preferences you hold that the guide does not state.

            ## Judgement

            Be genuinely useful, not thorough for its own sake. A PR with no real
            violations must get NO inline comments -- silence is the correct and
            expected outcome for a clean PR, and false positives cost
            contributors more than missed nits cost the project.

            Pay attention to which part of the codebase you are in:
            `next-frontend/` and `app/webpacker/` have deliberately different
            rules (see the guide). Applying the wrong set is itself a mistake.

            You are advisory. You are not a merge gate, so do not tell the author
            their PR is blocked, and phrase findings as requests a reviewer would
            make, not as commands.
