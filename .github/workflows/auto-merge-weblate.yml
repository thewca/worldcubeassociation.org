name: Auto-merge Weblate PRs

on:
  pull_request_target:
    types: [ opened, reopened, synchronize ]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'thewca-bot' && github.event.pull_request.head.ref == 'weblate-wca-locales'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Check that only locale files are changed
        id: files
        run: |
          unexpected=$(gh pr diff "$PR_NUMBER" --name-only | grep -vE '^config/locales/[^/]+\.yml$' || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected files changed:"
            echo "$unexpected"
            echo "only_locales=false" >> "$GITHUB_OUTPUT"
          else
            echo "only_locales=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Approve and enable auto-merge
        if: steps.files.outputs.only_locales == 'true'
        run: |
          gh pr review "$PR_NUMBER" --approve
          gh pr merge "$PR_NUMBER" --auto --squash
      # Ensures that a subsequent push that doesn't only contain locale files is rejected
      - name: Disable auto-merge
        if: steps.files.outputs.only_locales == 'false'
        run: gh pr merge "$PR_NUMBER" --disable-auto || true
