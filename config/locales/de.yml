  faq:
    title: Häufig gestellte Fragen (FAQ)
    contact_html: 'Wenn keine der Antworten geholfen hat, bitte %{contact_us}!'
    contact_us: kontaktiere uns
    search_for_competition: 'Suche hier nach einem Wettbewerb:'
    already_logged_in: Du bist bereits mit einem WCA-Benutzerkonto angemeldet.
    create_an_account: 'Du kannst %{here} ein Benutzerkonto erstellen.'
    claim_your_wca_id: 'Du kannst deine WCA-ID %{here} anfordern.'
    create_an_account_and_claim: >-
      Erstelle %{here} ein Benutzerkonto. Nachdem Du Dich mit deinem neuen
      Benutzerkonto anmeldest, wirst Du gebeten deine WCA-ID anzufordern.
    answers:
      '1':
        title: Wie erhalte ich eine WCA-ID und eine WCA-Profilseite?
        content:
          '1': >-
            Wenn du noch nie zuvor an einem Wettbewerb teilgenommen hast, gehe
            zu <a href='/competitions'>Wettbewerbe</a>! Eine WCA-ID sowie eine
            WCA-Profilseite werden für dich erstellt, sobald die Ergebnisse
            deines ersten Wettbewerbs veröffentlicht werden.
      '2':
        title: Wie kann ich einen WCA-Wettbewerb finden?
        content:
          '1': >-
            Sieh Dir unsere Liste von <a href='/competitions'>Wettbewerben</a>
            an.
      '3':
        title: >-
          Wie kann ich mich für einen Wettbewerb anmelden? Bei wem kann ich mich
          melden wenn ich Probleme bei der Anmeldung habe?
        content:
          '1': >-
            Die meisten Wettbewerbe verwalten ihre Anmeldungen direkt hier auf
            der WCA-Website, manche nutzen aber auch ein eigenes System. Du
            solltest die Organisatoren des Wettbewerbs an dem Du teilnehmen
            möchtest kontaktieren, um Näheres zu erfahren. %{comp_search_form}
      '4':
        title: >-
          Was sind die Voraussetzungen um an einem WCA-Wettbewerb teilnehmen zu
          können? Was muss ich vor der Teilnahme alles wissen?
        content:
          '1': >-
            Im Allgemeinen gibt es kaum Voraussetzungen um an einem Wettbewerb
            teilzunehmen. Es wird jedoch von jedem Teilnehmer ein gutes
            Verständnis der <a
            href='https://www.worldcubeassociation.org/regulations/'>WCA-Regeln</a>
            erwartet. Die deutsche Übersetzung der Regeln ist <a
            href='https://www.germancubeassociation.de/anleitungen/'>hier</a> zu
            finden.
      '5':
        title: Wie kann ich einen Wettbewerb in meinem Heimatort ermöglichen?
        content:
          '1': >-
            Wenn Du gerne einen Wettbewerb organisieren möchtest, solltest Du
            auf jeden Fall an mindestens zwei Wettbewerben teilgenommen haben um
            die Erfahrung als Teilnehmer zu sammeln.
          '2': >-
            WCA-Wettbewerbe müssen sich nach den <a target='_blank'
            href='https://www.worldcubeassociation.org/regulations/'>WCA-Regeln</a>
            richten. Das Organisationsteam muss diese zwar nicht wortgetreu
            auswendig beherrschen, ein vertieftes Verständnis der
            Regelgrundlagen hilft jedoch definitiv beim Organisieren des
            Wettbewerbs.
          '3': >-
            Hiernach muss das Organisationsteam Kontakt mit einem lokalen <a
            target='_blank'
            href='https://www.worldcubeassociation.org/delegates'>WCA-Delegierten</a>
            aufnehmen. Die Aufsicht eines WCA-Delegierten ist notwendig, damit
            der Wettbewerb offiziell von der WCA zugelassen und anerkannt wird.
            Der WCA-Delegerte unterstützt das Organisationsteam auch bei der
            erfolgreichen Organisation des Wettbewerbs.
          '4': >-
            Besuche die <a target='_blank'
            href='https://documents.worldcubeassociation.org/edudoc/organizer-handbook/organizer-handbook.pdf'>WCA
            Competition Organizer Handbook</a> oder das <a target='_blank'
            href='http://cube.hackvalue.de/tutorials/competition.php'>deutsche
            Organisations-Tutorial</a> für weitere Informationen.
      '6':
        title: >-
          Wofür sind die WCA-Benutzerkonten da? Was ist der Unterschied zwischen
          einem WCA-Benutzerkonto und einer WCA-Profilseite?
        content:
          '1': >-
            Du erhältst automatisch eine WCA-ID sobald die Ergebnisse deines
            ersten offiziellen WCA-Wettbewerbs veröffentlicht werden.
          '2': >-
            WCA-Benutzerkonten dienen uns als Nachweis deiner Identität. Sie
            ermöglichen es dir, ein Profilfoto zu deiner WCA-Profilseite
            hinzuzufügen, sowie dich für Wettbewerbe anzumelden. Dies schützt
            dich vor anderen Menschen, die sich als du ausgeben wollen.
          '3': '%{current_user_status}'
      '7':
        title: Wie kann ich mein Profilbild ändern?
        content:
          '1': >-
            Zuerst musst du <a
            href='#how-do-i-connect-my-wca-account-with-my-wca-id'>ein
            WCA-Benutzerkonto erstellen und es mit deiner WCA-ID verknüpfen.</a>
          '2': >-
            Nachdem Du deine WCA-ID mit deinem WCA-Benutzerkonto verknüpft hast,
            gehst Du auf deine <a
            href='%{profile_edit_path}'>Benutzerkonto-bearbeiten-Seite</a> um
            dein Profilbild zu ändern.
      '8':
        title: Wie verknüpfe ich meine WCA-ID mit meinem WCA-Benutzerkonto?
        content:
          '1': '%{current_user_claim}'
      '9':
        title: >-
          Ich bin für einen Wettbewerb registriert und will mich für eine
          weitere Disziplin anmelden, was soll ich machen? Kann ich Gäste
          mitbringen?
        content:
          '1': >-
            Bitte setze dich mit dem Veranstalter in Verbindung. Seine
            Kontaktdaten findest du auf der Webseite des Wettbewerbs. Falls du
            unsicher bist, wo du diese findest, schau auf der <a
            href='/competitions'>Liste der Turniere</a> nach.
      results:
        title: >-
          Wann werden die Ergebnisse eines WCA-Wettbewerbs auf die WCA-Website
          hochgeladen?
        content:
          '1': >-
            Nachdem ein Wettbewerb vorbei ist, muss der WCA-Delegierte alle
            Ergebniszettel und Personendaten gegenlesen, um mögliche Fehler zu
            korrigieren. Sobald dies erledigt ist, werden die Ergebnisse an das
            WCA Results-Team (WRT) übersendet, welches für das Hochladen der
            Ergebnisse sowie die Verwaltung der WCA-Datenbank verantwortlich
            ist. Das WRT lädt die Ergebnisse dann so schnell wie möglich hoch.
          '2': >-
            Abhängig von der Größe des Wettbewerbs und dem persönlichen
            Terminkalender des WCA-Delegierten, kann dies eine Zeitspanne von
            nur einem Tag bis zu einer Woche in Anspruch nehmen. Bitte übe dich
            in Geduld.
          '3': >-
            Zusätzlich kannst Du, sofern dein WCA-Benutzerkonto mit deiner
            WCA-ID verbunden ist (siehe unten), <a
            href='%{preferences_edit_path}'>hier</a> automatische
            E-Mail-Benachrichtigungen über deine Ergebnisse aktivieren.
      regulations1:
        title: Darf ich mein Puzzle bei einem Turnier benutzen?
        content:
          '1': >-
            Du findest die Regeln bezüglich Puzzles in <a
            href='https://www.worldcubeassociation.org/regulations/#3'>Artikel
            3</a>. Alle Puzzle müssen von einem WCA Delegierten überprüft
            werden. Falls du unsicher bist, frage den Delegierten deines
            Turniers. Um sicherzugehen, solltest du ein Ersatz Puzzle mitnehmen,
            falls du es nicht benutzen darfst.
      regulations2:
        title: Darf ich magnetische Puzzle bei offiziellen WCA Turnieren 
          benutzen?
        content:
          '1': >-
            Du darfst magnetische Puzzle benutzen, soweit diese den <a
            target='_blank'
            href='https://www.worldcubeassociation.org/regulations/'>WCA
            Regeln</a> entsprechen. Bitte lies insbesondere <a
            href='https://www.worldcubeassociation.org/regulations/#3h'>Regel
            3h</a>.
      regulations3:
        title: >-
          Ich habe eine Center Cap oder ein Teil meines Puzzles verloren. Darf
          ich es trotzdem benutzen?
        content:
          '1': >-
            Du darfst dieses Puzzle nicht benutzen. Puzzles dürfen keine
            Beschädigungen oder andere Unterschiede haben, die es ermöglichen
            ein Teil von einem ähnlichen Teil zu unterscheiden (siehe <a
            href='https://www.worldcubeassociation.org/regulations/#3j'>Regel
            3j</a>).
      regulations4:
        title: 'Wie alt muss ich sein, um mich für ein WCA Turnier anmelden zu dürfen?'
        content:
          '1': >-
            Es gibt kein minimales Alter. Trotzdem solltest du deine Eltern
            fragen, bevor du dich anmeldest (siehe <a
            href='https://www.worldcubeassociation.org/regulations/#2b'>Regel
            2b</a>).
  about:
    title: Über die WCA
    mission_statement: >-
      Unser Ziel ist es, mehr Wettbewerbe in mehr Ländern und mehr Personen und
      mehr Spaß unter fairen und gleichwertigen Bedingungen zu haben.
    mission_footer: WCA Leitbild
    who_we_are_title: Wer wir sind
    who_we_are_content_html: >-
      <p>Die World Cube Association verwaltet Wettbewerbe für mechanische
      Puzzles, die sich durch das Drehen von Gruppen von Teilen auszeichnen.
      Diese werden auch "Twisty Puzzles" oder "Drehpuzzle" genannt. Das
      berühmteste jener Puzzles ist der Rubik's Cube, erfunden von Professor
      Rubik aus Ungarn. Eine Auswahl solcher Puzzles wurde zu offiziellen Events
      der WCA erklärt.</p> <p>Während die WCA sich innerhalb des letzten
      Jahrzehnts weiterentwickelt hat, haben über 200.000 Personen an unseren
      Wettbewerben teilgenommen. Trotz dieses Wachstums bleiben wir eine
      Organisation die fast ausschließlich von Ehrenamtlichen getragen wird, von
      lokalen Organisatoren, über WCA Delegates, bis hin zum WCA Vorstand. Wir
      sind allen sehr dankbar, die sich die Zeit nehmen, die Arbeit der WCA zu
      ermöglichen. Wir hoffen, dass wir mit mehr finanzieller Unterstützung ein
      noch höheres Maß an Professionalität in unsere Wettbewerbe einbringen
      können, während wir immer mehr Veranstaltungen in der ganzen Welt
      genehmigen.</p>
    spirit: >-
      Unser Wunsch ist es, dass Menschen in aller Welt in einer freundlichen
      Atmosphäre Spaß zusammen haben, anderen helfen und sich fair verhalten.
    spirit_footer: WCA Spirit
    our_goals_title: Unsere Ziele
    our_goals_content_html: >-
      <p>Die World Cube Association möchte durch die steigende Verfügbarkeit von
      Competitions jungen Menschen in aller Welt die Möglichkeit geben, Mitglied
      der Community zu werden und darin Führungspositionen zu übernehmen. Wir
      glauben, dass die Erfahrungen, die junge Menschen bei Competitions und
      innerhalb unserer Community machen, Wachstumschancen für alle Beteiligten
      bietet und dass die Einführung von Veranstaltungen für neue
      Personengruppen erlaubt, die Community weiter zu stärken. Ein Dokument mit
      den Visionen und Strategien des Vorstands der WCA gibt es <a
      href="https://documents.worldcubeassociation.org/documents/WCA_Strategic_Plan.pdf">hier</a>.</p>
    whats_next_title: Was ist bei der WCA geplant?
    whats_next_content_html: >-
      <p>Die World Cube Association hat über 200.000 Teilnehmer in 158
      verschiedenen Regionen gezählt und wir haben nicht vor, in nächster Zeit
      nachzulassen! Die Cubing-Gemeinschaft ist seit unserer Gründung im Jahr
      2004 stetig gewachsen und wir möchten dies auch in Zukunft fördern, indem
      wir die Zugänglichkeit von Wettbewerben auf neue Gebiete ausweiten. Wir
      hoffen, dass wir unsere Gemeinschaft in Zukunft noch mehr unterstützen
      können, indem wir mit denjenigen zusammenarbeiten, die sich für Puzzles
      interessieren.</p>
    world_championship_title: Weltmeisterschaft
    world_championship_content_html: >-
      <p>Im Zweijahresturnus führen wir Turniere durch, bei denen der
      Weltmeister bestimmt wird. Diese Veranstaltungen bedürfen einer sehr
      sorgfältigen Planung durch Freiwillige, sowie einer großen finanziellen
      Verpflichtung, um den Veranstaltungsort zu reservieren und notwendige
      Vorbereitungen durchzuführen.</p>
    contributing_title: Einen Beitrag leisten
    contributing_content_html: >-
      Du kannst über Guidestar %{here_credit} per Kreditkarte spenden, oder über
      Paypal %{here_paypal}. Wenn du es vorziehst, einen Scheck auszustellen,
      kannst du diese Adresse nutzen:
    tax_deductible_note: Spenden sind in den Vereinigten Staaten von der Steuer 
      absetzbar
    other_help_title: Andere Wege zu helfen
    other_help_content_html: >-
      <p>Falls du denkst, dass du in nicht-finanzieller Weise zum Erfolg der
      World Cube Association beitragen kannst, würden wir gerne davon hören!
      Bitte kontaktiere uns über <a
      href="mailto:communication@worldcubeassociation.org">communication@worldcubeassociation.org</a>.</p>
    donation_banner:
      content: >-
        Die World Cube Association ist eine 501(c)(3) steuerbefreite
        Organisation. Als eine zu 100 % von Freiwilligen geleitete
        Non-Profit-Organisation freuen wir uns über Spenden, die uns dabei
        helfen, unsere Vision von mehr unterhaltsamen Wettbewerben auf der
        ganzen Welt zu verwirklichen.
      donate_credit: Per Kreditkarte spenden
      donate_paypal: Spende via Paypal
      donate_other: Andere Wege zu spenden
    structure:
      teams_committees_councils: 'WCA Teams, Komitees und Gremien'
      title: Zusammensetzung
      board:
        name: WCA Board of Directors
        description: >-
          Die World Cube Association wird vom WCA Board geleitet, das aus
          folgenden Mitgliedern besteht:
      committees: >-
        Die folgenden Teams und Komitees sind ein wesentlicher Bestandteil der
        Organisation und führen die täglichen Aufgaben aus, die nötig sind, um
        die Organisation funktionsfähig zu halten. Diese Komitees bestehen aus
        WCA Mitgliedern. Dies schließt sowohl WCA Delegierte als auch Teilnehmer
        ein. Jedes Team hat einen Leiter, der in seiner Rolle sicherstellt, dass
        das Team seine Aufgaben erledigt und auch andere WCA Team-Mitglieder
        anleitet. Gremien sind ein spezieller Typ von Teams, die in einer
        Beraterrolle für das WCA Board arbeiten und aus Community Mitgliedern
        bestehen. Diese sind keine WCA Mitarbeiter. Wenn es offene Stellen in
        Komitees, Teams oder Gremien gibt, wird dies inklusive der
        Bewerbungsanforderungen auf der Frontseite veröffentlicht.
      senior_member: Senior Mitglied
      leader: Leiter
      officers:
        name: WCA Direktor
        description: >-
          Die Direktoren der WCA befassen sich mit Aufgaben, die mit dem
          Non-Profit Status der WCA zusammenhängen. Diese Direktoren werden
          durch das WCA Board gewählt. Der geschäftsführende Direktor ist der
          Geschäftsführer der WCA, der Vorsitz leitet alle Board Meetings, der
          Sekretär verwaltet die Dokumente der Organisation und der
          Schatzmeister verwaltet die finanziellen Angelegenheiten der WCA.
      chair:
        name: WCA Vorsitz
      executive_director:
        name: WCA Geschäftsführer
      secretary:
        name: WCA Sekretär
      vice_chair:
        name: WCA Vizepräsident
      treasurer:
        name: WCA Schatzmeister
      users:
        profile: '%{user_name}s Profil'
      wdc:
        name: WCA Disciplinary Committee
        description: >-
          Dieses Komitee berät das WCA Board in besonderen Fällen, wie etwa
          mutmaßlichem Verstoß gegen die WCA-Regeln, und kann von Mitgliedern
          der WCA in dringenden persönlichen Angelegenheiten bezüglich
          WCA-Wettbewerben kontaktiert werden.
      wdpc:
        name: WCA Datenschutz Komitee
        description: >-
          Dieses Komitee ist für alle Angelegenheiten, die den Datenschutz
          betreffen, zuständig.
      wrc:
        name: WCA Regulations Committee
        description: 'Dieses Komitee ist dafür verantwortlich, die WCA-Regeln zu verwalten.'
      wrt:
        name: WCA Results Team
        description: >-
          Dieses Team ist dafür zuständig, die Resultate von Turnieren zu
          verwalten.
      wst:
        name: WCA Software Team
        description: >-
          Dieses Team ist für die Software der WCA zuständig (Webseite,
          Scrambling Software, Workbook, Admin Tools).
      wct:
        name: WCA Communication Team
        description: >-
          Das WCA Communication Team (WCT) hat die Aufgabe die Kommunikation der
          WCA mit der Community und der Öffentlichkeit zu managen und zu
          unterstützen. Die Kommunikation der WCA sollte den Zielen der WCA
          dienen und eine positive Kultur von Freundlichkeit, Transparenz,
          Respekt, Offenheit und Verantwortung unterstützen.
      wfc:
        name: WCA Financial Committee
        description: Das Team ist für die Verwaltung der Finanzen der WCA 
          verantwortlich
      wec:
        name: WCA Ethik Komitee
        description: >-
          Dieses Komitee hat die Aufgabe sicherzustellen, dass alle Handlungen
          von WCA Personal und externem Personal den Ethikkodex befolgen.
      weat:
        name: WCA Vorstandsassistenten Team
        description: >-
          Dieses Team ist verantwortlich dafür, administrative Aufgaben des WCA
          Vorstands auszuführen.
      wqac:
        name: WCA Quality Assurance Committee
        description: >-
          Dieses Komitee hat die Aufgabe, die Verbesserung der Qualität
          innerhalb der WCA, sowie die Anwendung von Qualitätsstandards
          international, zu unterstützen und zu fördern um eine konsistent hohe
          Qualität von Prozessen, WCA  Personal, regionalen Organisationen,
          Organisatoren von Wettbewerben und Personal von Wettbewerben
          sicherzustellen.
      wcat:
        name: WCA Wettbewerbsankündigungsteam
        description: >-
          Dieses Team hat die Aufgabe, WCA Wettbewerbe zu bestätigen,
          anzukündigen und sicherzustellen, dass die Ankündigungen den WCA
          Qualitätsstandards entsprechen.
      wmt:
        name: WCA Marketing Team
        description: >-
          Dieses Team ist dafür zuständig, die Marke WCA zu entwickeln und zu
          verwalten, Sponsoren zu suchen, die Verteilung von WCA
          Wettbewerbsequipment zu unterstützen, und WCA Merchandise zu
          vermarkten.
      wac:
        name: WCA Beratungsgremium
        description: >-
          Dieses Gremium ist für den Aufbau und die Pflege der bilateralen
          Kommunikation zwischen der WCA Community und den WCA Mitarbeitern
          zuständig.
      wsot:
        name: WCA Sports Organization Team
        description: >-
          Dieses Team ist dafür zuständig, die Anerkennung der WCA als
          internationale Sportorganisation zu überwachen und zu unterstützen.
      wat:
        name: WCA Archive Team
        description: >-
          Das WCA Archive Team ist ein Beratungsgremium der WCA. Dieses Team ist
          dafür zuständig, die Entwicklung eines Archivs der Organisation zu
          überwachen und zu unterstützen.
      banned:
        name: Gesperrte Teilnehmer
      wct_china:
        name: WCT China
      operations_html: >-
        Die alltäglichen Tätigkeiten werden durch die %{committees_and_teams}
        der WCA durchgeführt.
      teams_committees: Teams und Komitees
      probation:
        name: Delegates auf Bewährung
      wst_admin:
        name: Software Admins
      delegates_html: >-
        <p><strong>WCA Delegate</strong> ist eine Rolle die in den WCA Motions
        definiert ist und in den WCA Regeln weiter beschrieben wird. Die
        Hauptaufgabe eines Delegierten ist es, Wettbewerbe im Auftrag der WCA zu
        überwachen. Ein WCA Delegierter ist verantwortlich dafür
        sicherzustellen, dass alle WCA Wettbewerbe entsprechend der Aufgabe, des
        Spirits und der Regeln abgehalten wird. Die WCA unterscheidet zwischen
        <strong>WCA Senior Delegates</strong>, <strong>WCA Delegates</strong>
        und <strong>WCA Candidate Delegates</strong>%{see_link}.</p>
        <p>Zusätzlich zu den Aufgaben eines WCA Delegierten ist ein WCA Senior
        Delegate dafür verantwortlich, WCA Delegierte in ihrer Region zu
        verwalten und er kann auch von der Community bei regionalen
        Angelegenheiten kontaktiert werden.</p> <p>Neue Delegierte werden
        zunächst als WCA Junior Delegates aufgeführt. Danach ist es ihre
        Aufgabe, ihre Fähigkeiten bei der Leitung von WCA Wettbewerben unter
        Beweis zu stellen, bevor sie zu WCA Delegierten befördert werden.</p>
        <p>Trainee Delegates werden auf die Rolle als WCA Delegierter
        vorbereitet und dürfen nur Wettbewerbe betreuen, wenn ein WCA Delegate
        anwesend ist.</p>
      see_link_html: ' (siehe %{link})'
      members_html: >-
        Alle Turnierteilnehmer werden automatisch bei ihrem ersten WCA-Turnier
        zu <strong>Mitgliedern</strong> der WCA.
