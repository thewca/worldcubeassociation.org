      user:
        dob: >-
          Trage das Geburtsdatum des Teilnehmers / der Teilnehmerin im Format
          JJJJ-MM-TT ein.
        name: >-
          Trage den vollen Namen des Teilnehmers / der Teilnehmerin sorgfältig ein,
          zum Beispiel <strong>Stefan Pochmann</strong>. Nicht unachtsam wie etwa
          <strong>s pochman</strong>. <br/>Zweite Vornamen (entweder ganz oder als
          Initial) sind optional.
        pending_avatar: >-
          Nachdem Du ein neues Profilbild hochgeladen hast, muss dieses erst vom
          WCA Results Team bestätigt werden.
        registration_notifications_enabled: >-
          Dies gilt nur für Wettbewerbe, die du organisierst oder delegierst,
          und kann pro Wettbewerb überschrieben werden.
        receive_delegate_reports: >-
          Wenn du ein Trainee Delegate, Junior Delegate, Senior Delegate oder
          ein Mitglied des WRC oder des WQAC bist, erhältst du standardmässig
          Delegate Reports. Achtung: die Aktivierung der Änderung kann bis zu
          einer Stunde dauern.
        otp_attempt: >-
          Überprüfe deine konfigurierte mobile Applikation für ein
          Einmal-Passwort oder gebe einen deiner Wiederherstellungs-Codes ein.
        receive_developer_mails: Dies ist begrenzt auf Benachrichtigungen für 
          wesentliche Versions-Änderungen in Ressourcen wie den Daten-Exporten, 
          dem WCIF-Schema oder öffentlichen APIs. Für Entwickler:innen 
          empfohlen, die Software auf Grundlage dieser Schnittstellen entwickeln
          und betreiben.
        delegate_reports_region: 'Wenn Du alle Reports empfangen möchtest, lasse dieses
          Feld frei (die Option ganz oben im Dropdown). Beachte: Es kann bis zu 12
          Stunden dauern, bis die Änderungen übernommen werden.'
      competition:
        championships:
      website_contact:
      dob_contact:
        dob: Dein korrektes Geburtsdatum im Format YYYY-MM-DD (Jahr - Monat - 
          Tag)
        document: >-
          Um deine Identität und dein korrektes Geburtsdatum nachzuweisen, musst
          du ein Bild eines Ausweisdokumentes anhängen. Dies kann ein Ausweis,
          ein Führerschein, ein Schülerausweis oder ähnliches sein, auf dem dein
          Name und dein Geburtsdatum klar ersichtlich und für einen
          Englischsprachler verständlich ist (oder kontaktiere deinen lokalen
          WCA Delegate, falls du ein solches Dokument nicht besitzt). Zur
          Identifizierung benötigen wir mindestens deinen Namen und dein
          Geburtsdatum. Zögere nicht, weitere persönliche Angaben im Dokument
          unkenntlich zu machen.
      post:
        body: >-
          Benutze den &lt;!-- break --&gt;-Tag um eine Vorschau auf der Homepage
          anzuzeigen. Jeder Post auf der Website wird sämtlichen Text vor diesen
          Tag anzeigen. Der tatsächliche Post umfasst dann den vollen Inhalt.
        show_on_homepage: >-
          Achtung! Dies ist nicht sicher für vertrauliche Informationen. Es
          verhindert nur die Anzeige auf der Homepage. Beiträge, die nicht auf
          der Webseite angezeigt werden, sind über den Link und die Tags
          öffentlich abrufbar.
      delegate_report:
        schedule_url: >-
          Vollständiger Link zum öffentlichen Zeitplan (z.B.
          https://www.cubingusa.com/usnationals2016/schedule.php)
        equipment: >-
          Nummer und Art der für den Wettbewerb verwendeten Timer und Displays.
          Bitte die Zeilen mit dem nicht verwendeten Equipment entsprechend
          entfernen.
        venue: >-
          Die oben genannten Punkte sind lediglich eine Empfehlung für einen vollständigen
          Report. Nutze diese nach eigenem Ermessen und entscheide, was für dich relevant
          ist. Bitte entferne nicht verwendete Abschnitte!
        organization: >-
          Die oben aufgeführten Punkte dienen nur als Orientierung für einen vollständigen
          Bericht. Nutze sie nach eigenem Ermessen so, wie es für dich passt. Bitte
          entferne nicht verwendete Abschnitte!
        incidents: >-
          Berichte über alle unüblichen Zwischenfälle. Nummeriere die Vorfälle
          beginnend bei 1., sodass andere Delegierte über diese Nummerierung
          darauf Bezug nehmen können. Selbst wenn Zwischenfälle generisch
          erscheinen, erwähne zumindest die wichtigsten Zwischenfälle. Bitte
          kreuze die entsprechenden Boxen an, wenn du aktiv nach Feedback fragen
          möchtest.
        wrc_incidents: >-
          Liste von Referenznummern der Zwischenfälle, für die du das Feedback
          des WRC möchtest.
        remarks: >-
          Rede über alle anderen Details die Du gerne teilen möchtest (z.B.
          Verbesserung/Verschlechterung innerhalb der Gemeinschaft, zukünftige
          Pläne für diese Region). Alles was in den vorherigen Bereichen im
          Sinne der klaren und präzisen Ausdrucksweise ausgelassen wurde, kann
          hier erscheinen.
        summary: Die zuvor aufgeführten Punkte sind nur eine Richtlinie für 
          einen vollständigen Report. Nutze sie im eigenen Ermessen, je nachdem 
          was passt. Bitte entferne nicht verwendete Bausteine!
        setup_images: Du MUSST mindestens %{image_count} Bilder hinzufügen, die 
          die Scrambling- und Teilnehmer-Areale des aktuellen Wettbewerbs 
          zeigen, am besten während des laufenden Wettbewerbs (weitere Bilder 
          sind auch willkommen). Du kannst mehrere Dateien auf einmal auswählen.
          Du kannst nur dann Dateien löschen, wenn ausreichend andere Bilder 
          hochgeladen wurden (wenn Du ein Bild ersetzen möchtest, musst du erst 
          das neue hochladen und danach das alte löschen). Wenn du keine 
          aktuellen Bilder von den Teilnehmer- und/oder Scrambling-Arealen in 
          Benutzung vorliegen hast, erkläre bitte wieso.
        wic_incidents_html: Liste an Nummern, die sich auf Incidents beziehen, 
          für die Du Feedback vom WIC haben möchest. <br> 
          <strong>%{wic_incident_alert}</strong>
        wic_incident_alert: Falls der WIC-Incident vertraulich ist (zum Beispiel
          aber nicht nur im Falle von Verbrechen, Belästigung, Tätlichkeit, 
          etc.), bitte lasse ihn im Bericht aus und schreibe eine separate Mail 
          an das WIC. Für andere WIC-Incidents, nutze bitte eine bündige, 
          anonymisierte Formulierung des Incidents und melde dich privat beim 
          WIC um weitere Details hinzuzufügen. Das WIC wird trotzdem Feedback 
          auf anonymisierte Incidents geben, um allgemeine Aufmerksamkeit 
          sicherzustellen. Für alle WIC-Incidents in Zusammenhang mit einem WCA 
          Volunteer, bitte alle Details aus dem Report auslassen und das WIC 
          gesondert kontaktieren.
      competition_tab:
        name: 'Beispiele: Anreise, Zahlung, Preise/Auszeichnungen, Unterkunft'
      person:
      results_submission:
      regional_organization:
        website: Muss eine gültige http(s) Adresse sein. HTTPS ist empfohlen.
        logo: >-
          Muss im PNG-Format sein, in guter Auflösung und mit einem
          transparenten Hintergrund.
        email: Sollte eine Mailingliste mit allen Direktoren und Beauftragten 
