        ist veraltet und wird ab dem %{deprecation_date} nicht mehr unterstützt. Bitte
        wechsle vorher zu Version %{new_version}.'
      permalink_note: 'Hinweis: Permalinks liefern den neuesten Ergebnisexport innerhalb
        einer bestimmten Version – der v2-Permalink liefert also den neuesten v2-Export,
        bleibt aber auch dann bei v2, wenn v3 veröffentlicht wird.'
    developer_export:
