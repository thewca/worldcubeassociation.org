        werden vom WCA Board gewählt. Der Executive Director ist der 
        Geschäftsführer der WCA, der Chair leitet alle Sitzungen des WCA Board, 
        der Secretary verwaltet die Dokumente der Organisation und der Treasurer
        kümmert sich um die finanziellen Angelegenheiten der WCA.
      board_description: Das WCA Board ist für die Leitung der gesamten 
        Organisation und die Erfüllung aller Aufgaben verantwortlich, die nicht 
        von anderen Teams und Komitees übernommen werden
    teams_committees_councils:
      title: WCA-Teams und -Komitees
      description: Die Teams und Komitees der WCA sind ein wesentlicher 
        Bestandteil der Organisation und erledigen die täglichen Aufgaben, die 
        für ihren Betrieb erforderlich sind. Diese Komitees bestehen aus 
        Mitgliedern der WCA-Community, darunter WCA-Delegierte und Teilnehmende.
        Jedes Team hat eine Leitung, deren Aufgabe es ist, das ordnungsgemäße 
        Funktionieren des Teams sicherzustellen und die anderen Teammitglieder 
        anzuleiten. Wenn es offene Stellen in Teams oder Komitees gibt, werden 
        Informationen zur Bewerbung auf der Startseite veröffentlicht.
      contact_button: Kontakt
      no_contact_description: Die Kontaktdaten dieses Teams oder Komitees sind 
        nicht öffentlich zugänglich.
      empty: Keine Teams oder Komitees gefunden. Bitte schau später noch einmal 
        vorbei.
      groups_name:
        wat: WCA Archive Team
        wct: WCA Communication Team
        wcat: WCA Competition Announcement Team
        wic: WCA Integrity Committee
        weat: WCA Executive Assistants Team
        wfc: WCA Financial Committee
        wmt: WCA Marketing Team
        wmct: WCA Major Championship Team
        wqac: WCA Quality Assurance Committee
        wrc: WCA Regulations Committee
        wrt: WCA Results Team
        wst: WCA Software Team
        wsot: WCA Sports Organization Team
        wapc: WCA Appeals Committee
      groups_description:
        wat: Das WCA Archive Team (WAT) ist für den Aufbau und die Pflege des 
          historischen Archivs der WCA zuständig. Es dokumentiert wichtige 
          Ereignisse im Speedcubing und bedeutende Meilensteine der WCA, die als
          Teil einer umfassenderen WCA-Zeitleiste präsentiert werden sollen, um 
          das Vermächtnis der WCA im Speedcubing zu bewahren.
        wct: Das WCA Communication Team (WCT) beaufsichtigt und unterstützt die 
          Kommunikation der WCA mit der Community und der allgemeinen 
          Öffentlichkeit. Die Kommunikation der WCA soll zu den Zielen der WCA 
          beitragen und eine insgesamt positive Kultur der Freundlichkeit, 
          Transparenz, Inklusion, Offenheit und Reaktionsbereitschaft fördern.
        wcat: Das WCA Competition Announcement Team (WCAT) genehmigt die von 
          WCA-Delegierten eingereichten WCA-Wettbewerbe, kündigt sie an und 
          stellt sicher, dass diese Ankündigungen den Qualitätsstandards der WCA
          entsprechen. Dieses Team ist außerdem dafür verantwortlich, dass das 
          in Dokumenten wie der WCA-Richtlinie zu Wettbewerbsanforderungen 
          festgelegte Verfahren zur Einreichung von Wettbewerben ordnungsgemäß 
          eingehalten wird. Das WCAT ist NICHT für die Organisation einzelner 
          Wettbewerbe oder deren Betreuung durch WCA-Delegierte verantwortlich.
        wic: Das WCA Integrity Committee (WIC) führt unabhängige Untersuchungen 
          zu Mitgliedern der WCA-Community und zu Zwischenfällen bei 
          WCA-Wettbewerben oder auf offiziellen Online-Plattformen der WCA 
          durch. Bei diesen Zwischenfällen handelt es sich um mutmaßliche 
          Verstöße gegen die Werte, den Verhaltenskodex, den Ethikkodex und/oder
          die Regeln der WCA.
        weat: Das WCA Executive Assistants Team (WEAT) übernimmt die 
          Verwaltungsaufgaben des WCA-Vorstands.
        wfc: Das WCA Financial Committee (WFC) verwaltet die gesamten Finanzen 
          der WCA, einschließlich Budgetplanung, Berichterstattung, Analyse, 
          Buchführung und Steuererklärungen. Es verwaltet außerdem die größte 
          Einnahmequelle der WCA, das WCA-Beitragssystem, sowie verschiedene 
          Förderprogramme, die lokale Gemeinschaften in unterschiedlichen 
          Entwicklungsstadien unterstützen. Dazu gehören Reisekostenförderung, 
          Ausstattungsförderung und die Unterstützung regionaler Organisationen.
        wmt: Das WCA Marketing Team (WMT) betreut die Marke WCA, sucht Sponsoren
          und vermarktet WCA-Merchandise.
        wmct: Das WCA Major Championship Team (WMCT) betreut die Koordination 
          und Weiterentwicklung der WCA-Kontinental- und Weltmeisterschaften, 
          indem es Richtlinien und strategische Pläne entwickelt, die Auswahl 
          der Austragungsorte verwaltet, Organisationsteams unterstützt und ein 
          einheitliches Meisterschaftserlebnis gewährleistet.
        wqac: Das WCA Quality Assurance Committee (WQAC) fördert die 
          kontinuierliche Qualitätsverbesserung innerhalb der WCA sowie die 
          weltweite Anwendung von Qualitätsstandards, um eine gleichbleibend 
          hohe Qualität der Prozesse, der Ehrenamtlichen der WCA, der regionalen
          Organisationen, der Turnierorganisatoren und der Turnierhelfer 
          sicherzustellen.
        wrc: Das WCA Regulations Committee (WRC) befasst sich mit allen Fragen 
          zur Anwendung, Verbesserung und Weiterentwicklung der WCA-Regeln. Es 
          unterstützt WCA-Delegierte bei sämtlichen Verfahrensfragen, die bei 
          Wettbewerben auftreten, und entscheidet über ungeklärte sowie nicht 
          durch die Regeln abgedeckte Zwischenfälle.
        wrt: Das WCA Results Team (WRT) verwaltet sämtliche Daten in den 
          Datenbanken der WCA, einschließlich Wettbewerbsergebnissen und 
          Personendaten.
        wst: Das WCA Software Team (WST) verwaltet die Software der WCA 
          (Website, Scramble-Generatoren, Arbeitsmappen, Verwaltungswerkzeuge).
        wsot: Das WCA Sports Organization Team (WSOT) betreut und unterstützt 
          die Anerkennung der WCA als internationale Sportorganisation.
        wapc: Das WCA Appeals Committee (WAC) prüft Einsprüche gegen 
          Entscheidungen anderer Ehrenamtlicher der WCA und entscheidet darüber.
          Das WAC bietet ein unabhängiges und unparteiisches Prüfverfahren, um 
          sicherzustellen, dass Entscheidungen fair und angemessen sind und den 
          Richtlinien und Regeln der WCA entsprechen.
