    hints:
      incident:
        title: >-
          Beachte dass dies öffentlich ist und es in Englisch ausgefüllt werden
          sollte.
        private_description: >-
          Eine Beschreibung des Incidents, welche nur von Delegates gesehen
          werden kann. Bitte in Englisch ausfüllen.
        private_wrc_decision: >-
          Die finale Entscheidung der WRC inklusive privater Details. Bitte in
          Englisch ausfüllen.
        public_summary: >-
          Eine Gesamtbeschreibung des Incidents und der Entscheidung, die
          öffentlich angezeigt wird. Bitte in Englisch ausfüllen.
      user:
        dob: >-
          Trage das Geburtsdatum des Teilnehmers / der Teilnehmerin im Format
          JJJJ-MM-TT ein.
        name: >-
          Trage den vollen Namen des Teilnehmers / der Teilnehmerin sorgfältig
          ein, zum Beispiel <strong>Stefan Pochmann</strong>. Nicht unachtsam
          wie etwa <strong>s pochman</strong>. Zweite Vornamen (entweder ganz
          oder als Initial) sind optional.
        pending_avatar: >-
          Nachdem Du ein neues Profilbild hochgeladen hast, muss dieses erst vom
          WCA Results Team bestätigt werden.
        registration_notifications_enabled: >-
          Dies gilt nur für Wettbewerbe, die du organisierst oder delegierst,
          und kann pro Wettbewerb überschrieben werden.
        receive_delegate_reports: >-
          Wenn du ein Trainee Delegate, Junior Delegate, Senior Delegate oder
          ein Mitglied des WRC oder des WQAC bist, erhältst du standardmässig
          Delegate Reports. Achtung: die Aktivierung der Änderung kann bis zu
          einer Stunde dauern.
        otp_attempt: >-
          Überprüfe deine konfigurierte mobile Applikation für ein
          Einmal-Passwort oder gebe einen deiner Wiederherstellungs-Codes ein.
      competition:
        name: >-
          Der volle Name eines Wettbewerbs, inklusive Jahreszahl am Ende (z.B.
          Danish Open 2016). Achte auf Großschreibung. Der Name darf nur
          alphanumerische Zeichen, Bindestriche(-), Und-Zeichen(&), Punkte(.),
          Doppelpunkte(:), Apostrophe(') und Leerzeichen( ) enthalten.
        cell_name: >-
          Ein Kurzname zum Anzeigen. Falls der Name des Wettbewerbs weniger als
          %{short_name_limit} Zeichen hat, sollte dies nicht editiert werden und
          sollte mit dem normalen Namen übereinstimmen.
        city_name: >-
          Name der Stadt und des Verwaltungsbezirks (wenn möglich) in dem der
          Wettbewerb stattfindet. Lasse hierbei das Land aus (z.B. Paris ODER
          San Francisco, Kalifornien).
        information: >-
          Wichtige Informationen, die Teilnehmer wissen sollten. Sie werden auf
          der Hauptseite des Wettbewerbs angezeigt. <br/>Bitte fülle diese in
          <b>Englisch</b> und in jeder anderen Sprache, die die Teilnehmer
          sprechen, aus.
        staff_delegate_ids: WCA-Delegierte des Wettbewerbs
        trainee_delegate_ids: WCA Trainee Delegate für diesen Wettbewerb.
        organizer_ids: Organisatoren (Account zum Eintragen benötigt).
        external_website: Die Website des Wettbewerbs. Muss als gültige 
          http(s)-URL vorliegen.
        registration_open: 'Anmerkung: Anmeldebeginn und -schluss sind in UTC anzugeben'
        remarks: >-
          Zusätzliche Informationen, die du zum WCAT weitergeben willst. Zum
          Beispiel ob es Unklarheiten gibt oder ob es spezielle Anfragen an das
          WCAT gibt. Bitte fülle dies in Englisch aus!
        external_registration_page: >-
          Die Seite, auf der Teilnehmer sich für die Competition anmelden
          können. Dies muss eine gültige http(s) Adresse sein.
        base_entry_fee_lowest_denomination: >-
          Eintrittsgebühr für den Wettbewerb. Die Eintrittsgebühr wird auf der
          Infoseite des Wettbewerbs, sowie der Anmeldeseite (falls genutzt)
          angezeigt. Wenn diese auf 0 gesetzt wird, wird ein Hinweis angezeigt,
          dass der Eintritt frei ist.<br><br><b>DISCLAIMER: Die folgende Angabe
          der WCA-Gebühren ist ausschließlich eine Schätzung auf Basis der
          aktuellen Umrechnungsraten und in keinster Weise rechtlich verbindlich
          für die Zahlung der Gebühren.</b>
        currency_code: Der Währungscode für Eintrittsgebühren.
        competitor_limit_enabled: >-
          Auch wenn die Regeln nicht vorgeben, dass ein Teilnehmerlimit gesetzt
          werden muss, ist es sehr empfohlen dies zu tun.
        competitor_limit: >-
          Die Anzahl der Teilnehmer, die für diesen Wettbewerb zugelassen
          werden. Aktuell dient dieser Hinweis nur zur Information und
          verhindert nicht, dass sich weitere Personen registrieren. Wir
          arbeiten an einer expliziten Unterstützung des Anmeldeprozesses.
        competitor_limit_reason: >-
          Was ist der Grund für das Teilnehmerlimit? Bitte fülle dieses Feld in
          Englisch aus.
        guests_per_registration_limit: >-
          Die Anzahl erlaubter Gäste pro Anmeldung bei dieser Competition. Eine
          Anmeldung mit zu vielen Gästen wird blockiert. Lasse dies frei, wenn
          es keine Begrenzung gibt.
        events_per_registration_limit: >-
          Lege wahlweise fest, für wie viele Events sich ein Teilnehmer
          insgesamt anmelden darf (wird häufig für "Favorites" competitions
          verwendet). Du solltest vor Nutzung dieses Feldes Events hinzufügen.
          Anmeldungen mit zu vielen Events werden blockiert. Lasse dies frei,
          wenn es kein Limit gibt.
        extra_registration_requirements: >-
          Bitte führe hier zusätzliche Registrierungsbedingungen auf, die oben
          nicht genannt wurden, z.B. Zahlungsmöglichkeiten.<br/> Bitte fülle
          diese <b>auf Englisch</b> und in jeder anderen Sprache, die die
          Teilnehmer sprechen, aus. Dies wird auf der Seite des Wettbewerbs und
          auf der Registrierungsseite angezeigt.
        on_the_spot_entry_fee_lowest_denomination: >-
          Wenn dies auf 0 gesetzt wird, wird ein Satz angezeigt dass
          Vor-Ort-Registrierung kostenlos möglich ist.
        refund_policy_percent: >-
          Aktuell dient diese Angabe nur zur Information und Rückerstattungen
          müssen manuell veranlasst werden. Wenn dies auf 0 gesetzt wird, wird
          ein Hinweis angezeigt, dass Eintrittsgebühren unter keinen Bedingungen
          erstattet werden.
        refund_policy_limit_date: 'Datum, nachdem keine Rückerstattungen mehr erfolgen'
        waiting_list_deadline_date: >-
          Der Zeitpunkt, ab welchem Personen auf der Warteliste nicht mehr
          akzeptiert werden. Wenn du eine Deadline für Rückerstattungen
          angegeben hast, sollte die Deadline für das Akzeptieren der Teilnahme
          nicht vor der Deadline für Rückerstattungen liegen.
        event_change_deadline_date: >-
          Angemeldete Teilnehmer dürfen bis zu diesem Zeitpunkt ihre gewählten
          Events verändern, indem sie die Organisatoren kontaktieren. Der
          Zeitpunkt für diese Deadline darf nicht vor der Schließung der
          Anmeldung liegen. Wird dieses Feld freigelassen, dürfen Teilnehmer
          Events bis zum Stattfinden des jeweiligen Events hinzufügen. Wenn du
          vor-Ort-Registrierungen zulässt, muss dieser Zeitpunkt auf den selben
          Tag wie die Competition gelegt werden.
        guests_entry_fee_lowest_denomination: >-
          Aktuell dient diese Angabe nur zur Information, da Eintrittsgebühren
          für Gäste nicht über die Webseite verwaltet werden können. Wenn dies
          auf 0 gesetzt wird, wird ein im Folgenden auswählbarer Satz bezüglich
          der Registrierung für Gäste angezeigt.
        early_puzzle_submission_reason: >-
          Bitte führe aus, warum du möchtest, dass Teilnehmer ihre Puzzle früher
          abgeben. Fülle dies in Englisch aus!
        qualification_results_reason: >-
          Bitte erläutere hier, warum du Qualifikationszeiten nutzen möchtest.
          Fülle dies in Englisch aus!
        event_restrictions_reason: >-
          Bitte erläutere hier, warum du die Anmeldung bestimmter
          Eventkombinationen verbieten willst. Bitte fülle dies in Englisch aus!
        main_event_id: Der Gewinner dieses Events ist der Gewinner der 
          Competition.
        championships:
      website_contact:
      dob_contact:
        dob: Dein korrektes Geburtsdatum im Format YYYY-MM-DD (Jahr - Monat - 
          Tag)
        document: >-
          Um deine Identität und dein korrektes Geburtsdatum nachzuweisen, musst
          du ein Bild eines Ausweisdokumentes anhängen. Dies kann ein Ausweis,
          ein Führerschein, ein Schülerausweis oder ähnliches sein, auf dem dein
          Name und dein Geburtsdatum klar ersichtlich und für einen
          Englischsprachler verständlich ist (oder kontaktiere deinen lokalen
          WCA Delegate, falls du ein solches Dokument nicht besitzt). Zur
          Identifizierung benötigen wir mindestens deinen Namen und dein
          Geburtsdatum. Zögere nicht, weitere persönliche Angaben im Dokument
          unkenntlich zu machen.
      post:
        body: >-
          Benutze den &lt;!-- break --&gt;-Tag um eine Vorschau auf der Homepage
          anzuzeigen. Jeder Post auf der Website wird sämtlichen Text vor diesen
          Tag anzeigen. Der tatsächliche Post umfasst dann den vollen Inhalt.
        show_on_homepage: >-
          Achtung! Dies ist nicht sicher für vertrauliche Informationen. Es
          verhindert nur die Anzeige auf der Homepage. Beiträge, die nicht auf
          der Webseite angezeigt werden, sind über den Link und die Tags
          öffentlich abrufbar.
      delegate_report:
        schedule_url: >-
          Vollständiger Link zum öffentlichen Zeitplan (z.B.
          https://www.cubingusa.com/usnationals2016/schedule.php)
        equipment: >-
          Nummer und Art der für den Wettbewerb verwendeten Timer und Displays.
          Bitte die Zeilen mit dem nicht verwendeten Equipment entsprechend
          entfernen.
        venue: >-
          Die oben genannten Punkte sind lediglich eine Empfehlung für einen
          vollständigen Report. Nutze diese nach eigenem Ermessen und
          entscheide, was für dich relevant ist. Bitte entferne nicht verwendete
          Abschnitte.
        organization: >-
          Berichte über das Organisationsteam und darüber, wie sie den
          Wettbewerb bewältigt haben, ob und wie Du dabei involviert warst,
          deren Vorerfahrung und ob Du Fortschritte feststellen konntest, ob sie
          sich den Tag über professionell und aktiv verhalten haben, über
          Probleme, die auftraten (z.B. hinter den Zeitplan zurückzufallen) und
          wie sie gelöst wurden... Bitte kurz und bündig schreiben und keine
          unnötigen Details berichten.
        incidents: >-
          Berichte über alle unüblichen Zwischenfälle. Nummeriere die Vorfälle
          beginnend bei 1., sodass andere Delegierte über diese Nummerierung
          darauf Bezug nehmen können. Selbst wenn Zwischenfälle generisch
          erscheinen, erwähne zumindest die wichtigsten Zwischenfälle. Bitte
          kreuze die entsprechenden Boxen an, wenn du aktiv nach Feedback fragen
          möchtest.
        wrc_incidents: >-
          Liste von Referenznummern der Zwischenfälle, für die du das Feedback
          des WRC möchtest.
        wdc_incidents: >-
          Liste der Referenznummern von Zwischenfällen, für die du das Feedback
          des WDC möchtest.
        remarks: >-
          Rede über alle anderen Details die Du gerne teilen möchtest (z.B.
          Verbesserung/Verschlechterung innerhalb der Gemeinschaft, zukünftige
          Pläne für diese Region). Alles was in den vorherigen Bereichen im
          Sinne der klaren und präzisen Ausdrucksweise ausgelassen wurde, kann
          hier erscheinen.
      competition_tab:
        name: 'Beispiele: Anreise, Zahlung, Preise/Auszeichnungen, Unterkunft'
      person:
      registration:
        administrative_notes: >-
          Zusätzliche Anmerkungen zur Verwaltung dieser Anmeldung. Diese können
          vom Teilnehmer nicht eingesehen werden.
      results_submission:
      regional_organization:
        website: Muss eine gültige http(s) Adresse sein. HTTPS ist empfohlen.
        logo: >-
          Muss im PNG-Format sein, in guter Auflösung und mit einem
          transparenten Hintergrund.
        email: Sollte eine Mailingliste mit allen Direktoren und Beauftragten 
          sein.
        bylaws: Muss im PDF-Format sein.
        extra_file: >-
          Muss im PDF-Format sein. Falls du mehrere Dateien hinzufügen willst,
          fasse diese bitte zu einer zusammen.
