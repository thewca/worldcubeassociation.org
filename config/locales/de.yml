    manage_oauth_html: 'Gehe zu %{oauth_link}, um deine OAuth Anwendungen zu verwalten'
    token_request_intro: >-
      Hier ist ein Beispiel, welches curl verwendet, um ein Access-Token
      mithilfe von Application ID, Client Secret, deiner WCA E-Mail, und deinem
      Passwort zu erhalten:
    user_email_placeholder: DEINE_EMAIL
    user_password_placeholder: DEIN_PASSWORT
    user_info_request_intro: >-
      Ein OAuth Access Token kann verwendet werden, bis es ungültig wird, um
      authorisierte API Requests zu machen. Beispielsweise, um auf Informationen
      zu deinen Account zuzugreifen:
    legal_tnoodle_api_header: Zugelassene TNoodle-Version
    login_message: Bitte anmelden
  merch:
    title: WCA Merchandise
    paragraphs:
      '1': >-
        Die WCA bietet exklusive Merchandise-Artikel zum Kauf an! Von T-Shirts,
        Hoodies, Aufklebern, Stackmats, Rucksäcken und mehr! Unsere Designs
        werden ständig aktualisiert, darunter das klassische WCA-Logo,
        offizielles World Championship-Merchandise und World Record-Designs.
      '2': >-
        Der Kauf von WCA Merchandise in unseren Geschäften ist eine der besten
        Möglichkeiten, die WCA - eine ehrenamtlich geführte
        Non-Profit-Organisation - zu unterstützen. Wir verwenden alle Gewinne
        aus den Artikeln, um Meisterschaften, Ausrüstung und andere WCA-bezogene
        Aktivitäten zu finanzieren.
      '3': >-
        Du kannst unsere Waren auf der ganzen Welt kaufen -- mit direkten
        Geschäften in Europa, Amerika und Indien und weiteren, die bald folgen
        werden!
  database:
    results_export:
      heading: WCA Results-Export
      description: >-
        Auf dieser Seite bieten wir die WCA Ergebnisse zum Download in
        verschiedenen Formaten an, sodass du diese im Ganzen nutzen /
        analysieren kannst. Wir aktualisieren dies normalerweise nach jedem
        Competition-Wochenende wenn die Ergebnisse bereitgestellt werden. Die
        Dateien sind durchnummeriert und datiert, so kannst du prüfen, ob du die
        neueste Version bereits hast.
      permalink: Permalink
      file_formats:
        sql: 'SQL Befehle, zum Import in SQL-Datenbanken.'
        tsv: >-
          Tabulator-getrennte Werte, für Tabellenkalkulation in OpenOffice.org,
          Excel, etc.
      hint_readme_html: >-
        Die enthaltene %{readme_filename} Datei beinhaltet die
        Nutzungsbedingungen und eine allgemeine Beschreibung (in Englisch, nicht
        übersetzt).
    developer_export:
      heading: WST Entwickler-Export
      description_html: >-
        Auf dieser Seite stellen wir den WST Entwickler-Export zum Download als
        SQL dump bereit. Details sind auf %{github_link} zu finden.
      download: Download
