  homepage:
    learn_more: Erfahre mehr
    title: Willkommen bei der World Cube Association
    latest_news: Neueste Nachrichten
    announcements: Ankündigungen
    see_all_announcements: Schaue dir alle Ankündigungen an
    about_us:
      title: Über uns
      text: >-
        Die World Cube Association verwaltet Wettbewerbe in mechanischen
        Puzzlen, die sich durch das Drehen von Gruppen von Teilen auszeichnen.
        Diese werden auch "Twisty Puzzles" oder "Drehpuzzle" genannt.
    competitions:
      title: Wettbewerbe
      text_html: >-
        Finde heraus, welche Wettbewerbe es in deiner Nähe gibt oder schau dir
        Ergebnisse an. Falls du aktuell bei einem Wettbewerb bist und deine
        Ergebnisse sehen willst, schau auf %{wca_live_link} nach.
    merchandise:
      title: Merchandise
      ad_new: Neu
      text_html: >-
        Schaue dir unser kürzlich veröffentlichtes, offizielles Merchandise an,
        welches eine Auswahl an Kleidungsstücken wie z.B. T-Shirts oder Hoodies
        enthält.
      link_title: Link zum Shop
    records:
      title: Rekorde
      text: >-
        Schau dir aktuelle und historische Rekorde aller offiziellen WCA
        Disziplinen an.
    faq:
      title: FAQ
      text: >-
        Wirf einen Blick auf die FAQ wenn du Hilfe benötigst. Viele Fragen, die
        du hast, werden dort vielleicht schon beantwortet.
    contact:
      title: Kontakt
      text_html: >-
        Falls du uns gerne kontaktieren willst, kannst du dies über das
        Kontaktformular tun. Falls du Fragen zu einzelnen Abläufen und Verfahren
        der WCA hast, schau zunächst in unsere %{faq_link}.
      faq: Häufig gestellte Fragen
      button: Bring mich zum WCA Kontakt Formular
    support:
      title: Unterstütze die WCA
      text: >-
        Die World Cube Association ist eine 501(c)(3) steuerbefreite
        Organisation. Als eine zu 100 % von Freiwilligen geleitete
        Non-Profit-Organisation freuen wir uns über Spenden, die uns dabei
        helfen, unsere Vision von mehr unterhaltsamen Wettbewerben auf der
        ganzen Welt zu verwirklichen.
      button: 'Erfahre mehr darüber, wie du die WCA unterstützen kannst'
