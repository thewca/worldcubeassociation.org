            Tiu ŝaltos butonon "Aŭtomate akcepti amase" en la registriĝ-menuo.
            Per tio oni akceptos ĉiujn en la atendolisto kaj pritraktota listo
            ĝis la limo de konkursantoj, aŭ la limo difinitaj sube. Uzu tion je
            propra risko.
          auto_accept_disable_threshold: >-
            Kiam tiu nombro de akceptitaj registriĝoj estas atingita, aŭtomata
            akcepto malŝaltos per si mem, t.e. lasi organizantojn permane
            akcepti la lastajn registriĝojn. Devas esti malpli ol la limo de
            konkursantoj. Lasu malplena se vi ne bezonas tion.
