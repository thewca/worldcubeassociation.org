          currency_code: La valuto uzata por la kostoj.
          base_entry_fee: >-
            La baza registriĝkosto por la konkurso. Se uzata, ĝi videblos en la
            paĝo pri konkursinformado kaj en la registriĝpaĝo. Se vi indikas
            "0", aperos frazo por diri ke registriĝi estas senpaga.
            <br><br><b>Malgarantio: La sekva takso de WCA-Kotizoj estas nur
            proksimigo bazita sur aktualaj kurzoj kaj neniel estas leĝe deviga
            por la pago de Kotizoj.</b>
          on_the_spot_entry_fee: >-
            Se vi enigas 0, videblos frazo dirante ke surlokaj registriĝoj estas
            senpagaj.
          guest_entry_fee: >-
            Nuntempe, tiu nombro estas nur sciiga ĉar pagoj de akompanantoj ne
            povas esti faritaj per tiu retejo. Se vi enigas 0, vi povos elekti
            frazon pri kiel vi traktos spektantojn.
          refund_policy_percent: >-
            Nun, tiu nombro estas nur sciiga, repagoj devos esti farita permane.
            Se vi enigas 0, videblos frazo dirante ke registriĝkostoj nenial
            estos repagotaj.
          refund_policy_limit_date: Dato post kiam ne plu eblos repagoj.
        registration:
          opening_date_time: >-
            Noto: Horoj de komenco kaj fino de registriĝperiodo estas indikitaj
            laŭ UTC
          waiting_list_deadline_date: >-
            La dato post kiam oni ne plu akceptos registriĝoj de la atendolisto.
            Se vi havas limdaton por repagoj, la limdato por esti akceptata ne
            povas esti antaŭ la limdato por repagoj.
          event_change_deadline_date: >-
            Registritaj konkursantoj povas ĝisdatigi iliajn konkurserojn ĝis tiu
            tempo kontaktante la organizanta teamo. Tiu limdato ne povas esti
            antaŭ la limdato por registriĝi. Se vi ne plenumas tiun kampon, tio
            signifas ke konkursantoj povas aldoni konkurseron ĝis kiam tiu
            konkursero okazas. Se vi havas surlokajn registriĝojn, vi devas
            enigi la tagon de la konkurso.
          guests_per_registration: >-
            La nombro da gastoj permesitaj per registriĝo ĉe ĉi tiu konkurso.
            Registriĝo kun tro da gastoj estos blokita. Lasu tion malplena se ne
            estas limo.
          extra_requirements: >-
            Bonvolu indiki tie iajn pliajn registriĝajn postulojn kiuj ne estis
            menciitaj supre, ekzemple ekspliko pri kiel pagi. <br/>Bonvolu
            plenigi tion <b>en la angla</b> kaj iaj aliaj lingvoj parolataj de
            viaj konkursontoj; tio aperos ĉe la informa paĝo de la konkurso, kaj
            ankaŭ en la paĝo por registriĝi se vi uzas la registran sistemon de
            retejo de la WCA.
        event_restrictions:
          forbid_newcomers:
            reason: >-
              Bonvolu detali ĉi tie kial vi ne ŝatus ke novuloj registriĝu por
              via konkurenco. Bonvolu plenigi ĉi tion en la angla!
          early_puzzle_submission:
            reason: >-
              Bonvolu detali tie kial vi ŝatus devigi konkursantojn antaŭtempe
              submetiĝi puzloj. Bonvolu plenigi tion en la angla!
          qualification_results:
            reason: >-
              Bonvolu detali tie kial vi ŝatus uzi kvalifikajn rezultojn.
              Bonvolu plenigi tion en la angla!
          event_limitation:
            reason: >-
              Bonvolu detali tie kial vi ŝatus limigi specifajn kombinadojn de
              konkurseroj. Bonvolu plenigi tion en la angla!
            per_registration_limit: >-
              Laŭvole devigu la tutsumon de konkurseroj, pri kiuj konkursanto
              povas registriĝi (ofte uzata por "Favoritaj" konkursoj). Vi devus
              aldoni konkurserojn antaŭ ol uzi ĉi tiun kampon. Registriĝoj kun
              tro da konkurseroj estos blokitaj. Lasu tion malplena se ne estas
              limo.
          main_event_id: La venkinto de tiu konkursero estos la venkinto de la 
            konkurso.
        remarks: >-
          Iujn aldonajn informojn kiujn vi ŝatus komuniki al la WCAT. Ekzemple,
          se vi ne certas pri io aŭ se vi havas specifajn petojn por la WCAT.
          Bonvolu plenigi tion en la angla!
