      user:
        dob: Enigu la naskiĝdaton de la konkursanto kiel JJJJ-MM-TT
        name: >-
          Enigu la tutan nomon de konkursanto ĝuste, ekzemple <strong>Stefan
          Pochmann</strong>. Ne neglekteme kiel <strong>s pochman</strong> aŭ
          <strong>POCHMAN Stefan</strong>. Mezaj nomoj eblas (aŭ tute skribitaj
          aŭ per komencliteroj).
        pending_avatar: >-
          Kiam via nova profilbildo estas alŝutita, vi devas atendi la aprobon
          de la Rezulta Teamo de la WCA.
        registration_notifications_enabled: >-
          Ĉi tio validas nur por konkursoj, kiujn vi organizas aŭ delegas, kaj
          povas esti anstataŭita por specifaj konkursoj.
        receive_delegate_reports: >-
          Se vi estas Ĉefa Delegito aŭ Membro de la WRC aŭ WQAC, vi defaŭlte
          ricevas Delegitraportojn. Noto: la ŝanĝo povas preni ĝis unu horo
          antaŭ ol esti efektiva.
        delegate_reports_region: >-
          Se vi volas ricevi ĉiujn raportojn, lasu ĉi tiun kampon malplena (la
          falmenua opcio ĉe la supro). Noto: la efiko povas alveni ĝis unu horo
          post la ŝanĝo.
        otp_attempt: >-
          Kontrolu vian konfigurintan poŝtelefonan apon por unufoja pasvorto, aŭ
          enigu unu el viaj restaŭrkopiaj kodoj.
        receive_developer_mails: Ĉi tio nur koncernas sciigoj pri gravaj 
          versioŝanĝoj de risurcoj kiel datumeksportoj, WCIF-skemo kaj publikaj 
          API-oj. Ĝi estas rekomendata al programistoj prizorgantaj programaron,
          kiu dependas de ĉi tiuj iloj.
      dob_contact:
        dob: Via ĝusta naskiĝtago kiel JJJJ-MM-TT
        document: >-
          Por pruvi vian identecon kaj vian ĝustan naskiĝdaton, vi devas
          inkluzivigi bildon de io ajn leĝa dokumento (legitimilo,
          kondukpermesilo, studentkarto, pasporto, naskiĝakto, …) kie via nomo
          kaj naskiĝdato videblas kaj estas komprenebla por anglaparolanto (aŭ
          kontaktu vian lokalan WCA-Delegiton se vi ne havas tian dokumenton).
          La dokumento devas almenaŭ montri vian nomon kaj vian naskiĝdaton; vi
          povas malklarigi iajn aliajn personajn datumojn.
      post:
        body: >-
          Uzu la &lt;!-- break --&gt; markon por havi antaŭprezenton ĉe la
          hejmpaĝo. Ĉiuj afiŝoj en la hejmpaĝo montros ĉiujn tekstojn antaŭ tiu
          ĉi dividilo. La reala afiŝo montros la tutan korpon.
        show_on_homepage: >-
          Atentu! Tio ne estas sekura por privataj datumoj. Ties celo estas
          malebligi fuŝi la hejmpaĝon. Afiŝoj kiuj ne estas montritaj ĉe la
          hejmpaĝo ankoraŭ publike alireblas per konstanta ligilo aŭ etikedoj.
      delegate_report:
        schedule_url: >-
          Kompleta ligilo al la eldonita horplano (ekz.,
          https://www.cubingusa.com/usnationals2016/schedule.php)
        equipment: >-
          Nombro kaj tipo de la tempomezuriloj kaj tempomontriloj uzitaj dum la
          konkurso. Bonvolu forigi la ekipaĵajn liniojn kiujn vi ne uzis.
        summary: >-
          La supre listigitaj punktoj estas nur gvido por kompleta raporto. Uzu
          ilin laŭvole por tio, kion vi opinias taŭga. Bonvolu forigi neuzatajn
          partojn!
        venue: >-
          La listigitaj elementoj supre estas nur konsiloj por kompleta raporto.
          Uzu ilin laŭ via bontrovo. Bonvolu forigi neuzatajn partojn!
        organization: >-
          La listigitaj elementoj supre estas nur konsiloj por kompleta raporto.
          Uzu ilin laŭ via bontrovo. Bonvolu forigi neuzatajn partojn!
        incidents: >-
          Bonvolu raporti ĉiujn incidentojn kiujn vi konsideras nenormaj. Nombru
          la incidentojn ekde 1., por ke la aliaj Delegitoj povas komenti kun
          referenco al iliaj nombroj. Eĉ se ĉion ŝajnas laŭnorma, listigu
          almenaŭ la plej rimarkindaj. Bonvolu krucmarki la konvenajn
          elektobutonojn se vi aktive ŝatus ricevi opiniojn.
        setup_images: >-
          Bonvolu elekti almenaŭ %{image_count} bildojn, kiuj ilustras la
          konkursan aranĝon (miksareo, konkursareo, ktp). Vi povas elekti
          plurajn dosierojn samtempe. Vi povas forigi bildojn nur kiam sufiĉe da
          aliaj bildoj estas alŝutitaj (se vi volas anstataŭigi bildon, vi devas
          unue alŝuti la novan, kaj poste forigi la malnovan).
        wrc_incidents: >-
          Listo de la numeroj de la incidentoj por kiuj vi ŝatus ricevi opinion
          de la WRC.
        wic_incidents_html: >-
          Listo de la numeroj de la incidentoj por kiuj vi ŝatus ricevi opinion
          de la WIC. <br> <strong>%{wic_incident_alert}</strong>
        wic_incident_alert: >-
          Se la WIC-incidento estas tikla (inkluzive sed ne limigita al krimoj,
          ĝenado, perfortoj, ktp.), bonvolu ekskludi ĝin de via raporto kaj
          retpoŝti la WIC aparte. Por aliaj WIC-incidentoj, skribu mallonga,
          anonima versio de la incidento kaj detalu private kun la WIC. Tamen,
          la WIC ja prikomentos la anoniman version por sciigi la ĝeneralan
          publikon. Por ĉiuj WIC-incidentoj kiuj koncernas WCA-volontulon,
          bonvolu ekskludi ĉiujn detalojn de la raporto kaj kontaktu la WIC
          private.
        remarks: >-
          Parolu pri ajna alia detalo kiun vi ŝatus diskonigi (ekz.,
          plibonigo/malplibonigo ene de la komunumo, estontaj projektoj por tiu
          ĉi regiono). Se vi ne diris ion pro la volo esti konciza antaŭe, diru
          ĝin tie!
