  incidents_log:
    i18n_disclaimer: >-
      Atentu ke la sekcio pri incidentoj nur disponeblas en la angla, la enhavo
      malsupre ne estas tradukita.
    incident: 'Incidento:'
  about_regulations:
    title: Pri la Regularo
    panel1:
      title: Regularo
      content1_html: >-
        Ĉiuj konkursoj devas sekvi la <a href="/regulations/">Regularon de la
        WCA</a>. Gravas ke la konkursantoj legu tiujn regulojn antaŭ ol ĉeesti
        ilian unuan konkurson.
      content2_html: >-
        Gravaj decidoj pri incidentoj kiuj okazis dum konkursoj kaj kiuj la
        Regulara Komitato de la WCA (WRC) solvis troviĝas en la <a
        href="/incidents">Incidentaj protokoloj</a>.
    panel2:
      title: Tradukoj
      content1_html: >-
        La Regularo da la WCA ne disponeblas nur en la angla, membroj de la WCA
        ankaŭ tradukis ĝin en pluraj lingvoj: <a
        href="/regulations/translations/">Tradukoj</a>.
      content2_html: >-
        <strong>Grava</strong>: Kvankam la tradukoj estas ege helpemaj, ili ne
        estas oficialaj. Dum konkursoj, la angla versio de la Regularo de la WCA
        estas la sola vera versio.
    panel3:
      title: Plej Oftaj Demandoj pri Reguloj
      content1_html: >-
        La <a href="/faq">sekcio de Plej Oftaj Demandoj</a> respondas al kelkaj
        oftaj demandoj pri la Regularo de la WCA.
    panel4:
      title: Gvidlinioj por Organizantoj
      content1_html: >-
        Se organizi konkurson interesas vin aŭ se vi jam planis organizi unu,
        bonvolu legi niajn <a href="https://documents.worldcubeassociation.org/edudoc/organizer-handbook/organizer-handbook.pdf">Gvidliniojn
        por
        Organizantoj</a>.
      content2_html: >-
        Tiu dokumento enhavas gravajn informojn kaj ĉiuj organizantoj de
        konkursoj devas legi ĝin.
  regulations_translations:
    title: 'WCA-Regularo: Tradukoj'
    paragraph1: >-
      Se vi parolas lingvon kiun ne estas la angla, vi eble trovos tiujn
      tradukojn utilajn.
    paragraph2: >-
      Atentu ke kvankam la tradukoj disponeblas en la retejo de la WCA, ili ne
      estas oficialaj do ili garantias nenion. Se ekzistas diferenco inter
      traduko kaj la (nuna oficiala) angla versio, la angla versio devas esti
      uzata.
    translations: Tradukoj
    current: Nuntempa
    old: Malnova
    table_elements:
      version: Versio
      language: Lingvo
    translating: Traduki la Regularon
    paragraph3_html: >-
      Se aldoni aŭ ĝisdatigi tradukon interesas vin, bonvolu rigardi <a
      href="https://github.com/thewca/wca-regulations-translations#translation-instructions">la
      instrukciojn ĉe la Github deponejo por tradukoj</a>.
