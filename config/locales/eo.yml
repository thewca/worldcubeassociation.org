            Registriĝoj aŭtomate fermiĝos kiam tiu ĉi nombro de pagitaj
            registriĝoj estos ricevataj. Lasu malplenan por malebligi, ignoru se
            vi ne uzas integriĝajn pagojn.
          newcomer_month_reserved_spots: >-
            Nur permesita dum monato de novuloj - rezervitaj registriĝlokoj ne
            povas esti pli ol duono de la limo de konkursantoj.
