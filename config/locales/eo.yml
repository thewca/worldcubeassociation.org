          disabled: malŝaltita
          enable: Ŝalti 2FA
          disable: Malŝalti 2FA
          reset: Restarigi 2FA sekretŝlosilon
          reset_if_needed: >-
            Se unu el viaj aparatoj estis kompromitita aŭ se vi volas
            senvalidigi aliron de viaj aparatoj, vi povas senvalidigi vian
