          regenerate_backup_codes: >-
            Vi generis kelkajn restaŭrajn kodojn. Se vi jam uzis aŭ perdis tiujn
            kodojn, vi povas generi novajn per la malsupra butono. Atentu ke la
            ekzistantaj restaŭraj kontrolkodoj senvalidiĝos se vi faras tion.
          generate_backup_codes: Generi restaŭrajn kontrolkodojn
          backup_codes_warning: >-
            La restaŭraj kontrolkodoj aperos malsupre. Skribu aŭ konservu ilin
            tuj; ili estas savitaj ĉifritaj en nia datumbazo kaj ili ne povas
