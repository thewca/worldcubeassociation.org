          name: Dufaza Aŭtentigo (2FA)
          support_desc_html: >-
            La retejo de la WCA subtenas %{two_factor_link} uzante unufojan
            pasvorton.
          options:
            app: >-
              generita per dediĉita 2FA poŝtelefona apo (ekzemple Authy, Google
