      text: >-
        La World Cube Association regas konkursojn de mekanikaj puzloj kiuj
        estas manipulitaj per rotacioj de grupoj da pecoj, ofte konataj kiel
        "twisty puzzles".
    competitions:
      title: Konkursoj
      text_html: >-
        Trovu konkursojn apud vi aŭ rezultoj de konkursoj. Ĉu vi ĉeestas
        konkurson nuntempe kaj volas vidi ĝiajn rezultojn? Kontrolu
        %{wca_live_link}!
    merchandise:
      title: Butiko
      ad_new: Nova
      text_html: >-
        Iru al nia nova oficiala butiko kiu enhavas selekton da vestaĵoj kiel
        t-ĉemizoj kaj kapuĉpuloveroj.
      link_title: Ligilo al butiko
    records:
      title: Rekordoj
      text: >-
        Kontrolu la nunajn kaj estintajn rekordojn de ĉiuj oficialaj konkurseroj
        de la WCA.
    faq:
      title: Plej Oftaj Demandoj
      text: >-
        Legu nian liston de Plej Oftaj Demandoj se vi bezonas ian helpon. Multaj
        el viaj demandoj eble havas respondojn tie.
    contact:
      title: Kontakto
      text_html: >-
        Se vi bezonas kontakti nin, vi povas fari tion per nia kontaktformularo.
        Se vi havas demandon pri la procedoj de la WCA, bonvolu iri al niaj
        %{faq_link}!
      faq: Plej Oftaj Demandoj
      button: Montru min la kontaktformularo de la WCA
    support:
      title: Subteni la WCA
      text: >-
        La World Cube Association estas asocio 501(c)(3) registrita en Usono.
        Kiel cent-elcenta volontulo-gvidata senprofitcela organizo, ni
        bonvenigas viajn donacojn por helpi nin havi pli da konkursoj ĉirkaŭ la
        mondo.
      button: Lernu pli pri kiel vi povas subteni la WCA
    volunteer:
      title: Volontulo
      text: Partoprenu! La WCA havas volontulajn postenojn disponeblajn en 
        diversaj teamoj. Vi ne bezonas esti rapidkubanto por esti volontulo.
