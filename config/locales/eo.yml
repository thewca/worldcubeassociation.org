    user_password_placeholder: VIA_PASVORTO
    user_info_request_intro: >-
      OAuth-alirĵetono povas esti uzata, ĝis ĝi eksvalidiĝas, por fari
      aprobitajn API-petojn. Ekzemple, por aliri informojn pri via konto:
    legal_tnoodle_api_header: Laŭleĝa versio de TNoodle
    login_message: Bonvolu ensaluti
  merch:
    title: WCA-Varoj
    paragraphs:
      '1': >-
        La WCA havas ekskluzivajn aĉeteblajn varojn: t-ĉemizoj, kapuĉpuloveroj,
        glumarkoj, tapiŝetoj por tempomezuriloj, dorsosakoj kaj pli! Niaj
        dezajnoj estas konstante ĝisdatigitaj, inkluzivante la klasika
        WCA-logotipo, oficialaj Mondĉampionadaj varoj kaj dezajnoj pri Mondaj
        Rekordoj.
      '2': >-
        Aĉeti WCA Merch tra niaj butikoj estas unu el la plej bonaj manieroj por
        subteni la WCA, kiu estas senprofita kaj volontula organizaĵo. Ni uzas
        ĉiujn profitojn el la varoj por plu financi ĉampionadojn, ekipaĵojn kaj
        aliajn WCA-rilatajn agadojn.
      '3': >-
        Vi povas aĉeti niajn varojn tra la tuta mondo -- kun rektaj vendejoj en
        Eŭropo, Abjajalo (Ameriko) kaj Hindio kaj pliaj baldaŭ venos!
  database:
    results_export:
      heading: Eksporto de WCA-Rezultoj
      description: >-
        En ĉi tiu paĝo ni proponas elŝuteblajn WCA-rezultojn en pluraj formatoj,
        por ke vi povu uzi/analizi ilin ĝenerale. Ni kutime ĝisdatigos post ĉiu
        konkursa semajnfino kiam la rezultoj pretas. La dosieroj estas numeritaj
        kaj datitaj por ke vi povu vidi ĉu vi jam havas la plej novan version.
      permalink: fiksligilo
      file_formats:
        sql: 'SQL-instrukcioj, por importi en SQL-datumbazojn.'
        tsv: >-
          Tab-disigitaj valoroj, por kalkultabeloj en OpenOffice.org, Excel,
          ktp.
      hint_readme_html: >-
        La inkludita %{readme_filename} dosiero enhavas la uzkondiĉojn kaj
        ĝeneralan priskribon (en la angla, ne tradukita):
    developer_export:
      heading: WST Eksporto por programistoj
      description_html: >-
        Sur ĉi tiu paĝo vi povas elŝuti la eksporton por programistoj de la WST
        kiel SQL-dump. Detaloj troveblas ĉe %{github_link}.
      download: Elŝuti
  validators:
    persons:
      dob_is_jan_one_warning: >-
        La naskiĝdato de %{name} estas la 1-a de Januaro. Bonvolu certigi ke tiu
        ĝustas.
      dob_is_too_young_warning: >-
        Ŝajnas ke %{name} estas malpli ol 3-jara. Bonvolu certigi ke etio
        ĝustas.
      dob_is_too_old_warning: >-
        Ŝajnas ke %{name} estas pli-malpli 100-jara. Bonvolu certigi ke tio
        ĝustas.
      person_doesnt_have_any_results_error: >-
        Ne estas iu ajn rezulto por %{person_name} kun la person-identigilo
        %{person_id}
      results_not_associated_with_any_person_error: 'Estas rezultoj por nekonata persono
        kun person-identigilo %{person_id}'
      whitespace_in_name_error: >-
        La persono '%{name}' havas antaŭirajn/vostajn spacetojn aŭ dublajn
        spacetojn.
      person_with_non_existing_wca_id_error: 'La persono %{name} havas WCA-IDn kiu
        ne ekzistas: %{wca_id}.'
      no_space_before_parenthesis_error: 'Ronda ekkrampo en ''%{name}'' devas havi
        spaceton antaŭe.'
      same_person_name_warning: >-
        Estas jam almenaŭ unu persono kun la nomo '%{name}' en la WCA-datumbazo
        (%{wca_ids}). Bonvolu certigi ke via '%{name}' estas malsama homo. Se
        ne, bonvolu atribui la ĝustan WCA-IDn al la uzanto-konto kaj regeneri la
        JSON-rezultojn.
      non_matching_dob_warning: >-
        La naskiĝtago '%{dob}' provizita por %{name} (%{wca_id}) ne kongruas kun
        la aktuala rikordo en la WCA-datumbazo ('%{expected_dob}'). Se ĉi tio
        estas eraro, riparu ĝin. Alie lasu komenton al la WRT pri ĝi.
      non_matching_gender_warning: >-
        La genro '%{gender}' provizita por %{name} (%{wca_id}) ne kongruas kun
        la aktuala rikordo en la WCA-datumbazo ('%{expected_gender}'). Se ĉi tio
        estas eraro, riparu ĝin. Alie lasu komenton al la WRT pri ĝi.
      empty_gender_warning: >-
        La genro de la nova konkursanto %{name} estas malplena. La validaj
        genraj opcioj estas 'ina', 'iĉa' kaj 'alia'. Bonvolu lasi komenton al la
        WRT pri ĝi.
      non_matching_name_warning: >-
        La nomo '%{name}' provizita por %{wca_id} ne kongruas kun la aktuala
        rikordo en la WCA-datumbazo ('%{expected_name}')
      non_matching_country_warning: >-
        La lando '%{country}' provizita por %{name} (%{wca_id}) ne kongruas kun
        la aktuala rikordo en la WCA-datumbazo ('%{expected_country}'). Se ĉi
        tio estas eraro, riparu ĝin. Alie lasu komenton al la WRT pri ĝi.
      multiple_newcomers_with_same_name_warning: >-
        Estas multaj novaj konkursantoj kun ekzakte la sama nomo: %{name}.
        Bonvolu certigi ke ĉiuj rezultoj estas ĝustaj por ĉi tiuj konkursantoj
        kaj ke ĉiuj rezultoj estas ĝuste apartigitaj laŭ iliaj koncernaj IDj.
      wrong_parenthesis_type_error: >-
        La krampo uzata en '%{name}' estas nevalida signo, bonvolu anstataŭigi
        ĝin per ronda krampo '(' aŭ ')' kaj kun konvenaj spacoj.
      successive_uppercase_name_warning: >-
        '%{name}' havas intersekvaj majuskloj en sia nomo. Bonvolu konfirmi ke
        tio ja estas la ĝusta literumado aŭ ĝustigu la nomon.
      lowercase_name_warning: >-
        '%{name}' havas minusklan nomon. Bonvolu konfirmi ke tio ja estas la
        ĝusta literumado aŭ ĝustigu la nomon.
      missing_period_in_single_letter_middle_name_warning: >-
        '%{name}' havas unuliteran mezan nomon sen mallongiga punkto. Bonvolu
        konfirmi ke tio ja estas la ĝusta literumado aŭ ĝustigu la nomon.
      letter_after_period_warning: >-
        '%{name}' havas mankantan spaceton post punkto en ria nomo. Bonvolu
        konfirmi ke tio ja estas la ĝusta literumado aŭ ĝustigu la nomon.
      single_letter_first_or_last_name_warning: >-
        '%{name}' havas unuliteran personan nomon aŭ nomon. Bonvolu ĝustigi la
        nomon aŭ konfirmi ke tio ja estas la ĝusta nomo de la konkursanto laŭ
        oficiala dokumento.
      single_name_warning: >-
        '%{name}' havas nur unu nomon. Bonvolu konfirmi ke tio ja estas la ĝusta
        nomo de la konkursanto laŭ oficiala dokumento.
      competitor_limit_exceeded_warning: >-
        La nombro de personoj en tiu konkurso (%{n_competitors}) superas la
        limon de konkursantoj (%{competitor_limit}). La rezultoj de la
        konkursantoj kiuj registriĝis post atingo de la limo de konkursantoj
        devas esti forigitaj.
    results:
      automatically_position_fixed_info: >-
        [%{round_id}] Oni riparis aŭtomate la pozicion de %{person_name} de
        %{pos} al %{expected_pos}.
      mbf_result_over_time_limit_warning: >-
        [%{round_id}] La rezulto '%{result}' de %{person_name} superas la
        tempolimon. Bonvolu certigi ke tio estas pro tempopunoj antaŭ ol sendi
        la rezultoj, aŭ ŝanĝu la rezulton al DNF.
      result_after_dns_warning: >-
        [%{round_id}] %{person_name} havas almenaŭ unu DNS-rezulton sekvata de
        valida rezulto. Bonvolu certigi ke ĝi ja estas DNS kaj se jes, ekspliku
        kion okazis al la WRT.
      similar_results_warning: >-
        [%{round_id}] La rezultoj de %{person_name} similas tiujn de
        %{similar_person_name}. Bonvolu certigi ke tiuj rezultoj estas ĝustaj
        por ambaŭ konkursantoj.
      met_cutoff_but_missing_results_error: >-
        [%{round_id}] %{person_name} havas rezulton sub la ĉestempo sed mankas
        rezultoj por la dua fazo de la raŭndo. La ĉestempo estis %{cutoff}.
      didnt_meet_cutoff_but_has_results_error: >-
        [%{round_id}] %{person_name} havas almenaŭ unu rezulton por la dua fazo
        de la raŭndo sed ri ne havis rezulton sub la ĉestempo. La ĉestempo estis
        %{cutoff}.
      wrong_attempts_for_cutoff_error: >-
        [%{round_id}] Almenaŭ unu provo estas mankanta en la ĉestempa fazo por
        %{person_name}. Bonvolu redakti la rezulton por inkludi la mankanta(j)n
        rezulto(j)n aŭ ĝisdatigi la raŭndajn informojn en la paĝo "Administri
        konkurserojn" de la konkurso.
      mismatched_result_format_error: >-
        [%{round_id}] La rezultoj de %{person_name} estas malbone strukturitaj:
        %{expected_format} estas atendita sed %{format} estis ricevita.
      result_over_time_limit_error: >-
        [%{round_id}] Almenaŭ unu rezulto de %{person_name} superas la
        tempolimon de la raŭndo, kiu estas %{time_limit} po provo. Ĉiuj provoj
        kiuj superas la tempolimon devas estis ŝanĝitaj al DNF.
      results_over_cumulative_time_limit_error: >-
        [%{round_ids}] La sumo de la rezultoj de %{person_name} superas la
        akumulan tempolimon, kiu estas %{time_limit}.
      no_round_information_warning: >-
        [%{round_id}] Ne estas informo pri ĉestempo nek tempolimo por ĉi tiu
        raŭndo. Oni preterpasis tiujn kontrolojn. Bonvolu ĝisdatigi la raŭndaj
        informoj en la paĝo "Administri konkursejojn" de la konukurso.
      undefined_time_limit_warning: >-
        [%{round_id}] La tempolimo de ĉi tiu raŭndo estas nedifinita, oni
        preterpasis la tempolimajn kontrolojn. Tio estas normala nur por
        konkursoj kiuj okazis antaŭ ol 2013.
      suspicious_dnf_warning: >-
        [%{round_ids}] La raŭndo havas akumulan tempolimon kaj eksterpolante
        surbaze de la sukcesaj provoj de %{person_name} oni vidas ke ri havus
        nur iomete da restanta tempo por almenaŭ unu el riaj DNFj. Bonvolu
        certigi ke ĉiu DNF kaj DNS ja estas ĝusta. Se la konkursanto ne komencis
        provon aŭ tute ne havis restantan tempon antaŭ ol komenci la provon, ĝi
        devas esti rikordita kiel DNS.
      missing_cumulative_round_id_error: >-
        [%{original_round_id}] Ne eblas trovi la raŭndon %{wcif_id} kun la
        akumula tempolimo indikita en la WCIF. Bonvolu iri al la paĝo
        "Administri konkurserojn" de la konkurso kaj forigi %{wcif_id} de la
        akumula tempolimo de %{original_round_id}. Ĝi estas konata cimo de la
        WST (GitHub-problemo #3254).
      wrong_position_in_results_error: >-
        [%{round_id}] %{person_name} estas en malĝusta pozicio: %{expected_pos}
        estas atendita sed %{pos} estis ricevita.
    rounds:
      too_many_qualified_warning: >-
        Raŭndo %{round_id}: estas pli multe da homoj kiuj kvalifikis ol tion
        kion la kvalifikajn kondiĉojn planis (%{actual} anstataŭ %{expected}, la
        kondiĉo estis: %{condition}). Bonvolu ĝisdatigi la raŭndajn informojn en
        la paĝo "Administri konkurserojn".
      unexpected_round_results_error: >-
        La raŭndo %{round_id} estas en la rezultoj sed ĝi ne estis kreita en la
        langeto pri konkurseroj. Bonvolu inkludi la raŭndajn informojn en la
        paĝo "Administri konkurserojn" de la konkurso.
      regulation_9m1_error: >-
        La raŭndo %{round_id} havas 99 aŭ malpli da 99 konkursantoj sed havas
        pli ol du sekvaj raŭndoj. La regulo 9m1 malpermesas tion.
      regulation_9m2_error: >-
        La raŭndo %{round_id} havas 15 aŭ malpli da 15 konkursantoj sed havas
        pli ol unu sekva raŭndo. La regulo 9m2 malpermesas tion.
      regulation_9m3_error: >-
        La raŭndo %{round_id} havas 7 aŭ malpli da 7 konkursantoj sed havas
        almenaŭ unu sekvan raŭndon. La regulo 9m3 malpermesas tion.
      regulation_9p1_error: >-
        Raŭndo %{round_id}: Malpli ol 25% de la konkursantoj estis eliminitaj.
        La regulo 9p1 malpermesas tion.
      no_competitor_eliminated_error: >-
        Raŭndo %{round_id}: Almenaŭ unu konkursanto devas esti eliminita, tio
        estas postulo de la regulo 9p (konkursoj antaŭ Aprilo 2010).
      less_than_twenty_five_percent_eliminated_error: >-
        Raŭndo %{round_id}: laŭ la kvalifikaj kondiĉoj (%{condition}), malpli ol
        25% de la konkursantoj devas esti eliminitaj. La regulo 9p1 malpermesas
        tion. Bonvolu ĝisdatigi la raŭndajn informojn en la paĝo "Administri
        konkurserojn".
      not_enough_qualified_warning: >-
        Raŭndo %{round_id}: laŭ la konkurseraj datumoj, maksimume %{expected}
        povis kvalifiki sed nur %{actual} konkursis en la raŭndo. Bonvolu skribi
        komenton pri tio (aŭ ĝustigu la konkurserajn datumojn se vi uzis
        malsaman kvalifikan kondiĉon).
      competed_not_qualified_error: >-
        Raŭndo %{round_id}: %{ids} konkursis sed ne sukcesis havi rezulton sub
        la kvalifikan kondiĉon (%{condition}). Bonvolu certigi ke la kvalifikan
        kondiĉon kongruas kun tiu kiu estis uzita dum la konkurso kaj forigi la
        rezultojn se bezonata.
      round_not_found_error: >-
        Ne eblas trovi la raŭndon %{round_id}. Bonvolu certigi ke la panelo
        "Administri konkurserojn" en la WCA-retejo kaj WCA Live estas
        sinkronigitaj.
      missing_round_results_error: >-
        Ne estas rezultoj por la raŭndo %{round_id} sed ĝi estas listigata en la
        konkurseran langeton. Se ĉi tiu raŭndo ne okazis, forigu la raŭndon en
        la paĝo "Administri konkurserojn" de la konkurso.
      unexpected_combined_round_error: >-
        Neniu ĉestempo estis anoncita por '%{round_name}' sed oni trovis
        ĉestempon en la rezultoj. Bonvolu ĝisdatigi la raŭndajn informojn en la
        paĝo "Administri konkurserojn" de la konkurso.
    events:
      not_333_main_event_warning: >-
        La elektita ĉefa konkursero estas %{main_event_id}. Kvankam ĝi jam estis
        aprobita de la WCAT ANTAŬ la konkurso, la WRT devas kontroli POST la
        konkurso ke la gvidlinioj pri ĉefaj konkurseroj de la Politiko pri
        Postuloj de Konkursoj de la WCA estis sekvitaj. Bonvolu doni unu agon
        kiu montras ke la %{main_event_id} estis traktita kiel ĉefa konkursero
        DUM la konkurso (jen validaj ekzemploj: deklarita venkinto de la
        konkurso, pli granda nombro da raŭndoj, pli granda/grava premio).
      no_main_event_warning: >-
        Ĉi tiu konkurso ne havas ĉefan konkurseros. Bonvolu sciigi al la WRT ke
        tio ĝustas.
      unexpected_results_error: >-
        Estas rezultoj de %{event_id} sed ĝi ne estas listigita kiel oficiala
        konkursero. Bonvolu forigi la konkurseron el la rezultoj aŭ kontakti la
        WCAT por peti aldonon de ĉi tiun konkurseron al la WCA-retejo.
      missing_results_warning: >-
        Ne estas rezultoj de %{event_id} sed ĝi estas listigita kiel oficiala
        konkurseron. Se ĉi tiu konkursero okazis, bonvolu realŝuti vian JSON-n
        kun la rezultoj inkluditaj. Se ĝi ne okazis, skribu komenton al la WRT.
    scrambles:
      missing_scrambles_for_round_error: >-
        [%{round_id}] Mankantaj miksoj. Uzu "Scrambles Matcher" por aldoni la
        ĝustajn miksojn al la raŭndo.
      missing_scrambles_for_competition_error: >-
        Mankantaj miksoj por la konkurso. Uzu "Scrambles Matcher" por aldoni
        miksojn.
      unexpected_scrambles_for_round_error: >-
        [%{round_id}] Tro multe da miksoj. Uzu "Scrambles Matcher" por malelekti
        la neuzataj miksoj.
      missing_scrambles_for_group_error: >-
        [%{round_id}] Grupo %{group_id}: mankantaj miksoj, oni trovis nur
        %{actual} anstataŭ %{expected}.
      missing_scrambles_for_multi_error: >-
        [%{round_id}] Kvankam eblas havi plurajn grupojn por la konkursero
        "3x3x3 pluraj kuboj blinde", almenaŭ unu el la grupoj devas enhavi
        miksojn por ĉiuj provoj.
      multiple_fmc_groups_warning: >-
        [%{round_id}] Estas pluraj grupoj uzataj por la konkursero "3x3x3
        Optimigita Solvo". Se nur unu grupo estis uzita, bonvolu uzi "Scrambles
        Matcher" por malelekti la neuzitaj miksoj. Alieokaze, bonvolu skribi
        komenton por ekspliki al la WRT kial pluraj grupoj estis uzitaj.
      wrong_number_of_scramble_sets_error: >-
        [%{round_id}] Ĉi tiu raŭndo havas malsaman kvanton da miksoj ol tiun
        kiun estas indikita en la langeto "Administri konkurserojn". Bonvolu
        adapti la kvanton da miksoj indikitaj en la langeto "Administri
        konkurserojn" por ke ĝi kongruu kun la uzata kvanto.
  scramble_set:
    name: Miksaro %{letter_code}
    group: Grupo %{number}
    attempt: Provo %{number}
