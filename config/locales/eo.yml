          backup_codes: Savitaj kontrolkodoj
          backup_codes_desc: >-
            Restaŭraj kontrolkodoj povas esti uzataj anstataŭ unufojan pasvorton
            se vi ne povas atingi vian aparaton kun dufaza aŭtentiga aplika
            aplikaĵo. Ĉiu kontrolkodo povas esti uzata nur unufoje. Konservu
            ilin en sekura loko!
          no_backup_codes: >-
            Vi ankoraŭ ne generis restaŭraj kontrolkodoj. Alklaku la butonon
