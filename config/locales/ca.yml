      default_message: 'Si us plau revisa els següents problemes:'
    hints:
      incident:
        title: 'Tingues en compte que és públic, i ho has d''omplir en anglès!'
        private_description: >-
          Una descripció de l'incident que només veuran els delegats. Si us
          plau, omple-ho en anglès.
        private_wrc_decision: >-
          La decisió final de WRC, incloent-hi els detalls privats. Si us plau,
          omple-ho en anglès.
        public_summary: >-
          Una descripció general de l'incident i la decisió presa, serà públic.
          Si us plau, omple-ho en anglès.
      user:
        dob: Introdueix la teva data de naixement en aquest format YYYY-MM-DD.
        name: >-
          Introdueix el teu nom complet de manera correcta, per exemple
          <strong>Stefan Pochmann</strong>. Sense abreviacions com  <strong>s
          pochman</strong>. <br/>Cognoms (ja siguin complets o inicials) són
          opcionals.
        pending_avatar: >-
          Després d'enviar un nou avatar, hauràs d'esperar que l'equip de
          resultats de la WCA l'aprovi.
        registration_notifications_enabled: >-
          Això només s'aplica a les competicions que organitzis o deleguis, i
          pot ser anul·lat a escala de competició.
        receive_delegate_reports: >-
          Si ets un delegat en pràctiques, delegat junior, delegat sènior o
          membre de WRC o WQAC, rebràs els informes dels delegats per defecte.
          Important: el canvi pot tardar fins a una hora a tenir efecte.
        otp_attempt: >-
          Comprova la teva aplicació mòbil configurada per a una contrasenya
          d'un sol ús, o introdueix un dels teus codis de recuperació.
      competition:
        name: >-
          El nom complet de la competició incloent l'any al final (exemple:
          Danish Open 2016). Revisa les majúscules. El nom ha de contenir només
          caràcters alfanumèrics, guions(-), ampersands(&), punts(.), dos punts(:),
          apòstrofs(') i espais().
        cell_name: >-
          Un nom curt per mostrar. Si el nom de la competició ja és curt, pots
          reutilitzar el nom (exemple: Europe 2006).
        city_name: >-
          Nom de la ciutat i estat (si és possible) on hi haurà la competició.
          No incloguis el país (exemple: París o San Francisco, Califòrnia).
        information: >-
          Informació important que els competidors haurien de saber. Sortirà a
          la pàgina principal de la competició. <br/>Si us plau, emplena-ho
          <b>en anglès</b> i qualsevol altre idioma que els competidors puguin
          parlar.
        delegate_ids: Delegats de la WCA per la competició.
        trainee_delegate_ids: Delegats en pràctiques de la WCA per la 
          competició.
        organizer_ids: >-
          Organitzadors de la competició (han de tenir un compte per sortir
          aquí).
        external_website: Pàgina web de la competició. Ha de tenir un enllaç 
          http(s) vàlid.
        registration_open: 'Important: L''obertura i clausura del registre està en
          horari UTC'
        remarks: >-
          Alguna informació addicional que vulguis mencionar a WCAT. Per
          exemple, si hi ha alguna cosa que no acabes de tenir clara o si tens
          una proposta especial per WCAT. Si us plau, omple-ho en anglès!
        external_registration_page: >-
          La pàgina on els competidors s'han de registrar per la competició. Ha
          de ser un enllaç http(s) vàlid.
        base_entry_fee_lowest_denomination: >-
          La quota de registre bàsica per la competició. Es mostrarà a la pàgina
          principal de la competició i a la pàgina de registre si s'utilitza. Si
          s'estableix a 0, es mostrarà una frase dient que es pot atendre a la
          competició gratuïtament. <br><br> <b>IMPORTANT: Les següents WCA Dues
          són només una aproximació basada en el tipus de conversió de divisa
          actual i de cap manera és legalment vinculant pel pagament d'aquestes.
          </b><br> Prem "Actualitza Competició" després de canviar el codi de
          moneda per sincronitzar l'estimació. Si no hi ha cap tipus de
          conversió disponible per la moneda seleccionada, no es mostrarà res.
        currency_code: El codi de moneda per les quotes.
        competitor_limit_enabled: >-
          Tot i que no és requerit per les Regulacions d'establir un límit de
          competidors, és altament recomanat.
        competitor_limit: >-
          El nombre de competidors permesos per aquesta competició. Per ara
          aquest nombre només és informatiu i no impedeix que més gent es
          registri. Estem treballant per afegir suport explícit per aquest
          procés d'inscripció, però requereix més feina primer.
        competitor_limit_reason: >-
          Quina és la raó del límit de competidors? Si us plau, omple-ho en
          anglès!
        extra_registration_requirements: >-
          Si us plau, indica aquí qualsevol requisit extra pel registre que
          encara no s'hagi indicat, com per exemple instruccions de com pagar.
          <br/>Si us plau, omple-ho <b>en anglès</b> i qualsevol altre idioma
          que els competidors puguin parlar; es mostrarà a la pàgina
          d'informació sobre la competició així com la pàgina de registre a la
          competició si és que s'utilitza la pàgina web de la WCA per fer-les.
        on_the_spot_entry_fee_lowest_denomination: >-
          Si s'introdueix un 0 aquí, es mostrarà una frase dient que els
          registres al lloc seran acceptats gratuïtament.
        refund_policy_percent: >-
          Per ara aquest nombre es només informatiu, els retorns s'han de fer
          manualment. Si s'introdueix 0, es mostrarà una frase dient que les
          quotes de registre mai seran retornades sota cap circumstància.
        refund_policy_limit_date: Data límit a partir de la qual no es retornarà
          cap més quota.
        waiting_list_deadline_date: >-
          La data a partir de la qual no s'acceptaran més persones de la llista
          d'espera. Si tens una data límit pels retorns de quota, la data per
          ser acceptat no hauria de ser abans de la data límit pels retorns.
        event_change_deadline_date: >-
          Els competidors registrats tenen el dret d'actualitzar les seves categories
          fins aquesta data contactant l'equip organitzador. Aquesta data límit
          no hauria de ser posada abans del moment que s'ha de tancar els
          registres. Deixar aquest espai en blanc vol dir que els competidors
          poden afegir una categoria més per competir fins al mateix moment de la
          competició. Si acceptes registres al lloc, aquesta data ha de ser la
          mateixa que l'inici de la competició.
        guests_entry_fee_lowest_denomination: >-
          Per ara aquest nombre és només informatiu, les quotes d'espectador no
          poden ser administrades per aquesta pàgina web. Si s'introdueix un 0,
          es mostrarà una frase que escullis referent a la política pels
          espectadors.
        early_puzzle_submission_reason: >-
          Si us plau, explica perquè voldries requerir als competidors que
          entriguin els cubs més aviat. Omple-ho en anglès!
        qualification_results_reason: >-
          Si us plau, explica aquí perquè voldries utilitzar temps de
          qualificació. Omple-ho en anglès!
        event_restrictions_reason: >-
          Si us plau, explica aquí perquè voldries limitar una combinació
          especifica de categories. Omple-ho en anglès!
        main_event_id: El guanyador d'aquesta categoria serà el guanyador de la 
          competició.
      website_contact:
      dob_contact:
        dob: La teva data de naixement en el format YYYY-MM-DD
        document: >-
          Per demostrar la teva identitat i la data de naixement, has d'adjuntar
          una imatge de qualsevol document legal (document d'identitat, carnet
          de conduir, carnet d'estudiant, passaport, certificat de
          naixement,...) on el teu nom i la teva data de naixement siguin
          visibles i es puguin entendre (contacta el teu delegat local de la WCA
          si no tens aquests tipus de documents). A la identificació necessitem
          com a mínim el teu nom i data de naixement; pots pixelar/ocultar
          qualsevol altra part de la documentació si així ho desitges.
      post:
        body: >-
          Utilitza l'etiqueta &lt;!-- break --&gt; per mostrar una visualització
          prèvia de la pàgina d'inici. Qualsevol publicació a la pàgina d'inici
          mostrarà tot el text abans d'aquest divisor. La publicació real
          mostrarà el cos sencer.
