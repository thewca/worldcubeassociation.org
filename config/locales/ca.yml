      find_relations: Troba connexions entre cubers
      show_relation: Mostra'm la relació!
      connectives:
        was_at: Va ser a
        together_with: Juntament amb
    messages:
      invalid_wca_ids: 'Si us plau, introdueix dos WCA IDs vàlids.'
