    acknowledges: 'La WCA reconeix els següents Delegats de la WCA:'
    table:
      name: Nom
      role: Rol
      region: Regió
  regional_organizations:
    title: Organitzacions Regionals
    content: 'La WCA reconeix les següents Organitzacions Regionals:'
    empty: No hi ha cap Organització Regional reconeguda per la WCA ara mateix.
    how_to:
      title: Com ser una Organització Regional reconeguda per la WCA
      description: >-
        La WCA reconeix diverses organitzacions regionals a tot el món.
        L'objectiu d'una organització regional WCA és organitzar competicions
        WCA i donar suport a les activitats de la WCA a la regió. Es recomana
        als països que vulguin formar una organització regional que
        contribueixin a la WCA a la seva àrea abans de presentar la seva
        sol·licitud. Per obtenir ajuda per organitzar una competició WCA a la
        vostra zona, poseu-vos en contacte amb el vostre delegat WCA més proper.
    requirements:
      title: Requisits per a les Organitzacions Regionals de la WCA
      list:
        '1': >-
          Organitzar o ajudar activament en Competicions de la WCA dins de la
          regió de l'organització
        '2': >-
          Contribuir en les Competicions Continentals de la WCA que s'acullen en
          el continent de l'Organització Regional, si és requerit per l'Equip de
          l'Organització corresponent
        '3': >-
          Respectar i posar en funcionament els Objectius establerts als
          Estatuts i Mocions de la WCA
        '4': Complir amb totes les normatives de la WCA aplicables
        '5': Acceptar i complir les decisions del personal de la WCA
        '6': >-
          Conservar a l'arxiu de la WCA una còpia dels seus estatuts i, si
          escau, de la normativa vigent en format electrònic
    application_instructions:
      title: Instruccions de Sol·licitud
      description_html: >-
        Per sol·licitar el reconeixement, si us plau omple <a
        href='/regional-organizations/new'>aquest formulari</a>.
    regional_organization_form:
      filling_instructions_html: 'Si us plau, omple-ho tot <b>en anglès!</b>'
      public_information: Informació pública
      private_information: Informació privada
      private_information_disclaimer: >-
        Tota la informació següent només serà visible pel Consell Executiu de la
        WCA
    errors:
