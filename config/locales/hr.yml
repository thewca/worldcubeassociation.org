          Nakon prijenosa novog avatara, mora se čekati potvrda WCA Tima za
          rezultate.
        registration_notifications_enabled: >-
          Ovo se primjenjuje samo za natjecanja koja ti organiziraš ili
          delegiraš i može biti promijenjeno od jednog do drugog natjecanja.
        receive_delegate_reports: >-
          Ukoliko si Senior Delegat, član WRC ili WQAC, svakako primaš
          Delegatove izvještaje. Napomena: promjena se može vidjeti tek za sat
          vremena nakon što je napravljena.
        delegate_reports_region: >-
          Ukoliko želite primati sve izvještaje, ostavite ovo polje praznim
          (dropdown opcija na samom vrhu). Bilješka: ovoj promjeni treba oko
          jednog sata za izvršenje.
        otp_attempt: >-
          Provjeri odabranu mobilnu aplikaciju za jednokratnu lozinku ili unesi
          jedan od kodova za oporavak.
      dob_contact:
        dob: Tvoj točan datum rođenja u formatu YYYY-MM-DD
        document: >-
          Da bi potvrdio/la svoj identitet i točan datum rođenja, mora se
          priložiti fotografija bilo kojeg valjanog dokumenta (osobna iskaznica,
          vozačka dozvola, studentska iskaznica, putovnica, izvadak iz matice
          rođenih...) gdje je datum rođenja i ime vidljivo i razumljivo
          govorniku engleskog jezika (ili kontaktirajte svog lokalnog WCA
          Delegata ukoliko nemate bilo koji od navedenih dokumenata). Na tom
          dokumentu minimalno moraju biti ime i datum rođenja; slobodno
          zamaglite ili zamutite ostale osobne podatke na dokumentu.
      post:
        body: >-
          Koristi &lt;!-- break --&gt; tag za prikaz skice na početnoj stranici.
          Svaka objava na početnoj stranici će prikazivati sav tekst prije ovog
          divider-a. Pravi post će prikazati puno tijelo teksta.
        show_on_homepage: >-
          Oprez! Ovo nije sigurno za privatne podatke. Ovo je samo za stabilnost
          početne stranice. Objave koje nisu prikazane na početnoj stranici su i
          dalje dostupne javnosti preko poveznica ili tagova.
      delegate_report:
        schedule_url: >-
          Potpuni link za objavljeni raspored (npr.
          https://www.cubingusa.com/usnationals2016/schedule.php)
        equipment: >-
          Broj i tip štoperica i ekrana korištenih na natjecanju. Makni liniju/e
          opreme koja nije korištena.
        summary: >-
          Prikazane natuknice gore su samo za pomoć u pisanju izvještaja.
          Koristite ih kako mislite da vam najbolje odgovaraju. Molimo da
          obrišete nekorištene dijelove!
        venue: >-
          Koristi ove naputke samo za upute kako napisati kompletno izvješće.
          Koristi ih onako kako misliš da će ti najbolje odgovarati. Makni one
          dijelove koje ne koristiš!
        organization: >-
          Koristi ove naputke samo za upute kako napisati kompletno izvješće.
          Koristi ih onako kako misliš da će ti najbolje odgovarati. Makni one
          dijelove koje ne koristiš!
        incidents: >-
          Prijavi sve incidente koji nisu toliko česti. Numeriraj incidente
          počevši od 1. kako bi ostali Delegati mogli komentirati referirajući
          se na njihov broj. Ako se sve čini generično, napiši barem jedan
          incident vrijedan spomena. Uključi odgovarajuće opcije ispod ukoliko
          trebaš dodatni feedback.
        setup_images: >-
          Molimo odaberite barem %{image_count} sliku koja prikazuje postavljen
          natjecateljski prostor (stol za miješanje kocaka, natjecateljski dio
          itd.). Možete priložiti više datoteka odjednom. Možete obrisati
          fotografije nakon što je priloženo više ostalih datoteka (ukoliko
          želite zamijeniti fotografiju, morate pričožiti prvo novu pa tek
          obrisati staru).
        wrc_incidents: >-
          Lista brojeva koji su referenca na incidente za koje se zahtjeva
          povratna informacija od WRC-a.
        wic_incidents: >-
          Lista numeriranih referenci na incidente za koju treba WIC povratna
          informacija.
        remarks: >-
          Par rečenica o bilo kojim detaljima koje želiš podijeliti (npr.
          poboljšanje/pogoršanje unutar zajednice, buduće planove za tu regiju).
          Ukoliko je nešto u prijašnjim sekcijama zaboravljeno, dodaj ovdje.
