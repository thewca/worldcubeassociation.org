  incidents_log:
    i18n_disclaimer: >-
      Napominjemo da je odjeljak o incidentima dostupan samo na engleskom
      jeziku, sadržaj u nastavku nije preveden.
    incident: 'Incident:'
  about_regulations:
    title: O Pravilniku
    panel1:
      title: Pravilnik
      content1_html: >-
        Sva natjecanja moraju pratiti <a href="/regulations/">WCA Pravilnik</a>.
        Važno je da natjecatelji pročitaju Pravilnik prije nego pristupe prvom
        natjecanju.
      content2_html: >-
        WCA Pravilnik je upotpunjen <a href="/regulations/guidelines.html">WCA
        Smjernicama</a>, koje sadržavaju dodatna objašnjenja i razjašnjenja.
      content3_html: >-
        Važne odluke oko incidenata koji su se dogodili na natjecanju i koji su
        riješeni od strane WCA Odbora za Regulacije mogu se pronaći u <a
        href="/incidents">Zapisniku o incidentima</a>.
    panel2:
      title: Prijevodi
      content1_html: >-
        WCA Pravilnik nije dostupan samo na engleskom jeziku, preveli su ga
        članovi WCA na više jezika: <a href="/regulations/translations/">
        Prijevodi</a>.
      content2_html: >-
        <strong>Važno:</strong>: Iako su prijevodi veoma korisni, nisu službeni.
        Na natjecanjima, engleska verzija je jedina službeno važeća.
    panel3:
      title: Često postavljena pitanja o Pravilniku
      content1_html: >-
        <a href="/faq">Sekcija "Često postavljena pitanja"</a> odgovara na
        nekoliko učestalih pitanja o WCA Pravilniku.
    panel4:
      title: Smjernice za organizatore
      content1_html: >-
        Ukoliko si zainteresiran/a organizirati natjecanje ili već planiraš
        organizirati jedno, pročitaj naše <a
        href="https://documents.worldcubeassociation.org/edudoc/organizer-handbook/organizer-handbook.pdf">Smjernice
        za organizatore</a>.
      content2_html: >-
        Ovaj dokument sadrži važne informacije koje svaki organizator natjecanja
        mora pročitati.
  regulations_translations:
    title: 'WCA Regulacije i Smjernice: Prijevodi'
    paragraph1: >-
      Ako govoriš neki drugi jezik, osim engleskog jezika, ovi prijevodi ti mogu
      biti korisni.
    paragraph2: >-
      Imajte na umu da prijevodi nemaju nikakav službeni status, iako su
      dostupni na web stranici WCA: ne dolaze s nikakvim jamstvom. Ako postoji
      razlika između prijevoda i (trenutne službene) engleske verzije, mora se
      koristiti engleska verzija.
    translations: Prijevodi
    current: Trenutni
    old: Stariji
    table_elements:
      version: Verzija
      language: Jezik
    translating: Prevođenje Pravilnika
    paragraph3_html: >-
      Ukoliko želiš dodati/ažurirati prijevod, pogledaj <a
      href="https://github.com/thewca/wca-regulations-translations#translation-instructions">upute
      na GitHub repozitoriju za prevođenje</a>.
