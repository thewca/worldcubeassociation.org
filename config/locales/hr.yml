  score_tools:
    title: Softverski alati za WCA natjecanja
    wca_icon_text: Razvijeno i održavano od strane WSTa
    intro:
      desc: >-
        Ova stranica sadrži neiscrpan popis alata koji pomažu u organizaciji WCA
        natjecanja.
      disclaimer: >-
        WST ne održava sve alate na ovoj stranici – i to je sasvim u redu!
        Nemamo dovoljno ljudi za upravljanje cjelokupnim WCA softverom. :)
      used: >-
        Svi programi na ovom popisu korišteni su na stvarnim WCA natjecanjima i
        integriraju se s WCA web stranicom: Omogućuju vam prijavu sa svojim WCA
        računom kako biste mogli uvesti (a ponekad i ažurirati) svoje podatke o
        nadolazećim natjecanjima. Za svaki od njih, programer koji ga održava
        jasno će to naznačiti.
    before:
      title: Prije natjecanja
      desc: >-
        Upravljanje registracijama natjecatelja može se obaviti izravno na web
        stranici WCA. Budući da ručno upravljanje grupama i osobljem može
        oduzeti puno vremena, razmislite o upotrebi jednog od alata u nastavku.
    during:
      title: Tijekom natjecanja
      desc: >-
        Ovdje ćete pronaći sve alate koji omogućuju upravljanje rezultatima
        natjecanja dok se ono održava.
    after:
      title: Nakon natjecanja
      desc: >-
        Dok se provjera rezultata događa upravo na web stranici, morat ćete
        koristiti neki alat da dodijelite scramblove generirane preko TNoodlea
        sa stvarnim rezultatima podnesenim na web stranici WCA.
    tools:
      age:
        title: DOB
        description: Alat za generiranje i uređivanje grupa/zadataka za WCA 
          natjecanja
      certificates:
        title: Certifikati
        description: Ispiši certifikate za WCA natjecanja koristeći WCA Live
      groupifier:
        title: Groupifier
        description: >-
          Alat za upravljanje zadacima i grupama za organizatore WCA natjecanja.
          Među glavnim značajkama koje ćete pronaći su: razvrstavanje
          natjecatelja po rangu, dodjeljivanje zadataka (suđenje, scramblanje),
          odlučivanje koliko će scrambleova biti potrebno, generiranje tablice
          rezultata, osobnih tablica i sažetaka... Pogledajte web stranicu kako
          biste saznali više.
      scorecards:
        title: Kartice rezultata
        description: Ispiši kartice rezultata za WCA natjecanja koja koriste WCA
          Live
      tnoodle:
        title: TNoodle (Scrambleovi)
        description: >-
          TNoodle je službeni program za generiranje scrambleova na WCA
          natjecanjima. Obično ga koriste WCA Delegati prije WCA natjecanja, ali
          njegovo korisničko sučelje omogućuje bilo kome generiranje bilo koje
          scramblove za sve WCA događaje.
      live:
        title: WCA Live
        description: >-
          Platforma za vođenje WCA natjecanja i dijeljenje rezultata uživo sa
          svijetom.
      nightmare:
        title: Tablica rezultata
        description: >-
          Takve stvari se ponekad događaju… Ako nemate pristup internetu, morat
          ćete koristiti klasične tablice.
      matcher:
        title: Scrambles Matcher
        description: >-
          Može se koristiti za dodjeljivanje scrambleova generiranih pomoću
          TNoodlea. Uvezite rezultate s WCA web stranice (kada koristite WCA
          Live), proračunsku tablicu ili samostalnu WCIF datoteku. Uvozite
          kodove iz jedne ili više json datoteka TNoodlea. Izvozite rezultate u
          odgovarajućem formatu za slanje WCA.
      groups:
        title: Grupe natjecanja
        description: Pogledaj grupe natjecanja za neka od trenutnih natjecanja
  logo:
    title: WCA Logotip
    intro: >-
      WCA logo dizajnirao je Justin Eastman, na natječaju za dizajn u siječnju
      2005. Logo nam se svidio zbog njegovog dizajna, boja i činjenice da ne
      prikazuje konkretno 3x3x3 kocku.
    headings:
      usage_guidelines:
        title: Smjernice za korištenje
        paragraph:
          acceptable_usage: >-
            Prihvatljiva upotreba WCA logotipa navedena je u <a
            href="https://documents.worldcubeassociation.org/documents/policies/external/Logo%20Usage.pdf">Politici
            korištenja WCA logotipa</a>. Molimo pročitajte ovaj dokument prije
            korištenja WCA logotipa u vlastitim projektima. Sva dodatna pitanja
            u vezi s korištenjem WCA logotipa pošaljite <a
            href="mailto:marketing@worldcubeassociation.org">WCA marketinškom
            timu</a>.
          see_below: >-
            Ispod su dodatne stilske smjernice za ispravnu upotrebu WCA
            logotipa.
        color:
          title: Boja
          paragraph: >-
            WCA logo postoji u četiri varijacije boja. Treba koristiti ispravnu
            varijantu boje ovisno o boji pozadine medija na kojem se nalazi
            logotip.
          primary:
            title: Primarno
            paragraph: Koristite primarnu varijantu kad god je to moguće.
          mono:
            title: Mono
            paragraph: >-
              Mono varijantu koristite samo kada primarna varijanta nije
              prikladna.
        logo_only:
          title: Samo Logo
          paragraph: >-
            WCA logo se može koristiti bez logotipa, slijedeći iste gore
            navedene smjernice za boju.
      download_logo_assets:
        title: Preuzmite assete logotipa
        paragraph: >-
          PNG i vektorske verzije WCA logotipa visoke rezolucije dostupne su za
          preuzimanje.
        accept_terms_and_conditions: >-
          Pročitao/la sam i prihvaćam <a
          href="https://documents.worldcubeassociation.org/documents/policies/external/Logo%20Usage.pdf">Pravila
          korištenja logotipa WCA</a>.
        download_button_text: Preuzmi assete logotipa
