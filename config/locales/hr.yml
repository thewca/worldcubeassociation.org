      empty_gender_warning: >-
        Spol za novog natjecatelja %{name} je prazan. Valjane rodne vrijednosti
        su 'žensko', 'muško' i 'ostalo'. Ostavite komentar za WRT o ovome.
      non_matching_name_warning: >-
        Ime '%{name}' navedeno za %{wca_id} ne odgovara trenutnom zapisu u WCA
        bazi podataka ('%{expected_name}').
      non_matching_country_warning: >-
        Država '%{country}' navedena za %{name} (%{wca_id}) ne odgovara
        trenutnom zapisu u WCA bazi podataka ('%{expected_country}'). Ako je ovo
        pogreška, ispravite je. U suprotnom, ostavite komentar za WRT o tome.
      multiple_newcomers_with_same_name_warning: >-
        Postoji više novih natjecatelja s potpuno istim imenom: %{name}.
        Provjerite jesu li svi rezultati točni za ove natjecatelje i jesu li svi
        rezultati ispravno odvojeni odgovarajućim ID-om.
      wrong_parenthesis_type_error: >-
        Znak zagrade korišten u '%{name}' je nepravilan znak, molimo zamijenite
        ga običnom zagradom '(' ili ')' i odgovarajućim razmakom.
      successive_uppercase_name_warning: >-
        '%{name}' ima uzastopna velika slova u svom imenu. Potvrdite da je ovo
        doista ispravno napisano ili popravite naziv.
      lowercase_name_warning: >-
        '%{name}' ima ime napisano malim slovima. Potvrdite da je ovo doista
        ispravno napisano ili popravite naziv.
      missing_period_in_single_letter_middle_name_warning: >-
        '%{name}' ima srednje ime od jednog slova bez kratice. Potvrdite da je
        ovo doista ispravno napisano ili popravite naziv.
      letter_after_period_warning: >-
        '%{name}' nema razmak nakon točke u svom imenu. Potvrdite da je ovo
        doista ispravno napisano ili popravite naziv.
      single_letter_first_or_last_name_warning: >-
        '%{name}' ima jedno slovo kao ime ili prezime. Ispravite ime ili
        potvrdite da je to doista točno ime natjecatelja prema službenom
        dokumentu.
      single_name_warning: >-
        '%{name}' ima samo jedno ime. Molimo potvrdite da je ovo doista puno ime
        natjecatelja prema službenom dokumentu.
      competitor_limit_exceeded_warning: >-
        Broj osoba u natjecanju (%{n_competitors}) je iznad ograničenja
        natjecatelja (%{competitor_limit}). Rezultati natjecatelja prijavljeni
        nakon što je dostignut limit natjecatelja moraju se ukloniti.
    results:
      automatically_position_fixed_info: >-
        [%{round_id}] Automatski je popravljen položaj %{person_name} iz %{pos}
        u %{expected_pos}.
      mbf_result_over_time_limit_warning: >-
        [%{round_id}] Rezultat '%{result}' za %{person_name} premašuje vremensko
        ograničenje. Provjerite je li to zbog vremenskih kazni prije slanja
        rezultata ili popravite rezultat DNF-u.
      result_after_dns_warning: >-
        [%{round_id}] %{person_name} ima barem jedan DNS rezultat iza kojeg
        slijedi važeći rezultat. Provjerite je li to doista DNS i ako jest,
        objasnite što se dogodilo s WRT-om.
      similar_results_warning: >-
        [%{round_id}] Rezultati za %{person_name} slični su rezultatima za
        %{similar_person_name}. Molimo osigurajte da su ovi rezultati ispravno
        zabilježeni za oba natjecatelja.
      met_cutoff_but_missing_results_error: >-
        [%{round_id}] %{person_name} dostigao je cutoff, ali nedostaju rezultati
        za drugu fazu kruga. Cutoff je bio %{cutoff}.
      didnt_meet_cutoff_but_has_results_error: >-
        [%{round_id}] %{person_name} ima najmanje jedan rezultat za drugu fazu
        kruga, ali nije dostigao cutoff. Cutoff je bila %{cutoff}.
      wrong_attempts_for_cutoff_error: >-
        [%{round_id}] %{person_name} nedostaje barem jedan pokušaj za cutoff.
        Uredite rezultat kako biste uključili pokušaje koji nedostaju ili
        ažurirajte informacije o rundi na stranici Upravljanje događajima
        natjecanja.
      mismatched_result_format_error: >-
        [%{round_id}] Rezultati za %{person_name} su u pogrešnom formatu:
        očekivano %{expected_format}, ali dobiveno %{format}.
      result_over_time_limit_error: >-
        [%{round_id}] Najmanje jedan rezultat za %{person_name} premašuje
        vremensko ograničenje za rundu, koje je %{time_limit} po pokušaju. Sva
        slaganja tijekom vremenskog ograničenja moraju se promijeniti u DNF.
      results_over_cumulative_time_limit_error: >-
        [%{round_ids}] Zbroj rezultata za %{person_name} premašuje kumulativno
        vremensko ograničenje, koje je bilo %{time_limit}.
      no_round_information_warning: >-
        [%{round_id}] Nema informacija o cutoffu i vremenskom ograničenju za ovu
        rundu. Ove su provjere valjanosti preskočene. Ažurirajte informacije o
        krugu na stranici Upravljanje događajima natjecanja.
      undefined_time_limit_warning: >-
        [%{round_id}] Vremensko ograničenje za ovu rundu je nedefinirano,
        provjere vremenskog ograničenja su preskočene. To se očekuje samo za
        natjecanja prije 2013. godine.
      suspicious_dnf_warning: >-
        [%{round_ids}] Runda ima kumulativno vremensko ograničenje, a
        ekstrapolirajući na temelju uspješnih rješenja %{person_name}, imali bi
        vrlo malo vremena za barem jedan od svojih DNF-ova. Provjerite jesu li
        svaki DNF i DNS doista ispravni. Ako natjecatelj nije započeo pokušaj
        ili nije imao preostalo vrijeme prije početka pokušaja, mora se unijeti
        kao DNS.
      missing_cumulative_round_id_error: >-
        [%{original_round_id}] Nije moguće pronaći rundu %{wcif_id} za
        kumulativno vremensko ograničenje navedeno u WCIF-u. Molimo idite na
        stranicu Upravljanje događajima natjecanja i uklonite %{wcif_id} iz
        kumulativnog vremenskog ograničenja za %{original_round_id}. WST zna za
        ovaj bug (GitHub problem #3254).
      wrong_position_in_results_error: >-
        [%{round_id}] %{person_name} je u krivom položaju: očekivano
        %{expected_pos}, ali dobio %{pos}.
    rounds:
      too_many_qualified_warning: >-
        Runda %{round_id}: kvalificiralo se više natjecatelja nego što je
        planirano uvjetom napredovanja (%{actual} umjesto %{expected}, uvjet je
        bio: %{condition}). Ažurirajte informacije o krugu na stranici za
        upravljanje događajima.
      unexpected_round_results_error: >-
        Runda %{round_id} prisutna je u rezultatima, ali nije stvorena na
        kartici događaja. Uključite informacije o krugu na stranicu za
        upravljanje događajima natjecanja.
      regulation_9m1_error: >-
        Runda %{round_id} ima 99 ili manje natjecatelja, ali ima više od dvije
        uzastopne runde, što nije dopušteno prema Pravilu 9m1.
      regulation_9m2_error: >-
        Runda %{round_id} ima 15 ili manje natjecatelja, ali ima više od jedne
        naredne runde, što nije dopušteno prema Pravilu 9m2.
      regulation_9m3_error: >-
        Runda %{round_id} ima 7 ili manje natjecatelja, ali ima najmanje jednu
        sljedeću rundu, što nije dopušteno prema Pravilu 9m3.
      regulation_9p1_error: >-
        Runda %{round_id}: Manje od 25%% natjecatelja je eliminirano, što nije
        dopušteno prema Pravilu 9p1.
      no_competitor_eliminated_error: >-
        Runda %{round_id}: mora biti eliminiran najmanje jedan natjecatelj, što
        je potrebno prema Pravilu 9p (natjecanja prije travnja 2010.).
      less_than_twenty_five_percent_eliminated_error: >-
        Runda %{round_id}: prema uvjetu napredovanja (%{condition}), manje od
        25%% natjecatelja bilo bi eliminirano, što nije dopušteno prema Pravilu
        9p1. Ažurirajte informacije o krugu na stranici za upravljanje
        događajima.
      not_enough_qualified_warning: >-
        Runda %{round_id}: prema podacima događaja, najviše %{expected} je moglo
        nastaviti, ali samo %{actual} se natjecao u rundi. Ostavite komentar o
        tome (ili popravite podatke o događajima ako ste primijenili drugačiji
        uvjet napredovanja).
      competed_not_qualified_error: >-
        Runda %{round_id}: %{ids} se natjecao, ali nije ispunio uvjet pokušaja
        napredovanja rezultata (%{condition}). Provjerite odražava li uvjet
        napredovanja ono što je korišteno tijekom natjecanja i uklonite
        rezultate ako je potrebno.
      round_not_found_error: >-
        Runda %{round_id} nije mogla biti pronađena. Provjerite jesu li WCA web
        stranica Edit Events panel i WCA Live sinkronizirani.
      missing_round_results_error: >-
        Nema rezultata za rundu %{round_id}, ali je navedena u kartici događaja.
        Ako ovaj runda nije održana, uklonite rundu na stranici za upravljanje
        događajima natjecanja.
      unexpected_combined_round_error: >-
        Nije najavljen cutoff za '%{round_name}', ali je otkriveno kao cutoff u
        rezultatima. Molimo ažurirajte informacije o rundi na stranici za
        upravljanje događajima natjecanja.
    events:
      not_333_main_event_warning: >-
        Odabrani glavni događaj za ovo natjecanje je %{main_event_id}. Kako je
        taj događaj tretiran kao glavni događaj natjecanja? WRT-u dajte kratko
        objašnjenje (npr. broj rundi, nagrade, proglašeni pobjednik natjecanja,
        ...).
      no_main_event_warning: >-
        Nema odabrane glavne discipline za ovo natjecanje. Obavijestite WRT da
        je to točno.
      unexpected_results_error: >-
        Postoje rezultati za %{event_id}, ali nije navedeno kao službena
        disciplina. Molimo uklonite događaj iz rezultata ili kontaktirajte WCAT
        kako biste zatražili dodavanje događaja na web stranicu WCA.
      missing_results_warning: >-
        Nema rezultata za %{event_id}, ali je naveden kao službena disciplina.
        Ako je disciplina održana, ponovno prenesite svoj JSON s uključenim
        rezultatima. Ako disciplina nije održana, ostavite komentar za WRT.
    scrambles:
      missing_scrambles_for_round_error: >-
        [%{round_id}] Nedostaju scrambleovi. Upotrijebite Scrambles Matcher da
        dodate ispravne scrambleove u rundu.
      missing_scrambles_for_competition_error: >-
        Nedostaju scrambleovi za natjecanje. Upotrijebite Scrambles Matcher za
        dodavanje scrambleova.
      unexpected_scrambles_for_round_error: >-
        [%{round_id}] Previše scrambleova. Upotrijebite Scrambles Matcher da
        poništite odabir neiskorištenih scrambleova.
      missing_scrambles_for_group_error: >-
        [%{round_id}] Grupa %{group_id}: nedostaju scrambleovi, otkriveno samo
        %{actual} umjesto %{expected}.
      missing_scrambles_for_multi_error: >-
        [%{round_id}] Iako možete imati više grupa u disciplini 3x3x3 višestruko
        naslijepo, barem jedna od grupa mora sadržavati scrambleove za sve
        pokušaje.
      multiple_fmc_groups_warning: >-
        [%{round_id}] Koristi se više grupa FMC-a. Ako je korištena jedna grupa
        FMC-a, upotrijebite Scrambles Matcher kako biste poništili odabir
        neiskorištenih scrambleova. U suprotnom, uključite komentar na WRT
        objašnjavajući zašto je korišteno više grupa FMC-a.
      wrong_number_of_scramble_sets_error: >-
        [%{round_id}] Ova runda ima drugačiji broj setova scramblea od navedenog
        na kartici Upravljanje događajima. Prilagodite broj scramble setova na
        kartici Upravljanje događajima prema broju korištenih setova.
