  merch:
    title: WCA Merch
    paragraphs:
      '1': >-
        WCA ima puno dostupnog mercha! Od majici kratkih rukava, duks trenerki,
        naljepnica, Stackmatova, ruksaka i ostalog! Naši dizajni su konstantno
        ažurirani s klasičnim WCA logotipom, službenim merchom Svjetskih
        prvenstava i dizajnovima svjetskih rekorda.
      '2': >-
        Kupnjom WCA Mercha direktno kroz našu trgovinu najbolje podržavate WCA -
        neprofitnu i većinom volontersku organizaciju. Sav profit od mercha
        koristimo za financiranje natjecanja, opremu i ostale WCA aktivnosti.
      '3': >-
        Možete kupiti merch bilo gdje u svijetu, s trgovinama baziranim u
        Europi, Americi i Indiji te više njih u dolasku!
