      guidelines: Рекомендации
      media_guidelines:
        '1': Всё содержимое медиа должно относиться к выбранному соревнованию.
        '2': >-
          Всё содержимое должно быть соответствующим и не должно содержать
          оскорбительный материал.
        '3': >-
          В медиа не должно присутствовать слишком много рекламы или
          спонсорства.
        '4': Медиа должно иметь подходящий и наглядный заголовок.
