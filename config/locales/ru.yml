          Это применяется только для соревнований, где вы организатор или
          делегат. Вы можете изменить значение для каждого отдельного
          соревнования.
        receive_delegate_reports: >-
          Если вы — Делегат-стажёр, Младший Делегат, Старший Делегат или член
          WRC или WQAC, вы будете получать отчёты Делегатов по умолчанию.
          Примечание: изменение вступит в силу в течение часа.
        otp_attempt: >-
          Откройте настроенное приложение, чтобы получить одноразовый пароль,
          или введите один из ваших кодов восстановления.
      competition:
        name: >-
          Полное название соревнования, включая год в конце (например, Moscow
          North-West Open 2011). Слова лучше писать с большой буквы. Название
          должно содержать только английские буквы, цифры, дефисы (-),
          амперсанды (&), точки (.), двоеточия (:), апострофы (') и пробелы ( ).
        cell_name: >-
          Короткое название для отображения (например, MNW Open 2011 вместо
          Moscow North-West Open 2011). Если обычное название уже довольно
          короткое, можете использовать его и здесь.
        city_name: >-
          Название города, и штат (если применимо), где будет проходить
          соревнование. Не пишите здесь страну. Например,
          <strong>Moscow</strong>, или <strong>San Francisco,
          California</strong>. <br/>Это поле, а также все поля в этой форме
          заполняются по-английски.
        information: >-
          Важная информация, которую следует знать участникам. Она будет
          отображена на главной странице соревнования. <br/>Пожалуйста,
          заполняйте это поле <b>на английском</b> и на других языках, на
          которых говорят ваши участники.
        staff_delegate_ids: WCA Делегат(ы) для этого соревнования.
        trainee_delegate_ids: WCA Делегат(ы)-стажёр(ы) для этого соревнования.
        organizer_ids: >-
          Организатор(ы) этого соревнования (они должны иметь аккаунт, чтобы вы
          могли их здесь перечислить).
