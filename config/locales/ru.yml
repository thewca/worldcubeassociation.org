  faq:
    title: Часто Задаваемые Вопросы
    contact_html: 'Если эти ответы не помогли, %{contact_us}!'
    contact_us: свяжитесь с нами
    search_for_competition: 'Поискать соревнования можно здесь:'
    already_logged_in: Вы уже зашли под WCA аккаунтом.
    create_an_account: 'Вы можете создать аккаунт %{here}.'
    claim_your_wca_id: 'Вы можете затребовать свой WCA ID %{here}.'
    create_an_account_and_claim: >-
      Создайте аккаунт %{here}. После того, как вы залогинитесь, вы сможете
      затребовать свой WCA ID.
    answers:
      '1':
        title: Как мне получить WCA ID и WCA профиль?
        content:
          '1': >-
            Если вы никогда не участвовали в соревнованиях, <a
            href='/competitions'>поучаствуйте</a>! Когда результаты соревнования
            опубликуют, ваши WCA ID и WCA профиль будут созданы автоматически.
      '2':
        title: Как мне найти WCA соревнование?
        content:
          '1': <a href='/competitions'>Здесь</a> список соревнований
      '3':
        title: >-
          Как мне зарегистрироваться на соревнование? К кому мне обращаться,
          если у меня возникнут с этим проблемы?
        content:
          '1': >-
            Многие соревнования используют систему регистрации этого сайта WCA,
            но некоторые используют свою систему. Чтобы узнать подробности, вы
            можете связаться с организаторами соревнований, в которых вы хотите
            принять участие. %{comp_search_form}
      '4':
        title: Какие требования для участия в WCA соревновании? Что мне нужно 
          знать?
        content:
          '1': >-
            Требований для участия не так много. Однако стоит ознакомиться с <a
            href='https://www.worldcubeassociation.org/regulations/translations/russian'>Положениями
            WCA</a> (<a
            href='https://www.worldcubeassociation.org/regulations/'>оригинал на
            английском</a>).
      '5':
        title: Как мне организовать WCA соревнование в своём городе?
        content:
          '1': >-
            Если вы хотите организовать соревнование, рекомендуется для начала
            посетить хотя бы одно или два соревнования, чтобы понимать, что на
            них происходит.
          '2': >-
            На всех WCA соревнованиях должны соблюдаться <a target='_blank'
            href='https://www.worldcubeassociation.org/regulations/translations/russian/'>Положения
            WCA</a>. Команда организаторов не обязана знать их наизусть, однако
            понимание основ поможет организовать соревнования правильно.
          '3': >-
            Команда организаторов должна связаться с ближайшим <a
            target='_blank'
            href='https://www.worldcubeassociation.org/delegates'>WCA
            Делегатом</a>. На официальном соревновании должен быть хотя бы один
            WCA Делегат. Делегат поможет команде организаторов сделать успешное
            соревнование.
          '4': >-
            Больше информации (на английском) можно прочитать <a target='_blank'
            href='https://documents.worldcubeassociation.org/edudoc/organizer-handbook/organizer-handbook.pdf'>здесь</a>.
      '6':
        title: Для чего нужны аккаунты WCA? В чём разница между аккаунтом и 
          профилем?
        content:
          '1': >-
            После того, как вы поучаствовали в первом вашем соревновании, и его
            результаты выложили, у вас появляется WCA ID.
          '2': >-
            Аккаунт WCA нужен для того, чтобы мы знали, что вы это вы. Аккаунт
            позволяет вам добавить аватарку в ваш профиль WCA, а также
            регистрироваться на соревнования. Благодаря аккаунтам никто не
            сможет притворяться вами, регистрируя вас на соревнования, на
            которые вы не собираетесь идти.
          '3': '%{current_user_status}'
      '7':
        title: Как мне поменять аватарку?
        content:
          '1': >-
            Сначала вам нужно <a
            href='#how-do-i-connect-my-wca-account-with-my-wca-id'>создать WCA
            аккаунт и привязать его к WCA ID</a>.
          '2': >-
            Затем откройте <a href='%{profile_edit_path}'>ваш профиль</a>, чтобы
            поменять аватарку.
      '8':
        title: Как мне привязать аккаунт WCA к моему WCA ID?
        content:
          '1': '%{current_user_claim}'
      '9':
        title: >-
          Я зарегистрировался на соревнование на некоторые дисциплины и хочу
          добавить больше дисциплин. Можно это сделать? Можно ли привести
          гостей?
        content:
          '1': >-
            Пожалуйста, свяжитесь с организаторами. Их контактную информацию
            можно найти на сайте соревнования. Если вы не уверены, где найти
            сайт, проверьте <a href='/competitions'>список соревнований</a>.
      results:
        title: Когда выложат результаты соревнования?
        content:
          '1': >-
            После окончания соревнования WCA Делегат обычно проверяет все
            карточки, чтобы избежать ошибок. После проверки результаты
            посылаются Команде Результатов WCA (WRT), ответственной за
            выкладывание результатов и обслуживание базы данных WCA. WRT
            выкладывает результаты довольно быстро.
          '2': >-
            В зависимости от числа участников и личного времени Делегата этот
            процесс может занять до недели. Пожалуйста, имейте терпение.
          '3': >-
            Кроме того, если вы привязали ваш WCA аккаунт к WCA ID (см. ниже),
            вы можете включить уведомление о выкладывании результатов <a
            href='%{preferences_edit_path}'>здесь</a>.
      regulations1:
        title: Допустима ли моя головоломка для сборки на соревнованиях?
        content:
          '1': >-
            Все Положения касательно головоломок можно найти в <a
            href='https://www.worldcubeassociation.org/regulations/translations/russian/#3'>Статье
            3</a>. Все головоломки должны быть одобрены WCA Делегатом. Если вы
            не уверены, спросите Делегата вашего соревнования и на всякий случай
            возьмите запасную головоломку.
      regulations2:
        title: >-
          Можно ли использовать головоломки с магнитами на официальных
          соревнованиях?
        content:
          '1': >-
            Вы можете использовать головоломки с магнитами, если они не
            нарушают  <a target='_blank'
            href='https://www.worldcubeassociation.org/regulations/translations/russian/'>Положения
            WCA</a>. Пожалуйста, обратите особое внимание на пункт <a
            href='https://www.worldcubeassociation.org/regulations/translations/russian/#3h'>3h</a>.
      regulations3:
        title: Я потерял деталь головоломки. Можно ли её использовать?
        content:
          '1': >-
            Такие головоломки использовать нельзя. Головоломки не должны иметь
            повреждений или других различий, позволяющих существенно отличить
            одни элементы головоломок от других (см. <a
            href='https://www.worldcubeassociation.org/regulations/translations/russian/#3j'>Положение
            3j</a>).
      regulations4:
        title: Со скольки лет можно участвовать в соревнованиях?
        content:
          '1': >-
            Минимального возраста нет. Однако несовершеннолетним участникам
            сначала следует спросить разрешения родителей (см. <a
            href='https://www.worldcubeassociation.org/regulations/translations/russian/#2b'>Положение
            2b</a>).
  about:
    title: О WCA
    mission_statement: >-
      Наша миссия: больше соревнований, больше стран, больше веселья и
      участников, которые соревнуются в равных и честных условиях.
    mission_footer: Миссия WCA
    who_we_are_title: Кто мы такие
    who_we_are_content_html: >-
      <p> Всемирная Ассоциация Кубика (WCA) проводит соревнования по
      механическим головоломкам, которые управляются поворачиванием групп
      элементов и которые известны как 'twisty puzzles'. Самой известной из этих
      головоломок является Кубик Рубика, изобретённый профессором Рубиком из
      Венгрии. По некоторым таким головоломкам проводятся официальные дисциплины
      WCA.</p> <p>WCA активно развивалась в последнее десятилетие, и более
      100,000 людей участвовали в наших соревнованиях. Несмотря на такой рост,
      наша организация управляется исключительно волонтёрами, включая
      организаторов, Делегатов и Руководство WCA. Мы очень благодарны каждому,
      кто посвящает своё время тому, чтобы WCA продолжала функционировать. С
      большей финансовой поддержкой мы надеемся выйти на ещё больший уровень
      профессионализма на наших соревнованиях и продолжать проводить больше
      соревнований по всему земному шару.</p>
    spirit: >-
      Наш дух: участники со всего мира весело проводят время в дружеской
      атмосфере, помогают друг другу и ведут себя спортивно.
    spirit_footer: Дух WCA
    our_goals_title: Наши цели
    our_goals_content_html: >-
      <p>WCA, улучшая доступность наших соревнований, хочет давать возможность
      молодёжи по всему миру участвовать и вести наше сообщество. Мы верим, что
      переживания и впечатления на соревнованиях и внутри нашего сообщества
      создают возможности развития для вовлечённой молодёжи, а приобщение новых
      групп людей к головоломкам делает сообщество сильнее. Документ, содержащий
      Видение и Стратегию Руководства WCA, можно найти <a
      href="https://documents.worldcubeassociation.org/documents/WCA_Strategic_Plan.pdf">здесь</a>.</p>
    whats_next_title: Что дальше для WCA?
    whats_next_content_html: >-
      <p>Во Всемирной Ассоциации Кубика более 100,000 участников в 140 странах,
      и мы не планируем останавливаться! Сообщество куберов постоянно растёт с
      момента нашего основания в 2004 г., и мы хотим поощрять рост, улучшать
      доступность соревнований и организовывать их в новых странах. В будущем мы
      надеемся ещё больше поддерживать наше сообщество, сотрудничая с теми и
      охватывая тех, кому небезразличны головоломки.</p>
    world_championship_title: Чемпионат Мира
    world_championship_content_html: >-
      <p>Каждые два года проводится соревнование, которое определяет чемпиона
      мира. Для такого соревнования требуется очень тщательное планирование,
      большой труда волонтёров и финансовые затраты для бронирования помещения и
      других необходимых для организации вещей.</p>
    contributing_title: Внести пожертвование
    contributing_content_html: >-
      Вы можете внести пожертвование с помощью кредитной карты, используя
      Guidestar %{here_credit} или через Paypal %{here_paypal}. Если вы
      предпочитаете выписать чек, адрес следующий:
    tax_deductible_note: Пожертвования можно вычесть из налогов в США.
    other_help_title: Другие способы помочь
    other_help_content_html: >-
      <p>Если вы уверены, что можете помочь WCA нефинансово, мы будем рады!
      Пожалуйста, свяжитесь с нами, написав сюда: <a
      href="mailto:communication@worldcubeassociation.org">communication@worldcubeassociation.org</a>.</p>
    donation_banner:
      content: >-
        Всемирная Ассоциация Кубика (WCA) является освобожденной от налогов
        организацией 501(c)(3). Мы являемся некоммерческой организацией и
        приветствуем пожертвования, благодаря которым мы можем проводить больше
        соревнований во всём мире.
      donate_credit: Внести пожертвование с помощью кредитной карты
      donate_paypal: Пожертвовать с помощью Paypal
      donate_other: Другие способы внести пожертвование
    structure:
      teams_committees_councils: 'Команды, Комитеты и Советы WCA'
      title: Структура
      board:
        name: Совет Директоров WCA
        description: >-
          Руководство WCA ответственно за ведение организации в целом и
          выполнение всех обязанностей, которые не осуществляются другими
          Командами, Комитетами и Консультативным Советом
      committees: >-
        Комитеты и команды WCA являются неотъемлемой частью организации и
        выполняют повседневные задачи, необходимые для её функционирования. Эти
        комитеты состоят из членов сообщества, включая Делегатов WCA и
        участников. В каждой команде есть лидер, чья роль заключается в
        обеспечении надлежащего функционирования команды и руководить другими
        членами команды. Консультативный Совет является особым типом команды,
        которая выполняет консультативную роль при Руководстве WCA и состоит из
        членов сообщества, а не Сотрудников WCA. При наличии вакансий в
        комитетах, командах или Консультативном Совете информация о том, как
        подать заявку, публикуется на главной странице.
      senior_member: Старший член
      leader: Лидер
      officers:
        name: Должностные лица WCA
        description: >-
          Должностные лица WCA решают задачи, связанные с некоммерческим
          статусом WCA. Эти лица выбираются Руководством WCA. Исполнительный
          Директор является Главным Управляющим WCA, Председатель осуществляет
          контроль на заседаниях Руководства WCA, Секретарь занимается
          документами организации, а Казначей управляет финансовыми вопросами
          WCA.
      chair:
        name: Председатель WCA
      executive_director:
        name: Исполнительный Директор WCA
      secretary:
        name: Секретарь WCA
      vice_chair:
        name: Заместитель Председателя WCA
      treasurer:
        name: Казначей WCA
      users:
        profile: 'Профиль %{user_name}'
      wdc:
        name: Дисциплинарный комитет WCA
        description: >-
          Этот комитет даёт советы Руководству WCA в специальных случаях,
          например, предположительные нарушения Положений WCA. С ним могут
          связаться участники WCA в случае важных личных дел, связанных с WCA
          соревнованиями.
      wdpc:
        name: Комитет по Защите Данных WCA
        description: 'Этот комитет ответственен за всё, связанное с Защитой Данных.'
      wrc:
        name: Комитет Положений WCA
        description: Этот комитет занимается Положениями WCA.
      wrt:
        name: Команда Результатов WCA
        description: Эта команда ответственна за обработку результатов 
          соревнований.
      wst:
        name: Команда Программного обеспечения WCA
        description: >-
          Эта команда ответственна за разработку и управление программным
          обеспечением WCA (сайт, генератор скрамблов и т.д.)
      wct:
        name: Команда Коммуникаций WCA
        description: >-
          Коммуникационная группа WCA (WCT) создана для того, чтобы наблюдать и
          поддерживать коммуникаций WCA с Сообществом и широкой общественностью.
          Коммуникация WCA должна способствовать достижению Целей WCA и
          поддерживать общую положительную культуру дружелюбия, прозрачности,
          вовлеченности, открытости и отзывчивости.
      wfc:
        name: Финансовый Комитет WCA
        description: Эта команда ответственна за управление финансами WCA
      wec:
        name: Комитет по Этике WCA
        description: >-
          Роль этого комитета в том, чтобы обеспечить гарантии того, что все
          процедуры, выполняемые персоналом WCA и внешними сотрудниками, следуют
          Кодексу этики WCA, а также выполнять независимые расследования, если
          поведение кого-либо из персонала или сотрудников не соответствует
          этому Кодексу этики. Такие расследования могут быть запрошены любым
          Зарегистрированным Спидкубером, имеющим доверие WEC. Этот комитет
          также играет роль апелляционного суда, если с решением WDC не согласен
          кто-то из замешанных лиц.
      weat:
        name: Команда Помощников Директоров WCA
        description: >-
          Эта команда ответственна за административные задачи Совета Директоров
          WCA.
      wqac:
        name: Комитет по обеспечению качества WCA
        description: >-
          Этот комитет должен поддерживать и поощрять постоянное повышение
          качества в рамках WCA, а также во всем мире применять стандарты
          качества для обеспечения постоянного высокого качества процессов,
          персонала WCA, региональных организаций, организаторов соревнований и
          персонала соревнований.
      wcat:
        name: Команда Анонсов Соревнований WCA
        description: >-
          Эта команда ответственна за одобрение и анонсы соревнований WCA, а
          также за обеспечение высоких стандартов качества этих анонсов.
      wmt:
        name: Команда Маркетинга WCA
        description: >-
          Эта команда ответственна за развитие и управление Марки WCA, поиск
          спонсоров, оснащение оборудованием и сбыт товаров WCA.
      wac:
        name: Консультативный Совет WCA
        description: >-
          Этот совет ответственен за формирование и поддержку коммуникации между
          Сообществом WCA и Персоналом WCA.
      wsot:
        name: Команда Спортивной Организации WCA
        description: >-
          Эта команда ответственна за поддержку признания WCA международной
          спортивной организацией.
      wat:
        name: Архивная Команда WCA
        description: >-
          Архивная Команда WCA является консультативным комитетом WCA. Задача
          этой команды — контроль и поддержка разработки архива организации.
      banned:
        name: Забаненные участники
      wct_china:
        name: WCT Китай
      operations_html: '%{committees_and_teams} WCA выполняют повседневные операции.'
      teams_committees: Команды и Комитеты
      probation:
        name: Делегаты на испытательном сроке
      wst_admin:
        name: Администраторы программного обеспечения
      delegates_html: >-
        <p><strong>Делегат WCA</strong> — это роль, определяемая Дополнениями к
        Уставу WCA и описанная в Положениях WCA. Главная задача Делегата —
        наблюдать за соревнованиями, проходящими под эгидой WCA. WCA Делегат
        ответственен за то, чтобы все WCA Соревнования проходили в соответствии
        с Миссией, Духом и Положениями WCA. Существуют <strong>Старшие
        Делегаты</strong>, <strong>Региональные Делегаты</strong>,
        <strong>Делегаты</strong>, <strong>Младшие Делегаты</strong> и
        <strong>Делегаты-стажёры</strong> %{see_link}.</p> <p>Старшие Делегаты и
        Региональные Делегаты, помимо обязанностей обычного Делегата, ещё и
        управляют Делегатами в своём регионе, к ним также могут обращаться
        сообщества по региональным вопросам.</p> <p>Новые Делегаты становятся
        сначала Младшими Делегатами, им нужно показать, что они способны успешно
        управлять соревнованиями, прежде чем они станут полноценными
        Делегатами.</p> <p>Делегаты-стажёры проходят обучение, чтобы занимать
        позицию WCA Делегата и могут управлять только теми соревнованиями, на
        которых присутствует WCA Делегат.</p>
      see_link_html: '(см. %{link})'
      members_html: >-
        Все участники соревнований автоматически становятся <strong>участниками
        WCA</strong> во время их первого соревнования.
