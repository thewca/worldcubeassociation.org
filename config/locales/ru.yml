          Введите имя и фамилию участника полностью по-английски, например,
          <strong>Anton Rostovikov</strong>. Неправильные варианты: <strong>a
          rostovikov</strong>, <strong>Антон Ростовиков</strong>,
          <strong>Antoshka Rostovikov</strong>, <strong>ANTON
          ROSTOVIKOV</strong>. Если у вас есть заграничный паспорт, рекомендуем
          ввести имя в соответствии с ним. При желании, можно написать в скобках
          вариант имени на местном языке, например, <strong>Anton Rostovikov
          (Антон Ростовиков)</strong>
