  incidents_log:
    i18n_disclaimer: >-
      Обратите внимание, что инциденты доступны только на английском, их
      содержание не переводится на другие языки.
    incident: 'Инцидент:'
  about_regulations:
    title: О Положениях
    panel1:
      title: Положения
      content1_html: >-
        На соревнованиях должны соблюдаться <a href="/regulations/">Положения
        WCA</a>. Важно, чтобы участники прочитали их перед их первым
        соревнованием.
      content2_html: >-
        К Положениям WCA также прилагаются <a
        href="/regulations/guidelines.html">Дополнения</a>, которые содержат
        дополнительные уточнения и объяснения.
      content3_html: >-
        Важные решения об инцидентах, произошедших на соревнованиях WCA и
        решённых Комитетом по Положениям WCA, находятся в <a
        href="/incidents">Журнале инцидентов</a>.
    panel2:
      title: Переводы
      content1_html: >-
        Положения WCA доступны только на английском, но участники WCA перевели
        их на несколько языков: <a
        href="/regulations/translations/">Переводы</a>.
      content2_html: >-
        <strong>Важно</strong>: хотя переводы полезны, они не являются
        официальными. В случае противоречия английская версия имеет приоритет.
    panel3:
      title: Часто Задаваемые Вопросы по Положениям
      content1_html: >-
        <a href="/faq">Здесь</a> вы найдёте ответы на часто задаваемые вопросы о
        Положениях WCA.
    panel4:
      title: Рекомендации организаторам соревнований
      content1_html: >-
        Если вы хотите или уже планируете организовать соревнование, пожалуйста,
        прочтите <a href="https://documents.worldcubeassociation.org/edudoc/organizer-handbook/organizer-handbook.pdf">Рекомендации
        организаторам
        соревнований</a>
      content2_html: >-
        Этот документ содержит важную информацию, и каждому организатору
        соревнований следует его прочитать.
  regulations_translations:
    title: 'Положения и Дополнения WCA: Переводы'
    paragraph1: >-
      Если английский не является вашим родным языком, вы можете посмотреть
      переводы.
    paragraph2: >-
      Обратите внимание, что переводы не являются официальными, хоть они и
      расположены на сайте WCA. Они предоставляются без каких-либо гарантий.
      Если перевод противоречит текущей официальной английской версии, последняя
      имеет приоритет.
    translations: Переводы
    current: Текущие
    old: Старые
    table_elements:
      version: Версия
      language: Язык
    translating: Новые переводы Положений
    paragraph3_html: >-
      Если вы хотите добавить или обновить перевод, пожалуйста, прочтите <a
      href="https://github.com/thewca/wca-regulations-translations#translation-instructions">инструкции
      на GitHub</a>.
