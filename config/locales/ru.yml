    see_all_announcements: Смотреть все объявления
    about_us:
      title: О нас
      text: >-
        Всемирная Ассоциация Кубика управляет соревнованиями по сборке
        механических головоломок, которые решаются с помощью перестановок групп
        элементов, также известных как "twisty puzzles".
    competitions:
      title: Соревнования
      text_html: >-
        Узнайте о соревнованиях рядом с вами или о результатах соревнований.
        Хотите узнать результаты соревнований, которые проходят прямо сейчас?
        Переходите на %{wca_live_link}!
    merchandise:
      title: Мерч
      ad_new: New
      text_html: >-
        Ознакомьтесь с нашей официальной продукцией, включающей в себя различную
        одежду от футболок до худи.
      link_title: Ссылка в магазин
    records:
      title: Рекорды
      text: Посмотрите текущие и прошлые рекорды всех официальных дисциплин WCA.
    faq:
      title: FAQ
      text: >-
        Взгляните на наш список часто задаваемых вопросов, если вам нужна
        помощь. Здесь уже есть ответы на многие вопросы.
    contact:
      title: Контакты
      text_html: >-
        Если вы хотите связаться с нами, вы можете сделать это через контактную
        форму. Если у вас есть другие вопросы, связанные с WCA, убедитесь, что
        вы посмотрели наш %{faq_link}!
      faq: список частых вопросов
      button: Открыть Контактную форму WCA
    support:
      title: Поддержать WCA
      text: >-
        Всемирная Ассоциация Кубика — это организация, освобождённая от налогов
        501(c)(3). Как 100% добровольческая некоммерческая организация, мы будем
        рады вашим пожертвованиям, которые помогут нам в нашем видении о более
        приятных соревнованиях по всему миру.
      button: 'Узнать больше о том, как поддержать WCA'
