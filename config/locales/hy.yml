        տրվող հարցերին</a>: Եթե ցանկանում եք կապ հաստատել այստեղ չնշված որևէ կոմիտեի
        կամ թիմի հետ, կարող եք ստուգել նրանց տվյալները <a href="/teams-committees">այստեղ</a>:'
      success_message: Էլ․նամակն ուղարկված է։ Մենք շուտով կկապնվենք ձեզ հետ։
      prefilled: Գրանցումը թարմացնելու համար անհրաժեշտ է կապ հաստատել մրցույթի
