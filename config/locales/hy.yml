          Նշենք, որ գրանցումները չեն հաստատվում ավտոմատ կերպով, այսինքն խնդրում
          ենք լինել համբերատար եթե ձեր գրանցումը մի անգամից չընդունվի։ Հնարավոր է
          պետք են լրացուցիչ քայլեր մինչև ձեր գրանցման հաստատվելը։ Գրանցման
          հաստատման չափանիշները տեսնելու համար այցելեք առաջնության կայք կամ դիմեք
