  page:
    translators:
      title: Թարգմանիչներ
    officers_and_board:
      title: WCA Պաշտոնատար անձինք և Խորհուրդ
      officers_description: WCA Պաշտոնատար անձինք զբաղվում են WCA-ի շահույթ
        չհետապնդող կարգավիճակի վերաբերյալ հարցերով։ Այս պաշտոնատար անձինք ընտրվում
        են WCA Խորհրդի կողմից։ Գործադիր տնօրենը WCA Գլխավոր գործադիր տնօրենն է,
        Նախագահը ներկա է Խորհրդի բոլոր հանդիպումներին, Քարտուղարը զբաղվում է
        կազմակերպության փաստաթղթերով, և Գանձապահը կառավարում է WCA-ի բոլոր
        ֆինանսական հարցերը։
      board_description: WCA Խորհուրդը պատասխանատու է կազմակերպության ընդհանուր
        ղեկավարման համար, և լրացնում է բոլոր այն պարտականությունները որոնք չեն
        արվում այլ Թիմերի և Կոմիտեների կողմից
    teams_committees_councils:
      title: WCA Թիմեր և Կոմիտեներ
      description: 'WCA-ի թիմերն ու կոմիտեները կազմակերպության անբաժանելի մասն են կազմում
        և կատարում են դրա գործունեությունը պահպանելու համար անհրաժեշտ ամենօրյա առաջադրանքները:
        Այս կոմիտեները կազմված են WCA համայնքի անդամներից, այդ թվում՝ WCA պատվիրակներից
        և մասնակիցներից: Յուրաքանչյուր թիմ ունի առաջնորդ, որի դերն է ապահովել թիմի պատշաճ
        գործունեությունը և ուղղորդել թիմի մյուս անդամներին: Երբ թիմում կամ կոմիտեում
        թափուր տեղեր կան, դիմելու կարգի մասին տեղեկատվությունը տեղադրված է առաջին էջում:'
      contact_button: Կոնտակտ
      no_contact_description: Այս թիմի/կոմիտեի կոնտակտային տվյալները հանրությանը
        հասանելի չեն։
      groups_name:
        wat: WCA Արխիվացման Թիմ
        wct: WCA Հանրային Կապերի Թիմ
        wcat: WCA Առաջնությունների Հայտարարման Թիմ
        wic: WCA Ինտեգրման Կոմիտե
        weat: WCA Գործադրի Օգնականների Թիմ
        wfc: WCA Ֆինանսական Կոմիտե
        wmt: WCA Մարկետինգի Թիմ
        wmct: WCA Մեծ Մրցաշարերի Թիմ
        wqac: WCA Որակի Վերահսկման Կոմիտե
        wrc: WCA Կանոնների Կոմիտե
        wrt: WCA Արդյունքների Թիմ
        wst: WCA Ծրագրային Թիմ
        wsot: WCA Սպորտային Կազմակերպության Թիմ
        wapc: WCA Բողոքարկման Կոմիտե
      groups_description:
        wat: 'WCA Արխիվացման Թիմը (անգլերեն՝ WCA Archive Team, կրճատ՝ WAT) կառավարում
          է WCA-ի պատմական արխիվի մշակումն ու պահպանումը: Նրանք փաստաթղթավորում են սփիդքյուբինգի
          հիմնական իրադարձությունները և WCA-ի նշանակալի նվաճումները, որոնք ներկայացվում
          են որպես WCA-ի ավելի լայն ժամանակացույցի մաս՝ սփիդքյուբինգի ոլորտում WCA-ի
          ժառանգությունը պահպանելու համար:'
        wct: 'WCA Հանրային Կապերի Թիմը (անգլերեն՝ WCA Communication Team, կրճատ՝ WCT)
          վերահսկում և աջակցում է WCA-ի հաղորդակցությունը համայնքի և լայն հանրության
          հետ: WCA-ի հաղորդակցությունը պետք է նպաստի WCA-ի նպատակներին և աջակցի բարյացակամության,
          թափանցիկության, ներառականության, բացության և արձագանքողականության ընդհանուր
          դրական մշակույթին:'
        wcat: 'WCA Առաջնությունների Հայտարարման Թիմը (անգլերեն՝ WCA Competition Announcement
          Team, կրճատ՝ WCAT) հաստատում և հայտարարում է WCA պատվիրակների կողմից ներկայացված
          WCA մրցույթները և ապահովում է, որ այդ հայտարարությունները համապատասխանեն WCA
          որակի չափանիշներին: Այս թիմը նաև պատասխանատու է մրցույթների ներկայացման պատշաճ
          արձանագրության պահպանման համար՝ հիմնվելով այնպիսի փաստաթղթերի վրա, ինչպիսիք
          են WCA մրցույթների պահանջների քաղաքականությունը (անգլերեն՝ WCA Competition
          Requirements Policy): WCAT-ը պատասխանատու չէ անհատական մրցույթների կազմակերպման
          և պատվիրակման համար:'
        wic: 'WCA-ի Ինտեգրման Կոմիտեն (անգլերեն՝ WCA Integrity Committee, կրճատ՝ WIC)
          անկախ հետաքննություններ է անցկացնում WCA համայնքի անդամների և WCA մրցումների
          ժամանակ կամ WCA-ի պաշտոնական, առցանց հարթակներում տեղի ունեցած միջադեպերի
          վերաբերյալ: Այս միջադեպերը WCA-ի արժեքների, վարքագծի կանոնագրքի, էթիկայի կանոնագրքի
          և/կամ կանոնակարգերի ենթադրյալ խախտումներ են:'
        weat: 'WCA Գործադրի Օգնականների Թիմը (անգլերեն՝ WCA Executive Assistants Team,
          կրճատ՝ WEAT) իրականացնում է WCA-ի տնօրենների խորհրդի վարչական գործառույթները:'
        wfc: 'WCA Ֆինանսական Կոմիտեն (անգլերեն՝ WCA Financial Committee, կրճատ՝ WFC)
          կառավարում է WCA-ի ընդհանուր ֆինանսները, ներառյալ բյուջետավորումը, հաշվետվությունները,
          վերլուծությունը, հաշվապահությունը և հարկային հաշվետվությունները: Նրանք նաև
          կառավարում են WCA-ի ամենամեծ եկամտի աղբյուրը՝ WCA վճարային համակարգը, ինչպես
          նաև տարբեր ֆինանսավորման ծրագրեր, որոնք աջակցում են տեղական համայնքներին զարգացման
          տարբեր փուլերում, ներառյալ Ճանապարհորդության ֆինանսավորում, Սարքավորումների
          ֆինանսավորում և տարածաշրջանային կազմակերպության աջակցություն:'
        wmt: WCA Մարկետինգի Թիմը (անգլերեն՝ WCA Marketing Team, կրճատ՝ WMT)
          կառավարում է WCA ապրանքանիշը, փնտրում է հովանավորներ և զբաղվում է WCA
          մերչենդայզի մարկետինգով։
        wmct: WCA Մեծ Մրցաշարերի Թիմ (անգլերեն՝ WCA Major Championship Team,
          կրճատ՝ WMCT) վերահսկում է WCA մայրցամաքային և աշխարհի առաջնությունների
          համակարգումն ու առաջընթացը՝ մշակելով ուղեցույցներ և ռազմավարական
          պլաններ, կառավարելով ընդունող քաղաքի ընտրությունը, աջակցելով
          կազմակերպչական թիմերին և ապահովելով առաջնության անցկացման կայուն
          փորձառություն։
        wqac: WCA Որակի Վերահսկման Կոմիտե (անգլերեն՝ WCA Quality Assurance
          Committee, կրճատ՝ WQAC) խթանում է WCA-ի շրջանակներում որակի շարունակական
          բարելավումը, ինչպես նաև որակի համաշխարհային ստանդարտների կիրառումը՝
          գործընթացների, WCA կամավորների, տարածաշրջանային կազմակերպությունների,
          մրցույթների կազմակերպիչների և մրցույթների կամավորների հետևողական բարձր
          որակն ապահովելու համար։
        wrc: WCA Կանոնների Կոմիտեն (անգլերեն՝ WCA Regulations Committee, կրճատ՝
          WRC) զբաղվում է WCA Կանոնակարգերի կիրառման, կատարելագործման և զարգացման
          հետ կապված բոլոր հարցերով։ Նրանք աջակցում են WCA պատվիրակներին
          մրցումների ընթացքում տեղի ունեցող ցանկացած ընթացակարգային հարցի
          վերաբերյալ և որոշումներ են կայացնում չլուծված և չկանոնակարգված
          միջադեպերի վերաբերյալ։
        wrt: WCA Արդյունքների Թիմը (անգլերեն՝ WCA Results Team, կրճատ՝ WRT)
          կառավարում է WCA-ի տվյալների բազաների բոլոր տվյալները, ներառյալ
          մրցույթների արդյունքները և անձանց տվյալները։
        wst: 'WCA Ծրագրային Թիմը (անգլերեն՝ WCA Software Team, կրճատ՝ WST) կառավարում
          է WCA-ի ծրագրային ապահովումը (կայք, սկրամբլերներ, աշխատանքային տետրեր (workbooks),
          վարչական գործիքներ (admin tools):'
        wsot: WCA Սպորտային Կազմակերպության Թիմը (անգլերեն՝ WCA Sports
          Organization Team, կրճատ՝ WSOT) վերահսկում և աջակցում է WCA-ի՝ որպես
          միջազգային սպորտային կազմակերպության ճանաչմանը։
        wapc: 'WCA Բողոքարկման Կոմիտեն (անգլերեն՝ WCA Appeals Committee, կրճատ՝ WAC)
          քննարկում և լուծում է WCA-ի այլ կամավորների կողմից կայացված որոշումների վերաբերյալ
          բողոքարկումները: WAC-ն ապահովում է անկախ և անաչառ վերանայման գործընթաց որպեսզի
          որոշումները լինեն արդար, ողջամիտ և համապատասխանեն WCA քաղաքականությանը և կանոնակարգերին:'
    contacts:
