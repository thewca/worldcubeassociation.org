      mark: '*'
    error_notification:
      default_message: 'Prosím, pozrite si problémy uvedené nižšie:'
    hints:
      incident:
        title: 'Nezabudnite, že toto je verejné, čiže to musíte vyplniť v angličtine!'
        private_description: >-
          Popis incidentu, ktorý bude videný len Delegátmi. Prosím, vyplňte toto
          v angičtine.
        private_wrc_decision: >-
          Finálne rozhodnute WRC obsahujúce súkromné detaily. Prosím, vyplňte
          toto v angličtine.
        public_summary: >-
          Celkový popis incidentu a jeho rozhodnutia, bude videný verejne.
          Prosím, vyplňte toto v angličtine.
      user:
        dob: Napíšte váš dátum narodenia vo formáte YYYY-MM-DD
        name: >-
          Napíšte svoje celé meno správne, napríklad <strong>Stefan
          Pochmann</strong>. Nie nepresne ako <strong>s pochman</strong>.
          Stredné mená (buď celé alebo ako iniciálky) sú voliteľné.
        pending_avatar: >-
          Po tom, ako nahráte svojho nového Avatara, budete musieť počkať,
          pokiaľ ho Výsledkový Tím WCA schváli.
      competition:
        name: >-
          Celé meno súťaže aj s rokom na konci(napr. Danish Open 2016).Dávajte
          si pozor, aby meno bolo kapitalizované. Meno musí obsahovať iba
          alfanumerické znaky, pomlčky(-), ampersandy(&), bodky(.),
          dvojbodky(:), apostrofy(') a medzery( ).
        cell_name: >-
          Krátke meno pre súťaž, na zobrazenie. Ak je meno súťaže dostatočne
          krátke, môžete ho znovu použiť(napr. Europe 2006).
        city_name: >-
          Meno mesta a štátu(ak je), kde sa súťaž bude nachádzať. Nepíšte
          krajinu(napr. Paris ALEBO San Francisco, Kalifornia)
        information: >-
          Informácie o limite súťažiacich, vstupných poplatkoch pre súťažiacich
          a divákov a iné detaily relevantné pre ľudí, ktorí maju záujem v
          zúčastnení sa súťaže.
        staff_delegate_ids: WCA delegáti pre túto súťaž.
        organizer_ids: >-
          Organizátori súťaže(potrebujú mať účet, na to aby mohli byť
          organizátormi)
        external_website: Webová stránka súťaže. Musí mať pravý http(s) url.
        registration_open: 'Poznámka: Otvorenie a zatvorenie súťaže sú v čase UTC.'
        base_entry_fee_lowest_denomination: >-
          Základný vstupný poplatok pre súťaž. Vstupný poplatok bude ukázaný na
          informačnej stránke súťaže a tiež na registračnej stránke(ak je
          použitá).
        currency_code: Kód meny pre vstupné poplatky.
        competitor_limit_enabled: >-
          Pre teraz je toto číslo iba pre informačné použitie a nepreventuje
          registrácie ostatných ľudí. Pracujeme na pridávaní podpory na
          zrýchlenie registrácie, ale vyžaduje si to inú prácu.
        competitor_limit: Počet súťažiacich povolených na túto súťaž.
        competitor_limit_reason: >-
          Aký je dôvod na takýto limit súťažiacich? Vyplňte toto prosím v
          angličtine.
      website_contact:
      dob_contact:
        dob: Váš správny deň narodenia vo formáte YYYY-MM-DD
        document: >-
          Aby ste nám dokázali svoju identitu a správny dátum narodenia, musíte
          pripojiť fotku hociakého legálneho dokumentu (ID karta, vodičský
          preukaz, šutdentská karta, pas, rodný list,...). Musí tam byť
          viditeľné meno a dátum narodenia a musí to byť pochopiteľné pre
          Anglicky hovoriaceho človeka (alebo kontaktuje miestneho Delegáta WCA
          ak nemáte taký dokument).
      post:
        body: >-
          Použite &lt;!-- break --&gt; aby ste ukázali ukážku domácej stránky.
          Hocijaký post na domovskej stránke ukáže celý text pred deličom.
          Skutočný príspevok ukáže celý text.
        show_on_homepage: >-
          Pozor! Toto nie je bezpečné pre súkromné dáta. Toto je iba na
          prevenciu toho, aby na domácej stránke nebol chaos. Posty, ktoré nie
          sú ukázané na domovskej stránke sú stále dostupné verejnosti cez linky
          alebo tagy.
      delegate_report:
        schedule_url: >-
          Celý link zverejneného rozvrhu(napr.
          https://www.cubingusa.com/usnationals2016/schedule.php)
        equipment: >-
          Počet a typ timerov a displejov použitých v súťaži. Prosím, vymažte
          čiary zariadení, ktoré nebudete používať.
        venue: >-
          Napíšte niečo o miestnosti(mistnostiach), verejnom prístupe,
          distribúcíi zón(skladanie, miešanie, čakanie, zapisovaní skóre), ak
          ste pripravili viaceré dejiská, problémy ktoré sa vyskytli(napríklad
          hluk) a ako ste ich vyriešili...Prosím, buďte stručný a nepíšte
          nepravdivé veci.
        organization: >-
          Napíšte niečo o organizačnom tíme a ako pracovali na súťaži, ak
          poznáte ich minulosť a či ste si všimli pokrok na ich práci, či boli
          profesionálni a aktívni v dňoch súťaže, problémy, ktoré sa
          vyskytli(napr. nedodržiavanie rozvrhu-oneskorenie) a ako ste ich
          vyriešili...Prosím, buďte struční a nepíšte nepravdivé veci.
        incidents: >-
          Napíšte nám o nejakých incidentoch, ktoré si myslíte, že stoja za to
          byť spomenuté. Očíslujte incidenty, počínajúc 1, čiže ostatní delgáti
          ich môžu okomentovať svojimi číslami. Prosím, uistite sa že spomínate
          iba dôležité veci, nie bežné veci (napr. bežné +2 alebo DNF). Nebojte
          sa opýtať pre spätnú väzbu delegátov alebo WRC. Ak by chceli zapojiť
          WDC, uistite sa že sa opýtate skoro.
        remarks: >-
          Napíšte o nejakých iných detailov, ktoré by ste chceli spomenúť(napr.
          zlepšenie/zhoršenie v komunite, budúce plány pre tento región). Ak ste
          kvôli stručnosti niečo vynechali v predošlých sekciách, nebojte sa ich
          napísať sem.
      competition_tab:
        name: 'Príklady:Cestovanie, Platenie, Ceny, Ubytovanie'
      person:
        dob: Dátum narodenia by mal mať formát YYYY-MM-DD.
