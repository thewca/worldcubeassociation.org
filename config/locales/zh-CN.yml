  media_and_instagram:
    #original_hash: 1e9793e
    page_title: 上传媒体和Instagram
    general_media_submission:
      #original_hash: 2b4c8c8
      title: 上传一般媒体
      #original_hash: 670a1a8
      body_html: WCA 会在<a href="/media">媒体页面</a>与社区分享比赛中的精彩照片和文章。如果您有内容希望分享，请使用<a href="/media/new">普通媒体提交表单</a>！
    instagram_submission:
      #original_hash: e01c612
      title: 上传Instagram
      #original_hash: 1acd0d2
      paragraph1_html: >-
        正如你可能已经看到的，WCA 有一个活跃的 <a
        href="https://www.instagram.com/thewcaofficial/">Instagram!</a>
        为了更好地展现全球魔方社区，我们会发布世界各地魔方爱好者提交的内容。
      #original_hash: 9b6abcd
      paragraph2: >-
        如果你有高质量的照片或视频希望我们发布，请点击下方按钮并填写表单。你必须拥有内容的全部使用权，并授权 WCA
        进行发布。由于我们收到的投稿很多，无法发布所有内容。以下建议可以提高你的内容被采用的可能性。
      #original_hash: cf5c955
      photo_quality: 确保照片/视频质量良好。它不一定是专业拍摄的，但质量不应该有损于照片或视频。
      #original_hash: 0742378
      photo_interest: 尽量让内容对广泛的受众具有吸引力。只有少数人感兴趣的内容可能不适合在此发布。
      #original_hash: 497bc27
      wca_related: 发布与 WCA 有关的照片和视频，这是我们账号发布的主要内容。我们喜欢看到魔友们享受其中！
      #original_hash: af882f2
      submit_instagram_content: 提交 Instagram 内容
    instagram_hosting:
      #original_hash: 5156783
      title: 主持Instagram
      #original_hash: 541106b
      paragraph1_html: 有时，我们会邀请参加比赛的社区成员主持WCA官方Instagram快拍！如果您有兴趣，请点击下方按钮并填写表单。表单信息填写完整并通过审核后，WCA传播组会联系您。如有任何问题，请<a href="https://www.worldcubeassociation.org/contact/website">联系我们</a>。
      #original_hash: aca6c32
      paragraph2: 我们希望分享参赛者的个人故事和比赛内容。这不应成为您在比赛周末的负担，因此请先享受比赛，再进行分享。
      #original_hash: af023ed
      paragraph3: 主持人的任务概括如下：
      #original_hash: 21efafe
      short_intro: 做个简短介绍，分享您自己以及比赛。
      #original_hash: a053b5a
      venue_feel: 拍摄一些能够展现赛场氛围和现场人群的短片，例如比赛区或参赛者等候区的画面
      #original_hash: d17fb2f
      people_solving: 尝试拍摄正在比赛的参赛者（如果可以，优先拍摄在主项目中速度较快的参赛者）
      #original_hash: 76d2358
      mini_interviews: 您可以尝试拍摄简短采访，请主办方、代表等谈谈他们对比赛的感受
      #original_hash: 6003b20
      pictures_too: 您也可以发送照片，不一定只能提交视频
      #original_hash: 8813619
      paragraph4: 我们在比赛周末通常使用WhatsApp群组沟通。请确认您熟悉该平台；如果无法使用，请告诉我们，以便安排其他沟通方式。
      #original_hash: 38191c1
      apply_to_host: 申请主持
    other_suggestions:
      #original_hash: 730873b
      title: 其他建议？
      #original_hash: aa7ab5c
      body_html: 您对Instagram或其他社交媒体内容还有其他建议吗？<a href="https://www.worldcubeassociation.org/contact/website">请告诉我们</a>！
