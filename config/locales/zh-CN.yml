        <strong>WCA代表</strong>作为WCA成员，负责确保所有WCA比赛按照WCA的宗旨、规则和精神进行。代表包括<strong>WCA高级代表</strong>、<strong>WCA代表</strong>、<strong>WCA初级代表</strong>和<strong>WCA实习代表</strong>%{see_link}。WCA高级代表还负责管理所在区域的所有代表，并处理当地社区问题。新任代表需要经历实习期，在展示出必要能力后才能成为正式WCA代表。
