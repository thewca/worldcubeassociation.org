  page:
    translators:
      #original_hash: 959d354
      title: 翻译者
    officers_and_board:
      #original_hash: c9bae18
      title: WCA干事与董事会
      #original_hash: 312e799
      officers_description: >-
        WCA董事负责处理与WCA非营利地位相关的任务。这些董事由WCA董事会选举产生。执行董事是WCA的首席执行官，主席主持所有董事会会议，秘书负责维护组织文件，财务主管管理WCA的财务事务。
      #original_hash: 19d4bbb
      board_description: WCA董事会负责领导整个组织，并履行其他团队、委员会和理事会未履行的任何职责。
    teams_committees_councils:
      #original_hash: 1d14e2f
      title: WCA团队、委员会和理事会
      #original_hash: 9fdee8f
      description: >-
        WCA的团队和委员会是组织不可分割的一部分，执行保持其运作所需的日常任务。这些委员会由WCA社区成员组成，包括WCA代表和参赛人员。每个团队都有一个领导者，其作用是确保团队的正常运作并指导其他团队成员。理事会是一种特殊类型的团队，为WCA董事会发挥咨询作用，由社区成员组成，而不是WCA工作人员。当有委员会、团队或理事会空缺时，有关如何申请的信息会发布在首页上。
      #original_hash: b37456c
      contact_button: 联系
      #original_hash: ae7928f
      no_contact_description: 这个团队/委员会的联系方式是非公开的。
      groups_name:
        #original_hash: 90a1280
        wat: WCA档案组 (WAT)
        #original_hash: 63a2388
        wct: WCA通讯组 (WCT)
        #original_hash: 2b81984
        wcat: WCA比赛公示组 (WCAT)
        #original_hash: 94c2e42
        wic: WCA廉政委员会 (WIC)
        #original_hash: d1dbb86
        weat: WCA董事会助理团队 (WEAT)
        #original_hash: 9cb13de
        wfc: WCA财务委员会 (WFC)
        #original_hash: 2035811
        wmt: WCA市场营销组 (WMT)
        #original_hash: 8f32116
        wqac: WCA质量保证委员会 (WQAC)
        #original_hash: 3da1e85
        wrc: WCA规则委员会 (WRC)
        #original_hash: 67be768
        wrt: WCA成绩组 (WRT)
        #original_hash: a14bc62
        wst: WCA软件组 (WST)
        #original_hash: 58765c7
        wsot: WCA体育组织团队 (WSOT)
        #original_hash: 78949a7
        wapc: WCA申诉委员会 (WAPC)
        #orginal_hash: c90653c
        wmct: WCA大型锦标赛组 (WMCT)
      groups_description:
        #original_hash: 5b1aade
        wat: >-
          WCA档案组负责建设和维护WCA历史档案。该组会记录重要的速拧事件和WCA里程碑，并将其整理到WCA时间线中，以保留WCA在速拧领域的历史。
        #original_hash: 50fd091
        wct: >-
          该组负责世界魔方协会与魔方爱好者及社会公众之间的联系与沟通。沟通与推广工作有助于实现世界魔方协会的目标，并营造友好、透明、包容、开放且积极响应的魔方文化。
        #original_hash: 3e5570f
        wcat: >-
          该组负责批准和宣布代表提交的WCA比赛，并确保此类公告符合WCA质量标准。该团队还负责维护比赛申请用的政策文件，如：《WCA赛事要求》。WCAT并不负责组织或监督各个比赛。
        #original_hash: 5007698
        wic: >-
          该委员会负责对WCA社区成员以及WCA比赛期间或WCA官方在线平台上发生的事件进行独立调查。这些事件涉嫌违反WCA精神、行为准则、道德准则、规定。
        #original_hash: 889dd90
        weat: 该团队是负责执行处理WCA董事会的行政事务。
        #original_hash: 43e4e33
        wfc: >-
          该委员会负责管理WCA的财务，包括预算编制、财务报告、财务分析、账单和报税。他们还管理WCA最大的收入来源，WCA会费系统，以及为处于不同发展阶段的当地社区提供支持的各种资助计划，包括交通资金、设备资金和对区域组织的支持。
        #original_hash: f2a0140
        wmt: 该团队负责开发和管理WCA品牌、寻求赞助、支持WCA竞赛装备的分销以及营销WCA商品。
        #original_hash: 0171b3b
        wqac: >-
          该委员会负责支持和推动WCA的持续质量改进，并在全球范围内实施质量标准，确保WCA工作人员、区域组织、比赛组织者和工作人员遵循一致的高质量流程。
        #original_hash: a1260bb
        wrc: >-
          该组负责与WCA规则的应用、改进和发展有关的所有问题。他们支持WCA代表处理比赛中发生的任何类型的程序性问题，并决定未解决和未发现的事件。
        #original_hash: 7bc588b
        wrt: 该组负责管理WCA数据库中的所有数据，最重要的是比赛成绩和选手个人数据。
        #original_hash: ec961e4
        wst: 该组负责管理WCA软件（官网、打乱程序、管理工具等）。
        #original_hash: 8f888d6
        wsot: 该团队负责监督和协助WCA成为一个国际认可的体育组织。
        #original_hash: 9f45bfa
        wapc: >-
          该委员会负责审查和解决针对其他WCA员工所做决定的申诉。WAC提供独立、公正的审查流程，以确保决定公平、合理且符合WCA政策和规定。
        #original_hash: e0dbf86
        wmct: >-
          该组负责监督WCA洲际和世界锦标赛的协调和推进，制定指导方针和战略计划，管理主办城市的选择，支持组织团队，并确保一致的锦标赛体验。
