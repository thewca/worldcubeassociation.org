    #original_hash: 2b023eb
    questions_and_comments_html: >-
      网站问题、意见或者建议，请使用<a
      href='/contact/website'>联系表单</a>。查询指定地区或者比赛相关信息，请联系你当地%{link}。
    #original_hash: 4a30d30
    committees_and_teams_html: <u>组委会和成员组</u>
    board:
      #original_hash: f3cbb35
      info_html: 世界魔方协会由WCA董事会领导。他们负责一般咨询和整个WCA组织。所有官方比赛都需要获得WCA董事会的批准。
    wct:
      #original_hash: 846684d
      info_html: WCA通讯组的主要职能是维护世界魔方协会与魔方爱好者及社会公众之间的联系与沟通。如有一般性咨询，请联系他们。
    wdc:
      #original_hash: 77f119f
      info_html: >-
        WCA调查委员会负责调查各类事故并给予解决方案，必要时也会给予相关人员惩罚。这类事故可以是涉嫌违反WCA规则或魔友圈内问题。如果你有以上经历可以联系WDC以寻求解决方案。
    wrc:
      #original_hash: fcd3526
      info_html: >-
        WRC的责任主要围绕在比赛规则的实施、改进、发展这三个方面。在日常比赛里，WRC的成员会协助WCA代表们解决场上场下程序性问题，判别比赛报告中的各类赛场事件。他们也会对于疑难情况进行规则解读。WRC还会定期发布规则报告帮助所有WCA代表增进对于官方规则的理解。如果你想要参与规则的编写或提出修改意见，你可以通过邮件联系他们或在<a
        href='https://github.com/thewca/wca-regulations'>GitHub</a>上参与讨论。
    wrt:
      #original_hash: 45b0c09
      info_html: >-
        WCA成绩组负责管理运营WCA的数据库，其中最重要的就是比赛成绩和选手信息。在WCA代表将比赛成绩提交，WRT的成员就会在WCA官网上公示比赛成绩。除了发布比赛成绩，WRT还负责错误成绩的修改以及WCA个人界面的管理。修改用户个人信息、更改个人页面照片等都是WRT的职责。
    wst:
      #original_hash: 7de6222
      info_html: >-
        WCA软件组负责维护和管理WCA的所有软件，并在需要时开发新软件。如果你对网站开发有建议和想法，或者想要报告错误和故障，都可以联系他们！WCA官网是托管在<a
        href='https://github.com/thewca/worldcubeassociation.org'>GitHub</a>平台上的一个大型开源项目，如果你有兴趣帮助WCA开发这个项目，快到那里去看看吧。
    wfc:
      #original_hash: 3ec8256
      info_html: WCA财务委员会负责WCA的所有财务事宜。他们依据审批通过的年度预算管理WCA的资金账户、财务收支。
    wec:
      #original_hash: ec2b9c3
      info_html: 该委员会的职责是确保WCA员工和其他工作人员遵守其职业道德。
    wqac:
      #original_hash: 0171b3b
      info_html: >-
        该委员会负责支持和推动WCA的持续质量改进，并在全球范围内实施质量标准，确保WCA工作人员、区域组织、比赛组织者和工作人员遵循一致的高质量流程。
  score_tools:
    #original_hash: 4fc2133
    title: WCA 成绩录入工具
    #original_hash: 6d2fe37
    wca_icon_text: 由 WST 开发和维护
    intro:
      #original_hash: 0c5fab5
      desc: 本页是一份非详尽的工具清单，已知这些工具可用于帮助组织 WCA 的比赛。
      #original_hash: 479b542
      disclaimer: '该页面上的所有工具并非都是由 WST 维护的，我们没有足够的人力来管理所有与 WCA 相关的软件 :)'
      #original_hash: 80f97b9
      used: >-
        列表中的所有程序都已在 WCA 比赛中实际使用，并与 WCA 网站集成。你可以使用 WCA
        账号登录，以导入（并有时更新）即将举行的比赛数据。每个程序都会明确列出维护者。
    before:
      #original_hash: 9850344
      title: 比赛前
      #original_hash: 576e2f4
      desc: 参赛者报名可以直接在 WCA 网站上管理。由于手动管理分组和工作人员可能很耗时，你可以考虑使用下方的工具。
    during:
      #original_hash: 9934200
      title: 在比赛期间
      #original_hash: 2b0a6f6
      desc: 你会在这里找到让你在比赛进行中管理比赛结果的工具。
    after:
      #original_hash: d81b949
      title: 在比赛结束之后
      #original_hash: b898460
      desc: 尽管成绩验证会在网站上进行，你仍需借助一些工具加载 TNoodle 生成的打乱，并将最终成绩上传至 WCA 网站。
    tools:
      age:
        #original_hash: 4aaae5b
        title: AGE
        #original_hash: 2e4832d
        description: 用于生成和编辑 WCA 比赛的小组/任务分配的工具
      certificates:
        #original_hash: b3e4eb0
        title: 奖状
        #original_hash: f1a0731
        description: 使用 WCA Live 打印 WCA 比赛的证书
      groupifier:
        #original_hash: 8f55355
        title: Groupifier
        #original_hash: 24d4736
        description: >-
          为 WCA
          该工具由比赛组织者提供，可用于任务和分组管理。主要功能包括：按排名对参赛者排序、分配任务（裁判、打乱）、确定所需打乱数量，以及生成评分表、个人表和汇总表等。
          请查看网站以了解更多信息。
      scorecards:
        #original_hash: aa1b64d
        title: 成绩单
        #original_hash: 2b8e373
        description: 使用 WCA Live 打印 WCA 比赛的记分卡
      tnoodle:
        #original_hash: ba336a1
        title: TNoodle （打乱程序）
        #original_hash: 0a38b22
        description: TNoodle是用在WCA比赛的官方打乱程序。通常都是由WCA代表在比赛前使用，但它的界面也能够让任何人为所有的WCA比赛项目生成打乱。
      live:
        #original_hash: c66444f
        title: WCA Live
        #original_hash: f122015
        description: 用于举办 WCA 比赛并与世界分享实时结果的平台。
      nightmare:
        #original_hash: eebde3b
        title: 成绩用表格
        #original_hash: 466f4c2
        description: 有时难免会遇到网络问题。如果无法连接网络，就只能使用传统的电子表格。
      matcher:
        #original_hash: cc59bc9
        title: 打乱自动匹配
        #original_hash: a352bd1
        description: >-
          可用于将 TNoodle 生成的打乱分配给结果。从 WCA 网站（当使用 WCA Live 时）、电子表格或独立的 WCIF
          文件导入结果。从一个或多个 TNoodle json 文件中导入打乱。将结果导出为适当的格式，用于提交 WCA。
      groups:
        #original_hash: 311a3f6
        title: CompetitionGroups (比赛组)
        #original_hash: 74a0926
        description: 查看所有进行中的比赛组
  logo:
    #original_hash: c72c969
    title: WCA标志
    paragraphs:
      #original_hash: 44cfe8d
      '1': WCA标志由 Justin Eastman 于 2005 年 1 月设计。<br />我们非常喜欢它的设计风格、颜色，以及它与三阶魔方无关的特点。
      #original_hash: 916e3fc
      '2': >-
        当前有三种不同版本的标志：<a
        href="/files/WCAlogo_XL.jpg">大版本</a>（46KB，1756像素×1068像素）、 <a
        href="/files/WCAlogo.svg">矢量版</a>以及<a
        href="/files/WCAlogo_notext.svg">无文字矢量版</a>。
      #original_hash: dcb1ad6
      '3': >-
        3D 版本的标志由越南的 Vu Minh Tan 设计：<a href="/files/WCALogo3D.png">PNG
        版本</a>（2.1 MB）、<a href="/files/WCALogo3Dsmall.png">小 PNG 版本</a>（0.25
        MB）。
      #original_hash: e5df1bf
      '4': >-
        所有 WCA 比赛主办方仅可以在 WCA 比赛相关的网站、服装、礼品或装饰品上使用 WCA 标志。<br
        />其他人要使用或者用于其它目的需要经过 <a href="mailto:board@worldcubeassociation.org">WCA
        董事会</a>同意。
    #original_hash: 6520873
    intro: WCA标志由Justin Eastman在2005年1月的设计比赛中提出。我们喜欢它的设计和颜色，也喜欢它没有特意展示三阶魔方的特点。
    headings:
      usage_guidelines:
        #original_hash: d5b47da
        title: 使用指南
        paragraph:
          #original_hash: 4f84c70
          acceptable_usage: <a href="https://documents.worldcubeassociation.org/documents/policies/external/Logo%20Usage.pdf">WCA标志使用政策</a>说明了WCA标志的正确使用方式。在自己的项目中使用WCA标志前，请仔细阅读该文件。如有其他疑问，请发送电子邮件联系<a href="mailto:marketing@worldcubeassociation.org">WCA市场营销组</a>。
          #original_hash: ff13c4a
          see_below: 下方是关于WCA标志正确用法的追加风格指南。
        color:
          #original_hash: 1d0c830
          title: 颜色
          #original_hash: 1959555
          paragraph: WCA标志有四种颜色变化。正确的颜色变化应该根据该标志使用的媒体背景来正确使用。
          primary:
            #original_hash: a9a96ec
            title: 主要
            #original_hash: f31882f
            paragraph: 尽可能使用这个主要的形式。
          mono:
            #original_hash: c5c5533
            title: 单色
            #original_hash: 612044c
            paragraph: 只有在主要的形式不适合时才使用黑白形式。
        logo_only:
          #original_hash: 9271574
          title: 只有标志
          #original_hash: 4dfab95
          paragraph: 遵循上面同样的颜色使用指南，WCA标志可以使用没有文字标志的版本。
      download_logo_assets:
        #original_hash: ebc85b2
        title: 下载标志
        #original_hash: 9aa098d
        paragraph: 此处可下载WCA标志的高分辨率PNG文件和矢量版本。
        #original_hash: 9de7d59
        accept_terms_and_conditions: 我已阅读并接受<a href="https://documents.worldcubeassociation.org/documents/policies/external/Logo%20Usage.pdf">WCA标志使用政策</a>。
        #original_hash: ebc85b2
        download_button_text: 下载所有的标志
