          #original_hash: f1f3854
          '2': 头像必须为原照片中正确范围作适当裁切、没有歪斜且亮度正常，以便比赛中的任何参赛者或观众都可以在比赛场地中明确识别您的身份。
          #original_hash: 13fab02
          '3': 头像的缩略图只是头像的一个部分，它将被用来代表你的完整头像。缩略图必须进行调整，以便仅从缩略图中就能认出你，而且它必须包含你的脸。
