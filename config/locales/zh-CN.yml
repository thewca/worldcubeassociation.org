  full_organizer_guidelines:
    #original_hash: 5d602df
    description: 欢迎阅读WCA质量保证委员会编写的主办团队指南。如果您正在考虑组建主办团队，强烈建议阅读这些文件。文件分为必读和推荐两类。请确保熟悉其中内容，以便举办更愉快、更高质量的比赛。
