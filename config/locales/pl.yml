  homepage:
    learn_more: Dowiedz się więcej
    title: Witamy w World Cube Association
    latest_news: Najnowsze zdarzenia
    announcements: Ogłoszenia
    see_all_announcements: Zobacz wszystkie ogłoszenia
    about_us:
      title: O nas
      text: >-
        World Cube Association zarządza zawodami dla łamigłówek mechanicznych
        operowanych przez obracanie grup elementów, znanych powszechnie jako
        'twisty puzzles'.
    competitions:
      title: Zawody
      text_html: >-
        Znajdź zawody niedaleko Ciebie lub wyniki zawodów. Jesteś na zawodach i
        chcesz sprawdzić wyniki? Sprawdź %{wca_live_link}!
    merchandise:
      title: Produkty
      ad_new: Nowe
      text_html: >-
        Sprawdź nasze nowo wprowadzone oficjalne produkty, które obejmują odzież
        od koszulek T-shirt po bluzy z kapturem.
      link_title: Link do sklepu
    records:
      title: Rekordy
      text: >-
        Sprawdź aktualne i przeszłe rekordy wszystkich oficjalnych konkurencji
        WCA.
    volunteer:
      title: Wolontariusz
      text: >-
        Zaangażuj się! WCA oferuje pozycje dla wolontariuszy w różnych
        zespołach. Nie musisz być speedcuberem, aby zostać wolontariuszem.
    faq:
      title: FAQ
      text: >-
        Jeśli potrzebujesz pomocy zapoznaj się z naszą listą najczęściej
        zadawanych pytań. Możesz tu znaleźć odpowiedzi na wiele z twoich pytań.
    contact:
      title: Kontakt
      text_html: >-
        Jeżeli chciałbyś się z nami skontaktować możesz to zrobić przez nasz
        formularz kontaktowy. Jeśli masz jakiekolwiek pytania na temat działania
        WCA, sprawdź nasze %{faq_link}!
      faq: Najczęściej Zadawane Pytania
      button: Przejdź do formularza kontaktowego WCA
    support:
      title: Wesprzyj WCA
      text: >-
        World Cube Association jest pozarządową organizacją non-profit. Jako
        organizacja prowadzona w 100% przez wolontariuszy, będziemy wdzięczni za
        twoje wsparcie, które pomoże nam rozszerzać nasz cel wzmacniania
        globalnej społeczności speedcubingowej jednocześnie podtrzymując
        przyjazne i uczciwe środowisko rywaliizacji dla wszystkich.
      button: Dowiedz się więcej jak możesz wspomóc WCA
