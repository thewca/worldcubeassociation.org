  incidents_log:
    i18n_disclaimer: >-
      Zauważ, że sekcja incydentów jest dostępna jedynie w języku angielskim,
      zatem poniższa zawartość nie jest przetłumaczona.
    incident: 'Incydent:'
  about_regulations:
    title: O Regulaminie
    panel1:
      title: Regulamin
      content1_html: >-
        Wszystkie zawody muszą być zgodne z <a target='_blank'
        href='/regulations/'>regulaminem WCA</a>. Ważne jest, aby zawodnicy
        przeczytali go przed wzięciem udziału w swoich pierwszych zawodach.
      content2_html: >-
        Ważne decyzje na temat incydentów które wydarzyły się na zawodach, które
        były rozwiązane przez Komitet ds. Regulaminu WCA znajdują się w <a
        href="/incidents">Logu incydentów</a>.
    panel2:
      title: Tłumaczenia
      content1_html: >-
        Regulamin WCA jest dostępny w kilku językach poza angielskim dzięki
        pracy członków WCA: <a
        href="/regulations/translations/">Tłumaczenia</a>.
      content2_html: >-
        <strong>Ważne:</strong> Mimo że tłumaczenia są bardzo pomocne, nie są
        one oficjalne. Na zawodach obowiązuje angielska wersja Regulaminu.
    panel3:
      title: Regulamin FAQ
      content1_html: >-
        <a href="/faq">Sekcja FAQ</a> odpowiada na kilka najczęściej zadawanych
        pytań odnośnie Regulaminu WCA.
    panel4:
      title: Wytyczne Dla Organizatora
      content1_html: >-
        Jeżeli jesteś zainteresowany organizacją zawodów lub jesteś w trakcie
        ich planowania, prosimy o przeczytanie naszych <a
        href="https://documents.worldcubeassociation.org/edudoc/organizer-handbook/organizer-handbook.pdf">Wytycznych
        Dla Organizatora</a>.
      content2_html: >-
        Ten dokument zawiera ważne informacje i powinien być przeczytany przez
        każdego organizatora zawodów.
  regulations_translations:
    title: 'Regulamin WCA: Tłumaczenia'
    paragraph1: >-
      Jeżeli posługujesz się językiem innym niż angielski, następujące
      tłumaczenia mogą okazać się przydatne.
    paragraph2: >-
      Pamiętaj, że tłumaczenia nie mają oficjalnego status, mimo że są
      umieszczone na stronie WCA, nie niosą ze sobą gwarancji poprawności.
      Jeżeli występuje różnica pomiędzy tłumaczeniem a obecną, oficjalną wersją
      angielską, to ta wersja angielska musi zostać zastosowana.
    translations: Tłumaczenia
    current: Obecne
    old: Stare
    table_elements:
      version: Wersja
      language: Język
    translating: Tłumaczenie Regulaminu
    paragraph3_html: >-
      Jeżeli jesteś zainteresowany dodaniem/zaktualizowaniem któregoś z
      tlumaczeń, odwiedź <a
      href="https://github.com/thewca/wca-regulations-translations#translation-instructions">instrukcje
      odnośnie tłumaczeń na stronie GitHub</a>.
