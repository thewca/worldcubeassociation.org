      default_message: 'Proszę przejrzeć problemy poniżej:'
    hints:
      incident:
        title: >-
          Pamiętaj, że jest to publiczne oraz aby wypełnić to w języku
          angielskim!
        private_description: >-
          Opis incydentu widoczny jedynie dla Delegatów. Prosimy o wypełnienie w
          języku angielskim.
        private_wrc_decision: >-
          Ostateczna decyzja WRC, łącznie z prywatnymi szczegółami. Prosimy o
          wypełnienie w języku angielskim.
        public_summary: >-
          Ogólny opis incydentu wraz z opisem, wyświetlane publicznie. Prosimy o
          wypełnienie w języku angielskim.
      user:
        dob: Wprowadź datę urodzenia zawodnika w formacie RRRR-MM-DD
        name: >-
          Wprowadź pełne imię i nazwisko zawodnika poprawnie, na przykład
          <strong>Jan Kowalski</strong>. Nie zdrobniale jak <strong>j
          kowalski</strong>.
        pending_avatar: >-
          Po przesłaniu nowego zdjęcia profilowego, będziesz musiał zaczekać, aż
          Zespół do Spraw Wyników go zaakceptuje.
        registration_notifications_enabled: >-
          Dotyczy to wyłącznie zawodów które organizujesz lub delegujesz, można
          to nadpisać dla poszczególnych zawodów.
        receive_developer_mails: >-
          Powiadomienia będą ograniczone do głównych zmian wersji zasobów takich
          jak eksporty danych, schemat WCIF i publicznych API. Rekomendowane dla
          programistów utrzymujących oprogramowanie opierające się na tych
          narzędziach.
        receive_delegate_reports: >-
          Jeżeli jesteś Starszym Delegatem, Członkiem WRC lub WQAC, otrzymujesz
          Raporty Delegata domyślnie. Uwaga: zmiana może zająć do 12 godzin aby
          przyniosła skutek.
        delegate_reports_region: >-
          Jeżeli chcesz otrzymywać wszystkie raporty, pozostaw to pole puste
          (opcja na samej górze). Zauważ, że aby zmiana zaczęła obowiązywać może
          minąć do 12 godzin.
        otp_attempt: >-
          Sprawdź swoje skonfigurowane urządzenie mobilne, w celu pozyskania
          jednorazowego hasła, lub podaj jeden z kodów odzyskiwania.
      dob_contact:
        dob: Twoja poprawna data urodzenia w formacie RRRR-MM-DD
        document: >-
          Aby potwierdzić swoją tożsamość i poprawną datę urodzenia, musisz
          załączyć zdjęcie jakiegokolwiek legalnego dokumentu (dowodu
          osobistego, prawa jazdy, legitymacji studenckiej lub szkolnej,
          paszportu, aktu urodzenia, ...), na którym zarówno twoje imię,
          nazwisko jak i data urodzenia są widoczne i zrozumiałe dla osoby
          posługującej się językiem angielskim (lub skontaktuj się z lokalnym
          Delegatem WCA, jeżeli nie posiadasz takiego dokumentu). Do
          identyfikacji potrzebujemy minimum imienia ,nazwiska oraz daty
          urodzenia; bez problemu możesz zasłonić/zamazać jakiekolwiek inne dane
          na dokumencie.
      post:
        body: >-
          Używaj tagu &lt;!-- break --&gt; aby pokazać podgląd postu na stronie
          głównej. Każdy post na stronie głównej pokaże cały tekst powyżej tego
          rozdzielacza. Właściwy post wyświetli całą treść.
        show_on_homepage: >-
          Uwaga! To nie jest bezpieczne w przypadku prywatnych danych, jedynie
          zapobiega bałaganowi na stronie domowej. Posty, które nie są
          wyświetlone na stronie głównej, są wciąż dostępne publicznie poprzez
          odpowiedni link z tagami.
      delegate_report:
        schedule_url: >-
          Pełny adres do opublikowanego harmonogramu (np.
          mistrzostwapolski2016.kostkarubika.org#schedule)
        equipment: >-
          Liczba i rodzaj timerów oraz wyświetlaczy użytych na zawodach. Proszę
          usunąć te linie wyposażenia, które nie zostały użyte.
        summary: >-
          Punkty wymienione powyżej są jedynie wskazówkami do stworzenia
          kompletnego raportu. Używaj ich według swojego uznania. Prosimy usuń
          nieużywane fragmenty!
        venue: >-
          Wymienione powyżej punkty są jedynie wskazówką do przygotowania
          kompletnego raportu. Używaj tych które uznasz za stosowne wedle
          swojego uznania. Prosimy o usunięcie nieużywanych fragmentów!
        organization: >-
          Wymienione powyżej punkty są jedynie wskazówką do przygotowania
          kompletnego raportu. Używaj tych które uznasz za stosowne wedle
          swojego uznania. Prosimy o usunięcie nieużywanych fragmentów!
        incidents: >-
          Zgłoś wszystkie incydenty, które są niestandardowymi przypadkami.
          Numeruj incydenty poczynając od 1., co pozwoli innym Delegatom
          komentować, odnosząc się do nich po odpowiednim numerze. Nawet jeżeli
          wszystko wydawało się typowe, wymień chociaż najbardziej godne
          odnotowania przypadki. Prosimy o zaznaczenie odpowiednich pól poniżej
          jeżeli szukasz opinii.
        setup_images: >-
          Musisz wybrać co najmniej %{image_count} obrazów które przedstawiają
          strefę mieszania i scenę z tych zawodów, najlepiej w trakcie zawodów
          (inne obrazy są również mile widziane). Możesz wybrać wiele plików na
          raz. Możesz usunąć obrazki tylko jeżeli wystarczająco dużo innych
          zostało przesłanych (jeżeli chcesz zastąpić obraz, najpierw prześlij
          nowy, a następnie usuń poprzedni). Jeżeli nie masz aktualnych zdjęć
          sceny lub strefy mieszania, wytłumacz dlaczego.
        wrc_incidents: Lista numerów incydentów dla których chciałbyś uzyskać 
          opinię WRC.
        wic_incidents_html: >-
          Lista numerów odnoszących się do incydentów co do których chcesz
          otrzymać wsparcie WIC. <br> <strong>%{wic_incident_alert}</strong>
        wic_incident_alert: >-
          Jeżeli incydent WIC jest delikatny (w tym przestępstwa, nękanie,
          napaść ale nie tylko) prosimy o pominięcie tego w raporcie i wysłanie
          do WIC osobnym emailem. Dla innych incydentów przeznaczonych dla WIC
          domyślnie podaj krótką, zanonimizowaną wersję zdarzenia i skontaktuj
          się prywatnie z WIC z dodatkowymi szczegółami. WIC przekaże informację
          zwrotną dotyczącą wersji zanonimizowanych dla powszechnej świadomości.
          W przypadku wszystkich incydentów WIC z udziałem wolontariusza WCA,
          prosimy o pominięcie wszystkich szczegółów w raporcie i kontakt z WIC
          prywatnie.
        remarks: >-
          Opisz inne szczegóły, którymi chciałbyś się podzielić (np. postępy,
          regresję wewnątrz społeczności, przyszłe plany związany z danym
          regionem). Jeżeli ze względu na zwięzłość pominąłeś w poprzednich
          sekcjach coś, co chciałbyś powiedzieć, nie wahaj się zamieścić ich
          tutaj.
      competition_tab:
        name: 'Przykłady: Dojazd, Płatność, Nagrody, Zakwaterowanie'
      regional_organization:
        website: >-
          Musi być poprawnym adresem url, zawierającym protokół http(s). HTTPS
          jest zalecany
        logo: >-
          Musi być w formacie PNG, dobrej rozdzielczości oraz posiadać
