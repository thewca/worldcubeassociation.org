  regional_organizations:
    title: Organizacje Regionalne
    content: 'WCA rozpoznaje następujące Organizacje Regionalne:'
    empty: Nie ma obecnie Organizacji Reginoalnych rozpoznawanych przez WCA.
    how_to:
      title: Jak zostać Organizacją Regionalną WCA
      description: >-
        WCA uznaje wiele Organizacji Regionalnych na całym świecie. Celem
        Organizacji Regionalnej WCA jest organizacja zawodów WCA oraz wspieranie
        działań WCA w jej regionie. Zachęcamy kraje pragnące utworzyć
        Organizację Reginalną, aby wspomogły WCA w swoim regionie przed
        wysłaniem swojego podania. W celu uzyskania pomocy dotyczącej
        organizacji zawodów WCA w swoim regionie, prosimy o kontakt z
        najbliższym Delegatem WCA.
    requirements:
      title: Wymagania stawiane Organizacjom Regionalnym WCA
      list:
        '1': Aktywna organizacja lub wspieranie Zawodów WCA we własnym regionie
        '2': >-
          Wkład organizację Kontynentalnych Zawodów WCA, które odbywają się na
          kontynencie danej Organizacji Regionalnej, jeżeli wymaga tego
          odpowiedni Zespół Organizacyjny.
        '3': >-
          Respektowanie i działanie zgodnie z Celami określonymi przez Statut
          WCA oraz Wnioski
        '4': >-
          Spełnianie wszystkich obowiązujących przepisów określonych w
          Regulaminie WCA
        '5': Akceptowanie i stosowanie się do wszystkich decyzji Wolontariuszy 
          WCA
        '6': >-
          Przechowywać na stronie WCA kopię obecnego Statutu oraz (jeżeli
          dotyczy) Regulaminu w formacie elektronicznym
    application_instructions:
      title: Instrukcje dotyczące składania wniosku
      description_html: >-
        W celu aplikowania o uznanie organizacji, prosimy o wypełnienie <a
        href='/regional-organizations/new'>tego formularza</a>.
    regional_organization_form:
      filling_instructions_html: Prosimy o wypełnienie wszystkiego w <b>języku 
        angielskim</b>.
      public_information: Publiczne informacje
      private_information: Prywatne informacje
      private_information_disclaimer: >-
        Wszystkie informacje poniżej będą widoczne wyłącznie dla członków
        Zarządu WCA
