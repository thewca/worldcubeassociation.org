  media_and_instagram:
    page_title: Wysyłanie multimediów i materiałów na Instagram
    general_media_submission:
      title: Ogólne wysyłanie multimediów
      body_html: >-
        WCA udostępnia artykuły i zdjęcia z zawodów dostarczone przez
        społeczność na naszej <a href="/media">stronie multimediów</a>. Jeżeli
        chciałbyś podzielić się swoimi materiałami wypełnij nasz <a
        href="/media/new">formularz wysyłania multimediów</a>!
    instagram_submission:
      title: Wysyłanie materiałów z Instagram
      paragraph1_html: >-
        Jak mogłeś już zauważyć WCA posiada <a
        href="https://www.instagram.com/thewcaofficial/">aktywne konto w
        serwisie Instagram</a>! Aby jak najlepiej odzwierciedlić globalną
        społeczność speedcuberów umieszczamy tam materiały wysłane nam przez
        układaczy z całego świata.
      paragraph2: >-
        Jeżeli posiadasz fotografie wysokiej jakości, które chciałbyś abyśmy
        umieścili na naszym Instagramie, wciśnij przycisk poniżej i wypełnij
        formularz! Abyśmy mogli umieścić twoje materiały musisz być ich
        właścicielem i dać WCA zgodę na ich udostępnianie. Z uwagi na dużą
        liczbą materiałów jaką otrzymujemy nie możemy udostępnić wszystkiego,
        jednakże oto kilka wskazówek jak zwiększyć szansę na to, że udostępnimy
        twoje materiały:
      photo_quality: >-
        Upewnij się, że jakość zdjęć/nagrania jest dobra. Materiały nie muszą
        być stworzone w sposób profesjonalny, ale ich jakość nie powinna
        odstraszać od obrazów i nagrań.
      photo_interest: >-
        Twoje materiały powinny być interesujące dla szerszej widowni. Materiały
        które są interesujące jedynie dla kilku osób nie mają tutaj miejsca.
      wca_related: >-
        Wysyłaj zdjęcia i filmy które mają coś wspólnego z WCA, o tym właśnie
        jest nasz profil! Uwielbiamy patrzeć jak speedcuberzy dobrze się bawią!
      submit_instagram_content: Wyślij materiały na Instagram
    instagram_hosting:
      title: Prowadzenie Instagrama
      paragraph1_html: >-
        Czasami pozwalamy członkom społeczności na prowadzenie story z
        oficjalnego konta WCA na instagramie podczas zawodów na których są!
        Jeżeli jesteś zainteresowany, prosimy wciśnij przycisk i wypełnij
        poniższy formularz. Zespół do Spraw Komunikacji WCA odezwie się do
        ciebie w celu uzyskania większej porcji informacji jeżeli twoja prośba
        zostanie zaakceptowana. W razie jakichkolwiek pytań <a
        href="https://www.worldcubeassociation.org/contact/website">skontaktuj
        się z nami</a>.
      paragraph2: >-
        Naszym celem jest pokazanie bardziej osobistej strony każdego cubera i
        każdych zawodów. Nie ma to być dużym ciężarem w trakcie weekendu, no i
        oczywiście chcemy abyś cieszył się zawodami, a potem mógł podzielić się
        tą radością z innymi.
      paragraph3: 'Rola prowadzącego może być podsumowana jak poniżej:'
      short_intro: 'Zrób krótki wstęp, powiedz coś o sobie i o zawodach'
      venue_feel: >-
        Zrób kilka ujęć aby dać poczucie sali i ludzi, to mogą być ujęcia ze
        strefy zawodników i sceny
      people_solving: >-
        Spróbuj zrobić kilka ujęć układających ludzi (najlepiej szybkich
        układaczy w swoich głównych konkurencjach)
      mini_interviews: >-
        Możesz spróbować zrobić mini wywiady z ludźmi (organizatorami,
        delegatami etc...) mówiąc o tym jakie mają odczucia względem zawodów
      pictures_too: 'Możesz wysyłać także zdjęcia, nie trzeba wysyłać tylko filmów'
      paragraph4: >-
        Komunikacja z nami w trakcie weekendu odbywa się zwykle przez grupę
        WhatsApp. Upewnij się że jesteś zaznajomiony z tą platformą albo daj nam
        znać, że nie będziesz w stanie jej używać abyśmy mogli zaaranżować to
        inaczej.
      apply_to_host: Aplikuj o prowadzenie
    other_suggestions:
      title: Inne uwagi?
      body_html: >-
        Masz inne uwagi na temat naszego Instagrama lub innych platform
        socialowych? <a
        href="https://www.worldcubeassociation.org/contact/website">Daj nam
        znać</a>!
  footer:
    privacy: Prywatność
    disclaimer: Zastrzeżenie
  api:
    manage_oauth_html: 'Idź do %{oauth_link} aby zarządzać swoimi aplikacjami OAuth.'
    token_request_intro: >-
      Oto przykład użycia cURL do uzyskania tokena dostępu za pomocą ID
      Aplikacji, tajnego klucza klienta, adresu email i hasła:
    user_email_placeholder: TWÓJ_EMAIL
    user_password_placeholder: TWOJE_HASŁO
    user_info_request_intro: >-
      Token dostępu OAuth może być używany aż do wygaśnięcia w celu wykonywania
      autoryzowanych zapytań API. Dla przykładu aby uzyskać informacje o twoim
      koncie:
    legal_tnoodle_api_header: Legalna wersja TNoodle
    login_message: Prosimy się zalogować
  merch:
    title: Produkty WCA
    paragraphs:
      '1': >-
        WCA ma ekskluzywne produkty dostępne do kupienia! Od koszulek, bluz z
        kapturem, naklejek, stackmat po plecaki i nie tylko! Nasze projekty są
        stale aktualizowane, zawierając klasyczne logo WCA, oficjalne produkty
        Mistrzostw Świata oraz projekty związane z rekordami świata.
      '2': >-
        Kupowanie Produktów WCA w naszych sklepach to jeden z najlepszych
        sposobów, aby wesprzeć WCA - organizację non-profit, prowadzoną przez
        wolontariuszy. Wszystkie zyski z towarów przeznaczamy na dalsze
        finansowanie mistrzostw, sprzętu i innych działań związanych z WCA.
      '3': >-
        Nasze produkty możesz kupić na całym świecie – mamy sklepy w Europie,
        Ameryce i Indiach, a wkrótce pojawią się także w innych miejscach!
  database:
    results_export:
      heading: Eksport wyników WCA
      deprecation_warning: >-
        INFORMACJA O WYCOFANIU: Wersja %{old_version} funkcji eksportu wyników
        została wycofana i jej obsługa zostanie zakończona od
        %{deprecation_date}. Prosimy o przejście na wersję %{new_version} przed
        upływem tego terminu.
      description: >-
        Na tej stronie oferujemy wyniki WCA do pobrania w kilku formatach,
        dzięki czemu możesz ich używać/analizować na szeroką skalę. Zazwyczaj
        będziemy aktualizować po każdym weekendzie zawodów, gdy wyniki zostaną
        sfinalizowane. Pliki są ponumerowane i datowane, dzięki czemu możesz
        sprawdzić, czy masz już najnowszą wersję.
      permalink: Link permanentny
      permalink_note: >-
        Uwaga: Linki trwałe udostępniają najnowsze wyniki eksportowane w ramach
        danej wersji, tzn. link trwały v2 zwróci najnowszy eksport v2, ale
        będzie korzystał z v2 nawet po wydaniu v3.
      file_formats:
        sql: 'Komendy SQL, do importowania do baz danych SQL.'
        tsv: >-
          Wartości rozdzielane tabulatorami, dla arkuszy w programach
          OpenOffice.org, MS Excel etc.
      hint_readme_html: >-
        Załączony plik %{readme_filename} zawiera warunki użytkowania oraz
        ogólny opis (w języku angielskim, nieprzetłumaczony):
    developer_export:
      heading: Eksport Deweloperski WST
      description_html: >-
        Na tej stronie oferujemy eksport deweloperski WST do pobrania jako zrzut
        SQL. Szczegóły można znaleźć na stronie %{github_link}.
      download: Pobierz
  validators:
    persons:
      dob_is_jan_one_warning: >-
        Data urodzenia %{name} jest ustawiona na 1 stycznia, prosimy sprawdź czy
        nie jest to błąd.
      dob_is_too_young_warning: >-
        %{name} zdaje się mieć mniej niż 3 lata, prosimy sprawdź czy nie jest to
        błąd.
      dob_is_too_old_warning: >-
        %{name} zdaje się mieć około 100 lat, prosimy sprawdź czy nie jest to
        błąd.
      person_doesnt_have_any_results_error: 'Nie ma wyników dla %{person_name} z ID
        %{person_id}'
      results_not_associated_with_any_person_error: 'Istnieją wyniki dla nieznanej
        osoby z ID %{person_id}'
      whitespace_in_name_error: 'Osoba ''%{name}'' ma wiodące/końcowe białe znaki
        lub podwójne spacje.'
      person_with_non_existing_wca_id_error: 'Osoba %{name} ma WCA ID które nie istnieje:
        %{wca_id}.'
      no_space_before_parenthesis_error: 'Nawiasy otwierające w ''%{name}'' muszą
        być poprzedzone spacją.'
      same_person_name_warning: >-
        W bazie danych WCA istnieje już co najmniej jedna osoba z imieniem
        '%{name}' (%{wca_ids}). Prosimy upewnij się, że '%{name}' jest inną
        osobą. Jeżeli nie, prosimy przydziel poprawne WCA ID do konta
        użytkownika i wygeneruj ponownie JSON z wynikami.
      non_matching_dob_warning: >-
        Data urodzenia '%{dob}' podana dla %{name} (%{wca_id}) nie zgadza się z
        obecnie istniejącymi danymi w bazie WCA ('%{expected_dob}'). Jeżeli to
        błąd, popraw go. W przeciwnym wypadku pozostaw komentarz dla WRT w tym
        temacie.
      non_matching_gender_warning: >-
        Płeć '%{gender}' podana dla %{name} (%{wca_id}) nie zgadza się z obecnie
        istniejącymi danymi w bazie WCA ('%{expected_gender}'). Jeżeli to błąd,
        popraw go. W przeciwnym wypadku pozostaw komentarz do WRT w tym temacie.
      empty_gender_warning: >-
        Płeć dla nowego zawodnika %{name} jest pusta. Poprawne wartości płci to
        'female' (kobieta), 'male' (mężczyzna) i 'other' (inna). Pozostaw
        komentarz dla WRT w tym temacie.
      non_matching_name_warning: >-
        Imię i nazwisko '%{name}' podane dla ID %{wca_id} nie zgadza się z
        danymi w bazie danych WCA ('%{expected_name}').
      non_matching_country_warning: >-
        Kraj '%{country}' podany dla %{name} (%{wca_id}) nie zgadza się z
        podanym w bazie WCA ('%{expected_country}'). Jeżeli to błąd, popraw go.
        W przeciwnym wypadku pozostaw komentarz do WRT na ten temat.
      multiple_newcomers_with_same_name_warning: >-
        Jest wielu nowych zawodników z dokładnie tym samym imieniem i
        nazwiskiem: %{name}. Prosimy upewnij się, że wyniki tych zawodników są
        poprawnie podzielone pomiędzy nich.
      wrong_parenthesis_type_error: >-
        Nawias użyty w '%{name}' jest niepoprawnym znakiem, prosimy zastąp go
        nawiasem okrągłym '(' lub ')' z poprawnym użyciem spacji.
      special_characters_in_name_warning: >-
        „%{name}” zawiera nieprawidłowe znaki specjalne (takie jak cyfry,
        cudzysłowy i inne symbole). Nazwy powinny zawierać wyłącznie litery,
        spacje, myślniki, apostrofy, kropki i nawiasy okrągłe.
      suspicious_last_name_warning: >-
        Nazwisko osoby „%{name}” to „%{suffix}”, które może nie być prawdziwym
        nazwiskiem (np. sufiksem pokoleniowym zapisanym w całości). Prosimy o
        potwierdzenie, że jest to jej legalne nazwisko lub o jego
        zastąpienie/usunięcie.
      successive_uppercase_name_warning: >-
        '%{name}' ma wiele następujących po sobie wielkich liter w imieniu.
        Prosimy upewnij się, że jest to poprawny zapis lub popraw imię.
      lowercase_name_warning: >-
        '%{name}' ma całe imię i nazwisko małymi literami. Prosimy upewnij się,
        że jest to poprawny zapis lub popraw imię.
      missing_period_in_single_letter_middle_name_warning: >-
        '%{name}' ma środkowe imię składające się z jednej litery bez oznaczenia
        skrócenia kropką. Prosimy potwierdź, że jest to poprawny zapis lub
        popraw imię.
      letter_after_period_warning: >-
        '%{name}' nie ma spacji po kropce w imieniu. Prosimy upewnij się, że
        jest to poprawny zapis lub popraw imię.
      single_letter_first_or_last_name_warning: >-
        '%{name}' ma pojedynczą literę jako imię lub nazwisko. Prosimy popraw
        imię lub potwierdź, że jest to poprawne imię zawodnika zgodnie z
        oficjalnym dokumentem.
      single_name_warning: >-
        '%{name}' nie ma nazwiska. Prosimy potwierdź, że jest to pełny sposób
        nazywania zawodnika zgodnie z oficjalnym dokumentem.
      competitor_limit_exceeded_warning: >-
        Liczba osób na zawodach (%{n_competitors}) jest powyżej limitu
        zawodników (%{competitor_limit}). Wyniki zawodników zarejestrowanych po
        osiągnięciu limitu zawodników muszą być usunięte.
      registration_details_mismatch_warning: >-
        Osoba z ID rejestracji %{person_id} (%{name}) ma dane które nie pasują
        do jej rejestracji: %{mismatches}
      missing_matching_registration_warning: 'Osoba %{name} nie ma pasującej rejestracji.'
      unaccepted_registration_with_results_warning: >-
        Osoba %{name} ma wyniki w zawodach, ale rejestracja nie zostało
        oznaczona jako zaakceptowana.
    results:
      automatically_position_fixed_info: >-
        [%{round_id}] Automatycznie naprawiono pozycję %{person_name} z %{pos}
        na %{expected_pos}.
      mbf_result_over_time_limit_warning: >-
        [%{round_id}] wynik '%{result}' dla%{person_name} jest powyżej limitu
        czasowego. Prosimy upewnij się, że jest to spowodowane karami czasowymi
        przed wysłaniem wyników lub zmień wynik na DNF.
      result_after_dns_warning: >-
        [%{round_id}] %{person_name} ma przynajmniej jeden wynik DNS
        poprzedzający poprawny wynik. Prosimy upewnij się, że jest to DNS, a
        jeżeli tak, wyjaśnij WRT co się stało.
      similar_results_warning: >-
        [%{round_id}] Wyniki %{person_name} są podobne do wyników
        %{similar_person_name}. Prosimy upewnij się, że te wyniki są poprawnie
        zapisane dla obu zawodników.
      met_cutoff_but_missing_results_error: >-
        [%{round_id}] %{person_name} pokonał cutoff, ale nie ma wyników z
        drugiej fazy rundy. Cutoff wynosił %{cutoff}.
      didnt_meet_cutoff_but_has_results_error: >-
        [%{round_id}] %{person_name} ma co najmniej jeden wynik z drugiej fazy
        rundy, ale nie pokonał cutoffa. Cutoff wynosił %{cutoff}.
      wrong_attempts_for_cutoff_error: >-
        [%{round_id}] %{person_name} nie ma co najmniej jednego wyniku w fazie
        cutoff. Prosimy uzupełnij brakujące próby lub zaktualizuj informacje o
        rundzie w panelu zarządzania konkurencjami zawodów.
      result_over_time_limit_error: >-
        [%{round_id}] Co najmniej jeden wynik %{person_name} jest powyżej limitu
        czasowego dla rundy, który wynosi %{time_limit} na próbę. Wszystkie
        ułożenia powyżej limitu czasowego muszą zostać zmienione na DNF.
      results_over_cumulative_time_limit_error: >-
        [%{round_ids}] Suma wyników %{person_name} jest powyżej limitu
        kumulatywnego wynoszącego %{time_limit}.
      undefined_time_limit_warning: >-
        [%{round_id}] Limit czasowy dla tej rundy jest niezdefiniowany,
        walidatory limitu czasowego zostały pominięte. Jest to oczekiwane tylko
        dla zawodów sprzed 2013 roku.
      suspicious_dnf_warning: >-
        [%{round_ids}] Runda ma limit kumulatywny, extrapolując na podstawie
        udanych prób %{person_name}, powinni mieć oni bardzo mało czasu na
        przynajmniej jednego ze swoich DNFów. Prosimy upewnij się, że jest każdy
        DNF i DNS są poprawne. Jeżeli zawodnik nie rozpoczął próby, albo nie
        miał już żadnego pozostałego czasu przed rozpoczęciem próby, musi być
        ona wpisana jako DNS.
      missing_cumulative_round_id_error: >-
        [%{original_round_id}] Nie udało się znaleźć rundy %{wcif_id} dla limitu
        kumulowanego podanego w WCIF. Prosimy wejść w panel zarządzania
        konkurencjami zawodów i usunać %{wcif_id} z limitu kumulowanego
        %{original_round_id}. WST zdaje sobie sprawę z tego błędu (GitHub issue
        #3254).
      wrong_position_in_results_error: >-
        [%{round_id}] %{person_name} jest na złej pozycji: spodziewana
        %{expected_pos}, ale jest %{pos}.
    rounds:
      too_many_qualified_warning: >-
        Runda %{round_id}: więcej zawodników zakwalifikowało się niż jest podane
        w planowanych warunkach awansu (%{actual} zamiast %{expected}, warunku
        awansu: %{condition}). Prosimy zaktualizuj informacje o rundzie w panelu
        zarządzania konkurencjami zawodów.
      regulation_9m1_error: >-
        Runda %{round_id} ma 99 lub mniej zawodników ale ma więcej niż dwie
        kolejne rundy, co nie jest dozwolone przez Regulamin w punkcie 9m1.
      regulation_9m2_error: >-
        Runda %{round_id} ma 15 lub mniej zawodników, ale ma więcej niż jedną
        kolejną rundę, co nie jest dozwolone przez Regulamin w punkcie 9m2.
      regulation_9m3_error: >-
        Runda %{round_id} ma 7 lub mniej zawodników, ale ma co najmniej jedną
        kolejną rundę, co nie jest dozwolone przez Regulamin w punkcie 9m3.
      regulation_9p1_error: >-
        Runda %{round_id}: Mniej niż 25% zawodników zostało wyeliminowanych, co
        nie jest dozwolone przez Regulamin w punkcie 9p1.
      no_competitor_eliminated_error: >-
        Runda %{round_id}:Musi być co najmniej jeden wyeliminowany zawodnik, co
        jest wymagane przez Regulamin w punkcie 9p (zawody przed kwietniem
        2010).
      less_than_twenty_five_percent_eliminated_error: >-
        Runda %{round_id}: według zasad awansu (%{condition}), mniej niż 25%
        zawodników zostałoby wyeliminowanych, co nie jest dozwolone przez
        regulamin w punkcie 9p1. Prosimy zaktualizuj informacje o rundzie w
        panelu zarządzania konkurencjami zawodów.
      not_enough_qualified_warning: >-
        Runda %{round_id}: według danych dotyczących konkurencji, awansować
        mogło co najwyżej %{expected}, ale jedynie %{actual} zawodników
        startowało w rundzie. Prosimy pozostaw komentarz na ten temat (lub
        popraw dane konkurencji, jeżeli zaaplikowałeś inne warunki awansu).
      competed_not_qualified_error: >-
        Runda %{round_id}: %{ids} startowało, ale nie spełniło warunków awansu
        (%{condition}). Prosimy upewnij się, że zapisane warunki awansu oddają
        to, co było wykorzystane na zawodach i usuń wyniki jeżeli zajdzie taka
        potrzeba.
      round_not_found_error: >-
        Runda %{round_id} nie została znaleziona. Prosimy upewnij się, że strona
        panel zarządzania konkurencjami na stronie WCA i WCA Live są
        zsynchronizowane.
      missing_round_results_error: >-
        Nie ma wyników dla rundy %{round_id}, jednak znajduje się ona w zakładce
        konkurencje. Jeżeli ta runda nie była rozgrywana, prosimy usuń ją z
        panelu zarządzania konkurencjami zawodów.
    events:
      not_333_main_event_warning: >-
        Wybraną główną konkurencją zawodów jest %{main_event_id}. Mimo tego, że
        zostało to zatwierdzone przez WCAT PRZED zawodami, WRT jest
        odpowiedzialne za upewnienie się PO zawodach, że odpowiednie wytyczne z
        WCRP zostały spełnione. Prosimy o podanie jednej akcji która została
        wykonana aby potraktować %{main_event_id} jako główną konkurencję
        PODCZAS zawodw (poprawne przykłady: ogłoszenie zwycięzcy jako zwycięzcy
        zawodów, największa liczba rund, większa nagroda).
      no_main_event_warning: >-
        Żadna konkurencja nie jest wybrana jako główna konkurencja tych zawodów.
        Prosimy o informację dla WRT czy jest to poprawne.
      missing_results_warning: >-
        Nie ma wyników w konkurencji %{event_id} ale jest listowana jako
        oficjalna konkurencja tych zawodów. Jeżeli konkurencja się odbyła,
        prosimy o ponowne wysłanie pliku JSON z wynikami zawierającego wyniki
        tej konkurencji. Jeżeli konkurencja się nie odbyła, pozostaw komentarz
        dla WRT.
    scrambles:
      missing_scrambles_for_round_error: >-
        [%{round_id}] Brakujące scramble. Użyj programu Scrambles Matcher aby
        dodać poprawne scramble do rund.
      missing_scrambles_for_competition_error: >-
        Brakujące scramble dla zawodów. Użyj programu Scrambles Matcher aby
        dodać scramble.
      missing_scrambles_for_group_error: >-
        [%{round_id}] Grupa %{group_id}: brakujące scramble, wykryto jedynie
        %{actual} zamiast %{expected}.
      missing_scrambles_for_multi_error: >-
        [%{round_id}] Możliwe jest użycie wielu grup w konkurencji 3x3x3 Wiele
        kostek bez patrzenia, co najmniej jedna z grup musi zawierać wszystkie
        scramble dla wszystkich prób.
      mbld_scrambles_warning: >-
        [%{round_id}] Ta runda zawiera wyniki w konkurencji 3x3x3 Wiele kostek
        bez patrzenia. Prosimy o podanie w komentarzu do wyników ile scrambli z
        poszczególnych setów było faktycznie użytych przez zawodników, tak aby
        WRT mogło usunąć nieużywane scramble.
      multiple_fmc_groups_warning: >-
        [%{round_id}] Wykryto użycie wielu grup w konkurencji FMC. Jeżeli użyto
        jednej grupy w konkurencji FMC, użyj programu Scrambles Matcher aby
        usunąć nieużywane scramble. W przeciwnym wypadku, pozostaw komentarz dla
        WRT wyjaśniający użycie wielu grup w konkurencji FMC.
      wrong_number_of_scramble_sets_error: >-
        [%{round_id}] Ta runda ma inną liczbę grup scrambli (%{actual}) niż ta
        podana w panelu zarządzania konkurencjami (%{expected}). Prosimy
        dostosuj liczbę grup scrambli w panelu zarządzania konkurencjami do
        liczby grup użytych na zawodach.
    schedule:
      activity_outside_competition_dates_warning: >-
        Aktywność "%{activity_name}" (kod: %{activity_code}) jest zaplanowana w
        harmonogramie poza dniami zawodów w strefie czasowej miejsca zawodów.
        Prosimy, zmień harmonogram tak aby odpowiadał faktycznym dniom zawodów.
  tickets:
    type:
      edit_person: Edytuj osobę
      competition_result: Wynik zawodów
    stakeholder_role:
      actioner: Wykonawca
      requester: Wnioskodawca
