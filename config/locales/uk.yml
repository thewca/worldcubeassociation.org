        private_description: >-
          Опис інциденту, який будуть бачити лише Делегати. Будь ласка,
          заповніть це англійською.
        private_wrc_decision: >-
          Остаточне рішення WRC, включно з приватними подробицями. Будь ласка,
          заповніть це англійською.
        public_summary: >-
          Загальний опис інциденту та його рішення, що будуит опублівані. Будь
          ласка, заповніть це англійською.
      user:
        dob: Введіть Вашу дату народження в форматі РРРР-ММ-ДД.
        name: >-
          Введіть Ваше повне ім’я українською, наприклад <strong>Григорій
          Сковорода</strong>. Будь ласка, не скорочуйте імена і не забувайте
          писати прізвище.<br/>По-батькові додаються лише у випадках, коли
          потрібна додаткова ідентифікація учасника.
        pending_avatar: >-
          Після завантаження нового аватару, Ви маєте дочекатись, доки WCA
          Results Team узгодить її.
        receive_delegate_reports: >-
          Якщо Ви Кандидат в Делегати, Провідний делегат або Член WRC або WQAC,
          Ви отримуєте звіти Делегатів за замовчанням. Примітка: зміна цієї
          опції може зайняти деякий час.
        otp_attempt: >-
          Перевірте одноразовий пароль у Вашому мобільному додатку, або введіть
          один з Ваших кодів відновлення.
      competition:
        name: >-
          Повна назва змагання включно з роком (наприклад, Kyiv Open 2011).
          Переконайтесь, що всі слова починаються з великої літери. Ім’я має
          містити лише букви, цифри, дефіси(-), амперсанди(&), крапки(.),
          двокрапки(:), апострофи(') та пробіли( ).
        cell_name: >-
          Скорочена назва для відображення. Якщо основна назва достатньо
          коротка, можна її продублювати.
        city_name: >-
          Назва міста та району/області (якщо треба) де буде відбуватись
          змагання (наприклад, Sultan-Sarai, Bilogirs'kyi, Crimea). Країну
          вказувати не потрібно.
        information: >-
          Важлива інформація, яку мають знати учасники. Вона буде відображена на
          основній сторінці змагання. <br/>Будь ласка, заповніть її як
          <strong>українською</strong>, так і <strong>англійською</strong>.
        staff_delegate_ids: Делегати WCA на змаганнях.
        organizer_ids: Організатори змагань (вони повинні мати аккаунти на сайті
          WCA).
        external_website: Веб-сторінка змагання. Це має бути працююче http(s) 
          посилання.
        registration_open: 'Примітка: Реєстрація відкриється і закриється за часом
          UTC.'
        remarks: >-
          Додаткова інформація, яку потрібно повідомити WCAT. Наприклад, якщо є
          щось, стосовно чого ви не впевнені, або якщо є окреме прохання до
          WCAT. Будь ласка, заповніть це англійською!
        external_registration_page: >-
          Сторінка, на якій учасники будуть реєструватись. Це має бути працююче
          http(s) посилання.
        base_entry_fee_lowest_denomination: >-
          Базовий реєстраційний внесок. Буде відображатись на основній сторінці
          змагань та на сторінці реєстрації. Якщо вказати "0", то учасники
          будуть бачити, що змагання безкоштовні.
        currency_code: Валютний код для внесків.
        competitor_limit_enabled: >-
          Хоча Правила WCA не вимагають встановлювати ліміт учасників, дуже
          рекомендується це зробити.
        competitor_limit: >-
          Кількість учасників, що будуть допущені до участі. Це число має лише
          інформаційний характер і не зупиняє процес реєстрації на змагання. Ми
          працюємо над покращенням процедури реєстрації.
        competitor_limit_reason: >-
          Обгрунтування ліміту учасників. Будь ласка, заповніть це поле
          англійською!
        extra_registration_requirements: >-
          Напишіть тут ті додаткові реєстраційні вимоги, які не описані вище.
          Наприклад, як учасник має сплатити реєстраційний внесок.<br/>Будь
          ласка, заповніть це поле як <strong>українською</strong>, так і
