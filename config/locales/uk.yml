  regional_organizations:
    title: Регіональні організації
    content: WCA визнає наступні Регіональні організації
    empty: WCA ще не визнала жодну Регіональну організацію.
    how_to:
      title: Як стати затвердженою Регіональною організацією WCA
      description: >-
        WCA визнає низку Регіональних організацій в усьому світі. Мета
        Регіональної організації WCA — організовувати Змагання WCA та
        підтримувати розвиток швидкубінгу в регіоні. Країнам, які бажають
        створити Регіональну організацію, рекомендується співпрацювати з WCA у
        своєму регіоні перед подачею заявки. Щоб допомогти WCA організувати
        змагання в вашому регіоні, будь ласка зв’яжіться з найближчим Делегатом
        WCA.
    requirements:
      title: Вимоги до Регіональної організації WCA
      list:
        '1': Активно організовувати або підтримувати Змагання WCA в регіоні
        '2': >-
          Брати участь в організації Континентальних змагань WCA на своєму
          континенті, якщо цього потребує відповідна Команда організаторів
        '3': 'Поважати та виконувати Цілі, які закладені в Статуті та Положеннях WCA'
        '4': Виконувати всі відповідні Правила WCA
        '5': Приймати та виконувати рішення Персоналу WCA
        '6': >-
          Надіслати WCA копії діючого Статуту та, за наявністю, правил в
          електронному форматі
    application_instructions:
      title: Вказівки щодо подачі заявки
      description_html: >-
        Щоб подати заявку на визнання, будь ласка, заповніть <a
        href='/regional-organizations/new'>цю форму</a>.
    regional_organization_form:
