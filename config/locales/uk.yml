      delivery_error: Помилка при відправленні повідомлення.
  faq:
    title: Часті запитання
    contact_html: 'Якщо ці відповіді не допомогли, будь ласка, %{contact_us}!'
    contact_us: зв’яжіться з нами
    search_for_competition: 'Шукати змагання тут:'
    already_logged_in: Ви вже авторизовані за допомогою Вашого аккаунту WCA.
    create_an_account: 'Ви можете створити аккаунт %{here}.'
    claim_your_wca_id: 'Ви можете запросити прив’язку WCA ID %{here}.'
    create_an_account_and_claim: >-
      Створіть аккаунт %{here}. Після того, як Ви авторизуєтесь з новим
      аккаунтом, Вас попросять прив’язати WCA ID.
    answers:
      '1':
        title: Як отримати WCA ID та Профіль WCA?
        content:
          '1': >-
            Якщо Ви ніколи не змагались раніше, то візьміть участь в <a
            href='/competitions'>змаганнях</a>! WCA ID та профіль WCA будуть
            створені після того, як результати Ваших перших змагань будуть
            опубліковані.
      '2':
        title: Як я можу знайти Змагання WCA?
        content:
          '1': Перевірте наш список <a href='/competitions'>змагань</a>
      '3':
        title: >-
          Як я можу зареєструватись на змагання? Хто може допомогти, якщо в мене
          виникнуть труднощі з реєстрацією?
        content:
          '1': >-
            На більшість змагань можна зареєструватись на цьому сайті, проте
            деякі використовують власну систему реєстрації. Зв’яжіться з
            організаторами змагань, які Ви хочете відвідати, для отримання
            деталей. %{comp_search_form}
      '4':
        title: >-
          Які вимоги до тих, хто хоче відвідати Змагання WCA? Що я маю знати
          перед тим як відвідати Змагання WCA?
        content:
          '1': >-
            Зазвичай, вимог до учасника, який хоче взяти участь в Змаганні WCA,
            небагато. Проте, всі учасники змагань мають добре розуміти <a
            href='https://www.worldcubeassociation.org/regulations/'>Правила
            WCA</a>. Якщо Ви не розумієте англійську, то ми пропонуємо прочитати
            один з <a
            href='https://www.worldcubeassociation.org/regulations/translations/'>перекладів</a>.
      '5':
        title: Чи можуть Змагання WCA відбутись в моєму рідному місті?
        content:
          '1': >-
            Якщо Ви зацікавлені в організації змагання, спершу дуже
            рекомендується відвідати кілька змагань в якості учасника, щоб
            отримати досвід.
          '2': >-
            Змагання WCA мають відповідати <a target='_blank'
            href='https://www.worldcubeassociation.org/regulations/'>Правилам
            WCA</a>. Команда організаторів не повинна знати всі правила
            напам’ять, однак, глибоке розуміння принципів правил безумовно
            допоможе в правильній організації змагання.
          '3': >-
            Після цього, команда організаторів має зв’язатись з найближчим <a
            target='_blank'
            href='https://www.worldcubeassociation.org/delegates'>Делегатом
            WCA</a>. Щоб змагання визнали офіційними, на них обов’язково мають
            бути присутні один чи декілька Делегатів WCA. Останній буде
            консультувати організаторів, як провести успішні змагання.
          '4': >-
            Перегляньте <a target='_blank'
            href='https://documents.worldcubeassociation.org/edudoc/organizer-handbook/organizer-handbook.pdf'>Рекомендації
            організаторам Змагань WCA</a> для отримання детальної інформації.
      '6':
        title: >-
          Для чого потрібні аккаунти WCA? Яка різниця між аккаунтом WCA та
          профілем WCA?
        content:
          '1': >-
            Ви отримали WCA ID після того, як були опубліковані результати Ваших
            перших Змагань WCA.
          '2': >-
            Аккаунти WCA дозволяють Вам довести, хто Ви є насправді. Дозволяють
            додавати фотографію в профіль, реєструватись на змагання. Це захищає
            Вас від того, що хтось інший може видавати себе за Вас.
          '3': '%{current_user_status}'
      '7':
        title: Як змінити зображення мого профілю?
        content:
          '1': >-
            По-перше, Вам необхідно <a
            href='#how-do-i-connect-my-wca-account-with-my-wca-id'>створити
            аккаунт WCA та з’єднати його з Вашим WCA ID.</a>
          '2': >-
            Після того, як Ви з’єднаєте аккаунт WCA та Ваш WCA ID, перейдіть на
            <a href='%{profile_edit_path}'>сторінку редагування профіля</a>, щоб
            змінити зображення профіля.
      '8':
        title: Як з’єднати аккаунт WCA та мій WCA ID?
        content:
          '1': '%{current_user_claim}'
      '9':
        title: >-
          Я зареєструвався на змагання і хочу додати собі дисципліну. Що я маю
          зробити? Чи можу я запрошувати гостей на захід?
        content:
          '1': >-
            Будь ласка, зв’яжіться з організатором. Контакти можна знайти на
            сторінці змагання. Якщо Ви не впевнені, де шукати, перевірте <a
            href='/competitions'>список змагань</a>.
      results:
        title: Коли результати Змагання WCA опублікують на сайті WCA?
        content:
          '1': >-
            По завершенню змагань, Делегат WCA має перевірити картки з
            результатами і реєстраційні дані учасників, щоб виправити можливі
            помилки. Після того, як він це зробить, результати відправляются
            Команді результатів WCA (скорочено WRT), яка відповідальна за
            публікацію результатів і керування базою даних WCA. Потім WRT
            завантажують результати в базу даних якнайшвидше.
          '2': >-
            В залежності від масштабу змагань та зайнятості Делегата, це може
            тривати від одного дня до одного тижня. Будь ласка, будьте
            терплячими.
          '3': >-
            На додаток, якщо Ви з’єднали аккаунт WCA з Вашим WCA ID (див.
            нижче), Ви можете увімкнути e-mail сповіщення про появу результатів
            на сайті <a href='%{preferences_edit_path}'>тут</a>.
      regulations1:
        title: Чи моя головоломка відповідає вимогам WCA?
        content:
          '1': >-
            Ви можете знайти відповідь у Правилах WCA в <a
            href='https://www.worldcubeassociation.org/regulations/#3'>Розділі
            3</a>. Всі головоломки мають бути затверджені Делегатом WCA. Якщо Ви
            не впевнені, будь ласка, запитайте про це в Делегата Ваших змагань.
            Щоб запобігти неприємних ситуацій, будьте готові замінити
            головоломку у випадку, якщо Вам не дозволять виступати з нею.
      regulations2:
        title: Чи можу я використовувати магнітні головоломки на Змаганнях WCA?
        content:
          '1': >-
            Можна використовувати магнітні головоломки, якщо вони відповідають
            <a target='_blank'
            href='https://www.worldcubeassociation.org/regulations/'>Правилам
            WCA</a>. Будь ласка, зверніть особливу увагу на <a
            href='https://www.worldcubeassociation.org/regulations/#3h'>Правило
            3h</a>.
      regulations3:
        title: >-
          Я втратив центральну кришечку від кубика. Чи можу я виступати з такою
          головоломкою?
        content:
          '1': >-
            Ви не зможете виступати з такою головоломкою. Головоломки не мають
            містити пошкоджень або інших відмінностей, що суттєво відрізняють
            одну подібну деталь від іншої (див. <a
            href='https://www.worldcubeassociation.org/regulations/#3j'>Правило
            3j</a>).
      regulations4:
        title: 'Скільки мені має бути років, щоб виступати на Змаганнях WCA?'
        content:
          '1': >-
            Не існує обмежень за віком. Однак, особи до 18 років мають спитати
            батьків, перж ніж зареєструватись (див. <a
            href='https://www.worldcubeassociation.org/regulations/#2b'>Правило
            2b</a>).
  about:
    title: Про WCA
    mission_statement: "Наша місія — проводити більше змагань в більшій кількості
      країн з більшою кількістю людей та більшим задоволенням за справедливих та рівних
      умов."
    mission_footer: Місія WCA
    who_we_are_title: Хто ми є
    who_we_are_content_html: "<p>Всесвітня Асоціація Кубика (WCA) проводить змагання
      з розв’язання механічних головоломок, які мають групи деталей, що обертаються,
      і в світі відомі як \"twisty puzzles\". Найбільш відомою з цих головоломок є
      Кубик Рубіка, винайдений професором Ерно Рубіком з Угорщини. Деякі з цих головоломок
      є офіційними дисциплінами WCA.</p> <p>WCA суттєво еволюціонувало протягом останнього
      десятиріччя і вже більше 100 000 осіб взяли участь в наших змаганнях. Незважаючи
      на цей ріст, ми залишаємось організацією, яка працює виключно завдяки волонтерам
      — від місцевих Делегатів WCA до Ради Директорів WCA. Ми вдячні всім, хто витрачає
      свій дорогоцінний час для того, щоб WCA могла функціонувати. Маючи більшу фінансову
      підтримку, ми сподіваємось підвищити рівень професіоналізму на наших змаганнях
      та проводити більше заходів по всьому світу.</p>"
    spirit: "Наша мета — щоб люди по всьому світу весело проводили час разом в дружній
      атмосфері, допомагали один одному та дотримувались спортивної поведінки."
    spirit_footer: Мета WCA
    our_goals_title: Наші цілі
    our_goals_content_html: >-
      <p>Всесвітня Асоціація Кубика хоче надати можливості членства та лідерства
      в спільноті молодим людям у всьому світі шляхом підвищення доступності
      змагань з розв’язання механічних головоломок. Ми віримо, що досвід на
      змаганнях та всередині спільноти створює можливості для залучених молодих
      людей, та що введення нових дисциплін для нових груп людей сприяє
      зростанню нашої спільноти.</p>
    whats_next_title: Наступні кроки для WCA
    whats_next_content_html: >-
      <p>Всесвітня Асоціація Кубика має більше 100 000 унікальних учасників зі
      140 різних країн і ми не плануємо збавляти оберти! Спільнота куберів
      зростає дуже стрімко з моменту заснування організації в 2004 і ми хочемо
      підтримувати такий розвиток підвищуючи доступність змагань в нових
      регіонах. В майбутньому ми сподіваємось підтримувати нашу спільноту ще
      більше завдяки просвітництву та співпраці з тими, кого цікавлять
      головоломки.</p>
    world_championship_title: Чемпіонат Світу
    world_championship_content_html: >-
      <p>Кожні два роки ми проводимо змагання, на яких визначається чемпіон
      світу. Цей захід вимагає ретельного розрахунку кількості волонтерів та
      фінансових зобов’язань, щоб забронювати приміщення та зробити всі
      необхідні приготування.</p>
    contributing_title: Зробити внесок
    contributing_content_html: >-
      Ви можете зробити внесок з кредитної картки через сервіс Guidestar <a
      href="https://www.nfggive.com/guidestar/82-3825954">тут</a>. Якщо Ви
      бажаєте виписати чек, ось наші реквізити:
    tax_deductible_note: Внески оподатковуються згідно з чинним зконодавством 
      США.
    other_help_title: Інші способи допомогти
    other_help_content_html: >-
      <p>Якщо Ви маєте бажання допомогти Всесвітній Асоціації Кубика у
      нефінансовий спосіб, ми будемо раді Вас почути! Будь ласка, зв’яжіться з
      нами за адресою <a
      href="mailto:communication@worldcubeassociation.org">communication@worldcubeassociation.org</a>.</p>
    donation_banner:
      content: "Всесвітня Асоціація Кубика — організація, що звільнена від сплати
        податку 501(c)(3). Через те, що ми на 100% працюємо завдяки волонтерам, ми
        будемо вдячні вашим внескам, які допоможуть нам втілювати нашу місію з проведення
        більшої кількості приємних змагань в усьому світі."
      donate_credit: Зробити внесок з кредитної картки
      donate_other: Зробити внесок іншим способом
    structure:
      teams_committees_councils: 'Команди, Комітети та Ради WCA'
      title: Структура
      board:
        name: Рада Директорів WCA
        description: >-
          Рада Директорів WCA відповідальна за управління організацією вцілому
          та виконує зобов’язання, які не покривають інші Команди, Комітети та
          Ради
      committees: "Команди та Комітети WCA є інтегрованою частиною організації та
        виконують щоденні задачі, які необхідні для роботи організації. Ці комітети
        створені з членів спільноти WCA, включно з Делегатами WCA та учасниками. Кожна
        команда має лідера, який забезпечує належне функціонування команди та керує
        іншими членами команди. Рада — це спеціальний комітет, який виконує дорадчу
        роль Раді Директорів WCA та створений з членів спільноти, які не є Персоналом
        WCA. Коли комітет, команда чи рада мають вакансії, інформація про це з’являється
        на головній сторінці сайту WCA."
      senior_member: Провідний член
      leader: Лідер
      officers:
        name: Службовці WCA
        description: >-
          Службовці WCA виконують задачі, пов’язані з неприбутковим статусом
          WCA. Такі службовці обираються Радою Директорів WCA. Виконавчий
          директор є головним виконавчим службовцем WCA, Голова проводить всі
          зустрічі Ради Директорів, Секретар працює з документами організації,
          Казначей керує фінансовими питанням WCA.
      chair:
        name: Голова WCA
      executive_director:
        name: Виконавчий директор WCA
      secretary:
        name: Секретар WCA
      vice_chair:
        name: Віце-голова WCA
      treasurer:
        name: Казначей WCA
      users:
        profile: 'Профіль %{user_name}'
      wdc:
        name: Дисциплінарний комітет WCA
        description: >-
          Цей комітет допомагає Раді Директорів WCA у виняткових випадках, таких
          як порушення Правил WCA, та приймає звернення від членів WCA у випадку
          виникнення важливих питань стосовно Змагань WCA.
      wdpc:
        name: Комітет захисту даних WCA
        description: >-
          Цей комітет відповідальний за всі питання, пов’язані з захистом
          персональних даних.
      wrc:
        name: Комітет правил WCA
        description: Комітет відповідає за розробку Правил WCA.
      wrt:
        name: Команда результатів WCA
        description: Команда відповідає за управління результатами змагань.
      wst:
        name: Команда розробників WCA
        description: >-
          Команда відповідає за розробку програмного забезпечення WCA (вебсайт,
          програми для перемішування головоломок, введення результатів,
          інструменти адміністраторів).
      wct:
        name: Команда комунікації WCA
        description: >-
          Команда комунікації WCA (скорочено WCT) наглядає та підтримує зв’язок
          між WCA, спільнотою швидкуберів та громадськістю. Коммунікація має
          сприяти Цілям WCA і підтримувати загальну культуру дружелюбності,
          прозорості, інклюзивності, відкритості і відповідальності.
      wfc:
        name: Комітет фінансів WCA
        description: Ця команда відповідальна за керування фінансами WCA.
      wec:
        name: Комітет етики WCA
        description: >-
          Цей комітет має забезпечити, щоб всі процедури, які виконуються
          Персоналом WCA та Зовнішнім персоналом, відповідали Кодексу етики, та
          виконувати незалежні розслідування у випадку, якщо хтось з
          вищезазначених осіб порушує Кодекс етики. Такі розслідування можуть
          ініціюватись учасниками Змагань WCA, для яких Комітет етики WCA є
          довіреною особою. Цей комітет також є апеляційною інстанцією для тих,
          хто не згоден з рішеннями, які приймає Дисциплінарний комітет WCA.
      weat:
        name: Команда виконавчих помічників WCA
        description: >-
          Ця команда відповідальна за виконання адміністративних завдань Ради
          Директорів WCA.
      wqac:
        name: Комітет із забезпечення якості WCA
        description: >-
          Роль цього комітету — підримувати та сприяти постійному вдосконаленню
          процесів всередині WCA, застосовувати в усьому світі стандарти для
          забезпечення високої якості роботи Персоналу, Регіональних
          організацій, Організаторів Змагань та Персоналу Змагань WCA.
      wcat:
        name: Команда оголошення Змагань WCA
        description: >-
          Ця команда затверджує і оголошує Змагання WCA та забезпечує дотримання
          таких оголошень стандартам якості WCA.
      wmt:
        name: Команда маркетингу WCA
        description: >-
          Ця команда відповідальна за розвиток та управління Брендом WCA,
          допомагає в розповсюдженні Обладнання для Змагань WCA, займається
          пошуком спонсорів та збутом Мерчендайзу WCA.
      wac:
        name: Консультативна рада WCA
        description: >-
          Ця рада відповідальна за побудову та підтримку зв’язку між Спільнотою
          WCA та Персоналом WCA.
      banned:
        name: Відсторонені учасники
      operations_html: 'Щоденні операції виконують %{committees_and_teams} WCA.'
      teams_committees: Команди та Комітети
      probation:
        name: Делегати на випробуванні
      delegates_html: "<p>Роль <strong>Делегата WCA</strong> визначена в Положеннях
        WCA та описана в Правилах WCA. Основний обов’язок Делегата — спостерігати
        за змаганнями від імені WCA. Делегат WCA відповідальний за те, щоб всі Змагання
        WCA проходили у відповідності до Місії, Духу та Правил WCA. WCA розрізняє
        <strong>Провідних делегатів WCA</strong>, <strong>Делегатів WCA</strong> та
        <strong>Кандидатів в Делегати WCA</strong>%{see_link}.</p> <p>На додаток до
        обов’язків Делегата WCA, Провідний делегат WCA відповідальний за управління
        Делегатами WCA в своєму регіоні та може приймати звернення від спільноти з
        регіональних питань.</p> <p>Нові Делегати спочатку стають Кандидатами в Делегати
        WCA; згодом їм пропонують показати вміння керувати Змаганнями WCA, перш ніж
        стати Делегатом WCA.</p>"
      see_link_html: '(див. %{link})'
      members_html: >-
        Всі учасники автоматично стають <strong>членами</strong> WCA на їх
        перших Змаганнях WCA.
