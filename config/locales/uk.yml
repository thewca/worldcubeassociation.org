        розділі <a href="/faq">Часті запитання</a>! Якщо Ви бажаєте надіслати
        повідомлення конкретному комітету чи команді, Ви можете знайти їхні
        контакти на <a href="/teams-committees">цій сторінці</a>.
      title: Контактна форма WCA
      inquiries:
        competition: >-
          Зв’яжіться з організаторами конкретних змагань (будь ласка, оберіть
          нижче)
        competitions_in_general: 'Змагання вцілому (організація, правила тощо)'
        wca_id_or_profile: WCA ID або Профіль WCA
        media: Медіа
        software: Програми
        different: Інше
      submit: Відправити повідомлення
    dob:
      title: Форма запиту на зміну дати народження
      description: >-
        Скористайтесь цією формою, якщо дата народження, що зберігається в нашій
        базі даних, відрізняється від реальної.
      important_message_html: >-
        <span class="text-danger">ВАЖЛИВО</span>: Додайте фотографію <u>дійсного
        документу</u> (ID-картка, водійське посвідчення, паспорт тощо), на якому
        є Ваше ім’я, прізвище і дата народження.
