        WCAk munduan zehar eskualdeetako organizazio batzuk onartzen ditu. WCAko
        eskualdeko organizazio baten helburua WCAren eskualdean egiten dituen
        ekintzak sustatzea eta WCAko lehiaketak egitea da. Eskualdeko
        organizazio bat osatu nahi duten eskualdeei bere zonaldean WCAri
        laguntzea gomendatzen diegu eskaera bidali aurretik. Zure zonaldean
        WCAko lehiaketa bat antolatzeko laguntzarako, jar zaitez zure gertuengo
        WCAko Ordezkariarekin harremanetan mesedez.
    requirements:
      title: WCAko eskualdeko organizazioetarako baldintzak
      list:
        '1': >-
          WCAko lehiaketak aktiboki antolatu edo laguntzea organizazioaren
          eskualdean
        '2': >-
          Eskualdeko organizazioaren zonaldean gauzatzen diren WCAko lehiaketa
          kontinentalei laguntzea, dagokion antolatze taldeak eskatzen badu
        '3': >-
          WCAko ordenantza eta mozioetan ezarritako helburuak errespetatu eta
          martxan jarraraztea
        '4': WCAko erregulazio guztiekin bat egitea
        '5': WCAko bolondresen erabakiak onartu eta berekin bat egitea
        '6': >-
          WCAn fitxategi bat mantentzea barruan organizazioaren momentuko
          ordenantzak eta, ahal bada, erregulazioak formatu elektroniko batean
    application_instructions:
      title: Eskaera argibideak
      description_html: >-
        Onarpenerako eskaera egiteko, bete <a
        href='/regional-organizations/new'>formulario hau</a> mesedez.
    regional_organization_form:
      filling_instructions_html: 'Faborez, bete dena <b>ingelesez!</b>'
      public_information: Informazio publikoa
      private_information: Informazio pribatua
      private_information_disclaimer: Beheko informazio guztia WCAko Zuzendarien
        Batzarrak ikus dezake soilik
    errors:
      end_date_after_start_date: ezin da onartu data honetara arte
    create:
      create_success: >-
        Eskaera arrakastaz bidali da! Zoaz zure e-maila ikustera mesedez, eta
        itxaron WCAko Zuzendarien Batzarrak aztertu dezala
    delete:
      confirm_delete: Eskualdeko organizazirako eskaera hau ezabatu nahi duzula 
        ziur zaude?
  score_tools:
    title: WCAko lehiaketetarako software erremintak
    wca_icon_text: WSTk garatua eta eguneratua
    intro:
      desc: >-
        Orrialde hau WCAko lehiaketetako antolaketarekin laguntzeko erabil
        daitezkeen eta ezagunak diren tresnen zerrenda ez oso zabala da.
      disclaimer: >-
        Orrialde horretako tresna guztiak ez ditu WSTk eguneratzen: lasai! Ez
        daukagu WCArekin zerikusia duen kanpoko software guztia kudeatzeko adina
        eskulan :)
      used: >-
        Zerrenda honetako programa denak WCAko lehiaketa errealetan erabili izan
        dira eta WCAko webgunearekin integratu dira: zure WCAko kontuarekin
        saioa hastea uzten dizute zure hurrengo lehiaketetako datuak
        inportatzeko (eta batzuetan eguneratzeko). Horietako bakoitzerako
        zaintzaileari/zaintzaileei idatziko zaie argiki.
    before:
      title: Lehiaketa aurretik
      desc: >-
        Lehiakideen erregistroak WCAko webgunean bertan antola daitezke. Taldeak
        eta bolondresak eskuz antolatzeak denbora dezente har dezakeenez, azpiko
        tresnak erabiltzea kontuan izan dezakezu.
    during:
      title: Lehiaketa aurrera doan heinean
      desc: >-
        Hemen lehiaketa aurrera doan bitartean emaitzak kudeatzeko tresnak
        topatuko dituzu.
    after:
      title: Lehiaketaren ostean
      desc: >-
        Emaitzen baieztatzea webgunean bertan ematen bada ere, TNoodlek
        sortutako nahasketak WCAko webgunean igotako emaitzei esleitzeko
        tresnaren bat erabili behar izanen duzu
    tools:
      age:
        title: ADINA
        description: >-
          WCAko lehiaketetako talde/zereginak esleitzeak sortzeko eta editatzeko
          tresna
      certificates:
        title: Ziurtagiriak
        description: WCAko lehiaketetarako ziurtagiriak inprimatu WCA Live 
          erabiliz
      groupifier:
        title: Taldekatzailea
        description: >-
          WCAko lehiaketetako antolatzaileentzako zeregin eta talde antolatze
          tresna. Ezaugarri nagusien artean hau aurkituko duzu: lehiakideak
          mailatzeen arabera sortatu, lanak esleitu (epaiketa, nahastea), zenbat
          nahasketa behar diren erabaki, denbora-orriak sortu, orri pertsonalak,
          eta laburpenak... Zoaz webgunea begiratzeea gehiago jakiteko.
      scorecards:
        title: Denbora-orriak
        description: WCAko lehiaketetarako denbora-orriak WCA Live bidez 
          inprimatu
      tnoodle:
        title: TNoodle (Nahasketak)
        description: >-
          TNoodle WCAko lehiaketetan erabiltzen den nahasketa programa ofiziala
          da. WCAko Ordezkariak lehiaketa baino lehen erabiltzen ohi du, baina
          bere interfazeak beste edonori WCAko proba denetarako nahasketak
          sortzen uzten dio.
      live:
        title: WCA Live
        description: >-
          WCAko lehiaketak gidatu eta munduarekin zuzeneko emaitzak partekatzeko
          plataforma.
      nightmare:
        title: Emaitzen kalkulu-orria
        description: >-
          Batzuetan gauzak pasatzen dira... Internetik gabe bazaude, aspaldiko
          laguna den kalkulu-orria erabili beharko duzu.
      matcher:
        title: Nahasketa adjudikatzailea
        description: >-
          TNoodlek sortutako nahasketak emaitzei adjudikatzeko erabil daiteke.
          Emaitzak WCAko webgunetik (WCA Live erabiltzerakoan), kalkulu-orri
          bat, edo WCIF fitxategi autonomo bat inportatu. Nahasketak TNoodle
          json fitxategi bat edo gehiagotik inportatu. Emaitzak WCAri bidaltzeko
          formatu aproposak esportatu.
      groups:
        title: Lehiaketa taldeak
        description: Unean gauzatzen ari den edozein lehiaketen taldeak ikusi
  logo:
    title: WCAren Logotipoa
    intro: >-
      WCA logotipoa Justin Eastman-ek diseinatu zuen, diseinu lehiaketa batean
      2005eko urtarrilean. Logotipoa gustatu zitzaigun bere diseinuagatik,
      koloreengatik eta ez duelako bereziki 3x3x3 kubo bat erakusten.
    headings:
      usage_guidelines:
        title: Erabilera-gidalerroak
        paragraph:
          acceptable_usage: >-
            WCAko logoaren erabilera onargarria <a
            href="https://documents.worldcubeassociation.org/documents/policies/external/Logo%20Usage.pdf">WCAko
            Logo Erabilera Politikan</a> nabarmendua dago. Zeure proiektuetan
            erabili aurretik irakurri dokumentu hau mesedez. WCAko logoaren
            erabilerari buruzko beste galderarik <a
            href="mailto:marketing@worldcubeassociation.org">WCAko Marketing
            Taldeari</a> bidali.
          see_below: >-
            Azpian WCAko logoaren erabilera zuzenari buruzko osagarri moduko
            jarraibideak daude.
        color:
          title: Kolorea
          paragraph: >-
            WCAko logoa lau kolore bariazioetan existitzen da. Kolore aldaera
            zuzena logoa jarriko den tokiaren atzekaldeko kolorearen arabera
            erabili behar litzateke.
          primary:
            title: Nagusia
            paragraph: Ahal den heinean aldaera nagusia erabili.
          mono:
            title: Mono
            paragraph: Aldaera nagusia aproposa ez denean soilik erabili mono 
              aldaera.
        logo_only:
          title: Logoa bakarrik
          paragraph: >-
            WCAko logoa logotipoa gabe erabili daiteke, aurreko kolore
            jarraibide berberak jarraituz.
      download_logo_assets:
        title: Logoaren abantailak deskargatu
        paragraph: >-
          WCAko logoaren bereizmen handiko PNGak eta bektore bertsioak deskarga
          daitezke.
        accept_terms_and_conditions: >-
          <a
          href="https://documents.worldcubeassociation.org/documents/policies/external/Logo%20Usage.pdf">WCAko
          Logo Erabilera Politika</a> osoa irakurri eta onartzen dut.
        download_button_text: Logoaren abantailak deskargatu
