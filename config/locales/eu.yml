      title: Boluntarioa
      text: >-
        Parte hartu! WCAk boluntarioentzako postu asko dauzka irekita hainbat
        talde desberdinetan. Ez duzu kubolaria izan beharrik boluntario izateko.
    faq:
      title: OG
      text: >-
        Begiratu gure ohiko galderen zerrenda, laguntza behar baduzu. Buruan
        dauzkazun galdera askok erantzuna hemen izan lezakete.
    contact:
      title: Kontaktua
      text_html: >-
        Gurekin harremanetan jarri nahi baduzu, gure harremanetarako
        formularioaren bidez egin dezakezu. WCAren prozesu desberdinei buruz
        galderaren bat baduzu, zoaz %{faq_link}!
      faq: Ohiko Galderetara
      button: Eraman nazazu WCArekin harremantzeko formulariora
    support:
      title: WCA lagundu
      text: >-
        Kuboaren Mundu Elkarteak ez du zergarik ordaintzen 501(c)(3). Bere %
        100ean irabazi asmorik gabeko erakunde bat denez, ongietorria ematen
        diegu zuen donazioei, mundu osoan lehiaketa atseginagoak izateko dugun
        ikuspegia hobetzen laguntzeko.
      button: WCA nola lagundu dezakezun inguruan gehiago jakin
    become_delegate:
      title: Egin zaitez ordezkari!
      link_title: Orain apuntatu
