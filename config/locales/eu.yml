    see_all_announcements: Iragarpen guztiak ikusi
    about_us:
      title: Gutaz
      text: >-
        Munduko Kuboaren Elkarteak (World Cube Associationek) pieza multzoak
        maneiatuz funtzionatzen duten puzzle mekaniko eta "buru-hausgarri
        bihurriak" deitzen zaien lehiaketak zuzentzen ditu.
    competitions:
      title: Lehiaketak
      text_html: >-
        Ezagutu ezazu zurengadik hurbil dauden lehiaketei edo lehiaketen
        emaitzei buruz. Lehiaketaren batean zaude eta emaitzak ikusi nahi
        dituzu? Zoaz hona %{wca_live_link}!
    merchandise:
      title: Merkantzia
      ad_new: Berria
      text_html: >-
        Begira ezazu gure merkantzia ofizial berria, elastikoetatik sudaderetara
        hedatzen den arropa sorta duena.
      link_title: Dendaren esteka
    records:
      title: Errekorrak
      text: 'Begiratu oraingo edo iraganeko errekorrak, WCAko kategoria guztietan.'
