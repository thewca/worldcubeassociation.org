          Mesedez, bete hau ingelesez.
      user:
        dob: Lehiatzailearen jaioteguna UUUU-HH-EE formatuan sartu.
        name: >-
          Sartu lehiakidearen izen-abizen osoaak zuzen, mesedez, adibidez,
          <strong>José Miguel Beguiristain</strong>. Ez erratikotiki <strong>jm
          beguiristain</strong> bezala. <br/>Bigarren izenak (osoak edo
          inizialak) aukerakoak dira.
        pending_avatar: >-
          Irudi berri bat igo ondoren, WCAko Emaitzen Taldeak onartu arte
          itxaron beharko duzu.
        registration_notifications_enabled: >-
          Hau antolatzen edo ordezkatzen dituzun lehiaketetan aplikatzen da
          besterik, eta lehiaketa bakoitzean berridatz dezakezu.
        receive_developer_mails: >-
          Hau baliabideen bertsio aldaketa nagusietara mugatuta dago, hala nola
          data esportaziora, WCIF eskemara eta API publikoetara. Baliabide hauen
          beharra dutenentzat gomendatua da.
        receive_delegate_reports: >-
          Senior Ordezkaria edo WRCko edo WQACko kidea bazara, Ordezkarien
          Txostenak automakikoki jasotzen dituzu. Oharra: aldaketa burutzeak
          ordubetera arte har dezake.
        delegate_reports_region: >-
          Txosten guztiak jaso nahi badituzu, utzi gune hau hutsik (menu
          zabalgarri aukera goi-goian). Oharra: aldaketa burutzeak ordubetera
          arte har dezake.
        otp_attempt: >-
          Ikuskatu zure behin-behineko pasahitz bat lortzeko konfiguratutako
          aplikazio mugikorra edo sartu zure berreskuratze-kodeetako bat.
      dob_contact:
        dob: 'Zure jaiotegun zuzena, UUUU-HH-EE formatuan'
        document: >-
          Zure nortasuna eta jaiotza-data egokia dela frogatzeko, legezko
          edozein agiriren irudia erantsi behar duzu (nortasun-agiria,
          gidabaimena, ikasle-txartela, pasaportea, jaiotza-ziurtagiria...), non
          zure izena eta jaiotza-data hiztun ingeles batentzat ikusgarriak eta
          ulergarriak diren (edo jarri zaitez harremanetan zure zonaldeko WCAko
          ordezkariarekin, horrelako agiririk ez baduzu). Identifikazioan zure
          izena eta jaioteguna behar ditugu gutxienez; identifikazioari buruzko
          beste edozein datu pertsonal tapatu/lausotu ditzakezu.
      post:
        body: >-
          Erabili &lt;!-- etenaldia --&gt; etiketa orrialde nagusian aurrebista
          bistaratzeko. Orrialde nagusiko edozein argitalpenek etenaldi horren
          aurretik testu osoa erakutsiko du. Egiazko postak gorputz osoa
          erakutsiko du.
        show_on_homepage: >-
          Kontuz! Hau ez da datu pribatuetarako segurua. Orri nagusia ez
          aglomeratzeko baino ez da. Orri nagusian agertzen ez diren mezuak
          oraindik ere permalink edo etiketen bidez eskuragarri daude.
      delegate_report:
        schedule_url: >-
          Argitaratutako egutegirako esteka osoa (adibidez:
          https://sites.google.com/site/basauriopenrubik/basauri-open-2016/horario)
        equipment: >-
          Lehiaketan erabilitako kronometro eta display kopurua eta mota.
          Mesedez, kendu erabili ez dituzun lineak.
        summary: >-
          Goian zerrendatutako puntuak bakarrik txosten oso baterako gidatzeko
          dira. Erabil itzazu zure nahierara zuretzat bat etortzen denerako.
          Ezabatu erabili gabeko zatiak mesedez!
        venue: >-
          Aipatutako puntuak txosten oso bat orientatzeko baino ez dira. Erabil
          itzazu egoki ikusten dituzun bezala. Faborez, kendu erabili gabeko
          piezak!
        organization: >-
          Aipatutako puntuak txosten oso bat orientatzeko baino ez dira. Erabil
          itzazu egoki ikusten dituzun bezala. Faborez, kendu erabili gabeko
          piezak!
        incidents: >-
          Mesedez, ohiko kasuak ez diren gertaera guztiak aipa itzazu hemen,
          "1."-rekin hasita, beste ordezkari batzuek haiei buruz beren zenbakien
          bidez hitz egin dezaten. Dena generikoa iruditu arren, kasurik
          nabarmenenak zerrendatu bederen. Mesedez, markatu ondoko lauki hauek
          iritziren bila ari bazara.
        setup_images: >-
          Gutxienez %{image_count} irudi erantsi behar dituzu zeintzuk
          lehiaketaren antolamendua irudikatzen duten (nahas-gunea, lehia-gunea,
          etab), lehiaketan zeharkoak badira hobe. Hainbat fitxategi aukeratu
          ditzakezu batera. Irudiak bakarrik besteak nahikoak direnean ezabatu
          ditzakezu (irudi bat ordeztu nahi baduzu, lehenengo berria igo beharko
          duzu, eta gero zaharra ezabatu). Ez baduzu lehia-guneko mementuko
          irudirik edota nahas-gunea erabiltzen ari zen bitarteko irudirik
          azaldu zergatik mesedez.
        wrc_incidents: >-
          WRCren feedbacka jasotzea nahi zenukeen edozein gertaeren zenbakien
          zerrenda.
        wic_incidents_html: >-
          WICren feedbacka jasotzea nahi zenukeen edozein gertaeren zenbakien
          zerrenda. <br> <strong>%{wic_incident_alert}</strong>
        wic_incident_alert: >-
          WICko gertakaria kontuzkoa bada (delituak, jazarpenak, erasoak, etab.
          barne eta ez bakarrik), utzazu txostenetik kanpo eta igor iezaiozu
          WICri e-mail bidez bereizirik. WICko bestelako gertakarietarako jo
          ezazu gertakariaren bertsio anonimizatu eta labur batera, eta jarraitu
          ezazu modu pribatuan WICrekin xehetasun gehiagorekin. Hala ere WICk
          feedback-a bertsio anonimizatuekin hornituko du kontzientzia
          orokorrerako. WCAko Bolondresen batek zerikusia duen gertakarietan
          utzi xehetasun guztiak txostenetik kanpo eta jar zaitez WICrekin
          harremanetan modu pribatuan.
        remarks: >-
          Hitz egin partekatu nahiko zenukeen beste edozein xehetasunez
          (adibidez, komunitatearen barruko hobekuntza/erregresioa, eskualde
          honetarako etorkizunerako planak). Aurreko atalak laburragoak izateko
          ezer idatzirik utzi baduzu, hemen apia ditzakezu.
      competition_tab:
        name: 'Adibideak: bidaiak, ordainketak, sariak, ostatua'
      regional_organization:
        website: Baliozko http(s) helbidea izan behar du. HTTPS gomendatzen da
        logo: >-
          Argazkiak PNG formatuan egon behar du, bereizmen onekoa eta atzealde
