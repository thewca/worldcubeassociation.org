  media_and_instagram:
    page_title: Media eta Instagramerako bidaltzea
    general_media_submission:
      title: Media generala bidaltzea
      body_html: >-
        WCAk <a href="/media">media orrian</a> komunitateak partekaturiko
        lehiaketetako artikulu eta irudiak partekatzen ditu. Partekatu nahi
        zenukeen zerbait badaukazu, bete gure <a href="/media/new">media
        generala bidaltzeko formularioa</a>!
    instagram_submission:
      title: Instagramerako bidaltzea
      paragraph1_html: >-
        Agian ikusi izan duzun bezala, WCAk <a
        href="https://www.instagram.com/thewcaofficial/">Instagram aktibo</a>
        bat dauka! Mundu osoko kubozaleek bidaltzen dizkiguten edukiak igotzen
        ditugu, munduko kuboen komunitatea ahalik eta hobekien islatzeko.
      paragraph2: >-
        Kalitate handiko irudi edo bideoak badituzu guk gure Instagramean igo
        ditzagun nahi dituzunak, sakatu boroia eta formularioa bete! Zure edukia
        igo dezagun zeurea izan behar da eta WCAk igotzeko baimena eman behar
        dizu. Horietako asko iristen zaizkigunez, ezin dugu dena igo, baina hona
        hemen zenbait aholku:
      photo_quality: >-
        Ziurtatu ezazu argazki/bideo kalitatea ona dela. Ez du zertan
        profesionalki aterata izan behar baina kalitateak ez luke argazki edo
        bideotik aldendu behar.
      photo_interest: >-
        Saiatu zure edukia ikusle zabal batentzako interesgarria egiten.
        Pertsona gutxi batzuentzat besterik interesgarria den edukia ez da
        ongietorria.
      wca_related: >-
        WCArekin zerikusia duten argazki eta bideoak igo, gure kontua honetara
        arras bideratuta baitago! Kubozaleak gozatzen ikustea maite dugu!
      submit_instagram_content: Instagrameko edukia bidali
    instagram_hosting:
      title: Instagrameko ostatzea
      paragraph1_html: >-
        Batzuetan, komunitateko kideei WCAko Instagram kontu ofizialeko
        storyetan WCAko lehiaketa ofizial bat aurkeztea! Interesik baduzu,
        sakatu botoian eta beheko formularioa bete. WCAko Komunikazio Taldeak
        zurekin harremanetan jarriko da informazio guztia bidali eta gero
        aurkezteko onartzen bazaituzte. Galderarik baduzu <a
        href="https://www.worldcubeassociation.org/contact/website">jarri
        harremanetan gurekin</a>.
      paragraph2: >-
        Gure helburua kubozale eta lehiaketa denen alde pertsonal txiki bat
        partekatzea da. Ustez, honek ez dakar asteburuan zeharrerako zama
        handirik, noski lehiaketa goza dezazun da lehentasuna eta gero partekatu
        ahal izatea.
      paragraph3: 'Aurkezle baten lana zera bezala labur daiteke:'
      short_intro: 'Sarrera motz bat egin, zeure buruaz eta lehiaketaz mintzatu'
      venue_feel: >-
        Klip batzuk grabatu leku eta jendearen sentsazio bat lortzeko, hau
        lehiakide zona eta ebazpen zonatik argazki bat izan liteke
      people_solving: >-
        Jendea ebazten ari delarik argazkiak atera (azkarran den jendea bere
        proba nagusian, ahal izanez gero)
      mini_interviews: >-
        Jendearekin ekarrizketa txiki batzuk lortzea saia zintezke
        (antolatzaileekin, ordezkariekin, etab.) lehiaketari buruz zer
        pentsatzen duten esanez.
      pictures_too: 'Argazkiak ere bidal ditzakezu, ez du zertan bakarrik bideoak
        izan behar'
      paragraph4: >-
        Gure asteburuko komunikazioak normalean WhatsApp talde batetik burutzen
        dira. Ziurta zaitez mezularitza-zerbitzura ohituta zaudela edo esaguzu
        hau erabili ezin baduzu beste plan batzuk antola ditzagun.
      apply_to_host: Aurkezle izateko aurkeztu
    other_suggestions:
      title: Beste iradokizunik?
      body_html: >-
        Instagramerako edo beste sare sozial baterako edukietarako iradokizunik
        al duzu? <a
        href="https://www.worldcubeassociation.org/contact/website">Esaguzu</a>!
  footer:
    privacy: Pribatutasuna
    disclaimer: Erantzunkizun deskargua
  api:
    manage_oauth_html: 'Zoaz %{oauth_link} ikustera zure OAuth aplikazioak kudeatzeko.'
    token_request_intro: >-
      Honatx adibide bat, curl erabiliz, sarbide tokena lortzearena Aplikazio
      IDa erabiliz, Client Secret, zure WCA e-maila eta zure pasahitza:
    user_email_placeholder: ZURE_E-MAILA
    user_password_placeholder: ZURE_PASAHITZA
    user_info_request_intro: >-
      OAuth sarbide token bat erabil daiteke hau agortu arte, autorizatutako API
      eskaerak egiteko. Adibidez, zure kontuari buruzko informaziora atzitzeko:
    legal_tnoodle_api_header: TNoodleko bertsio legala
    login_message: Hasi saioa mesedez
  merch:
    title: WCAko merkantzia
    paragraphs:
      '1': >-
        WCAk merkantzia esklusiboa dauka salgai! Kamisetak, sudaderak,
        pegatinak, stackmatak, motxilak eta gehiago! Gure diseinuak etengabe
        eguneratzen dira, WCAko logoa, Munduko Txapelketako merkantzia ofiziala
        eta Munduko Errekorreko diseinuak barne.
      '2': >-
        Gure dendetan WCAko merkantzia erostea WCA - irabazi asmorik gabeko,
        bolondreski kudeatutako organizazioa, laguntzeko era hobenetakoa da.
        Merkantziatik ateratako irabaziak txapelketetan, ekipamenduan eta WCAko
        zerikusia duten beste ekintzetan finantzatzeko erabiltzen dugu.
      '3': >-
        Gure merkantzia mundu osoan zehar erosi dezakezu -- Europan, Amerikan
        eta Indian denda fisikoak ditugu, eta laster gehiago izanen dira!
  database:
    results_export:
      heading: WCAko emaitzak esportatzea
      deprecation_warning: >-
        ZAHARKITZE JAKINARAZPENA: emaitzaen esportazioaren %{old_version}
        bertsioa zaharkitu da, eta berarako euskarriak hornitzeari utziko dio
        %{deprecation_date} datatik aurrera. Aldatu %{new_version} bertsiora
        data igaro aurretik.
      description: >-
        Orrialde honetan WCAko emaitzak hainbat formatutan deskargatzeko
        eskaintzen ditugu, orokorki erabili edota aztertzeko. Hau lehiaketa
        asteburu bakoitza ondoren eguneratuko dugu emaitzak bukatzerakoan.
        Fitxategi hauek zenbakitu eta datatuak daude, bertsio berriena duzula
        ziurta dezazun.
      permalink: permalink
      permalink_note: >-
        Oharra: permalinkek azken emaitzen esportazioa bidaltzen du bertsioaren
        arabera. Adibidez, v2 permalinkek azkeneko v2 esportazioa bueltatuko du,
        baina v3 bertsioan geratuko da v3 ateratzen denean ere.
      file_formats:
        sql: 'SQL argiketak, SQL datutegietara inportatzeko.'
        tsv: >-
          Fitxa banandutako balioak, OpenOffice.orgeko, Excelgo, eta abarreko,
          kalkulu-orrietarako.
      hint_readme_html: >-
        Batera datorren %{readme_filename} fitxategiak erabilera baldintzak eta
