  about_regulations:
    title: Erregulazioei buruz
    panel1:
      title: Erregulazioak
      content1_html: >-
        Lehiaketa denek <a href="/regulations/">WCAko erregulazioak</a> jarraitu
        behar dute. Lehiakideek beren lehen lehiaketa baino lehen erregulazio
        hauek irakur ditzaten garrantzitsua da.
      content2_html: >-
        WCAko Araudi Komiteak ebatzi zituen lehiaketetan gertatutako gertakariei
        buruzko erabaki garrantzitsuak <a href="/incidents">Gertakari
        Erregistroan</a> daude.
    panel2:
      title: Itzulpenak
      content1_html: >-
        WCAko erregulazioak ez daude ingelesez ikusgarri soilik, baina hainbat
        WCAko kidek beste hizkuntzetara itzuli dituzte: <a
        href="/regulations/translations/">Itzulpenak</a>.
      content2_html: >-
        <strong>Garrantzitsua</strong>: Itzulpenak oso lagungarriak badira ere,
        ez dira ofizialak. Lehiaketetan, WCAko erregulazioen ingeleseko bertsioa
        da bete beharrezkoa.
    panel3:
      title: Erregilazioei buruzko OG
      content1_html: >-
        <a href="/faq">OG atalean</a> WCAko erregulazioei buruzko galdera
        ohikoei erantzuna ematen zaie.
    panel4:
      title: Antolatzaileentzako eskuliburua
      content1_html: >-
        Lehiaketa bat antolatu nahi baduzu edo antolatzekotan bazaude, irakurri
        gure <a
        href="https://documents.worldcubeassociation.org/edudoc/organizer-handbook/organizer-handbook.pdf">antolatzaileentzako
        eskuliburua</a> mesedez.
      content2_html: >-
        Dokumentu honek informazio garrantzitsua dauka eta
        lehiaketa-antolatzaile orok irakurri behar dute.
  regulations_translations:
    title: 'WCAko Araudia: Itzulpenak'
    paragraph1: >-
      Ingelesa ez den hizkuntzaren bat hitz egiten baduzu, agian itzulpen hauek
      baliagarri sortatuko zaizkizu.
    paragraph2: >-
      Gogoratu itzulpenek ez dutela estatus ofizialik, WCAko webgunean
      egonagatik ere: ez dute deus bermatzen. Itzulpena eta (oraingoko ofiziala
      denaren) ingeleseko bertsioaren artean desberdintasunik badago,
      ingelesekoa erabili behar da.
    translations: Itzulpenak
    current: Oraingoak
    old: Zaharrak
    table_elements:
      version: Bertsioa
      language: Hizkuntza
    translating: Erregulazioak itzultzea
    paragraph3_html: >-
      Itzulpen bat gehitzen/eguneratzen interesatuta bazaude, zoaz <a
      href="https://github.com/thewca/wca-regulations-translations#translation-instructions">GitHubeko
      itzulpenetako gordetegietara</a> mesedez.
