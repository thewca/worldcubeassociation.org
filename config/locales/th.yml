      currently_connected_info: >-
        การแข่งขันนี้จัดทำขึ้นเพื่อรับการชำระเงินผ่าน %{provider} Delegate
        ของการแข่งขันควรติดต่อ WCAT เพื่อเปลี่ยนแปลงบัญชีที่เชื่อมโยงกัน
      before_disconnect_warning: >-
        การยกเลิกการเชื่อมต่อบนหน้านี้จะทำให้เว็บไซต์ของเราลืมการเชื่อมต่อกับบัญชี
        %{provider} ของคุณ แต่แดชบอร์ด %{provider} ของคุณ (ดูลิงก์ด้านล่าง)
