        สมาคมลูกบาศก์โลกเป็นองค์กรที่ได้รับการยกเว้นภาษีประเภท 501(c)(3)
        ในฐานะองค์กรไม่แสวงหาผลกำไรที่ดำเนินการโดยอาสาสมัคร 100%
        เรายินดีรับการบริจาคของคุณ
        เพื่อช่วยเราส่งเสริมวัตถุประสงค์ของเราในการเสริมสร้างศักยภาพให้กับชุมชน
