        comment_overview: คอมเมนต์ของคุณ
        until: 'คุณสามารถแก้ไขการสมัครของคุณได้จนถึง %{date}'
        passed: คุณไม่สามารถอัปเดตการลงสมัครของคุณได้อีกต่อไป
        view_registration: ดูการสมัครการแข่งขัน
        editing_disabled: การแก้ไขการสมัครถูกปิดใช้งานสำหรับการแข่งขันครั้งนี้
        registration_status:
          accepted: การสมัครของคุณได้รับการยอมรับแล้ว
          pending: 
            การสมัครของคุณอยู่ระหว่างการได้รับการยอมรับจากผู้จัดการแข่งขัน
          cancelled: การสมัครของคุณถูกลบแล้ว
          rejected: การสมัครของคุณถูกปฎิเสธ
          waiting_list: 'คุณอยู่ใน Waiting List ลำดับที่ %{waiting_list_position}'
        disclaimer: 
          การสมัครการแข่งขันไม่ได้หมายถึงว่าจะได้รับอนุมัติให้เข้าแข่งขัน
        processing: การสมัครของคุณอยู่ระหว่างดำเนินการ...
        processing_longer: >-
          เราได้รับการสมัครของคุณแล้ว และจะดำเนินการในเร็วๆ นี้
          ซึ่งอาจใช้เวลาสักครู่ถ้าเซิร์ฟเวอร์ของเรามีการใช้งานสูงอยู่
        processing_queue: 'การสมัครจำนวนมากกำลังดำเนินการอยู่ ซึ่งมี %{queueCount}
          อยู่ในคิว'
        event_limit: >-
          การแข่งขันนี้จำกัดจำนวนประเภทการแข่งขันที่คุณสามารถสมัครได้ไว้ที่
          %{max_events} ประเภท
        waiting_list_count:
          other: มีผู้เข้าแข่งขัน %{count} รายอยู่ในรายชื่อรอ
      errors:
        events: การโหลดประเภทการแข่งขันล้มเหลว โปรดลองอีกครั้ง
        '-1': >-
          คุณได้ส่ง Token ที่ไม่ถูกต้อง โปรดรีเฟรชหน้านี้ หากปัญหานี้ยังคงอยู่
          โปรดติดต่อ WST
        '-2': Authentication หมดอายุ โปรดรีเฟรชหน้านี้
        '-3': ไม่มี Authentication กรุณาเข้าสู่ระบบ
        '-4': พบข้อผิดพลาดของระบบการสมัครการแข่งขัน กรุณาติดต่อ WST
        '-1000': ไม่มีการแข่งขัน
        '-1001': เกิดข้อผิดพลาดในการเรียกรายละเอียดการแข่งขัน 
          โปรดลองอีกครั้งในภายหลัง
        '-2001': คุณถูกแบนจากการแข่งขันในการแข่งขัน WCA
        '-2002': Profile ของคุณไม่สมบูรณ์
        '-2003': คุณไม่มีสิทธิ์ดำเนินการนี้ให้เสร็จสิ้น
        '-2004': >-
          คุณไม่สามารถสมัครการแข่งขันได้เนื่องจากผู้จัดการแข่งขันได้ปฏิเสธการสมัครของคุณ
          โปรดติดต่อพวกเขาหากคุณคิดว่ามีข้อผิดพลาดเกิดขึ้น
        '-3000': ไม่มีการสมัคร
        '-3001': คุณได้สมัครการแข่งขันอื่นในซีรียส์นี้ไปแล้ว
        '-4000': คำขอมีข้อมูลที่ไม่ถูกต้อง
        '-4001': เลยกำหนดเวลาแก้ไขประเภทการแข่งขันแล้ว
        '-4002': จำนวนผู้ติดตามเกินจำนวนที่อนุญาต
        '-4003': ความคิดเห็นที่ให้ไว้ยาวเกินไป
        '-4004': ส่งการเลือกประเภทการแข่งขันไม่ถูกต้อง
        '-4005': การแข่งขันครั้งนี้ต้องการให้ใส่ความคิดเห็น
        '-4006': จำนวนผู้เข้าแข่งขันถึงจำนวนจำกัดแล้ว
        '-4007': สถานะการสมัครการแข่งขันไม่ถูกต้อง
        '-4008': การรับสมัครปิดแล้ว
        '-4009': >-
          มีเพียงผู้จัดการแข่งขันเท่านั้นที่สามารถยกเลิกการสมัครการแข่งขันของการแข่งขันนี้ได้
        '-4010': The Waiting List Position is not Valid
        '-4011': คุณสามารถยอมรับได้เฉพาะคนแรกที่อยู่ใน waiting list เท่านั้น
        '-4012': คุณไม่มีคุณสมบัติเข้าแข่งขันในประเภทที่เลือก
        '-4013': >-
          ไม่สามารถรับผู้ที่ไม่ใช่ผู้เข้าแข่งขันใหม่ได้เมื่อเหลือเพียงที่นั่งสำหรับผู้เข้าแข่งขันใหม่ที่จองไว้เท่านั้น
        '-4014': คุณได้สมัครเข้าร่วมการแข่งขันนี้แล้ว
        '-4015': >-
          กรุณาระบุจำนวนผู้ติดตามในจำนวนที่เหมาะสม
          หรือติดต่อผู้จัดการแข่งขันหากคุณต้องการนำผู้ติดตามมาเป็นจำนวนมาก
        '-6001': WCA Payment ไม่ได้เปิดใช้งานสำหรับการแข่งขันครั้งนี้
        '-6002': คุณต้องสมัครการแข่งขันให้เสร็จสิ้นก่อนจึงจะสามารถชำระเงินได้
        '-6003': ไม่พบการชำระเงินค้างชำระ - 
          อาจเป็นเพราะคุณได้ชำระเงินค่าสมัครไปแล้ว
        '-7001': ผู้เข้าแข่งขันยังมีค้างชำระค่าสมัครการแข่งขัน
        '-7002': การยอมรับการสมัครอัตโนมัติไม่ได้เปิดใช้งานสำหรับการแข่งขันนี้
        '-7003': >-
          สามารถยอมรับการสมัครการแข่งขันที่รอดำเนินการหรือตำแหน่งแรกในรายชื่อรอโดยอัตโนมัติเท่านั้น
        '-7004': การแข่งขันได้ถึงเกณฑ์ auto_accept_disable_threshold แล้ว
        '-7005': >-
          ไม่สามารถยอมรับการสมัครการแข่งขันอัตโนมัติได้ในขณะที่ยังไม่เปิดรับสมัครการแข่งขัน
    errors:
      must_use_wca_registration: >-
        ระบบยอมรับการสมัครอัตโนมัติสามารถใช้ได้เฉพาะกรณีที่คุณใช้เว็บไซต์ WCA
        ในการรับสมัครการแข่งขันเท่านั้น
      must_use_payment_integration: >-
        คุณต้องเปิดใช้งานการชำระค่าสมัคร (เช่น Stripe)
        เพื่อใช้การยอมรับอัตโนมัติ
      auto_accept_limit: >-
        ขีดจำกัดสำหรับการยอมรับการสมัครอัตโนมัติจะต้องน้อยกว่าขีดจำกัดของผู้แข่งขัน
      auto_accept_not_negative: >-
        ขีดจำกัดสำหรับการสมัครการแข่งขันที่ได้รับการยอมรับอัตโนมัติไม่สามารถน้อยกว่า
        0 ได้
      auto_accept_accept_paid_pending: >-
        ไม่สามารถเปิดใช้งานการยอมรับอัตโนมัติได้หากมีการสมัครการแข่งขันที่รอการชำระเงินอยู่
        - ยอมรับการสมัครเหล่านั้นหรือย้ายการสมัครเหล่านั้นไปยังรายชื่อรอ
      auto_accept_accept_waitlisted: >-
        ไม่สามารถเปิดใช้งานการยอมรับอัตโนมัติ -
        กรุณายอมรับผู้ใช้จากรายชื่อรอให้ได้มากที่สุด
      auto_close_exceed_paid: >-
        เกณฑ์การปิดรับสมัครอัตโนมัติจะต้องมากกว่าจำนวนการสมัครที่ชำระเงินในปัจจุบัน
      auto_close_positive_nonzero: เกณฑ์การปิดรับสมัครอัตโนมัติต้องมากกว่า 0
      must_exceed_competitor_limit: 
        เกณฑ์การปิดรับสมัครอัตโนมัติจะต้องมากกว่าขีดจำกัดของผู้แข่งขัน
      use_wca_registration: การแข่งขันจะต้องใช้การสมัครของ WCA
      newcomer_month_reservations_percentage: 
        ไม่สามารถสำรองที่นั่งสำหรับผู้เข้าแข่งขันใหม่ได้เกิน 50%
      newcomer_month_reservations_available: 
        จำนวนที่นั่งสำรองสำหรับผู้เข้าแข่งขันใหม่ที่เกินจำนวนที่จองได้
      invalid_name_message: >-
        ต้องสิ้นสุดด้วยปี และต้องมีแค่ตัวอักษร, ตัวเลข, เครื่องหมายขีดคั่น (-),
        เครื่องหมายและ (&), จุด (.), เครื่องหมายจุดคู่ (:), เครื่องหมายวรรคตอน
        (') และเว้นวรรค ( )
      cannot_manage: ไม่สามารถรวมการแข่งขันได้
      cannot_delete_public: ไม่สามารถลบการแข่งขันที่แสดงต่อสาธารณะได้
      cannot_delete_confirmed: ไม่สามารถลบการแข่งขันที่ได้รับการยืนยันแล้วได้
      must_contain_event: 
        ต้องมีประเภทการแข่งขันอย่างน้อยหนึ่งประเภทสำหรับการแข่งขันนี้
      fto_not_yet_allowed: >-
        การแข่งขัน Face Turning Octahedron
        ไม่สามารถจัดขึ้นได้ในการแข่งขันที่เริ่มต้นก่อนวันที่ %{date}
      schedule_must_match_rounds: ต้องมีอย่างน้อยหนึ่งรอบ 
        และทุกรอบต้องถูกรวมอยู่ในตารางการแข่งขัน
      must_contain_delegate: ต้องมี WCA Delegate อย่างน้อย 1 คน
      must_contain_organizer: ต้องมีผู้จัดการแข่งขันอย่างน้อยหนึ่งคน
      not_all_delegates: ไม่ Delegates ทั้งหมด
      registration_close_after_open: 
        การปิดรับสมัครต้องอยู่หลังจากการเปิดรับสมัคร
      registration_already_closed: การสมัครการแข่งขันจะต้องไม่ปิดอยู่ก่อนแล้ว
      start_date_must_be_28_days_in_advance: 
        วันเริ่มการแข่งขันต้องอยู่ห่างออกไปอย่างน้อย 28 วัน
      end_date_before_start: วันสิ้นสุดไม่สามารถมาก่อนวันเริ่มได้
      refund_date_after_start: กำหนดวันคินค่าสมัครไม่สามารถอยู่หลังวันเริ่มได้
      span_too_many_days: 'การแข่งขันไม่สามารถยาวนานกว่า %{max_days} วันได้'
