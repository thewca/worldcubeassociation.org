        รอบ %{round_id}: มีผู้เข้าแข่งขันมากกว่าที่เงื่อนไขการเข้ารอบที่ตั้งไว้
        (%{actual} คน แทนที่จะเป็น %{expected} คน เงื่อนไขคือ: %{condition})
        โปรดอัปเดตข้อมูลรอบในหน้าจัดการกิจกรรม
      regulation_9m1_error: >-
        รอบ %{round_id} มีผู้เข้าแข่งขัน 99 คนหรือน้อยกว่า แต่มีรอบถัดไปมากกว่า
        2 รอบ ซึ่งไม่ได้รับอนุญาตตามข้อบังคับ 9m1
      regulation_9m2_error: >-
        รอบ %{round_id} มีผู้เข้าแข่งขัน 15 คนหรือน้อยกว่า
        แต่มีรอบถัดไปมากกว่าหนึ่งรอบ ซึ่งไม่ได้รับอนุญาตตามข้อบังคับ 9m2
      regulation_9m3_error: >-
        รอบ %{round_id} มีผู้เข้าแข่งขัน 7 คนหรือน้อยกว่า แต่มีรอบถัดไปอย่างน้อย
        1 รอบ ซึ่งไม่ได้รับอนุญาตตามข้อบังคับ 9m3
      regulation_9p1_error: >-
        รอบ %{round_id}: ผู้เข้าแข่งขันน้อยกว่า 25% ที่ถูกคัดออก
        ซึ่งไม่ได้รับอนุญาตตามข้อบังคับ 9p1
      no_competitor_eliminated_error: >-
        รอบ %{round_id}: จะต้องมีผู้แข่งขันอย่างน้อยหนึ่งรายที่ถูกคัดออก
        ซึ่งจำเป็นต้องเป็นไปตามข้อบังคับ 9p (การแข่งขันก่อนเดือนเมษายน 2010)
      less_than_twenty_five_percent_eliminated_error: >-
        รอบ %{round_id}: ตามเงื่อนไขการเข้ารอบ (%{condition})
        ผู้เข้าแข่งขันน้อยกว่า 25%% จะถูกคัดออก ซึ่งไม่ได้รับอนุญาตตามข้อบังคับ
        9p1 โปรดอัปเดตข้อมูลรอบในหน้าจัดการกิจกรรม
      not_enough_qualified_warning: >-
        รอบ %{round_id}: จากข้อมูล event มีผู้เข้าแข่งขันได้มากที่สุด
        %{expected} แต่มีเพียง %{actual} เท่านั้นที่เข้าแข่งขันในรอบนั้น
        โปรดแสดงความคิดเห็นเกี่ยวกับเรื่องนี้
        (หรือแก้ไขข้อมูลเหตุการณ์หากคุณใช้เงื่อนไขการเข้ารอบอื่น)
      competed_not_qualified_error: >-
        รอบ %{round_id}: %{ids} แข่งขันแล้วแต่ไม่เป็นไปตามเงื่อนไขการเข้ารอบ
        (%{condition})
        โปรดตรวจสอบให้แน่ใจว่าเงื่อนไขการแข้ารอบสะท้อนถึงสิ่งที่ใช้ในระหว่างการแข่งขัน
        และลบการแข่งขันหากจำเป็น
      round_not_found_error: >-
        ไม่พบรอบ %{round_id} โปรดตรวจสอบให้แน่ใจว่าข้อมูล Event บนเว็บไซต์ WCA
        และ WCA Live ซิงค์กัน
      missing_round_results_error: >-
        ไม่มีผลการแข่งขันสำหรับรอบ %{round_id} แต่จะแสดงอยู่ในแท็บ event
        หากรอบนี้ไม่ได้จัดขึ้น โปรดลบรอบดังกล่าวในหน้าจัดการกิจกรรมของการแข่งขัน
    events:
      not_333_main_event_warning: >-
        ประเภทการแข่งขันหลักที่เลือกสำหรับการแข่งขันนี้คือ %{main_event_id}
        แม้ว่า WCAT จะอนุมัติก่อนการแข่งขัน แต่ WRT
        มีหน้าที่รับผิดชอบในการตรวจสอบให้แน่ใจว่าหลังจากการแข่งขันเสร็จสิ้นแล้ว
        เป็นไปตามแนวทางของประเภทการแข่งขันหลักที่เหมาะสมตามนโยบายข้อกำหนดการแข่งขันของ
        WCA โปรดดำเนินการอย่างน้อยหนึ่งอย่างเพื่อให้ %{main_event_id}
        เป็นกิจกรรมหลักในระหว่างการแข่งขัน (ตัวอย่างเช่น:
        ประกาศผู้ชนะการแข่งขัน, จำนวนรอบมากที่สุด, รางวัลใหญ่ที่สุด)
      no_main_event_warning: >-
        ไม่มีการเลือก event หลักสำหรับการแข่งขันนี้ โปรดแจ้งให้ WRT
        ทราบว่านี่ถูกต้องหรือไม่
      missing_results_warning: >-
        ไม่มีผลการแข่งขันสำหรับ %{event_id} แต่มีแสดงเป็น event อย่างเป็นทางการ
        หาก event ดังกล่าวจัดขึ้น โปรดอัปโหลด JSON
        ของคุณอีกครั้งพร้อมผลการแข่งขันของ event นั้นด้วย หาก event
        ดังกล่าวไม่ได้จัดขึ้น โปรดแสดงความคิดเห็นสำหรับ WRT
    scrambles:
      missing_scrambles_for_round_error: >-
        [%{round_id}] ไม่มีโจทย์ โปรดใช้ Scrambles Matcher
        เพื่อเพิ่มโจทย์ที่ถูกต้องให้กับรอบนั้น
      missing_scrambles_for_competition_error: โจทย์ของการแข่งขันหายไป โปรดใช้ 
        Scrambles Matcher เพื่อเพิ่มโจทย์
      missing_scrambles_for_group_error: >-
        [%{round_id}] โจทย์ของกลุ่ม %{group_id} หายไป ตรวจพบเฉพาะ %{actual}
        แทนที่จะเป็น %{expected}.
      missing_scrambles_for_multi_error: >-
        [%{round_id}] แม้ว่าคุณอาจมีหลายกลุ่มใน 3x3x3 Multi-Blind
        อย่างน้อยหนึ่งกลุ่มจะต้องมีโจทย์สำหรับ attempt ทั้งหมด
      mbld_scrambles_warning: >-
        [%{round_id}] รอบนี้ประกอบด้วยผลการแข่งขัน 3x3x3 Multi-Blind
        โปรดระบุในความคิดเห็นในการส่งผลการแข่งขันของคุณว่าใช้จำวนโจทย์เท่าไหร่ในการแข่งขัน
        เพื่อให้ WRT สามารถลบโจทย์ส่วนเกินที่ไม่ได้ใช้
      multiple_fmc_groups_warning: >-
        [%{round_id}] มีการแบ่ง FMC เป็นหลายกลุ่ม หากใช้ FMC กลุ่มใดกลุ่มหนึ่ง
        โปรดใช้ Scrambles Matcher เพื่อยกเลิกการเลือกโจทย์ที่ไม่ได้ใช้ มิฉะนั้น
        โปรดใส่คำอธิบายถึง WRT เพื่ออธิบายว่าเหตุใดจึงแบ่ง FMC เป็นหลายกลุ่ม
      wrong_number_of_scramble_sets_error: >-
        [%{round_id}] รอบนี้มีจำนวนชุดของโจทย์ (%{actual})
        แตกต่างจากที่ระบุไว้ในแท็บ event (%{expected}) โปรดปรับจำนวนโจทย์ในแท็บ
        event ให้ตรงกับจำนวนชุดที่ใช้
    schedule:
      activity_outside_competition_dates_warning: >-
        กิจกรรม '%{activity_name}' (code: %{activity_code})
        ถูกกำหนดไว้นอกช่วงวันที่ของการแข่งขันในเขตเวลาท้องถิ่นของสถานที่จัดการแข่งขัน
        โปรดอัปเดตตารางการแข่งขันเพื่อให้ตรงกับวันที่แข่งขันจริง
