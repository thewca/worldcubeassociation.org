        entry_fees:
          currency_code: สกลุเงินสำหรับต่าสมัคร
          base_entry_fee: >-
            ค่าสมัครการแข่งขันพื้นฐานสำหรับการแข่งขัน
            มันจะปรากฏบนหน้าข้อมูลการแข่งขันและหน้าสมัครการแข่งขัน
            หากตั้งค่าเป็น 0 ประโยคจะปรากฏขึ้นโดยแจ้งว่า
            สมารถสมัครแข่งขันได้โดยไม่เสียค่าใช้จ่าย <br><br><b>ข้อจำกัด:
            การประมาณค่าธรรมเนียมของ WCA
            ต่อไปนี้เป็นเพียงการประมาณโดยอิงตามอัตราแลกเปลี่ยนปัจจุบัน
            และไม่มีผลผูกพันทางกฎหมายสำหรับการชำระค่าธรรมเนียม</b>
          on_the_spot_entry_fee: >-
            ถ้าตั้งเป็น 0 จะแสดงประโยค
            การสมัครที่การแข่งขันสามารถสมัครได้โดยไม่เสียค่าใช้จ่าย
          guest_entry_fee: >-
            สำหรับตอนนี้ตัวเลขนี้เป็นข้อมูลเท่านั้น
            ค่าเข้าชมการแข่งขันไม่สามารถจัดการผ่าน website นี้ได้ หากตั้งเป็น 0
            จะแสดงข้อความที่คุณเลือกเกี่ยวกับนโยบายของผู้เข้าชมการแข่งขัน
          refund_policy_percent: >-
            สำหรับตอนนี้ตัวเลขนี้เป็นข้อมูลเท่านั้น
            การคืนเงินจะต้องดำเนินการด้วยตนเอง ถ้าตั้งค่าเป็น 0 จะแสดงประโยคว่า
            ค่าสมัครการแข่งขันจะไม่สามารถขอคืนได้ในทุกกรณี
          refund_policy_limit_date: วันที่สุดท้ายที่จะสามารถคืนค่าสมัครได้
        registration:
          opening_date_time: เวลาเปิดและปิดรับสมัคร (UTC time)
