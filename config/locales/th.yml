        แต่กลับได้รับ %{pos}
      wrong_global_position_in_results_error: >-
        [%{round_id}] %{person_name} อยู่ในอันดับรวมที่ไม่ถูกต้อง:
        คาดว่าจะเป็นอันดับ %{expected_pos} แต่ได้อันดับ %{pos}
    rounds:
