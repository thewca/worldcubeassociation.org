        ข้าพเจ้าเข้าใจว่าแบบฟอร์มนี้สำหรับนักแข่งรูบิกที่ลงทะเบียนไว้แล้ว 
        ซึ่งต้องการสมัครเป็น Trainee Delegate
      declaration_has_delegate_support: ข้าพเจ้าขอยืนยันว่าข้าพเจ้าได้หารือกับ 
        Delegate ที่มีคุณสมบัติเหมาะสมในเขตพื้นที่ของข้าพเจ้า 
        ซึ่งให้การสนับสนุนการลงสมัครของข้าพเจ้าแล้ว
      declaration_proficient_in_english: 
        ข้าพเจ้ายืนยันว่าข้าพเจ้ามีความสามารถในการอ่านและเขียนภาษาอังกฤษได้เป็นอย่างดี
      declaration_read_regulations_html: ข้าพเจ้ารับทราบว่าข้าพเจ้าได้อ่าน <a 
