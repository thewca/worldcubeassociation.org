            %{md}'
        series:
          name: >-
            ชื่อเต็มของการแข่งขันซีรีส์รวมทั้งปีที่สิ้นสุด (เช่น Southern
            Australia 2022) ให้แน่ใจว่าได้ใช้ตัวพิมพ์ใหญ่
            ใช้กฎเดียวกันกับชื่อการแข่งขันแต่ละรายการ
          short_name: ชื่อย่อสำหรับแสดง รูปแบบเดียวกันกับชื่อการแข่งขันย่อย
          competition_ids: >-
            <b>ฟิลด์นี้ไม่สามารถแก้ไขได้!</b><br/>หากต้องการเพิ่มการแข่งขันลงในซีรีส์นี้
            คุณต้องไปที่หน้า 'แก้ไข' แต่ละรายการของการแข่งขันที่คุณต้องการเพิ่ม
        information: >-
          ข้อมูลสำคัญที่ผู้เข้าแข่งขันควรรู้ มันจะปรากฏในหน้าหลักของการแข่งขัน
          <br/>กรุณากรอกเป็น <b>ภาษาอังกฤษ</b> และภาษาอื่นที่ผู้เข้าแข่งขันใช้.
        competitor_limit:
          enabled: >-
            จำเป็นต้องใส่จำนวนผู้เข้าแข่งขันสูงสุด เฉพาะการแข่งขัน FMC
            หลายสถานที่เท่านั้นจึงจะไม่ต้องใส่จำนวนผู้เข้าแข่งขันสูงสุดได้
          count: >-
            จำนวนของผู้เข้าแข่งขันที่ได้รับอนุญาตในการแข่งขันครั้งนี้
            ระบบการสมัครจะบังคับใช้ข้อจำกัดนี้
          reason: เหตุผลในการจำกัดจำนวนผู้เข้าแข่งขัน กรุณากรอกเป็นภาษาอังกฤษ
          auto_close_threshold: >-
            การรับสมัครจะปิดโดยอัตโนมัติเมื่อได้รับจำนวนการสมัครที่ชำระเงินแล้ว
            ปล่อยว่างไว้เพื่อปิดใช้งาน
            ไม่ต้องสนใจหากคุณไม่ได้ใช้การชำระเงินแบบรวม
          newcomer_month_reserved_spots: >-
            อนุญาตเฉพาะในช่วง Newcomer Month เท่านั้น -
            ตำแหน่งที่จองไว้จะต้องไม่เกินครึ่งหนึ่งของขีดจำกัดผู้แข่งขัน
          auto_accept_preference: >-
            การดำเนินการนี้จะเปิดใช้งานปุ่ม 'ยอมรับอัตโนมัติเป็นกลุ่ม'
            ในเมนูการสมัครการแข่งขัน การดำเนินการนี้จะยอมรับผู้ที่อยู่ใน
            Waitlisted
            และผู้ที่รอดำเนินการที่ชำระเงินแล้วทั้งหมดจนถึงขีดจำกัดของผู้เข้าแข่งขัน
            หรือขีดจำกัดที่กำหนดไว้ด้านล่าง การใช้งานต้องยอมรับความเสี่ยงเอง
          auto_accept_disable_threshold: >-
            เมื่อจำนวนการสมัครที่ได้รับการยอมรับถึงจำนวนนี้
            ระบบจะปิดใช้งานระบบการยอมรับอัตโนมัติ
            ซึ่งจะทำให้ผู้จัดการแข่งขันสามารถยอมรับการสมัครการแข่งขันในขั้นสุดท้ายได้ด้วยตนเอง
            เลขที่ใส่จะต้องน้อยกว่าขีดจำกัดของผู้เข้าแข่งขัน
            สามารถปล่อยว่างไว้ได้หากไม่ต้องการ
