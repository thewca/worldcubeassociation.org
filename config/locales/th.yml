        '3': เนื้อหาของสื่อต้องไม่มีผู้สนับสนุนหรือโฆษณา
        '4': เนื้อหาสื่อทั้งหมดจะต้องมีชื่อเรื่องที่เหมาะสมและสื่อความหมาย
