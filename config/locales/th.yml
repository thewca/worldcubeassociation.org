  about_regulations:
    title: เกี่ยวกับกติกา
    panel1:
      title: กติกา
      content1_html: >-
        ผู้เข้าแข่งขันทุกคนต้องทำตาม<a href="/regulations/">กติกาของ WCA</a>
        สำคัญมากที่ผู้เข้าแข่งขันจะต้องอ่านกติกาก่อนที่จะเข้าแข่งขันครั้งแรก
      content2_html: >-
        การตัดสินใจที่สำคัญเกี่ยวกับ incidents ที่เกิดขึ้นในการแข่งขัน
        ที่ได้รับการตัดสินโดย WCA Regulations Committee สามารถพบได้ใน <a
        href="/incidents">Incidents Log</a>
    panel2:
      title: การแปล
      content1_html: >-
        กติกาของ WCA ไม่ได้มีแค่ภาษาอังกฤษเท่านั้น แต่สมาชิกของ WCA
        ได้แปลออกเป็นบางภาษา <a href="/regulations/translations/">การแปล</a>.
      content2_html: >-
        <strong>สำคัญ</strong>: แม้ว่าการแปลจะช่วยได้มาก แต่มันไม่เป็นทางการ
        ในการแข่งขัน กติกาฉบับภาษาอังกฤษจะมีผล
    panel3:
      title: คำถามเกี่ยวกับกติกา
      content1_html: >-
        <a
        href="/faq">คำถามที่พบบ่อย</a>ตอบบางคำถามที่พบบ่อยเกี่ยวกับกติกาไว้แล้ว
    panel4:
      title: คู่มือผู้จัดการแข่งขัน
      content1_html: >-
        หากคุณสนใจจะเป็นผู้จัดการแข่งขัน หรือมีแผนที่จะจัดการแข่งขัน กรุณาอ่าน<a
        href="https://documents.worldcubeassociation.org/edudoc/organizer-handbook/organizer-handbook.pdf">คู่มือผู้จัดการแข่งขัน</a>
      content2_html: 
        เอกสารฉบับนี้รวมข้อมูลที่จำเป็นและผู้จัดการแข่งขันทุกคนควรอ่าน
  regulations_translations:
    title: 'กติกาของ WCA: Translations'
    paragraph1: หากคุณใช้ภาษาอื่นนอกที่ไม่ใช่ภาษาอังกฤษ 
      คุณสามารถหาการแปลเหล่านี้ได้
    paragraph2: >-
      กรุณาจำไว้ว่าการแปลเหล่านี้ไม่มีสถานะเป็นทางการแม้ว่ามันจะอยู่บนเว็บ WCA:
      ถ้ามันมีความแตกต่างเมื่อเทียบกับกติกาภาษาอังกฤษ,
      กติกาภาษาอังกฤษจะถูกบังคับใช้
    translations: การแปล
    current: ปัจจุบัน
    old: เก่า
    table_elements:
      version: Version
      language: ภาษา
    translating: แปลกติกา
    paragraph3_html: >-
      หากคุณต้องการที่จะเพิ่มหรือแก้ไขการแปล กรุณาดูที่ <a
      href="https://github.com/thewca/wca-regulations-translations#translation-instructions">the
      instructions on the GitHub repository for translations</a>
