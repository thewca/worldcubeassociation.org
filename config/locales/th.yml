      text: >-
        มาร่วมเป็นส่วนหนึ่งกัน! WCA มีตำแหน่งอาสาสมัครเปิดรับสมัครในทีมต่าง ๆ
        คุณไม่จำเป็นต้องเป็น speedcuber ก็สามารถเป็นอาสาสมัครได้
    faq:
      title: FAQ
      text: >-
        ตรวจสอบคำถามที่พบได้บ่อยหากคุณต้องการความช่วยเหลือ
        ข้อสงสัยหลายข้อสามารถหาคำตอบได้ในนั้น
