            วันที่ผู้เข้าแข่งขันที่อยู่ใน waitlisted registrants
            จะไม่ได้รับการยอมรับการสมัคร ถ้าคุณมีกำหนดวันสุดท้ายของการคืนเงิน
            วันสุดท้ายของการยอมรับผู้สมัครไม่ควรจะอยู่ก่อนวันสุดท้ายที่จะได้รับการคืนเงิน
          event_change_deadline_date: >-
            ผู้เข้าแข่งขันที่สมัครการแข่งขันแล้วมีสิทธิ์ทำการอัปเดตประเภทการแข่งขันที่สมัครไว้ได้จนถึงเวลานี้โดยการติดต่อทีมจัดการแข่งขัน
            วันสุดท้ายจะต้องไม่เป็นก่อนวันที่จะปิดรับสมัครการแข่งขัน
            เว้นว่างไว้หากผู้เข้าแข่งขันสามารถเพิ่มประเภทการแข่งขันได้จนถึงวันแข่งขัน
            หากคุณมีการรับสมัครที่การแข่งขัน
            จะต้องตั้งเป็นวันเดียวกับวันที่แข่งขัน
          guests_per_registration: >-
            จำนวนผู้ติดตามที่ได้รับอนุญาติในการแข่งขันนี้
            หากคุณสมัครโดนมีผู้ติดตามมากเกินไปการสมัครจะถูกบล็อก,
            เว้นว่างไว้ถ้าไม่ต้องการจำกัด
          extra_requirements: >-
            โปรดระบุข้อกำหนดการสมัครการแข่งขันเพิ่มเติมใด ๆ
            ที่ไม่ได้กล่าวถึงข้างต้น เช่นคำแนะนำวิธีการชำระเงิน
