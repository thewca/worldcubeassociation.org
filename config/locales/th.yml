      advancement_condition_must_be_present_for_all_non_final_rounds: 
        ต้องมีเงื่อนไขการเลื่อนชั้นไปยังรอบที่ไม่ใช่รอบสุดท้ายทั้งหมด
      registration_period_after_start: 
        เวลาการสมัครการแข่งขันไม่สามารถเกิดขึ้นหลังวันแข่งขันได้
      waiting_list_deadline_before_registration_close: วันสุดท้ายของ Waiting 
        list ไม่สามารถอยู่ก่อนวันปิดรับสมัครการแข่งขันได้
      waiting_list_deadline_before_refund_date: >-
        วันสุดท้ายของ Waiting list
        ไม่สามารถอยู่ก่อนวันสุดท้ายที่จะได้รับเงินคืนได้
      waiting_list_deadline_after_end: กำหนดเวลา Waiting list 
        จะต้องมาก่อนการแข่งขันจะสิ้นสุดลง
      event_change_deadline_before_registration_close: >-
        วันสุดท้ายของการแก้ไขประเภทการแข่งขันไม่สามารถอยู่ก่อนวันปิดรับสมัครการแข่งขันได้
      event_change_deadline_after_end_date: 
        วันสุดท้ายของการแก้ไขประเภทการแข่งขันไม่สามารถอยู่หลังวันแข่งขันได้
      event_change_deadline_with_ots: >-
        วันสุดท้ายของการแก้ไขประเภทการแข่งขันต้องอยู่ในช่วงเวลาการแข่งขัน
        หากคุณรับสมัครการแข่งขันที่การแข่งขัน
      on_the_spot_with_past_event_change_deadline: >-
        ไม่สามารถเปิดใช้งานการลงสมัครการแข่งขันที่การแข่งขันได้ได้หากหมดเขตการอัพเดตประเภทการแข่งขันไปแล้ว
      series_distance_km: 'การแข่งขันอยู่ห่างจาก %{competition} มากเกินไป'
      series_distance_days: 'การแข่งขันถูกกำหนดให้อยู่ห่างจาก %{competition} หลายวันเกินไป'
      must_ask_about_guests_if_specifying_limit: 
        ต้องถามเกี่ยวกับผู้ติดตามหากมีการระบุขีดจำกัดของผู้ติดตาม
      not_full_url: >-
        คุณมี URL (%{url}) ในเนื้อหา โปรดใส่ URL แบบเต็มที่มีคำนำหน้า http://
        หรือ https://
      editing_deadline_already_passed: >-
        คุณได้รับอนุญาตให้เปลี่ยนแปลงเฉพาะวันที่กำหนดที่ยังไม่ผ่านไปเท่านั้น
        แต่วันที่เดิม %{timestamp} ได้ผ่านไปแล้ว
      edited_deadline_not_after_original: >-
        คุณได้รับอนุญาตให้ขยายกำหนดเวลาการปิดรับสมัครได้เท่านั้น แต่
        %{new_timestamp} ถูกตั้งก่อนวันที่เดิม %{timestamp}
      edited_deadline_not_in_future: >-
        คุณได้รับอนุญาตให้แก้ไขเวลาเป็นวันที่ในอนาคตได้เท่านั้น แต่
        %{new_timestamp} ไม่ได้เป็นเวลาในอนาคต
