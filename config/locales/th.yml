  media_and_instagram:
    page_title: การส่ง Media และ Instagram
    general_media_submission:
      title: การส่ง Media ทั่วไป
      body_html: >-
        WCA แบ่งปันบทความและภาพจากการแข่งขันที่จัดทำโดยชุมชนใน <a href="/media">
        หน้าสื่อ </a> ของเรา หากคุณมีสิ่งที่คุณต้องการแบ่งปัน โปรดกรอก <a
        href="/media/new">แบบฟอร์มการส่งสื่อทั่วไป</a> ของเรา!
    instagram_submission:
      title: การส่ง Instagram
      paragraph1_html: >-
        คุณอาจทราบว่า WCA มี <a
        href="https://www.instagram.com/thewcaofficial/">Instagram</a>!
        เพื่อแสดงสังคม cubing เราโพสต์เนื้อหาที่ส่งถึงเราโดย cubers จากทั่วโลก
      paragraph2: >-
        หากคุณมีภาพถ่ายหรือวิดีโอคุณภาพสูงที่คุณต้องการให้เราโพสต์
        โปรดคลิกที่ปุ่มด้านล่างและกรอกแบบฟอร์ม! ในการโพสต์เนื้อหาของคุณ
        คุณต้องเป็นเจ้าของและต้องให้สิทธิ์ WCA ในการโพสต์
        เนื่องจากมีการส่งจำนวนมากเราจึงไม่สามารถโพสต์ทุกสิ่ง
        แต่นี่คือเคล็ดลับบางประการเพื่อให้เนื้อหาของคุณถูกโพสต์:
      photo_quality: >-
        ตรวจสอบให้แน่ใจว่าคุณภาพของภาพถ่าย / วิดีโอ มีคุณภาพดี
        ไม่จำเป็นต้องถ่ายอย่างมืออาชีพ แต่คุณภาพไม่ควรแย่จนเกินไป
      photo_interest: >-
        พยายามทำให้เนื้อหาของคุณน่าสนใจสำหรับผู้ชมทั่วไป
        เนื้อหาที่น่าสนใจสำหรับคนไม่กี่คนเท่านั้นไม่ได้อยู่ที่นั้น
      wca_related: >-
        โพสต์รูปภาพและวิดีโอที่เกี่ยวข้องกับ WCA
        เพราะนี่คือสิ่งที่บัญชีของเรามีอยู่! เราชอบที่จะเห็น cuber
        มีความสนุกสนาน!
      submit_instagram_content: ส่งเนื้อหา Instagram
    instagram_hosting:
      title: เจ้าของ Instagram
      paragraph1_html: >-
        บางครั้ง เรายอมให้สมาชิกบางคนมาถ่ายทอดสดผ่านทาง story ที่ Instagram ของ
        WCA ในการแข่งขันที่พวกเขาเข้าแข่งขัน ถ้าคุณสนใจ
        กรุณาคลิกปุ่มและกรอกฟอร์มด้านล่าง ทีมการสื่อสารของ WCA
        จะติดต่อกลับไปหาคุณเมื่อได้รับข้อมูลของคุณและคุณได้รับการยอมรับ
        ถ้าคุณมีข้อสงสัยสามารถติดต่อได้ <a
        href="https://www.worldcubeassociation.org/contact/website">ที่นี่</a>
      paragraph2: >-
        เป้าหมายของเราคือการแบ่งปันด้านส่วนตัวเล็กน้อยของทุก cuber
        และทุกการแข่งขัน
        นี่ไม่น่าจะเป็นภาระอย่างใหญ่หลวงในช่วงสุดสัปดาห์และแน่นอนเราต้องการให้คุณสนุกกับการแข่งขันก่อนแล้วจึงจะสามารถแบ่งปันได้
      paragraph3: 'บทบาทของโฮสต์สามารถสรุปได้ดังนี้:'
      short_intro: ทำการแนะนำสั้น ๆ พูดคุยเกี่ยวกับตัวคุณและการแข่งขัน
      venue_feel: >-
        แสดงคลิปบางส่วนเพื่อให้รู้สึกถึงสถานที่และผู้คน
        นี่อาจเป็นเพียงภาพจากพื้นที่ผู้เข้าแข่งขันและพื้นที่แก้โจทย์
      people_solving: >-
        พยายามถ่ายผู้เข้าแข่งขันแก้โจทย์
        (หากเป็นผู้เข้าแข่งขันที่แก้โจทย์เร็วจะดีมาก)
      mini_interviews: >-
        คุณสามารถลองสัมภาษณ์คนที่มาร่วมงาน (ผู้จัดงาน, delegate ฯลฯ ... )
        โดยบอกว่าพวกเขารู้สึกอย่างไรกับการแข่งขันนี้
      pictures_too: คุณสามารถส่งรูปภาพด้วยก็ได้ ไม่จำเป็นต้องเป็น vdo เสมอไป
      paragraph4: >-
        การสื่อสารของเราตลอดสุดสัปดาห์มักจะผ่านกลุ่ม WhatsApp
        กรุณาแน่ใจว่าคุณคุ้นเคยกับแพลตฟอร์มการส่งข้อความแบบนี้หรือแจ้งให้เราทราบหากคุณไม่สามารถใช้งานได้เพื่อที่เราจะได้จัดทำแผนอื่น
        ๆ
      apply_to_host: สมัครเป็น host
    other_suggestions:
      title: ข้อเสนอแนะอื่น ๆ
      body_html: >-
        คุณมีคำแนะนำอื่น ๆ สำหรับ Instagram หรือเนื้อหาโซเชียลมีเดียอื่น ๆ
        หรือไม่? <a
        href="https://www.worldcubeassociation.org/contact/website">แจ้งให้เราทราบ</a>!
  footer:
    privacy: ความเป็นส่วนตัว
    disclaimer: ข้อจำกัดความรับผิดชอบ
  api:
    manage_oauth_html: 'ไปที่ %{oauth_link} เพื่อจัดการ OAuth applications ของคุณ'
    token_request_intro: >-
      นี่คือตัวอย่าง, การ curl, ในการรับ token การเข้าถึงโดยใช้ Application ID,
      Client Secret, your WCA email, and your password:
    user_email_placeholder: YOUR_EMAIL
    user_password_placeholder: YOUR_PASSWORD
    user_info_request_intro: >-
      สามารถใช้ token การเข้าถึง OAuth เพื่อสร้างคำขอ API
      ที่ได้รับอนุญาตได้จนกว่าจะหมดอายุ ตัวอย่างเช่น
      ในการเข้าถึงข้อมูลเกี่ยวกับบัญชีของคุณ:
    legal_tnoodle_api_header: Legal TNoodle version
    login_message: กรุณาเข้าสู่ระบบ
  merch:
    title: WCA Merchandise
    paragraphs:
      '1': >-
        WCA มีสินค้าสุดพิเศษให้เลือกซื้อ! ตั้งแต่เสื้อยืด เสื้อมีฮู้ด สติ๊กเกอร์
        สแต็คแมท กระเป๋าเป้ และอีกมากมาย!
        การออกแบบของเราได้รับการปรับปรุงอย่างต่อเนื่อง รวมถึงโลโก้ WCA
        แบบคลาสสิก สินค้าอย่างเป็นทางการสำหรับการแข่งขันชิงแชมป์โลก
        และการออกแบบสถิติโลก
      '2': >-
        การซื้อสินค้า WCA
        ผ่านร้านค้าของเราเป็นหนึ่งในวิธีที่ดีที่สุดสำหรับคุณในการสนับสนุน WCA
        ซึ่งเป็นองค์กรอาสาสมัครที่ไม่หวังผลกำไร
        เราใช้ผลกำไรทั้งหมดจากสินค้าเพื่อเป็นทุนสนับสนุนการแข่งขันชิงแชมป์
        อุปกรณ์ และกิจกรรมอื่น ๆ ที่เกี่ยวข้องกับ WCA
      '3': >-
        คุณสามารถซื้อสินค้าของเราได้ทั่วโลก โดยมีร้านค้าโดยตรงในยุโรป อเมริกา
        อินเดีย และอีกหลายที่ในเร็ว ๆ นี้!
  database:
    results_export:
      heading: WCA Results Export
      deprecation_warning: >-
        ประกาศแจ้งเตือนการเลิกใช้งาน: เวอร์ชัน %{old_version} ของ Results Export
        ถูกยกเลิกการใช้งานแล้ว และจะยุติการสนับสนุนตั้งแต่วันที่
        %{deprecation_date} โปรดเปลี่ยนไปใช้เวอร์ชัน %{new_version}
        ก่อนวันดังกล่าว
      description: >-
        ในหน้านี้ เรามีผลการแข่งขันของ WCA สำหรับดาวน์โหลดในหลายรูปแบบ
        เพื่อให้คุณสามารถใช้/วิเคราะห์ผลโดยรวมได้
        โดยปกติเราจะอัปเดตหลังจากการแข่งขันแต่ละสัปดาห์เมื่อสรุปผลเสร็จสิ้น
        ไฟล์จะมีหมายเลขและวันที่ คุณจึงดูได้ว่าคุณมีเวอร์ชันล่าสุดแล้วหรือยัง
      permalink: permalink
      permalink_note: >-
        ลิงก์ถาวรจะแสดงผลการส่งออกเวอร์ชันล่าสุดภายในเวอร์ชันที่กำหนด เช่น
        ลิงก์ถาวร v2 จะแสดงผลการส่งออก v2 เวอร์ชันล่าสุด แต่จะยังคงเป็น v2
        ต่อไปแม้ว่า v3 จะออกมาแล้วก็ตาม
      file_formats:
        sql: คำสั่ง SQL สำหรับการนำเข้าไปยังฐานข้อมูล SQL
        tsv: >-
          ค่าที่คั่นเพื่อแบ่ง Tab สำหรับ spreadsheets ใน OpenOffice.org, Excel
          เป็นต้น
      hint_readme_html: >-
        ไฟล์ %{readme_filename} รวมถึงข้อกำหนดการใช้งานและคำอธิบายทั่วไป
        (เป็นภาษาอังกฤษ ไม่มีการแปล):
    developer_export:
      heading: WST Developer Export
      description_html: >-
        ในหน้านี้ เรานำเสนอการ export WST develop
        สำหรับการดาวน์โหลดเป็นการถ่ายโอนข้อมูล SQL ดูรายละเอียดได้ที่
        %{github_link}
      download: Download
  validators:
    persons:
      dob_is_jan_one_warning: >-
        วันเกิดของ %{name} คือวันที่ 1 มกราคม
        กรุณาตรวจสอบให้แน่ใจว่าเป็นวันที่ถูกต้อง
      dob_is_too_young_warning: '%{name} ดูเหมือนว่าจะมีอายุน้อยกว่า 3 ปี กรุณาตรวจสอบให้แน่ใจว่าถูกต้อง'
      dob_is_too_old_warning: '%{name} ดูเหมือนว่าจะมีอายุประมาณ 100 ปี โปรดตรวจสอบให้แน่ใจว่าถูกต้อง'
      person_doesnt_have_any_results_error: 'ไม่มีผลลัพธ์สำหรับ %{person_name} ที่มี
        ID %{person_id}'
      results_not_associated_with_any_person_error: 'มีผลลัพธ์สำหรับผู้เข้าแข่งขันที่ไม่รู้จัก
        ซึ่งมี ID %{person_id}'
      whitespace_in_name_error: '''%{name}'' มี space นำหน้า/ต่อท้ายหรือเว้นวรรคสองครั้ง'
      person_with_non_existing_wca_id_error: '%{name} มี WCA ID ที่ไม่มีอยู่จริง:
        %{wca_id}'
      no_space_before_parenthesis_error: 'ข้างหน้าของวงเล็บเปิดใน ''%{name}'' จะต้องมีเว้นวรรค'
      same_person_name_warning: >-
        มีผู้ใช้ชื่อ '%{name}' อย่างน้อยหนึ่งคนในฐานข้อมูล WCA (%{wca_ids})
        อยู่แล้ว โปรดตรวจสอบให้แน่ใจว่า '%{name}' ของคุณเป็นคนอื่น หากไม่ใช่
        โปรดกำหนด WCA ID ที่ถูกต้องให้กับบัญชีผู้ใช้ และสร้าง results JSON
        อีกครั้ง
      non_matching_dob_warning: >-
        วันเกิด '%{dob}' ที่ให้ไว้สำหรับ %{name} (%{wca_id})
        ไม่ตรงกับข้อมูลปัจจุบันในฐานข้อมูล WCA ('%{expected_dob}')
        หากเป็นข้อผิดพลาด โปรดแก้ไข มิฉะนั้น
        โปรดแสดงความคิดเห็นเกี่ยวกับเรื่องนี้กับ WRT
      non_matching_gender_warning: >-
        เพศ '%{gender}' ที่ให้ไว้สำหรับ %{name} (%{wca_id})
        ไม่ตรงกับข้อมูลปัจจุบันในฐานข้อมูล WCA ('%{expected_gender}')
        หากเป็นข้อผิดพลาด โปรดแก้ไข มิฉะนั้น
        โปรดแสดงความคิดเห็นเกี่ยวกับเรื่องนี้กับ WRT
      empty_gender_warning: >-
        เพศของผู้เข้าแข่งขันใหม่ %{name} ว่างเปล่า ค่าเพศที่ถูกต้องคือ 'หญิง'
        'ชาย' และ 'อื่นๆ' โปรดแสดงความคิดเห็นเกี่ยวกับเรื่องนี้กับ WRT
      non_matching_name_warning: >-
        ชื่อ '%{name}' ที่ให้ไว้สำหรับ %{wca_id}
        ไม่ตรงกับข้อมูลปัจจุบันในฐานข้อมูล WCA ('%{expected_name}')
      non_matching_country_warning: >-
        ประเทศ '%{country}' ที่ให้ไว้สำหรับ %{name} (%{wca_id})
        ไม่ตรงกับข้อมูลปัจจุบันในฐานข้อมูล WCA ('%{expected_country}')
        หากเป็นข้อผิดพลาด โปรดแก้ไข มิฉะนั้น
        โปรดแสดงความคิดเห็นเกี่ยวกับเรื่องนี้ให้ WRT ทราบ
      multiple_newcomers_with_same_name_warning: >-
        มีผู้เข้าแข่งขันใหม่หลายรายที่มีชื่อเดียวกัน: %{name}
        โปรดตรวจสอบให้แน่ใจว่าผลลัพธ์ทั้งหมดถูกต้องสำหรับผู้เข้าแข่งชันเหล่านี้
        และผลลัพธ์ทั้งหมดแยกจากกันอย่างถูกต้องด้วย id
      wrong_parenthesis_type_error: >-
        เครื่องหมายวงเล็บที่ใช้ใน '%{name}' เป็นอักขระที่ไม่ปกติ
        โปรดแทนที่ด้วยเครื่องหมายวงเล็บปกติ '(' หรือ ')'
        และเว้นวรรคตามความเหมาะสม
      special_characters_in_name_warning: >-
        ชื่อ '%{name}' มีอักขระพิเศษที่ไม่ถูกต้อง (เช่น ตัวเลข
        เครื่องหมายอัญประกาศ หรือสัญลักษณ์อื่น ๆ ) ชื่อควรประกอบด้วยตัวอักษร
        เว้นวรรค เครื่องหมายขีดกลาง เครื่องหมายอัญประกาศเดี่ยว จุด
        และวงเล็บปกติเท่านั้น
      suspicious_last_name_warning: >-
        '%{name}' มีนามสกุลเป็น '%{suffix}'
        ซึ่งอาจไม่ใช่นามสกุลที่ถูกต้องตามกฎหมาย (เช่น
        คำต่อท้ายที่เขียนเต็มตามรุ่นอายุ)
        โปรดยืนยันว่าเป็นนามสกุลที่ถูกต้องตามกฎหมายหรือไม่
        หรือแก้ไข/ลบออกตามความเหมาะสม
      successive_uppercase_name_warning: >-
        '%{name}' มีตัวอักษรพิมพ์ใหญ่เรียงกันในชื่อ
        โปรดยืนยันว่านี่คือการสะกดที่ถูกต้อง หรือแก้ไขให้ถูกต้อง
      lowercase_name_warning: >-
        '%{name}' มีชื่อตัวพิมพ์เล็ก โปรดยืนยันว่านี่คือการสะกดที่ถูกต้อง
        หรือแก้ไขให้ถูกต้อง
      missing_period_in_single_letter_middle_name_warning: >-
        '%{name}' มีชื่อกลางเป็นตัวอักษรตัวเดียวโดยไม่มีจุดย่อ
        โปรดยืนยันว่าสะกดถูกต้องหรือไม่ หรือแก้ไขให้ถูกต้อง
      letter_after_period_warning: >-
        '%{name}' ไม่มีเว้นวรรคหลังจุดในชื่อ โปรดยืนยันว่าสะกดถูกต้องหรือไม่
        หรือแก้ไขให้ถูกต้อง
      single_letter_first_or_last_name_warning: >-
        '%{name}' มีชื่อหรือนามสกุลเป็นตัวอักษรตัวเดียว
        โปรดแก้ไขหรือยืนยันว่านี่คือชื่อที่ถูกต้องของผู้แข่งขันตามเอกสารอย่างเป็นทางการ
      single_name_warning: >-
        '%{name}' มีชื่อจริงเพียงอย่างเดียวเท่านั้น
        โปรดยืนยันว่านี่คือชื่อเต็มของคู่แข่งตามเอกสารอย่างเป็นทางการ
      competitor_limit_exceeded_warning: >-
        จำนวนผู้เข้าร่วมแข่งขัน (%{n_competitors}) เกินขีดจำกัดของผู้แข่งขัน
        (%{competitor_limit})
        ต้องลบผลการแข่งขันของผู้เข้าแข่งขันที่สมัครการแข่งขันหลังจากถึงขีดจำกัดของผู้แข่งขันแล้ว
      registration_details_mismatch_warning: >-
        ผู้เข้าแข่งขันที่มี ID %{person_id} (%{name})
        มีรายละเอียดที่ไม่ตรงกับการสมัครการแข่งขัน: %{mismatches}
      missing_matching_registration_warning: 'ผู้เข้าแข่งขัน %{name} ไม่มีข้อมูลการสมัครการแข่งขันที่ตรงกัน'
      unaccepted_registration_with_results_warning: >-
        ผู้เข้าแข่งขัน %{name} มีผลการแข่งขัน
        แต่การลงสมัครการแข่งขันยังไม่ถูกทำเครื่องหมายว่า 'ได้รับการยอมรับ'
    results:
      automatically_position_fixed_info: >-
        [%{round_id}] แก้ไขตำแหน่งของ %{person_name} จาก %{pos} เป็น
        %{expected_pos} โดยอัตโนมัติ
      automatically_global_position_fixed_info: >-
        [%{round_id}] แก้ไขตำแหน่งโดยรวมของ %{person_name} จาก %{pos} เป็น
        %{expected_pos} โดยอัตโนมัติ
      mbf_result_over_time_limit_warning: >-
        [%{round_id}] ผลลัพธ์ '%{result}' สำหรับ %{person_name} เกินเวลาที่กำหนด
        โปรดตรวจสอบให้แน่ใจว่ามันเกิดจากบทลงโทษก่อนที่จะส่งผลการแข่งขัน
        หรือแก้ไขผลการแข่งขันเป็น DNF
      result_after_dns_warning: >-
        [%{round_id}] %{person_name} มีผลลัพธ์ DNS
        อย่างน้อยหนึ่งรายการตามด้วยผลลัพธ์ที่ถูกต้อง โปรดตรวจสอบให้แน่ใจว่าเป็น
        DNS จริง และหากเป็นเช่นนั้น โปรดอธิบายว่าเกิดอะไรขึ้นกับ WRT
      similar_results_warning: >-
        [%{round_id}] ผลการแข่งขันของ %{person_name}
        มีความคล้ายคลึงกับผลการแข่งขันของ %{similar_person_name}
        โปรดตรวจสอบให้แน่ใจว่าบันทึกผลการแข่งขันเหล่านี้อย่างถูกต้องสำหรับผู้เข้าแข่งขันทั้งสองคน
      met_cutoff_but_missing_results_error: >-
        [%{round_id}] %{person_name} ผ่าน cutoff แต่ยังไม่มีผลการแข่งขันใน phase
        ถัดไป cutoff คือ %{cutoff}
      didnt_meet_cutoff_but_has_results_error: >-
        [%{round_id}] %{person_name} มีผลการแข่งขันอย่างน้อยหนึ่งรายการใน phase
        ที่สอง แต่ไม่ผ่าน cutoff เกณฑ์ตัดสินคือ %{cutoff}
      wrong_attempts_for_cutoff_error: >-
        [%{round_id}] %{person_name} มีผลการแข่งขันอย่างน้อยหนึ่งครั้งใน cutoff
        phase หายไป
        โปรดแก้ไขผลการแข่งขันเพื่อรวมผลการแข่งขันที่หายไปหรืออัปเดตข้อมูลของรอบในหน้าจัดการกิจกรรมของการแข่งขัน
      result_over_time_limit_error: >-
        [%{round_id}] ผลการแข่งขันอย่างน้อยหนึ่งครั้งของ %{person_name}
        เกินเวลาที่กำหนดสำหรับรอบนั้น ซึ่งคือ %{time_limit} ต่อครั้ง
        ผลการแข่งขันทั้งหมดที่เกินเวลาที่กำหนดจะต้องเปลี่ยนเป็น DNF
      results_over_cumulative_time_limit_error: >-
        [%{round_ids}] ผลรวมของผลการแข่งขันของ %{person_name}
        เกินขีดจำกัดเวลาสะสม ซึ่งอยู่ที่ %{time_limit}
      undefined_time_limit_warning: >-
        [%{round_id}] ขีดจำกัดเวลาสำหรับรอบนี้ไม่ได้กำหนดไว้
        การตรวจสอบขีดจำกัดเวลาได้ถูกข้ามไป คาดว่าจะมีขึ้นเฉพาะการแข่งขันก่อนปี
        2013 เท่านั้น
      suspicious_dnf_warning: >-
        [%{round_ids}] รอบนี้มีระยะเวลาจำกัดรวม
        และหากพิจารณาจากการแก้โจทย์ที่สำเร็จของ %{person_name}
        ผู้เข้าแข่งขันจะมีเวลาเหลือเพียงเล็กน้อยสำหรับ DNF อย่างน้อยหนึ่งครั้ง
        โปรดตรวจสอบให้แน่ใจว่า DNF และ DNS ทุกอันถูกต้อง
        หากผู้แข่งขันไม่ได้เริ่มการแก้โจทย์หรือไม่มีเวลาเหลืออยู่ก่อนที่จะเริ่มการการแก้โจทย์
        ผลการแข่งขันจะต้องเป็น DNS
      missing_cumulative_round_id_error: >-
        [%{original_round_id}] ไม่พบรอบ %{wcif_id}
        สำหรับขีดจำกัดเวลารวมที่ระบุไว้ใน WCIF
        โปรดไปที่หน้าจัดการกิจกรรมของการแข่งขันและลบ %{wcif_id}
        ออกจากขีดจำกัดเวลารวมสำหรับ %{original_round_id} WST
        ทราบเกี่ยวกับข้อบกพร่องนี้แล้ว (GitHub ปัญหา #3254)
      wrong_position_in_results_error: >-
