  database:
    results_export:
      heading: Exportación de los Resultados de la WCA
      deprecation_warning: >-
        AVISO DE DISCONTINUACIÓN: La Versión %{old_version} de la Exportación de
        los Resultados ha quedado obsoleta y su soporte técnico se interrumpirá
        a partir del %{deprecation_date}. Por favor, cambia a la Versión
        %{new_version} antes de esa fecha.
      description: >-
        En esta página ofrecemos los resultados de la WCA para descarga en
        varios formatos para que puedan ser usados/analizados. Normalmente
        actualizamos cada semana cuando han acabado las competiciones del fin de
        semana. Los archivos están numerados y fechados de forma que puedas
        comprobar si tienes ya la versión más reciente.
      permalink: Enlace permanente
      permalink_note: >-
        Nota: Los enlaces permanentes proporcionan la última exportación de
        resultados dentro de una versión determinada, es decir, el enlace
        permanente v2 devolverá la última exportación v2, pero permanecerá en v2
        incluso cuando se lance la v3.
      file_formats:
        sql: 'Sentencias SQL, para importar en bases de datos SQL.'
        tsv: >-
          Valores separados por tabulador, para hojas de cálculo en
          OpenOffice.org, Excel, etc.
      hint_readme_html: >-
        El archivo %{readme_filename} incluido contiene los términos de uso y
        una descripción general (en inglés, no está traducido):
    developer_export:
      heading: Exportación de Desarrollador del WST
      description_html: >-
        En esta página ofrecemos la exportación de desarrollador del WST para
        descarga como SQL dump. Más detalles en %{github_link}.
      download: Descargar
  validators:
    persons:
      dob_is_jan_one_warning: >-
        La fecha de nacimiento de %{name} se ha indicado el 1 de enero. Por
        favor, confirma que es correcto.
      dob_is_too_young_warning: >-
        %{name} parece tener menos de 3 años de edad, por favor verifica que sea
        correcto.
      dob_is_too_old_warning: >-
        %{name} parece tener cerca de 100 años de edad, por favor verifica que
        sea correcto.
      person_doesnt_have_any_results_error: 'No hay resultados para %{person_name}
        con el ID %{person_id}'
      results_not_associated_with_any_person_error: 'Hay resultados para una persona
        desconocida con el ID %{person_id}'
      whitespace_in_name_error: >-
        El nombre «%{name}» tiene espacios al comienzo o al final o espacios
        dobles.
      person_with_non_existing_wca_id_error: '%{name} tiene un ID de la WCA que no
        existe: %{wca_id}.'
      no_space_before_parenthesis_error: >-
        El paréntesis de apertura en «%{name}» tiene que estar precedido por un
        espacio.
      same_person_name_warning: >-
        Ya hay al menos una persona llamada «%{name}» en la base de datos de la
        WCA (%{wca_ids}). Por favor, asegúrate de que tu «%{name}» sea una
        persona diferente. En caso contrario, por favor asigna el ID de la WCA
        correcto al usuario y regenera el archivo de resultados JSON.
      non_matching_dob_warning: >-
        La fecha de nacimiento «%{dob}» de %{name} (%{wca_id}) no coincide con
        la registrada en la base de datos de la WCA («%{expected_dob}»). Si esto
        es un error, por favor corrígelo. En caso contrario, deja una nota al
        WRT al respecto explicando la situación.
      non_matching_gender_warning: >-
        El género «%{gender}» de %{name} (%{wca_id}) no coincide con el
        registrado en la base de datos de la WCA («%{expected_gender}»). Si esto
        es un error, por favor corrígelo. En caso contrario, deja una nota al
        WRT al respecto explicando la situación.
      empty_gender_warning: >-
        El género del nuevo %{name} está vacío. Valores válidos para este campo
        son «Femenino», «Masculino», y «Otro». Por favor, deja una nota al WRT
        al respecto explicando la situación.
      non_matching_name_warning: >-
        El nombre «%{name}» de %{wca_id} no coincide con el registrado en la base
        de datos de la WCA («%{expected_name}»).
      non_matching_country_warning: >-
        El país «%{country}» de %{name} (%{wca_id}) no coincide con el
        registrado en la base de datos de la WCA («%{expected_country}»). Si
        esto es un error, por favor corrígelo. En caso contrario, deja una nota
        al WRT al respecto explicando la situación.
      multiple_newcomers_with_same_name_warning: >-
        Hay múltiples competidores nuevos con el mismo nombre exacto: %{name}.
        Por favor, asegúrate de que los resultados son correctos para estos
        competidores y que todos los resultados están asignados correctamente a
        su ID.
      wrong_parenthesis_type_error: >-
        El paréntesis utilizado en «%{name}» es un carácter irregular, por favor
        reemplázalo con un paréntesis regular «(» o «)» y con espacios
        apropiados.
      special_characters_in_name_warning: >-
        El nombre «%{name}» contiene caracteres especiales inválidos (como
        números, comillas u otros símbolos). Los nombres solo deberían contener
        letras, espacios, guiones, apóstrofos, puntos y paréntesis normales.
      suspicious_last_name_warning: >-
        «%{name}» tiene «%{suffix}» como apellido, lo cual puede no ser un
        apellido real (por ejemplo, un sufijo generacional escrito
        completamente). Confirma que se trata de su apellido legal o
        sustitúyelo/elimínalo según corresponda.
      successive_uppercase_name_warning: >-
        «%{name}» tiene mayúsculas consecutivas en su nombre. Por favor,
        confirma que esta es la ortografía correcta de su nombre o corrígelo.
      lowercase_name_warning: >-
        «%{name}» tiene un nombre en todo minúsculas. Por favor, confirma que es
        la ortografía correcta del nombre o corrígelo.
      missing_period_in_single_letter_middle_name_warning: >-
        «%{name}» tiene un nombre de una sola letra sin punto de abreviación.
        Por favor, confirma que esta es la ortografía correcta del nombre o
        corrígelo.
      letter_after_period_warning: >-
        «%{name}» tiene un punto sin un espacio a continuación en su nombre. Por
        favor, confirma que es la ortografía correcta del nombre o corrígelo.
      single_letter_first_or_last_name_warning: >-
        «%{name}» tiene un nombre o apellido de una sola letra. Por favor,
        corrige el nombre o confirma que este es su nombre legal solicitando un
        documento de identidad oficial.
      single_name_warning: >-
        «%{name}» tiene un solo nombre. Por favor, confirma que este es el
        nombre completo del competidor con un documento de identidad oficial.
      competitor_limit_exceeded_warning: >-
        El número de personas en la competición (%{n_competitors}) supera el
        límite de competidores (%{competitor_limit}). Los resultados de los
        competidores registrados una vez se alcanzó el límite de competidores
        tienen que ser eliminados.
      registration_details_mismatch_warning: >-
        La persona con el ID de registro %{person_id} (%{name}) tiene detalles
        que no coinciden con su registro: %{mismatches}
      missing_matching_registration_warning: 'La persona %{name} no tiene un registro
        coincidente.'
      unaccepted_registration_with_results_warning: >-
        La persona %{name} tiene resultados en la competición, pero el registro
        no está marcado como «aceptado».
    results:
      automatically_position_fixed_info: >-
        [%{round_id}] Se ha corregido la posición de %{person_name} de %{pos} a
        %{expected_pos} automáticamente.
      automatically_global_position_fixed_info: >-
        [%{round_id}] Se ha corregido automáticamente la posición general de
        %{person_name}, que ha pasado de %{pos} a %{expected_pos}.
      mbf_result_over_time_limit_warning: >-
        [%{round_id}] El resultado «%{result}» de %{person_name} supera el
        tiempo límite. Por favor, asegúrate de que esto sea por penalizaciones
        antes de enviar los resultados o cambia el resultado a DNF.
      result_after_dns_warning: >-
        [%{round_id}] %{person_name} tiene al menos un DNS seguido de un
        resultado válido. Por favor, asegúrate de que sea un DNS y si lo es,
        explica lo sucedido al WRT.
      similar_results_warning: >-
        [%{round_id}] Los resultados de %{person_name} son similares a los de
        %{similar_person_name}. Por favor, controla que los resultados sean
        correctos para ambos competidores.
      met_cutoff_but_missing_results_error: >-
        [%{round_id}] %{person_name} pasó el corte pero no tiene resultados para
        sus últimos intentos. El corte era %{cutoff}.
      didnt_meet_cutoff_but_has_results_error: >-
        [%{round_id}] %{person_name} tiene al menos un resultado en sus últimos
        intentos pero no pasó el corte. El corte era %{cutoff}.
      wrong_attempts_for_cutoff_error: >-
        [%{round_id}] %{person_name} no cuenta con al menos uno de los intentos
        de la fase de corte. Por favor, edita los resultados para incluir el o
        los intentos faltantes, o actualiza la información de la ronda en la
        página Administrar categorías de la competición.
      result_over_time_limit_error: >-
        [%{round_id}] Al menos un resultado de %{person_name} excede el tiempo
        límite de la ronda, que es %{time_limit} por intento. Todas las
        soluciones que excedan el tiempo límite tienen que ser cambiadas a DNF.
      results_over_cumulative_time_limit_error: >-
        [%{round_ids}] La suma de resultados de %{person_name} excede el límite
        acumulativo, que era %{time_limit}.
      undefined_time_limit_warning: >-
        [%{round_id}] El tiempo límite de esta ronda es indefinido, se han
        omitido las validaciones de tiempo límite. Esto solo se pretende para
        competiciones antes del 2013.
      suspicious_dnf_warning: >-
        [%{round_ids}] La ronda tiene un tiempo límite acumulativo, y
        extrapolando los tiempos de %{person_name} notamos que habría tenido muy
        poco tiempo disponible para al menos uno de sus DNFs. Por favor,
        asegúrate de que cada DNF y DNS es correcto. Si el competidor no comenzó
        un intento o se quedó sin tiempo antes de empezar un intento, tiene que
        ser introducido como DNS.
      missing_cumulative_round_id_error: >-
        [%{original_round_id}] No se puede encontrar la ronda %{wcif_id} para el
        límite acumulativo especificado en el WCIF. Por favor, dirígete a la
        página Administrar categorías de la comeptición y elimina %{wcif_id} del
        tiempo límite acumulativo de %{original_round_id}. El WST está al tanto
        de este fallo (issue de GitHub #3254).
      wrong_position_in_results_error: >-
        %{round_id}] %{person_name} está en la posición incorrecta: se esperó
        %{expected_pos} pero se encontró %{pos}.
      wrong_global_position_in_results_error: >-
        [%{round_id}] %{person_name} está una posición general incorrecta: se
        esperaba %{expected_pos}, pero se ha obtenido %{pos}.
    rounds:
      too_many_qualified_warning: >-
        Ronda %{round_id}: más competidores clasificaron de lo que planeaba la
        condición de avance (%{actual} en vez de %{expected}), a condición era:
        %{condition}. Por favor, actualiza la información de la ronda en la
        página Administrar categorías.
      regulation_9m1_error: >-
        La ronda %{round_id} tiene 99 competidores o menos, pero tiene más de
        dos rondas consecutivas, lo cual no está permitido por la Regla 9m1.
      regulation_9m2_error: >-
        La ronda %{round_id} tiene 15 competidores o menos, pero tiene más de
        una ronda consecutiva, lo cual no está permitido por la Regla 9m2.
      regulation_9m3_error: >-
        La ronda %{round_id} tiene 7 competidores o menos, pero tiene al menos
        una ronda consecutiva, lo cual no está permitido por la Regla 9m3.
      regulation_9p1_error: >-
        Ronda %{round_id}: Menos del 25% de los competidores han sido eliminado,
        lo que no se permite por la Regla 9p1.
      no_competitor_eliminated_error: >-
        Ronda %{round_id}: Al menos un competidor tiene que ser eliminado,
        requerido por la Regla 9p (competiciones antes de abril del 2010).
      less_than_twenty_five_percent_eliminated_error: >-
        Ronda %{round_id}: según la condición de avance (%{condition}), menos
        del 25% de los competidores serían eliminados, lo cual no se permite por
        la Regla 9p1. Por favor, actualiza la información de la ronda en la
        página Administrar categorías.
      not_enough_qualified_warning: >-
        Ronda %{round_id}: de acuerdo con la información de las categorías, como
        mucho %{expected} podrían haber pasado de ronda, pero solo %{actual}
        compitieron. Por favor, deja un comentario explicando la situación (o
        corrige las condiciones de la ronda si aplicaste una condición de avance
        diferente).
      competed_not_qualified_error: >-
        Ronda %{round_id}: %{ids} compitieron sin conseguir la condición de
        avance (%{condition}). Por favor, asegúrate de que las condiciones de
        avance reflejen lo que se utilizó en la competición, y elimina los
        resultados si es necesario.
      round_not_found_error: >-
        La ronda %{round_id} no se ha encontrado. Por favor, asegúrate de que el
        panel Administrar categorías en la página web de la WCA y WCA Live estén
        sincronizados.
      missing_round_results_error: >-
        No hay resultados para la ronda %{round_id} pero está listada en la
        pestaña de categorías. Si esta ronda no se celebró, por favor elimínala
        en la página Administrar categorías de la competición.
    events:
      not_333_main_event_warning: >-
        La categoría principal seleccionada es %{main_event_id}. Aunque esto fue
        aprobado por el WCAT ANTES de la competición, el WRT tiene que
        asegurarse DESPUÉS de la competición de que se han cumplido las
        directrices acerca de la categoría principal de la Política de
        Requisitos de Competiciones de la WCA. Por favor, indica al menos una
        acción realizada para tratar a %{main_event_id} como la categoría
        principal DURANTE la competición (ejemplos válidos: ganador anunciado de
        la competición, mayor cantidad de rondas, mayor premio).
      no_main_event_warning: >-
        No hay categoría principal seleccionada para esta competición. Por
        favor, indica al WRT que esto es correcto.
      missing_results_warning: >-
        No hay resultados para %{event_id} pero está listada como categoría
        oficial. Si la categoría se celebró, por favor vuelve a subir el archivo
        JSON con los resultados incluidos. Si la categoría no se celebró, deja
        un comentario para el WRT explicando la situación.
    scrambles:
      missing_scrambles_for_round_error: >-
        [%{round_id}] Faltan las mezclas. Utiliza Scrambles Matcher para añadir
        las mezclas correctas a la ronda.
      missing_scrambles_for_competition_error: >-
        Faltan las mezclas de la competición. Utiliza Scrambles Matcher para
        añadir las mezclas.
      missing_scrambles_for_group_error: >-
        [%{round_id}] Grupo %{group_id}: faltan las mezclas, se detectaron
        %{actual} en vez de %{expected}.
      missing_scrambles_for_multi_error: >-
        [%{round_id}] Si bien se permiten múltiples grupos para 3x3x3 Multi
        Ciega, al menos uno de los grupos tiene que contener mezclas para todos
        los intentos.
      mbld_scrambles_warning: >-
        [%{round_id}] Esta ronda incluye resultados de 3x3x3 Multi Ciega. Por
        favor, especifica en tu comentario cuántas mezclas de cada set usaron
        realmente los competidores, para que el WRT pueda eliminar las mezclas
        adicionales no utilizadas.
      multiple_fmc_groups_warning: >-
        [%{round_id}] Hay múltiples grupos de 3x3x3 Menos Movimientos. Si solo
        un grupo fue utilizado, usa Scrambles Matcher para eliminar las mezclas
        sin usar. En caso contrario, deja un comentario al WRT explicando por
        qué se usaron múltiples grupos en 3x3x3 Menos Movimientos.
      wrong_number_of_scramble_sets_error: >-
        [%{round_id}] Esta ronda tiene un número distinto de sets de mezclas
        (%{actual}) a lo especificado en la pestaña Administrar categorías
        (%{expected}). Por favor, ajusta el número de sets de mezclas en la
        pestaña Administrar categorías al número de sets que se ha usado.
    schedule:
      activity_outside_competition_dates_warning: >-
        La actividad «%{activity_name}» (código: %{activity_code}) está
        programada fuera de la fecha de la competición según la zona horaria del
        recinto. Por favor, actualiza el horario de la competición para reflejar
        las fechas reales de la misma.
