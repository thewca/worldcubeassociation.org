          La información importante que los competidores deberían saber. Se
          mostrará en la página principal de la competición.<br/>Por favor,
          rellena esto <b>en inglés</b> y en cualquier otro idioma que hablen
          tus competidores.
        competitor_limit:
          enabled: >-
            Se requiere un límite de competidores. Solo las competiciones
            simultáneas de FMC con varias ubicaciones pueden no tener límite de
            competidores.
          count: >-
            El número de competidores permitidos en esta competición. Este
            límite se aplica mediante el sistema de registro integrado.
          reason: >-
            ¿Cuál es el motivo para el límite de competidores? Por favor,
            ¡rellena esto en inglés!
          auto_close_threshold: >-
            El registro se cerrará automáticamente cuando se reciba este número
            de registros pagados. Déjalo en blanco para desactivarlo, ignóralo
            si no estás usando pagos integrados.
          newcomer_month_reserved_spots: >-
            Solo permitido durante el Newcomer Month. Las plazas reservadas no
            pueden ser más que la mitad del límite de competidores.
          auto_accept_preference: >-
            Esto activará un botón de «Aceptar automáticamente en bloque» en el
            menú de registro. Esto aceptará todos los registros en lista de
            espera y pendientes hasta llegar al límite de competidores, o al
            límite definido a continuación. Úsalo bajo tu propia
            responsabilidad.
          auto_accept_disable_threshold: >-
            Cuando se llegue a este número de registros aceptados, se
            desactivará la aceptación automática de registros, permitiendo a los
            organizadores aprobar manualmente los últimos registros. Tiene que
            ser menor que el límite de competidores. Dejar en blanco si no se
            desea utilizar.
