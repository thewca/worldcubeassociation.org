            La web de la WCA soporta %{two_factor_link} utilizando una
            contraseña de un sólo uso:
          options:
            app: >-
              generado por una aplicación de 2FA en tu dispositivo móvil (como
              Authy, Google Authenticator o iOS Passwords).
            recovery: obtenido de los códigos de recuperación generados al 
              activar 2FA.
            email: enviado a tu correo electrónico cuando inicias sesión.
          status_html: 'Tienes %{status} la autenticación de dos factores.'
