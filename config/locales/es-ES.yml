  merch:
    title: Productos de la WCA
    paragraphs:
      '1': >-
        ¡La WCA tiene productos exclusivos disponibles para comprar! Desde
        camisetas, sudaderas, pegatinas, alfombrillas, mochilas, y más. Nuestros
        diseños se actualizan continuamente incluyendo el clásico logotipo de la
        WCA, productos oficiales de los Campeonatos Mundiales y diseños de los
        Récords Mundiales.
      '2': >-
        Comprar Productos de la WCA en nuestras tiendas es una de las mejores
        maneras de apoyar a la WCA - una organización sin ánimo de lucro, basada
        en voluntarios. Usamos todos los beneficios de los productos para apoyar
        campeonatos, comprar material y otras actividades relacionadas con la
