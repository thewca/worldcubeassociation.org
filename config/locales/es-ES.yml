            sesión.<br/>Otras alternativas incluyen %{google}, %{apple}, y
            %{microsoft}.
          scan_qrcode_html: >-
            Escanea el siguiente código QR cuando te lo solicite tu aplicación
            2FA (o pincha %{here} si estás desde el móvil).
          backup_codes: Códigos de respaldo
          backup_codes_desc: >-
            Los códigos de respaldo pueden ser utilizados como contraseñas de un
            sólo uso en caso de que no tengas acceso a tu dispositivo con tu
            aplicación de autenticación de dos factores. Cada código puede ser
            usado sólo una vez. ¡Asegúrate de guardarlos en un lugar seguro!
          no_backup_codes: >-
            No has generado los códigos de respaldo todavía. Pincha en el
            siguiente botón para generar tus códigos de respaldo.
          regenerate_backup_codes: >-
