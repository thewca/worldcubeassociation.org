          Después de subir un nuevo avatar, tendrás que esperar a que el Equipo
          de Resultados de la WCA lo apruebe.
        registration_notifications_enabled: >-
          Esto solo se aplica en competiciones que organices o delegues y puedes
          cambiarlo en cada competición.
        receive_developer_mails: >-
          Esto se limita a notificaciones sobre cambios mayores de versión en
          los recursos como exportaciones de datos, estructura del WCIF y APIs
          públicas. Recomendado para desarrolladores que mantienen software que
          depende de estas herramientas.
        receive_delegate_reports: >-
          Si eres Delegado Sénior o Miembro del WRC o del WQAC, recibirás los
          Informes de Delegados de forma predeterminada. Nota: el cambio puede
          tardar hasta 12 horas en hacer efecto.
        delegate_reports_region: >-
          Si quieres recibir todos los Informes de Delegados, deja este campo en
          blanco (la primera opción del desplegable). Nota: el cambio puede
          tardar hasta 12 horas en hacer efecto.
        otp_attempt: >-
          Comprueba tu aplicación de móvil configurada para una contraseña de un
          sólo uso o introduce uno de tus códigos de recuperación.
      dob_contact:
        dob: Tu fecha de nacimiento correcta en formato AAAA-MM-DD
        document: >-
          Para demostrar tu identidad y tu fecha de nacimiento, tienes que
          adjuntar una foto de algún documento legal (DNI, carnet de conducir,
          carnet de estudiante, pasaporte, certificado de nacimiento, etc.)
          donde tu nombre completo y tu fecha de nacimiento sean visibles y
          entendibles para un angloparlante (o ponte en contacto con tu Delegado
          de la WCA local si no tienes tal documento). Para la identificación
          necesitamos como mínimo tu nombre y tu fecha de nacimiento; puedes
          desenfocar u ocultar el resto de datos personales si así lo deseas.
      post:
        body: >-
          Usa la etiqueta &lt;!-- break --&gt; para mostrar una previsualización
          en la página principal. El texto que haya delante de esta etiqueta se
          mostrará en la página principal. La publicación mostrará el texto
          completo.
        show_on_homepage: >-
          ¡Cuidado! Esto no es seguro para información privada. Solo sirve para
          evitar que la página principal se sobrecargue visualmente. Las
          publicaciones que no se muestran en la página principal siguen siendo
          accesibles al público vía enlace permanente o a través de etiquetas.
      delegate_report:
        schedule_url: >-
          Enlace completo al horario (por ejemplo,
          https://www.cubingusa.com/usnationals2016/schedule.php)
        equipment: >-
          Cantidad y tipo de timers y displays utilizados en la competición. Por
          favor, elimina las líneas relativas al material que no hayas
          utilizado.
        summary: >-
          Los puntos mencionados anteriormente solo sirven de guía para un
          informe completo. Úsalos a tu discreción. ¡Por favor, elimina las
          partes sin usar!
        venue: >-
          Los puntos mencionados anteriormente solo sirven de guía para un
          informe completo. Úsalos a tu discreción. ¡Por favor, elimina las
          partes sin usar!
        organization: >-
          Los puntos mencionados anteriormente solo sirven de guía para un
          informe completo. Úsalos a tu discreción. ¡Por favor, elimina las
          partes sin usar!
        incidents: >-
          Por favor, reporta todos los incidentes no genéricos. Numéralos,
          empezando por el 1., de tal forma que otros Delegados puedan referirse
          a ellos por su número. Si todos los incidentes han sido genéricos,
          enumera al menos los casos más notorios. Marca las casillas apropiadas
          si deseas retroalimentación.
        setup_images: >-
          Tienes que incluir al menos %{image_count} imágenes que muestren las
          zonas de mezclas y de competición de la competición actual,
          preferiblemente durante la competición (también se aceptan otras
          imágenes). Puedes seleccionar varios archivos a la vez. Puedes
          eliminar imágenes solo cuando suficientes otras imágenes se hayan
          subido (si quieres reemplazar una imagen, necesitas subir la nueva
          primero y luego eliminar la antigua). Si no dispones de fotografías
          actuales de la zona de competición y/o de la zona de mezclas mientras
          se utilizan, explica por qué.
        wrc_incidents: >-
          Lista de números referenciando los incidentes de los cuales te
          gustaría obtener retroalimentación del WRC.
        wic_incidents_html: >-
          Lista de números referenciando los incidentes de los cuales te
          gustaría obtener retroalimentación del WIC. <br>
          <strong>%{wic_incident_alert}</strong>
        wic_incident_alert: >-
          Si el incidente del WIC es sensible (incluyendo pero no se limitándose
          a: crímenes, acoso, agresión, etc.), por favor, exclúyelo de tu
          informe y envíalo al WIC por separado. Para otros incidentes para el
          WIC, utiliza una versión breve y anonimizada del mismo y ponte en
          contacto con el WIC por privado para continuar con el desarrollo del
          mismo. El WIC dará retroalimentación sobre el incidente anonimizado de
          todas formas para conocimiento general. Para todos los incidentes del
          WIC que involucren a un Voluntario de la WCA, por favor excluye todos
          los detalles del informe y ponte en contacto con el WIC de forma
          privada.
        remarks: >-
          Habla acerca de otros detalles que quieras compartir (por ejemplo,
          progreso o regresión dentro de la comunidad o planes de futuro para la
          región). Si por ser conciso te has dejado algo sin decir en las
          secciones anteriores, puedes comentarlo ahora.
      competition_tab:
        name: 'Ejemplos: Cómo llegar, Pago, Premios, Alojamiento'
      regional_organization:
        website: Tiene que ser una URL http(s) válida. Se recomienda HTTPS
        logo: >-
          Tiene que estar en formato PNG, con buena resolución y con fondo
          transparente
        email: >-
          Debería ser una lista de correo electrónico que incluya a todos los
          miembros de la Junta Directiva y Oficiales
        bylaws: Tiene que estar en formato PDF
        extra_file: >-
          Tiene que estar en formato PDF. Si necesitas añadir más archivos, por
          favor, únelos en un único archivo
