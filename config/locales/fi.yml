        WCA tunnustaa useita aluejärjestöjä maailmanlaajuisesti. Aluejärjestön
        tarkoitus on järjestää WCA-kilpailuja ja tukea WCA:n toimia alueellaan.
        Alueita, jotka haluavat perustaa aluejärjestön, kannustetaan tukemaan
        WCA:n toimintaa alueellaan ennen hakemuksensa lähettämistä. Jos haluat
        apua kilpailun järjestämisessä, ota lähimpään WCA-delegaattiisi
        yhteyttä.
