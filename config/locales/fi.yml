  incidents_log:
    i18n_disclaimer: Huom. tämän sivun sisältö on ainoastaan englanniksi.
    incident: 'Incident:'
  about_regulations:
    title: Tietoa kilpailusäännöistä
    panel1:
      title: Säännöt
      content1_html: >-
        Kaikkien kilpailujen täytyy noudattaa <a
        href="/regulations/">WCA-sääntöjä</a>. On tärkeää, että kilpailija lukee
        nämä säännöt ennen ensimmäiseen kilpailuunsa osallistumista.
      content2_html: >-
        WCA Regulations Committee:n ratkaisuja erinäisiin kilpailuissa
        sattuneisiin poikkeustilanteisiin löytyy <a href="/incidents">Incidents
        Log:sta</a>.
    panel2:
      title: Käännökset
      content1_html: >-
        WCA:n jäsenet ovat kääntäneet WCA-säännöt useille eri kielille. Niitä
        voi tarkastella <a href="/regulations/translations/">täällä</a>.
        Suomenkielinen käännös löytyy <a
        href="/regulations/translations/finnish/">täältä</a>.
      content2_html: >-
        <strong>Tärkeää</strong>: Vaikka käännökset ovat erittäin hyödyllisiä,
        ne eivät ole virallisia. Kilpailuissa WCA-sääntöjen englanninkielinen
        versio on sitova ja ristiriitatilanteissa syrjäyttää käännösversiot.
    panel3:
      title: WCA-sääntöjen UKK
      content1_html: >-
        <a href="/faq">Usein kysytyt kysymykset</a> -osio vastaa useisiin
        yleisiin WCA-sääntöjä koskeviin kysymyksiin.
    panel4:
      title: Järjestäjän ohjesäännöt
      content1_html: >-
        Jos olet kiinnostunut kilpailun järjestämisestä tai suunnittelet jo
        järjestämistä, luethan <a href="https://documents.worldcubeassociation.org/edudoc/organizer-handbook/organizer-handbook.pdf">Järjestäjän
        ohjesäännöt</a>.
      content2_html: >-
        Tämä asiakirja sisältää tärkeää tietoa, ja jokaisen kilpailun
        järjestäjän tulisi lukea se.
  regulations_translations:
    title: 'WCA-säännöt: Käännökset'
    paragraph1: >-
      Jos puhut muuta kieltä kuin englantia, näistä käännöksistä voi olla
      hyötyä.
    paragraph2: >-
      Huomioithan, että käännökset eivät ole virallisesti hyväksyttyjä, vaikka
      ne löytyvät WCA-sivustolta (niiden oikeellisuus ei ole taattu). Jos
      käännöksen ja virallisen, ajantasaisen englanninkielisen version välillä
      on ristiriita, täytyy englanninkielistä versiota käyttää.
    translations: Käännökset
    current: Ajan tasalla
    old: Vanhentunut
    table_elements:
      version: Versio
      language: Kieli
    translating: Sääntöjen kääntäminen
    paragraph3_html: >-
      Jos haluat päivittää käännöstä tai lisätä uuden, lue <a
      href="https://github.com/thewca/wca-regulations-translations#translation-instructions">ohjeet
      GitHubissa</a>.
  media:
    common:
      view_media_page: Näytä kaikki media
      confirm_delete: 'Oletko varma, että haluat poistaa tämän median?'
    new:
      title: Lähetä mediaa
      review_warning_html: >-
        Kaikki media tarkastetaan ennen <a href="/media">mediasivulla</a>
        julkaisemista.
      guidelines: Säädökset
      media_guidelines:
        '1': Kaiken mediasisällön täytyy liittyä valittuun kilpailuun.
        '2': >-
          Kaiken mediasisällön täytyy olla soveliasta ja selkeää, eikä se saa
          sisältää mitään sopimatonta tai häiritsevää.
        '3': >-
          Mediasisällössä sponsoreita tai mainoksia ei saa olla laajamittaisesti
          esillä.
        '4': Kaikella mediasisällöllä täytyy olla soveliaat ja kuvaavat otsikot.
    edit:
      title: Muokkaa mediaa
      validate_media_page: Näytä kaikki hyväksyntää odottava media
    index:
      title: Media
      validate_media: Vahvista media
      submit_media_html: Voit lähettää mediaa <a href="/media/new">täällä</a>.
    validate:
      title: Vahvista media
    media_table:
      year: Vuosi
      location: 'Maa, kaupunki'
      accept: Hyväksy
      confirm_accept: 'Oletko varma, että haluat hyväksyä tämän median?'
      edit: Muokkaa
  media_and_instagram:
    page_title: Media- ja Instagram-sisällön lähetys
    general_media_submission:
      title: Median lähetys
      body_html: >-
        WCA jakaa yhteisön lähettämiä artikkeleita ja kuvia kilpailuista <a
        href="/media">mediasivulla</a>. Jos sinulla on jaettavaa mediasisältöä,
        täytäthän <a href="/media/new">tämän lomakkeen</a>!
    instagram_submission:
      title: Instagram-julkaisut
      paragraph1_html: >-
        Ehkä olet huomannut, että WCA:lla on <a
        href="https://www.instagram.com/thewcaofficial/">aktiivinen
        Instagram</a>! Pyrimme edustamaan maailmanlaajuista speedcubing-yhteisöä
        julkaisemalla WCA-jäsenten ympäri maailmaa lähettämää sisältöä.
      paragraph2: >-
        Jos sinulla on korkealaatuisia kuvia tai videoita, joita haluaisit
        meidän julkaisevan, klikkaa alla olevaa linkkiä ja täytä aukeava lomake.
        Vaatimuksena on, että omistat lähettämäsi sisällön ja annat WCA:lle
        luvan sen julkaisuun. Meille lähetetään niin paljon sisältöä, että emme
        voi julkaista aivan kaikkea, mutta alla on vinkkejä, joilla parannat
        mahdollisuuksiasi lähettämäsi sisällön julkaisuun:
      photo_quality: >-
        Varmista, että kuva/video on korkealaatuinen. Ammattikuvaaja ei tarvitse
        olla, mutta laatu ei saa olla kuvaa/videota selkeästi huonontava tekijä.
      photo_interest: >-
        Yritä luoda sisältöä, joka kiinnostaa laajaa katselijakuntaa. Vain
        pienelle piirille tarkoitettu sisältö ei kuulu tänne.
      wca_related: >-
        Lähetä WCA:han liittyviä kuvia tai videoita (sitä varten
        Instagram-tilimme on olemassa!). Annamme mielellämme näkyä, että
        harrastajat viihtyvät!
      submit_instagram_content: Lähetä Instagram-sisältöä
    instagram_hosting:
      title: Instagram-hostaaminen
      paragraph1_html: >-
        Silloin tällöin annamme yhteisön jäsenten hostata WCA:n virallista
        Instagram-tarinaa kilpailusta, johon he osallistuvat! Jos olet
        kiinnostunut, klikkaa alla olevaa linkkiä ja täytä aukeava lomake. WCA
        Communication Team ottaa sinuun yhteyttä, jos sinut hyväksytään
        hostaamaan. Jos sinulla on kysyttävää, <a
        href="https://www.worldcubeassociation.org/contact/website">otathan
        yhteyttä</a>.
      paragraph2: >-
        Tavoitteenamme on jakaa jokaisesta kilpailusta ja osallistujasta ripaus
        yksilöllistä puolta. Tarinan päivittämisen ei kuulu olla kovin suuri
        työtaakka; toki olet ensisijaisesti nauttimassa itse kilpailusta.
      paragraph3: 'Hostaajan rooli on suurinpiirtein seuraavanlainen:'
      short_intro: Esittäydy ja puhu hieman itsestäsi ja kilpailusta
      venue_feel: >-
        Kuvaa kilpailupaikan tunnelmaa ja kilpailijoita (voi olla esimerkiksi
        video kilpailijoiden alueesta ja ratkaisupaikoista)
      people_solving: >-
        Yritä saada jonkin verrran videota kilpailijoista kilpailemassa
        (mieluiten nopeita ratkaisijoita bravuurilajeissaan)
      mini_interviews: >-
        Voit haastatella esimerkiksi kilpailun järjestäjiä tai delegaatteja
        heidän kilpailutunnelmistaan
      pictures_too: 'Kaiken ei tarvitse olla videota: voit jakaa myös kuvia'
      paragraph4: >-
        Yhteydenpito viikonlopun aikana tapahtuu tyypillisesti
        WhatsApp-ryhmässä. Varmistathan siis, että WhatsApp on tuttu, tai
        kerrot, jos et voi käyttää sitä (jolloin järjestetään yhteydenpito muuta
        kautta).
      apply_to_host: Hae mukaan
    other_suggestions:
      title: Muita ehdotuksia?
      body_html: >-
        Onko sinulla muita ehdotuksia koskien WCA:n sosiaalisen median sisältöä?
        <a href="https://www.worldcubeassociation.org/contact/website">Otathan
        yhteyttä</a>!
  footer:
    privacy: Tietosuoja
    disclaimer: Vastuuvapautuslauseke
  api:
    manage_oauth_html: 'Go to %{oauth_link} to manage your OAuth applications.'
    token_request_intro: >-
      Here is an example, using curl, of obtaining an access token using an
      Application ID, Client Secret, your WCA email, and your password:
    user_email_placeholder: YOUR_EMAIL
    user_password_placeholder: YOUR_PASSWORD
    user_info_request_intro: >-
      An OAuth access token can be used, until it expires, to make authorized
      API requests. For example, to access information about your account:
    legal_tnoodle_api_header: Legal TNoodle version
    login_message: Kirjaudu sisään
  merch:
    title: WCA-tuotteet
    paragraphs:
      '1': >-
        WCA myy erilaisia tuotteita, kuten T-paitoja, huppareita, tarroja,
        Stackmateja ja reppuja. Valikoimaa päivitetään jatkuvasti, ja kaupasta
        löytyy esimerkiksi WCA:n logotuotteita, virallisia MM-kisatuotteita tai
        viimeaikaisiin maailmanennätyksiin liittyviä designeja.
      '2': >-
        WCA-tuotteiden ostaminen on mainio tapa tukea WCA:ta, joka pyörii täysin
        vapaaehtoisvoimin. Kaikki tuotteista saadut tuotot käytetään tulevien
        mestaruuskilpailujen, välineistön ja muun WCA:n toiminnan
        rahoittamiseen.
      '3': >-
        Tuotteitamme voi ostaa maailmanlaajuisesti -- myymälöitä on Euroopassa,
        Amerikassa ja Intiassa.
  database:
    results_export:
      heading: Vie tulostietokanta
      description: >-
        Tältä sivulta voit ladata WCA-tuloksia eri tiedostomuodoissa, jotta voit
        käyttää/analysoida niitä laajemmin. Aineistot päivitetään yleensä
        jokaisen kilpailuviikonlopun jälkeen. Tiedostot on numeroitu ja
        päivätty, jotta näet, onko sinulla jo uusin versio.
      permalink: pysyväislinkki
      file_formats:
        sql: SQL-käskyt SQL-tietokantaan tallentamista varten
        tsv: >-
          Sarkaimella erotetut arvot, laskentataulukoissa (esim. OpenOffice.org,
          Excel) käytettäväksi.
      hint_readme_html: >-
        Käyttöehdot ja kuvaus tietokannasta löytyvät oheisesta
        %{readme_filename}-tiedostosta (vain englanniksi):
    developer_export:
      heading: WST Developer Export
      description_html: >-
        Tältä sivulta voit ladata yksinkertaista tulostietokantaa laajemman
        WST-ohjelmistokehittäjän tietokannan SQL-muodossa. Lisätiedot löytyvät
        osoitteesta %{github_link}.
      download: Lataa
  validators:
    persons:
      dob_is_jan_one_warning: >-
        Henkilön %{name} syntymäaika on 1. tammikuuta; varmista, että se on
        oikein.
      dob_is_too_young_warning: '%{name} on alle 3-vuotias; varmista, että syntymäaika
        on oikein.'
      dob_is_too_old_warning: '%{name} on 100-vuotias; varmista, että syntymäaika
        on oikein.'
      person_doesnt_have_any_results_error: 'Kilpailijan %{person_name} (%{person_id})
        tulokset puuttuvat'
      results_not_associated_with_any_person_error: 'Tuloksissa on tunnistamaton kilpailija
        (id %{person_id})'
      whitespace_in_name_error: 'Kilpailijan ''%{name}'' nimessä on ylimääräisiä välilyöntejä.'
      person_with_non_existing_wca_id_error: 'Kilpailijalla %{name} on WCA ID, jota
        ei ole olemassa: %{wca_id}'
      no_space_before_parenthesis_error: 'Sulkumerkkiä täytyy edeltää välilyönti (nimessä
        ''%{name}'').'
      same_person_name_warning: >-
        WCA:n tietokannassa on jo vähintään yksi kilpailija, jonka nimi on
        '%{name}' (%{wca_ids}). Varmista, että tämän kilpailun %{name} on eri
        henkilö. Jos ei, yhdistä kilpailijan WCA-tiliin oikea WCA ID, ja generoi
        uusi JSON-tiedosto.
      non_matching_dob_warning: >-
        Kilpailijan %{name} (%{wca_id}) syntymäaika '%{dob}' ei täsmää
        tietokannasta löytyvään syntymäaikaan ('%{expected_dob}'). Jos tämä on
        virhe, korjaa se. Muussa tapauksessa jätä kommentti WRT:lle.
      non_matching_gender_warning: >-
        Kilpailijan %{name} (%{wca_id}) sukupuoli '%{gender}' ei täsmää
        tietokannasta löytyvään tietoon ('%{expected_gender}'). Jos tämä on
        virhe, korjaa se. Muussa tapauksessa jätä kommentti WRT:lle.
      empty_gender_warning: >-
        Kilpailijan %{name} sukupuoli on jätetty tyhjäksi. Sukupuoleksi
        hyväksytään vain nainen, mies tai muu. Jätä tästä kommentti WRT:lle.
      non_matching_name_warning: >-
        Kilpailijan %{wca_id} nimi '%{name}' ei täsmää tietokannasta löytyvään
        nimeen ('%{expected_name}').
      non_matching_country_warning: >-
        Kilpailijan %{name} (%{wca_id}) maa '%{country}' ei täsmää tietokannasta
        löytyvään tietoon ('%{expected_country}'). Jos tämä on virhe, korjaa se.
        Muussa tapauksessa jätä kommentti WRT:lle.
      multiple_newcomers_with_same_name_warning: >-
        Useammalla ensikertalaisella on täsmälleen sama nimi '%{name}'.
        Varmista, että tulokset on varmasti tallennettu oikealle kilpailijalle
        ja oikean id:n mukaan.
      wrong_parenthesis_type_error: >-
        Nimessä '%{name}' käytetty sulkumerkki on erikoismerkki, jota ei tueta.
        Korvaa se tavallisella sulkumerkillä '(' tai ')'.
      successive_uppercase_name_warning: >-
        Nimessä '%{name}' on isoja kirjaimia peräkkäin. Varmista, että nimi on
        kirjoitettu oikein tai korjaa kirjoitusasu.
      lowercase_name_warning: >-
        Nimessä '%{name}' on pienellä kirjaimella alkava osa. Varmista, että
        nimi on kirjoitettu oikein tai korjaa kirjoitusasu.
      missing_period_in_single_letter_middle_name_warning: >-
        Nimessä '%{name}' on yhdestä kirjaimesta koostuva osa ilman lyhennettä
        kuvaavaa pistettä. Varmista, että nimi on kirjoitettu oikein tai korjaa
        kirjoitusasu.
      letter_after_period_warning: >-
        Nimessä '%{name}' on piste, jonka jälkeen ei ole välilyöntiä. Varmista,
        että nimi on kirjoitettu oikein tai korjaa kirjoitusasu.
      single_letter_first_or_last_name_warning: >-
        Nimessä '%{name}' on etunimenä yksittäinen kirjain. Korjaa kirjoitusasu
        tai vahvista, että kyseessä on kilpailijan oikea nimi (virallisen
        asiakirjan mukaan).
      single_name_warning: >-
        Nimessä '%{name}' on vain yksi osa. Vahvista, että kyseessä on
        kilpailijan koko nimi (virallisen asiakirjan mukaan).
      competitor_limit_exceeded_warning: >-
        Kilpailijoiden määrä (%{n_competitors}) ylittää kilpailijarajan
        (%{competitor_limit}). Kilpailijoiden, jotka rekisteröityivät
        kilpailijarajan täyttymisen jälkeen, tulokset on poistettava.
    results:
      automatically_position_fixed_info: >-
        [%{round_id}] Kilpailijan %{person_name} sijoitus korjattiin
        automaattisesti (%{pos} -> %{expected_pos}).
      mbf_result_over_time_limit_warning: >-
        [%{round_id}] Kilpailijan %{person_name} tulos '%{result}' ylittää
        aikarajan. Varmista, että aikaraja ylittyy ainoastaan aikarangaistusten
        johdosta. Muussa tapauksessa korjaa tulos DNF:ksi.
      result_after_dns_warning: >-
        [%{round_id}] Kilpailijalla %{person_name} on DNS-tulos, jota seuraa
        hyväksytty tulos. Varmista, että DNS on oikein. Jätä WRT:lle kommentti,
        jossa kerrot, miten DNS aiheutui.
      similar_results_warning: >-
        [%{round_id}] Kilpailijoiden %{person_name} ja %{similar_person_name}
        tulokset ovat keskenään hyvin samankaltaiset. Varmista, että tulokset
        ovat varmasti oikein.
      met_cutoff_but_missing_results_error: >-
        [%{round_id}] Kilpailija %{person_name} pääsi cutoffista, mutta häneltä
        puuttuu tulokset loppukierroksen ajalta. Cutoff oli %{cutoff}.
      didnt_meet_cutoff_but_has_results_error: >-
        [%{round_id}] Kilpailija %{person_name} ei päässyt cutoffista, mutta
        hänellä on vähintään yksi tulos loppukierrokselta. Cutoff oli %{cutoff}.
      wrong_attempts_for_cutoff_error: >-
        [%{round_id}] Kilpailijalta %{person_name} puuttuu vähintään yksi
        cutoff-vaiheen ratkaisuyrityksen tulos. Lisää puuttuva tulos tai päivitä
        kierroksen tiedot kilpailusivulla.
      mismatched_result_format_error: >-
        [%{round_id}] Results for %{person_name} are in the wrong format:
        expected %{expected_format}, but got %{format}.
      result_over_time_limit_error: >-
        [%{round_id}] Kilpailijalla %{person_name} on vähintään yksi tulos, joka
        ylittää aikarajan %{time_limit}. Kaikki aikarajan yli menneet ratkaisut
        täytyy muuttaa DNF:ksi.
      results_over_cumulative_time_limit_error: >-
        [%{round_ids}] Kilpailijan %{person_name} ratkaisujen summa ylittää
        kumulatiivisen aikarajan %{time_limit}.
      no_round_information_warning: >-
        [%{round_id}] There is no information about the cutoff and time limit
        for this round. These validations have been skipped. Please update the
        round's information in the competition's Manage Events page.
      undefined_time_limit_warning: >-
        [%{round_id}] The time limit for this round is undefined, time limit
        validations have been skipped. This is expected only for competitions
        before 2013.
      suspicious_dnf_warning: >-
        [%{round_ids}] Kierroksella on kumulatiivinen aikaraja, ja kilpailijan
        %{person_name} hyväksyttyjen ratkaisujen perusteella hänellä olisi ollut
        hyvin vähän aikaa jäljellä vähintään yhteen DNF-tulokseen. Varmista,
        että kaikki DNF:t ja DNS:t on merkitty oikein. Jos kilpailija ei
        aloittanut ratkaisuyritystä tai hänellä ei ollut aikaa jäljellä
        ratkaisuyritykseen, tulokseksi täytyy merkitä DNS.
      missing_cumulative_round_id_error: >-
        [%{original_round_id}] Unable to find the round %{wcif_id} for the
        cumulative time limit specified in the WCIF. Please go to the
        competition's Manage Events page and remove %{wcif_id} from the
        cumulative time limit for %{original_round_id}. WST knows about this bug
        (GitHub issue #3254).
      wrong_position_in_results_error: >-
        [%{round_id}] Kilpailijan %{person_name} sijoitus on väärä: sijoituksen
        pitäisi olla %{expected_pos}, mutta sijoitukseksi on merkitty %{pos}.
    rounds:
      too_many_qualified_warning: >-
        [%{round_id}] Jatkoon pääsi enemmän kilpailijoita kuin kilpailusivulle
        merkitty jatkoonpääsyvaatimus sallisi (jatkoon pääsi %{actual} eikä
        %{expected}, jatkoonpääsyvaatimus oli %{condition}). Käy kilpailusivulla
        päivittämässä kierroksen tiedot.
      unexpected_round_results_error: >-
        Tuloksissa on mukana kierros %{round_id}, jota ei ole lisätty
        kilpailusivulle. Käy kilpailusivulla päivittämässä kierrosten tiedot
        oikeaksi.
      regulation_9m1_error: >-
        Kierroksella [%{round_id}] on alle 100 kilpailijaa, mutta yli kaksi
        jatkokierrosta, mikä rikkoo sääntöä 9m1.
      regulation_9m2_error: >-
        Kierroksella [%{round_id}] on alle 16 kilpailijaa, mutta yli yksi
        jatkokierros, mikä rikkoo sääntöä 9m2.
      regulation_9m3_error: >-
        Kierroksella [%{round_id}] on alle 8 kilpailijaa, mutta vähintään yksi
        jatkokierros, mikä rikkoo sääntöä 9m3.
      regulation_9p1_error: >-
        Kierroksella [%{round_id}] jatkoon pääsi yli 75 % kilpailijoista, mikä
        rikkoo sääntöä 9p1.
      no_competitor_eliminated_error: >-
        Round %{round_id}: There must be at least one competitor eliminated,
        which is required as per Regulation 9p (competitions before April 2010).
      less_than_twenty_five_percent_eliminated_error: >-
        Round %{round_id}: according to the advancement condition
        (%{condition}), fewer than 25%% of competitors would be eliminated,
        which is not permitted as per Regulation 9p1. Please update the round
        information in the manage events page.
      not_enough_qualified_warning: >-
        Round %{round_id}: according to the events data, at most %{expected}
        could have proceed, but only %{actual} competed in the round. Please
        leave a comment about that (or fix the events data if you applied a
        different advancement condition).
      competed_not_qualified_error: >-
        Round %{round_id}: %{ids} competed but did not meet the attempt result
        advancement condition (%{condition}). Please make sure the advancement
        condition reflects what was used during the competition, and remove the
        results if needed.
      round_not_found_error: >-
        Round %{round_id} could not be found. Please make sure that the WCA
        website Edit Events panel and WCA Live are in sync.
      missing_round_results_error: >-
        There are no results for round %{round_id} but it is listed in the
        events tab. If this round was not held, please remove the round in the
        competition's manage events page.
      unexpected_combined_round_error: >-
        No cutoff was announced for '%{round_name}', but it has been detected as
        a cutoff round in the results. Please update the round's information in
        the competition's manage events page.
    events:
      not_333_main_event_warning: >-
        The selected main event is %{main_event_id}. Although this was approved
        by WCAT BEFORE the competition, WRT is responsible for ensuring AFTER
        the competition that the suitable main event guidelines from the WCA
        Competition Requirements Policy were met. Please give one action that
        was taken to treat %{main_event_id} as the main event DURING the
        competition (valid examples: declared the winner of the competition,
        most number of rounds, bigger prize).
      no_main_event_warning: >-
        There is no selected main event for this competition. Please let WRT
        know that this is correct.
      unexpected_results_error: >-
        Results are present for %{event_id}, however it is not listed as an
        official event. Please remove the event from the results or contact the
        WCAT to request the event to be added to the WCA website.
      missing_results_warning: >-
        There are no results for %{event_id}, but it is listed as an official
        event. If the event was held, please reupload your JSON with the results
        included. If the event was not held, leave a comment for the WRT.
    scrambles:
      missing_scrambles_for_round_error: >-
        [%{round_id}] Missing scrambles. Use Scrambles Matcher to add the
        correct scrambles to the round.
      missing_scrambles_for_competition_error: >-
        Missing scrambles for the competition. Use Scrambles Matcher to add
        scrambles.
      unexpected_scrambles_for_round_error: >-
        [%{round_id}] Too many scrambles. Use Scrambles Matcher to uncheck the
        unused scrambles.
      missing_scrambles_for_group_error: >-
        [%{round_id}] Group %{group_id}: missing scrambles, detected only
        %{actual} instead of %{expected}.
      missing_scrambles_for_multi_error: >-
        [%{round_id}] While you may have multiple groups in 3x3x3 Multi-Blind,
        at least one of the groups must contain scrambles for all attempts.
      multiple_fmc_groups_warning: >-
        [%{round_id}] There are multiple groups of FMC used. If one group of FMC
        was used, please use the Scrambles Matcher to uncheck the unused
        scrambles. Otherwise, please include a comment to WRT explaining why
        multiple groups of FMC were used.
      wrong_number_of_scramble_sets_error: >-
        [%{round_id}] This round has a different number of scramble sets than
        specified on the Manage Events tab. Please adjust the number of scramble
        sets in the Manage Events tab to the number of sets that were used.
  tickets:
    type:
      edit_person: Edit Person
      competition_result: Competition Result
