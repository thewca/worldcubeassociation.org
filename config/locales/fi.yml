  score_tools:
    title: Ohjelmistotyökaluja WCA-kilpailuihin
    wca_icon_text: 'WST:n kehittämä ja ylläpitämä'
    intro:
      desc: >-
        Tälle sivulle on listattu tunnettuja ohjelmistoja/sovelluksia, joita
        käytetään apuna WCA-kilpailujen järjestämisessä.
      disclaimer: >-
        Kaikki ohjelmistot eivät ole WST:n hallinnoimia; WST ei millään ehdi
        ylläpitämään kaikkia hyödyllisiä sovelluksia.
      used: >-
        Kaikkia listattuja ohjelmia on käytetty WCA-kilpailuissa ja ne ovat
        yhteydessä WCA-sivustoon siten, että voit kirjautua sisään WCA-tililläsi
        ja saada ohjelmaan automaattisesti tiedot järjestämistäsi kilpailuista.
        Kaikkien ohjelmien ylläpitäjä(t) on mainittu.
    before:
      title: Ennen kilpailua
      desc: >-
        Kilpailun rekisteröitymisiä voi hallita suoraan WCA-sivuston kautta,
        mutta ryhmien jakoon voi käyttää alla olevia työkaluja.
    during:
      title: Kilpailun aikana
      desc: >-
        Nämä työkalut auttavat hoitamaan tuloksia kilpailun yhä ollessa
        käynnissä.
    after:
      title: Kilpailun jälkeen
      desc: >-
        Vaikka tulokset vahvistetaan lopulta täällä WCA-sivustolla, täytyy
        TNoodlen luomat sekoitussarjat liittää kilpailutuloksiin ennen niiden
        lähettämistä.
    tools:
      age:
        title: AGE
        description: >-
          Tällä ohjelmalla voi luoda ja muokata WCA-kilpailujen ryhmä- ja
          tehtäväjakoja.
      certificates:
        title: Kunniakirjat
        description: 'Tulosta kunniakirjoja kilpailuihin, jotka käyttävät WCA Liveä'
      groupifier:
        title: Groupifier
        description: >-
          Työkalu, jolla kilpailun järjestäjä voi hoitaa ryhmä- ja tehtäväjaot.
          Ominaisuuksiin kuuluu muun muassa ryhmien jakaminen kilpailijoiden
          ranking-sijojen perusteella, tehtävien (kuten tuomarointi ja
          sekoittaminen) jakaminen, tarvittavien sekoitussarjojen lukumäärän
          arviointi sekä tuloskorttien ja henkilökohtaisten aikataulujen
          luominen. Lisätiedot verkkosivustolla.
      scorecards:
        title: Tuloskortit
        description: 'Tulosta tuloskortteja kilpailuihin, jotka käyttävät WCA Liveä.'
      tnoodle:
        title: TNoodle (Sekoitussarjat)
        description: >-
          TNoodle on WCA-kilpailujen virallinen sekoitusohjelma. WCA-delegaatit
          käyttävät sitä ennen kilpailuja, mutta sen käyttöliittymä sallii kenen
          tahansa luoda sekoitussarjoja WCA:n kilpailulajeihin.
      live:
        title: WCA Live
        description: Alusta WCA-kilpailujen reaaliaikaisten tulosten julkaisuun.
      nightmare:
        title: Tulostaulukko
        description: >-
          Jos internetyhteyttä ei ole, voi olla, että täytyy turvautua
          laskentataulukkoon.
      matcher:
        title: Scrambles Matcher
        description: >-
          Can be used to assign scrambles generated by TNoodle to results.
          Import results from the WCA website (when using WCA Live), a
          spreadsheet, or a standalone WCIF file. Import scrambles from one or
          more TNoodle json file(s). Export results to the appropriate format
          for WCA submission.
      groups:
        title: Competition groups
        description: Tarkastele käynnissä olevien kilpailujen ryhmäjakoja.
  logo:
    title: 'WCA:n logo'
    intro: >-
      WCA:n logon suunnitteli Justin Eastman suunnittelukilpailussa tammikuussa
      2005. Logossa miellytti sen muotoilu ja värit sekä se, että esillä ei ole
      spesifisti 3x3x3-kuutio.
    headings:
      usage_guidelines:
        title: Käyttösäännökset
        paragraph:
          acceptable_usage: >-
            WCA:n logon hyväksyttävä käyttö on määritetty <a
            href="https://documents.worldcubeassociation.org/documents/policies/external/Logo%20Usage.pdf">logon
            käyttösäännöksissä</a>. Lue tämä asiakirja ennen WCA:n logon
            käyttämistä henkilökohtaisiin projekteihin. Kaikki kysymykset logon
            käyttöön liittyen voi lähettää <a
            href="mailto:marketing@worldcubeassociation.org">WCA Marketing
            Teamille</a>.
          see_below: 'Alla on tyyliohjeita WCA:n logon oikeanlaiseen käyttöön.'
        color:
          title: Väri
          paragraph: >-
            WCA:n logon väreistä on olemassa neljä variaatiota. Käytettävä
            variantti pitäisi valita sen mukaan, mille taustavärille logo
            asetetaan.
          primary:
            title: Ensisijainen
            paragraph: Käytä ensisijaista varianttia aina kun mahdollista.
          mono:
            title: Kaksivärinen
            paragraph: >-
              Käytä kaksiväristä varianttia vain silloin, kun ensisijainen
              variantti ei ole sopiva.
        logo_only:
          title: Pelkkä logo
          paragraph: >-
            WCA:n logoa voi käyttää myös ilman logotekstiä, samoilla
            värisäännöksillä kuin yllä.
      download_logo_assets:
        title: Lataa logotiedostot
        paragraph: 'WCA:n logon voi ladata korkealaatuisina PNG- ja vektoritiedostoina.'
        accept_terms_and_conditions: >-
          Olen lukenut ja hyväksyn <a
          href="https://documents.worldcubeassociation.org/documents/policies/external/Logo%20Usage.pdf">logon
          käyttösäännökset</a>.
        download_button_text: Lataa logotiedostot
