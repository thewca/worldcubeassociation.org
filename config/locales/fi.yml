          This is limited to notifications for major version changes to
          resources like data exports, WCIF schema and public APIs. Recommended
          for developers maintaing software that relies on these tools.
        receive_delegate_reports: >-
          If you are a Senior Delegate or Member of the WRC or the WQAC, you
          receive Delegate Reports by default. Note: the change may take up to
          12 hours to take effect.
        delegate_reports_region: >-
          If you want to receive all reports, leave this field blank (the
          dropdown option at the very top). Note: the change may take up to 12
          hours to take effect.
        otp_attempt: >-
          Tarkista määritetty mobiilisovelluksesi saadaksesi kertakäyttöisen
          salasanan tai syötä palautuskoodi.
      dob_contact:
        dob: Oikea syntymäpäiväsi muodossa VVVV-KK-PP
        document: >-
          Todistaaksesi henkilöllisyytesi ja oikean syntymäaikasi, sinun tulee
          liittää kuva jostakin virallisesta asiakirjasta (henkilökortti,
          ajokortti, opiskelijakortti, passi, syntymätodistus tms.), josta käy
          ilmi nimesi sekä syntymäpäiväsi englantia puhuvalle ymmärrettävällä
          tavalla. Ota yhteyttä lähimpään WCA-delegaattiisi, jos sinulla ei ole
          tällaista asiakirjaa. Voit halutessasi peittää muut kuvassa näkyvät
          henkilötiedot; ainoastaan nimi ja syntymäaika tarvitaan.
      post:
        body: >-
          Käytä tunnistetta &lt;!-- break --&gt; näyttääksesi esikatselun
          etusivulla. Kaikki teksti ennen tätä jakajaa näkyy etusivulla. Koko
          teksti näkyy oikealla julkaisusivulla.
        show_on_homepage: >-
          Varo! Tässä ei ole turvallista yksityisille tiedoille. Tavoitteena on
          vain estää etusivun sekaisuus. Julkaisut, jotka eivät näy etusivulla,
          ovat silti nähtävissä pysyvän linkin tai tunnisteiden kautta.
      delegate_report:
        schedule_url: >-
          Koko linkki julkaistuun aikatauluun (esim.
          https://www.cubingusa.com/usnationals2016/schedule.php)
        equipment: >-
          Kilpailussa käytettyjen ajastimien ja näyttöjen lukumäärä ja mallit.
          Poista rivit, joilla on tarvikkeita, joita ei käytetty.
        summary: >-
          The listed points above are just for guidance for a complete report.
          Use them at your discretion for what you see fit. Please remove unused
          parts!
        venue: >-
          The listed points above are just for guidance for a complete report.
          Use them at your discretion for what you see fit. Please remove unused
          parts!
        organization: >-
          The listed points above are just for guidance for a complete report.
          Use them at your discretion for what you see fit. Please remove unused
          parts!
        incidents: >-
          Please report all incidents which are non-standard cases. Number the
          incidents starting from 1., so that other Delegates can comment
          referring to them by their numbers. Even if everything seemed generic,
          just list at least the most noteworthy cases. Please check off the
          appropriate boxes below if you are actively seeking feedback.
        setup_images: >-
          You MUST include at least %{image_count} images which illustrate the
          scrambling and competition areas (other images are also welcome). You
          can select multiple files at once. You can delete images only when
          enough other images have been uploaded (if you want to replace an
          image, you need to upload the new one first, and then delete the old
          one).
        wrc_incidents: >-
          List of numbers referencing any incidents that you would like the
          WRC's feedback on.
        wic_incidents_html: >-
          List of numbers referencing any incidents that you would like the
          WIC's feedback on. <br> <strong>%{wic_incident_alert}</strong>
        wic_incident_alert: >-
          If the WIC incident is sensitive (including but not limited to crimes,
          harassment, assault, etc.), please exclude this from your report and
          email the WIC separately. For other WIC incidents, default to a brief,
          anonymized version of the incident and follow-up with the WIC
          privately with further details. The WIC will still provide feedback on
          anonymized versions for general awareness. For all WIC incidents
          involving a WCA Volunteer, please exclude all details from the report,
          and contact the WIC privately.
        remarks: >-
          Kerro muista yksityiskohdista, jotka haluat jakaa (esim.
          yhteisöllisyyden paraneminen/huononeminen tai aluetta koskevat
          tulevaisuudensuunnitelmat). Jos jätit aikaisemmissa osioissa jotakin
          tiivistämisen vuoksi kertomatta, kerro tässä.
      competition_tab:
        name: 'Esimerkkejä: Matkustus, Palkinnot, Majoitus'
      regional_organization:
        website: Must be a valid http(s) url. HTTPS is recommended
        logo: >-
