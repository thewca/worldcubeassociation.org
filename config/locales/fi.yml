          ohjesääntöjen (Motions) mukaisia päämääriä
        '4': Noudattaa kaikkia relevantteja WCA-sääntöjä (Regulations)
        '5': 'Hyväksyä ja suostua WCA:n vapaaehtoisten päätöksiin'
        '6': >-
          Jakaa WCA:lle ajantasainen kopio järjestön omista säännöistä
          sähköisessä muodossa
