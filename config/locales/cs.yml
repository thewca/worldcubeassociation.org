        name: >-
          Zadejte jméno a příjmení soutěžícího správně, jako například
          <strong>Béďa Trávníček</strong>. Ne nedbale jako <strong>b
          travnicek</strong>.<br/>Prostřední jména (celá i iniciály) jsou
          nepovinná.
        pending_avatar: >-
          Po nahrání nového avataru budete muset počkat na schválení od WCA
          Results Teamu.
        registration_notifications_enabled: >-
          Toto se týká jen soutěží, které organizujete nebo delegujete a lze to
          změnit i pro každou konkrétní soutěž.
        receive_delegate_reports: >-
          Pokud jste Trainee delegát, Junior delegát, Senior delegát, nebo člen
          WRC či WQAC, dostáváte reporty delegátů defaultně. Poznámka: může
          trvat až hodinu, než se tato změna projeví.
        otp_attempt: >-
          Zkontrolujte svou nakonfigurovanou mobilní aplikaci k získání hesla,
          nebo vložte jeden ze záložních kódů.
      competition:
        name: >-
          Celý název soutěže včetně roku na konci (např. Czech Open 2016).
          Dodržujte velká písmena. Název může obsahovat pouze písmena, čísla,
          pomlčky (-), ampersandy (&), tečky (.), dvojtečky (:), apostrofy (') a
          mezery ( ).
        cell_name: >-
          Zkrácený název pro zobrazení. Pokud je samotný název soutěže
          dostatečně krátký, můžete ho použít (např. Europe 2006).
        city_name: >-
          Název města a (případně) stát, ve kterém se bude soutěž konat.
          Nezahrnujte zemi (např. Brno NEBO San Francisco, California).
        information: >-
          Důležité informace, které by soutěžící měli vědět. Zobrazí se na
          hlavní stránce soutěže. <br/>Prosíme, napište to <b>v angličtině</b> a
          v jakémkoli dalším jazyce, kterým vaši soutěžící mluví.
        staff_delegate_ids: Delegáti WCA pro tuto soutěž.
        trainee_delegate_ids: WCA Trainee delegáti pro tuto soutěž
        organizer_ids: >-
          Organizátoři soutěže (aby zde mohli být uvedeni, musí mít vytvořený
          účet).
        external_website: Webové stránky soutěže. Musí to být platná http(s) 
          url.
        registration_open: 'Poznámka: Zahájení a ukončení registrace jsou uvedeny
          v UTC čase.'
        remarks: >-
          Dodatečné informace pro WCAT. Například pokud si něčím nejste jisti,
          nebo nějaké speciální žádosti pro WCAT. Prosíme vyplňte v angličtině!
        external_registration_page: >-
          Stránka, na které se budou soutěží přihlašovat na soutěž. Musí to být
          platná http(s) url.
        base_entry_fee_lowest_denomination: >-
          Základní registrační poplatek pro soutěž. Zobrazí se na stránkách s
          informacemi o soutěži a na registrační stránce, pokud se bude
          používat. Pokud bude stanoven na 0, zobrazí se věta, že registrace
          budou přijaty zdarma. <br><br><b>POZNÁMKA: Následující odhad WCA Dues
          je jen přibližný a počítá s aktuálními směnnými kurzy. Není nijak
          právně závazný.</b><br>Kliněte na "Aktualizovat soutěž" poté co
          změníte kód měny, abyste synchronizovali odhad. Pokud nejsou dostupné
          žádné směnné kurzy, nebude nic zobrazeno.
        currency_code: Kód měny pro poplatky.
        competitor_limit_enabled: >-
          Doporučujeme stanovit limit pro soutěžící, ačkoliv to není dle
          Pravidel nutné.
        competitor_limit: >-
          Počet soutěžících povolených pro tuto soutěž. Nyní je toto číslo pouze
          informativní a nezabrání registraci více lidí. We are working on
          adding explicit support for this to the registration flow, but it
          requires some other work first.
        competitor_limit_reason: >-
          Z jakého důvodu jste určili tento limit pro soutěžící? Prosíme,
          vyplňte toto pole v angličtině!
        guests_per_registration_limit: >-
          Počet hostů na jednu registraci povolený na této soutěži. Registrace s
          příliš velkým počtem hostů bude zablokována. Nechte prázdné, pokud
          nechcete stanovit limit.
        events_per_registration_limit: >-
          Volitelně vynuťte maximální počet eventů, na které se soutěžící může
          zaregistrovat (často používané pro „Favourites“ soutěže. Měli byste
          mít přidané eventy, než využijete toto pole. Registrace s příliš mnoha
          eventy budou zablokovány. Nechte prázdné, pokud není žádný limit.
        extra_registration_requirements: >-
          Prosíme udejte zde jakékoli speciální požadavky pro registraci, které
          nejsou pokryty výše, jako například pokyny k platbě.<br/>Prosíme
          napište to <b>v Angličtině</b> a v jakémkoli dalším jazyce, kterým
          vaši soutěžící mluví; zobrazí se to na stránkách s informacemi o
          soutěži a na registrační stránce, pokud používáte registrační stránky
          WCA.
        on_the_spot_entry_fee_lowest_denomination: >-
          Pokud je to nastaveno na 0, zobrazí se věta, že registrace na místě
          budou přijaty zdarma.
        refund_policy_percent: >-
          Nyní je toto číslo pouze informativní, vrácení peněz se bude muset
          řešit manuálně. Pokud to nastavíte na 0, zobrazí se věta, že se
          registrační poplatky nebudou vracet za žádných podmínek.
        refund_policy_limit_date: 'Datum, po kterém se nebude řešit žádné vrácení
          peněz.'
        waiting_list_deadline_date: >-
          Datum po kterém osoby na waiting listu už nemohou být přijaty. Pokud
          máte deadline na vrácení poplatků, tento deadline by neměl být před
          ním.
        event_change_deadline_date: >-
          Registrovaní soutěžící mají právo aktualizovat své eventy až do této
          doby a to kontaktováním organizačního týmu. Uzávěrka nesmí být
          nastavena před datum konce registrace. Pokud toto pole necháte
          prázdné, soutěžící budou moci měnit eventy až do jejich začátku. Pokud
          máte povolené registrace na místě, toto musí být nastaveno na den
          soutěže.
        guests_entry_fee_lowest_denomination: >-
          Prozatím je toto číslo pouze informativní a poplatky za hosty nelze
          řešit pomocí této stránky. Pokud toto nastavíte na 0, zobrazí se věta
          o divácích dle vaší volby.
        early_puzzle_submission_reason: >-
          Prosíme rozeberte, proč byste chtěli požadovat, aby soutěžící
