        qualification_results_reason: >-
          Prosíme rozeberte, proč byste chtěli používat kvalifikační časy.
          Prosíme, vyplňte toto v angličtině!
        event_restrictions_reason: >-
          Prosíme rozepište, proč byste chtěli zakázat některé kombinace eventů.
          Prosíme, vyplňte toto v angličtině!
        main_event_id: Vítěz tohoto eventu bude vítězem celé soutěže.
        championships:
      website_contact:
      dob_contact:
        dob: Vaše správné datum narození ve formátu RRRR-MM-DD
        document: >-
          Abyste nám dokázali svou identitu a správný datum narození, musíte
          přidat obrázek nějakého právního dokumentu (občanský průkaz, řidičský
          průkaz, studentský průkaz, pas, rodný list...), kde je vaše jméno a
          datum narození viditelné a srozumitelné pro anglicky mluvící osobu
          (pokud nemáte takový dokument, kontaktujte místního delegáta WCA). K
          identifikaci potřebujeme minimálně jméno a datum narození, ostatní
          data na dokladu můžete zamazat.
      post:
        body: >-
          Použijte &lt;!-- break --&gt; tag pro zobrazení náhledu na hlavní
          stránce. Jakýkoli příspěvek zobrazí na hlavní stránce celý text před
          tímto děličem. Samotný příspěvek pak zobrazí celé tělo.
        show_on_homepage: >-
          Pozor! Toto není bezpečné pro soukromá data. Cílem je pouze zabránit
          přeplnění domovské stránky. Příspěvky, které nejsou zobrazeny na
          domovské stránce, jsou stále veřejně přístupné přes permalink nebo
          tagy.
