  faq:
    title: Často kladené dotazy (FAQ)
    contact_html: 'Pokud vám žádná z těchto odpovědí nepomohla, %{contact_us}!'
    contact_us: kontaktujte nás
    search_for_competition: 'Vyhledejte soutěž zde:'
    already_logged_in: Jste již přihlášen(a) k WCA účtu.
    create_an_account: '%{here} si můžete vytvořit účet.'
    claim_your_wca_id: '%{here} si můžete zažádat o WCA ID.'
    create_an_account_and_claim: >-
      Vytvořte si účet %{here}. Poté, co se přihlásíte ke svému novému účtu,
      budete požádáni, abyste si zažádali o WCA ID.
    answers:
      '1':
        title: Jak získám WCA ID a WCA profil?
        content:
          '1': >-
            Pokud jste ještě nesoutěžil(a), jděte na <a
            href='/competitions'>soutěž</a>! WCA ID a WCA profil pro vás budou
            vytvořeny poté, co budou zveřejněny výsledky z vaší první soutěže.
      '2':
        title: Jak najdu WCA soutěž?
        content:
          '1': Podívejte se na náš seznam <a href='/competitions'>soutěží</a>
      '3':
        title: >-
          Jak se můžu zaregistrovat na soutěž? Na koho se mám obrátit při
          problémech s registrací?
        content:
          '1': >-
            Na mnoho soutěží se dá zaregistrovat přímo zde na webových stránkách
            WCA, ale některé využívají svůj vlastní systém. Pokud chcete získat
            více informací o soutěži, které se chcete zúčastnit, měli byste
            kontaktovat organizátory té soutěže. %{comp_search_form}
      '4':
        title: >-
          Jaké jsou požadavky pro účast na WCA soutěži? Co potřebuji vědět, než
          se zúčastním WCA soutěže?
        content:
          '1': >-
            Obecně není mnoho požadavků, které by měl člověk splnit, pokud se
            chce zúčastnit WCA soutěže. Nicméně se od všech účastníků očekává,
            že budou dobře znát <a
            href='https://www.worldcubeassociation.org/regulations/'>Pravidla
            WCA</a>. Pokud angličtina není váš rodný jazyk a máte problémy s
            porozuměním tomu dokumentu, podívejte se na <a
            href='https://www.worldcubeassociation.org/regulations/translations/'>Překlady</a>.
      '5':
        title: Jak můžu uspořádat soutěž ve svém městě?
        content:
          '1': >-
            Pokud chcete zorganizovat soutěž, doporučujeme se zúčastnit
            minimálně jedné či dvou soutěží jakožto soutěžící, abyste poté mohli
            čerpat z vlastních zkušeností.
          '2': >-
            Na WCA soutěži se musí dodržovat <a target='_blank'
            href='https://www.worldcubeassociation.org/regulations/'>Pravidla
            WCA</a>. Není nutné, aby je organizační tým znal nazpaměť, nicméně
            řádná znalost základů zajisté pomůže ke správné organizaci soutěže.
          '3': >-
            Poté musí organizační tým kontaktovat <a target='_blank'
            href='https://www.worldcubeassociation.org/delegates'>Delegáta
            WCA</a>. Dohled Delegáta WCA je nutný, aby WCA soutěž oficiálně
            uznala. Delegát WCA vám pomůže s tím, jak úspěšně uspořádat soutěž.
          '4': >-
            Navštivte <a target='_blank'
            href='https://documents.worldcubeassociation.org/edudoc/organizer-handbook/organizer-handbook.pdf'>WCA
            Competition Organizer Handbook</a> pro více informací.
      '6':
        title: K čemu jsou WCA účty? Jaký je rozdíl mezi WCA účtem a WCA 
          profilem?
        content:
          '1': >-
            WCA ID je vám přiřazeno, jakmile jsou zveřejněny výsledky z vaší
            první soutěže schválené WCA.
          '2': >-
            WCA účty vám umožní dokázat, kdo jste. Můžete přidat obrázek ke
            svému WCA profilu a také se registrovat na soutěže. Tak zabráníte
            ostatním, aby se za vás vydávali.
          '3': '%{current_user_status}'
      '7':
        title: Jak můžu změnit svůj profilový obrázek?
        content:
          '1': >-
            Nejprve si potřebujete <a
            href='#how-do-i-connect-my-wca-account-with-my-wca-id'>vytvořit WCA
            účet a propojit ho se svým WCA ID.</a>
          '2': >-
            Poté, co máte propojený WCA účet s WCA ID, jděte na <a
            href='%{profile_edit_path}'>upravit profilovou stránku</a>, abyste
            změnil(a) svůj profilový obrázek.
      '8':
        title: Jak propojím WCA účet s WCA ID?
        content:
          '1': '%{current_user_claim}'
      '9':
        title: >-
          Jsem zaregistrovaný/á na soutěž a chci se přihlásit na další event, co
          mám dělat? Můžu si přivést hosty?
        content:
          '1': >-
            Prosíme, kontaktujte organizátora. Kontaktní formulář naleznete na
            webových stránkách soutěže. Pokud si nejste jist(á), kde to najít,
            podívejte se na <a href='/competitions'>seznam soutěží</a>.
      results:
        title: Kdy se výsledky ze soutěže WCA nahrávají na webové stránky WCA?
        content:
          '1': >-
            Po skončení soutěže Delegát WCA dvakrát zkontroluje všechny score
            sheety a osobní údaje, aby předešel možným chybám. Jakmile je s tím
            hotov, výsledky jsou poslány WCA Result teamu (WRT), který je
            odpovědný za nahrávání výsledků ze soutěže a správu databáze WCA.
            WRT pak nahraje výsledky do databáze WCA co nejdříve.
          '2': >-
            Odvíjí se to od velikosti soutěže a od toho, kolik má Delegát
            volného času, může to trvat den, nebo až týden. Prosíme, buďte
            trpěliví.
          '3': >-
            Pokud máte propojený svůj WCA účet se svým WCA ID (viz. níže), <a
            href='%{preferences_edit_path}'>zde</a> můžete povolit upozornění
            e-mailem o odeslání vašich výsledků.
      regulations1:
        title: Můžu použít svůj puzzle na soutěži?
        content:
          '1': >-
            V <a
            href='https://www.worldcubeassociation.org/regulations/#3'>Článku
            3</a> naleznete pravidla týkající se puzzlů. Všechny puzzly musí být
            schváleny Delegátem WCA. Pokud si nejste jist(á), zeptejte se
            delegáta vaší soutěže. Pro jistotu si přineste náhradní puzzle v
            případě, že by vám nebylo dovoleno ten původní použít.
      regulations2:
        title: Můžu použít magnetický puzzle na oficiální WCA soutěži?
        content:
          '1': >-
            Můžete použít magnetické puzzly, jestliže vyhovují <a
            target='_blank'
            href='https://www.worldcubeassociation.org/regulations/'>Pravidlům
            WCA</a>. Prosíme, věnujte mimořádnou pozornost <a target='_blank'
            href='https://www.worldcubeassociation.org/regulations/'>Pravidlu
            3h</a>.
      regulations3:
        title: >-
          Ztratil(a) jsem center cap nebo dílek svého puzzlu. Můžu ho stále
          použít?
        content:
          '1': >-
            Takový puzzle použít nemůžete. Puzzly nesmí být poškozené nebo mít
            dílek, který se výrazně odlišuje od dílku stejného druhu (viz <a
            href='https://www.worldcubeassociation.org/regulations/#3j'>Pravidlo
            3j</a>).
      regulations4:
        title: 'Kolik mi musí být, abych se mohl(a) zaregistrovat na WCA soutěž?'
        content:
          '1': >-
            Není určena žádná věková hranice. Každopádně byste se měli prvně
            zeptat rodičů, než se zaregistrujete (viz <a
            href='https://www.worldcubeassociation.org/regulations/#2b'>Pravidlo
            2b</a>).
  about:
    title: O WCA
    mission_statement: >-
      Naší misí je mít více soutěží s více lidmi a s větší zábavou pod férovými
      a jednotnými podmínkami.
    mission_footer: Mise WCA
    who_we_are_title: Kdo jsme
    who_we_are_content_html: >-
      <p>World Cube Association řídí soutěže v mechanických hlavolamech, které
      se ovládají otáčením skupin dílků. Nejslavnější z nich je Rubikova kostka,
      kterou vynalezl profesor Rubik z Maďarska. Výběr z těchto hlavolamů tvoří
      oficiální eventy WCA</p><p>Jak se WCA vyvíjelo v posledních letech, více
      než 100 000 osob soutěžilo v našich soutěžích. Navzdory tomuto růstu
      zůstáváme organizací, která je postavena čistě na dobrovolnické práci, od
      lokálních organizátorů, přes delegáty, až po vedení WCA. Jsme velmi vděčni
      všem, kteří čas ze svých životů využívají pro fungování WCA. S větší
      finanční podporou doufáme v ještě větší profesionalitu našich soutěží
      zatímco pokračujeme v organizaci více akcí po celé planetě.</p>
    spirit: >-
      Duchem naší organizace je, aby se lidé z celého světa společně bavili v
      přátelské atmosféře, pomáhali si a chovali se slušně.
    spirit_footer: Duch WCA
    our_goals_title: Naše cíle
    our_goals_content_html: >-
      <p> World Cube Association chce přinést příležitosti pro členství v
      komunitě a vůdcovství mladým lidem po celém světě skrz zvyšující se
      dostupnost našich soutěží. Věříme, že zkušenosti na soutěžích a v komunitě
      tvoří příležitosti pro růst mladých lidích a že představení hlavolamových
      akcí novým skupinám lidí pomáhá posílit celou naší komunitu. Dokument,
      který obsahuje vize a strategii vedení pro WCA lze nalézt <a
      href="https://documents.worldcubeassociation.org/documents/WCA_Strategic_Plan.pdf">zde</a>.</p>
    whats_next_title: Co dalšího čeká WCA?
    whats_next_content_html: >-
      <p>World Cube Association má přes 100 000 různých soutěžících ze 140
      různých zemí a rozhodně neplánujeme zpomalovat! Speedcuberská komunita
      roste od našeho založení v roce 2004 a my to chceme podporovat i dále
      zvyšováním dostupnosti soutěží v nových oblastech. V budoucnu doufáme, že
      budeme moct komunitu podpořit ještě více skrz spolupráce a dosah k těm,
      kterým záleží na kostkách</p>
    world_championship_title: Mistrovství světa
    world_championship_content_html: >-
      Každé dva roky organizujeme soutěž, která určí světového šampiona. Tyto
      akce vyžadují od mnoha dobrovolníků extrémně opatrné plánování a jde také
      o velkou finanční zátěž.
    contributing_title: Přispět
    contributing_content_html: >-
      Můžete přispět pomocí platební karty a použitím Guidestaru %{here_credit},
      nebo přes PayPal %{here_paypal}. Pokud chcete napsat šek, pište sem:
    tax_deductible_note: Dotace lze odečíst z daní v USA.
    other_help_title: Další způsoby jak pomoci
    other_help_content_html: >-
      <p>Pokud si myslíte, že byste mohli WCA přispět jinak než finanční cestou,
      rádi od Vás uslyšíme! Prosíme, kontaktujte nás na <a
      href="mailto:communication@worldcubeassociation.org">communication@worldcubeassociation.org</a>.</p>
    donation_banner:
      content: >-
        World Cube Association je 501(c)(3) tax-exempt organizace. Jako
        organizace 100% postavená na dobrovolnické činnosti velmi uvítáme Vaše
        dotace. Pomohou nám plnit naši vizi zábavnějších soutěží po celém světě.
      donate_credit: Přispět platební kartou
      donate_paypal: Přispět přes PayPal
      donate_other: Další způsoby jak přispět
    structure:
      teams_committees_councils: 'WCA Týmy, Komise a Koncily'
      title: Struktura
      board:
        name: WCA Board of Directors
        description: >-
          World Cube Association je vedena WCA Boardem, který se skládá z
          následujících členů:
      committees: >-
        WCA týmy a komise jsou nezbytnou součástí organizace a starají se o
        každodenní úkoly, které jsou zapotřebí, aby správně fungovala. Tyto
        komise se skládají z členů WCA komunity, včetně WCA delegátů a
        soutěžících. Každý tým má vedoucího, jehož úkolem je zajišťovat správné
        fungování týmu a vést ostatní jeho členy. Koncily jsou speciální typ
        týmu, které mají poradní roli pro vedení WCA a jsou složeny z členů
        komunity, ne ze zaměstnanců. Pokud je otevřené místo v komisi, týmu,
        nebo koncilu, informace budou sdíleny na úvodní straně WCA webu.
      senior_member: Vyšší člen
      leader: Vedoucí
      officers:
        name: WCA úředníci
        description: >-
          Úředníci WCA se starají o úkoly související s non-profit statusem WCA.
          Tito úředníci jsou zvoleni vedením WCA. Výkonní ředitelé a Křeslo
          předsedají všem setkáním vedení, tajemník se stará o dokumenty
          organizace a pokladník řeší finanční záležitosti WCA.
      chair:
        name: WCA Chair
      executive_director:
        name: WCA Executive Director
      secretary:
        name: WCA Secretary
      vice_chair:
        name: WCA Vice-Chair
      treasurer:
        name: Pokladník WCA
      users:
        profile: 'Profil %{user_name}'
      wdc:
        name: WCA Disciplinary Committee
        description: >-
          Tato committee radí WCA Boardu ve zvláštních případech, jako například
          při údajném porušování Pravidel WCA a může být kontaktována členy WCA
          v případě důležitých osobních záležitostí týkajících se WCA soutěží.
      wdpc:
        name: WCA Data Protection Committee
        description: >-
          Tato committee je zodpovědná za všechny záležitosti týkající se Data
          Protection.
      wrc:
        name: WCA Regulations Committee
        description: Tato committee je odpovědná za správu Pravidel WCA.
      wrt:
        name: WCA Results Team
        description: Tento team je odpovědný za správu všech výsledků ze 
          soutěží.
      wst:
        name: WCA Software Team
        description: >-
          Tento team je odpovědný za správu softwaru WCA (webové stránky,
          workbooky, nástroje admina).
      wct:
        name: WCA Communication Team
        description: >-
          Role WCA Communication Teamu (WCT) spočívá v dohlížení a podporování
          komunikace WCA s komunitou a širokou veřejností. Komunikace WCA by
          měla přispívat k realizaci cílů WCA a podporovat obecně pozitivní
          kulturu přátelství, respektování, otevřenosti a odpovědnosti.
      wfc:
        name: WCA Financial Committee
        description: Tento tým se stará o finance WCA.
      wec:
        name: WCA Ethics Committee
        description: >-
          Tato committee má za úkol zajistit, aby všechny postupy, které používá
          WCA staff a externí staff, odpovídaly Etickému kodexu, a provádět
          nezávislé vyšetřování, pokud jednání některého z těchto členů není v
          souladu s uvedeným Etickým kodexem. Taková vyšetřování mohou být
          vyžádána všemi registrovanými Speedcubery, pro které je WEC
          důvěrníkem. Tato committee funguje také jako odvolací výbor, pokud
          někdo zúčastněný nesouhlasí s rozhodnutím WCA Disciplinary Committee.
      weat:
        name: Tým výkonných asistentů WCA
        description: Tento tým se stará o administrativní úkoly vedení WCA.
      wqac:
        name: WCA Quality Assurance Committee
        description: >-
          Tato committee má za úkol podporovat a prosazovat nepřetržité
          zlepšování kvality v rámci WCA, jakožto i celosvětové uplatňování
          norem kvality, které zajistí konzistentní vysokou kvalitu procesů, WCA
          staffu, regionálních organizací, organizátorů soutěží a staffu
          soutěží.
      wcat:
        name: WCA Competition Announcement Team
        description: >-
          Tento team má za úkol schvalovat a ohlašovat soutěže WCA a zajišťuje,
          aby tato ohlášení dodržovala standardy kvality WCA.
      wmt:
        name: WCA Marketing Team
        description: >-
          Tento team je odpovědný za rozvoj a spravování Značky WCA, vyhledává
          sponzory, podporuje distributory Soutěžních Zařízení WCA a prodej WCA
          Zboží.
      wac:
        name: Poradní koncil WCA
        description: >-
          Tento koncil je zodpovědný za budování a udržování bilaterální
          komunikace mezi zaměstnanci WCA a komunitou WCA.
      wsot:
        name: Tým sportovní organizace WCA
        description: >-
          Tento tým se stará o podporu uznání WCA jako mezinárodní sportovní
          organizace.
      wat:
        name: Archivní tým WCA
        description: >-
          Archivní tým WCA je poradní komise WCA. Jeho role je spravovat a
          rozvíjet archiv organizace.
      banned:
        name: Soutěžící se zákazem
      wct_china:
        name: WCT Čína
      operations_html: 'Každodenní aktivity WCA jsou obstarávány %{committees_and_teams}
        WCA.'
      teams_committees: Týmy a komise
      probation:
        name: Delegáti s podmínkou
      wst_admin:
        name: Software administrátoři
      delegates_html: >-
        <p><strong>WCA Delegát</strong> je role definovaná v WCA Motions a
        popsaná v WCA Regulations. Jeho hlavní povinností je dohled nad
        soutěžemi, kde zastupuje WCA. WCA Delegát je zodpovědný za to, že
        všechny soutěže dodržují misi, ducha, a pravidla WCA. WCA rozlišuje
        <strong>Senior delegáty</strong>, <strong>Regionální delegáty</strong>,
        <strong>Plné delegáty</strong>, <strong>Junior delegáty</strong> a
        <strong>Trainee delegáty</strong>%{see_link}.</p> <p>Kromě povinností
        WCA delegáta je Senior delegát nebo Regionální delegát zodpovědný za
        delegáty ve své oblasti a také může být kontaktován komunitou pro
        regionální záležitosti.</p> <p>Noví delegáti jsou nejdříve Junior
        delegáty; poté musí ukázat své schopnosti se správou WCA soutěží, než
        budou jmenováni WCA delegáty.</p> <p>Trainee delegáti jsou trénováni pro
        pozici WCA delegáta a mohou dohlížet jen na soutěž, kde je WCA
        delegát.</p>
      see_link_html: '(viz %{link})'
      members_html: >-
        Všichni soutěžící se automaticky stávají <strong>členy</strong> WCA na
        své první soutěži WCA.
