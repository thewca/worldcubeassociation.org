        equipment: >-
          Počet a typ timerů a displejů používaných na soutěži. Prosíme,
          odstraňte zařízení, která jste nepoužili.
        venue: >-
          Body výše jsou jen pro pomoc s celým reportem. Použijte je dle svého
          uvážení, nepoužité části smažte!
        organization: >-
          Body výše jsou jen pro pomoc s celým reportem. Použijte je dle svého
          uvážení, nepoužité části smažte!
        incidents: >-
          Prosíme nahlašte všechny incidenty, které jsou nestandartní. Očíslujte
