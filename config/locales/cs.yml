  contact:
    title: Kontakt
    info_alert_html: >-
      Před kontaktováním kteréhokoli týmu na této stránce se podívejte na
      %{link}!
    questions_and_comments_html: >-
      Pro otázky, komentáře a návrhy, týkající se webových stránek použijte
      tento <a href='/contact/website'>kontaktní formulář</a>. Pro jiné
      záležitosti týkající se určité oblasti nebo soutěže, prosíme, kontaktujte
      svého místního %{link}.
    committees_and_teams_html: <u>Committees a Teamy</u>
    members: Členi
    board:
      info_html: >-
        World Cube Association vede WCA Board. Členové Boardu jsou zodpovědní za
        všeobecné dotazy a za WCA organizaci jako celek.
    wct:
      info_html: >-
        WCT má na starost dohled a podporu komunikace WCA s komunitou a širokou
        veřejností. Měli byste je kontaktovat, pokud máte obecné otázky ohledně
        WCA a jejího vystupování na sociálních sítích.
    wdc:
      info_html: >-
        WDC zkoumá řadu situací a navrhuje řešení, včetně případných trestů.
        Mimo jiné by jednou z těchto situací mohlo být vážné porušení Pravidel
        WCA nebo záležitosti ohledně komunity. Pokud jste zažili nějakou z
        těchto situací, nebojte se obrátit na tuto committee.
    wdpc:
      info_html: >-
        WDPC má odpovědnost a povinnost zkoumat, vytvářet, implementovat,
        spravovat a vyžadovat všechny zásady WCA Data Protection, smlouvy s
        externími Data Processors WCA Dat a spravování úkonů souvisejících s
        Data Protection.
    wrc:
      info_html: >-
        WRC se zabývá všemi záležitostmi, které souvisejí s aplikací, zlepšením
        a vývojem Pravidel WCA. Podporují Delegáty WCA v jakýchkoli procesních
        záležitostech, k nimž dochází na soutěžích, a rozhodují o nevyřešených a
        neodkrytých incidentech. WRC pravidelně publikuje interní zprávy WCA,
        které pomáhají všem Delegátům WCA a zlepšují jejich znalost pravidel.
        Pokud byste se chtěli podílet na vývoji pravidel nebo navrhovat změny,
        můžete se obrátit na WRC tím, že je kontaktujete prostřednictvím e-mailu
        nebo diskusí na <a href='https://github.com/thewca/wca-regulations'>
        GitHub </a>.
    wrt:
      info_html: >-
        WRT je zodpovědný za správu všech dat v databázích WCA, nejdůležitější
        jsou výsledky soutěží a údaje o osobách. Nahrávají výsledky WCA soutěží
        na webové stránky WCA poté, co je pošle delegát dané soutěže. Vedle
        výsledků soutěže je WCA Results Team zodpovědný také za provedení
        korekcí výsledků soutěže v případě potřeby a jsou odpovědní za správu
        všech stránek WCA profilů. To zahrnuje například změnu uživatelských
        dat, jako jsou data narození, podle ověřených žádostí a správy žádostí o
        profilové obrázky.
    wst:
      info_html: >-
        WST je zodpovědný za údržbu a správu veškerého softwaru WCA. Vyvíjejí
        také nový software pro různé úkoly v rámci WCA, kdykoli to bude nutné.
        Máte-li návrhy a nápady pro další vývoj webových stránek nebo chcete-li
        ohlásit chyby a bugy, neváhejte a kontaktujte tento team! Webová stránka
        WCA je rozsáhlý open source projekt na <a
        href='https://github.com/thewca/worldcubeassociation.org'> GitHub </a>,
        takže pokud máte zájem pomáhat s vývojem pro WCA, mrkněte na to.
    wfc:
      info_html: >-
        WFC je zodpovědný za vše, co se týká financí v rámci WCA. Řídí finance a
        účetnictví WCA v souladu se schváleným ročním rozpočtem, což je také
        jejich pravidelná práce.
    wec:
      info_html: >-
        Tato komise má za úkol zajistit, aby všechny postupy, které používá WCA
        staff a externí staff, byly v souladu s Etickým kodexem.
    weat:
      info_html: Tento tým se stará o administrativní úkoly vedení WCA.
    wqac:
      info_html: >-
        Tato committee má za úkol podporovat a prosazovat nepřetržité zlepšování
        kvality v rámci WCA, stejně jako celosvětové uplatňování norem kvality,
        které zajistí konzistentní vysokou kvalitu procesů, WCA staffu,
        regionálních organizací, organizátorů soutěží a staffu na soutěžích.
    wcat:
      info_html: >-
        Tato komise má za úkol schvalovat a ohlašovat Soutěže WCA a zajistit, že
        tato ohlášení odpovídají standardům kvality WCA.
    wmt:
      info_html: >-
        Tato komise je odpovědná za rozvoj a správu WCA Značky, vyhledává
        sponzory, podporuje a distribuuje Soutěžní Zařízení WCA a prodává Zboží
        WCA.
    wsot:
      info_html: Tento tým se stará o uznání WCA jako mezinárodní sportovní 
        organizace.
    wat:
      info_html: >-
        WCA archivářský tým je poradní komise WCA. Tento tým dohlíží a podporuje
        rozvoj archivů WCA.
    councils_html: Koncily
    wac:
      info_html: >-
        Tento koncil je zodpovědný za budování a udržování bilaterální
        komunikace mezi komunitou a zaměstnanci WCA.
  score_tools:
    title: Softwarové nástroje pro WCA soutěže
    wca_icon_text: Vyvinuté a udržované WST
    intro:
      desc: >-
        Tato stránka je nevyčerpávající seznam nástrojů, které se používají pro
        pomoc s organizací WCA soutěží.
      disclaimer: >-
        Ne všechny nástroje na této straně jsou udržovány WST: to je úplně v
        pořádku! Nemáme dostatek lidí na udržování veškerého softwaru, který má
        něco společného s WCA :)
      used: >-
        Všechny programy na tomto seznamy byly použity při skutečných soutěžích
        a jsou integrované s WCA webem: nechají vás přihlásit se s Vaším WCA
        účtem abyste byli schopni importovat (někdy i aktualizovat) data k Vašim
        nadcházejícím soutěžím. U každého z nich je napsaný správce.
    before:
      title: Před soutěží
      desc: >-
        Správa registrací a soutěžících může být prováděna přímo na webu WCA.
        Protože správa skupin a rolí manuálně může být časově náročná, měli
        byste zvážit použití jednoho z nástrojů níže.
    during:
      title: Při soutěži
      desc: >-
        Tady najdete nástroje, které Vás nechají spravovat výsledky soutěže
        zatímco probíhá.
    after:
      title: Po soutěži
      desc: >-
        I když kontrola výsledků je prováděna tady na webu, budete muset použít
        nějaký nástroj na přidělení scramblů z TNoodle ke skutečným výsledkům
        nahraným na web.
    tools:
      age:
        title: AGE
        description: Nástroj na generování a upravování skupin/rolí pro WCA 
          soutěže.
      certificates:
        title: Certifiláty
        description: Vytisknout certifikáty pro WCA soutěže pomocí WCA Live
      groupifier:
        title: Groupifier
        description: >-
          Nástroj na správu skupin/rolí pro organizátory WCA soutěží. Mezi
          hlavní rysy patří: řazení soutěžících dle výsledků, přiřazování rolí
          (judgování, scramblování), pomoc s počtem potřebných scramblů,
          generování scorecardů, osobních přehledů a shrnutí... Pro další
          informace se podívejte na web.
      scorecards:
        title: Scorecardy
        description: Vytisknout scorecardy pro WCA soutěže pomocí WCA Live
      tnoodle:
        title: TNoodle (Scrambly)
        description: >-
          TNoodle je oficiální scramblovací program, který se používá pro WCA
          soutěže. Typicky ho využívají delegáti WCA před soutěží, ale jeho UI
          dovoluje komukoliv generovat jakékoliv scrambly chce pro všechny WCA
          eventy.
      live:
        title: WCA Live
        description: >-
          Platforma na organizaci WCA soutěží a sdílení živých výsledků se
          světem.
      nightmare:
        title: Tabulka na výsledky
        description: >-
          Může se stát cokoliv... Pokud nemáte přístup k internetu, budete muset
          použít starou dobrou tabulku.
      matcher:
        title: Scrambles Matcher
        description: >-
          Může být použit k přiřazení scramblů z TNoodle k výsledkům. Importujte
          výsledky z WCA webu (pokud používáte WCA Live), tabulky nebo
          samostatného WCIF souboru. Importujte scrambly z jednoho nebo více
          TNoodle json souborů. Exportuje výsledky do správného formátu k
          odevzdání WCA.
      groups:
        title: Soutěžní skupiny
        description: Zobrazit soutěžní skupiny jakékoliv probíhající soutěže
  logo:
    title: Logo WCA
    paragraphs:
      '1': >-
        Logo WCA navrhnul Justin Eastman v rámci designové soutěže v roce
        2005.<br />Toto logo nás zaujalo díky svému designu, barvám a také
        proto, že nezobrazuje přímo 3x3x3 kostku.
      '2': >-
        Máme 4 různé verze loga: a <a href="/files/WCAlogo_XL.jpg">velkou</a>
        (46 KB, 1756 px by 1068 px), <a
        href="/files/WCAlogo.svg">vektorovou</a>, a <a
        href="/files/WCAlogo_notext.svg">vektorovou bez textu</a> a <a
        href="/files/WCAlogo_monochrome.svg">vektorovou černobílou</a>.
      '3': >-
        3D verzi loga WCA navrhnul Vu Minh Tan z Vietnamu: <a
        href="/files/WCALogo3D.png">PNG verze</a> (2.1 MB), <a
        href="/files/WCALogo3Dsmall.png">malá PNG verze</a> (0.25 MB).
      '4': >-
        Přijatelné použití loga WCA je vymezeno ve WCA Logo Usage policy
        dostupném na <a href="/documents">stránce s WCA Dokumenty</a>.
  search_results:
    index:
      competitions: Soutěže
      people: Lidé
      advanced_search: Pokročilé vyhledávání
      incidents: Incidenty
      posts: Příspěvky
      regulations_and_guidelines: Pravidla a Pokyny
      search_for: 'Vyhledávání pro <b>%{search_string}</b>'
      not_found:
        generic: Žádné výsledky nenalezeny
        competitions: Nebyly nalezeny žádné soutěže pro
