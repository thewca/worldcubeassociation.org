    content: WCA uznává následující regionální organizace
    empty: WCA v současné době neuznává žádné regionální organizace.
    how_to:
      title: Jak se stát WCA uznávanou regionální organizací.
      description: >-
        WCA uznává různé regionální organizace po celém světě. Účelem regionální
        organizace je organizování soutěží a podpora aktivit WCA v jejím
        regionu. Země, které chtějí založit regionální organizaci mohou přispět
        WCA ve své oblasti organizací soutěží i před odesláním žádosti. Pokud
        chcete pomoci s organizací WCA soutěže ve své oblasti, prosíme
        kontaktujte nejbližšího WCA delegáta.
    requirements:
      title: Požadavky pro regionální organizace WCA
      list:
        '1': >-
          Aktivně organizovat nebo podporovat WCA soutěže v daném regionu
          organizace.
        '2': >-
          Přispět k organizaci WCA kontinentálních mistrovství na daném
          kontinentu, pokud to organizační tým vyžaduje
        '3': >-
          Respektovat a aplikovat body vymezené ve vyhláškách WCA a dalších
          dokumentech.
        '4': Dodržovat všechna platná Pravidla WCA
        '5': Souhlasit a dodržovat rozhodnutí WCA zaměstnanců.
        '6': >-
          Dát WCA k dispozici své aktuální vyhlášky, případně i pravidla v
          elektronickém formátu
