        posts: Geen berichten gevonden voor
        regulations_and_guidelines: Geen wedstrijdreglement of richtlijnen 
          gevonden voor
  incidents_log:
    i18n_disclaimer: >-
      Let op dat de sectie voor incidenten alleen in het Engels beschikbaar is,
      onderstaande content wordt niet vertaald.
  about_regulations:
    title: Over het Wedstrijdreglement
    panel1:
      title: Wedstrijdreglement
      content1_html: >-
        Alle wedstrijden moeten het <a
        href="/regulations/'">WCA-wedstrijdreglement</a> volgen. Het is
        belangrijk voor de deelnemers om het reglement te lezen voor het meedoen
        aan hun eerste wedstrijd.
      content2_html: >-
        Het WCA-wedstrijdreglement is aangevuld met de <a
        href="/regulations/guidelines.html">WCA Richtlijnen</a>, die aanvullende
        verduidelijkingen en toelichtingen bevatten.
      content3_html: >-
        Belangrijke beslissingen over incidenten die zich hebben voorgedaan
        tijdens wedstrijden die zijn opgelost door de WCA-reglementencommissie
        zijn te vinden in het <a href="/incidents">Incidents-logboek</a>.
    panel2:
      title: Vertalingen
      content1_html: >-
        Het WCA-wedstrijdreglement is niet alleen in het Engels beschikbaar,
        maar leden van de WCA hebben deze in verschillende talen vertaald: <a
        href="/regulations/translations/">Vertalingen</a>.
      content2_html: >-
        <strong>Belangrijk</strong>: Hoewel de vertalingen erg nuttig zijn, zijn
        ze niet officieel, de Engelse versie van het WCA-wedstrijdreglement is
        bindend.
    panel3:
      title: Wedstrijdreglement FAQ
      content1_html: >-
        De <a href="/faq">FAQ</a> geeft antwoord op veelgestelde vragen over het
        WCA-wedstrijdreglement.
    panel4:
      title: Organisatorrichtlijnen
      content1_html: >-
        Als je geïnteresseerd bent in het organiseren van een wedstrijd of al
        een wedstrijd aan het plannen bent, lees dan onze <a
        href="https://documents.worldcubeassociation.org/edudoc/organizer-handbook/organizer-handbook.pdf">Organisatorrichtlijnen</a>.
      content2_html: >-
        Dit document bevat belangrijke informatie en moet worden gelezen door
        elke wedstrijdorganisator.
  regulations_translations:
    title: 'WCA Reglementen en Richtlijnen: Vertalingen'
    paragraph1: >-
      Als je een andere taal spreekt dan Engels, vind je wellicht deze
      vertalingen handig.
    paragraph2: >-
      Let op dat de vertalingen geen officiële status hebben, hoewel ze op de
      WCA-website beschikbaar worden gesteld: ze komen zonder garanties. Als er
      een verschil is tussen een vertaling en de (huidige officiële)
      Engelstalige versie, moet de Engelstalige versie worden gebruikt.
    translations: Vertalingen
    current: Huidig
    old: Oud
    table_elements:
      version: Versie
      language: Taal
    translating: Het vertalen van Reglementen
    paragraph3_html: >-
      Als je geïnteresseerd bent in het toevoegen/bijwerken van een vertaling,
      kijk dan naar de <a
      href="https://github.com/thewca/wca-regulations-translations#translation-instructions">instructies
      op de GitHub repository voor vertalingen</a>.
  media:
    common:
      view_media_page: Media bekijken
      confirm_delete: Weet je zeker dat je deze media wilt verwijderen?
    new:
      title: Media insturen
      review_warning_html: >-
        Alle media worden gereviewd voordat ze worden getoond op de <a
        href="/media">Media pagina</a>.
      guidelines: Richtlijnen
      media_guidelines:
        '1': Alle media moeten gerelateerd zijn aan de gekozen wedstrijd.
        '2': >-
          Alle media moeten waardig en schoon zijn en mogen geen ongepast of
          bedreigend materiaal bevatten.
        '3': >-
          De media mogen geen uitgebreide aanwezigheid hebben van sponsoren of
          reclames.
        '4': Alle media moeten gepaste en beschrijvende titels hebben.
    edit:
      title: Media bewerken
      validate_media_page: Openstaande media bekijken
    index:
      title: Media
      validate_media: Media beoordelen
      submit_media_html: Je kunt media <a href="/media/new">hier</a> insturen.
    validate:
      title: Media beoordelen
    media_table:
      year: Jaar
      location: 'Land, stad'
      accept: Accepteren
      confirm_accept: Weet je zeker dat je deze Media wilt accepteren?
      edit: Bewerken
  media_and_instagram:
    page_title: Media en Instagram insturen
    general_media_submission:
      title: Algemene media insturen
      body_html: >-
        De WCA deelt artikelen en afbeeldingen van wedstrijden die door de
        community worden aangeboden op onze <a href="/media">mediapagina</a>.
        Als u iets hebt wat u wilt delen, vul dan ons <a
        href="/media/new">algemene formulier voor het indienen van media</a> in!
    instagram_submission:
      title: Instagram insturen
      paragraph1_html: >-
        Zoals je misschien hebt gezien, heeft de WCA een <a
        href="https://www.instagram.com/thewcaofficial/">actieve Instagram</a>!
        Om de wereldwijde kubusgemeenschap het best weer te geven, plaatsen we
        inhoud die door kubussers van over de hele wereld aan ons is ingestuurd.
      paragraph2: >-
        Als je foto's of video's van hoge kwaliteit heeft die je door ons wilt
        laten plaatsen, klik dan op onderstaande knop en vul het formulier in!
        Om je inhoud te kunnen plaatsen, moet je eigenaar zijn en de WCA
        toestemming geven om deze te plaatsen. Vanwege het grote aantal
        inzendingen dat we ontvangen, kunnen we niet alles posten, maar hier
        zijn enkele tips om uw inhoud te plaatsen:
      photo_quality: >-
        Zorg ervoor dat de foto- / videokwaliteit goed is. Het hoeft niet
        professioneel te zijn opgenomen, maar de kwaliteit mag geen afbreuk doen
        aan de foto of video.
      photo_interest: >-
        Probeer de inhoud interessant te maken voor een breed publiek. Inhoud
        die alleen voor een paar mensen interessant is, hoort hier niet thuis.
      wca_related: >-
        Plaats foto's en video's die te maken hebben met de WCA, want daar
        draait het allemaal om in onze account! We zien graag kubussers plezier
        hebben!
      submit_instagram_content: Instagram content insturen
    instagram_hosting:
      title: Instagram hosting
      paragraph1_html: >-
        Soms laten we communityleden het officiële WCA Instagram-verhaal hosten
        met een wedstrijd waaraan ze deelnemen! Als je interesse hebt, klik dan
        op de knop en vul het onderstaande formulier in. Het
        WCA-communicatieteam neemt contact met je op nadat alle informatie is
        verzonden als je bent goedgekeurd voor hosting. Als je vragen hebt, neem
        dan <a
        href="https://www.worldcubeassociation.org/contact/website">contact met
        ons op</a>.
      paragraph2: >-
        Ons doel is om een enigszins persoonlijke kant te delen van elke
        kubussers en van elke wedstrijd. Dit wordt niet verondersteld een enorme
        last te zijn tijdens het weekend en we willen natuurlijk dat je eerst
        van de wedstrijd geniet en deze vervolgens kunt delen.
      paragraph3: 'De rol van een host van als volgt worden samengevat:'
      short_intro: 'Maak een korte introductie, vertel over jezelf en de wedstrijd'
      venue_feel: >-
        Maak enkele clips om een idee te krijgen van de locatie en de mensen,
        dit kan slechts een shot zijn van de wedstrijdruimte en de
        wedstrijdtafels
      people_solving: >-
        Probeer een aantal shots te maken van mensen die oplossen (bij voorkeur
        snelle mensen bij hun belangrijkste evenementen)
      mini_interviews: >-
        Je zou kunnen proberen mini-interviews te krijgen met mensen
        (organisatoren, afgevaardigden, enz ...) die zeggen wat ze vinden van de
        wedstrijd
      pictures_too: 'Je kunt ook foto''s insturen, het hoeven niet alleen video''s
        te zijn'
      paragraph4: >-
        Onze communicatie gedurende het weekend verloopt meestal via een
