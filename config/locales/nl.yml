  regional_organizations:
    title: Regionale Organisaties
    content: 'De WCA erkent de volgende regionale organisaties:'
    empty: Er zijn momenteel geen Regionale Organisaties erkend door de WCA.
    how_to:
      title: Hoe een erkende WCA Regionale Organisatie worden
      description: >-
        De WCA erkent verschillende regionale organisaties wereldwijd. Het doel
        van een WCA regionale organisatie is het organiseren van WCA-wedstrijden
        en het ondersteunen van de WCA-activiteiten in de regio. Landen die
        regionale organisatie willen vormen, worden aangemoedigd om bij te
        dragen aan de WCA in hun regio, voor het insturen van een aanvraag. Voor
        vragen om hulp bij het organiseren van een WCA-wedstrijd in jouw regio
        kun je contact opnemen met de dichtstbijzijnde delegate.
    requirements:
      title: Eisen aan WCA Regionale Organisaties
      list:
        '1': >-
          Actief organiseren en ondersteunen van WCA-wedstrijden in de regio van
          de organisatie
        '2': >-
          Bijdragen aan de continentale WCA-wedstrijd in het continent van de
          regionale organisatie, als dit wordt verwacht door het betreffende
          organisatieteam
        '3': >-
          Respecteren en operationaliseren van de Doelstellingen in de Statuten
          en Moties
        '4': Voldoen aan van toepassing zijnd WCA-wedstrijdreglement
        '5': Accepteren en voldoen aan beslissingen van WCA-stafleden
        '6': >-
          Deponeren bij de WCA van een kopie van haar actuele Statuten, en
          indien van toepassing de reglementen in elektronische vorm
    application_instructions:
      title: Aanmeldinstructies
      description_html: >-
        Vul om in aanmerking te komen voor erkenning <a
        href='/regional-organizations/new>dit formulier</a> in.
    regional_organization_form:
      filling_instructions_html: Vul alles in <b>in Engels!</b>
      public_information: Publieke informatie
      private_information: Besloten informatie
      private_information_disclaimer: Alle informatie hieronder is alleen 
        zichtbaar voor het WCA-Bestuur
    errors:
      end_date_after_start_date: kan niet zijn na "Erkend tot en met"
    create:
      create_success: >-
        Aanmelding succesvol ingestuurd! Controleer je e-mail en wacht op de
        review door het WCA-Bestuur.
    delete:
      confirm_delete: >-
        Weet je zeker dat je het verzoek voor deze Regionale Organisatie wilt
        verwijderen?
  contact:
    title: Contactinformatie
    info_alert_html: >-
      Bekijk eerst deze %{link}, voordat je contact opneemt met een team op deze
      pagina!
    questions_and_comments_html: >-
      Voor vragen, opmerkingen en suggesties over de WCA-website, gebruik dit <a
      href='/contact/website'>contactformulier</a>. Voor vragen over een
      specifieke regio of wedstrijd neem je contact op met je lokale %{link}.
    committees_and_teams_html: <u>Commissies en Teams</u>
    members: Leden
    board:
      info_html: >-
        De World Cube Association wordt geleid door de WCA Board. Ze zijn
        verantwoordelijk voor algemene vragen en de WCA-organisatie als geheel.
    wct:
      info_html: >-
        De WCT heeft de leiding over de communicatie van de WCA met de community
        en het algemene publiek. Zij kunnen worden benaderd als je algemene
        vragen hebt over de WCA of haar aanwezigheid op de sociale media.
    wdc:
      info_html: >-
        De WDC onderzoekt een breed scala aan zaken en stelt oplossingen voor,
        inclusief disciplinaire maatregelen indien nodig. Dit kan o.a. bij
        serieuze schending van het WCA-wedstrijdreglement of zaken in de
        community. Als je zoiets hebt meegemaakt, neem dan gerust met deze
        commissie contact op.
    wdpc:
      info_html: >-
        De WDPC heeft de verantwoordelijkheid en taak voor het onderzoeken,
        creëren, implementeren, managen, en afdwingen van alle punten van het
        beleid voor WCA Data Protection, contracten met externe Data Processors
        van WCA-data, en het managen van de taken in relatie tot Data
        Protection.
    wrc:
      info_html: >-
        De WRC handelt alle incidenten af die te maken hebben met het toepassen,
        verbeteren en ontwikkelen van het WCA-wedstrijdreglement. Zij
        ondersteunen WCA-delegates bij alle soort incidenten bij wedstrijden en
        besluiten over de oplossingen. De WRC publiceert regelmatig interne
        rapportages om alle WCA-delegates te helpen en hun kennis van het
        WCA-wedstrijdreglement te verbeteren. Als je wilt zijn betrokken bij het
        ontwikkelen van regels of veranderingen wilt voorstellen kun je contact
        opnemen met WRC via mail of op <a
        href='https://github.com/thewca/wca-regulations'>GitHub</a>.
    wrt:
      info_html: >-
        De WRT is verantwoordelijk voor het beheren van de data in de databases
        van de WCA, als belangrijkste de wedstrijdresultaten en de persoonlijke
        gegevens. Zij laden de resultaten van de WCA-wedstrijden op de
        WCA-website, zodra de Delegate van de wedstrijd deze resultaten heeft
        ingestuurd. Behalve het laden van resultaten is het WCA Resultatenteam
        ook verantwoordelijk voor het afhandelen van correcties indien nodig en
        beheren ze de profielpagina's. Hieronder vallen o.a. het veranderen van
        gegevens zoals geboortedata, op basis van geverifieerde verzoeken, en
        het beheren van de profielfoto's.
    wst:
      info_html: >-
        De WST is verantwoordelijk voor het onderhoud en het beheer van alle
        software van de WCA. Ze ontwikkelen ook nieuwe software voor
        verschillende taken binnen de WCA. Als je suggesties of ideeën hebt voor
        verdere ontwikkeling van de website of als je fouten of bugs wilt
        doorgeven, neem dan gerust contact met ze op! De WCA-website is een
        groot open-sourceproject op <a
        href='https://github.com/thewca/worldcubeassociation.org'>GitHub</a>,
        dus als je geïnteresseerd bent om te helpen met de ontwikkeling, neem
        dan daar een kijkje.
    wfc:
      info_html: >-
        De WFC is verantwoordelijk voor alle financiële zaken binnen de WCA. Ze
        beheren de financiën en de rekeningen van de WCA, in lijn met een
        goedgekeurd voorstel voor het jaarbudget, wat ook hun werk is om
        regelmatig op te leveren.
    wec:
      info_html: >-
        Deze commisse heeft de rol om te zorgen dat alle procedures die worden
        gevolgd door WCA Staff en Externe Staff voldoende aan de Code of Ethics.
    weat:
      info_html: >-
        Dit team is verantwoordelijk voor het uitvoeren van de administratieve
        werkzaamheden van het WCA-Bestuur.
    wqac:
      info_html: >-
        Deze commissie heeft de rol om continue kwaliteitsverbetering te
        ondersteunen en bevorderen binnen de WCA, en wereldwijde toepassing van
        kwaliteitsstandaard om constante hoge kwaliteit te garanderen voor
        processen, WCA Staff, regionale organisaties, wedstrijdorganisatoren en
        wedstrijdstaff.
    wcat:
      info_html: >-
        Deze commissie heeft de rol om WCA-wedstrijden goed te keuren en aan te
        kondigen, en te zorgen dat zulke aankondigingen voldoen aan de
        WCA-kwaliteitsstandaarden.
    wmt:
      info_html: >-
        Dit team is verantwoordelijk voor het ontwikkelen en managen van het WCA
        Brand, het zoeken van sponsoren, het ondersteunen van de distributie van
        WCA wedstrijdmaterialen en het marketen van WCA merchandise.
    councils_html: Adviesraden
    wac:
      info_html: >-
        Deze adviesraad is verantwoordelijk voor het opbouwen en onderhouden van
        bilaterale communicatie tussen de WCA-community en de WCA-staf.
  score_tools:
    title: Softwaretools voor WCA-wedstrijden
    wca_icon_text: Ontwikkeld en onderhouden door de WST
    intro:
      desc: >-
        Deze pagina is een niet-uitputtende lijst van tools waarvan bekend is
        dat ze worden gebruikt om te helpen bij de organisatie van
        WCA-wedstrijden.
      disclaimer: >-
        Niet alle tools op die pagina worden onderhouden door de WST: dat is
        zeker goed! We hebben niet de mankracht om alle WCA-gerelateerde
        software te beheren :)
      used: >-
        Alle programma's op deze lijst zijn gebruikt tijdens echte
        WCA-competities en zijn geïntegreerd met de WCA-website: ze laten je
        inloggen met je WCA-account om je aankomende competitiegegevens te
        kunnen importeren (en soms bijwerken). Voor elk van hen zullen de
        beheerder(s) duidelijk worden beschreven.
    before:
      title: Voor de wedstrijd
      desc: >-
        Het beheren van deelnemersregistraties kan direct op de WCA-website
        worden gedaan. Aangezien het handmatig beheren van groepen en personeel
        tijdrovend kan zijn, kunt u overwegen een van de onderstaande tools te
        gebruiken.
    during:
      title: Tijdens de wedstrijd
      desc: >-
        Je vindt hier tools waarmee je de resultaten van de wedstrijd kunt
        beheren terwijl deze aan de gang is.
    after:
      title: Na de wedstrijd
      desc: >-
        Hoewel de validatie van de resultaten op de website plaatsvindt, moet je
        een tool gebruiken om door TNoodle gegenereerde scrambles toe te wijzen
        aan de daadwerkelijke resultaten die naar de WCA-website zijn verzonden.
    tools:
      age:
        title: Leeftijd
        description: >-
          Tool voor het genereren en bewerken van groepen/taaktoewijzingen voor
          WCA-wedstrijden
      certificates:
        title: Certificaten
        description: Print certificaten voor WCA-wedstrijden met WCA Live
      groupifier:
        title: Groupifier
        description: >-
          Tool voor taak- en groepsbeheer voor organisatoren van
          WCA-wedstrijden. Tot de belangrijkste kenmerken behoren: het sorteren
          van deelnemers op ranking, het toewijzen van taken (jureren,
          scrambling), beslissen hoeveel scrambles nodig zijn, het genereren van
          scorebladen, persoonlijke bladen en samenvattingen... Bekijk de
          website voor meer informatie.
      scorecards:
        title: Wedstrijdbriefjes
        description: Print wedstrijdbriefjes voor WCA-wedstrijden met WCA Live
      tnoodle:
        title: TNoodle (Scrambles)
        description: >-
          TNoodle is het officiële scramble-programma dat wordt gebruikt voor
          WCA-wedstrijden. Het wordt meestal gebruikt door WCA-afgevaardigden
          voorafgaand aan WCA-wedstrijden, maar dankzij de gebruikersinterface
          kan iedereen allerlei soorten scrambles genereren voor alle
          WCA-wedstrijdonderdelen.

          Vertaling
      live:
        title: WCA Live
        description: >-
          Platform voor het houden van WCA-wedstrijden en het delen van live
          resultaten met de wereld.
      nightmare:
        title: Resultatenwerkblad
        description: >-
          Soms gebeuren er dingen... Als je geen netwerktoegang hebt, moet je de
          good old spreadsheet gebruiken.
      matcher:
        title: Scrambles Matcher
        description: >-
          Kan worden gebruikt om door TNoodle gegenereerde scrambles toe te
          wijzen aan resultaten. Importeer resultaten van de WCA-website (bij
          gebruik van WCA Live), een spreadsheet of een zelfstandig
          WCIF-bestand. Importeer scrambles uit een of meer TNoodle
          json-bestand(en). Exporteer resultaten naar het juiste formaat voor
          insturen van resultaten naar WCA.
  logo:
    title: WCA-logo
    paragraphs:
      '1': >-
        Het WCA-logo is ontworpen door Justin Eastman in een ontwerpwedstrijd in
        januari 2005.<br />We vonden het logo goed vanwege het ontwerp, de
        kleuren en het feit dat het niet specifiek een 3x3x3 Kubus uitbeeldt.
      '2': >-
        We hebben drie verschillende versies van het logo: <a
        href="/files/WCAlogo_XL.jpg">grote versie</a> (46 KB, 1756 px bij 1068
        px), <a href="/files/WCAlogo.svg">vectorversie</a> en <a
        href="/files/WCAlogo_notext.svg">vectorversie zonder tekst</a> en een <a
        href="/files/WCAlogo_monochrome.svg">monochrome vector-versie</a>.
      '3': >-
        3D-versie van het logo, ontworpen door Vu Minh Tan uit Vietnam: <a
        href="/files/WCALogo3D.png">PNG-versie</a> (2.1 MB), <a
        href="/files/WCALogo3Dsmall.png">kleine PNG-versie</a> (0.25 MB).
      '4': >-
        Alle WCA-wedstrijdorganisatoren mogen het WCA-logo gebruiken voor
        websites, kleding, kado's of decoraties, uitsluitend voor officiële
        WCA-wedstrijden.<br /> Voor alle andere personen en doeleinden is
        toestemming nodig van <a
        href="mailto:board@worldcubeassociation.org">WCA Board</a> om het logo
        the gebruiken.
  search_results:
    index:
      competitions: Wedstrijden
      people: Mensen
      advanced_search: Geavanceerd zoeken
      posts: Berichten
      regulations_and_guidelines: Wedstrijdreglement en richtlijnen
      search_for: 'Zoek naar <b>%{search_string}</b>'
      not_found:
        generic: Geen resultaten gevonden
