          compleet rapport. Gebruik ze naar eigen inzicht voor wat je nodig
          acht. Verwijder ongebruikte onderdelen!
        organization: >-
          De hierboven genoemde punten zijn slechts een richtlijn voor een
          compleet rapport. Gebruik ze naar eigen inzicht voor wat je nodig
          acht. Verwijder ongebruikte onderdelen!
        incidents: >-
          Meld alle incidenten die niet-standaardgevallen zijn. Nummer de
          incidenten vanaf 1, zodat andere delegates commentaar kunnen geven
          door naar hun nummers te verwijzen. Ook al leek alles generiek, noteer
          in ieder geval de meest opmerkelijke gevallen. Vink de juiste vakjes
          hieronder aan als je actief op zoek bent naar feedback.
        wrc_incidents: Lijst van incidentnummers waarvoor je feedback wilt van 
