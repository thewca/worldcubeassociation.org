        remarks: >-
          Enkele aanvullende informatie die je wilt doorgeven aan de WCAT. Als
          er bijvoorbeeld iets is waarover je niet zeker bent, of als er
          speciale verzoeken zijn voor de WCAT. Vul dit alstublieft in het
          Engels in!
        external_registration_page: >-
          De pagina waar deelnemers zich moeten aanmelden voor de wedstrijd.
          Moet een valide http-link zijn.
        base_entry_fee_lowest_denomination: >-
          Het basisbedrag voor aanmelding voor de wedstrijd. Het bedrag wordt
          getoond op de wedstrijdinformatiepagina en aanmeldingspagina. Als het
          bedrag 0 is, wordt een tekst getoond dat aanmelding gratis is.
        currency_code: Valutacode van de deelnamekosten.
        competitor_limit_enabled: >-
          Hoewel het niet vereist is in het wedstrijdreglement om een
          deelnemerslimiet op te geven, wordt dit wel sterk aanbevolen.
        competitor_limit: >-
          Het aantal deelnemers dat wordt geaccepteerd voor deze wedstrijd.
          Voorlopig is dit aantal alleen ter informatie, en voorkomt het niet
          dat meer mensen zich aanmelden. We werken aan expliciete ondersteuning
          voor het registratieproces, maar dit vraagt nog wat werk.
        competitor_limit_reason: >-
          Wat is de reden voor het maximumaantal deelnemers? Graag in het
          Engels!
        extra_registration_requirements: >-
          Geef hier alle extra aanmeldingseisen aan die niet boven zijn genoemd,
          zoals aanwijzingen over hoe te betalen.</br>Geef de tekst <b>in
          Engels</b> en andere talen die de deelnemers spreken; de tekst wordt
          getoond op de informatiepagina van de wedstrijd, en op de
          aanmeldpagina als je de aanmelding via de WCA-website doet.
        on_the_spot_entry_fee_lowest_denomination: >-
          Als dit bedrag 0 is, dan wordt een zin getoond dat aanmelding bij
          binnenkomst gratis is.
        refund_policy_percent: >-
          Dit getal is slechts ter informatie, teruggaves moeten handmatig
          worden uitgevoerd. Als het bedrag 0 is, dan wordt een zin dat
          aanmeldkosten onder geen enkele omstandigheid worden teruggegeven.
        refund_policy_limit_date: Datum waarna aanmeldkosten niet meer 
          teruggegeven worden.
        waiting_list_deadline_date: >-
          De datum waarop aangemelde personen op de wachtlijst niet meer worden
          geaccepteerd. Als je een deadline hebt voor refunds, moet de datum
          voor wachtlijst niet voor de deadline voor refunds liggen.
        event_change_deadline_date: >-
          Geregistreerde deelnemers hebben het recht om hun geregistreerde
          wedstrijdonderdelen aan te passen tot dit moment, door contact op te
          nemen met het organisatieteam. De deal moet niet zijn voor de
          registratie is gesloten. Als het veld leeg is mogen deelnemers
          wedstrijdonderdelen toevoegen tot de dag van de wedstrijd. Als
          registratie op de dag van de wedstrijd mogelijk is, moet dit dezelfde
          dag zijn als de wedstrijd.
        guests_entry_fee_lowest_denomination: >-
          Dit getal is vooralsnog ter informatie, de toegangsprijs voor gasten
          kun je niet via deze website regelen. Als het bedrag 0 is, dan wordt
          een zin naar keuze getoond over het beleid rond gasten.
        early_puzzle_submission_reason: >-
          Leg uit waarom je deelnemers hun puzzels vroegtijdig wilt laten
          inleveren. In het Engels!
        qualification_results_reason: >-
          Leg uit waarom je kwalificatietijden wil gebruiken. Invullen in
          Engels!
        event_restrictions_reason: >-
          Leg uit waarom je bepaalde combinaties van wedstrijdonderdelen wilt
          uitsluiten. Invullen in Engels!
        main_event_id: De winnaar van dit wedstrijdonderdeel zal de winnaar zijn
          de wedstrijd
