        private_description: >-
          Una descrizione dell'incidente che può essere vista solo dai Delegati.
          Da scrivere in inglese.
        private_wrc_decision: >-
          La decisione finale del WRC, inclusi dettagli privati. Da scrivere in
          inglese.
        public_summary: >-
          Una descrizione generale dell'incidente e della decisione, da mostrare
          pubblicamente. Da scrivere in inglese.
      user:
        dob: Inserisci la data di nascita del partecipante nel formato 
          AAAA-MM-GG
        name: >-
          Inserisci il nome e cognome completo del partecipante, per esempio
          <strong>Lorenzo Vigani Poli</strong>. Non inserire abbreviazioni come
          <strong> l vigani</strong>.<br/>I secondi nomi (sia completi o anche
          solo le iniziali) sono opzionali.
        pending_avatar: >-
          Dopo aver caricato il nuovo avatar, dovrai aspettare che il WCA
          Results Team lo approvi.
        registration_notifications_enabled: >-
          Si applica soltanto a competizioni che organizzi o deleghi, e può
          essere sovrascritta gara per gara.
        receive_developer_mails: >-
          Questo è limitato alle notifiche relative a cambiamenti di versione
          significativi di risorse quali esportazioni di dati, schema WCIF e API
          pubbliche. Consigliato agli sviluppatori che gestiscono software
          basati su questi strumenti.
        receive_delegate_reports: >-
          Se sei un Delegato Senior, o un membro del WRC o del WQAC, riceverai
          di default i Report dei Delegati. Nota: la modifica potrebbe
          richiedere fino a 12 ore per avere effetto.
        delegate_reports_region: >-
          Se desideri ricevere tutti i report, lascia vuoto questo campo
          (l'opzione più in alto nel menù a tendina). Nota: questa modifica può
          richiedere fino a 12 ore per avere effetto.
        otp_attempt: >-
          Controlla la tua applicazione mobile per una password temporanea, o
          inserisci uno dei tuoi codici di recupero.
      dob_contact:
        dob: La tua data di nascita nel formato AAAA-MM-GG
        document: >-
          Per verificare la tua identità e la correttezza della data di nascita,
          devi allegare una foto di un documento legale (carta d'identità,
          patente di guida, tessera studente, passaporto, certificato di
          nascita, ecc.) in cui il tuo nome e la tua data di nascita siano
          visibili e riconoscibili da una persona che parli inglese (in
          alternativa, in caso tu non possieda questi documenti, contatta il
          Delegato WCA locale. Per l'identificazione sono sufficienti il tuo
          nome e la tua data di nascita; se lo desideri puoi sfocare/coprire
          eventuali altri dati personali.
      post:
        body: >-
          Usa i tag &lt;!-- break --&gt; per mostrare una preview nella home
          page. Qualsiasi post in home page mostrerà tutto il testo prima di
          questo divisore. Il post reale mostrerà l'intero messaggio.
        show_on_homepage: >-
          Careful! This is not secure for private data. This is only to prevent
          cluttering the homepage. Posts that are not shown on the homepage are
          still accessible to the public via permalink or through tags.
      delegate_report:
        schedule_url: >-
          Il link completo del programma pubblicato (es.
          https://www.cubingusa.com/usnationals2016/schedule.php)
        equipment: >-
          Numero e tipo di timer e display utilizzati per la competizione.
          Rimuovi le linee non utilizzate.
        summary: >-
          I punti sopraelencati hanno il solo scopo di fare da guida per un
          report completo. Utilizzali a tua discrezione per ciò che ritieni
          utile dire. Salta le parti inutili.
        venue: >-
          I punti elencati sopra sono soltanto una guida per un report
          esaustivo. Usali a tua discrezione, in base a cosa ritieni utile
          menzionare in ciascuno. Per favore rimuovi le parti inutilizzate!
        organization: >-
          I punti elencati sopra sono soltanto una guida per un report
          esaustivo. Usali a tua discrezione, in base a cosa ritieni utile
          menzionare in ciascuno. Per favore rimuovi le parti inutilizzate!
        incidents: >-
          Riporta tutti gli incidenti che rappresentano casi non ordinari.
          Numera gli incidenti iniziando da 1, così che gli altri delegati
          possano commentare riferendosi a loro tramite i numeri. Se tutti gli
          incidenti ti sembrano generici, riporta almeno il caso che ritieni più
          rappresentativo o degno di nota. Assicurati di spuntare le caselle in
          basso se desideri ricevere un feedback.
        setup_images: >-
          Devi allegare almeno %{image_count} immagini che illustrino
          l'allestimento delle aree di scrambling e di gara per questa
          competizione, preferibilmente scattate durante la competizione
          (ulteriori immagini sono ben accette). Puoi selezionare più file
          contemporaneamente. Puoi eliminare immagini solo dopo aver caricato un
          numero sufficiente di nuove immagini (se desideri sostituire
          un'immagine, è necessario caricare prima quella nuova e poi eliminare
          quella vecchia). Se non possiedi immagini dell'area di gara e/o di
          scrambling durante la competizione, spiega il perché.
        wrc_incidents: >-
          Lista dei numeri riferiti a incidenti per i quali richiedi un feedback
          del WRC.
        wic_incidents_html: >-
          Lista dei numeri relativi a incidenti su cui si desidera avere un
          riscontro da parte del WIC. <br>
          <strong>%{wic_incident_alert}</strong>
        wic_incident_alert: >-
          Se l'incidente è delicato (inclusi, ma non solo, reati, molestie,
          aggressioni, ecc.), si consiglia di escluderlo dalla segnalazione e di
          inviare al WIC un'e-mail separata. Per gli altri incidenti, fornire
          una versione breve e anonima dell'incidente e contattare poi
          privatamente il WIC per ulteriori dettagli. Il WIC fornirà comunque un
          feedback sulle versioni anonime per conoscenza generale. Per tutti gli
          incidenti che coinvolgono un volontario WCA, si consiglia di escludere
          tutti i dettagli dal rapporto e di contattare privatamente il WIC.
        remarks: >-
          Parla di qualsiasi altra cosa che tu voglia condividere (es.
          miglioramenti o peggioramenti della community, piani futuri per la
          regione). Se per essere conciso hai tralasciato qualcosa nei form
          precedenti, puoi approfittare di questo form per riportarlo.
      competition_tab:
        name: 'Esempi: viaggio, pagamenti, premi, alloggi.'
      regional_organization:
        website: Deve essere un valido URL http(s). È raccomandato il protocollo
          HTTPS.
        logo: >-
          Deve essere in formato PNG, in buona risoluzione, e con sfondo
          trasparente
        email: >-
          Dovrebbe essere una mailing list contenente tutti i Direttori ed
          Ufficiali
        bylaws: Deve essere in formato PDF
        extra_file: >-
          Deve essere in formato PDF. Se hai bisogno di aggiungere altri file,
          puoi fonderli insieme.
