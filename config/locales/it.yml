            restrizioni per gli spettatori.
          refund_policy_percent: >-
            Per ora questo numero è solo informativo, i rimborsi dovranno essere
            emessi manualmente. Se impostato a 0, verrà visualizzato il
            messaggio che le tasse di iscrizione non saranno rimborsate in alcun
            caso.
