  media_and_instagram:
    page_title: Invio media e Instagram
    general_media_submission:
      title: Invio media generici
      body_html: >-
        La WCA condivide articoli e immagini della competizione forniti dalla
        community sulla propria <a href="/media">pagina media</a>. Se desideri
        inviarci qualcosa, per favore compila il nostro <a
        href="/media/new">modulo per l'invio di media</a>.
    instagram_submission:
      title: Invio Instagram
      paragraph1_html: >-
        Come forse già saprai, la WCA ha un <a
        href="https://www.instagram.com/thewcaofficial/">account Instagram</a>!
        Per rappresentare al meglio la community globale del cubing,
        pubblichiamo contenuti inviatici dai cuber di tutto il mondo.
      paragraph2: >-
        Se possiedi foto o video in alta qualità che vorresti inviarci, clicca
        qui sotto e compila il modulo! Per poter far pubblicare il tuo
        contenuto, devi esserne il proprietario e dare alla WCA l'autorizzazione
        per pubblicarlo. A causa del grande numero di contributi che riceviamo,
        non possiamo pubblicare tutto. Ecco alcuni suggerimenti per avere
        maggiori possibilità che il tuo contenuto sia pubblicato:
      photo_quality: >-
        Assicurati che la qualità foto/video sia buona. Non deve necessariamente
        essere uno scatto/ripresa professionale, ma la qualità non deve
        compromettere la fruibilità del contenuto.
      photo_interest: >-
        Prova a rendere il tuo contenuto interessante per un pubblico più ampio
        possibile. Contenuti interessanti solo per poche persone non vengono
        presi in considerazione.
      wca_related: >-
        Invia foto e video che hanno a che fare con la WCA, dato che il nostro
        account si occupa sostanzialmente di questo. Vogliamo far vedere cuber
        che si divertono!
      submit_instagram_content: Invia contenuti Instagram
    instagram_hosting:
      title: Hosting Instagram
      paragraph1_html: >-
        Talvolta consentiamo a membri della community di ospitare le Instagram
        Stories ufficiali della WCA per la competizione alla quale partecipano!
        Se sei interessato, clicca il pulsante e compila il modulo qui sotto.
        Una volta inviate tutte le informazioni, il WCA Communication Team ti
        contatterà se approverà la tua richiesta di hosting. Se hai domande, <a
        href="https://www.worldcubeassociation.org/contact/website">contattaci</a>.
      paragraph2: >-
        Il nostro obiettivo è di condividere una prospettiva più personale dei
        cuber e delle competizioni. Questo lavoro non va inteso come un compito
        che pesi durante il weekend: vogliamo che tu ti diverta alla
        competizione e, dopo, possa condividerla.
      paragraph3: 'Il ruolo di un host può essere riassunto così:'
      short_intro: 'Fai una breve introduzione, parla di te e della competizione.'
      venue_feel: >-
        Fai alcune storie per dare un'impressione della sede e del clima che c'è
        alla competizione (es. una ripresa dall'area partecipanti o da una
        postazione)
      people_solving: >-
        Prova a fare alcune storie di persone che risolvono (preferibilmente
        partecipanti molto veloci nel proprio main event)
      mini_interviews: >-
        Potresti fare delle mini interviste alle persone (organizzatori,
        delegati, ecc...) chiedendo loro delle impressioni riguardo la
        competizione.
      pictures_too: 'Puoi anche pubblicare foto, non devono essere per forza video.'
      paragraph4: >-
        Le nostre comunicazioni durante il weekend passano generalmente
        attraverso un apposito gruppo WhatsApp. Assicurati di avere familiarità
        con questa piattaforma di messaggistica, o facci sapere se non hai la
        possibilità di usarlo, in modo da organizzarci in altro modo.
      apply_to_host: Invia la tua richiesta per fare da host
    other_suggestions:
      title: Altri suggerimenti?
      body_html: >-
        Hai suggerimenti per contenuti su Instagram o altri social media? <a
        href="https://www.worldcubeassociation.org/contact/website">Facceli
        sapere</a>!
  footer:
    privacy: Privacy
    disclaimer: Disclaimer
  api:
    manage_oauth_html: 'Vai su %{oauth_link} per gestire le tue applicazioni OAuth.'
    token_request_intro: >-
      Ecco un esempio di come ottenere un token di accesso utilizzando un
      Application ID, un Client Secret, la tua email WCA e la tua password:
    user_email_placeholder: YOUR_EMAIL
    user_password_placeholder: YOUR_PASSWORD
    user_info_request_intro: >-
      Un token di accesso OAuth può essere utilizzato, fino alla sua scadenza,
      per effettuare richieste API autorizzate. Ad esempio, per accedere ad
      informazioni sul tuo account:
    legal_tnoodle_api_header: Versione legale di TNoodle
    login_message: 'Per favore, esegui l''accesso'
  merch:
    title: Merchandising WCA
    paragraphs:
      '1': >-
        È disponibile per l'acquisto l'esclusivo merchandising WCA! Magliette,
        felpe, adesivi, Stackmat, zaini e molto altro! I nostri design,
        periodicamente aggiornati, includono il classico logo WCA, merchandising
        ufficiale dei Campionati Mondiali e design ispirati ai record mondiali.
      '2': >-
        Acquistare merchandising WCA tramite il nostro sito è uno dei modi
        migliori per supportare la WCA, un'organizzazione no-profit gestita da
        volontari. Investiamo l'intero ricavato dal merchandising per dare
        ulteriore sostegno economico a Campionati, rinnovo delle attrezzature e
        altre attività inerenti alla WCA.
      '3': >-
        Puoi acquistare il nostro merchandising in tutto il mondo. Avremo presto
        dei punti di distribuzione in Europa, America, India.
  database:
    results_export:
      heading: Esportazione Risultati WCA
      deprecation_warning: >-
        AVVISO DI OBSOLESCENZA: La versione %{old_version} dell'esportazione dei
        risultati è stata dichiarata obsoleta e il supporto verrà interrotto a
        partire dal %{deprecation_date}. Si prega di passare alla versione
        %{new_version} prima di tale data.
      description: >-
        In questa pagina offriamo il download dei risultati WCA in diversi
        formati, affinché questi possano essere più facilmente analizzati. Di
        solito aggiorniamo il database alla fine di ogni weekend, quando i
        risultati sono stati resi definitivi. I file sono numerati e datati: in
        questo modo puoi controllare di possedere la versione più recente.
      permalink: permalink
      permalink_note: >-
        Nota: i permalink forniscono l'esportazione dei risultati più recenti
        all'interno di una determinata versione, ad esempio il permalink v2
        restituirà l'ultima esportazione v2, ma rimarrà su v2 anche quando verrà
        rilasciata la v3.
      file_formats:
        sql: Dichiarazioni SQL per l'importazione in un database SQL.
        tsv: >-
          Valori separati da tabulazione, per fogli di lavoro in Excel,
          OpenOffice, ecc.
      hint_readme_html: >-
        Il file %{readme_filename} qui riportato contiene i termini di utilizzo
        e una descrizione generale (in inglese, non tradotto):
    developer_export:
      heading: WST Developer Export
      description_html: >-
        In questa pagina offriamo il download del WST developer export, in
        formato SQL. Dettagli disponibili su %{github_link}.
      download: Download
  validators:
    persons:
      dob_is_jan_one_warning: >-
        La data di nascita di %{name} è 1 gennaio. Assicurati che non sia un
        errore.
      dob_is_too_young_warning: '%{name} sembra avere meno di 3 anni. Assicurati che
        non sia un errore.'
      dob_is_too_old_warning: '%{name} sembra avere circa 100 anni. Assicurati che
        non sia un errore.'
      person_doesnt_have_any_results_error: 'Non ci sono risultati di %{person_name}
        con l''ID %{person_id}'
      results_not_associated_with_any_person_error: 'Ci sono risultati di una persona
        sconosciuta con l''ID %{person_id}'
      whitespace_in_name_error: >-
        La persona '%{name}' possiede spazi superflui all'inizio o alla fine, o
        doppi spazi all'interno del nome.
      person_with_non_existing_wca_id_error: 'La persona %{name} ha un WCA ID che
        non esiste: %{wca_id}.'
      no_space_before_parenthesis_error: 'Le parentesi aperte in ''%{name}'' devono
        essere precedute da uno spazio.'
      same_person_name_warning: >-
        Esiste già almeno una persona con il nome '%{name}' nel database WCA
        (%{wca_ids}). Assicurati che il tuo '%{name}' sia una persona diversa.
        Se non lo è, assegna il WCA ID corretto all'account dell'utente e
        rigenera il JSON dei risultati.
      non_matching_dob_warning: >-
        La data di nascita '%{dob}' fornita per %{name} (%{wca_id}) non coincide
        con il dato attualmente presente nel database WCA ('%{expected_dob}').
        Se si tratta di un errore, correggilo. Altrimenti lascia un commento a
        riguardo per il WCA Results Team.
      non_matching_gender_warning: >-
        Il sesso '%{gender}' fornito per %{name} (%{wca_id}) non coincide con il
        dato attualmente presente nel database WCA ('%{expected_gender}'). Se si
        tratta di un errore, correggilo. Altrimenti lascia un commento a
        riguardo per il WCA Results Team.
      empty_gender_warning: >-
        Il sesso per l'esordiente %{name} è vuoto. Valori validi per il sesso
        sono 'Femmina', 'Maschio', e 'Altro'. Lascia un commento a riguardo per
        il WCA Results Team.
      non_matching_name_warning: >-
        Il nome '%{name}' fornito per (%{wca_id}) non coincide con il dato
        attualmente presente nel database WCA ('%{expected_name}').
      non_matching_country_warning: >-
        La nazione '%{country}' fornita per %{name} (%{wca_id}) non coincide con
        il dato attualmente presente nel database WCA ('%{expected_country}').
        Se si tratta di un errore, correggilo. Altrimenti lascia un commento a
        riguardo per il WCA Results Team.
      multiple_newcomers_with_same_name_warning: >-
        Ci sono più esordienti con lo stesso identico nome: %{name}. Assicurati
        che tutti i risultati per questi partecipanti siano corretti, e che
        tutti i risultati siano correttamente contraddistinti dall'ID
        corrispondente.
      wrong_parenthesis_type_error: >-
        Il carattere di parentesi usato in '%{name}' è un carattere irregolare.
        Sostituiscilo con una normale parentesi tonda '(' o ')' e la corretta
        spaziatura.
      special_characters_in_name_warning: >-
        Il nome "%{name}" contiene caratteri speciali non validi (numeri,
        virgolette, altri simboli). I nomi possono contenere soltanto lettere,
        spazi, trattini, apostrofi, punti e parentesi tonde.
      suspicious_last_name_warning: >-
        "%{name}" ha come cognome "%{suffix}", che potrebbe non essere un vero e
        proprio cognome (ad esempio, un suffisso generazionale scritto per
        esteso). Verificare che si tratti del cognome legale, o
        sostituirlo/rimuoverlo di conseguenza.
      successive_uppercase_name_warning: >-
        '%{name}' ha nel proprio nome più lettere maiuscole consecutive.
        Assicurati che sia lo spelling corretto, oppure correggilo.
      lowercase_name_warning: >-
        '%{name}' ha un nome in lettere minuscole. Assicurati che sia lo
        spelling corretto, oppure correggilo.
      missing_period_in_single_letter_middle_name_warning: >-
        '%{name}' ha come secondo nome una singola lettera senza punto di
        abbreviazione. Assicurati che sia lo spelling corretto, oppure
        correggilo.
      letter_after_period_warning: >-
        '%{name}' contiene un punto che non è seguito da uno spazio. Assicurati
        che sia lo spelling corretto, oppure correggilo.
      single_letter_first_or_last_name_warning: >-
        '%{name}' ha una singola lettera come nome o cognome. Assicurati che sia
        il nome corretto secondo un documento valido, oppure correggilo.
      single_name_warning: >-
        '%{name}' ha solo un nome. Assicurati che sia il nome completo secondo
        un documento valido.
      competitor_limit_exceeded_warning: >-
        Il numero di persone nella competizione (%{n_competitors}) è superiore
        al limite di partecipanti (%{competitor_limit}). I risultati dei
        partecipanti iscritti dopo il raggiungimento del limite devono essere
        cancellati.
      registration_details_mismatch_warning: >-
        L'utente con ID %{person_id} (%{name}) presenta dati che non
        corrispondono a quelli di registrazione: %{mismatches}
      missing_matching_registration_warning: 'Non è stata trovata alcuna iscrizione
        a nome %{name}.'
      unaccepted_registration_with_results_warning: >-
        %{name} ha fatto registrare dei risultati nella competizione, ma la sua
        iscrizione non è contrassegnata come “accettata”.
    results:
      automatically_position_fixed_info: >-
        [%{round_id}] Corretta automaticamente la posizione di %{person_name} da
        %{pos} a %{expected_pos}.
      mbf_result_over_time_limit_warning: >-
        [%{round_id}] Il risultato '%{result}' di %{person_name} è superiore al
        time limit. Assicurati che sia dovuto a penalità di tempo, oppure
        correggi in DNF prima di inviare i risultati.
      result_after_dns_warning: >-
        [%{round_id}] %{person_name} ha almeno un DNS seguito da un risultato
        valido. Assicurati che sia effettivamente un DNS, e in tal caso, spiega
        la dinamica al WCA Results Team.
      similar_results_warning: >-
        [%{round_id}] I risultati di %{person_name} sono simili ai risultati di
        %{similar_person_name}. Assicurati che siano stati registrati i
        risultati corretti per entrambi i partecipanti.
      met_cutoff_but_missing_results_error: >-
        [%{round_id}] %{person_name} ha superato il cutoff ma non ha risultati
        per la seconda fase del turno. Il cutoff era %{cutoff}.
      didnt_meet_cutoff_but_has_results_error: >-
        [%{round_id}] %{person_name} ha almeno un risultato per la seconda fase
        del turno, ma non ha superato il cutoff. Il cutoff era %{cutoff}.
      wrong_attempts_for_cutoff_error: >-
        [%{round_id}] %{person_name} ha almeno un risultato mancante per la fase
        di cutoff. Correggi i risultati includendo i tentativi mancanti, oppure
        modifica le informazioni del turno nella pagina di gestione eventi della
        competizione.
      result_over_time_limit_error: >-
        [%{round_id}] Almeno un risultato di %{person_name} supera il time limit
        del turno, che è %{time_limit} per tentativo. Tutte le risoluzioni oltre
        il time limit devono essere cambiate in DNF.
      results_over_cumulative_time_limit_error: >-
        [%{round_ids}] La somma dei risultati di %{person_name} supera il time
        limit cumulativo, che era %{time_limit}.
      undefined_time_limit_warning: >-
        [%{round_id}] Il time limit di questo turno non è definito. La convalida
        di questo valore è stata saltata. Questo è previsto solo per
        competizioni precedenti il 2013.
      suspicious_dnf_warning: >-
        [%{round_ids}] Il turno ha un time limit cumulativo, e in base alle
        risoluzioni valide di %{person_name}, gli sarebbe rimasto pochissimo
        tempo per almeno uno dei suoi DNF. Assicurati che tutti i DNF e DNS
        siano corretti. Se il partecipante non ha iniziato un tentativo o non
        aveva tempo residuo prima di iniziare un tentativo, deve essere inserito
        come DNS.
      missing_cumulative_round_id_error: >-
        [%{original_round_id}] Impossibile trovare il turno %{wcif_id} per il
        time limit cumulativo specificato nel WCIF. Vai alla pagina di gestione
        eventi della competizione e rimuovi %{wcif_id} dal time limit cumulativo
        per %{original_round_id}. Il WCA Software Team è a conoscenza di questo
        bug (GitHub issue #3254).
      wrong_position_in_results_error: >-
        [%{round_id}] %{person_name} è nella posizione sbagliata: prevista
        %{expected_pos}, inserita %{pos}.
    rounds:
      too_many_qualified_warning: >-
        Turno %{round_id}: si sono qualificati al turno successivo più
        partecipanti di quelli previsti dalle condizioni di avanzamento
        (%{actual} anziché %{expected}, la condizione era: %{condition}).
        Modifica le informazioni del turno nella pagina di gestione eventi.
      regulation_9m1_error: >-
        Il turno %{round_id} ha meno di 100 partecipanti ma ha più di due turni
        successivi, che non è consentito secondo la Regola 9m1.
      regulation_9m2_error: >-
        Il turno %{round_id} ha meno di 16 partecipanti ma ha più di un turno
        successivo, che non è consentito secondo la Regola 9m2.
      regulation_9m3_error: >-
        Il turno %{round_id} ha meno di 8 partecipanti ma ha almeno un turno
        successivo, che non è consentito secondo la Regola 9m3.
      regulation_9p1_error: >-
        Turno %{round_id}: sono stati eliminati meno del 25% dei partecipanti,
        che non è consentito secondo la Regola 9p1.
      no_competitor_eliminated_error: >-
        Turno %{round_id}: Deve esserci almeno un partecipante eliminato, come
        richiesto dalla Regola 9p (competizioni prima di aprile 2010).
      less_than_twenty_five_percent_eliminated_error: >-
        Turno %{round_id}: stando alle condizioni di avanzamento (%{condition}), verrebbero
        eliminati meno del 25% dei partecipanti, che non è consentito secondo la Regola
        9p1. Modifica le informazioni del turno nella pagina di gestione eventi.
      not_enough_qualified_warning: >-
        Turno %{round_id}: stando ai dati dell'evento, avrebbe potuto accedere
        un massimo di %{expected} persone, ma solo %{actual} hanno partecipato.
        Lascia un commento a riguardo (o correggi i dati dell'evento se hai
        applicato una diversa condizione di avanzamento).
      competed_not_qualified_error: >-
        Turno %{round_id}: %{ids} ha partecipato, ma non aveva raggiunto i
        requisiti di avanzamento (%{condition}). Assicurati che la condizione di
        avanzamento indicata rispecchi quella utilizzata durante la
        competizione, e rimuovi i risultati se necessario.
      round_not_found_error: >-
        Il turno %{round_id} non è stato trovato. Assicurati che WCA Live sia
        sincronizzato con la pagina di gestione eventi sul sito WCA.
      missing_round_results_error: >-
        Non ci sono risultati per il turno %{round_id}, ma il turno è elencato
        nella scheda eventi. Se il turno non si è tenuto, rimuovilo nella pagina
        di gestione eventi della competizione.
    events:
      not_333_main_event_warning: >-
        L'evento principale selezionato è %{main_event_id}. Sebbene questo sia stato
        approvato dal WCAT PRIMA della competizione, il WRT ha la responsabilità di
        assicurarsi DOPO la competizione che siano state rispettate le linee guida
        per l'evento principale previste dalla WCA Competition Requirements Policy.
        Indica una o più azioni intraprese DURANTE la competizione per considerare
        %{main_event_id} come evento principale (esempi validi: dichiarazione del
        vincitore della competizione, maggior numero di turni, premio più grande).
      no_main_event_warning: >-
        Non è stato selezionato alcun evento principale per questa competizione.
        Se è corretto, informa il WCA Results Team.
      missing_results_warning: >-
        Non ci sono risultati per %{event_id}, ma è elencato come evento
        ufficiale. Se l'evento si è tenuto, ricarica il JSON con i risultati
        inclusi. Se l'evento non si è tenuto, lascia un commento per il WCA
        Results Team.
    scrambles:
      missing_scrambles_for_round_error: >-
        [%{round_id}] Scramble mancanti. Usa Scrambles Matcher per allegare gli
        scramble corretti al turno.
      missing_scrambles_for_competition_error: >-
        Scramble mancanti per la competizione. Usa Scrambles Matcher per
        allegare gli scramble.
      missing_scrambles_for_group_error: >-
        [%{round_id}] Gruppo %{group_id}: scramble mancanti, rilevati solo
        %{actual} anziché %{expected}.
      missing_scrambles_for_multi_error: >-
        [%{round_id}] Sebbene possano esserci stati più gruppi di 3x3x3
        Multi-Blind, almeno uno dei gruppi deve contenere gli scramble di tutti
        i tentativi.
      multiple_fmc_groups_warning: >-
        [%{round_id}] Ci sono stati più gruppi di FMC. Se è stato fatto solo un
        gruppo di FMC, usa Scrambles Matcher per deselezionare gli scramble
        inutilizzati. Altrimenti, aggiungi un commento per il WCA Results Team
        spiegando perché si sono tenuti più gruppi di FMC.
      wrong_number_of_scramble_sets_error: >-
        [%{round_id}] Questo turno ha un numero di set di scramble (%{actual})
        diverso da quello specificato nella pagina di gestione eventi
        (%{expected}). Correggi con il numero di set che sono stati utilizzati.
      mbld_scrambles_warning: '[%{round_id}] Questo turno include risultati di 3x3x3
        Multi-Blind. In fase di immissione, specifica nei commenti quanti scramble
        per ciascun set sono stati usati, in modo che il WRT possa rimuovere quelli
        non utilizzati.'
    schedule:
      activity_outside_competition_dates_warning: "L'attività '%{activity_name}' (codice:
        %{activity_code}) è programmata al di fuori delle date previste per la competizione,
        secondo il fuso orario locale della sede. Aggiorna il programma della competizione
        in modo che rispecchi le date effettive della competizione."
  tickets:
    type:
      edit_person: Modifica persona
      competition_result: Risultati della competizione
    stakeholder_role:
      actioner: Esecutore
      requester: Committente
