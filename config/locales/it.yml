  about_regulations:
    title: Riguardo il Regolamento
    panel1:
      title: Regole
      content1_html: >-
        Tutte le competizioni devono seguire il <a
        href="/regulations/">Regolamento WCA</a>. È importante che i concorrenti
        leggano il regolamento prima di partecipare alla loro prima
        competizione.
      content2_html: >-
        Il <a href="/incidents">Registro Incidenti</a> contiene tutte le
        decisioni rilevanti prese dal WCA Regulations Committee in merito a
        incidenti avvenuti durante le competizioni.
    panel2:
      title: Traduzioni
      content1_html: >-
        Grazie ad alcuni membri della WCA, sono disponibili varie traduzioni del
        Regolamento in lingue differenti dall'inglese: <a
        href="/regulations/translations/">Traduzioni</a>.
      content2_html: >-
        <strong>Importante</strong>: Anche se le traduzioni sono molto utili,
        non sono ufficiali. Nelle competizioni, la versione in lingua inglese
        del Regolamento WCA è quella che fa testo.
    panel3:
      title: FAQ riguardo il regolamento
      content1_html: >-
        La <a href="/faq">sezione FAQ</a> risponde a diverse domande frequenti
        riguardo al Regolamento WCA.
    panel4:
      title: Linee guida per organizzatori
      content1_html: >-
        Se ti interessa organizzare una competizione o se stai già pianificando
        di organizzarne una, leggi le nostre <a
        href="https://documents.worldcubeassociation.org/edudoc/organizer-handbook/organizer-handbook.pdf">linee
        guida per organizzatori</a>.
      content2_html: >-
        Questo documento contiene informazioni importanti e dovrebbe essere
        letto da ogni organizzatore di competizioni.
  regulations_translations:
    title: 'Regolamento WCA: Traduzioni'
    paragraph1: >-
      Se parli altre lingue diverse dall'inglese, potresti trovare utili queste
      traduzioni.
    paragraph2: >-
      Ricorda che le traduzioni non hanno alcuna valenza ufficiale, sebbene
      siano messe a disposizione sul sito WCA: non esiste alcuna garanzia sulla
      correttezza del loro contenuto. Se vi è una differenza tra una traduzione
      e la versione (ufficiale più recente) inglese, si deve far fede alla
      versione inglese.
    translations: Traduzioni
    current: Corrente
    old: Obsoleta
    table_elements:
      version: Versione
      language: Lingua
    translating: Tradurre il Regolamento
    paragraph3_html: >-
      Se sei interessato ad aggiungere/aggiornare una traduzione, consulta <a
      href="https://github.com/thewca/wca-regulations-translations#translation-instructions">le
      istruzioni sulla repository GitHub per le traduzioni</a>.
