            Verrà abilitato un pulsante "Accetta in blocco" nel menù delle
            iscrizioni, che accetterà tutte le iscrizioni pagate in attesa e in
            lista d'attesa, fino al raggiungimento del limite di partecipanti o
            del limite definito qui sotto. Utilizzare a proprio rischio.
          auto_accept_disable_threshold: >-
            Quando questo numero di iscrizioni accettate viene raggiunto,
            l'auto-accettazione verrà disattivata, consentendo agli
            organizzatori di approvare manualmente le ultime iscrizioni. Deve
            essere inferiore al limite di partecipanti. Lasciare vuoto se non
            desiderato.
