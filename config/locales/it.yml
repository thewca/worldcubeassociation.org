    see_all_announcements: Vedi tutti gli annunci
    about_us:
      title: Chi siamo
      text: >-
        La World Cube Association gestisce competizioni per rompicapi meccanici
        che funzionano con la rotazione di gruppi di pezzi, comunemente noti
        come 'twisty puzzles'.
    competitions:
      title: Competizioni
      text_html: >-
        Scopri le prossime competizioni vicino a te, o vedi i risultati delle
        competizioni passate. Sei a una competizione e vuoi vedere i risultati?
        Dai un'occhiata a %{wca_live_link}!
    merchandise:
      title: Merchandising
      ad_new: Nuovo
      text_html: >-
        Dai un'occhiata al nostro nuovo merchandising ufficiale che include capi
        di abbigliamento dalle T-shirt alle felpe con cappuccio.
      link_title: Vai al negozio
    records:
      title: Record
      text: >-
        Consulta i record attuali e storici per tutte le discipline ufficiali
        WCA.
    volunteer:
      title: Volontario
      text: >-
        Partecipa anche tu! La WCA offre opportunità di volontariato in diversi
        team. Non è necessario essere un speedcuber per diventare volontario.
    faq:
      title: Domande Frequenti
      text: >-
        Controlla la nostra lista di Domande Frequenti se hai bisogno di aiuto.
        Potresti trovare la risposta a molte delle tue domande.
    contact:
      title: Contatti
      text_html: >-
        Se desideri contattarci, puoi farlo tramite il nostro modulo di
        contatto. Se hai domande sui vari aspetti della WCA, assicurati di aver
        prima letto le %{faq_link}!
      faq: Domande Frequenti
      button: Portami al modulo di contatto WCA
    support:
