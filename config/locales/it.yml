            competizioni a questa Serie, devi andare alla pagina "Modifica"
            delle singole competizioni che desideri aggiungere.
        information: >-
          Informazioni importanti che i partecipanti devono sapere. Sarà
          mostrato nella pagina principale della competizione. <br/>Per favore,
          compila questo campo <b>in inglese</b> e qualunque altra lingua
          parlino i partecipanti.
        competitor_limit:
          enabled: >-
            È richiesto un limite di partecipanti. Soltanto le competizioni FMC
            su più sedi possono non avere un limite di partecipanti.
          count: >-
            Il numero massimo di partecipanti consentito per questa
            competizione. Questo limite è imposto e rispettato dal sistema di
            registrazioni integrato.
          reason: >-
            Quale è la motivazione del limite massimo di partecipanti?
            Perfavore, scrivi la motivazione in inglese!
          auto_close_threshold: >-
            Le iscrizioni chiuderanno automaticamente quando viene raggiunto
            questo numero di iscrizioni pagate. Lascia vuoto per disabilitare,
            ignora se non stai utilizzando il sistema di pagamento integrato.
