            orario UTC
          waiting_list_deadline_date: >-
            La scadenza oltre la quale gli iscritti in lista d'attesa non
            potranno più essere accettati. Questa data non dovrebbe essere
            precedente ad un'eventuale scadenza per i rimborsi.
          event_change_deadline_date: >-
            I partecipanti iscritti hanno diritto a modificare i propri eventi
