        La World Cube Association è un'organizzazione no-profit gestita al 100%
        da volontari. Per questo accettiamo volentieri le vostre donazioni per
        perseguire la nostra missione di rafforzare la community di speedcubing
        nel mondo e garantire un ambiente divertente, equo e competitivo per
        tutti.
      button: Scopri di più su come sostenere la WCA
