    how_to:
      title: Come diventare un'Organizzazione Regionale riconosciuta dalla WCA
      description: >-
        La WCA riconosce numerose Organizzazioni Regionali in tutto il mondo.
        L'obiettivo di una Organizzazione Regionale WCA è quello di organizzare
        competizioni WCA e supportare l'attività della WCA nella propria area. I
        paesi che desiderano costituire un'Organizzazione Regionale sono
        invitati a dare un contributo nella propria area prima di inviare una
        candidatura. Per ricevere aiuto sull'organizzazione di competizioni WCA
        nella tua area, contatta il Delegato WCA più vicino a te.
    requirements:
      title: Requisiti per un'Organizzazione Regionale WCA
      list:
        '1': >-
          Organizzare attivamente o supportare competizioni WCA nella regione
          dell'organizzazione
        '2': >-
          Contribuire all'organizzazione del Campionato Continentale WCA tenuto
          nel continente dell'Organizzazione, se richiesto dal corrispondente
          Team Organizzativo
        '3': >-
          Rispettare e perseguire gli Obiettivi descritti nello Statuto e nelle
          Mozioni WCA
        '4': Rispettare tutte le regole presenti nel Regolamento WCA
        '5': Accettare e rispettare le decisioni dei Volontari WCA
        '6': >-
          Conservare presso la WCA una copia aggiornata del suo statuto e, se
          applicabile, del regolamento in formato elettronico
