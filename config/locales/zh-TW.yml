  page:
    translators:
      title: 翻譯團隊
    officers_and_board:
      title: WCA幹事與董事會
      officers_description: >-
        WCA的幹事負責跟WCA非營利狀態有關的事務。這些幹事是由WCA董事會所選出的。執行董事就是WCA的執行長，董事長主持所有的董事會議，秘書負責維護組織的文件，財務長負責WCA的財務相關事務。
      board_description: WCA董事會負責帶領全體組織，並負責一些其他團隊和委員會沒有負責的事務。
    teams_committees_councils:
      title: WCA團隊和委員會
      description: >-
        WCA的團隊和委員會是整個組織的一部分並負責日常的事務才能讓整個組織運作。這些團隊是由WCA成員包含WCA代表和參賽者所組成的。每一個團隊會都有一個領導者，他們的職務是確保整個團隊的正常運作以及帶領其他團隊成員。當有委員會、團隊的空缺時，如何申請的資訊將會公布在首頁。
      contact_button: 聯絡
      no_contact_description: 這個團隊/委員會的連絡資訊是非公開的。
      groups_name:
        wat: WCA資料整理組 (WAT)
        wct: WCA傳播組 (WCT)
        wcat: WCA比賽公告組 (WCAT)
        wic: WCA廉正委員會 (WIC)
        weat: WCA董事會助理團隊 (WEAT)
        wfc: WCA財政委員會 (WFC)
        wmt: WCA行銷組 (WMT)
        wmct: WCA大型錦標賽團隊 (WMCT)
        wqac: WCA品質保證委員會 (WQAC)
        wrc: WCA規則委員會 (WRC)
        wrt: WCA成績組 (WRT)
        wst: WCA軟體組 (WST)
        wsot: WCA競技組織團隊 (WSOT)
        wapc: WCA申訴委員會 (WAC)
      groups_description:
        wat: >-
          WCA資料整理組(WAT)
          的任務是將WCA過去資料做整理和維護保存。他們記錄下重要的方塊速解事件以及值得注意的WCA里程碑，讓這些資料成為WCA整體時間軸的一部分，以此用來傳承WCA在方塊速解上的歷史地位。
        wct: >-
          WCA傳播組
          (WCT)是監督和協助WCA與社群和一般大眾的溝通橋梁。WCA的溝通內容應該傳遞WCA的目標並支持友善、透明、包容、開放、熱誠、雙向溝通等正面文化價值。
        wcat: >-
          WCA比賽公告組 (WCAT)
          負責審核和公告由WCA代表所提出的比賽申請，並確保此類公告符合WCA品質標準。這個團隊也負責維持良好的比賽申請用的協定文件，例如「WCA比賽要求政策」。WCA比賽公告組並不負責組織或是監督各個比賽。
        wic: >-
          WCA廉正委員會（WIC）負責組成獨立的調查團隊。調查內容為在WCA比賽中已註冊玩家、WCA比賽的意外事件或是官方的WCA網路平台。這些意外事件是被指控違反WCA價值、WCA行為準則、WCA倫理規範或/和WCA競賽規則。
        weat: WCA董事會助理團隊 (WEAT)是負責執行處理WCA董事會的行政事務。
        wfc: >-
          WCA財政委員會
          (WFC)負責管理WCA的財政，包含編制預算、財務報告、財務分析、記帳及報稅。他們也管理WCA最大的收入來源，WCA稅費系統，以及其他各式各樣用來支持各地團體在不同發展階段時需要的資金系統，包含交通資金、設備資金和用來支持區域組織。
        wmt: WCA行銷組 (WMT)負責管理WCA品牌、尋求贊助以及行銷WCA商品。
        wmct: >-
          WCA 大型錦標賽團隊（WMCT）負責協調與推動 WCA
          洲錦標賽及世界錦標賽的籌辦工作，內容包括制定指導方針與策略計畫、管理主辦城市的選定、支援籌備團隊，並確保錦標賽體驗的一致性。
        wqac: >-
          WCA品質保證委員會
          (WQAC)的職責是促進WCA內部持續的品質改善，以及確保應用於全球的標準為一致並保有高品質的程序、WCA志願者、區域組織、比賽主辦團隊和工作人員。
        wrc: >-
          WCA規則委員會(WRC)處理所有跟WCA規則有關的應用，規則改進，規則開發。他們支援WCA代表們任何有關比賽中跟程序有關的判決以及未解決或是未發現的比賽意外事故。
        wrt: WCA成績組(WRT) 管理所有WCA資料庫裏面的資料，包含比賽成績和個人資料。
        wst: WCA軟體組 (WST)管理WCA的軟體（網站、轉亂程式、作業工具、管理工具）。
        wsot: WCA競技組織團隊 (WSOT)監督和協助WCA成為一個國際認可的競技組織。
        wapc: >-
          WCA申訴委員會(WAC)審視以及解決那些對WCA志願者所做出決定的申訴案件。WAPC提供獨立和公正的調查過程來確保決定的公平性、合理性和符合WCA政策及競賽規則。
