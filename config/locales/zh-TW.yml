    title: 區域組織
    content: WCA認可以下的區域組織：
    empty: 目前沒有區域組織被WCA認可。
    how_to:
      title: 如何成為WCA認可的區域組織
      description: >-
        WCA認可世界各地的區域組織。WCA區域組織的目的是在該區域舉辦WCA比賽及協助WCA活動。我們鼓勵那些想要組成區域組織的地方在提交申請之前，先對該區域WCA活動有所貢獻。若您想在您的所在區域舉辦比賽，請聯絡您附近的WCA代表。
    requirements:
      title: 成為WCA區域組織的必要條件
      list:
        '1': 經常地在該區域舉辦或協助WCA比賽
        '2': 如果該比賽團隊要求，要對該區域的洲所舉辦的洲錦標賽做出貢獻。
        '3': 尊重並實施由WCA內部章程與動議所制定的目標。
        '4': 執行所有可遵守的WCA規則。
        '5': 接受並執行WCA志願者所做的決定。
        '6': 提交目前最新的內部規章（如果可行的話使用電子版本）給WCA。
    application_instructions:
      title: 申請說明
      description_html: 為取得認可，請填寫<a href='/regional-organizations/new'>這個表單</a>。
    regional_organization_form:
      filling_instructions_html: 請都用<b>英文</b>填寫
      public_information: 公開訊息
      private_information: 非公開訊息
      private_information_disclaimer: 所有以下的訊息都只有WCA董事會能看到。
    errors:
      end_date_after_start_date: 不能在認證之後的日期
    create:
      create_success: 申請已成功送出！請確認您的電子郵件，並等待WCA董事會的評閱。
    delete:
      confirm_delete: 您確定要刪除這個區域組織請求嗎？
  score_tools:
    title: WCA比賽用軟體工具
    wca_icon_text: 由WCA軟體組發開與維護
    intro:
      desc: 這一頁大概地列出一些對WCA比賽的主辦團隊有用的工具。
      disclaimer: '在這頁面上的工具並非所有都是由WCA軟體組維護，但其實別擔心！是因為我們沒有足夠人力來管理所有WCA相關的軟體 :)'
      used: >-
        所有列在這裡的程式都有在WCA比賽中被使用過，且已經與WCA網站做整合：您能夠用WCA帳號登入並且能夠載入或是上傳即將舉行的比賽資料。每一個程式的維護者會清楚地記載。
    before:
      title: 比賽之前
      desc: 參賽者的報名資料能夠直接在WCA網站上面管理。由於手動管理分組和志願者有可能會很費時，您可以考慮選用以下其中一個軟體。
    during:
      title: 比賽進行中
      desc: 在這裡您可以找到能夠在比賽進行中讓您管理比賽成績的工具。
    after:
      title: 比賽結束後
      desc: 雖然成績確認會在網站上面執行，您仍要使用一些工具來載入由TNoodle產生的轉亂內容，這樣才能把最後成績上傳到WCA網站。
    tools:
      age:
        title: AGE
        description: 產生和編輯WCA的比賽分組以及比賽任務分派的工具
      certificates:
        title: 獎狀
        description: 用WCA Live來列印WCA比賽的獎狀
      groupifier:
        title: Groupifier
        description: >-
          WCA比賽主辦團隊可用的分組以及分派工作的管理工具。在主要的功能中你能找到：用排名來排列參賽者、分派工作（裁判、轉亂）、決定需要的轉亂數量、產生成績單、個人單子，以及改要...更多內容請參考網頁。
      scorecards:
        title: 成績單
        description: 用WCA Live來列印WCA比賽的成績單
      tnoodle:
        title: TNoodle （轉亂程式）
        description: 
          TNoodle是用在WCA比賽的官方轉亂程式。通常都是由WCA代表在比賽前使用，但它的介面也能夠讓任何人為所有的WCA比賽項目產生轉亂內容。
      live:
        title: WCA Live
        description: 能管理WCA比賽且能即時向全世界分享比賽成績的平台
      nightmare:
        title: 成績用表格
        description: 問題難免都會發生......如果您沒有網路連線，您就必須要使用舊的表單系統。
      matcher:
        title: 轉亂自動配對
        description: >-
          能把TNoodle產生的轉亂內容對應到成績。當使用WCA
          Live時，從WCA網站載入成績，可以是EXCEL表格或是一個單獨的WCIF檔案。從不只一個TNoodle
          json檔案來載入轉亂內容。輸出適當的成績檔案格式來作為成績上傳。
      groups:
        title: CompetitionGroups (比賽組別)
        description: 查看所有進行中的比賽組別
  logo:
    title: WCA標誌
    intro: WCA標誌由Justin 
      Eastman在2005年1月的設計比賽所提出。我們喜歡這個標誌是因為它的設計、顏色、以及它沒有特意秀出3x3x3方塊。
    headings:
      usage_guidelines:
        title: 使用者指南
        paragraph:
          acceptable_usage: >-
            可接受的WCA標誌使用方式在 <a
            href="https://documents.worldcubeassociation.org/documents/policies/external/Logo%20Usage.pdf">WCA標誌使用政策</a>中列出。請您在自己項目中使用WCA標誌之前詳閱這個文件。關於更多跟WCA標誌使用相關的疑問請來信<a
            href="mailto:marketing@worldcubeassociation.org">WCA行銷組</a>。
          see_below: 底下是關於WCA標誌正確用法的追加風格指南。
        color:
          title: 顏色
          paragraph: WCA標誌有四種顏色變化。正確的顏色變化應該根據該標誌使用的媒體背景來正確使用。
          primary:
            title: 主要
            paragraph: 盡可能使用這個主要的形式。
          mono:
            title: 單色
            paragraph: 只有在主要的形式不適合時才使用黑白形式。
        logo_only:
          title: 只有標誌
          paragraph: 遵循上面同樣的顏色使用指南，WCA標誌可以使用沒有文字標誌的版本。
      download_logo_assets:
        title: 下載標誌
        paragraph: 這邊能下載WCA標誌的高解析度PNG檔案和向量版本。
        accept_terms_and_conditions: >-
          我已閱讀並接受<a
          href="https://documents.worldcubeassociation.org/documents/policies/external/Logo%20Usage.pdf">WCA標誌使用政策</a>。
        download_button_text: 下載所有的標誌
