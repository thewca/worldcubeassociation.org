  incidents_log:
    i18n_disclaimer: 請注意，意外事件部分僅提供英文版本，以下的內容並未翻譯。
    incident: 意外事件：
  about_regulations:
    title: 關於規則
    panel1:
      title: 規則
      content1_html: >-
        所有比賽必須遵守<a
        href="/regulations/">WCA規則</a>。對於即將要參加第一場比賽參賽者而言，在參加之前閱讀這些規則是很重要的。
      content2_html: 由WCA規則委員會處理並裁定的比賽事件的重要決策可在<a 
        href="/incidents">意外事件紀錄</a>查閱。
    panel2:
      title: 翻譯版
      content1_html: >-
        WCA規則不僅有英文版本，WCA成員們已將規則翻譯為多國語言：<a
        href="/regulations/translations/">翻譯版</a>。
      content2_html: <strong>注意</strong>：儘管翻譯版有助於理解規則，但它們並非官方版本。在比賽當中，必須以英文版本為主。
    panel3:
      title: 規則常見問題
      content1_html: <a href="/faq">常見問題區</a>回答了許多關於WCA規則的常見問題。
    panel4:
      title: 主辦團隊指南手冊
      content1_html: 如果您有興趣主辦比賽或是已經在準備當中，請閱讀我們的<a 
        href="https://documents.worldcubeassociation.org/edudoc/organizer-handbook/organizer-handbook.pdf">主辦團隊指導方針</a>。
      content2_html: 此文件包含重要資訊，所有比賽主辦團隊應詳閱。
  regulations_translations:
    title: WCA規則：翻譯版
    paragraph1: 如果您說的是英語以外的語言，這些翻譯應該對您會有幫助。
    paragraph2: 
      請注意翻譯版並不視為官方版本，就算他們是在WCA網站取得，翻譯版本仍無法保證內容正確。如果翻譯版和（最新的）英文版有相異處，必須使用英文版。
