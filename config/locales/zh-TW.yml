          外文姓名中譯英系統。禁止隨意輸入拼音，綽號，其他別名等。<br>例如<strong> 周杰倫 </strong>，請輸入<strong>
          Chieh-Lun Chou </strong>。而不是<strong> Jay Chou（綽號）、Chou
          Chieh-Lun（姓名相反）或chiehlun chou（沒有大寫） </strong>。<br/>若名字有中間名(middle
          name)，則可以不用輸入。
