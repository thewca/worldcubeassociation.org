          此通知僅限於與資料匯出、WCIF 結構（schema）及公開 API
          等資源的重大版本變更相關。建議提供給維護依賴這些工具之軟體的開發者訂閱。
        receive_delegate_reports: 
          如果您是高級代表、WRC或WQAC的成員，您會自動收到比賽報告。備註：此變更可能得花12個小時才生效。
        delegate_reports_region: 
          如果您想要收到所有的報告，請在這個欄位留白(下拉式選單的最上面)。請注意：這個變更可能需要12個小時才會生效。
        otp_attempt: 請開啟您的行動裝置上的應用程式來取得一次性的密碼，或是輸入您其中一個備用碼。
      dob_contact:
        dob: 將您的生日填成YYYY-MM-DD的格式
        document: >-
          為了證明您的身份和您正確的生日，您必須附件一張有您的姓名和生日的合法證件（身份證、駕照、學生證、護照等）且能夠讓英語人士明白的照片以供辨識（若您無法提供上述證件，請聯絡您當地的WCA代表）。在證件上面，至少要有您的名字和出生日期；其他的任何個人資訊部分可以遮蓋或是模糊處理。
      post:
        body: >-
          Use the &lt;!-- break --&gt; tag to show a preview on the home page.
          Any post on the home page will show all text before this divider. The
          actual post will display the full body.
