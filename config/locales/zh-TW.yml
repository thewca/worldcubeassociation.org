        schedule_url: '公開賽程的完整網址（例如：https://www.cubingusa.com/usnationals2016/schedule.php）'
        equipment: 這場比賽使用的大顯、計時器數量和款式。請把您沒用到的器材該行刪掉。
        summary: 以上列出的幾點只是完成報告用的指導內容。請使用您認為適合的內容，並請移除不需要的部分！
        venue: 以上列出的例子只是完成報告用的指導內容。您可自由選擇那些適合寫入報告。請移除沒有用到的部分！
        organization: 以上列出的例子只是完成報告用的指導內容。您可自由選擇那些適合寫入報告。請移除沒有用到的部分！
        incidents: >-
          請報告所有非一般的事件。請把意外事件按照號碼從1.開始排序，好讓其他代表根據號碼發表回應。就算所有事物看起來都很類似，請列出那些最值得報告的事項。如果您需要意見回饋，請在下面適當的部分選擇做選擇。
        setup_images: >-
          您必須選擇 %{image_count}
          張能夠說明比賽現場打亂區、比賽區的照片等來自本次比賽的照片，最好是在比賽進行期間拍攝(其他照片也沒問題)。您可以一次選擇多個檔案。只有在上傳足夠數量的其他圖片後，才能刪除現有圖片（如果您想替換某張圖片，請先上傳新的，再刪除舊的）。如果您沒有最新的比賽區域和／或打亂區域的最新照片，請說明原因。
        wrc_incidents: 列出希望WRC回饋的意外事件編號。
        wic_incidents_html: '請列出您希望WIC提供意見的事件編號清單。<br><strong>%{wic_incident_alert}</strong>'
        wic_incident_alert: >-
          如果WIC事件內容較為敏感（包括但不限於犯罪、騷擾、攻擊等），請勿在報告中提及，並另行以電子郵件單獨聯繫WIC。對於其他WIC事件，請以簡要、匿名的方式進行描述，並私下向WIC補充詳細資訊。即使是匿名版本，WIC仍會提供意見以提升整體認識。若事件涉及WCA志工，請完全不要在報告中提及任何細節，務必私下聯繫WIC。
        remarks: 
          分享任何關於比賽的其他細節(例如：進步/社群/這區域的未來展望)。如果您是為了讓前面章節比較簡潔而沒有提到一些事情，盡情在這邊留下評論。
