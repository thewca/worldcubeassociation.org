  page:
    translators:
      title: Översättare
    officers_and_board:
      title: 'WCA:s ledning och styrelse'
      officers_description: >-
        WCA:s ledning hanterar uppgifter som rör WCA:s status som ideell
        organisation. Dessa tjänstemän väljs av WCA:s styrelse. VD:n är WCA:s
        verkställande direktör, ordföranden leder alla styrelsemöten,
        sekreteraren upprätthåller organisationens dokument och kassören
        hanterar WCA:s finansiella frågor.
      board_description: >-
        WCA:s styrelse ansvarar för att leda organisationen som helhet och
        fullgöra alla uppgifter som inte fullgörs av andra team och kommittéer.
    teams_committees_councils:
      title: 'WCA:s teams och kommittéer'
      description: >-
        WCA:s team och kommittéer är en central del av organisationen och utför
        de dagliga uppgifter som krävs för att den ska fungera. Dessa kommittéer
        består av WCA-medlemmar, inklusive WCA-delegater och tävlande. Varje
        team har en ledare, vars roll är att se till att teamet fungerar korrekt
        och vägleda andra teammedlemmar. När det finns lediga platser i
        kommittéer eller team publiceras information om hur man ansöker på
        förstasidan.
      contact_button: Kontakt
      no_contact_description: >-
        Kontaktuppgifterna till detta team/kommitté är inte offentligt
        tillgängliga.
      groups_name:
        wat: WCA Archive Team
        wct: WCA Communication Team
        wcat: WCA Competition Announcement Team
        wic: WCA Integrity Committee
        weat: WCA Executive Assistants Team
        wfc: WCA Financial Committee
        wmt: WCA Marketing Team
        wmct: WCA Major Championships Team
        wqac: WCA Quality Assurance Committee
        wrc: WCA Regulations Committee
        wrt: WCA Results Team
        wst: WCA Software Team
        wsot: WCA Sports Organization Team
        wapc: WCA Appeals Committee
      groups_description:
        wat: >-
          WCA Archive Team (WAT) ansvarar för utveckling och underhåll av WCA:s
          historiska arkiv. De dokumenterar viktiga speedcubing-händelser och
          anmärkningsvärda WCA-milstolpar som ska presenteras som en del av en
          bredare WCA-tidslinje, för att bevara arvet från WCA inom speedcubing.
        wct: >-
          WCA:s kommunikationsteam (WCT) övervakar och stödjer WCA:s
          kommunikation med communityt och allmänheten. WCA:s kommunikation ska
          bidra till WCA:s mål och stödja en allmänt positiv kultur av
          vänlighet, transparens, delaktighet, öppenhet, och lyhördhet.
        wcat: >-
          WCA Competition Announcement Team (WCAT) godkänner och publicerar
          WCA-tävlingar som skickats in av WCA-delegater, och se till att sådana
          publiceringar följer WCA:s kvalitetsstandarder. Detta team är också
          ansvarigt för att upprätthålla ett korrekt procedur för inskickande av
          tävlingar, från dokument som WCA Competition Requirements Policy. WCAT
          är INTE ansvarig för arrangering och delegering av enskilda tävlingar.
        wic: >-
          WCA Integrity Committee (WIC) utför oberoende utredningar gällande
          medlemmar i WCA:s community och incidenter under WCA:s tävlingar eller
          på officiella WCA-plattformar online. Dessa incidenter är påstådda
          överträdelser av WCA:s Spirit, uppförandekod, etikkod och/eller
          regler.
        weat: >-
          WCA Executive Assistants Team (WEAT) ansvarar för att utföra de
          administrativa uppgifter som åligger WCA:s styrelse.
        wfc: >-
          WCA Financial Committee (WFC) ansvarar för att hantera WCA:s
          övergripande ekonomi, inklusive budgetering, rapportering, analys,
          bokföring, och skattedeklarationer. De hanterar också WCA:s största
          inkomstkälla, WCA Dues, tillsammans med olika finansieringsprogram som
          ger stöd till lokala communities i olika utvecklingsstadier, inklusive
          resefinansiering, utrustningsfinansiering, och stöd till regionala
          organisationer.
        wmt: >-
          WCA Marketing Team (WMT) förvaltar WCA:s varumärke, söker sponsorer,
          och marknadsför WCA:s merchandise.
        wmct: >-
          WCA Major Championship Team (WMCT) övervakar samordningen och
          främjandet av kontinentala mästerskap och världsmästerskap genom att
          utveckla riktlinjer och strategiska planer, hantera valet av värdstad,
          stödja arrangörsteam och säkerställa konsekventa
          mästerskapsupplevelser.
        wqac: >-
          WCA Quality Assurance Committee (WQAC) stödjer och främjar
          kontinuerlig kvalitetsförbättring inom WCA, samt global tillämpning av
          kvalitetsstandarder för att säkerställa konsekvent hög kvalitet på
          processer, WCA-funktionärer, regionala organisationer,
          tävlingsarrangörer, och tävlingspersonal.
        wrc: >-
          WCA Regulations Committee (WRC) hanterar alla frågor som är relaterade
          till tillämpningen, förbättringen, och utvecklingen av WCA-reglerna.
          De stöder WCA-delegater i alla typer av procedurfrågor som inträffar
          vid tävlingar och beslutar om olösta och oupptäckta incidenter.
        wrt: >-
          WCA Results Team (WRT) ansvarar för att hantera all data i WCA:s
          databaser, inklusive tävlingsresultat och personuppgifter.
        wst: >-
          WCA Software Team (WST) hanterar WCA:s mjukvara (webbplats,
          blandningsprogram, arbetsböcker, administrationsverktyg).
        wsot: >-
          WCA Sports Organization Team (WSOT) övervakar och stödjer erkännandet
          av WCA som en internationell idrottsorganisation.
        wapc: >-
          WCA Appeals Committee (WAC) granskar och löser överklaganden av beslut
          som fattats av annan WCA-personal. WAC tillhandahåller en oberoende
          och opartisk granskningsprocess för att säkerställa att besluten är
          rättvisa, rimliga, och i enlighet med WCA:s policyer och regler.
