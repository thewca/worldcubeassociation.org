        name: >-
          Ange den tävlandes fullständiga namn korrekt, till exempel
          <strong>Stefan Pochmann</strong>. Inte slarvigt som <strong>s
          pochman</strong>.<br/>Mellannamn (antingen hela eller som initialer)
          är valfria.
        pending_avatar: >-
          När du har laddat upp en ny profilbild behöver du vänta på att WCA
          Results Team godkänner den.
        registration_notifications_enabled: >-
          Detta gäller endast tävlingar som du är arrangör eller delegat för,
          och kan ändras för varje enskild tävling.
        receive_delegate_reports: >-
          Om du är senior-delegat eller medlem i WRC eller WQAC, får du
          delegatrapporter som standard. OBS: ändringen kan ta upp till 12
          timmar att träda i kraft.
        delegate_reports_region: >-
          Om du vill få alla rapporter lämnar du detta fält tomt (dropdown-menyn
          längst upp). OBS: det kan ta upp till 12 timmar innan ändringen träder
          i kraft.
        otp_attempt: >-
          Se din konfigurerade mobilapplikation för ett engångslösenord eller
          ange en av dina återställningskoder.
        receive_developer_mails: Detta gäller endast notiser om större 
          versionsändringar av resurser som dataexporter, WCIF-schemat och 
          offentliga API:er. Rekommenderas för utvecklare som underhåller 
          programvara som är beroende av dessa verktyg.
      dob_contact:
        dob: Din korrekta födelsedag i formatet ÅÅÅÅ-MM-DD
        document: >-
          För att bevisa din identitet och ditt korrekta födelsedatum för oss
          måste du bifoga en bild av någon juridisk handling (ID-kort, körkort,
          studentkort, pass, födelsebevis, ...) där ditt namn och födelsedatum
          är synlig och förståelig för en engelsktalande (eller kontakta din
          lokala WCA-delegat om du inte har ett sådant dokument). Vid
          identifieringen behöver vi som minst ha ditt namn och födelsedatum; om
          du vill får du sudda ut/dölja andra personuppgifter vid
          identifieringen.
      post:
        body: >-
          Använd &lt;!-- break --&gt;-taggen för att visa en förhandsgranskning
          på startsidan. Varje inlägg på hemsidan visar all text före avdelaren.
          Det faktiska inlägget visar hela innehållet.
        show_on_homepage: >-
          Försiktigt! Detta är inte säkert för privata data. Detta är bara för
          att förhindra att hemsidan blir rörig. Inlägg som inte visas på
          hemsidan är fortfarande tillgängliga för allmänheten via permalänkar
          eller taggar.
      delegate_report:
        schedule_url: >-
          Fullständig länk till det publicerade schemat (t.ex.
          https://www.cubingusa.com/usnationals2016/schedule.php)
        equipment: >-
          Antal och typ av timers och displayer som användes på tävlingen. Ta
          bort raden/raderna med utrustning som inte användes.
        summary: >-
          De listade punkterna ovan är endast riktlinjer för en fullständig
          rapport. Använd dem efter eget omdöme för vad du anser lämpligt.
          Vänligen ta bort oanvända delar!
        venue: >-
          Ovanstående punkter är bara för vägledning för en fullständig rapport.
          Använd dem enligt egen bedömning för vad du anser lämpligt. Ta bort
          oanvända delar!
        organization: >-
          Ovanstående punkter är bara för vägledning för en fullständig rapport.
          Använd dem enligt egen bedömning för vad du anser lämpligt. Ta bort
          oanvända delar!
        incidents: >-
          Rapportera alla incidenter som inte är standardfall. Numrera
          incidenterna från 1. så att andra delegater kan kommentera med
          hänvisning till deras nummer. Även om allt verkade normalt, lista bara
          åtminstone de mest anmärkningsvärda fallen. Markera kryssrutorna nedan
          om du aktivt söker feedback.
        setup_images: >-
          Du MÅSTE välja minst %{image_count} bilder som illustrerar blandnings-
          och tävlingsområdet (andra bilder är också välkomna). Du kan välja
          flera filer samtidigt. Du kan ta bort bilder först när tillräckligt
          många andra bilder har laddats upp (om du vill byta ut en bild måste
          du först ladda upp den nya bilden och sedan ta bort den gamla).
        wrc_incidents: >-
          Lista över nummer på alla incidenter som du vill ha feedback från WRC
          på.
        wic_incidents_html: >-
          Lista med incidentnummer som du vill ha WIC-feedbacken på. <br>
          <strong>%{wic_incident_alert}</strong>
        wic_incident_alert: >-
          Om WIC-incidenten är känslig (exempelvis brottslighet, trakasserier,
          övergrepp, etc.), vänligen ta inte med den i rapporten utan mejla WIC
          separat. För andra WIC-incidenter, skriv en kortfattad anonymiserad
          version av incidenten, och följ upp med WIC separat med vidare
          detaljer. WIC kommer fortfarande att ge feedback på anonymiserade
          versioner för allmän kännedom. För alla WIC-incidenter som involverar
          en WCA-volontär, vänligen utelämna alla detaljer från rapporten och
          kontakta WIC separat.
        remarks: >-
          Presentera andra detaljer som du vill dela (t.ex.
          förbättring/försämring inom communityt, framtida planer för regionen).
          Om du för korthetens skull lämnade något osagt i de föregående
          avsnitten, är du välkommen att kommentera dem här.
      competition_tab:
        name: 'Exempel: Resor, betalningar, priser, boende'
      regional_organization:
        website: Måste vara en giltig http(s)-url. HTTPS rekommenderas
        logo: >-
          Måste vara i PNG-format, i bra upplösning och med en transparent
          bakgrund
        email: Bör vara en e-postlista som innehåller alla i organisationens 
          ledning
        bylaws: Måste vara i PDF-format
        extra_file: >-
          Måste vara i PDF-format. Om du behöver lägga till fler filer, vänligen
          lägg ihop dem till en
