    title: Vanliga frågor
    contact_html: 'Om inget av dessa svar hjälpte, vänligen %{contact_us}!'
    contact_us: kontakta oss
    search_for_competition: 'Sök efter en tävling här:'
    already_logged_in: Du är redan inloggad med ett WCA-konto.
    create_an_account: 'Du kan skapa ett konto %{here}.'
    claim_your_wca_id: 'Du kan göra anspråk på ditt WCA-ID %{here}.'
    create_an_account_and_claim: >-
      Skapa ett konto %{here}. När du har loggat in med ditt nya konto kommer du
      att bli ombedd att göra anspråk på ditt WCA-ID.
    answers:
      '1':
        title: Hur får jag ett WCA-ID och en WCA-profil?
        content:
          '1': >-
            Om du aldrig har tävlat tidigare, åk på en <a
            href='/competitions'>tävling</a>! Ett WCA-ID och en WCA-profil
            skapas åt dig när resultaten från din första tävling publiceras.
      '2':
        title: Hur hittar jag en WCA-tävling?
        content:
          '1': Kolla in vår lista över <a href='/competitions'>tävlingar</a>
      '3':
        title: >-
          Hur anmäler jag mig till en tävling? Vem kan jag vända mig till om jag
          har problem med att anmäla mig till en tävling?
        content:
          '1': >-
            Många tävlingar har anmälan här på WCA:s hemsida, men vissa använder
            sina egna system. Du bör kontakta arrangörerna av tävlingen du vill
            tävla i för mer information. %{comp_search_form}
      '4':
        title: >-
          Vad finns det för krav för att delta i en WCA-tävling? Vad behöver jag
          veta innan jag deltar i en WCA-tävling?
        content:
          '1': >-
            I allmänhet finns det inte många krav på en person för att delta i
            en WCA-tävling, men alla tävlande förväntas ha en god förståelse för
            <a
            href='https://www.worldcubeassociation.org/regulations/'>WCA-reglerna</a>.
            Om engelska inte är ditt första språk och du har problem med att
            förstå dokumentet, finns <a
            href='https://www.worldcubeassociation.org/regulations/translations/'>översättningar</a>
            tillgängliga.
      '5':
        title: Hur kan jag få en WCA-tävling i min hemstad?
        content:
          '1': >-
            Om du är intresserad av att arrangera en tävling rekommenderar vi
            det att du deltar i minst en eller två tävlingar som en tävlande för
            att lära dig genom erfarenhet.
          '2': >-
            WCA-tävlingar måste följa <a target='_blank'
            href='https://www.worldcubeassociation.org/regulations/'>WCA-reglerna</a>.
            Arrangörsteamet behöver inte kunna alla regler utantill, men en djup
            kunskap om grunderna i reglerna underlättar definitivt i att
            arrangera tävlingen korrekt.
          '3': >-
            Därefter måste arrangörsteamet kontakta en <a target='_blank'
            href='https://www.worldcubeassociation.org/delegates'>WCA-delegat</a>
            i området. Övervakning från en WCA-delegat krävs för att göra en
            tävling officiellt erkänd av WCA. WCA-delegaten hjälper till att
            vägleda arrangörerna i hur man arrangerar en lyckad tävling.
          '4': >-
            Se <a target='_blank'
            href='https://documents.worldcubeassociation.org/edudoc/organizer-handbook/organizer-handbook.pdf'>WCA
            Competition Organizer Handbook</a> för mer detaljerad information.
      '6':
        title: >-
          Vad är WCA-kontona till för? Vad är skillnaden mellan WCA-konton och
          WCA-profiler?
        content:
          '1': >-
            Du tilldelas ett WCA-ID när resultaten från din första WCA-tävling
            publiceras.
          '2': >-
            Med ett WCA-konto kan du bevisa för oss vem du är. Detta gör att du
            kan lägga till en bild i din WCA-profil, och anmäla dig till
            tävlingar. Detta skyddar dig från andra människor som låtsas vara
            du.
          '3': '%{current_user_status}'
      '7':
        title: Hur ändrar jag min profilbild?
        content:
          '1': >-
            Först måste du <a
            href='#how-do-i-connect-my-wca-account-with-my-wca-id'>skapa ett
            WCA-konto och ansluta det till ditt WCA-ID.</a>
          '2': >-
            När du har anslutit ditt WCA-konto och ditt WCA-ID, gå till <a
            href='%{profile_edit_path}'>redigera profilsida</a> för att ändra
            din profilbild.
      '8':
        title: Hur kopplar jag ihop mitt WCA-konto med mitt WCA-ID?
        content:
          '1': '%{current_user_claim}'
      '9':
        title: >-
          Jag är anmäld till en tävling och vill anmäla mig till en extra gren,
          vad ska jag göra? Kan jag ta med gäster?
        content:
          '1': >-
            Vänligen kontakta arrangören. Du hittar kontaktinformationen på
            tävlingens hemsida. Om du är osäker på var du hittar den, se <a
            href='/competitions'>listan över tävlingar</a>.
      results:
        title: 'När laddas resultaten från en WCA-tävling upp på WCA:s hemsida?'
        content:
          '1': >-
            Efter att en tävling har avslutats måste WCA-delegaten dubbelkolla
            alla resultatkort och personuppgifter för att korrigera eventuella
            fel. När detta är gjort skickas resultaten till WCA Results Team
            (WRT), som ansvarar för att ladda upp tävlingsresultat och
            underhålla WCA-databasen. WRT laddar slutligen upp resultaten till
            WCA-databasen så snart som möjligt.
          '2': >-
            Beroende på tävlingens storlek och delegatens personliga schema kan
            allt detta ta bara en dag eller upp till en vecka. Ha tålamod.
          '3': >-
            Om du dessutom har anslutit ditt WCA-konto till ditt WCA-ID (se
            nedan) kan du aktivera e-postaviseringar om dina
            resultatuppladdningar <a href='%{preferences_edit_path}'>här</a>.
      regulations1:
        title: Är mitt pussel tillåtet att användas på en tävling?
        content:
          '1': >-
            Du hittar reglerna om pussel i <a
            href='https://www.worldcubeassociation.org/regulations/#3'>Artikel
            3</a>. Alla pussel bör godkännas av en WCA-delegat. Om du är osäker,
            vänligen fråga delegaten för din tävling. För att vara på den säkra
            sidan kan du ta med ett extra pussel om du inte får använda det.
      regulations2:
        title: Får jag använda ett magnetiskt pussel i en officiell WCA-tävling?
        content:
          '1': >-
            Du får använda magnetiska pussel så länge de uppfyller <a
            target='_blank'
            href='https://www.worldcubeassociation.org/regulations/'>WCA-Reglerna</a>.
            Var särskilt uppmärksam på <a
            href='https://www.worldcubeassociation.org/regulations/#3h'>Regel
            3h</a>.
      regulations3:
        title: >-
          Jag har tappat bort en mittbit eller en del av mitt pussel. Får jag
          fortfarande använda det?
        content:
          '1': >-
            Du får inte använda detta pussel. Pussel får inte ha några skador
            eller andra skillnader som väsentligt skiljer någon bit från en
            liknande bit (se <a
            href='https://www.worldcubeassociation.org/regulations/#3j'>Regel
            3j</a>).
      regulations4:
        title: Hur gammal måste jag vara för att anmäla mig till en WCA-tävling?
        content:
          '1': >-
            Det finns ingen åldersgräns. Du bör dock fråga dina föräldrar innan
            du anmäler dig (se <a
            href='https://www.worldcubeassociation.org/regulations/#2b'>Regel
            2b</a>).
  about:
    title: Om WCA
    mission_statement: >-
      Målet med vår verksamhet är att ha fler tävlingar i fler länder med fler
      människor och mer kul, under rättvisa och lika villkor.
    mission_footer: 'WCA:s Verksamhet'
    who_we_are_title: Vilka vi är
    who_we_are_content_html: >-
      <p>World Cube Association reglerar tävlingar för mekaniska pussel som
      manipuleras genom att vrida grupper av bitar, allmänt kända som "twisty
      puzzles". Det mest kända av dessa pussel är Rubiks Kub, uppfunnen av
      professor Rubik från Ungern. Ett urval av dessa pussel har valts som
      officiella grenar i WCA.</p> <p>I takt med att WCA har utvecklats under
      det senaste decenniet har över 245 000 personer tävlat i våra tävlingar.
      Trots denna tillväxt förblir vi en organisation som helt drivs av
      volontärer, från lokala arrangörer till WCA-delegater och till och med
      WCA:s styrelse. Vi är väldigt tacksamma för alla som tar tid ur sina liv
      för att få WCA att fungera. Med mer ekonomiskt stöd hoppas vi kunna få en
      ännu högre nivå av professionalitet i våra tävlingar när vi fortsätter att
      innefatta fler evenemang över hela världen.</p>
    spirit: >-
      Vår anda är att människor från hela världen har kul tillsammans i en
      vänlig atmosfär, hjälpa varandra och beta sig sportsligt.
    spirit_footer: 'WCA:s Anda'
    our_goals_title: Våra mål
    our_goals_content_html: >-
      <p>World Cube Association vill ge möjligheter till delaktighet och
      ledarskap för ungdomar runt om i världen genom att öka tillgängligheten
      för våra "twisty puzzle"-tävlingar. Vi tror att upplevelser vid tävlingar
      och inom vårt community skapar möjligheter till tillväxt för de
      involverade ungdomarna och att inkluderandet av nya grupper av människor
      gör det möjligt för vårt community att stärkas. Ett dokument som
      innehåller styrelsens strategiska plan för WCA finns <a
      href="https://documents.worldcubeassociation.org/documents/WCA_Strategic_Plan.pdf">här</a>.</p>
    whats_next_title: Hur ser framtiden för WCA ut?
    whats_next_content_html: >-
      <p>World Cube Association har haft över 245 000 unika tävlande i 158 olika
      regioner och vi planerar inte att sakta in! Kubintresset har ökat stadigt
      sedan grundandet 2004 och vi vill möjliggöra detta att fortsätta in i
      framtiden genom att öka tillgängligheten av tävlingar till nya områden. I
      framtiden hoppas vi kunna stötta vårt community ännu mer genom samarbeten
      och att nå ut till alla som bryr sig om pussel.</p>
    world_championship_title: Världsmästerskap
    world_championship_content_html: >-
      <p>Vartannat år erkänner vi tävlingen som i utser världsmästaren. Dessa
      evenemang kräver extremt noggrann planering av ett antal volontärer, samt
      ett stort ekonomiskt åtagande för tävlingslokalen och nödvändiga
      förberedelser.</p>
    contributing_title: Stötta oss
    contributing_content_html: >-
      Du kan donera med kreditkort med Guidestar %{here_credit}, eller med
      Paypal %{here_paypal}. Om du föredrar att skriva en check kan du skriva
      till:
    tax_deductible_note: Donationer är avdragsgilla i USA.
    other_help_title: Andra sätt att hjälpa till
    other_help_content_html: >-
      <p>Om du tror att du skulle kunna bidra till World Cube Association på ett
      icke-ekonomiskt sätt, vill vi gärna höra från dig! Vänligen kontakta oss
      på <a
      href="mailto:communication@worldcubeassociation.org">communication@worldcubeassociation.org</a>.</p>
    donation_banner:
      content: >-
        World Cube Association är en skattebefriad organisation (501(c)(3)). Som
        en 100% ideellt ledd organisation driven av volontärer välkomnar vi dina
        donationer för att hjälpa oss att främja vår vision om att ha roligare
        tävlingar över hela världen.
      donate_credit: Donera via kreditkort
      donate_paypal: Donera via Paypal
      donate_other: Andra sätt att donera
    structure:
      title: Struktur
      board:
        description: >-
          WCA-styrelsen är ansvarig för att leda organisationen som helhet, och
          fullgöra alla uppgifter som inte uppfylls av andra team och kommittéer
      users:
        profile: '%{user_name}s profil'
      operations_html: 'Den dagliga verksamheten drivs av WCA:s %{committees_and_teams}.'
      teams_committees: Team och Kommittéer
      delegates_html: >-
        <p><strong>WCA-delegat</strong> är en roll som definieras i WCA:s
        motioner och beskrivs i WCA-reglerna. En delegats primära roll är att
        överse tävlingar på uppdrag av WCA. En WCA-delegat är ansvarig för att
        se till att alla WCA-tävlingar hålls enligt WCA:s verksamhetsmål, anda,
        och regler. WCA skiljer mellan <strong>senior-delegater</strong>,
        <strong>regionala delegater</strong>, <strong>fulltsändiga
        delegater</strong>, <strong>junior-delegater</strong>, och
        <strong>trainee-delegater</strong> %{see_link}.</p> <p>Utöver en
        WCA-delegats uppgifter är en renior-delegat eller regional delegat
        ansvarig för att hantera WCA-delegaterna i deras område och kan också
        kontaktas av communityt för regionala frågor.</p> <p> Nya delegater
        listas först som junior-delegater; därefter behöver de att visa
        kompetens i att hantera WCA-tävlingar innan de befordras till
        WCA-delegater. </p> <p> Trainee-delegater är under utbildning för
        positionen som WCA-delegat och kan bara överse tävlingar där en
        WCA-delegat är närvarande. </p>
      see_link_html: '(se %{link})'
      members_html: >-
        Alla tävlande blir automatiskt <strong>medlemmar</strong> i WCA vid sin
        första WCA-tävling.
