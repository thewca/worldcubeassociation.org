    how_to:
      title: Bli erkänd av WCA som Regional Organisation
      description: >-
        WCA erkänner flera regionala organisationer över hela världen. Syftet
        med en regional organisation är att organisera WCA-tävlingar och stödja
        WCA:s aktiviteter i regionen. Regioner som vill bilda en regional
        organisation uppmuntras att bidra till WCA i sitt område innan de lämnar
        in sin ansökan. Kontakta din närmaste WCA-delegat för hjälp med att
        arrangera en WCA-tävling i ditt område.
    requirements:
      title: Krav för Regionala Organisationer
      list:
        '1': >-
          Att aktivt arrangera eller stödja WCA-tävlingar i organisationens
          region
        '2': >-
          Att bidra till kontinentala WCA-tävlingar som hålls på den Regionala
          Organisationens kontinent, om det krävs av tävlingens arrangörsteam
        '3': 'Att respektera och utföra Målen i WCA:s Stadgar och Motioner'
        '4': Att följa alla tillämpliga WCA-regler
        '5': 'Att acceptera och följa beslut från WCA:s funktionärer'
        '6': >-
          Att tillhandahålla WCA med en uppdaterad kopia av orgnisationens
          stadgar och, om tillämpligt, regler i elektroniskt format
