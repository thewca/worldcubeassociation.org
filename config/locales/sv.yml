  score_tools:
    title: Mjukvaruverktyg för WCA-tävlingar
    wca_icon_text: Utvecklas och underhålls av WST
    intro:
      desc: >-
        Denna sida är en lista över verktyg som är kan användas för att
        underlätta arrangerandet av WCA-tävlingar.
      disclaimer: >-
        Alla verktyg på den sidan underhålls inte av WST: och det är bra! Vi har
        inte resurser för att hantera all WCA-relaterad programvara :)
      used: >-
        Alla program i den här listan har använts under riktiga WCA-tävlingar
        och integreras med WCA:s hemsida: de låter dig logga in med ditt
        WCA-konto för att kunna importera (och ibland uppdatera) data för dina
        kommande tävlingar. Underhållaren anges tydligt för varje programvara.
    before:
      title: Före tävlingen
      desc: >-
        Du kan hantera anmälningar direkt på WCA:s hemsida. Eftersom det kan
        vara tidskrävande att hantera grupper och funktionärer manuellt kan du
        överväga att använda något av verktygen nedan.
    during:
      title: Under tävlingen
      desc: >-
        Här hittar du verktyg som låter dig hantera tävlingsresultaten medan
        tävlingen pågår.
    after:
      title: Efter tävlingen
      desc: >-
        Resultatvalidering sker direkt på hemsidan, men måste du använda ett
        verktyg för att matcha blandningar som genereras av TNoodle till
        resultaten som skickas till WCA:s hemsida.
    tools:
      age:
        title: AGE
        description: >-
          Verktyg för att generera och redigera grupper/uppgifter för
          WCA-tävlingar
      certificates:
        title: Certifikat
        description: Skriv ut certifikat för WCA-tävlingar med WCA Live
      groupifier:
        title: Groupifier
        description: >-
          Uppgifts- och grupphanteringsverktyg för arrangörer av WCA-tävlingar.
          Bland funktionerna hittar du: sortera tävlande efter rankning,
          tilldela uppgifter (döma, blanda), bestämma hur många blandare som
          behövs, generera resultatkort, personliga scheman, och
          sammanfattningar... Se hemsidan för att läsa mer.
      scorecards:
        title: Resultatkort
        description: Skriv ut resultatkort för WCA-tävlingar med WCA Live
      tnoodle:
        title: TNoodle (Blandningar)
        description: >-
          TNoodle är det officiella blandningsprogrammet som används för
          WCA-tävlingar. Det används vanligtvis av WCA-delegater före
          WCA-tävlingar, men det är även möjligt för vem som helst att generera
          alla sorters blandningar för alla WCA-grenar.
      live:
        title: WCA Live
        description: >-
          Plattform för att hålla WCA-tävlingar och dela live-resultat med
          världen.
      nightmare:
        title: Kalkylblad för resultat
        description: >-
          Ibland händer det saker... Om du inte har nätverksåtkomst behöver du
          använda det gamla goda kalkylarket.
      matcher:
        title: Scrambles Matcher
        description: >-
          Kan användas för att matcha blandningar genererade av TNoodle med
          resultat. Importera resultat från WCA:s hemsida (om du använder WCA
          Live), ett kalkylark, eller en fristående WCIF-fil. Importera
          blandningar från en eller flera TNoodle json-filer. Exportera resultat
          till lämpligt format för inskickning till WCA.
      groups:
        title: Tävlingsgrupper
        description: Visa tävlingsgrupper för en pågående tävling
  logo:
    title: 'WCA:s Logotyp'
    intro: >-
      WCA:s logotyp ritades av Justin Eastman i en designtävling i januari 2005.
      Vi gillade logotypen på grund av dess design, färgerna, och det faktum att
      den inte specifikt visar en 3x3x3-kub.
    headings:
      usage_guidelines:
        title: Riktlinjer för användning
        paragraph:
          acceptable_usage: >-
            Acceptabel användning av WCA:s logotyp beskrivs i <a
            href="https://documents.worldcubeassociation.org/documents/policies/external/Logo%20Usage.pdf">WCA
            Logo Usage Policy</a>. Vänligen läs detta dokument innan du använder
            WCA-logotypen i dina egna projekt. Skicka eventuella ytterligare
            frågor om användning av WCA:s logotyp till <a
            href="mailto:marketing@worldcubeassociation.org"> WCA Marketing
            Team</a>.
          see_below: >-
            Nedan finns ytterligare riktlinjer för korrekt användning av WCA:s
            logotyp.
        color:
          title: Färg
          paragraph: >-
            WCA:s logotyp finns i fyra färgvarianter. Rätt färgvariant ska
            användas beroende på bakgrundsfärgen på det medium där logotypen
            placeras.
          primary:
            title: Primär
            paragraph: Använd den primära varianten när det är möjligt.
          mono:
            title: Mono
            paragraph: >-
              Använd endast mono-varianten när primära varianten inte är
              lämplig.
        logo_only:
          title: Enbart logotyp
          paragraph: >-
            WCA:s logotyp kan användas utan logotypen, enligt samma
            färgriktlinjer som ovan.
      download_logo_assets:
        title: Ladda ner logotypmaterial
        paragraph: >-
          Högupplösta PNG- och vektorversioner av WCA:s logotyp finns
          tillgängliga för nedladdning.
        accept_terms_and_conditions: >-
          Jag har läst och accepterat <a
          href="https://documents.worldcubeassociation.org/documents/policies/external/Logo%20Usage.pdf">WCA
          Logo Usage Policy</a>.
        download_button_text: Ladda ner logotypmaterial
