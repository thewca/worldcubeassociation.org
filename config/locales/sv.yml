  about_regulations:
    title: Om reglerna
    panel1:
      title: Regler
      content1_html: >-
        Alla tävlingar måste följa <a href="/regulations/">WCA-reglerna</a>. Det
        är viktigt att tävlande läser dessa regler innan de deltar i sin första
        tävling.
      content2_html: >-
        Viktiga beslut om incidenter på tävlingar som hanterats av WCA
        Regulations Committee hittas i <a href="/incidents">incident-loggen</a>.
    panel2:
      title: Översättningar
      content1_html: >-
        WCA-reglerna är inte bara tillgängliga på engelska, WCA-medlemmar har
        översatt dem till flera språk: <a
        href="/regulations/translations/">Översättningar</a>.
      content2_html: >-
        <strong>Viktigt</strong>: Även om översättningarna är mycket hjälpsamma
        är de inte officiella. Det är den engelska versionen av WCA-reglerna som
        är bindande.
    panel3:
      title: Vanliga frågor om reglerna
      content1_html: >-
        Sektionen <a href="/faq">Vanliga Frågor</a> svarar på flera vanliga
        frågor om WCA-reglerna.
    panel4:
      title: Riktlinjer för arrangörer
      content1_html: >-
        Om du är intresserad av att arrangera en tävling eller redan planerar
        att arrangera en, läs våra <a href="https://documents.worldcubeassociation.org/edudoc/organizer-handbook/organizer-handbook.pdf">Riktlinjer
        för arrangörer</a>.
      content2_html: >-
        Detta dokument innehåller viktig information och bör läsas av alla
        tävlingsarrangörer.
  regulations_translations:
    title: 'WCA-regler: Översättningar'
    paragraph1: >-
      Om du talar ett annat språk än engelska kan dessa översättningar vara
      användbara.
    paragraph2: >-
      Observera att översättningar inte har någon officiell status, även om de
      finns på WCA:s hemsida: de har inga garantier. Om det finns någon skillnad
      mellan en översättning och den (nuvarande officiella) engelska versionen,
      måste den engelska versionen användas.
