      incident:
        title: Lembre-se que isto é público e que tem que ser preenchido em 
          inglês!
        private_description: >-
          Uma descrição do incidente que apenas poderá ser visto por Delegados.
          Por favor, preencha em inglês.
        private_wrc_decision: >-
          A decisão final da WRC, incluindo partes privadas. Por favor,
          preencher em inglês.
        public_summary: >-
          Uma descrição geral do incidente e sua decisão, para ser apresentada
          publicamente. Por favor preencha em inglês.
      user:
        dob: Introduza a data de nascimento do competidor no formato AAAA-MM-DD.
        name: >-
          Introduza o nome do competidor corretamente, por exemplo <strong>Luís
          Vaz de Camões</strong>, não desleixadamente como <strong>luis v
          camoes</strong>. Nomes do meio (completos ou iniciais) são opcionais.
        pending_avatar: >-
          Após carregar um avatar novo, terá que aguardar a sua aprovação pela
          Equipa de Resultados da WCA.
        registration_notifications_enabled: >-
          Isto aplica-se apenas para competições que organizar ou for delegado e
          podem ser alteradas para cada competição.
        receive_developer_mails: >-
          Isto limita-se a notificações de alterações de versão principais em
          funcionalidades como exportações de dados, esquema WCIF e APIs
          públicas. Recomendado para programadores que mantêm software que
          depende destas ferramentas.
        receive_delegate_reports: >-
          Se for Delegado Sénior ou membro do WRC ou do WQAC, recebe Relatórios
          de Delegados por defeito. Nota: a alteração pode levar até 12 horas a
          tomar efeito.
        delegate_reports_region: >-
          Se pretender receber todos os relatórios, deixe este campo em branco
          (a opção pendente no topo). Nota: a alteração pode demorar até 12
          horas para entrar em vigor.
        otp_attempt: >-
          Verifique a aplicação móvel configurada para uma password ou insira um
          dos seus códigos de recuperação.
      dob_contact:
        dob: A sua data de nascimento válida no formato AAAA-MM-DD
        document: >-
          Para nos provar a sua identidade e data de nascimento, deve anexar uma
          fotografia de um documento legal (cartão de cidadão, bilhete de
          identidade, passaporte, carta de condução, ... ) onde o seu nome e
          data de nascimento sejam visíveis e entendíveis por alguém que entenda
          inglês (ou contacte um Delegado da WCA local se não tiver tal
          documento). Na identificação é necessário pelo menos o nome e a data
          de nascimento; é possível desfocar/esconder outra informação pessoal
          na identificação.
      post:
        body: >-
          Use a tag &lt;!-- break --&gt; para mostrar uma previsão na página
          principal. Todo o texto antes desta divisória será mostrado na página
          principal. O texto completo será mostrado ao clicar no post.
        show_on_homepage: >-
          Cuidado! Isto não é seguro para dados privados. Isto é apenas para
          prevenir confusão na página inicial. Artigos que não são mostrados na
          página inicial são acessíveis ao público por link permanente ou por
          tags.
      delegate_report:
        schedule_url: >-
          Hiperligação para o cronograma publicado (p. ex.
          https://www.cubingusa.com/usnationals2016/schedule.php)
        equipment: >-
          Número e tipo de timers e displays usados na competição. Remova a(s)
          linha(s) de equipamentos que não foram usados.
        summary: >-
          Os pontos acima enumerados são apenas orientação para um relatório
          completo. Utilize-os a seu critério para o que achar adequado. Remova
          as partes que não sejam utilizadas!
        venue: >-
          Os pontos listados acima são apenas um guia para o relatório completo.
          Use-os segundo o seu critério para o que acha que se enquadra. Por
          favor remova as partes não utilizadas!
        organization: >-
          Os pontos listados acima são apenas um guia para um relatório
          completo. Use-os segundo o seu critério para o que achar relevante.
          Por favor remova o que não utilizar!
        incidents: >-
          Por favor informe todos os incidentes que sejam não triviais.
          Numere-os começando em 1, para que outros Delegados possam comentar
          usando os números como referência. Mesmo que tudo pareça genérico,
          liste pelo menos os mais relevantes. Por favor assinale as caixas
          apropriadas se precisar de obter feedback.
        setup_images: >-
          TEM de incluir pelo menos %{image_count} imagens que ilustrem a
          configuração das áreas de embaralhamento e da competição da competição
          atual, preferencialmente durante a competição (outras imagens também
          são bem-vindas). Pode selecionar vários ficheiros de uma só vez. Só
          pode eliminar imagens quando tiverem sido carregadas outras imagens
          suficientes (se quiser substituir uma imagem, precisa de carregar a
          nova primeiro e depois eliminar a antiga). Caso não possua fotos
          atuais da área de competição e/ou da área de embaralhamento em
          utilização, por favor, explique o motivo.
        wrc_incidents: >-
          Lista de números referenciando qualquer incidente que gostaria de
          obter feedback pelo WRC.
        wic_incidents_html: >-
          Lista de números que fazem referência a quaisquer incidentes sobre os
          quais gostaria de receber feedback do WIC. <br>
          <strong>%{wic_incident_alert}</strong>
        wic_incident_alert: >-
          Se o incidente do WIC for delicado (incluindo, mas não se limitando a
          crimes, assédio, agressão, etc), exclua isso do seu relatório e envie
          um e-mail ao WIC separadamente. Para outros incidentes do WIC, utilize
          uma versão breve e anónima do incidente e faça um seguimento com o WIC
          em privado para fornecer mais detalhes. O WIC ainda fornecerá feedback
          sobre versões anonimizadas para sensibilização geral. Para todos os
          incidentes do WIC que envolvam um voluntário do WCA, apague todos os
          detalhes do relatório e contacte o WIC em privado.
        remarks: >-
          Fale sobre qualquer outro detalhe que gostaria de partilhar (p. ex.
          melhoria/regressão na comunidade, planos futuros para esta região). Se
          omitiu algo nas seções anteriores para ser conciso, pode comentar
          aqui.
      competition_tab:
        name: 'Exemplos: Como chegar, Pagamento, Prémios, Acomodações'
      regional_organization:
        website: Tem que ser um url http(s) válido. HTTPS é recomendado
        logo: 'Deve ser em formato PNG, com boa resolução e de fundo transparente'
        email: Deve ser uma mailing list que contenha todos os Diretores e 
          Oficiais
        bylaws: Tem de ser em formato PDF
        extra_file: >-
          Tem de ser em formato PDF. Se precisar de mais ficheiros, deverá
          uni-los num mesmo ficheiro
    options:
      registration:
        status:
          accepted: Aceite
          pending: Lista de espera
          deleted: Excluído
