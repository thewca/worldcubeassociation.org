    intro:
      desc: >-
        Esta página é uma lista não exaustiva de ferramentas conhecidas a ser
        usadas na organização de competições da WCA.
      disclaimer: >-
        Nem todas as ferramentas nesta página são mantidas pela WST: é normal!
        Não temos gente suficiente para gerir todo o software relacionado com a
        WCA :)
      used: >-
        Todos os programas desta lista foram usados durante competições da WCA
        reais e integram-se com o site da WCA: permitem autenticação com a conta
        da WCA e permitem importar (e por vezes atualizar) dados de competições
        futuras. Para cada um, o seu gestor estará claramente visível.
    before:
      title: Antes da competição
      desc: >-
        Gerir registos de competidores pode ser feito diretamente no site da
        WCA. Uma vez que gerir grupos e voluntários manualmente pode consumir
        muito tempo, deve considerar usar uma das ferramentas abaixo.
    during:
      title: Durante a competição
      desc: >-
        Aqui irá encontrar ferramentas que permitem gerir os resultados de uma
        competição enquanto esta decorre.
    after:
      title: Depois da competição
      desc: >-
        Enquanto decorre a validação dos resultados no site, tem que se usar uma
        ferramenta que permita associar os embaralhamentos gerados pelo TNoodle
        aos resultados submetidos no site da WCA.
    tools:
      age:
        title: AGE
        description: Ferramenta para gerar e editar grupos/tarefas para 
          competições da WCA
      certificates:
        title: Certificados
        description: Imprimir certificados para competições WCA usando WCA Live
      groupifier:
        title: Groupifier
        description: >-
          Ferramenta de gestão de tarefas e de grupos para organizadores de
          competições WCA. Entre as suas funcionalidades: ordenar competidores
          por ranking, atribuir tarefas (ajuizar, embaralhar), decidir quandos
          embaralhamentos são necessários, gerar folhas de resultados, folhas
          individuais, sumários... Consulte o site da ferramenta para mais
          informação.
      scorecards:
        title: Folhas de resultados
        description: Imprimir folhas de resultados para competições WCA usando 
          WCA Live
      tnoodle:
        title: TNoodle (Embaralhamentos)
        description: >-
          TNoodle é o programa oficial de embaralhamento usado em competições
          WCA. É tipicamente usado por Delegados da WCA antes de competições,
          mas o seu interface também permite a qualquer pessoa gerar qualquer
          tipo de embaralhamentos para todos os eventos da WCA.
      live:
        title: WCA Live
        description: >-
          Plataforma de gestão de competições WCA e partilha de resultados em
          direto com o mundo.
      nightmare:
        title: Folha de cálculo de resultados
        description: >-
          Por vezes coisas acontecem... Se não houver internet, terá que se usar
          uma folha de cálculo.
      matcher:
        title: Responsável pela correspondência dos embaralhamentos
        description: >-
          Pode ser usado para atribuir embaralhamentos gerados pelo TNoodle aos
          resultados. Importa resultados do site da WCA (quando se usa WCA
          Live), uma folha de cálculo ou um ficheiro WCIF isolado. Importa
          embaralhamentos de um ou mais ficheiros json do TNoodle. Exporta
          resultados para o formato apropriado para a submissão à WCA.
      groups:
        title: Grupos de competição
        description: Ver grupos de competição para qualquer competição em 
          andamento
  logo:
    title: Logótipo da WCA
    intro: >-
      O logótipo da WCA foi desenhado por Justin Eastman, num concurso de design
      em Janeiro de 2005. Gostámos do logótipo pelo seu design, pelas cores e
      pelo facto de não mostrar especificamente um cubo 3x3x3.
    headings:
      usage_guidelines:
        title: Diretrizes de Uso
        paragraph:
          acceptable_usage: >-
            Uso aceitável do logótipo da WCA está descrito na <a
            href="https://documents.worldcubeassociation.org/documents/policies/external/Logo%20Usage.pdf">Política
            de uso do logótipo da WCA</a>. Por favor, leia este documento antes
            de usar o logótipo da WCA nos seus próprios projetos. Envie
            quaisquer perguntas adicionais sobre o uso do logótipo da WCA para a
            <a href="mailto:marketing@worldcubeassociation.org">Equipa de
            Marketing da WCA</a>.
          see_below: >-
            Abaixo estão diretrizes de estilo adicionais para o uso correto do
            logótipo da WCA.
        color:
          title: Cor
          paragraph: >-
            O logótipo da WCA existe em quatro variantes de cores. A variante de
            cor correta deve ser usada dependendo da cor de fundo do local onde
            o logótipo é colocado.
          primary:
            title: Primária
            paragraph: Use a variante primária sempre que possível.
          mono:
            title: Mono
            paragraph: >-
              Use a variante mono apenas quando a variante primária não for
              adequada.
        logo_only:
          title: Apenas Logótipo
          paragraph: >-
            O logótipo da WCA pode ser usado sem o texto associado, seguindo as
            mesmas diretrizes de cores acima.
      download_logo_assets:
        title: Descarregar Recursos do Logótipo
        paragraph: >-
          PNGs de alta resolução e versões vetoriais do logótipo da WCA estão
          disponíveis para descarregar.
        accept_terms_and_conditions: >-
          Li e aceito a <a
          href="https://documents.worldcubeassociation.org/documents/policies/external/Logo%20Usage.pdf">Política
          de uso do logótipo da WCA</a>.
        download_button_text: Descarregar Recursos do Logótipo
