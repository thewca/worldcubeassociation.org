      Um token de acesso OAuth pode ser usado, até que expire, para fazer
      solicitações de API autorizadas. Por exemplo, para aceder a informações
      sobre a sua conta:
    legal_tnoodle_api_header: Versão TNoodle legal
    login_message: Por favor faça login
  merch:
    title: Merchandise WCA
    paragraphs:
      '1': >-
        A WCA tem merchandise exclusivo disponível para compra! De t-shirts a
        blusões, autocolantes, tapetes stackmat, mochilas e muito mais! Os
        nossos designs são constantemente atualizados, incluindo o logótipo
        clássico da WCA, merchandise oficial do Campeonato do Mundo e designs de
        Recordes Mundiais.
      '2': >-
        Comprar produtos da WCA nas nossas lojas é uma das melhores maneiras de
        poder apoiar a WCA - uma organização sem fins lucrativos gerida por
        voluntários. Usamos todos os lucros de merchandise para financiar
        campeonatos, equipamentos e outras atividades relacionadas com a WCA.
      '3': >-
        Pode comprar os nossos produtos em todo o mundo - com lojas diretas na
        Europa, América e Índia e mais para vir em breve!
  database:
    results_export:
      heading: Exportação de Resultados WCA
      deprecation_warning: >-
        AVISO DE OBSOLESCÊNCIA: A versão %{old_version} da Exportação de
        Resultados foi descontinuada e o suporte para a mesma será encerrado a
        partir de %{deprecation_date}. Por favor utilize a versão %{new_version}
        antes dessa data.
      description: >-
        Nesta página oferecemos os resultados da WCA para download em diversos
        formatos para que os possa utilizar/analisar em geral. Normalmente,
        atualizaremos após cada fim de semana de competição, quando os
        resultados forem finalizados. Os arquivos são numerados e datados para
        que possa ver se já possui a versão mais recente.
      permalink: link permanente
      permalink_note: >-
        Nota: os links permanentes fornecem a versão mais recente exportada
        dentro de uma determinada versão; ou seja, o link permanente da versão 2
        irá devolver a versão mais recente exportada da versão 2, mas
        permanecerá na versão 2 mesmo quando a versão 3 for lançada.
      file_formats:
        sql: 'Instruções SQL, para importação em bases de dados SQL.'
        tsv: >-
          Valores separados por tabulações, para folhas de cálculo no
          OpenOffice.org, Excel, etc.
      hint_readme_html: >-
        O ficheiro %{readme_filename} incluído contém os termos de uso e uma
        descrição geral (em inglês, não traduzido):
    developer_export:
      heading: Exportação de Desenvolvimento da WST
      description_html: >-
        Nesta página, oferecemos a exportação de desenvolvimento da WST para
        download como dump SQL. Os detalhes podem ser encontrados em
        %{github_link}.
      download: Download
  validators:
    persons:
      dob_is_jan_one_warning: >-
        A data de nascimento de %{name} é 1 de janeiro, certifique-se de que
        está correta.
      dob_is_too_young_warning: '%{name} parece ter menos de 3 anos, certifique-se
        de que está correto.'
      dob_is_too_old_warning: '%{name} parece ter perto de 100 anos, certifique-se
        de que está correto.'
      person_doesnt_have_any_results_error: 'Não existem resultados para %{person_name}
        com ID de pessoa %{person_id}'
      results_not_associated_with_any_person_error: >-
        Existem resultados para uma pessoa desconhecida com ID de pessoa
        %{person_id}
      whitespace_in_name_error: >-
        A pessoa '%{name}' tem espaços em branco à esquerda/à direita ou espaços
        em branco duplos.
      person_with_non_existing_wca_id_error: 'A pessoa %{name} tem um ID da WCA que
        não existe: %{wca_id}.'
      no_space_before_parenthesis_error: 'O parêntesis de abertura em ''%{name}''
        deve ser precedido por um espaço.'
      same_person_name_warning: >-
        Já existe pelo menos uma pessoa com o nome '%{name}' na base de dados do
        WCA (%{wca_ids}). Certifique-se de que o seu '%{name}' é uma pessoa
        diferente. Caso contrário, atribua o ID WCA correto à conta de
        utilizador e gere novamente o JSON de resultados.
      non_matching_dob_warning: >-
        A data de nascimento '%{dob}' fornecida para %{name} (%{wca_id}) não
        corresponde ao registo atual na base de dados da WCA
        ('%{expected_dob}'). Se isto for um erro, corrija-o. Caso contrário,
        deixe um comentário para a WRT sobre isso.
      non_matching_gender_warning: >-
        O género '%{gender}' fornecido para %{name} (%{wca_id}) não corresponde
        ao registo atual na base de dados da WCA ('%{expected_gender}'). Se isto
        for um erro, corrija-o. Caso contrário, deixe um comentário para a WRT
        sobre isso.
      empty_gender_warning: >-
        O género do novo competidor %{name} está vazio. Os valores de género
        válidos são "feminino", "masculino" e "outro". Por favor, deixe um
        comentário para o WRT sobre isto.
      non_matching_name_warning: >-
        O nome '%{name}' fornecido para %{wca_id} não corresponde ao registo atual
        na base de dados da WCA ('%{expected_name}'). 
      non_matching_country_warning: >-
        O país '%{country}' fornecido para %{name} (%{wca_id}) não corresponde
        ao registo atual na base de dados da WCA ('%{expected_country}'). Se
        isto for um erro, corrija-o. Caso contrário, deixe um comentário para a
        WRT sobre isso.
      multiple_newcomers_with_same_name_warning: >-
        Existem vários novos competidores com exatamente o mesmo nome: %{name}.
        Certifique-se de que todos os resultados estão corretos para estes
        competidores e que todos os resultados estão corretamente separados
        pelos seus IDs correspondentes.
      wrong_parenthesis_type_error: >-
        O parêntesis utilizado em '%{name}' é um caracter irregular. Substitua-o
        por um parêntesis regular '(' ou ')' e com um espaçamento adequado.
      special_characters_in_name_warning: >-
        O nome '%{name}' contém caracteres especiais inválidos (como números,
        aspas ou outros símbolos). Os nomes devem conter apenas letras, espaços,
        hífens, apóstrofos, pontos e parêntesis comuns.
      successive_uppercase_name_warning: >-
        '%{name}' tem letras maiúsculas consecutivas no seu nome. Por favor,
        confirme se esta é realmente a ortografia correta ou corrija o nome.
      lowercase_name_warning: >-
        '%{name}' tem um nome todo em minúsculas. Por favor, confirme se esta é
        realmente a ortografia correta ou corrija o nome.
      missing_period_in_single_letter_middle_name_warning: >-
        '%{name}' tem um nome do meio com uma única letra e sem ponto para
        abreviatura. Por favor, confirme se esta é realmente a ortografia
        correta ou corrija o nome.
      letter_after_period_warning: >-
        '%{name}' não tem um espaço após um ponto no nome. Por favor, confirme
        se esta é realmente a ortografia correta ou corrija o nome.
      single_letter_first_or_last_name_warning: >-
        '%{name}' tem uma única letra como primeiro ou último nome. Por favor,
        corrija o nome ou confirme se este é realmente o nome correto do
        competidor, de acordo com um documento oficial.
      single_name_warning: >-
        '%{name}' tem apenas um nome. Por favor, confirme se este é realmente o
        nome completo do competidor, de acordo com um documento oficial.
      competitor_limit_exceeded_warning: >-
        O número de pessoas na competição (%{n_competitors}) está acima do
        limite de competidores (%{competitor_limit}). Os resultados dos
        competidores registados após o limite de competidores ter sido atingido
        têm que ser removidos.
      suspicious_last_name_warning: "'%{name}' tem '%{suffix}' como apelido, mas este
        poderá não ser um apelido verdadeiro (por exemplo, poderá tratar-se de um
        sufixo geracional escrito por extenso). Confirme se este é o apelido legal
        da pessoa ou substitua-o/remova-o, conforme adequado."
      registration_details_mismatch_warning: 'A pessoa com o ID de inscrição %{person_id}
        (%{name}) tem dados que não correspondem aos da respetiva inscrição: %{mismatches}'
      missing_matching_registration_warning: Não foi encontrada nenhuma 
        inscrição correspondente para %{name}.
      unaccepted_registration_with_results_warning: A pessoa %{name} tem 
        resultados na competição, mas a respetiva inscrição não está marcada 
        como 'aceite'.
    results:
      automatically_position_fixed_info: >-
        [%{round_id}] Corrigiu automaticamente a posição de %{person_name} de
        %{pos} para %{expected_pos}.
      mbf_result_over_time_limit_warning: >-
        [%{round_id}] O resultado '%{result}' para %{person_name} ultrapassou o
        limite de tempo. Certifique-se de que isto se deve a penalizações de
        tempo antes de enviar os resultados ou corrija o resultado para DNF.
      result_after_dns_warning: >-
        [%{round_id}] %{person_name} tem pelo menos um resultado DNS seguido de
        um resultado válido. Certifique-se de que é realmente um DNS e, em caso
        afirmativo, explique o que aconteceu para o WRT.
      similar_results_warning: >-
        [%{round_id}] Os resultados para %{person_name} são semelhantes aos
        resultados para %{similar_person_name}. Certifique-se de que estes
        resultados estão registados corretamente para ambos os competidores.
      met_cutoff_but_missing_results_error: >-
        [%{round_id}] %{person_name} atingiu o tempo de corte, mas não há
        resultados para a segunda parte da ronda. O tempo de corte foi de
        %{cutoff}.
      didnt_meet_cutoff_but_has_results_error: >-
        [%{round_id}] %{person_name} tem pelo menos um resultado na segunda
        parte da ronda, mas não atingiu o tempo de corte. O tempo de corte foi
        de %{cutoff}.
      wrong_attempts_for_cutoff_error: >-
        [%{round_id}] %{person_name} tem em falta pelo menos uma tentativa da
        fase de corte. Edite o resultado para incluir a(s) tentativa(s) em falta
        ou atualize as informações da ronda na página Gerir Eventos da
        competição.
      result_over_time_limit_error: >-
        [%{round_id}] Pelo menos um resultado para %{person_name} excedeu o
        tempo limite da ronda, que é de %{time_limit} por tentativa. Todas as
        soluções que excedam o tempo limite devem ser alteradas para DNF.
      results_over_cumulative_time_limit_error: >-
        [%{round_ids}] A soma de resultados para %{person_name} está acima do
        limite de tempo cumulativo, que era %{time_limit}.
      undefined_time_limit_warning: >-
        [%{round_id}] O limite de tempo para esta ronda é indefinido. As
        validações de limite de tempo foram ignoradas. Isto é apenas esperado
        para competições anteriores a 2013.
      suspicious_dnf_warning: >-
        [%{round_ids}] A ronda tem um limite de tempo cumulativo e, extrapolando
        com base nas resoluções bem-sucedidas de %{person_name}, teriam muito
        pouco tempo restante para pelo menos um dos seus DNFs. Certifique-se de
        que todos os DNFs e DNSs estão corretos. Se o competidor não iniciou uma
        tentativa ou não tinha tempo restante antes de iniciar uma tentativa,
        deve ser introduzido como DNS.
      missing_cumulative_round_id_error: >-
        [%{original_round_id}] Não foi possível encontrar a ronda %{wcif_id}
        para o limite de tempo cumulativo especificado no WCIF. Aceda à página
        Gerir Eventos da competição e remova %{wcif_id} do limite de tempo
        cumulativo para %{original_round_id}. A WST está ciente deste bug (issue
        #3254 do GitHub).
      wrong_position_in_results_error: >-
        [%{round_id}] %{person_name} está na posição errada: esperado
        %{expected_pos}, mas obteve %{pos}.
      automatically_global_position_fixed_info: '[%{round_id}] A classificação geral
        de %{person_name} foi corrigida automaticamente de %{pos} para %{expected_pos}.'
      wrong_global_position_in_results_error: '[%{round_id}] %{person_name} está numa
        posição incorreta na classificação geral: era esperada a posição %{expected_pos},
        mas ficou na posição %{pos}.'
    rounds:
      too_many_qualified_warning: >-
        Ronda %{round_id}: mais competidores qualificaram-se do que o planeado
        pela condição de avanço (%{actual} em vez de %{expected}, a condição
        era: %{condition}). Atualize as informações da ronda na página de gestão
        de eventos.
      regulation_9m1_error: >-
        A ronda %{round_id} tem 99 ou menos competidores, mas tem mais de duas
        rondas subsequentes, o que não é permitido de acordo com o Regulamento
        9m1.
      regulation_9m2_error: >-
        A ronda %{round_id} tem 15 ou menos competidores, mas tem mais do que
        uma ronda subsequente, o que não é permitido de acordo com o Regulamento
        9m2.
      regulation_9m3_error: >-
        A ronda %{round_id} tem 7 ou menos competidores, mas tem pelo menos uma
        ronda subsequente, o que não é permitido de acordo com o Regulamento
        9m3.
      regulation_9p1_error: >-
        Ronda %{round_id}: Menos de 25% dos competidores foram eliminados, o que
        não é permitido pelo Regulamento 9p1.
      no_competitor_eliminated_error: >-
        Ronda %{round_id}: Deve haver pelo menos um competidor eliminado, o que
        é exigido pelo Regulamento 9p (competições anteriores a Abril de 2010).
      less_than_twenty_five_percent_eliminated_error: >-
        Ronda %{round_id}: de acordo com a condição de avanço (%{condition}),
        menos de 25% dos competidores seriam eliminados, o que não é permitido
        pelo Regulamento 9p1. Atualize as informações da ronda na página de
        gestão de eventos.
      not_enough_qualified_warning: >-
        Ronda %{round_id}: de acordo com os dados do evento, no máximo
        %{expected} poderiam ter prosseguido, mas apenas %{actual} competiram na
        ronda. Deixe um comentário sobre isto (ou corrija os dados do evento se
        tiver aplicado uma condição de avanço diferente).
      competed_not_qualified_error: >-
        Ronda %{round_id}: %{ids} competiram, mas não cumpriram a condição de
        avanço de resultado da tentativa (%{condition}). Certifique-se de que a
        condição de avanço reflete o que foi utilizado durante a competição e
        remova os resultados, se necessário.
      round_not_found_error: >-
        A ronda %{round_id} não foi encontrada. Certifique-se de que o painel
        Editar Eventos do site da WCA e o WCA Live estão sincronizados.
      missing_round_results_error: >-
        Não existem resultados para a ronda %{round_id}, mas está listada no
        separador de eventos. Se esta ronda não tiver sido realizada, remova-a
        da página de gestão de eventos da competição.
    events:
      not_333_main_event_warning: >-
        O evento principal selecionado é %{main_event_id}. Embora isto tenha
        sido aprovado pela WCAT ANTES da competição, a WRT é responsável por
        garantir DEPOIS da competição que as diretrizes adequadas do evento
        principal da Política de Requisitos de Competição da WCA foram
        cumpridas. Por favor, indique uma ação que foi tomada para tratar
        %{main_event_id} como o evento principal DURANTE a competição (exemplos
        válidos: declarado vencedor da competição, maior número de rondas,
        prémio mais elevado).
      no_main_event_warning: >-
        Não há nenhum evento principal selecionado para esta competição. Por
        favor, informe a WRT que isto está correto.
      missing_results_warning: >-
        Não existem resultados para %{event_id}, mas está listado como um evento
        oficial. Se o evento foi realizado, envie novamente o seu JSON com os
        resultados incluídos. Se o evento não foi realizado, deixe um comentário
        para o WRT.
    scrambles:
      missing_scrambles_for_round_error: >-
        [%{round_id}] Embaralhamentos em falta. Utilize o Scrambles Matcher para
        adicionar os embaralhamentos corretos à ronda.
      missing_scrambles_for_competition_error: >-
        Faltam embaralhamentos para a competição. Utilize o Scrambles Matcher
        para adicionar embaralhamentos.
      missing_scrambles_for_group_error: >-
        [%{round_id}] Grupo %{group_id}: embaralhamentos em falta, apenas
        detetados %{actual} em vez de %{expected}.
      missing_scrambles_for_multi_error: >-
        [%{round_id}] Embora possa ter vários grupos no 3x3x3 Múltiplos Vendado,
        pelo menos um dos grupos deve conter embaralhamentos para todas as
        tentativas.
      multiple_fmc_groups_warning: >-
        [%{round_id}] Foram utilizados vários grupos de FMC. Se tiver sido
        utilizado apenas um grupo de FMC, utilize o Scrambles Matcher para
        desmarcar os embaralhamentos não utilizados. Caso contrário, inclua um
        comentário ao WRT explicando por que razão foram utilizados vários
        grupos de FMC.
      wrong_number_of_scramble_sets_error: >-
        [%{round_id}] Esta ronda tem um número diferente de conjuntos de
        embaralhamento do especificado no separador "Gerir Eventos". Ajuste o
        número de conjuntos de embaralhamento no separador "Gerir Eventos" para
        o número de conjuntos que foram utilizados.
      mbld_scrambles_warning: '[%{round_id}] Esta ronda inclui resultados de 3x3x3
        Múltiplos Vendados. Indique, no comentário da submissão, quantos embaralhamentos
        de cada conjunto foram efetivamente utilizados pelos competidores, para que
        a WRT possa remover os embaralhamentos extra que não foram utilizados.'
    schedule:
      activity_outside_competition_dates_warning: "A atividade '%{activity_name}'
        (código: %{activity_code}) está agendada fora do intervalo de datas da competição,
        de acordo com o fuso horário local do local da competição. Atualize o horário
        da competição para refletir as datas reais em que esta decorre."
