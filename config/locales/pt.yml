  about_regulations:
    title: Sobre os Regulamentos
    panel1:
      title: Regulamentos
      content1_html: >-
        Todas as competições devem seguir o <a href="/regulations/">Regulamento
        da WCA</a>. É importante para competidores ler este regulmanento antes
        de competir a primeira vez.
      content2_html: >-
        Decisões importantes sobre incidentes que ocorreram em competições que
        foram resolvidos pelo Comité de Regulamentos da WCA podem ser
        encontradas no <a href="/incidents.html">Registo de Incidentes</a>.
    panel2:
      title: Traduções
      content1_html: >-
        O Regulamento da WCA não existe apenas em Inglês, está traduzido por
        membros da WCA em diversas línguas: <a
        href="/regulations/translations/">Traduções</a>.
      content2_html: >-
        <strong>Importante</strong>: Apesar das traduções serem muito úteis, não
        são oficiais. Em competições, a versão inglesa do Regulamento da WCA é a
        aplicada.
    panel3:
      title: FAQ de Regulamentos
      content1_html: >-
        A <a href="/faq">seção FAQ</a> responde a várias questões frequentes
        sobre o Regulamento da WCA.
    panel4:
      title: Manual de Organizador
      content1_html: >-
        Se está interessado em organizar uma competição ou se já está a planear
        organizar uma, por favor leia as <a
        href="https://documents.worldcubeassociation.org/edudoc/organizer-handbook/organizer-handbook.pdf">Orientações
        para Organizadores</a>.
      content2_html: >-
        Este documento contém informação importante e deve ser lido por todos os
        organizadores de competições.
  regulations_translations:
    title: 'Regulamentos da WCA: Traduções'
    paragraph1: >-
      Se fala outra língua para além do Inglês, pode achar estas traduções
      úteis.
    paragraph2: >-
      Por favor note que estas traduções não têm caráter oficial, apesar de
      serem disponibilizadas no site da WCA: elas não vêm com qualquer garantia.
      Se houver uma diferença entre uma tradução e a versão inglesa (atual
      oficial), a versão inglesa tem de ser usada.
