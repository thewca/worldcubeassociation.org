  homepage:
    learn_more: Pata maelezo zaidi
    title: Karibu katika World Cube Association
    latest_news: Taarifa mpya
    announcements: Matangazo
    see_all_announcements: Ona matangazo yote
    about_us:
      title: Kuhusu sisi
      text: Chama cha World Cube Association kinasimamia mashindano ya mafumbo ya
        kimitambo yanayoendeshwa kwa kupotosha au kugeuza makundi ya vipande,
        yanayojulikana kama 'mafumbo ya kugeuzwa' (twisty puzzles).
    competitions:
      title: Mashindano
      text_html: Tafuta mashindano yaliyo karibu nawe au matokeo ya mashindano.
        Uko kwenye mashindano sasa hivi na unataka kuona matokeo? Angalia
        %{wca_live_link}!
    merchandise:
      title: Bidhaa za duka
      ad_new: Mpya
      text_html: Angalia bidhaa zetu rasmi zilizozinduliwa mpya ambazo
        zinajumuisha aina mbalimbali za mavazi kuanzia T-shati hadi Hoodi.
      link_title: Nenda kwenye duka
    records:
      title: Rekodi
      text: Angalia rekodi za sasa na za zilizopita za matukio yote rasmi ya WCA.
    volunteer:
      title: mtu anayejitolea
      text: Shiriki! WCA ina nafasi za kujitolea zilizowazi katika timu
        mbalimbali. Si lazima uwe mchezaji wa mafumbo ya Rubik ili uwe mtu
        anayejitolea.
    faq:
      title: FAQ
      text: Tazama orodha yetu ya Maswali Yanayoulizwa Mara kwa Mara ikiwa
        unahitaji msaada kwa jambo lolote. Maswali mengi uliyo nayo yanaweza kuwa
        na jibu huko.
    contact:
      title: wasiliana
      text_html: Ikiwa unataka kuwasiliana nasi, unaweza kufanya hivyo kupitia
        fomu yetu ya mawasiliano. Ikiwa una maswali yoyote kuhusu michakato
        mbalimbali ya WCA, hakikisha umepitia %{faq_link} yetu!
      faq: Maswali ya Mara kwa Mara
      button: Nipeleke kwenye Fomu ya Mawasiliano ya WCA
    support:
      title: Uwaunge Mkono WCA
      text: World Cube Association ni shirika lisilo la kodi la 501(c)(3). Kama
        shirika lisilo la faida linaloendeshwa kwa asilimia 100 na watu
        wanaojitolea, tunakaribisha michango yako ili kutusaidia kuendeleza Lengo
        letu la kuwawezesha jamii ya kimataifa ya michezo ya kasi ya mafumbo na
        kudumisha mazingira ya mashindano ya kufurahisha na ya haki kwa wote.
      button: Jifunze zaidi kuhusu jinsi unavyoweza kuunga mkono WCA
