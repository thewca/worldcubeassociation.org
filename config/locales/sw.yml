  page:
    translators:
      title: Watafsiri
    officers_and_board:
      title: Maafisa na Bodi ya WCA
      officers_description: Maafisa wa WCA hushughulikia kazi zinazohusiana na
        hali ya shirika lisilo la faida la WCA. Maafisa hawa huchaguliwa na Bodi
        ya WCA. Mkurugenzi Mtendaji ndiye Ofisa Mkuu Mtendaji wa WCA, Mwenyekiti
        huongoza mikutano yote ya Bodi, Katibu hudumisha nyaraka za shirika, na
        Mweka Hazina husimamia masuala ya kifedha ya WCA.
      board_description: Bodi ya WCA ina jukumu la kuongoza shirika kwa ujumla, na
        kutekeleza majukumu yote ambayo hayatekelezwi na Timu na Kamati nyingine
    teams_committees_councils:
      title: Timu na kamati za WCA
      description: Timu na kamati za WCA ni sehemu muhimu ya shirika na hufanya
        kazi za kila siku zinazohitajika ili kuliweka likiendelea kufanya kazi.
        Kamati hizi zinaundwa na wanajamii wa WCA, wakiwemo Wajumbe na washiriki
        wa WCA. Kila timu ina kiongozi, ambaye jukumu lake ni kuhakikisha utendaji
        mzuri wa timu na kuwaongoza wanachama wengine wa timu. Pindi kunapokuwa na
        nafasi za wazi za timu au kamati, taarifa kuhusu jinsi ya kuomba huwekwa
        kwenye ukurasa wa mbele.
      contact_button: wasiliana nasi
      no_contact_description: Maelezo ya mawasiliano ya timu au kamati hii
        hayapatikani hadharani.
      groups_name:
        wat: Timu ya Hifadhi ya WCA
        wct: Timu ya Mawasiliano ya WCA
        wcat: Timu ya Kutangaza Mashindano ya WCA
        wic: Kamati ya Uadilifu ya WCA
        weat: Timu ya Wasaidizi Wakuu wa WCA
        wfc: Kamati ya Fedha ya WCA
        wmt: Timu ya Marketing ya WCA
        wmct: Timu Kuu ya Mashindano ya WCA
        wqac: Kamati ya Uhakiki wa Ubora ya WCA
        wrc: Kamati ya Kanuni za WCA
        wrt: Timu ya Matokeo ya WCA
        wst: Timu ya Programu za Kompyuta ya WCA
        wsot: Timu ya Shirika la Michezo ya WCA
        wapc: Kamati ya Rufaa ya WCA
      groups_description:
        wat: Timu ya Hifadhi ya WCA (WAT) inasimamia uundaji na utunzaji wa
          kumbukumbu za kihistoria za WCA. Wanadokumenti matukio muhimu ya mchezo
          wa kusuluhisha speedcubing na hatua kuu za kihistoria za WCA ili
          kuwasilishwa kama sehemu ya ratiba pana ya matukio ya WCA, kwa lengo la
          kulinda urithi wa WCA katika ulimwengu wa speedcubing.
        wct: Timu ya Mawasiliano ya WCA (WCT) inasimamia na kuunga mkono
          mawasiliano ya WCA na Jamii pamoja na umma kwa ujumla. Mawasiliano ya
          WCA yanapaswa kuchangia Malengo ya WCA na kukuza utamaduni chanya wa
          jumla wa urafiki, uwazi, ujumuishaji, uwazi wa mawazo, na wepesi wa
          kujibu.
        wcat: Timu ya Kutangaza Mashindano ya WCA (WCAT) ina idhinisha na
          kutangaza Mashindano ya WCA yaliyowasilishwa na Wajumbe wa WCA, na
          kuhakikisha kwamba matangazo hayo yanatii viwango vya ubora vya WCA.
          Timu hii pia ina jukumu la kusimamia taratibu sahihi za kuwasilisha
          mashindano kutoka kwa nyaraka kama vile Sera ya Masharti ya Mashindano
          ya WCA. WCAT HAINA jukumu la kuandaa na kusimamia mashindano ya
          kibinafsi ya mtu mmoja mmoja au ya mashindano maalum.
        wic: Kamati ya Uadilifu ya WCA (WIC) inafanya uchunguzi huru kuhusu
          wanachama wa jamii ya WCA na matukio yanayotokea wakati wa Mashindano ya
          WCA au kwenye majukwaa rasmi ya mtandaoni ya WCA. Matukio haya ni madai
          ya ukiukaji wa Thamani, Kanuni za Maadili, Maadili ya Kitaalamu, na/au
          Kanuni za WCA.
        weat: Timu ya Wasaidizi Wakuu wa WCA (WEAT) inatekeleza majukumu ya
          kiutawala ya Bodi ya Wakurugenzi ya WCA.
        wfc: Kamati ya Fedha ya WCA (WFC) inasimamia fedha kwa ujumla za WCA,
          ikiwemo uandaaji wa bajeti, utoaji wa ripoti, uchambuzi, utunzaji wa
          kumbukumbu za hesabu, na uwasilishaji wa kodi. Pia wanasimamia chanzo
          kikuu cha mapato cha WCA, Mfumo wa Ada za WCA, pamoja na programu
          mbalimbali za ufadhili zinazotoa msaada kwa jamii za mitaa katika hatua
          mbalimbali za maendeleo, ikiwemo Ufadhili wa Safari, Ufadhili wa Vifaa,
          na Msaada kwa Mashirika ya Kikanda.
        wmt: Timu ya Masoko ya WCA (WMT) inasimamia Chapa ya WCA, inatafuta
          wadhamini, na kutangaza Bidhaa za WCA.
        wmct: Timu Kuu ya Mashindano ya WCA (WMCT) inasimamia uratibu na
          uendelezaji wa Mashindano ya Mabara na Dunia ya WCA kupitia uundaji wa
          miongozo na mipango mikakati, kusimamia uteuzi wa miji itakayokuwa
          wenyeji, kuunga mkono timu za uandaaji, na kuhakikisha uwepo wa uzoefu
          thabiti na wa pamoja wa mashindano makuu.
        wqac: Kamati ya Uhakiki wa Ubora ya WCA (WQAC) inakuza uboreshaji endelevu
          wa ubora ndani ya WCA, pamoja na utekelezaji wa viwango vya ubora
          duniani kote ili kuhakikisha uwepo wa ubora wa juu na thabiti katika
          michakato, Wajojina/Wajitolea wa WCA, Mashirika ya Kikanda, Waandaaji wa
          Mashindano, na Wajitolea wa Mashindano.
        wrc: Kamati ya Kanuni za WCA (WRC) inashughulikia masuala yote
          yanayohusiana na utekelezaji, uboreshaji, na maendeleo ya Kanuni za WCA.
          Wanasaidia Wajumbe wa WCA kuhusu masuala yoyote ya kiutaratibu
          yanayotokea kwenye mashindano na kuamua kuhusu matukio yasiyotatuliwa na
          yasiyofunikwa na kanuni hizo.
        wrt: Timu ya Matokeo ya WCA (WRT) inasimamia data zote katika hifadhidata
          za WCA, ikiwemo matokeo ya mashindano na taarifa za watu binafsi.
        wst: Timu ya Programu za Kompyuta ya WCA (WST) inasimamia programu za WCA
          (tovuti, mifumo ya kuchanganya, vitabu vya kazi, na zana za kiutawala).
        wsot: Timu ya Shirika la Michezo ya WCA (WSOT) inasimamia na kuunga mkono
          utambuzi wa WCA kama shirika la kimataifa la michezo.
        wapc: Kamati ya Rufaa ya WCA (WAC) inapitia na kutatua rufaa zinazohusu
          maamuzi yaliyotolewa na Wajitolea wengine wa WCA. WAC hutoa mchakato
          huru na usio upendeleo wa mapitio ili kuhakikisha kwamba maamuzi
          yanakuwa ya haki, ya kuridhisha, na yanayotii sera na kanuni za WCA.
