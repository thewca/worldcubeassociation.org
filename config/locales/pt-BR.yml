  faq:
    title: Perguntas Frequentes
    contact_html: 'Se nenhuma destas respostas te ajudou, por favor %{contact_us}!'
    contact_us: entre em contato conosco
    search_for_competition: 'Procure por uma competição aqui:'
    already_logged_in: Você já está logado com uma conta da WCA.
    create_an_account: 'Você pode criar uma conta %{here}.'
    claim_your_wca_id: 'Você pode solicitar sua ID da WCA %{here}.'
    create_an_account_and_claim: >-
      Crie uma conta %{here}. Depois de entrar com sua nova conta, será
      solicitado que você conecte sua ID da WCA.
    answers:
      '1':
        title: Como obtenho uma ID da WCA e um perfil da WCA?
        content:
          '1': >-
            Se você nunca competiu antes, participe de uma <a
            href='/competitions'>competição</a>! Uma ID da WCA será criada para
            você quando os resultados de sua primeira competição forem
            publicados.
      '2':
        title: Como posso encontrar uma competição da WCA?
        content:
          '1': Veja nossa lista de <a href='/competitions'>competições</a>
      '3':
        title: >-
          Como posso me inscrever para uma competição? Quem devo contactar se
          tiver problemas com a inscrição?
        content:
          '1': >-
            Muitas competições usam o sistema de inscrições da WCA, mas outras
            usam um sistema próprio. Você deve contatar os organizadores da
            competição da qual deseja participar para obter mais detalhes.
            %{comp_search_form}
      '4':
        title: >-
          Quais são os requisitos para participar de uma competição da WCA? O
          que preciso saber antes de participar de uma competição?
        content:
          '1': >-
            De maneira geral, não existem muitos requisitos para alguém
            participar de uma competição da WCA. Entretanto, todos os
            participantes devem ter um bom entendimento do <a
            href='https://www.worldcubeassociation.org/regulations/'>Regulamento
            da WCA</a>. Se você não fala inglês e tiver problemas para entender
            o documento, por favor veja as <a
            href='https://www.worldcubeassociation.org/regulations/translations/'>Traduções</a>.
      '5':
        title: Como posso ter uma competição da WCA na minha cidade?
        content:
          '1': >-
            Se você está interessado em organizar uma competição, é altamente
            recomendável participar de pelo menos uma ou duas outras competições
            para aprender com a experiência.
          '2': >-
            As competições da WCA devem seguir o <a target='_blank'
            href='https://www.worldcubeassociation.org/regulations/'>Regulamento
            da WCA</a>. A equipe de organização não precisa saber todo o
            regulamento de cor, porém um bom conhecimento dos pontos básicos
            ajuda a organizar corretamente a competição.
          '3': >-
            Depois disso, a equipe de organização deve contactar um <a
            target='_blank'
            href='https://www.worldcubeassociation.org/delegates'>Delegado da
            WCA</a> próximo. A supervisão de um Delegado da WCA é necessária
            para que a competição seja reconhecida oficialmente pela WCA. O
            Delegado ajudará a equipe de organização nos preparativos para a
            competição.
          '4': >-
            Visite as <a target='_blank'
            href='https://documents.worldcubeassociation.org/edudoc/organizer-handbook/organizer-handbook.pdf'>Orientações
            para Organizadores de Competições da WCA</a> para mais informações.
      '6':
        title: >-
          Para que servem as contas do site da WCA? Qual a diferença entre uma
          conta e um perfil da WCA?
        content:
          '1': >-
            Você terá uma ID da WCA associada quando os resultados de sua
            primeira competição oficial forem publicados.
          '2': >-
            As contas no site da WCA servem para verificar quem você é. Isso
            possibilita adicionar uma foto ao seu perfil, e também se inscrever
            para competições. Servem também para evitar que outras pessoas se
            passem por você.
          '3': '%{current_user_status}'
      '7':
        title: Como posso alterar minha foto do perfil?
        content:
          '1': >-
            Primeiro, você precisa <a
            href='#how-do-i-connect-my-wca-account-with-my-wca-id'>criar uma
            conta no site da WCA e conectá-la à sua ID da WCA.</a>
          '2': >-
            Depois disso, visite a página para <a
            href='%{profile_edit_path}'>editar seu perfil</a> e mudar sua foto.
      '8':
        title: Como posso vincular minha conta do site da WCA com minha ID da 
          WCA?
        content:
          '1': '%{current_user_claim}'
      '9':
        title: >-
          Estou inscrito em uma competição e gostaria de participar de uma outra
          modalidade. O que devo fazer? Posso levar outras pessoas comigo?
        content:
          '1': >-
            Por favor contate os organizadores. Você pode encontrar as
            informações de contato na página da competição. Se não tem certeza
            de onde encontrar, veja a <a href='/competitions/>lista de
            competições</a>.
      results:
        title: Quando os resultados de uma competição da WCA são publicados no 
          site?
        content:
          '1': >-
            Depois que a competição termina, o Delegado da WCA precisa verificar
            todas as súmulas e informações para eliminar possíveis erros. Depois
            que isso é feito, os resultados são enviados para a Equipe de
            Resultados da WCA, que é responsável por publicá-los e gerenciar o
            banco de dados da WCA. Essa publlicação é feita assim que possível.
          '2': >-
            Dependendo do tamanho da competição e da agenda do Delegado, isso
            pode levar um dia ou até uma semana. Por favor seja paciente.
          '3': >-
            Além disso, se você já vinculou sua conta da WCA com sua ID da WCA
            (veja abaixo), você pode habilitar a opção de ser notificado por
            email quando os resultados forem publicados <a
            href='%{preferences_edit_path}'>aqui</a>.
      regulations1:
        title: O meu quebra-cabeça pode ser usado em competição?
        content:
          '1': >-
            Você pode encontrar as regras sobre os quebra-cabeças no <a
            href='https://www.worldcubeassociation.org/regulations/#3'>Artigo
            3</a>. Todos os quebra-cabeças devem ser aprovados pelo Delegado da
            WCA. Se você não tem certeza, por favor pergunte ao Delegado de sua
            competição. Para se prevenir, você deve levar um quebra-cabeça
            substituto caso não seja permitido usar o seu outro.
      regulations2:
        title: Posso usar um quebra-cabeça magnético numa competição oficial da 
          WCA?
        content:
          '1': >-
            Você pode usar quebra-cabeças magnéticos, contanto que eles atendam
            ao <a target='_blank'
            href='https://www.worldcubeassociation.org/regulations/'>Regulamento
            da WCA</a>. Por favor atente para a <a
            href='https://www.worldcubeassociation.org/regulations/#3h'>Regra
            3h</a>.
      regulations3:
        title: >-
          Eu perdi uma tampinha do meu quebra-cabeça. Ainda posso usá-lo na
          competição?
        content:
          '1': >-
            Você não pode usar esse quebra-cabeça. Eles não devem ter nenhum
            defeito, avaria ou outra diferença que permita diferenciar uma peça
            de outra peça similar (veja <a
            href='https://www.worldcubeassociation.org/regulations/#3j'>Regra
            3j</a>).
      regulations4:
        title: Qual idade preciso ter para me inscrever numa competição da WCA?
        content:
          '1': >-
            Não existe idade mínima. Entretanto, você deve ter permissão de seus
            pais ou responsáveis (veja <a
            href='https://www.worldcubeassociation.org/regulations/#2b'>Regra
            2b</a>).
  about:
    title: Sobre a WCA
    mission_statement: >-
      Nossa missão é ter mais competições em mais países, com mais pessoas e
      mais diversão, sob condições iguais e justas.
    mission_footer: Declaração de Missão da WCA
    who_we_are_title: Quem somos nós
    who_we_are_content_html: >-
      <p>A World Cube Association regula competicões de quebra-cabeças mecânicos
      que são operados girando-se os lados, comumente chamados de "twisty
      puzzles". O mais famoso deles é o "Rubik's Cube" (Cubo Mágico ou Cubo de
      Rubik), inventado pelo professor Rubik, da Hungria. Alguns destes
      quebra-cabeças são eventos oficiais da WCA.</p><p>À medida que a WCA
      evoluiu ao longo da última década, mais de 245.000 pessoas já participaram
      de nossas competições. Apesar deste crescimento, permanecemos uma
      organização operada totalmente por voluntários, de organizadores locais
      aos Delegados e inclusive o Conselho. Somos muito gratos a todos que
      dispõe seu tempo para permitir que a WCA funcione. Com mais apoio
      financeiro, esperamos trazer um nível ainda maior de profissionalismo para
      nossas competições, continuando a ter mais eventos ao redor do globo.</p>
    spirit: >-
      O Espírito da World Cube Association é que <strong>pessoas de todo o mundo
      se divirtam juntas numa atmosfera amigável, ajudem umas às outras e se
      comportem com espírito esportivo.
    spirit_footer: Espírito da WCA
    our_goals_title: Nossos objetivos
    our_goals_content_html: >-
      <p>A World Cube Association quer trazer oportunidades de participação e
      liderança para jovens em todo o mundo, aumentando a acessibilidade de
      nossas competições de "twisty puzzles". Acreditamos que as experiências
      nas competições e na nossa comunidade criam oportunidades de crescimento
      para os jovens envolvidos e que apresentar esses quebra-cabeças para novos
      grupos de pessoas permite que nossa comunidade se fortaleça. Um documento
      contendo a Visão e Estratégia do Board para a WCA pode ser encontrado <a
      href="https://documents.worldcubeassociation.org/documents/WCA_Strategic_Plan.pdf">aqui</a></p>
    whats_next_title: O que vem a seguir para a WCA?
    whats_next_content_html: >-
      <p>A World Cube Association já teve mais de 245.000 competidores em 158
      regiões e não planejamos diminuir o ritmo! A comunidade cubista tem
      crescido constantemente desde nossa fundação em 2004 e queremos encorajar
      que isso continue, aumentando a acessibilidade de competições em novas
      áreas. No futuro, esperamos poder apoiar nossa comunidade ainda mais por
      meio de colaborações e divulgação para aqueles que gostam dos
      quebra-cabeças.</p>
    world_championship_title: Campeonato Mundial
    world_championship_content_html: >-
      <p>A cada dois anos, realizamos uma competição que determina os campeões
      mundiais. Estes eventos demanda planejamento muito cuidados por um grande
      número de voluntários, bem como um grande compromisso financeiro para
      reservar o local e fazer os preparativos necessários.</p>
    contributing_title: Fazer uma contribuição
    contributing_content_html: >-
      Você pode doar com cartão de crédito usando Guidestar %{here_credit}, ou
      pelo Paypal %{here_paypal}. Se preferir fazer um cheque, pode enviar para:
    tax_deductible_note: Doações são dedutíveis de impostos nos Estados Unidos.
    other_help_title: Outras formas de ajudar
    other_help_content_html: >-
      <p>Se você acredita que pode contribuir com a WCA de uma forma não
      financeira, adoraríamos te ouvir! Por favor entre em contato conosco no
      email <a
      href="mailto:communication@worldcubeassociation.org">communication@worldcubeassociation.org</a>.</p>
    donation_banner:
      content: >-
        A World Cube Association é uma organização isenta de taxas 501(c)(3).
        Como uma organização sem fins lucrativos 100% voluntária, suas doações
        são muito importantes para nos ajudar a expandir nossa visão de ter mais
        agradáveis em todo o mundo.
      donate_credit: Doar com cartão de crédito
      donate_paypal: Doar pelo Paypal
      donate_other: Outras formas de doar
    structure:
      title: Estrutura
      board:
        description: >-
          A World Cube Association é conduzida pelo WCA Board (Conselho da WCA),
          que consiste nos seguintes membros:
      users:
        profile: 'Perfil de %{user_name}'
      operations_html: 'As operações cotidianas são feitas pelos %{committees_and_teams}
        da WCA.'
      teams_committees: Equipes e Comitês
      delegates_html: >-
        <p><strong>Delegado da WCA</strong> é uma função definida nas Moções
        daWCA e descrita no Regulamento da WCA. A principal tarefa de um
        Delegado é supervisionar as competições em nome da WCA. Ele é
        responsável por garantir que todas as competições da WCA aconteçam de
        acordo com a Missão, Espírito e Regulamento da WCA. Eles são
        diferenciados entre <strong>Delegados Sênior</strong>, <strong>Delegados
        Regionais</strong>, <strong>Delegados Junior</strong> e
        <strong>Delegados Trainee%{see_link}.</p> <p> Além das tarefas de um
        Delegado, um Delegado Sênior é responsável por gerenciar os Delegados em
        sua área, e também pode ser contatado pela comunidade para assuntos
        pertinentes à região.</p> <p>Novos Delegados são listados inicialmente
        como Delegados Junior, e devem mostrar que são capazes de conduzir
        competições adequadamente antes de serem considerados Delegados.</p>
        <p>Delegados Trainee estão em treinamento para a posição de Delegado da
        WCA e somente podem supervisionar competições nas quais um outro
        Delegado estiver presente.</p>
      see_link_html: '(veja %{link})'
      members_html: >-
        Todos os competidores automaticamente se tornam <strong>membros</strong>
        da WCA em sua primeira competição oficial.
