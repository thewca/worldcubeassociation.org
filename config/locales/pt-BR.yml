    content: 'A WCA reconhece as seguintes Organizações Regionais:'
    empty: Nenhuma Organização Regional é reconhecida atualmente pela WCA.
    how_to:
      title: Como se tornar uma Organização Regional da WCA
      description: >-
        A WCA reconhece várias Organizações Regionais no mundo todo. O objetivo
        de uma Organização Regional é organizar Competições da WCA e apoiar as
        atividades da WCA em sua região. Regiões que quiserem formar uma
        Organização Regional devem contribuir com a WCA em sua área antes de
        enviar sua candidatura. Para obter ajuda com a organização de uma
        competição da WCA em sua área, por favor contate um Delegado da WCA mais
        próximo.
    requirements:
      title: Requerimentos para Organizações Regionais da WCA
      list:
        '1': Ativamente organizer ou apoiar competições da WCA em sua região
        '2': >-
          Contribuir nas Competições Continentais da WCA que acontecerem em seu
          continente
        '3': >-
          Respeitar e operacionalizar os Objetivos definidos no Estatuto e
          Regulamento da WCA
        '4': Cumprir com o Regulamento da WCA
        '5': Aceitar e cumprir as decisões dos Voluntários da WCA
        '6': >-
          Manter em arquivo na WCA uma cópia de seu estatuto e regulamento em
          formato eletrônico
    application_instructions:
      title: Instruções de Candidatura
      description_html: >-
        Para se candidatar, por favor preencha <a
        href='https://docs.google.com/forms/d/e/1FAIpQLSfX2HbafvMbWw-9DTgIP0Zf7im1VMZEaRq1J-jXnyW2nVYzsg/viewform'>este
        formulário</a>.
    regional_organization_form:
      filling_instructions_html: Por favor preencha tudo <b>em inglês!</b>
      public_information: Informação pública
      private_information: Informação privada
      private_information_disclaimer: Toda a informação abaixo estará visível 
        somente para o Conselho da WCA
    errors:
      end_date_after_start_date: não pode ser posterior a Reconhecida até
    create:
      create_success: >-
        Candidatura enviada com sucesso! Por favor verifique seu e-mail, e
        aguarde o Conselho da WCA fazer sua análise
    delete:
      confirm_delete: Tem certeza que deseja excluir esse pedido de Organização 
        Regional?
  score_tools:
    title: Ferramentas para competições da WCA
    wca_icon_text: Desenvolvido e mantido pelo WST
    intro:
      desc: >-
        Esta página é uma lista não exaustiva das ferramentas conhecidas para
        ajudar na organização de competições da WCA.
      disclaimer: >-
        Nem todas as ferramentas são mantidas pelo WST: não há problema! Não
        temos o pessoal necessário para gerenciar todos os softwares
        relacionados à WCA :)
      used: >-
        Todos os programas nesta lista foram usados durante competições reais da
        WCA e se integram com o site da WCA: eles permitem que você faça o login
        com sua conta da WCA para poder importar (e algumas vezes atualizar) as
        informações de suas próximas competições. Para cada um deles, o
        responsável será indicado.
    before:
      title: Antes da competição
      desc: >-
        Você pode gerenciar as inscrições diretamente no site da WCA. Como
        ajustar os grupos e os voluntários manualmente pode levar bastante
        tempo, você pode querer usar uma das ferramentas abaixo.
    during:
      title: Durante a competição
      desc: >-
        Aqui você vai encontrar ferramentas que te permitem gerenciar os
        resultados da competição enquanto ela acontece.
    after:
      title: Depois da competição
      desc: >-
        A validação de resultados ocorre aqui no site, mas você precisará usar
        alguma ferramenta para unir os scrambles gerados pelo TNoodle aos
        resultados enviados para o site da WCA.
    tools:
      age:
        title: AGE
        description: Ferramenta para gerar e editar grupos/tarefas para 
          competições da WCA
      certificates:
        title: Certificados
        description: Imprima certificados de competições que usam o WCA Live
      groupifier:
        title: Groupifier
        description: >-
          Gerenciamento de grupos e tarefas para organizadores de competições da
          WCA. Entre os principais recursos você encontrará: ordenar os
          competidores por ranking, atribuir tarefas (juiz, embaralhador),
          decidir quantos embaralhamentos são necessários, gerar súmulas,
          cartões personalizados e resumos... Veja os site para mais
          informações.
      scorecards:
        title: Súmulas
        description: Imprima súmulas para competições que usam o WCA Live
      tnoodle:
        title: TNoodle (Embaralhamentos)
        description: >-
          TNoodle é o programa oficial de embaralhamentos usado para as
          competições da WCA. É geralmente usado pelos Delegados da WCA antes
          das competições, mas sua interface permite que qualquer um possa gerar
          embaralhamentos para todos os eventos da WCA.
      live:
        title: WCA Live
        description: >-
          Plataforma para computar os resultados e compartilhar ao vivo com o
          mundo.
      nightmare:
        title: Planilha de resultados
        description: >-
          Às vezes coisas acontecem... Se você não tiver acesso à internet,
          precisará usar a boa e velha planilha.
      matcher:
        title: Scrambles Matcher
        description: >-
          Pode ser usado para atribuir embaralhamentos gerados pelo TNoodle aos
          resultados. Importe resultados do site da WCA (se estiver usando WCA
          Live), uma planilha ou um arquivo WCIF. Importe os embaralhamentos de
          um ou mais arquivos json do TNoodle. Exporte resultados no formato
          apropriado para enviar à WCA.
      groups:
        title: Grupos da competição
        description: Ver grupos de alguma competição em andamento
  logo:
    title: Logotipo da WCA
    intro: >-
      O logo da WCA foi desenhado por Justin Eastman, em um concurso em janeiro
      de 2005. Nós gostamos do logo por seu design, as cores e o fato que ele
      não mostra especificamente um cubo 3x3x3.
    headings:
      usage_guidelines:
        title: Diretrizes de Uso
        paragraph:
          acceptable_usage: >-
            O uso do logo da WCA é regulamentado pela <a
            href="https://documents.worldcubeassociation.org/documents/policies/external/Logo%20Usage.pdf">Política
            de Uso do Logo da WCA</a>. Por favor leia esse documento antes de
            usar o logo da WCA em seus projetos. Questões adicionais devem ser
            enviadas para a <a
            href="mailto:marketing@worldcubeassociation.org">Equipe de Marketing
            da WCA</a>.
          see_below: >-
            Abaixo estão diretrizes adicionais de estilo para o uso correto do
            logo da WCA.
        color:
          title: Cor
          paragraph: >-
            O logo da WCA existe em quatro variações de cor. A variação correta
            deve ser usada dependendo da cor de fundo do local onde o logo é
            posicionado.
          primary:
            title: Primária
            paragraph: Use a variação primária sempre que possível.
          mono:
            title: Mono
            paragraph: Somente use a variação mono quando a primária não for 
              adequada.
        logo_only:
          title: Somente Logo
          paragraph: >-
            O logo da WCA pode ser usado sem o logotipo, seguindo as mesmas
            diretrizes de cor acima.
      download_logo_assets:
        title: Baixar Arquivos do Logo
        paragraph: >-
          Versões PNG e vetorizadas em alta resolução estão disponíveis para
          baixar.
        accept_terms_and_conditions: >-
          Eu li e aceito a <a
          href="https://documents.worldcubeassociation.org/documents/policies/external/Logo%20Usage.pdf">Política
          de Uso do Logo da WCA</a>.
        download_button_text: Baixar Arquivos do Logo
  search_results:
    index:
      competitions: Competições
      people: Pessoas
      advanced_search: Busca avançada
      incidents: Incidentes
      posts: Posts
      regulations_and_guidelines: Regulamento e Orientações
      search_for: 'Procurar por <b>%{search_string}</b>'
      not_found:
