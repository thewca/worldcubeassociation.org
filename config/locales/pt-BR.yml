          Informe o nome completo do competidor corretamente, por exemplo
          <strong>Ayrton Senna da Silva</strong>, não desleixadamente como
          <strong>ayrton s</strong>.
        pending_avatar: >-
          Após enviar um novo avatar, será necessário esperar a Equipe de
          Resultados da WCA aprová-lo.
        registration_notifications_enabled: >-
          Isso só se aplica para competições que você organiza ou delega, e pode
          ser sobrescrito em cada competição.
        receive_delegate_reports: >-
          Se você é um Delegado Sênior ou Membro do WRC ou WQAC, você receberá
          os Relatórios do Delegado por padrão. Nota: a mudança pode demorar até
          uma hora para ter efeito.
        delegate_reports_region: >-
          Se você deseja receber todos os relatórios, deixe esse campo em branco
          (a caixa bem no alto). Nota: a mudança pode demorar até uma hora para
          ter efeito.
        otp_attempt: >-
          Verifique seu aplicativo móvel para uma senha única, ou informe um de
          seus códigos de recuperação.
      dob_contact:
        dob: Sua data de nascimento no formato AAAA-MM-DD
        document: >-
          Para provar sua identidade e sua data de nascimento correta para nós,
          anexe uma foto de algum documento legal (carteira de identidade, CNH,
          carteira de estudante, passaporte, certidão de nascimento, ...) no
          qual seu nome e data de nascimento esteja visíveis e compreensíveis
          para alguém que fale inglês (ou contate um Delegado da WCA em seu país
          se você não tem um documento desse). Na identificação nós precisamos
          no mínimo de seu nome e data de nascimento; você pode apagar/cobrir
          outras informações pessoais, se quiser.
      post:
        body: >-
          Use a tag &lt;!-- break --&gt; para mostrar uma prévia do post na
          página principal. Todo o texto antes desse divisor será mostrado na
          página principal. O texto completo (se diferente) será mostrado ao
          clicar no post.
        show_on_homepage: >-
          Cuidado! Isto não é seguro para informações privadas. Somente evita
          obstrução na página inicial. Postagens que não aparecem nela ainda são
          acessíveis ao público por um "permalink" ou pelas tags.
      delegate_report:
        schedule_url: >-
          Link para o cronograma (p. ex.
          https://www.cubingusa.com/usnationals2016/schedule.php)
        equipment: >-
          Número e tipo de timers e displays usados na competição. Remova a(s)
          linha(s) de equipamentos que não foram usados.
        summary: >-
          Os pontos listados acima são apenas guias para um relatório completo.
          Use-os a seu critério conforme achar necessário. Por favor remove as
          partes não usadas!
        venue: >-
          Os pontos listados acima são apenas uma orientação para um relatório
          completo. Use-os a seu critério como achar melhor. Por favor remova as
          partes que não forem usadas!
        organization: >-
          Os pontos listados acima são apenas orientações para um relatório
          completo. Use-os a seu critério como achar melhor. Por favor remova as
          partes que não forem usadas!
        incidents: >-
          Por favor informe os incidentes que não são casos comuns. Numere os
          incidentes começando de 1, para que outros Delegados possam comentar
          usando os números como referência. Mesmo que tudo tenha sido genérico,
          liste pelo menos os casos mais importantes. Por favor marque as caixas
          abaixo se você precisa de retorno.
        setup_images: >-
          Por favor escolha no mínimo %{image_count} imagem(ns) que ilustre(m) a
          configuração da competição (área de embaralhamento, área de
          competição, etc). Você pode selecionar vários arquivos de uma vez.
          Você pode excluir imagens somente quando outras imagens tenham sido
          selecionados em número suficiente (se quiser substituir uma imagem,
          você deve primeiro fazer o upload da nova imagem, e depois excluir a
          antiga).
        wrc_incidents: >-
          Lista dos números de incidentes para os quais você deseja uma resposta
          do WRC.
        wic_incidents: >-
          Lista de números referenciando os incidentes para os quais você
          gostaria de um retorno do WIC.
        remarks: >-
          Fale sobre qualquer outro detalhe que você gostaria de compartilhar
          (p. ex. melhora/piora na comunidade, planos futuros para esta região).
          Se você omitiu algo nas seções anteriores para ser conciso, pode
          comentar aqui.
