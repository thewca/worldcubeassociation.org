        '2': >-
          Todo conteúdo de mídia deve ser apropriado e não conter nenhum
          material ofensivo ou impróprio.
        '3': >-
          O conteúdo de mídia não deve ter presença exagerada de patrocinadores
          ou anúncios.
        '4': Toda mídia deve ter um título descritivo e apropriado.
    edit:
