      review_warning_html: >-
        Todas as mídias serão revisadas antes de serem listadas na <a
        href="/media">página de mídias</a>.
      guidelines: Orientações
      media_guidelines:
        '1': Todo conteúdo de mídia deve ser relacionado à competição 
