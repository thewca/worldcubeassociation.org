      Um token de acesso OAuth pode ser usado, até que expire, para fazer
      "requests" autorizados de API. Por exemplo para acessar informações sobre
      sua conta:
    legal_tnoodle_api_header: Versão Legal do TNoodle
    login_message: Por favor faça login
  merch:
    title: Produtos da WCA
    paragraphs:
      '1': >-
        A WCA tem produtos exclusivos para venda! Camisetas, casacos, adesivos,
        stackmats, mochilas e muito mais! Nossos designs são constantemente
        atualizados incluindo o logo clássico da WCA, produtos oficiais do
        Campeonato Mundial e designs de Recordes Mundiais.
      '2': >-
        Comprar produtos da WCA em nossas lojas é uma das melhores maneiras de
        apoiar a WCA - uma organização sem fins lucrativos e conduzida por
        voluntários. Nós usamos todo o lucro dos produtos para financiar
        campeonatos, equipamentos e outras atividades da WCA.
      '3': >-
        Você pode comprar nossos produtos em todo o mundo - com lojas diretas na
        Europa, América e Índia, e outras em breve!
  database:
    results_export:
      heading: Export de Resultados da WCA
      description: >-
        Nessa página oferecemos os resultados da WCA para download em vários
        formatos, para que você possa usar ou analisar em grande escala.
        Geralmente vamos atualizar após cada fim de semana de competições,
        quando os resultados estiverem finalizados. Os arquivos são numerados e
        datados para que você possa ver se já tem a última versão.
      permalink: link permanente
      file_formats:
        sql: 'Comandos SQL, para importar em bancos de dados SQL.'
        tsv: >-
          Valores separados por tabulação, para planilhas no OpenOffice.org,
          Excel, etc.
      hint_readme_html: >-
        O arquivo incluído %{readme_filename} contém os termos de uso e uma
        descrição geral (em Inglês, não traduzida):
    developer_export:
      heading: Export de Desenvolvedor do WST
      description_html: >-
        Nessa página oferecemos o export de desenvolvedor do WST para download
        como um "dump" SQL. Detalhes podem ser encontrados em %{github_link}.
      download: Baixar
  validators:
    persons:
      dob_is_jan_one_warning: >-
        A data de nascimento de %{name} é 1º de janeiro. Por favor certifique-se
        de que está correta.
      dob_is_too_young_warning: >-
        %{name} parecer ter menos de 3 anos de idade. Por favor certifique-se de
        que está correto.
      dob_is_too_old_warning: >-
        %{name} parece ter cerca de 100 anos de idade. Por favor certifique-se
        de que está correto.
      person_doesnt_have_any_results_error: 'Não há resultados para %{person_name}
        com ID %{person_id}'
      results_not_associated_with_any_person_error: 'Há resultados para uma pessoa
        desconhecida com ID %{person_id}'
      whitespace_in_name_error: >-
        Pessoa '%{name}' tem espaços em branco no início ou fim do nome, ou
        espaços duplos.
      person_with_non_existing_wca_id_error: 'Pessoa ''%{name}'' tem uma ID da WCA
        que não existe: %{wca_id}.'
      no_space_before_parenthesis_error: 'Parênteses de abertura em ''%{name}'' deve
        ser precedido de um espaço.'
      same_person_name_warning: >-
        Já existe pelo menos uma pessoa com o nome '%{name}' na base de dados da
        WCA (%{wca_ids}). Por favor certifique-se de que seu(sua) '%{name}' é
        uma pessoa diferente. Se não for, por favor atribua o ID da WCA correto
        à conta de usuário e gere novamente o JSON dos resultados.
      non_matching_dob_warning: >-
        A data de nascimento '%{dob}' fornecida para %{name} (%{wca_id}) não
        corresponde ao registro atual no banco de dados da WCA
        ('%{expected_dob}'). Se for um erro, por favor corrija. Caso contrário,
        deixe um comentário para o WRT sobre isso.
      non_matching_gender_warning: >-
        O gênero '%{gender}' informado para %{name} (%{wca_id}) não corresponde
        ao registro atual no banco de dados da WCA ('%{expected_gender}'). Se
        isso for um erro, por favor corrija. Caso contrário, deixe um comentário
        para o WRT sobre isso.
      empty_gender_warning: >-
        O gênero para o(a) novato(a) %{name} está vazio. As opções válidas são
        'female', 'male' e 'other'. Por favor deixe um comentário para o WRT
        sobre isso.
      non_matching_name_warning: >-
        O nome '%{name}' informado para %{wca_id} não corresponde ao registro
        atual no banco de dados da WCA ('%{expected_name}');
      non_matching_country_warning: >-
        O país '%{country}' informado para %{name} (%{wca_id}) não corresponde
        ao registro atual no banco de dados da WCA ('%{expected_country}'). Se
        isso for um erro, por favor corrija. Caso contrário, deixe um comentário
        para o WRT sobre isso.
      multiple_newcomers_with_same_name_warning: >-
        Há múltiplos competidores novatos com o mesmo nome: %{name}. Por favor
        verifique se todos os resultados estão corretos para esses competidores
        e se todos estão separados corretamente pelo id correspondente.
      wrong_parenthesis_type_error: >-
        O caracter de parênteses usado em '%{name}' é um caracter irregular. Por
        favor substitua-o com um parêntestes normal '(' ou ')' e com o
        espaçamento apropriado.
      successive_uppercase_name_warning: >-
        '%{name}' tem letras maiúsculas em sequência no seu nome. Por favor
        confirme se essa é a forma correta ou corrija o nome.
      lowercase_name_warning: >-
        '%{name}' tem um nome todo em minúsculas. Por favor confirme se essa é a
        forma correta ou corrija o nome.
      missing_period_in_single_letter_middle_name_warning: >-
        '%{name}' tem um nome do meio com apenas uma letra e sem ponto. Por
        favor confirme se essa é a forma correta ou corrija o nome.
      letter_after_period_warning: >-
        '%{name}' não tem um espaço depois do ponto no nome. Por favor confirme
        se essa é a forma correta ou corrija o nome.
      single_letter_first_or_last_name_warning: >-
        '%{name}' tem um primeiro ou último nome com apenas uma letra. Por favor
        corrija ou nome ou confirme se essa é a forma correta de acordo com um
        documento oficial.
      single_name_warning: >-
        '%{name}' tem apenas um nome. Por favor confirme se esse é o nome
        completo do competidor de acordo com um documento oficial.
      competitor_limit_exceeded_warning: >-
        O número de pessoas na competição (%{n_competitors}) está acima do
        limite de competidores (%{competitor_limit}). Os resultados dos
        competidores inscritos após o limite ter sido atingido devem ser
        removidos.
    results:
      automatically_position_fixed_info: >-
        [%{round_id}] A posição de %{person_name} foi automaticamente ajustada
        de %{pos} para %{expected_pos}.
      mbf_result_over_time_limit_warning: >-
        [%{round_id}] Resultado '%{result}' de %{person_name} está acima do
        tempo limite. Por favor verifique se isso é devido a penalidades de
        tempo antes de enviar os resultados, ou ajuste o resultado para DNF.
      result_after_dns_warning: >-
        [%{round_id}] %{person_name} tem pelo menos um resultado DNS seguido de
        um resultado válido. Por favor verifique se é realmente um DNS e, se
        for, explique o que aconteceu para o WRT.
      similar_results_warning: >-
        [%{round_id}] Resultados de %{person_name} são semelhantes aos
        resultados de %{similar_person_name}. Por favor certifique-se de que os
        resultados estão registrados corretamente para ambos os competidores.
      met_cutoff_but_missing_results_error: >-
        [%{round_id}] %{person_name} passou o tempo de corte (%{cutoff}) mas não
        tem resultados para a segunda fase da rodada.
      didnt_meet_cutoff_but_has_results_error: >-
        [%{round_id}] %{person_name} tem pelo menos um resultado para a segunda
        fase da rodada mas não passou do tempo de corte (%{cutoff}).
      wrong_attempts_for_cutoff_error: >-
        [%{round_id}] Está faltando pelo menos uma tentativa para %{person_name}
        na fase de corte. Por favor edite o resultado para incluir a(s)
        tentativa(s) faltante(s) ou atualize as informações da rodada na página
        Gerenciar Eventos da competição.
      mismatched_result_format_error: >-
        [%{round_id}] Os resultados de %{person_name} estão no formato errado:
        esperado %{expected_format}, apresentado %{format}.
      result_over_time_limit_error: >-
        [%{round_id}] Pelo menos um resultado de %{person_name} está acima do
        tempo limite para a rodada, que é %{time_limit} por tentativa. Todas as
        tentativas acima do limite devem ser alterados para DNF.
      results_over_cumulative_time_limit_error: >-
        [%{round_ids}] A soma dos resultados de %{person_name} está acima do
        tempo limite cumulativo, que era %{time_limit}.
      no_round_information_warning: >-
        [%{round_id}] Não há informação sobre o tempo de corte e tempo limite
        para essa rodada. Essas validações foram puladas. Por favor atualize a
        informação da rodada na página Gerenciar Eventos da competição.
      undefined_time_limit_warning: >-
        [%{round_id}] O tempo limite para essa rodada não está definido;
        validações de tempo limite foram puladas. Isso é esperado somente para
        competições antes de 2013.
      suspicious_dnf_warning: >-
        [%{round_ids}] A rodada tem um tempo limite cumulativo, e extrapolando
        com base nas tentativas bem-sucedidas de %{person_name}, ele(a) teria
        pouco tempo restante para pelo menos um de seus DNFs. Por favor
        certifique-se de que cada DNF e DNS estão corretos. Se o competidor não
        iniciou uma tentativa ou não tinha tempo restante antes de iniciar uma
        tentativa, ela deve ser registrada como DNS.
      missing_cumulative_round_id_error: >-
        [%{original_round_id}] Não foi possível localizar a rodada %{wcif_id}
        para o tempo limite cumulativo especificado no WCIF. Por favor vá até a
        página Gerenciar Eventos da competição e remova %{wcif_id} do tempo
        limite cumulativo para %{original_round_id}. O WST já sabe sobre esse
        bug (GitHub issue #3254).
      wrong_position_in_results_error: >-
        [%{round_id}] %{person_name} está na posição errada: esperada
        %{expected_pos}, apresentada %{pos}.
    rounds:
      too_many_qualified_warning: >-
        Rodada %{round_id}: mais competidores qualificados do que planejado nas
        condições de avanço (%{actual} em vez de %{expected}, a condição era:
        %{condition}). Por favor atualize as informações da rodada na página
        Gerenciar Eventos.
      unexpected_round_results_error: >-
        A rodada %{round_id} está presente nos resultados mas não foi criada na
        aba de eventos. Por favor inclua as informações da rodada na página
        Gerenciar Eventos da competição.
      regulation_9m1_error: >-
        Rodada %{round_id} tem 99 competidores ou menos, mas tem mais de duas
        rodadas subsequentes, o que não é permitido conforme Regra 9m1.
      regulation_9m2_error: >-
        Rodada %{round_id} tem 15 competidores ou menos mas tem mais de uma
        rodada subsequente, o que não é permitido conforme Regra 9m2.
      regulation_9m3_error: >-
        Rodada %{round_id} tem 7 competidores ou menos mas tem pelo menos uma
        rodada subsequente, o que não é permitido conforme Regra 9m3.
      regulation_9p1_error: >-
        Rodada %{round_id}: Menos de 25% dos competidores foram eliminados, o
        que não é permitido conforme Regra 9p1.
      no_competitor_eliminated_error: >-
        Rodada %{round_id}: Deve haver pelo menos um competidor eliminado, o que
        é exigido conforme Regra 9p (competições antes de Abril de 2010).
      less_than_twenty_five_percent_eliminated_error: >-
        Rodada %{round_id}: de acordo com as condições de avanço (%{condition}),
        menos de 25% dos competidores seriam eliminados, o que não é permitido
        conforme Regra 9p1. Por favor atualize as informações da rodada na
        página Gerenciar Eventos.
      not_enough_qualified_warning: >-
        Rodada %{round_id}: de acordo com as informações dos eventos, no máximo
        %{expected} competidores poderiam ter avançado, mas apenas %{actual}
        competiram na rodada. Por favor deixe um comentário sobre isso (ou
        corrija as informações dos eventos se você aplicou uma condição de
        avanço diferente).
      competed_not_qualified_error: >-
        Rodada %{round_id}: %{ids} competiram mas não cumpriram a condição de
        resultado para avançar (%{condition}). Por favor certifique-se de que a
        condição de avanço reflete o que foi usado durante a competição, e
        remova os resultados se necessário.
      round_not_found_error: >-
        Rodada %{round_id} não foi encontrada. Por favor certifique-se de que o
        painel Editar Eventos do site da WCA e o WCA Live estão sincronizados.
      missing_round_results_error: >-
        Não há resultados para a rodada %{round_id} mas ela está listada na aba
        de eventos. Se essa rodada não aconteceu, por favor remova-a na página
        Gerenciar Eventos da competição.
      unexpected_combined_round_error: >-
        Não foi anunciado um tempo de corte para '%{round_name}', mas a rodada
        foi detectada como uma rodada com corte nos resultados. Por favor
        atualize as informações na página Gerenciar Eventos da competição.
    events:
      not_333_main_event_warning: >-
        O evento principal selecionado para esta competição é %{main_event_id}.
        Como esse evento foi tratado na competição? Por favor forneça ao WRT uma
        explicação breve (p. ex. número de rodadas, prêmios, vencedor declarado
        da competição, ...).
      no_main_event_warning: >-
        Não há um evento principal selecionado para esta competição. Por favor
        informe ao WRT se isso está correto.
      unexpected_results_error: >-
        Há resultados para %{event_id}, contudo ele não está listado como um
        evento oficial. Por favor remova o evento dos resultados ou contate a
        WCAT para solicitar que o evento seja adicionado ao site da WCA.
      missing_results_warning: >-
        Não há resultados para %{event_id}, mas ele está listado como um evento
        oficial. Se o evento aconteceu, por favor reenvie o JSON com os
        resultados incluídos. Se o evento não aconteceu, deixe um comentário
        para o WRT.
    scrambles:
      missing_scrambles_for_round_error: >-
        [%{round_id}] Embaralhamentos faltando. Use o Scrambles Matcher para
        adicionar os embaralhamentos corretos à rodada.
      missing_scrambles_for_competition_error: >-
        Embaralhamentos faltando para a competição. Use o Scrambles Matcher para
        adicionar os embaralhamentos.
      unexpected_scrambles_for_round_error: >-
        [%{round_id}] Embaralhamentos excessivos. Use o Scrambles Matcher para
        desmarcar os embaralhamentos não usados.
      missing_scrambles_for_group_error: >-
        [%{round_id}] Grupo %{group_id}: embaralhamentos faltando, detectados
        apenas %{actual} em vez de %{expected}.
      missing_scrambles_for_multi_error: >-
        [%{round_id}] Apesar de poder ter múltiplos grupos no 3x3x3
        Multi-Vendado, pelo menos um dos grupos deve conter embaralhamentos para
        todas as tentativas.
      multiple_fmc_groups_warning: >-
        [%{round_id}] Há múltiplos grupos de FMC em uso. Se um dos grupos foi
        usado, por favor use o Scrambles Matcher para desmarcar os
        embaralhamentos não usados. Caso contrário, por favor inclua um
        comentário para o WRT explicando porque múltiplos grupos foram usados.
      wrong_number_of_scramble_sets_error: >-
        [%{round_id}] Essa rodada tem um número diferente de embaralhamentos do
        especificado na aba Gerenciar Eventos. Por favor ajuste o número de
        embaralhamentos para o número que foi usado.
