  incidents_log:
    i18n_disclaimer: >-
      Por favor note que a seção de incidentes somente está disponível em
      Inglês; o conteúdo abaixo não está traduzido.
    incident: 'Incidente:'
  about_regulations:
    title: Sobre o Regulamento
    panel1:
      title: Regulamento
      content1_html: >-
        Todos os competidores devem seguir o <a href="/regulations/">Regulamento
        da WCA</a>. É importante que os competidores leiam esse regulamento
        antes de participar de sua primeira competição.
      content2_html: >-
        O Regulamento da WCA é complementado pelas <a
        href="/regulations/guidelines.html">Orientações da WCA</a>, que contém
        esclarecimentos e explicações adicionais.
      content3_html: >-
        Decisões importantes sobre incidentes que aconteceram em competições e
        que foram resolvidos pelo Comitê do Regulamento da WCA podem ser
        encontradas no <a href="/incidents">Registro de incidentes</a>.
    panel2:
      title: Traduções
      content1_html: >-
        O Regulamento da WCA está disponível não apenas em inglês, já que
        membros da WCA o traduziram para várias línguas: <a
        href="/regulations/translations/">Traduções</a>
      content2_html: >-
        <strong>Importante</strong>: Ainda que as traduções sejam úteis, elas
        não são oficiais. Em competições, a versão em inglês deve ser seguida.
    panel3:
      title: Perguntas Frequentes sobre o Regulamento
      content1_html: >-
        A <a href="/faq">Seção de Perguntas Frequentes</a> responde várias
        questões comuns sobre o Regulamento da WCA.
    panel4:
      title: Orientações para Organizadores
      content1_html: >-
        Se você está interessado em organizar uma competição ou já está
        planejando uma, por favor leia nossas <a
        href="https://documents.worldcubeassociation.org/edudoc/organizer-handbook/organizer-handbook.pdf">Orientações
        para Organizadores</a>.
      content2_html: >-
        Esse documento contém informações importantes e deve ser lido por todos
        os organizadores de competições.
  regulations_translations:
    title: 'Regulamento e Orientações da WCA: Traduções'
    paragraph1: 'Se você fala outra língua além do Inglês, estas traduções podem ser
      úteis.'
    paragraph2: >-
      Por favor atente-se para o fato de que essa tradução não é uma versão
      oficial (embora seja disponibilizada no site da WCA): ela pode ser útil,
      mas não vem com nenhuma garantia. Se houver diferenças entre uma tradução
      e a versão (atualmente oficial) em inglês, esta última deve ser usada.
    translations: Traduções
    current: Atual
    old: Antigas
    table_elements:
      version: Versão
      language: Língua
    translating: Traduzindo o Regulamento
    paragraph3_html: >-
      Se você está interessado em adicionar/atualizar uma tradução, por favor
      veja <a
      href="https://github.com/thewca/wca-regulations-translations#translation-instructions">as
      instruções no repositório GitHub</a>.
  media:
    common:
      view_media_page: Ver todas as mídias
      confirm_delete: Tem certeza que deseja apagar esta mídia?
    new:
