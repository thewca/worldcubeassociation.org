          disabled: desativado
          enable: Ativar 2FA
          disable: Desabilitar 2FA
          reset: Redefinir o segredo 2FA
          reset_if_needed: >-
            Se um de seus dispositivos foi comprometida, ou você quer revogar o
            acesso de seus dispositivos, você pode resetar seu segredo de
            autenticação de dois fatores abaixo:
          reset_warning: Você precisará reconfigurar todos os seus dispositivos 
            2FA.
          methods: Métodos de dois fatores
          methods_description: >-
            Você pode usar vários métodos para obter uma senha temporária ao
            entrar, conforme descrito abaixo.
          dedicated_app: Usar um aplicativo específico de dois fatores
          dedicated_app_desc_html: >-
            O WST recomenda usar %{authy} em seu(s) dispositivo(s) pessoal(is)
            para obter sua senha temporária ao entrar.<br/>Outras alternativas
            incluem %{google} e %{microsoft}.
          scan_qrcode_html: >-
            Escaneie o código QR abaixo quando solicitado por seu aplicativo 2FA
            (ou clique %{here} se você não está no celular).
          backup_codes: Códigos de segurança
          backup_codes_desc: >-
            Códigos de segurança podem ser usados como senhas temporárias caso
            você não tenha acesso a seu dispositivo com o aplicativo de
            autenticação de dois fatores. Cada código só pode ser usado uma vez.
            Guarde-os em um local seguro!
          no_backup_codes: >-
            Você ainda não gerou códigos de segurança. Clique no botão abaixo
            para gerá-los.
          regenerate_backup_codes: >-
            Você já gerou códigos de segurança. Se você já usou ou perdeu estes
            códigos, você pode gerar novos usando o botão abaixo. Atente para o
            fato de que qualquer código existente será invalidado se você fizer
            isso.
          generate_backup_codes: Gerar códigos de segurança
          backup_codes_warning: >-
            Os códigos de segurança serão mostrados abaixo. Guarde-os ou anote
            imediatamente: eles são gravados em formato encriptado em nosso
            banco de dados e não podem ser exibidos novamente depois.
          email_auth_desc: Você pode pedir uma senha temporária por email quando
            tentar entrar.
          disable_section_title: Desabilitar autenticação em duas etapas
