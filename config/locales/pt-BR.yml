  page:
    translators:
      title: Tradutores
    officers_and_board:
      title: Oficiais e Conselho da WCA
      officers_description: >-
        Os oficiais da WCA cuidam de tarefas relacionadas à condição de entidade
        sem fins lucrativos. Esses oficiais são eleitos pelo Conselho. O Diretor
        Executivo é o "Chief Executive Officer (CEO)" da WCA, o Presidente
        coordena as reuniões do Conselho, o Secretário cuida dos documentos da
        organização, e o Tesoureiro é responsável pelos assuntos financeiros da
        WCA.
      board_description: >-
        O Conselho da WCA é responsável por liderar a organização como um todo e
        assumir quaisquer funções não cobertas pelas Equipes, Comitês e
        Conselhos.
    teams_committees_councils:
      title: 'Equipes, Comitês e Conselhos da WCA'
      description: >-
        Os comitês e equipes da WCA são uma parte fundamental da organização e
        desempenham as atividades cotidianas que são necessárias para seu
        funcionamento. Estes comitês/equipes são formatos por membros da
        comunidade da WCA, incluindo Delegados e competidores. Cada
        comitê/equipe tem um líder, cujo papel é garantir o bom funcionamento da
        equipe e direcionar os demais membros. Conselhos são um tipo especial de
        comitê que têm um papel consultivo ao Conselho da WCA, e são compostos
        de membros da comunidade, não parte dos Voluntários da WCA. Quando há
        vagas em um comitê, equipe ou Conselho, as informações sobre como se
        candidatar são postadas na página principal.
      contact_button: Contato
      no_contact_description: >-
        Os detalhes de contato dessa equipe/comitê não estão disponíveis
        publicamente.
      groups_name:
        wat: Equipe de Arquivo da WCA
        wct: Equipe de Comunicação da WCA
        wcat: Equipe de Anúncios de Competições da WCA
        wic: Comitê de Integridade da WCA
        weat: Equipe de Assistentes Executivos da WCA
        wfc: Comitê Financeiro da WCA
        wmt: Equipe de Marketing da WCA
        wmct: Equipe de Campeonatos Principais da WCA
        wqac: Comitê de Garantia da Qualidade da WCA
        wrc: Comitê do Regulamento da WCA
        wrt: Equipe de Resultados da WCA
        wst: Equipe de Software da WCA
        wsot: Equipe de Organização de Esportes da WCA
        wapc: Comitê de Apelação da WCA
      groups_description:
        wat: >-
          A Equipe de Arquivo da WCA (WAT) gerencia o desenvolvimento e
          manutenção do arquivo histórico da WCA. Eles documentam eventos chaves
          do speedcubing e marcos notáveis da WCA para serem apresentados numa
          linha do tempo da organização, preservando o legado da WCA.
        wct: >-
          A Equipe de Comunicação da WCA (WCT) supervisiona e apoia a
          comunicação da WCA com a Comunidade e o público em geral. A
          comunicação da WCA deve contribuir para os Objetivos da WCA e apoiar
          uma cultura geral positiva de amizade, transparência, inclusão,
          abertura e capacidade de resposta.
        wcat: >-
          A Equipe de Anúncio de Competições da WCA (WCAT) aprova e anuncia as
          competições da WCA solicitadas pelos Delegados, e garante que esses
          anúncios estejam de acordo com os padrões de qualidade da WCA. Também
          é responsável pelo protocolo adequado de pedidos de competições a
          partir de documentos como a Política de Requisitos de Competições da
          WCA. A WCAT NÃO é responsável por organizar ou delegar competições
          individualmente.
        wic: >-
          O Comitê de Integridade da WCA (WIC) realiza investigações
          independentes acerca de membros da comunidade da WCA e incidentes
          ocorridos durante competições da WCA ou em plataformas online oficiais
          da WCA. Esses incidentes são supostas violações do Espírito, Código de
          Conduta, Código de Ética e/ou Regulamento da WCA.
        weat: >-
          A Equipe de Assistentes Executivos da WCA (WEAT) realiza as tarefas
          administrativas do Conselho de Diretores da WCA.
        wfc: >-
          O Comitê Financeiro da WCA (WFC) gerencia as finanças da WCA,
          incluindo orçamentos, relatórios, análises, escrituração contábil e
          declarações fiscais. Eles também gerenciam a principal fonte de
          recursos, o Sistema de Taxas da WCA, juntamente com vários programas
          de financiamento que oferecem suporte às comunidades locais em
          diferentes estágios de desenvolvimento, incluindo financiamento de
          viagens, equipamentos e suporte às Organizações Regionais.
        wmt: >-
          A Equipe de Marketing da WCA (WMT) gerencia a marca da WCA, procurando
          patrocínios, e comercializando Mercadorias da WCA.
        wmct: >-
          A Equipe de Campeonatos Principais da WCA (WMCT) supervisiona a
          coordenação e avanço dos Campeonatos Continentais e Mundial da WCA,
          desenvolvendo diretrizes e planos estratégicos, selecionando
          cidades-sede, apoiando as equipes de organização, e garantindo
          experiências de campeonatos consistentes.
        wqac: >-
          O Comitê de Garantia da Qualidade da WCA (WQAC) promove a contínua
          melhora da qualidade na WCA, assim como a aplicação mundial de padrões
          de qualidade para garantir uma consistente alta qualidade dos
          processos, dos Voluntários da WCA, Organizações Regionais,
          Organizadores e Voluntários de Competição.
        wrc: >-
          O Comitê do Regulamento da WCA (WRC) lida com os problemas
          relacionados à aplicação, melhoria e desenvolvimento do Regulamento da
          WCA. Eles apoiam os Delegados da WCA em qualquer tipo de matéria
          procedimental que ocorra em competições e decidem sobre incidentes não
          resolvidos ou não previstos.
        wrt: >-
          A Equipe de Resultados da WCA (WRT) gerencia as informações nos bancos
          de dados da WCA, principalmente resultados de competições e dados dos
          competidores.
        wst: >-
          A Equipe de Software da WCA (WST) gerencia todo o software da WCA
          (website, embaralhadores, planilhas, ferramentas administrativas.
        wsot: >-
          A Equipe de Organização Esportiva (WSOT) supervisiona e apoia o
          reconhecimento da WCA como uma organização esportiva internacional.
        wapc: >-
          O Comitê de Apelação da WCA (WAC) revisa e decide apelações acerca de
          decisões tomadas por outros Voluntários da WCA. O WAC fornece um
          processo de revisão independente e imparcial para garantir que as
          decisões sejam justas, razoáveis e de acordo com as políticas e
          regulamentos da WCA.
