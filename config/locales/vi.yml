      incident:
        title: 'Lưu ý nội dung này được công khai, và bạn phải điền bằng tiếng Anh!'
        private_description: >-
          Mô tả về sự cố (chỉ Delegate có thể đọc). Vui lòng điền bằng tiếng
          Anh.
        private_wrc_decision: >-
          Quyết định cuối cùng của WRC, bao gồm các thông tin không công khai.
          Vui lòng điền bằng tiếng Anh.
        public_summary: >-
          Mô tả tổng quan về sự cố và quyết định cuối cùng để hiển thị công
          khai. Vui lòng điền bằng tiếng Anh.
      user:
        dob: >-
          Nhập ngày sinh của thí sinh theo định dạng YYYY-MM-DD
          (năm-tháng-ngày).
        name: >-
          Nhập chính xác họ tên đầy đủ của thí sinh, ví dụ: <strong>Nguyễn Văn
          A</strong>. Không nhập cẩu thả như <strong>nguyen van a</strong> hay
          <strong>NGUYEN VAN A</strong>.<br/>Không bắt buộc nhập tên đệm (đầy đủ
          hoặc viết tắt).
        pending_avatar: >-
          Sau khi đăng tải hình đại diện mới, bạn cần đợi Đội ngũ Kết quả WCA
          (WCA Results Team) xét duyệt trước khi hình đại diện được hiển thị
          công khai.
        registration_notifications_enabled: >-
          Cài đặt này chỉ áp dụng cho các giải đấu bạn tổ chức hoặc làm nhiệm vụ
          Delegate, và có thể thiết lập riêng cho mỗi giải đấu.
        receive_developer_mails: >-
          Tùy chọn này chỉ áp dụng đối với các bản cập nhật lớn của các tài
          nguyên như bản xuất dữ liệu, schema WCIF và API công khai. Các nhà
          phát triển bảo trì các phần mềm phụ thuộc vào các tài nguyên trên nên
          kích hoạt tùy chọn này.
        receive_delegate_reports: >-
          Nếu bạn là Senior Delegate hoặc là Thành viên WRC hoặc WQAC, bạn mặc
          định sẽ nhận Báo cáo Delegate. Lưu ý: thay đổi có thể mất tối đa 12
          giờ để có hiệu lực.
        delegate_reports_region: >-
          Để trống ô này (tùy chọn trên cùng) nếu bạn muốn nhận tất cả báo cáo.
          Lưu ý: thay đổi có thể mất tối đa 12 giờ để có hiệu lực.
        otp_attempt: >-
          Kiểm tra ứng dụng tạo mã đã cài đặt trên điện thoại để lấy mã OTP,
          hoặc nhập mã phục hồi.
      dob_contact:
        dob: >-
          Ngày sinh chính xác của bạn, viết dưới dạng YYYY-MM-DD
          (năm-tháng-ngày)
        document: >-
          Để xác minh danh tính và ngày sinh của bạn, vui lòng đính kèm ảnh chụp
          giấy tờ tùy thân (căn cước công dân, giấy phép lái xe, thẻ học
          sinh/sinh viên, hộ chiếu, giấy khai sinh,...) có ghi rõ họ tên và ngày
          tháng năm sinh của bạn, sao cho một người nói tiếng Anh có thể hiểu
          được (hoặc liên hệ WCA Delegate ở khu vực của bạn nếu không có các
          giấy tờ trên). Ảnh chụp giấy tờ cần có ít nhất là họ tên và ngày tháng
          năm sinh; những thông tin khác bạn có thể làm mờ hoặc che đi tùy ý.
      post:
        body: >-
          Sử dụng thẻ &lt;!-- break --&gt; để hiện bản xem trước trên trang chủ.
          Trang chủ sẽ hiển thị nội dung đặt phía trước thẻ này. Trang bài viết
          sẽ hiển thị đầy đủ nội dung.
        show_on_homepage: >-
          Lưu ý! Không sử dụng tùy chọn này cho dữ liệu không công khai. Tùy
          chọn này chỉ nhằm mục đích tránh làm tràn trang chủ. Các bài viết
          không đăng trên trang chủ vẫn có thể được truy cập thông qua các liên
          kết thường trực hoặc các thẻ.
      delegate_report:
        schedule_url: >-
          Đường dẫn đầy đủ đến thời gian biểu (VD:
          https://www.cubingusa.com/usnationals2016/schedule.php)
        equipment: >-
          Số lượng và loại đồng hồ và màn hình hiển thị được sử dụng tại giải đấu.
          Vui lòng xoá những dòng cho loại thiết bị bạn không sử dụng.
        summary: >-
          Những mục trên chỉ là gợi ý bố cục cho một báo cáo hoàn chỉnh. Vui
          lòng sử dụng tùy theo nhu cầu của bạn. Hãy lược bỏ đi các phần không
          dùng đến!
        venue: >-
          Những mục trên chỉ là gợi ý bố cục cho một báo cáo hoàn chỉnh. Vui
          lòng sử dụng tùy theo nhu cầu của bạn. Hãy lược bỏ đi các phần không
          dùng đến!
        organization: >-
          Những mục trên chỉ là gợi ý bố cục cho một báo cáo hoàn chỉnh. Vui
          lòng sử dụng tùy theo nhu cầu của bạn. Hãy lược bỏ đi các phần không
          dùng đến!
        incidents: >-
          Liệt kê toàn bộ các sự cố bất thường so với các sự cố thường gặp. Đánh
          số cho các sự cố từ 1. để các Delegate khác có thể sử dụng số thứ tự
          này để nhắc đến các sự cố. Nếu không có sự cố gì bất thường, hãy liệt
          kê ra các sự cố đáng chú ý nhất. Tích vào các hộp tương ứng dưới đây
          nếu bạn cần phản hồi từ các Ủy ban.
        setup_images: >-
          Bạn PHẢI đính kèm ít nhất %{image_count} hình chụp khu vực tráo đề và
          thi đấu của giải đấu này, nên là hình chụp khi giải đấu đang diễn ra
          (tuy nhiên cũng có thể đính kèm các ảnh khác). Bạn có thể chọn nhiều
          ảnh cùng một lúc. Bạn chỉ có thể xóa hình khi đã tải lên đủ số hình
          khác (nếu muốn thay thế, bạn phải đăng hình mới lên trước khi xóa hình
          cũ). Vui lòng giải thích lý do nếu không có hình chụp khu vực thi đấu
          và/hoặc khu vực tráo đổi khi giải đấu đang diễn ra.
        wrc_incidents: Số thứ tự của các sự cố cần phản hồi từ WRC.
        wic_incidents_html: >-
          Số thứ tự của các sự cố cần phản hồi từ WIC. <br>
          <strong>%{wic_incident_alert}</strong>
        wic_incident_alert: >-
          Nếu sự cố cần WIC xem xét có tính chất nhạy cảm (bao gồm các trường
          hợp vi phạm pháp luật, quấy rối, hành hung, v.v.), vui lòng không thêm
          sự cố vào báo cáo và gửi email riêng cho WIC. Đối với các sự cố khác,
          vui lòng chỉ mô tả ngắn gọn về sự cố mà không bao gồm thông tin cá
          nhân, và liên hệ riêng với WIC để cung cấp thông tin chi tiết. WIC vẫn
          sẽ có phản hồi đối với phiên bản được báo cáo công khai nhằm tạo nhận
          thức chung. Đối với các sự cố có liên quan đến Tình nguyện viên WCA
          cần được WIC xem xét, vui lòng loại bỏ toàn bộ thông tin khỏi báo cáo
          và liên hệ riêng với WIC.
        remarks: >-
          Nói về bất kỳ điều gì khác mà bạn muốn chia sẻ (VD: cộng đồng phát
          triển hơn/suy thoái đi, các kế hoạch sắp tới của khu vực). Nếu bạn
          muốn bổ sung nội dung cho các phần trước, xin mời viết thêm tại đây.
