        Hiệp hội Rubik Thế giới quản lý các giải đấu về các khối hình giải đố cơ
        học hoạt động bằng cách xoay cụm các viên, còn được gọi là "khối hình
        xoay".
    competitions:
      title: Giải đấu
      text_html: >-
        Tìm các giải đấu ở gần bạn hoặc xem kết quả thi đấu của mình. Bạn đang ở
        tại giải đấu và muốn xem kết quả trực tiếp? Hãy đến ngay
        %{wca_live_link}!
    merchandise:
      title: Văn hóa phẩm
      ad_new: Mới
      text_html: >-
        Hãy khám phá các phụ kiện mới nhất của chúng tôi, bao gồm các sản phẩm
        từ áo phông đến áo hoodie.
      link_title: Cửa hàng online
    records:
      title: Kỷ lục
      text: >-
        Xem các kỷ lục hiện tại và trong quá khứ của các nội dung thi đấu chính
        thức của WCA.
    volunteer:
      title: Tình nguyện viên
      text: >-
        Nếu bạn muốn giúp vận hành WCA, các đội ngũ tình nguyện của WCA có thể
        có vị trí còn trống. Bạn không nhất thiết phải là thí sinh mới có thể
        làm tình nguyện viên.
    faq:
      title: Câu hỏi thường gặp
      text: >-
        Hãy xem các Câu hỏi thường gặp nếu bạn cần trợ giúp. Các câu hỏi của bạn
        có thể đã được giải đáp ở đó.
