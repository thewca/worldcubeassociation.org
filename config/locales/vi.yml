      title: Liên hệ
      text_html: >-
        Nếu có nhu cầu liên hệ với chúng tôi, vui lòng điền đơn liên hệ. Nếu bạn
        có câu hỏi về các quy trình của WCA, hãy nhớ đọc qua các %{faq_link}!
      faq: Câu hỏi thường gặp
      button: Đến đơn Liên hệ WCA
    support:
      title: Ủng hộ hỗ trợ WCA
      text: >-
        Hiệp hội Rubik Thế giới là một tổ chức miễn thuế thuộc diện 501(c)(3).
        Với vai trò là một tổ chức được duy trì hoàn toàn bởi các tình nguyện
        viên, chúng tôi rất hoan nghênh việc bạn đóng góp để giúp chúng tôi tiếp
        tục thực hiện Sứ mệnh đẩy mạnh cộng đồng speedcubing trên toàn thế giới
        và duy trì một môi trường thi đấu thú vị và công bằng cho tất cả mọi
        người.
      button: Biết thêm những cách bạn có thể hỗ trợ WCA
    become_delegate:
