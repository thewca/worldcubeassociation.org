      text: Hãy giúp hỗ trợ tổ chức các giải đấu chuyên nghiệp và công bằng tại 
        cộng đồng của bạn bằng cách ứng tuyển trở thành Trainee Delegate.
      link_title: Ứng tuyển ngay
