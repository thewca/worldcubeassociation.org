      end_date_after_start_date: Không được công nhận cho tới
    create:
      create_success: >-
        Đơn đăng ký đã được nộp thành công! Vui lòng kiểm tra email và đợi Ban
        Quản trị xét duyệt
    delete:
      confirm_delete: Bạn có chắc chắn muốn xóa yêu cầu Hiệp hội Khu vực này 
