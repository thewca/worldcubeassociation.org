        Các đội ngũ và ủy ban của WCA đóng vai trò mật thiết trong tổ chức và
        thực hiện các nhiệm vụ thường nhật để đảm bảo cho tổ chức hoạt động suôn
        sẻ. Các thành viên của các ủy ban này bao gồm các thành viên cộng đồng
        WCA, bao gồm cả WCA Delegate và thí sinh. Mỗi đội ngũ đều có một người
        lãnh đạo, với vai trò đảm bảo đội ngũ hoạt động suôn sẻ và hướng dẫn các
        thành viên khác. Khi có vị trí trống trong các đội ngũ và ủy ban, tại
        trang chính sẽ có hướng dẫn cách ứng tuyển.
      contact_button: Liên hệ
      no_contact_description: Thông tin liên hệ của đội ngũ/ủy ban này không 
        được công khai.
      groups_name:
        wat: Đội ngũ Lưu trữ WCA
        wct: Đội ngũ Truyền thông WCA
        wcat: Đội ngũ Công bố Giải đấu WCA
        wic: Ủy ban Liêm chính WCA
        weat: Đội ngũ Trợ lý Điều hành WCA
        wfc: Ủy ban Tài chính WCA
        wmt: Đội ngũ Tiếp thị WCA
        wmct: Đội ngũ Giải Vô địch Khu vực WCA
        wqac: Ủy ban Bảo đảm Chất lượng WCA
        wrc: Ủy ban Quy định WCA
        wrt: Đội ngũ Kết quả WCA
        wst: Đội ngũ Phần mềm WCA
        wsot: Đội ngũ Hiệp hội Thể thao WCA
        wapc: Ủy ban Kháng nghị WCA
      groups_description:
        wat: >-
          Đội ngũ Lưu trữ WCA (WAT) chịu trách nhiệm quản lý sự phát triển và
          duy trì kho lưu trữ thông tin về WCA. Đội ngũ này có nhiệm vụ ghi chú
          lại các sự kiện, cột mốc lớn trong lịch sử bộ môn speedcubing và WCA
          để trình bày trong một dòng thời gian lớn về WCA, để bảo tồn di sản và
          dấu ấn của WCA với bộ môn speedcubing.
        wct: >-
          Đội ngũ Truyền thông WCA (WCT) có vai trò giám sát, hỗ trợ việc liên
          lạc, truyền thông giữa WCA và cộng đồng và với đại chúng. Việc truyền
          thông của WCA nên đóng góp cho Mục tiêu chung của WCA và tạo nên một
          văn hóa đầy sự thân thiện, cởi mở, chào đón, minh bạch và năng động.
        wcat: >-
          Đội ngũ Công bố Giải đấu WCA (WCAT) chịu trách nhiệm phê duyệt và công
          bố các Giải đấu WCA theo yêu cầu của các WCA Delegate, và đảm bảo việc
          công bố này hợp với các quy chuẩn chất lượng của WCA. Đội ngũ này cũng
          đóng vai trò duy trì các quy trình đề xuất giải đấu thông qua các tài
          liệu như Chính sách Yêu cầu Giải đấu WCA. WCAT KHÔNG chịu trách nhiệm
          tổ chức hoặc thực hiện các nhiệm vụ của Delegate cho các giải đấu.
        wic: >-
          Ủy ban Liêm chính WCA (WIC) chịu trách nhiệm thực hiện các cuộc điều
          tra độc lập về các thành viên cộng đồng WCA và các vụ việc xảy ra tại
          các Giải đấu WCA, hoặc trên các kênh trực tuyến chính thức của WCA.
          Các vụ việc này bao gồm các cáo buộc vi phạm các Giá trị Cốt lõi, Quy
          tắc Ứng xử, Quy chuẩn Đạo đức và/hoặc Quy định của WCA.
        weat: >-
          Đội ngũ Trợ lý Điều hành WCA (WEAT) có nhiệm vụ thực hiện các công
          việc điều hành của Ban Quản trị WCA.
        wfc: >-
          Ủy ban Tài chính WCA (WFC) có trách nhiệm quản lý tài chính chung của
          WCA, bao gồm đề ra ngân sách, làm báo cáo, phân tích, kế toán, và kê
          khai thuế. Ủy ban này cũng quản lý nguồn thu chính cho ngân quỹ WCA là
          Hệ thống Hội phí WCA, cùng với các chương trình hỗ trợ tài chính khác
          dành cho các cộng đồng khu vực với các giai đoạn phát triển khác nhau,
          bao gồm chính sách Hỗ trợ Đi lại, Hỗ trợ Trang thiết bị và Hỗ trợ Hiệp
          hội Khu vực.
        wmt: >-
          Đội ngũ Tiếp thị WCA (WMT) chịu trách nhiệm quản lý Thương hiệu WCA,
          thu hút các nhà tài trợ, và quảng bá Văn hóa phẩm WCA.
        wmct: >-
          Đội ngũ Giải Vô địch Khu vực WCA (WMCT) chịu trách nhiệm giám sát và
          quản lý sự phối hợp và phát triển các giải Vô địch Châu lục và Vô địch
          Thế giới WCA bằng cách phát triển các bản hướng dẫn và kế hoạch chiến
          lược, chọn lựa địa điểm đăng cai, hỗ trợ các đội ngũ tổ chức các giải
          Vô địch và đảm bảo trải nghiệm của các thí sinh tại các giải đấu này
          chặt chẽ nhất có thể.
        wqac: >-
          Đội ngũ Bảo đảm Chất lượng WCA (WQAC) nắm vai trò đảm bảo sự cải thiện
          về chất lượng trong WCA, và quản lý sự áp dụng các quy chuẩn chất
          lượng trên toàn cầu để đảm bảo các quy trình, Tình nguyện viên WCA,
          Hiệp hội Khu vực, Ban tổ chức Giải đấu và Tình nguyện viên Giải đấu
          luôn có chất lượng làm việc cao.
        wrc: >-
          Ủy ban Quy định WCA (WRC) nắm vai trò xử lý các vấn đề liên quan đến
          việc áp dụng, cải thiện và phát triển bản Quy định WCA. Ủy ban này hỗ
          trợ các WCA Delegate trong các vấn đề về quy trình tại các giải đấu,
          đồng thời đưa ra quyết định giải quyết các vấn đề còn tồn đọng hoặc
          được phát hiện trong tương lai.
        wrt: >-
          Đội ngũ Kết quả WCA (WRT) chịu trách nhiệm quản lý toàn bộ dữ liệu
          trong các cơ sở dữ liệu của WCA, bao gồm kết quả thi đấu và dữ liệu
          thí sinh.
        wst: >-
          Đội ngũ Phần mềm WCA (WST) chịu trách nhiệm quản lý các sản phẩm phần
          mềm của WCA (website, phần mềm tạo công thức tráo, công cụ quản trị).
        wsot: >-
          Đội ngũ Hiệp hội Thể thao WCA (WSOT) đóng vai trò giám sát và hỗ trợ
          kế hoạch để WCA được công nhận là hiệp hội thể thao thế giới.
        wapc: >-
          Ủy ban Kháng nghị WCA (WAC) có trách nhiệm xem xét và giải quyết các
          kháng nghị về các quyết định của các Tình nguyện viên WCA khác. Ủy ban
          này có nhiệm vụ cung cấp một quy trình xem xét công minh và độc lập để
          đảm bảo các quyết định đều công bằng, hợp lý và tuân theo các quy định
          và chính sách của WCA.
