  about_regulations:
    title: Về Quy định
    panel1:
      title: Quy định
      content1_html: >-
        Tất cả các giải đấu phải tuân theo <a href="/regulations/">Quy định
        WCA</a>. Thí sinh cần phải đọc các quy định trước khi tham gia giải đấu
        đầu tiên.
      content2_html: >-
        Các quyết định quan trọng về các sự cố tại các giải đấu được Ủy ban Quy
        định WCA giải quyết được lưu lại tại <a href="/incidents">Nhật trình Sự
        cố</a>.
    panel2:
      title: Bản dịch
      content1_html: >-
        Quy định WCA không chỉ có bản tiếng Anh, mà các thành viên WCA đã phiên
        dịch qua nhiều ngôn ngữ: <a href="/regulations/translations/">Bản
        dịch</a>.
      content2_html: >-
        <strong>Quan trọng</strong>: Mặc dù các bản dịch rất hữu ích, chúng
        không phải chính thức. Trong giải đấu, bắt buộc phải sử dụng phiên bản
        tiếng Anh của Quy định WCA.
    panel3:
      title: Các câu hỏi thường gặp về Quy định
      content1_html: >-
        <a href="/faq">Mục Các câu hỏi thường gặp</a> giúp trả lời các câu hỏi
        thường thấy về Quy định WCA.
    panel4:
      title: Sổ tay hướng dẫn tổ chức giải đấu
      content1_html: >-
        Nếu bạn có hứng thú tổ chức một giải đấu hoặc đang có kế hoạch tổ chức, vui
        lòng đọc <a href="/organizer-guidelines">Sổ tay hướng dẫn tổ chức giải đấu</a>.
      content2_html: >-
        Tài liệu này bao gồm các thông tin quan trọng và cần được đọc bởi mọi
        người tổ chức giải đấu.
  regulations_translations:
    title: 'Quy định WCA: Bản dịch'
    paragraph1: >-
      Nếu bạn không nói tiếng Anh bản địa, bạn có thể sẽ thấy các bạn dịch dưới
      đây hữu dụng.
    paragraph2: >-
      Lưu ý rằng các bản dịch không có hiệu lực chính thức, mặc dù được cung cấp
      trên trang web WCA. Nếu có sự khác biệt giữa bản dịch và bản tiếng Anh
      (hiện hành), bản tiếng Anh phải được sử dụng.
    translations: Bản dịch
    current: Hiện hành
    old: Trước đây
    table_elements:
      version: Phiên bản
      language: Ngôn ngữ
    translating: Dịch Quy định WCA
    paragraph3_html: >-
      Nếu bạn muốn tạo/cập nhật bản dịch, hãy xem <a
      href="https://github.com/thewca/wca-regulations-translations#translation-instructions">hướng
      dẫn trên repository GitHub của các bản dịch</a>.
  full_organizer_guidelines:
    description: >-
      Chào mừng đến với bộ Hướng dẫn cho Người tổ chức của WQAC. Nếu bạn mong
      muốn tổ chức giải đấu, bạn rất nên đọc qua các tài liệu này. Các tài liệu
      đã được chia thành hai mục là tài liệu thiết yếu và khuyến cáo. Hãy làm
      quen với thông tin trong các tài liệu này để có thể tổ chức được một giải
      đấu chất lượng cao và thú vị!
    disclaimer_html: >-
      <strong>Miễn trừ trách nhiệm</strong>: WCA không tổ chức giải đấu. Dưới tư
      cách người tổ chức một giải đấu được WCA tổ chức, bạn <strong>không được
      phép</strong> thay mặt WCA ký hợp đồng hay tài liệu. Bạn có thể liên hệ
      các hiệp hội khu vực hoặc quốc gia sẵn sàng tổ chức hoặc hỗ trợ việc tổ
      chức giải đấu.
