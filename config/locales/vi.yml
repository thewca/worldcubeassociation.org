  merch:
    title: Phụ kiện WCA
    paragraphs:
      '1': >-
        WCA có bán một số các phụ kiện độc quyền! Từ áo phông, hoodie, hình dán,
        thảm Stackmat, ba lô và nhiều hơn thế nữa! Các thiết kế của chúng tôi
        được cập nhật thường xuyên, bao gồm logo WCA, phụ kiện từ các giải Vô
        địch Thế giới, và các thiết kế kỷ niệm các Kỷ lục Thế giới.
      '2': >-
        Mua Phụ kiện WCA thông qua các cửa hàng online của chúng tôi là một
        trong những cách tốt nhất để hỗ trợ WCA - một tổ chức phi lợi nhuận được
        điều hành bởi các tình nguyện viên. Chúng tôi sử dụng lợi nhuận từ các
        phụ kiện này để hỗ trợ tài chính cho các giải Vô địch, cung cấp trang
        thiết bị và cho các hoạt động WCA khác.
      '3': >-
        Bạn có thể mua phụ kiện từ bất kỳ đâu trên thế giới - với các cửa hàng
        tại châu Âu, châu Á, Ấn Độ và nhiều nơi hơn nữa trong tương lai!
  database:
    results_export:
      heading: Bản xuất Dữ liệu Kết quả WCA
      deprecation_warning: >-
        THÔNG BÁO NGỪNG HỖ TRỢ: Phiên bản %{old_version} của Bản xuất Dữ liệu
        Kết quả đã lỗi thời, và sẽ không còn được hỗ trợ từ ngày
        %{deprecation_date}. Xin vui lòng chuyển sang Phiên bản %{new_version}
        trước ngày này.
      description: >-
        Ở trang này, chúng tôi xin cung cấp bản xuất dữ liệu kết quả WCA ở nhiều
        định dạng cho việc sử dụng và phân tích diện rộng. Chúng tôi thường sẽ
        cập nhật bản xuất này sau mỗi cuối tuần sau khi đã đăng tải kết quả. Các
        file sẽ được đánh số và ghi ngày tháng để bạn có thể biết mình đang dùng
        bản mới nhất hay chưa.
      permalink: link vĩnh viễn
      permalink_note: >-
        Lưu ý: Các liên kết thường trực sẽ trả lại bản xuất dữ liệu kết quả mới
        nhất của phiên bản đã cho - ví dụ, liên kết thường trực cho phiên bản v2
        sẽ trả lại bản xuất v2 mới nhất, nhưng sẽ luôn trả lại phiên bản v2 kể
        cả khi sau khi phiên bản v3 đi vào hoạt động.
      file_formats:
        sql: Các lệnh SQL để nhập vào cơ sở dữ liệu SQL.
        tsv: >-
          Các file TSV để nhập vào chương trình bảng tính như OpenOffice.org,
          Excel, v.v.
      hint_readme_html: >-
        File %{readme_filename} đi kèm bao gồm điều khoản sử dụng và miêu tả
        chung bộ dữ liệu (bằng tiếng Anh):
    developer_export:
      heading: Bản xuất Dữ liệu cho Nhà phát triển của WST
      description_html: >-
        Trên trang này, chúng tôi xin cung cấp bản xuất dữ liệu dành cho nhà
        phát triển của WST dưới dạng file SQL. Vui lòng xem thêm chi tiết tại
        %{github_link}.
      download: Tải xuống
  validators:
    persons:
      dob_is_jan_one_warning: >-
        Ngày sinh của %{name} rơi vào ngày 1 tháng 1, xin hãy kiểm tra lại xem
        ngày sinh có đúng hay không.
      dob_is_too_young_warning: >-
        %{name} được ghi là dưới 3 tuổi, vui lòng kiểm tra lại xem có đúng hay
        không.
      dob_is_too_old_warning: >-
        %{name} được ghi là khoảng 100 tuổi, vui lòng kiểm tra lại xem có đúng
        hay không.
      person_doesnt_have_any_results_error: 'Không có kết quả của %{person_name} với
