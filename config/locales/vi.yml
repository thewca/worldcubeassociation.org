      whitespace_in_name_error: >-
        Tên của '%{name}' có dấu cách ở cuối hoặc đầu tên hoặc có dấu cách bị
        lặp.
      person_with_non_existing_wca_id_error: 'Thí sinh %{name} có ID WCA không tồn
