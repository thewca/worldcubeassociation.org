            tính năng này.
          auto_accept_disable_threshold: >-
            Khi số đơn đăng ký đã được duyệt đạt mức này, hệ thống tự động duyệt
            đơn đăng ký sẽ bị vô hiệu hóa và chuyển lại quyền duyệt thủ công các
            đơn đăng ký cuối cùng cho ban tổ chức. Giới hạn này phải thấp hơn
            giới hạn thí sinh. Để trống nếu không dùng đến.
