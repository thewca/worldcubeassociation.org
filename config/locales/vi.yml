        Có ít nhất một người có tên '%{name}' trong cơ sở dữ liệu WCA (%{wca_ids}).
        Xin kiểm tra lại dể đảm bảo rằng '%{name}' khác với các thí sinh trước đây.
        Nếu không, xin vui lòng gán đúng ID WCA vào tài khoản người dùng và tạo lại
        file JSON kết quả.
      non_matching_dob_warning: >-
        Ngày sinh '%{dob}' của %{name} (%{wca_id}) không đúng với dữ liệu trong
        cơ sở dữ liệu WCA ('%{expected_dob}'). Nếu có sai sót, xin vui lòng sửa
        lại. Nếu không, xin vui lòng ghi chú cho WRT.
      non_matching_gender_warning: >-
        Giới tính '%{gender}' của %{name} (%{wca_id}) không đúng với dữ liệu
        trong cơ sở dữ liệu WCA ('%{expected_gender}'). Nếu có sai sót, xin vui
        lòng sửa lại. Nếu không, xin vui lòng ghi chú cho WRT.
      empty_gender_warning: >-
        Giới tính của thí sinh mới %{name} đang trống. Các giá trị giới tính hợp
        lệ là 'female', 'male' và 'other'. Xin vui lòng ghi chú cho WRT.
      non_matching_name_warning: >-
        Tên '%{name}' của %{wca_id} không đúng với dữ liệu trong cơ sở dữ liệu WCA
        ('%{expected_name}'). 
      non_matching_country_warning: >-
        Quốc tịch '%{country}' của %{name} (%{wca_id}) không đúng với dữ liệu
        trong cơ sở dữ liệu WCA ('%{expected_country}'). Nếu có sai sót, xin vui
        lòng sửa lại. Nếu không, xin vui lòng ghi chú cho WRT.
      multiple_newcomers_with_same_name_warning: >-
        Có nhiều thí sinh với tên hoàn toàn giống nhau: %{name}. Xin vui lòng đảm
        bảo rằng tất cả kết quả của các thí sinh này đều đúng và được phân tách bằng
        ID tương ứng.
      wrong_parenthesis_type_error: >-
        Dấu ngoặc đơn trong '%{name}' là ký hiệu bất thường, xin thay bằng dấu
        ngoặc đơn chuẩn '(' hoặc ')' và đánh dấu cách sao cho đúng.
      special_characters_in_name_warning: >-
        Tên của thí sinh '%{name}' có chứa kí tự đặc biệt không hợp lệ (số, dấu
        ngoặc kép, hoặc các kí hiệu khác). Tên thí sinh chỉ được phép bao gồm
        chữ cái, dấu cách, dấu gạch ngang, dấu nháy, dấu chấm và dấu ngoặc đơn.
      suspicious_last_name_warning: >-
        '%{name}' có tên lót là '%{suffix}', tên này có thể không phải là tên
        lót thực tế (VD: hậu tố chỉ thế hệ được viết đầy đủ). Hãy xác nhận rằng
        tên lót trên là tên lót trên giấy tờ, hoặc xóa đi/thay thế nếu cần.
      successive_uppercase_name_warning: >-
        '%{name}' có nhiều chữ viết hoa liền nhau trong tên. Hãy xác minh rằng
        tên này đã được viết đúng hoặc sửa lại nếu sai.
      lowercase_name_warning: >-
        '%{name}' có tên được viết hoa hoàn toàn. Vui lòng xác minh rằng tên này
        đã được viết đúng hoặc sửa lại nếu sai.
      missing_period_in_single_letter_middle_name_warning: >-
        '%{name}' có tên đệm viết tắt thành một chữ cái mà không có dấu chấm
