  regional_organizations:
    title: Tổ chức khu vực
    content: 'WCA công nhận các Tổ chức Khu vực sau đây:'
    empty: 'Hiện tại, không Tổ chức Khu vực nào được công nhận bởi WCA.'
    how_to:
      title: Làm thế nào để trở thành Tổ chức Khu vực của WCA
      description: >-
        WCA công nhận nhiều Hiệp hội Khu vực trên toàn thế giới. Nhiệm vụ của
        các Hiệp hội Khu vực là tổ chức các Giải đấu WCA và hỗ trợ các hoạt động
        của WCA tại khu vực. Các khu vực muốn thành lập Hiệp hội Khu vực nên có
        đóng góp cho phong trào WCA tại khu vực trước khi nộp đơn. Liên hệ WCA
        Delegate gần nhất để được hỗ trợ về việc tổ chức giải đấu trong khu vực
        của bạn.
    requirements:
      title: Yêu cầu đối với Tổ chức khu vực của WCA
      list:
        '1': Tích cực tham gia hỗ trợ giải đấu WCA trong khu vực của tổ chức
        '2': >-
          Tích cực đóng góp vào giải đấu WCA của châu lục được điều hành bởi Tổ
          chức Khu vực, nếu được yêu cầu bởi đội ngũ Ban Tổ chức
        '3': >-
          Tôn trọng và thực hiện các mục tiêu đặt ra trong Điều luật và Quy định
          của WCA
        '4': Tuân thủ theo tất cả các Quy định WCA
        '5': Chấp nhận và tuân theo các quyết định của Tình nguyện viên WCA
        '6': Lưu trữ bản sao điện tử của Điều luật và Quy định WCA
    application_instructions:
      title: Hướng dẫn đăng ký
      description_html: Vui lòng <a href='/regional-organizations/new'>điền 
        đơn</a> để đăng ký.
    regional_organization_form:
      filling_instructions_html: Vui lòng viết <b>bằng Tiếng Anh!</b>
      public_information: Thông tin chung
      private_information: Thông tin riêng tư
      private_information_disclaimer: Tất cả các thông tin dưới đây chỉ được 
        cung cấp cho Ban Quản trị WCA
