  contact:
    title: Kontakt information
    info_alert_html: >-
      Før du kontakter nogle af holdene på denne her side, så kig venligst først
      på vores %{link}!
    questions_and_comments_html: >-
      For spørgsmål og hjemmesiden, kommentarer og forslag, så brug denne <a
      href='/contact/website'>kontakt formular</a>. For spørgsmål som involverer
      et specifikt område eller konkurrence, så kontakt din lokale %{link}.
    committees_and_teams_html: <u>Komitéer og Hold</u>
    members: Medlemmer
    board:
      info_html: >-
        "The World Cube Association" er ledt af WCA bestyrelsen. De er
        ansvarlige for generelle forespørgsler og WCA organisationens helhed.
    wct:
      info_html: >-
        WCT er ansvarlige for at holde øje med og støtte kommunikationen fra WCA
        med kubing samfundet og offentligheden. De burde blive kontaktet hvis
        man har generelle spørgsmål omkring WCA eller deres medieoptræden.
    wdc:
      info_html: >-
        WDC undersøger en del situationer og foreslår løsninger, også straffe
        når det er nødvendigt. Mellem andre emner, kan nogle af dem være seriøse
        regelbrud fra WCA regelsættet, eller problemer i kubing samfundet. Hvis
        du nogensinde har oplevet nogle eksempler på det, så kontakt venligst
        denne komite.
    wdpc:
      info_html: >-
        WDPC er ansvarlig for at undersøge, oprette, udføre, håndtere og
        håndhæve alle WCA's Databeskyttelses politikker. WDPC har også ansvar
        for at lave kontrakter med eksterne dataprocessorer af WCA's data og at
        styre alle opgaver der involvere Databeskyttelse.
    wrc:
      info_html: >-
        WRC håndtere alle problemer som handler om at forbedre WCA regelsættet.
        De støtter WCA delegerede på alle procedure problemer, som er et sket
        under konkurrencer. WRC sender ofte interne rapporter ud til alle WCA
        delegerede, og prøver at forbedre dere kendskab til reglerne. Hvis du
        kunne tænke dig at deltage i regelsættets forbedring, kunne du kontakte
        WRC via email, eller diskutere her <a
        href='https://github.com/thewca/wca-regulations'>GitHub</a>.
    wrt:
      info_html: >-
        WRT er ansvarlige for at styre alt data i WCA's database, og vigtigst af
        alt, konkurrenceresultater og personlig data. De lægger resultaterne fra
        WCA konkurrencer op på WCA's hjemmeside, når den ansvarlige WCA
        Delegerede har indsendt dem. Udover at lægge konkurrenceresultater op,
        er de også ansvarlige for at lave rettelser i konkurrenceresultater,
        hvis der er behov, og de styrer alle WCA profilsider. Dette inkludere at
        ændre brugerdata, som fødselsdage efter bekræftede efterspørgsler, og
        profilbilleder.
    wst:
      info_html: >-
        WST er ansvarlige for at opretholde og styre alt WCA's software. De
        laver også ny software, for forskellige ting, som er behøvet inde i WCA.
        Hvis du har forslag og idéer for yderligere hjemmeside forbedring eller
        vil reportere fejl, så kontakt dem! WCA hjemmesiden er et stort åbent
        projekt på <a
        href='https://github.com/thewca/worldcubeassociation.org'>GitHub</a>, så
        hvis du er interesseret i at hjælpe WCA, så kig der.
    wfc:
      info_html: >-
        WFC er ansvarlige for alt hvad der har noget med finanserne inde i WCA.
        De håndtere finanserne og WCA's kontoer, som er i overensstemmelse med
        det normale budget forslag, som også er deres arbejde at give normalt.
    wec:
      info_html: >-
        Denne komité har rollen at sikre sig, at alle procedure fulgt a WCA
        Personalet og Eksternt Personale, overholder WCA's Etiske Regler.
    weat:
      info_html: >-
        Dette hold er ansvarlig for at fuldføre de administrative opgaver for
        WCA Bestyrelsen.
    wqac:
      info_html: >-
        Denne Komité har rollen at støtte og fremme kvalitetsforbedring i WCA,
        og at sikre verdensomspændende kvalitet hos WCA Personale, Regionale
        Organisationer, Konkurrence Arrangører og Konkurrence Personale.
    wcat:
      info_html: >-
        Denne komité har rollen at godkende og annoncere WCA Konkurrencer, og
        sikre sig at de overholder WCA's standarder.
    wmt:
      info_html: >-
        Holdet er ansvarlig for at udvikle og håndtere WCA's Varemærke. Det
        involvere at finde sponsorater, støtte distribuering af WCA Konkurrence
        Udstyr og markedsføre WCA varer.
    councils_html: Råd
    wac:
      info_html: >-
        Dette råd er ansvarlig for at bygge og vedligeholde tosidig
        kommunikation mellem WCA Samfundet og WCA Personale.
  score_tools:
    title: Værktøjer til WCA konkurrencer
    wca_icon_text: Udviklet og vedligeholdt af WST
    intro:
      desc: >-
        This page is a non exhaustive list of tools which are known to be used
        to help with the organization of WCA competitions.
      disclaimer: >-
        Not all tools on that page are maintained by the WST: it's definitely
        fine! We don't have the manpower to manage all the WCA-related software
        out there :)
      used: >-
        All the programs on this list have been used during real WCA
        competitions and integrate with the WCA website: they let you sign in
        with your WCA account to be able to import (and sometimes update) your
        upcoming competitions data. For each of them the maintainer(s) will be
        clearly written.
    before:
      title: Før konkurrencen
      desc: >-
        Managing competitors registrations can be done directly on the WCA
        website. Since managing groups and staff manually can be time-consuming,
        you may want to consider using one of the tools below.
    during:
      title: Under konkurrencen
      desc: >-
        You will find here tools that let you manage the results of the
        competition while it's going on.
    after:
      title: Efter konkurrencen
      desc: >-
        While results validation occurs right there on the website, you will
        have to use some tool to assign scrambles generated by TNoodle to the
        actual results submitted to the WCA website.
    tools:
      age:
        title: AGE
        description: >-
          Tool for generating and editing groups/task assignments for WCA
          competitions
      certificates:
        title: Diplomer
        description: Print certificates for WCA competitions using WCA Live
      groupifier:
        title: Groupifier
        description: >-
          Task and group management tool for WCA competition organizers. Among
          the main features you will find: sorting competitors by rankings,
          assigning tasks (judging, scrambling), deciding how many scrambles are
          needed, generating score sheets, personal sheets, and summaries...
          Check out the website to find out more.
      scorecards:
        title: Scorecards
        description: Print scorecards for WCA competitions using WCA Live
      tnoodle:
        title: TNoodle (blandinger)
        description: >-
          TNoodle is the official scramble program which is used for WCA
          competitions. It is typically used by WCA Delegates prior to WCA
          competitions, but its user interface also allows anyone to generate
          any kind of scrambles for all WCA events.
      live:
        title: WCA Live
        description: >-
          Platform for running WCA competitions and sharing live results with
          the world.
      nightmare:
        title: Results spreadsheet
        description: >-
          Sometimes things happen... If you don't have network access, you will
          have to use the good old spreadsheet.
      matcher:
        title: Scrambles Matcher
        description: >-
          Can be used to assign scrambles generated by TNoodle to results.
          Import results from the WCA website (when using WCA Live), a
          spreadsheet, or a standalone WCIF file. Import scrambles from one or
          more TNoodle json file(s). Export results to the appropriate format
          for WCA submission.
  logo:
    title: WCA Logo
    paragraphs:
      '1': >-
        WCA logoet var designet af Justin Eastman, i en konkurrence i Januar
        2005 <br />Vi kunne lide logoet på grund af dets design, farverne, og at
        det ikke nødvendigvis viser en 3x3x3 cube.
      '2': >-
        Vi har fire forskellige versioner af logoet: En <a
        href="/files/WCAlogo_XL.jpg">stor version</a> (46 KB, 1756 px by 1068
        px), en <a href="/files/WCAlogo.svg">vector version</a>, a <a
        href="/files/WCAlogo_notext.svg">vector version uden tekst</a> og en <a
        href="/files/WCAlogo_monochrome.svg">monokrom vector version</a>.
      '3': >-
        3D version af logoet designet af Vu Minh Tan fra Vietnam: <a
        href="/files/WCALogo3D.png">PNG version</a> (2.1 MB), a <a
        href="/files/WCALogo3Dsmall.png">small PNG version</a> (0.25 MB).
      '4': >-
        Acceptabel brug af WCA logoet er beskrevet i 'WCA Logo Brugspolitikken',
        som kan findes under <a href="/documents">WCA Dokument siden</a>.
