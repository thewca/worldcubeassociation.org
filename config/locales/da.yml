  faq:
    title: Ofte Stillede Spørgsmål
    contact_html: 'Hvis ingen af disse svar hjalp så %{contact_us}!'
    contact_us: kontakt os
    search_for_competition: 'Søg efter en konkurrence her:'
    already_logged_in: Du har allerede logget ind med en WCA konto.
    create_an_account: 'Du kan oprette en konto %{here}.'
    claim_your_wca_id: 'Du kan gøre krav på dit WCA ID %{here}.'
    create_an_account_and_claim: >-
      Opret en konto %{here}. Efter at du logger ind med en din nye konto, vil
      du blive spurgt om at gøre krav på dit WCA ID.
    answers:
      '1':
        title: Hvordan får man fat i et WCA ID og en WCA profil?
        content:
          '1': >-
            Hvis du aldrig har deltaget før, så gå til en <a
            href='/competitions'>competition</a>! Et WCA ID og en WCA profil vil
            blive oprettet for dig når resultaterne fra din første konkurrence
            er oppe på siden.
      '2':
        title: Hvordan kan jeg finde en WCA konkurrence?
        content:
          '1': Se vores liste af <a href='/competitions'>competitions</a>
      '3':
        title: >-
          Hvordan kan jeg tilmelde mig til en konkurrence? Hvem kan jeg referere
          til hvis jeg har problemer med at tilmelde mig til en konkurrence?
        content:
          '1': >-
            Mange konkurrencer bruger tilmelding her på WCA's hjemmeside, men
            nogle af dem bruger deres eget system. Du burde kontakte
            arrangørerne af den konkurrence som du gerne vil deltage i for flere
            detaljer %{comp_search_form}
      '4':
        title: >-
          Hvad er kravene for at deltage i en WCA konkurrence? Hvad skal jeg
          vide før jeg kan deltage i en WCA konkurrence?
        content:
          '1': >-
            Generelt er der ikke så mange krav for en person til at deltage i en
            WCA konkurrence. Men det er forventet for alle deltagere at kende <a
            href='https://www.worldcubeassociation.org/regulations/'>WCA
            Regelsættet</a>. Hvis engelsk ikke er dit første sprog og du har
            problemer med at forstå dokumentet, så læs en <a
            href='https://www.worldcubeassociation.org/regulations/translations/'>oversættelse</a>.
      '5':
        title: Hvordan kan jeg få en WCA konkurrence i min hjemby?
        content:
          '1': >-
            Hvis du er interesseret i at arrangere en konkurrence, er det
            anbefalet at deltage i en eller flere konkurrencer for at lære af
            erfaring.
          '2': >-
            WCA Konkurrencer skal følge <a target='_blank'
            href='https://www.worldcubeassociation.org/regulations/'>WCA
            Regulations</a>. Arrangørholdet behøver ikke nødvendigvis at kende
            dem alle, men det er meget vigtigt at kunne basisen af reglerne, det
            ville hjælpe meget med at arrangere en konkurrence ordentligt.
          '3': >-
            Efter det skal arrangørholdet kontakte en <a target='_blank'
            href='https://www.worldcubeassociation.org/delegates'>WCA
            Delegeret</a> i nærheden. Opsynet af en delegeret er nødvendigt, for
            at konkurrencen officielt vil blive anerkendt af WCA. Den WCA
            Delegerede vil hjælpe med at arrangere konkurrencen succesfuldt.
          '4': >-
            Besøg <a target='_blank'
            href='https://documents.worldcubeassociation.org/edudoc/organizer-handbook/organizer-handbook.pdf'>WCA
            Konkurrence Arrangør Retningslinjerne</a> for mere information.
      '6':
        title: >-
          Hvad er WCA kontoer til for? Hvad er forskellen mellem WCA kontoer og
          WCA profiler?
        content:
          '1': >-
            Du bliver tildelt et WCA ID når resultaterne fra din første WCA
            konkurrence bliver offentliggjort.
          '2': >-
            WCA kontoer gør så at du kan bevise for os hvem du er. Det gør også
            at du kan tilføje et billed til din WCA profil, og lader dig at
            tilmelde dig konkurrencer. Der vil også beskytte dig fra andre folk
            der lader som om de er dig.
          '3': '%{current_user_status}'
      '7':
        title: Hvordan ændre jeg mit profilbillede?
        content:
          '1': >-
            Først skal du <a
            href='#how-do-i-connect-my-wca-account-with-my-wca-id'> oprette en
            WCA konto og tilknytte den til dit WCA ID.</a>
          '2': >-
            Efter at du har tilknyttet din WCA konto og dit WCA ID, og gå til
            din <a href='%{profile_edit_path}'>edit profile page</a> for at
            ændre dit profilbillede.
      '8':
        title: Hvordan tilknytter jeg min WCA konto med mit WCA ID?
        content:
          '1': '%{current_user_claim}'
      '9':
        title: >-
          Jeg er tilmeldt til en konkurrence og vil gerne tilmelde mig i en
          ekstra disciplin, Hvad skal jeg gøre? Kan jeg tage gæster med?
        content:
          '1': >-
            Kontakt arrangøren. Du kan finde kontakt informationen på
            konkurrencens hjemmeside. Hvis du er usikker på hvor du kan finde
            det, så tjek <a href='/competitions'>listen med deltagere</a>.
      results:
        title: >-
          Hvornår er resultaterne fra en WCA konkurrence Uploadet til WCA
          hjemmesiden?
        content:
          '1': >-
            Efter konkurrencen er slut, vil den WCA Delegerede dobbelttjekke
            alle score sheets og personlige data for at fikse alle potentielle
            fejl. Når det er gjort, vil resultaterne blive sendt til WCA
            Resultathold (WRT), som er ansvarlige for at uploade
            konkurrenceresultaterne og vedligeholde WCA databasen. WRT uploader
            så resultaterne til WCA databasen så snart som muligt.
          '2': >-
            Afhængigt af størrelsen på konkurrencen og den Delegeredes
            personlige skema, kan det tage alt fra kun en dag op til en uge. Vær
            venligst tålmodig.
          '3': >-
            Yderligere, hvis du har tilknyttet din WCA konto med dit WCA ID (se
            nedenfor), kan du aktivere email notifikationer om når dine
            resultater er oppe <a href='%{preferences_edit_path}'>here</a>.
      regulations1:
        title: Er min kube brugbar til en konkurrence?
        content:
          '1': >-
            Du kan finde reglerne om terninger i <a
            href='https://www.worldcubeassociation.org/regulations/#3'>Artikel
            3</a>. Alle terninger skal accepteres af den WCA Delegerede. Hvis du
            er usikker, så spørg konkurrencens delegerede. For at være sikker
            burde du have en ekstra terning med hvis du ikke får lov til at
            bruge den.
      regulations2:
        title: Må jeg bruge en magnetisk terning til en officiel WCA 
          konkurrence?
        content:
          '1': >-
            Du må gerne bruge bruge magnetiske terninger så længe at terningen
            overholder <a target='_blank'
            href='https://www.worldcubeassociation.org/regulations/'>WCA
            Reglerne</a>. Læg ekstra mærke til <a
            href='https://www.worldcubeassociation.org/regulations/#3h'>Regulation
            3h</a>.
      regulations3:
        title: >-
          Jeg har mistet en "center cap" eller en brik til min kube. Må jeg
          stadig bruge den.
        content:
          '1': >-
            Du har ikke lov til at bruge den terning. Terninger må ikke have
            skader og andre forskelle mellem brikkerne (see <a
            href='https://www.worldcubeassociation.org/regulations/#3j'>Regulation
            3j</a>).
      regulations4:
        title: >-
          Hvor gammel skal jeg være før jeg kan tilmelde mig til en WCA
          konkurrence?
        content:
          '1': >-
            Der er ingen minimums alder. Men du burde spørge dine forældre før
            du melder dig til en konkurrence (see <a
            href='https://www.worldcubeassociation.org/regulations/#2b'>Regulation
            2b</a>).
  about:
    title: Om WCA
    mission_statement: >-
      Vores mission er at have flere konkurrencer i flere lande med flere
      mennesker og mere sjov, under retfærdige og lige forhold.
    mission_footer: WCA's Mission
    who_we_are_title: Hvem vi er
    who_we_are_content_html: >-
      <p>World Cube Association anerkender konkurrencer for 'mechanical puzzles'
      som opereres ved at rotere grupper af klodser, ofte kendt som 'twisty
      puzzles'. Den mest kendte af disse er "Rubik's Terningen", som blev
      opfundet af professor Rubik fra Ungarn. En udvalgt mængde af terninger er
      udvalgt som officielle discipliner af WCA.</p> <p>WCA har udviklet sig
      over det sidste årti, over 100.000 personer har deltaget i vores
      konkurrencer. På trods af væksten, så er vi stadig en organisation der er
      kørt af udelukkende frivillige, fra lokale arrangører, til WCA Delegerede
      og endda WCA Bestyrelsen. Vi er meget taknemmelige for alle der har taget
      tid fra deres liv for at WCA har kunne operere. Med mere finansiel støtte
      håber vi på at bringe et større niveau af professionalisme til vores
      konkurrencer, samtidigt med at vi afholder flere arrangementer over hele
      verden.</p>
    spirit: >-
      WCA's ånd er at samle personer fra hele verden for at have det sjovt
      sammen i en venlig atmosfære, hjælpe hinanden og opfører os sportsligt.
    spirit_footer: WCA Ånden
    our_goals_title: Vores mål
    our_goals_content_html: >-
      <p>The World Cube Association wants to bring opportunities for community
      membership and leadership to young people around the world through
      increasing the accessibility of our 'twisty puzzle' competitions. We
      believe that experiences at competitions and within our community create
      growth opportunities for the young people involved and that introducing
      puzzle events to new groups of people allows for our overall community to
      strengthen. A document containing the Board's Strategic Plan for the
      WCA can be found <a
      href="https://documents.worldcubeassociation.org/documents/WCA_Strategic_Plan.pdf">here</a>.</p>
    whats_next_title: Hvad er det næste for WCA?
    whats_next_content_html: >-
      <p> World Cube Association har haft over 100.000 unikke deltagere fra 140
      forskellige lande og det bevæger sig kun fremad! Cubing samfundet har
      vokset stabilt siden WCA's oprettelse i 2004 og vi vil gerne opfordre til
      dette fremadrettet ved at afholde flere konkurrencer i nye området. Vi
      håber på at støtte vores samfund yderligere via flere samarbejder og øget
      rækkevidde til dem der går op hjernevridere.<p>
    world_championship_title: Verdensmesterskab
    world_championship_content_html: >-
      <p>Hvert andet år anerkender vi konkurrencen, som ultimativt bestemmer
      verdensmesteren. Disse begivenheder kræver ekstrem nøjagtig planlægning af
      en masse frivillige og en stor finansiel komité, der skal reservere et
      lokale og andre nødvendigheder.</p>
    contributing_title: Donationer
    contributing_content_html: >-
      You can donate by credit card using Guidestar %{here_credit}, or by Paypal
      %{here_paypal}. If you prefer to write a check, you can write to:
    tax_deductible_note: Du bedes selv undersøge om dette kan trækkes fra i 
      skat.
    other_help_title: Andre måder at hjælpe
    other_help_content_html: >-
      <p>Hvis du føler du kan hjælpe World Cube Association på en ikke-finansiel
      måde, så vil vi gerne høre fra dig! Du kan kontakte os på <a
      href="mailto:communication@worldcubeassociation.org">communication@worldcubeassociation.org</a>.</p>
    donation_banner:
      content: >-
        World Cube Association er en 501(c)(3) skatteundtaget organisation. Som
        en 100% frivillig non-profit organisation, så er alle donationer er
        velkomne. Dette vil hjælpe med at få bedre konkurrencer over hele
        verden.
      donate_credit: Donationer med kreditkort
      donate_paypal: Doner gennem Paypal
      donate_other: Andre måder at donere
    structure:
      teams_committees_councils: 'WCA''s hold, komitéer og råd'
      title: Strukturen
      board:
        name: WCA Bestyrelsen
        description: >-
          World Cube Association bliver ledt af WCA Bestyrelsen, som består af
          følgende medlemmer:
      committees: >-
        WCA's hold og komitéer er en vigtig del af organisationen og udfører
        daglige opgaver, som er nødvendige for at vedligeholde organisationen.
        Disse komitéer er bygget op af medlemmer af WCA samfundet, inklusiv WCA
        Delegerede og deltagere. Hvert hold har en leder, hvis rolle er at sikre
        sig at holdet fungerer, som det skal og vejlede de andre holdmedlemmer.
        Råd er en speciel type af hold, der skal rådgive WCA Bestyrelsen og er
        kun opbygget af WCA samfundet, ikke personale af WCA. Når der er ledige
        positioner af i komitéer, hold og råd så vil der være information om
        hvordan man ansøger på forsiden af WCA.
      senior_member: Senior Medlem
      leader: Leder
      officers:
        name: WCA's Officerer
        description: >-
          Officererne af WCA håndterer opgaverne, der er relateret til WCA's
          'non-profit' status. Disse officerer er valgt af WCA Bestyrelsen.
          Dette inkluderer, den administrerende direktør, formanden som styrer
          bestyrelsens møder, sekretæren som vedligeholder organisationens
          dokumenter og kasseren som styrer alle finansielle gøremål af WCA.
      chair:
        name: WCA's Formand
      executive_director:
        name: WCA's Administrerende Direktør
      secretary:
        name: WCA's Sekretær
      vice_chair:
        name: WCA's Næstformand
      treasurer:
        name: WCA's Kasserer
      users:
        profile: '%{user_name}s profil'
      wdc:
        name: WCA's Disciplinærkomité
        description: >-
          Denne komité giver WCA Kommissionen råd i specielle tilfælde, som hvis
          WCA reglerne bliver brudt, eller vil muligvis blive kontaktet af WCA
          medlemmer der har problemer med WCA konkurrencer.
      wdpc:
        name: WCA's Databeskyttelseskomité
        description: Denne komité er ansvarlig for alle emner vedrørende 
          databeskyttelse.
      wrc:
        name: WCA's Regelsætkomité
        description: Denne komité er ansvarlig for WCA reglerne.
      wrt:
        name: WCA's Resultathold
        description: >-
          Dette hold er ansvarlig for at holde styr på alle
          konkurrenceresultater.
      wst:
        name: WCA's Softwarehold
        description: >-
          Dette hold er ansvarlig for at WCA's software (hjemmeside, blandinger,
          workbooks, admin redskaber).
      wct:
        name: WCA's Kommunikationshold
        description: >-
          WCA's kommunikationshold (WCT) har rollen at hjælpe kommunikationen
          mellem WCA og cubingmiljøet. WCAs kommunikation er til for at nå WCAs
          mål og hjælpe på den positive kultur af venlighed, gennemskuelighed,
          ansvar, rummelighed og åbenhed.
      wfc:
        name: WCA's Finanskomité
        description: Dette hold er ansvarlig for at holde styr over WCA's 
          økonomi.
      wec:
        name: WCA's Etikkomité
        description: >-
          Denne komité har rollen at sikre sig, at alle procedurer fulgt af WCA
          Personalet og Eksternt Personale, overholder WCA's Etiske Regler, og
          udføre selvstændige undersøgelser hvis adfærden af de medlemmer ikke
          stemmer overens med WCA's Etiske Regler. Disse slags undersøgelser kan
          blive efterspurgt af hvilken som helst tilmeldt speedcuber, som WEC
          har tavshedspligt over for.
      weat:
        name: WCA's Hold af Administrerende Assistenter
        description: >-
          Dette hold er ansvarlig for at fuldføre de administrative opgaver for
          WCA Bestyrelsen.
      wqac:
        name: WCA's Kvalitetsforsikringskomité
        description: >-
          Denne Komité har rollen at støtte og fremme kvalitetsforbedring i WCA,
          og at sikre verdensomspændende kvalitet hos WCA Personale, Regionale
          Organisationer, Konkurrence Arrangører og Konkurrence Personale.
      wcat:
        name: WCA's Konkurrenceannonceringshold
        description: >-
          Dette hold har rollen at godkende og annoncere WCA Konkurrencer, og
          sikre sig at de overholder WCA's standarder.
      wmt:
        name: WCA's Marketinghold
        description: >-
          Holdet er ansvarlig for at udvikle og håndtere WCA's Varemærke. Det
          involvere at finde sponsorater, støtte distribuering af WCA
          Konkurrence Udstyr og markedsføre WCA varer.
      wac:
        name: WCA's Rådgivningsråd
        description: >-
          Dette råd er ansvarlig for at bygge og vedligeholde tosidig
          kommunikation mellem WCA Samfundet og WCA Personale.
      banned:
        name: Banlyste Deltagere
      wct_china:
        name: WCT Kina
      operations_html: 'Dag til dag arbejde er gjort af WCA''s %{committees_and_teams}.'
      teams_committees: Hold og Komitéer
      probation:
        name: Delegerede på Prøvetid
      wst_admin:
        name: Software administratorer
      delegates_html: >-
        <strong>WCA Delegerede</strong> har rollen som er beskrevet i WCA's
        forslag, og beskrevet i WCA Regelsæt. Den vigtigste pligt for en
        delegeret er at holde øje med konkurrencer på vegne af WCA. En WCA
        Delegeret er ansvarlig for at sikre sig at alle WCA konkurrencer
        forløber korrekt efter WCA's mål, ånd, og regelsæt. WCA skelner mellem
        <strong>Seniordelegerede</strong>, <strong>Regionale Delegerede</strong>
        <strong>Delegerede</strong>, <strong>Juniordelegerede</strong>, og
        <strong>Lærlingdelegerede</strong>%{see_link}.</p> <p>I forlængelse til
        deres pligter som WCA Delegerede, så er en Seniordelegeret ansvarlig for
        at holde styr over WCA Delegerede i sit område, og kan blive kontaktet,
        hvis der er nogle regionale problemer.</p> <p>Nye Delegerede er først
        skrevet op som WCA Juniordelegerede. Derefter skal de vise at de kan
        finde ud af at holde styr over WCA konkurrencer, før at de kan blive
        forfremmet til WCA Delegerede.</p> <p>Delegerede under oplæring er ved
        at blive klargjort til at være WCA Delegeret, og kan kun være Delegeret
        for en konkurrence, hvor der er en WCA Delegeret til stede.</p>
      see_link_html: ' (see %{link})'
      members_html: >-
        Alle deltagere bliver automatisk <strong>medlem</strong> af WCA efter
        deres første konkurrence.
