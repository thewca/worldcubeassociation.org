  incidents_log:
    i18n_disclaimer: >-
      Husk, at alle hændelser kun er tilgængelige på engelsk. Indholdet er ikke
      oversat.
  about_regulations:
    title: Om regelsættet
    panel1:
      title: Regelsæt
      content1_html: >-
        Alle konkurrencer skal følge <a href="/regulations/">WCA
        Regelsættet</a>. Det er vigtigt for alle deltagere at læse de her regler
        før at man deltager i sin første konkurrence.
      content2_html: >-
        WCA regelsættet bliver sublimenteret af  <a
        href="/regulations/guidelines.html">WCA Retnings linjerne</a>, som
        indeholder ekstra information.
      content3_html: >-
        Important decisions about incidents that happened in competitions that
        were resolved by the WCA Regulations Committee are found in the <a
        href="/incidents">Incidents Log</a>.
    panel2:
      title: Oversættelser
      content1_html: >-
        WCA reglerne er ikke kun tilgængelige på engelsk, nogle WCA medlemmer
        har oversat dem til mange sprog: <a
        href="/regulations/translations/">Oversættelser</a>.
      content2_html: >-
        <strong>Vigtigt</strong>: Selvom oversættelserne er meget hjælpsomme, er
        de ikke officielle. I konkurrencer, er der den engelske version ag
        regelsættet bindende.
    panel3:
      title: Regler FAQ
      content1_html: >-
        <a href="/faq">FAQ afdelingen</a> svarer på mange ofte stillede
        spørgsmål om WCA reglerne.
    panel4:
      title: Arrangør Retningslinjer
      content1_html: >-
        Hvis du er interesseret i at arrangere en konkurrence eller allerede
        planlægger er ved at planlægge en, så læs vores <a
        href="https://documents.worldcubeassociation.org/edudoc/organizer-handbook/organizer-handbook.pdf">Arrangør
        Retningslinjer</a>.
      content2_html: >-
        Dette dokument indeholder vigtig information og burde læses af hver
        eneste konkurrence arrangør.
  regulations_translations:
    title: 'WCA Regelsættet og Retningslinjer: Oversættelser'
    paragraph1: >-
      Hvis du taler et andet sprog end engelsk, så finder du måske disse
      oversættelser brugbare.
    paragraph2: >-
      Disse oversættelser har ikke nogen officielt status. Selvom de er
      tilgængelige på WCA's hjemmeside, så har de ikke nogen garantier. Hvis der
      er en forskel mellem en oversættelses og den (nuværende officielle)
      engelske version, så overtrumfer den engelske version.
    translations: Oversættelser
    current: Nuværende
    old: Forældede
    table_elements:
      version: Version
      language: Sprog
    translating: At oversætte Regelsættet
    paragraph3_html: >-
      Hvis du er interesseret i at tilføje eller opdatere en oversættelse, så se
      <a
      href="https://github.com/thewca/wca-regulations-translations#translation-instructions">instruktionerne
      på GitHub for oversættelser</a>.
