      Der er ingen Regionale Organisationer, som på nuværende tidspunkt er
      anerkendt af WCA.
    how_to:
      title: Hvordan man bliver en anerkendt WCA Regional Organisation
      description: >-
        WCA anerkender mange regionale organisationer over hele verden. Formålet
        med en WCA regional organization er at organisere WCA konkurrencer og
        støtte WCA's aktiviteter i den del af verden. Lande der ønsker at lave
        en regional organisation er opfordret til at hjælpe WCA i deres område
        før de indsender en ansøgning. For hjælp med at organisere en WCA
        konkurrence i dit område, så kontakt venligst den nærmeste Delegerede.
    requirements:
      title: Krav for WCA Regionale Organisationer
      list:
        '1': >-
          At aktivt organisere eller støtte WCA konkurrence i den region af
          organisationen
        '2': >-
          At aktivt hjælpe til med kontinentale WCA konkurrencer, som bliver
          afholdt på kontinentet af den Regionale Organisation, hvis det bliver
          forespurgt af det relevante arrangørhold.
        '3': >-
          At respektere og operationalisere målene, som er sat af vedtægterne og
          reglerne fra WCA
        '4': At overholde alle gældende WCA regler
        '5': At acceptere og imødekomme valg af WCA Personale
        '6': >-
          At have en fil med en kopi af WCA's nuværende vedtægter og, hvis
          relevant, regler i en elektronisk format
