          Check your configured mobile application for a one-time password, or
          input one of your recovery codes.
      competition:
        name: >-
          Konkurrencens fulde navn inklusiv året i slutningen (eksempel, Danish
          Open 2016). Husk at lave store bogstaver. Navnet må kun indeholde
          alfanumeriske tegn, streger(-), og-tegn(&), punktummer(.),
          kolonner(:), apostroffer(') og mellemrum( ).
        cell_name: >-
          Et kort navn for visning. Hvis navnet på konkurrencen allerede er
          kort, kan du bruge navnet igen (eksempel, Europe 2006)
        city_name: >-
          Byens navn og stat (hvis det er relevant) hvor konkurrencen bliver
          afholdt. Inkluder ikke land (eksempel, Paris eller San Francisco,
          California).
        information: >-
          Vigtig information som deltagerne burde vide. Det vil blive vist på
          konkurrencens forside. <br/>Udfyld venligst det her på engelsk</b> og
          andre sprog som dine deltagere snakker.
        staff_delegate_ids: WCA Delegerede for konkurrencen.
        trainee_delegate_ids: WCA Lærlingdelegerede for konkurrencen.
        organizer_ids: >-
          Konkurrence arrangører (de har brug for en konto for at være skrevet
          her)
        external_website: Konkurrencens hjemmeside. Skal være en gyldig http(s) 
          url.
        registration_open: 'Note: Registreringens åbningstider og lukketider er i
          UTC-tid'
        remarks: >-
          Ekstra information som du vil fortælle WCAT. For eksempel, hvis der er
          noget som du er usikker på, eller hvis der er en speciel forespørgsel
          til WCAT. Udfyld det her på engelsk!
        external_registration_page: >-
          Siden hvor deltagerne skal tilmelde for konkurrencen. Det skal være en
          http(s) url.
        base_entry_fee_lowest_denomination: >-
          Basis deltagergebyret for konkurrencen. Deltagergebyret vil blive vist
          på konkurrencens informationsside og tilmeldingssiden hvis den bliver
          brugt. Hvis den bliver sat på 0, så vil en sætning blive vist, der
          fortæller at tilmeldingen for konkurrencen er gratis.
        currency_code: Valutakoden for deltagergebyret.
        competitor_limit_enabled: >-
          Selvom at det ikke er nødvendigt ifølge Regelsættet, så er det
          foreslået at have en deltagergrænse.
        competitor_limit: >-
          Antal deltagere tilladt for denne konkurrence. For nu er det tal kun
          brugt for information, og forhindrer ikke folk i at tilmelde sig
          konkurrencen. Der arbejdes på sagen.
        competitor_limit_reason: Hvad er grunden til deltagergrænsen? Udfyld det
          her på engelsk!
        extra_registration_requirements: >-
          Indikere venligst her ekstra tilmeldingskrav, som ikke er nævnt oven
          over. Det kan være eksempler på hvordan man betaler. <br/>Udfyld det
          her <b>på engelsk</b> og hvilke andre sprog som dine deltagere taler.
          Det her vil blive vist på konkurrencens forside, og på
          tilmeldingssiden, hvis der bruges WCA's tilmeldingssystem.
        on_the_spot_entry_fee_lowest_denomination: >-
          Hvis den bliver sat til 0, så vil en sætning blive vist, der siger at
          tilmelding i lokalet vil være gratis.
        refund_policy_percent: >-
          For nu, er dette tal kun for information. Refunderinger skal stadig
          tilbagebetales manuelt. Hvis dette bliver sat til 0, så vil en sætning
          blive vist, der vil sige, at det ikke vil være nogle refunderinger.
        refund_policy_limit_date: >-
          Datoen hvorefter at der ikke vil blive tilbagebetalt nogle
          deltagergebyrer.
        waiting_list_deadline_date: >-
          The date when waitlisted registrants will no longer be accepted. If
          you have a deadline for refunds, the deadline for being accepted
          should not be before the deadline for refunds.
        event_change_deadline_date: >-
          Registered competitors have the right to update their registered
          events until this time by contacting the organization team. This
          deadline must not be set to a time before registration is set to
          close. Leaving this field blank means that competitors may add an
          event to their registered events up until that event is held. If you
          have on the spot registration, this must be set to the same day as the
          competition.
        guests_entry_fee_lowest_denomination: >-
          For now this number is informational only, guest fees cannot be
          managed through this website. If this is set to 0, a sentence of your
          choice will be displayed about the spectator policy.
        early_puzzle_submission_reason: >-
          Uddyb hvorfor du gerne vil have at deltagerne skal aflevere deres
          terninger tidligt. Udfyld det på engelsk!
        qualification_results_reason: >-
          Uddyb hvorfor du gerne vil bruge kvalifikationsresultater. Udfyld det
          på engelsk!
        event_restrictions_reason: >-
          Uddyb hvorfor du gerne vil begrænse kombinationen af bestemte
          discipliner. Udfyld det på engelsk!
        main_event_id: >-
          Vinderen af denne disciplin vil blive erklæret vinderen af
          konkurrencen.
      website_contact:
      dob_contact:
        dob: Din korrekte fødselsdag i formatet ÅÅÅÅ-MM-DD
        document: >-
          For at bevise din identitet og din korrekte fødselsdag til os, skal du
          vise et billede fra et officielt dokument(ID kort, kørekort,
          studiekort, pas, fødselsattest, ...) hvor dit navn er synligt og
          forståeligt for en engelsktalende person (eller kontakt din nærmeste
          delegerede hvis du ikke har sådan et dokument). Vi har som minimum
          brug for dit navn og fødselsdato. Censorer venligst dine andre
          personlige detaljer fra billedet (for eksempel, CPR-Nummer eller
          Pas-Nummer skal IKKE bruges).
      post:
        body: >-
          Brug &lt;!-- break --&gt; for at vise en fremtidig version af
          hjemmesiden. Alle opslag på hjemmesiden vil vise alt tekst før denne
          opdeling. Det rigtige post vil vise den fulde tekst.
        show_on_homepage: >-
          Forsigtig! Dette er ikke sikkert for privat data. Det er kun for at
          forhindre rod på hovedsiden. Opslag der ikke er vist på hovedsiden er
          stadig åbent for offentligheden via et permalink eller igennem tags.
      delegate_report:
        schedule_url: >-
          Fuldt link til det offentlige skema (eksempel,
          https://www.cubingusa.com/usnationals2016/schedule.php)
        equipment: >-
          Numre og type af timere og displays brugt til konkurrencen. Fjern
          venligst linjerne af udstyr som i ikke brugte.
        venue: >-
          Punkter ovenfor er bare for assistance til at skrive en komplet
          rapport. Brug dem som du føler passer bedst. Fjern de ubrugte dele!
        organization: >-
          Punkter ovenfor er bare for assistance til at skrive en komplet
          rapport. Brug dem som du føler passer. Fjern de ubrugte dele!
        incidents: >-
          Rapporter alle hændelser der ikke er normale situationer. Give
          hændelser numre som starter fra 1, så andre Delegerede kan referere
          til dem ved deres numre. Selv hvis alt virkede normalt, så nævn bare
          det mest specielle situationer. Klik på de relevante bokse nedenfor
          hvis der er nogle situationer du aktivt søger hjælp for.
        wrc_incidents: Numrene af de hændelser du gerne vil have WRC feedback 
          på.
        wdc_incidents: Numrene af de hændelser du gerne vil have WDC feedback 
          på.
        remarks: >-
          Skriv om andre detaljer som du gerne vil dele (eksempel.,
          forbedring/tilbagegang indenfor samfundet/fællesskabet, fremtidige
          planer for denne region). Hvis du mener du mangler at få nævnt noget
          som du ikke fik nævnt tidligere, så kan du tilføje dem her.
