          Folosește tagul &lt;!-- break --&gt; pentru a arăta a previzualizare a
          paginii home. Orice postare de pe pagina home va afișa tot textul
          dinaintea acestui separator. Postarea reală va afișa întreg
          conținutul.
        show_on_homepage: >-
          Atenție! Nu este sigur pentru informații private. Scopul este numai de
          a preveni aglomerarea homepage-ului. Postările care nu apar pe
          homepage rămân accesibile public prin permalink sau prin etichete.
      delegate_report:
        schedule_url: >-
          Link-ul complet către programul publicat (exemplu:
          https://www.cubingusa.com/usnationals2016/schedule.php)
        equipment: >-
          Numărul și tipul timer-elor si diplay-urilor  folosite in competitie.
          Te rog să elimini liniiile cu echipamentele pe care nu le-ai folosit.
        venue: >-
          Vorbește despre sălile folosite, lumină, accesul publicului,
          împărțirea zonelor ( de rezolvare, de așteptare, de amestecare etc.),
          dacă ai aranjat diferite etape de rezolvare, probleme care au apărut
          (exemplu: gălăgia) și cum le-ai rezolvat ... Fii concis și nu raporta
          detalii irelevante. Te rugăm să încarci o poză a locației de concurs
          pentru a arăta aranjarea zonelor de scramble, așteptare și rezolvare.
        organization: >-
          Vorbește despre echipa de organizare și cum s-au ocupat de buna
          desfășurare a competiției, dacă te-ai implicat și tu în organizare,
          experiența lor anterioară și dacă ai observat un progres, dacă au fost
          profesioniști și activi, problemele care au apărut (exemplu:
          întârzieri față de programul stabilit) și cum le-au rezolvat... Te
          rugăm să fii concis și să nu raportezi detalii irelevante.
        incidents: >-
          Raportează orice incidente pe care le consideri relevante.
          Numerotează-le începând cu 1, pentru ca Delegații să poată facă
          referiri la ele în comentariile lor. Asigură-te că menționezi
          incidente concrete, nu generalități (exemplu: DNF-uri sau +2).
          Simte-te liber să ceri feedback de la Delegați sau de la WRC. Dacă
          dorești intervenția WDC pentru unele incidente, menționează clar
          această cerere.
