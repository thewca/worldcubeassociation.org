        private_wrc_decision: >-
          Decizia finală a WRC, inclusiv detalii private. Te rugăm să completezi
          în engleză.
        public_summary: >-
          O descriere completă a evenimentului și a deciziei luate, pentru a fi
          afișată public. Te rugăm să completezi în engleză.
      user:
        dob: >-
          Introdu data nașterii concurentului în formatul an-lună-zi
          (AAAA-LL-ZZ)
        name: >-
          Introdu, în mod corect, numele complet al concurentului, de exemplu
          <strong>Stefan Pochmann</strong>. Nu introdu numele neglijent, de
          exemplu <strong>s pochman</strong>.<br/> Prenumele suplimentare
          (complete sau doar inițialele) sunt opționale.
        pending_avatar: >-
          După încărcarea unui nou avatar, va trebui să aștepți ca Echipa de
          Rezultate WCA să îl aprobe.
        registration_notifications_enabled: >-
          Se aplică doar competițiilor pe care le organizezi sau delegi și poate
          fi suprascris individual per competiție.
        receive_delegate_reports: >-
          Dacă ești Delegat Stagiar, Junior sau Senior, ori Membru al WRC sau al
          WQAC, vei primi automat Rapoartele Delegaților. Notă: schimbarea poate
          dura până la o oră
        otp_attempt: >-
          Verifică-ți aplicația mobilă pentru o parolă cu utilizare unică
          (one-time password) sau introdu un cod de recuperare.
      competition:
        name: >-
          Numele complet al competiției, inclusiv anul la sfârșitul ei (de
          exemplu U.R.A. Spring 2016). Asigură-te că începi cuvintele cu literă
          mare. Numele trebuie să conțină numai caractere alfanumerice, spații
          și următoareel caractere speciale  -  &  .  :  '
        cell_name: >-
          Un nume mai scurt pentru a fi afișat. Dacă numele competiției are mai
          puțin de %{short_name_limit} caractere, nu trebuie să editezi acest
          câmp, întrucât trebuie să fie identic cu numele complet.
        city_name: >-
          Numele orașului și statului (unde este cazul) în care are loc
          competiția. Nu scrieți țara (exemplu: Paris SAU San Francisco,
          California)
        information: >-
          Informații despre numărul maxim de concurenți, taxe de înregistrare
          pentru concurenți și spectatori și alte detalii relevante pentru
          pamenii ce vor să concureze sau să fie în public.
        staff_delegate_ids: Delegați WCA pentru competiție
        trainee_delegate_ids: Delegați Candidați WCA pentru această competiție
        organizer_ids: >-
          Organizatorii competiției (trebuie să aibă cont WCA pentru a apărea
          aici)
        external_website: Site-ul competiției. Trebuie să aiba un URL http sau 
          https valid.
        registration_open: 'Notă: Orele pentru începutul și sfarșitul înregistrării
          sunt în UTC'
        remarks: >-
          Informații adiționale pe care vrei să le transmiți către WCAT. De
          exemplu, dacă este ceva de care nu ești sigur, sau dacă ai orice
          cerere specială către WCAT. Completează în engleză!
        external_registration_page: >-
          Pagina unde concurenții se pot înregistra pentru competiție. Trebuie
          să fi un URL http(s) valid .
        base_entry_fee_lowest_denomination: >-
          Taxa de înregistrare de bază. Va fi afișată pe pagina de informații a
          competiției și pe pagina de înregistrare, dacă există. Dacă este
          setată la 0, un mesaj conform căruia înregistrările sunt acceptate
          gratuit va fi afișat. <br><br><b>DISCLAIMER: Următorul estimat al
          Cotizațiilor WCA este doar o aproximație bazată pe cursul valutar
          curent și nu are sub nicio formă un caracter juridic obligatoriu
          pentru plata Cotizațiilor </b>
        currency_code: Codul valutei pentru taxe
        competitor_limit_enabled: >-
          Deși nu este cerut de Regulament, este foarte indicat să se precizeze
          limita numărului de concurenți.
        competitor_limit: >-
          Numărul maxim de concurenți permis în această competiție. Deocamdată,
          acest număr este doar informativ și nu poate împiedica înscrierea
          concurenților suplimentari. Lucrăm pentru a remedia această situație,
          dar implică și alte eforturi.
        competitor_limit_reason: >-
          De ce există limita numărului de concurenți? Te rugăm să scrii în
          limba engleză!
        guests_per_registration_limit: >-
          Numărul de spectatori per înregistrare permis în cadrul acestei
          competiții. Înregistrările care au prea mulți spectatori asociați vor
          fi blocate. Lasă câmpul gol dacă nu există limită.
        events_per_registration_limit: >-
          Opțional, setează numărul total de probe pentru care un concurent se
          poate înregostra (folosit în mod uzual pentru competițiile din
          categoria "Favorites"). Trebuie să adaugi probe înainte de a utiliza
          acest câmp. Lasă câmpul gol dacă nu există nicio limită.
        extra_registration_requirements: >-
          Te rugăm să specifici aici orice alt criteriu pentru înregistrare care
          nu a fost acoperit mai sus, de exemplu informații despre efectuarea
          plății. <br/>Te rugăm să completezi <b>în engleză</b> și în orice alte
          limbi care te aștepți să fie vorbite la competiție; acestea vor fi
          afișate pe pagina de informații a competiției, precum și pe pagina de
          înregistrări (dacă folosești interfața WCA).
        on_the_spot_entry_fee_lowest_denomination: >-
          Dacă este setată la 0, va fi afișat un mesaj conform căruia
          înregistrările pe loc vor fi acceptate gratuit.
        refund_policy_percent: >-
          Deocamdată, acest număr este doar informativ, restituirile vor trebui
          să fie cerute manual. Dacă este setat la 0, va fi afișat un mesaj
          conform căruia taxele de înregistrare nu vor fi restituite sub nicio
          circumstanță.
        refund_policy_limit_date: Data după care nu se vor mai acorda restituiri
        waiting_list_deadline_date: >-
          Data la care ce înscriși pe lista de așteptare nu vor mai fi aceptați.
          Dacă ai termen limită pentru rambursări, termenul limită pentru
          acceptare nu ar trebui să preceadă celui pentru rambursări.
        event_change_deadline_date: >-
          Concurenții înscriși au dreptul să-și actualizeze probele până la
          momentul specificat, contactând echipa de organizare. Acest termen
          limită nu poate fi setat înainte de închiderea înscrierilor. Dacă
          acest câmp nu este completat, atunci concurenții își pot adăuga o
          probă până la momentul desfășurării acesteia. Dacă accepți înscrieri
          pe loc, acest lucru trebuie să se întâmple în ziua competiției.
        guests_entry_fee_lowest_denomination: >-
          Deocamdată, acest număr este doar informativ, taxele pentru spectatori
          nu pot fi administrate prin acest site. Dacă este setat la 0, va fi
          afișat un mesaj la alegerea ta despre regimul spectatorilor.
        early_puzzle_submission_reason: >-
          Te rugăm să elaborezi aici de ce soliciți depunerea puzzle-urilor mai
          devreme. Completează în engleză!
        qualification_results_reason: >-
          Te rugăm să elaborezi aici de ce soliciți utilizarea timpilor din
          calificări. Completează în engleză!
