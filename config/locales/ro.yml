      region: Regiune
  regional_organizations:
    title: Organizații Regionale
    content: 'WCA recunoaște următoarele Organizații Regionale:'
    empty: Nu există Organizații Regionale recunoscute deocamdată de WCA.
    how_to:
      title: Cum se creează Organizație Regională WCA
      description: >-
        WCA recunoaște mai multe Organizații Regionale din toată lumea. Scopul
        unei Organizații Regionale WCA este de a organiza Competiții WCA și de a
        susține activitățile WCA la nivel local. Țările care vor să formeze o
        Organizație Regională sunt încurajate să contribuie pentru activitatea
        WCA în teritoriul lor, înainte de a depune aplicația. Pentru a fi ajutat
        să organizezi o competiție WCA în zona ta, poți contacta cel mai
        apropiat Delegat.
    requirements:
      title: Cerințe pentru Organizațiile Regionale WCA
      list:
        '1': Să organizeze sau să susțină activ Competiții WCA în zona 
          Organizației
        '2': >-
          Să contribuie la Competițiile Continentale WCA corespunzătoare
          regiunii Organizației, în urma apelului făcut de Echipa de Organizare.
        '3': >-
          Să respecte și să operaționalizeze Obiectivele specificate în Statutul
          WCA și în Moțiuni.
        '4': Să aplice toate Regulile WCA
        '5': Să accepte și să aplice hotărârile Staffului Oficial WCA
        '6': >-
          Să trimită, în format electronic, către WCA o copie a statutului
          stabilit de către Organizație și, dacă e cazul, a regulamentului.
    application_instructions:
      title: Intrucțiuni pentru aplicație
      description_html: >-
        Pentru a aplica pentru recunoaștere, te rugăm să completezi acest <a
        href='/regional-organizations/new'>formular</a>.
    regional_organization_form:
      filling_instructions_html: Te rugăm să completezi tot <b>în engleză!</b>
      public_information: Informații publice
      private_information: Informații private
      private_information_disclaimer: Toate informațiile de mai jos vor putea fi
        văzute numai de Boardul WCA.
