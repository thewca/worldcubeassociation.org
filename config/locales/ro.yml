      contul tău:
    legal_tnoodle_api_header: Versiunea TNoodle legală
  merch:
    title: Merchandise WCA
    paragraphs:
      '1': >-
        WCA are produse de merchandise exclusive ce pot fi achiziționate!
        Tricouri, Hanorace, Stickere, Stackmats, Rucsacuri și multe altele!
        Designurile noastre sunt actualizate permanent, de exemplu logo-ul WCA,
        merchandise oficial pentru Campionatul Mondial sau designuri privind
        Recorduri Mondiale.
      '2': >-
        Cel mai bun mod de a susține WCA - o organizație non-profit operată de
        voluntari - este să cumperi Merchandise WCA din magazinele noastre:
        Folosim toate profiturile din vânzări pentru a finanța mai departe
        campionate, echipamente și alte activități necesare derulării
        activității WCA.
      '3': >-
        Poți cumpăra merchandise-ul nostru de oriunde - există magazine în
        Europa, America, India, iar în curând și în multe alte locuri!
  database:
    results_export:
      heading: Export Rezultate WCA
      description: >-
        Pe această pagină punem la dispoziție rezultatele WCA, ce pot fi
        descărcate în mai multe formate pentru ca tu să le poți folosi/analiza.
        De regulă facem actualizări după fiecare weekend cu competiții, când
        rezultatele sunt finalizate. Fișierele sunt numerotate și datate, deci
        poți urmări dacă ai cea mai nouă versiune.
      permalink: permalink
      file_formats:
        sql: 'SQL statements, for import into SQL databases.'
        tsv: 'Tab-separated values, for spreadsheets in OpenOffice.org, Excel, etc.'
      hint_readme_html: >-
        Fișierul %{readme_filename} inclus conține termenii de utilizare și o
        descriere generală (în limba engleză):
    developer_export:
      heading: Export Dezvoltator WST
      description_html: >-
        Pe această pagină oferim dezvoltatorilor WST posibilitatea exportării
        prin descărcarea sub formă de SQL dump. Mai multe detalii aici:
        %{github_link}.
      download: Descărcare
