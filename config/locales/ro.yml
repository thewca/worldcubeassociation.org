  faq:
    title: Întrebări Frecvente
    contact_html: >-
      Dacă niciunul din aceste răspunsuri nu te-a ajutat, te rugăm
      %{contact_us}!
    contact_us: contactează-ne
    search_for_competition: 'Caută o competiție aici:'
    already_logged_in: Deja ești logat cu un cont WCA.
    create_an_account: 'Poți crea un cont %{here}.'
    claim_your_wca_id: 'Poți obține Id-ul tău WCA %{here}.'
    create_an_account_and_claim: >-
      Creează un cont %{here}. După ce intri în noul tău cont, vei fi îndrumat
      să obții un Id WCA.
    answers:
      '1':
        title: Cum obțin un Id și un profil WCA?
        content:
          '1': >-
            Dacă nu ai mai concurat până acum , participă la o <a
            href='/competitions'>competiție</a>! Un profil și un Id WCA vor fi
            create pentru tine odată cu publicarea rezultatelor de la prima ta
            competiție.
      '2':
        title: Cum pot găsi o competiție WCA?
        content:
          '1': Uită-te pe lista noastră de  <a 
            href='/competitions'>competiții</a>.
      '3':
        title: >-
          Cum mă pot înregistra pentru o competiție? Cui mă pot adresa dacă am
          probleme cu înregistrarea?
        content:
          '1': >-
            Multe competiții folosesc înregistrarea prin site-ul WCA, însă sunt
            și unele care folosesc propriul sistem. Pentru acestea din urmă, ar
            trebui să contactezi organizatorul competiției pentru mai multe
            detalii. %{comp_search_form}
      '4':
        title: >-
          Ce este necesar din partea mea pentru a participa la o competiție WCA?
          Ce trebuie să știu înainte de a participa la o competiție WCA?
        content:
          '1': >-
            În general, nu sunt multe lucruri de făcut pentru a participa la o
            competiție. Însă, ne așteptăm ca toți participanții să înțeleagă
            bine <a
            href='https://www.worldcubeassociation.org/regulations/'>Regulamentul
            WCA</a>. Dacă engleza nu este limba ta maternă și îți este greu să
            înțelegi documentul, te rugăm să citești <a
            href='https://www.worldcubeassociation.org/regulations/translations/'>Traducerile</a>.
      '5':
        title: Cum pot avea o Competiție WCA în orașul meu?
        content:
          '1': >-
            Dacă ești interesat să organizezi o competiție, este foarte
            recomandat să concurezi la cel puțin una sau două competiții pentru
            a învăța din această experiență.
          '2': >-
            Competițiile WCA se supun <a target='_blank'
            href='https://www.worldcubeassociation.org/regulations/'>Regulamentului
            WCA</a>. Echipa de organizare nu trebuie să știe toate regulile pe
            de rost, însă, cunoașterea și înțelegerea regulilor de bază ar ajuta
            cu siguranță la organizarea corectă a competiției.
          '3': >-
            După, echipa de organizare trebuie să contacteze un <a
            target='_blank'
            href='https://www.worldcubeassociation.org/delegates'>Delegat
            WCA</a> din zona ei. Competiția este recunoscută oficial de WCA
            numai sub supravegherea unui Delegat WCA. Acesta va îndruma
            organizatorii pentru a face o competiție reușită.
          '4': >-
            Consultă <a target='_blank'
            href='https://documents.worldcubeassociation.org/edudoc/organizer-handbook/organizer-handbook.pdf'>Ghidul
            Organizatorului de Competiții WCA</a> pentru mai multe informații.
      '6':
        title: >-
          Pentru ce sunt conturile WCA? Care este diferența dintre conturile WCA
          și profilele WCA?
        content:
          '1': >-
            Ți se alocă un Id WCA când rezultatele de la prima ta competiție WCA
            sunt publicate.
          '2': >-
            Conturile WCA îți permit să ne dovedești cine ești. Astfel, poți
            adăuga o poză pentru profilul tău WCA și să te înregistrezi pentru
            competiții. Contul WCA te va proteja de alți oameni care pretind că
            sunt în locul tău.
          '3': '%{current_user_status}'
      '7':
        title: Cum îmi schimb poza de profil?
        content:
          '1': >-
            Mai întâi, trebuie să  <a
            href='#how-do-i-connect-my-wca-account-with-my-wca-id'>creezi un
            cont WCA și să îl conectezi cu Id-ul tău WCA</a>.
          '2': >-
            După ce ai făcut legătura între contul și Id-ul WCA, mergi la <a
            href='%{profile_edit_path}'>pagina de editare a profilului</a>
            pentru a-ți schimba poza de profil.
      '8':
        title: Cum îmi conectez contul WCA cu Id-ul meu WCA?
        content:
          '1': '%{current_user_claim}'
      '9':
        title: >-
          Sunt înregistrat într-o competiție și vreau să mă înscriu la o probă
          nouă. Cum procedez? Pot aduce spectatori?
        content:
          '1': >-
            Te rugăm să contactezi organizatorul. Poți găsi datele de contact pe
            site-ul competiției. Dacă nu ești sigur unde-l poți găsi, caută în
            <a href='/competitions'>lista competițiilor</a>.
      results:
        title: Când apar rezultatele de la o competiție WCA pe site-ul WCA?
        content:
          '1': >-
            După ce competiția s-a terminat, Delegatul WCA trebuie să verifice
            din nou toate score sheeturile (foile cu rezultate) și datele
            personale pentru a elimina posibilele erori. După ce este gata,
            rezultatele sunt trimise la Echipa de Rezultate WCA (WRT), care este
            responsabilă de încărcarea rezultatelor competiției și de
            întreținerea bazei de date WCA. În final, WRT încarcă rezultatele în
            baza de date WCA cât mai repede posibil.
          '2': >-
            În funcție de dimensiunile competiției și de programul personal al
            Delegatului, toate acestea pot dura de la o zi la o săptămână. Te
            rugăm să ai răbdare.
          '3': >-
            În plus, dacă ți-ai conectat deja contul și Id-ul WCA, poți alege să
            primești notificări pe e-mail atunci când se încarcă rezultatele
            tale, <a href='%{preferences_edit_path}'>aici</a>.
      regulations1:
        title: Puzzle-ul meu este permis în competiție?
        content:
          '1': >-
            Poți găsi regulile legate de puzzle-uri în <a
            href='https://www.worldcubeassociation.org/regulations/#3'>Articolul
            3</a>. Toate puzzle-urile trebuie să fie aprobate de un delegat WCA.
            Dacă nu ești sigur, te rugăm să-l întrebi pe Delegatul competiției.
            Pentru orice eventualitate, ar trebui să ai la tine un puzzle de
            rezervă la tine, în caz că nu îl poți folosi pe primul.
      regulations2:
        title: Pot folosi un puzzle magnetic într-o competiție oficială WCA?
        content:
          '1': >-
            Poți folosi puzzle-uri magnetice atât timp cât respectă <a
            target='_blank'
            href='https://www.worldcubeassociation.org/regulations/'>Regulamentul
            WCA</a>. Fii atent în special la <a
            href='https://www.worldcubeassociation.org/regulations/#3h'>Regula
            3h</a>.
      regulations3:
        title: >-
          Am pierdut un căpăcel de centru sau o piesă din puzzle. Îl mai pot
          folosi?
        content:
          '1': >-
            Nu mai poți folosi acel puzzle. Puzzle-urile nu trebuie să aibă
            defecte sau alte particularități ce realizează o diferențiere
            semnificativă între piese (vezi <a
            href='https://www.worldcubeassociation.org/regulations/#3j'>Regula
            3j</a>).
      regulations4:
        title: Ce vârstă trebuie să am ca să mă pot înscrie într-o competiție 
          WCA?
        content:
          '1': >-
            Nu există vârstă minimă. Totuși, ar trebui să ai permisiunea
            părinților înainte de a te înscrie (vezi <a
            href='https://www.worldcubeassociation.org/regulations/#2b'>Regula
            2b</a>).
  about:
    title: Despre WCA
    mission_statement: >-
      Misiunea noastră este să avem cât mai multe competiții în cât mai multe
      țări, cu cât mai mulți oameni și cât mai multă distracție, în condiții de
      dreptate și egalitate.
    mission_footer: Misiunea WCA
    who_we_are_title: Cine suntem
    who_we_are_content_html: >-
      <p>World Cube Association guvernează competițiile dedicate puzzle-urilor
      mecanice care sunt operate prin rotirea unui grup de piese (cunoscute ca
      "twisty puzzles" ). Cel mai cunoscut astfel de puzzle este Cubul Rubik,
      inventat de profesorul Rubik, din Ungaria. O parte din aceste puzzle-uri a
      fost aleasă pentru a constitui probe oficiale WCA</p> <p>Pe măsură ce WCA
      a evoluat în ultimul deceniu, peste 100 000 de oameni au participat la
      competiții. Chiar și cu această creștere, rămânem o organizație operată
      integral de către voluntari, de la organizatori locali de competiții la
      Delegați WCA și până la Boardul WCA. Suntem recunoscători tuturor celor
      care își dedică o parte din timpul lor liber activităților WCA. Cu mai
      mult suport financiar, sperăm să producem un nivel și mai mare de
      profesionalism în competițiile noastre, pe măsură ce organizăm din ce în
      ce mai multe evenimente pe tot globul.</p>
    spirit: >-
      Spiritul nostru este: "Vrem ca oameni din toată lumea să se distreze
      împreună, într-o atmosferă prietenoasă, să se ajute reciproc și să aibă un
      comportament sportiv adecvat".
    spirit_footer: Spiritul WCA
    our_goals_title: Scopurile noastre
    our_goals_content_html: >-
      <p> World Cube Association dorește să aducă oportunitea de a fi membri ai
      unei comunități sau chiar printre liderii acesteia tinerilor din toată
      lumea, prin organizarea competițiilor de puzzle-uri mecanice. Noi credem
      că participarea la competiții, în interiorul comunității noastre, le dă
      șansa tinerilor implicați să se dezvolte, iar introducând noi oameni în
      lumea evenimentelor noastre, comunitatea noastră crește și devine mai
      puternică. Un document despre Viziunea și Strategia pentru WCA a Boardului
      poate fi consultat <a
      href="https://documents.worldcubeassociation.org/documents/WCA_Strategic_Plan.pdf">aici</a>.</p>
    whats_next_title: Ce urmează pentru WCA?
    whats_next_content_html: >-
      <p> World Cube Association a numărat de-a lungul anilor peste 100000 de
      concurenți din 140 de țări - și nu plănuim să ne oprim din creștere prea
      curând! Comunitatea de cubing s-a extins progresiv de la înființarea
      noastră, în 2004, și dorim să menținem această evoluție facilitând
      competițiile în cât mai multe zone noi. În viitor dorim să susținem
      creșterea și mai mult prin noi colaborări și contactul constructiv cu cei
      pasionați de puzzle-uri. </p>
    world_championship_title: Campionat Mondial
    world_championship_content_html: >-
      <p> Odată la doi ani, organizăm competiția care decide cine va fi
      campionul mondial. Aceste evenimente necesită o planificare extrem de
      precisă, cu ajutorul unui număr mare de voluntari, dar și cu un angajament
      financiar considerabil pentru rezervarea spațiului de concurs și
      pregătirile necesare. </p>
    contributing_title: Cum pot să ofer o contribuție
    contributing_content_html: >-
      Poți dona folosind un card de credit folosind Guidestar %{here_credit} sau
      Paypal %{here_paypal}. Dacă preferi să scrii un cec, poți scrie un mesaj
      către:
    tax_deductible_note: Donațiile sunt deductibile de impozit în Statele Unite
    other_help_title: Alte modalități de a ajuta
    other_help_content_html: >-
      <p> Dacă vrei să contribui pentru World Cube Association altfel decât
      financiar, suntem bucuroși să purtăm un dialog! Te rugăm să ne contactezi
      la <a
      href="mailto:communication@worldcubeassociation.org">communication@worldcubeassociation.org</a>.
      </p>
    donation_banner:
      content: >-
        World Cube Association este o organizație scutită de taxe conform
        501(c)(3). Deoarece suntem o organizație nonprofit formată 100% din
        voluntari, suntem recunoscători pentru donațiile voastre, care ne ajută
        să ne îndeplinim viziunea de a avea și mai multe competiții distractive
        în toată lumea.
      donate_credit: Donează printr-un card de debit/credit
      donate_paypal: Donează prin Paypal
      donate_other: Alte modalități de a dona
    structure:
      teams_committees_councils: 'Echipe, Comitete și Consilii WCA'
      title: Structură
      board:
        name: Boardul de Directori WCA
        description: >-
          Board-ul WCA este responsabil de conducerea globală a organizației și
          de îndeplinirea sarcinilor care nu intră în sfera celorlalte Echipe,
          Comitete și Consiliilor.
      committees: >-
        Echipele și comitetele WCA sunt o parte integrala a organizației și
        desfășoară activități zilnice, necesare pentru funcționarea acesteia.
        Aceste comitete sunt compuse din membri ai comunității WCA, inclusiv
        Delegați WCA și concurenți. Fiecare echipă are un lider, al cărui rol
        este de a asigura buna funcționare a acesteia și de a îi îndruma pe
        ceilalalți membri. Consiliile sunt echipe speciale, care au rolul de a
        oferi sfatului Boardului WCA, si sunt alcătuite din membri ai
        comunității (dar nu din WCA Staff). Când se formează noi echipe,
        comitete sau consilii, informațiile despre procesul de aplicare sunt
        afișate pe homepage-ul WCA.
      senior_member: Membru Senior
      leader: Lider
      officers:
        name: Ofițeri WCA
        description: >-
          Directorii WCA se ocupă de sarcinile legate de statutul non-profit al
          WCA. Acești directori sunt aleși de Boardul WCA. Directorul Executiv
          este CEO-ul WCA, Președintele conduce toate întâlnirile Boardului,
          Secretarul se ocupă de documentele organizației iar Trezorierul se
          ocupă de aspectele financiare ale WCA.
      chair:
        name: Președintele WCA
      executive_director:
        name: Directorul Executiv WCA
      secretary:
        name: Secretarul WCA
      vice_chair:
        name: Vicepreședintele WCA
      treasurer:
        name: Trezorierul WCA
      users:
        profile: 'profilul utilizatorului %{user_name}'
      wdc:
        name: Comitetul Disciplinar WCA
        description: >-
          Acest comitet consiliază Boardul WCA în cazuri speciale, ca încălcări
          intenționate ale Regulamentului WCA, și poate fi contactat de membrii
          WCA în cazul unor probleme personale importante ce vizează
          competițiile WCA.
      wdpc:
        name: Comitetul de Protecția Datelor WCA
        description: >-
          Acest comitet este responsabil de toate aspectele legate de Protecția
          Datelor.
      wrc:
        name: Comitetul de Regulamente WCA
        description: Acest comitet este responsabil de administrarea 
          Regulamentului WCA.
      wrt:
        name: Echipa de Rezultate WCA
        description: >-
          Această echipă este responsabilă pentru administrarea tuturor
          rezultatelor oficiale.
      wst:
        name: Echipa de Software WCA
        description: >-
          Această echipă este responsabilă pentru administrarea software-ului
          WCA (site, programe de amestecare, workbook-uri, tooluri de admin).
      wct:
        name: Echipa de Comunicare WCA
        description: >-
          Echipa de Comunicare WCA (WCT) are rolul de a supraveghea și susține
          comunicarea WCA cu comunitatea și publicul general. Comunicarea WCA
          trebuie să contribuie la realizarea Obiectivelor WCA și să susțină o
          cultură pozitivă de prietenie, transparență, incluziune, deschidere și
          răspundere.
      wfc:
        name: Comitetul Financiar WCA
        description: Această echipă este responsabilă de finanțele WCA.
      wec:
        name: Comitetul de Etică WCA
        description: >-
          Acest comitet are rolul de a se asigura că toate procedurile
          întreprinse de Stafful WCA și Stafful extern se supun Codului de Etică
          și de a face investigații independente dacă acțiunile întreprinse de
          acești membri nu respectă Codul de Etică. Astfel de investigații pot
          fi cerute de către orice speedcuberi înregistrați care se adreseză
          Comitetului de Etică. Acesta rezolvă, de asemena, disputele apărute
          când cineva nu este de acord cu o decizie luată de Comisia
          Disciplinară WCA.
      weat:
        name: Echipa de Asistenți Executivi WCA
        description: >-
          Această echipă este responsabilă de desfășurarea sarcinilor
          administrative ale Boardului WCA.
      wqac:
        name: Comitetul de Asigurare a Calității WCA
        description: >-
          Acest comitet are rolul de a susține și promova constant îmbunătățirea
          calității în WCA, precum și aplicarea la nivel global a standardelor
          de calitate pentru a asigura un nivel consistent de calitate al
          proceselor, Staffului WCA, Organizațiilor Regionale, Organizatorilor
          de Competiții și Staffului de Competiție.
      wcat:
        name: Echipa de Anunțare a Competițiilor WCA
        description: >-
          Această echipă are rolul de a aproba și anunța Competițiile WCA și a
          asigura că aceste informări aderă standardelor de calitate WCA.
      wmt:
        name: Echipa de Marketing WCA
        description: >-
          Această echipă este responsabilă de dezvoltarea și întreținerea
          Brandului WCA, căutarea sponsorilor, susținerea distribuirii
          Echipamentului de Competiții WCA și marketingul Produselor WCA.
      wac:
        name: Echipa de Consilieri WCA
        description: >-
          Această echipă este responsabilă de clădirea și menținerea
          comunicației bilaterale între Comunitatea WCA și Stafful WCA.
      wsot:
        name: Echipa de Organizare Sportivă WCA
        description: >-
          Această echipă are rolul de a supraveghea și susține recunoașterea WCA
          ca o federație sportivă internațională.
      wat:
        name: Echipa de Arhivare WCA
        description: >-
          Echipa de Arhivare WCA este un Comitet Consultativ al WCA. Această
          echipă are rolul de a suprabeghea și susține dezvoltarea unei arhive a
          organizației.
      banned:
        name: Concurenți interziși
      wct_china:
        name: WCT China
      operations_html: >-
        Operațiunile de zi cu zi ale WCA sunt executate de
        %{committees_and_teams} WCA.
      teams_committees: Echipe și Comitete
      probation:
        name: Delegați în Probă
      wst_admin:
        name: Admini software
      delegates_html: >-
        <p><strong>Delegatul WCA</strong> este un rol definit în Moțiunile WCA
        și descris mai departe în Regulamentul WCA. Sarcina principală a unui
        Delegat este să supravegheze competiții în numele WCA. Un delegat WCA
        este responsabil să se asigure că toate competițiile se desfășoară
        conform Misiunii, Spiritului și Regulamentului WCA. În cadrul WCA există
        <strong>Delegați Seniori</strong>, <strong>Delegați Regionali</strong>,
        <strong>Delegați</strong>, <strong>Delegați Juniori</strong> și
        <strong>Delegați Candidați</strong> %{see_link}.</p><p> În plus față de
        datoriile unui Delegat WCA, un Delegat Senior sau Regional este
        responsabil de supravegherea Delegaților din zona lui și poate fi
        contactat de comunitate pentru probleme ce țin de regiunea sa.</p><p>
        Noii Delegați sunt recunoscuți, mai întâi, ca Delegați Juniori WCA; după
        aceea, trebuie să arate că sunt capabili să supervizeze cu succes
        competițiile, înainte de a fi numiți Delegați.</p> <p> Delegații
        Candidați sunt instruiți pentru poziția de Delegat WCA și pot
        supraveghea competiții doar dacă este prezent și un Delegat WCA
        calificat. </p>
      see_link_html: '(vezi %{link})'
      members_html: >-
        Toți concurenții devin automat  <strong>membrii</strong> WCA după prima
        lor competiție.
