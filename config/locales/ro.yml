    manage_oauth_html: 'Mergi la %{oauth_link} pentru a-ți administra aplicațiile
      OAuth.'
    token_request_intro: >-
      Uite un exemplu de a obține un token de acces folosind ID-ul Aplicației,
      Client Secret, email-ul și parola ta WCA, în italic:
    user_email_placeholder: YOUR_EMAIL
