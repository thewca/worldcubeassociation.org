  incidents_log:
    i18n_disclaimer: >-
      Te rugăm să ții cont că secțiunea de incidente este disponibilă doar în
      engleză, conținutul de mai jos nu este tradus.
    incident: 'Incident:'
  about_regulations:
    title: Despre Regulament
    panel1:
      title: Regulament
      content1_html: >-
        Toate competițiile trebuie să se desfășoare conform <a
        href="/regulations/">Regulamentului WCA</a>. Este important ca
        participanții să citească aceste reguli înainte de prima lor competiție.
      content2_html: >-
        Pe lângă Regulamentul WCA, există și <a
        href="/regulations/guidelines.html">Îndrumările WCA</a>, ce conțin
        clarificări și explicații suplimentare
      content3_html: >-
        Deciziile importante luate de către Comitetul de Regulamente WCA asupra
        incidentelor care s-au petrecut la competiții pot fi consultate în <a
        href="/incidents">Incidents Log</a>.
    panel2:
      title: Traduceri
      content1_html: >-
        Regulamentul WCA este valabil nu numai în limba engleză, ci a fpst
        tradus în mai multe limbi de către membrii WCA:  <a
        href="/regulations/translations/">Traduceri</a>.
      content2_html: >-
        <strong>Important</strong>: Deși traducerile sunt foarte utile, ele nu
        sunt oficiale. În competiții, versiunea în limba engleză a
        Regulamentului WCA este cea care se aplică.
    panel3:
      title: Întrebări Frecvente despre Regulament
      content1_html: >-
        <a href="/faq">Secțiunea de Întrebări Frecvente</a> conține răspunsuri
        pentru multe întrebări despre Regulamentul WCA.
    panel4:
      title: Ghidul Organizatorului
      content1_html: >-
        Dacă ești interesat sau deja planifici să organizezi o competiție, te
        rugăm să citești <a href="https://documents.worldcubeassociation.org/edudoc/organizer-handbook/organizer-handbook.pdf">Ghidul
        Organizatorului</a>.
      content2_html: >-
        Acest document conține informații importante și trebuie să fie citit de
        către toți organizatorii de competiții.
  regulations_translations:
    title: 'Regulamentul și Îndrumarul WCA: Traduceri'
    paragraph1: >-
      Dacă vorbești altă limbă în afară de engleză, s-ar putea ca aceste
      traduceri să te ajute.
    paragraph2: >-
      Te rugăm să ții cont că trafucerile nu au un statut oficial, chiar dacă
      sunt disponibile pe site-ul WCA, ele având, în primul rând, un caracter
      orientativ. Dacă există vreo diferență între o traducere și versiunea în
      engleză (actuală și oficială), versiunea în engleză va avea întotdeuna
      prioritate și ea este cea ce trebuie aplicată.
    translations: Traduceri
    current: Actuale
    old: Versiuni anterioare
    table_elements:
      version: Versiune
      language: Limbă
    translating: Traducerea Regulamentului
    paragraph3_html: >-
      Dacă ești interesat să adaugi/actualizezi o traducere, te rugăm să vezi <a
      href="https://github.com/thewca/wca-regulations-translations#translation-instructions">instrucțiunile
      de pe acest GitHub repository</a>.
