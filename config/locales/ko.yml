          피드백을 구하고자 하는 경우 아래의 해당 박스에 체크해 주십시오.
        setup_images: >-
          이번 대회에서 사용된 스크램블 구역과 기록 측정 구역을 묘사하는 이미지(다른 사진 또한 환영)를 반드시 최소
          %{image_count}개 이상 포함하여 주십시오. 대회 진행 도중에 촬영된 사진일수록 좋습니다. 한 번에 여러 파일을
