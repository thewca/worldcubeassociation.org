    user_email_placeholder: 이메일
    user_password_placeholder: 비밀 번호
    user_info_request_intro: >-
      OAuth 액세스 토큰은 만료될 때까지 승인된 API 요청을 하는 데 사용할 수 있습니다. 예를 들어, 계정에 대한 정보에
