          WIC 사건이 민감한 경우(범죄, 괴롭힘, 폭행 등을 포함하되 이에 국한되지 않음), 해당 내용은 보고서에서 제외하고 WIC에
          별도로 이메일을 보내주십시오. 다른 WIC 사건의 경우, 기본적으로 간략하고 익명화된 버전을 작성하고 자세한 내용을 WIC에
          비공개로 연락해 주십시오. WIC는 보편적인 인지를 위해 익명화된 버전에 대한 피드백을 제공할 것입니다. WCA 자원봉사자와
          관련된 모든 WIC 사건의 경우, 모든 세부 정보를 보고서에서 제외하고 WIC에 비공개로 연락해 주십시오.
