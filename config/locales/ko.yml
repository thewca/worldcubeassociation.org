      undefined_time_limit_warning: >-
        [%{round_id}] 이 라운드의 기록 제한은 정의되지 않았으며 기록 제한 검증이 건너뛰어졌습니다. 이는 2013년 이전
        대회에만 해당됩니다.
      suspicious_dnf_warning: >-
        [%{round_ids}] 라운드에는 누적 기록 제한이 있으며, %{person_name}의 성공적인 솔브를 기준으로 추정하면
        적어도 하나의 DNF에 남은 시간이 매우 적었을 것입니다. 모든 DNF와 DNS가 실제로 올바른지 확인하십시오. 경쟁자가 시도를
        시작하지 않았거나 시도를 시작하기 전에 남은 시간이 없는 경우 DNS로 입력해야 합니다.
      missing_cumulative_round_id_error: >-
        [%{original_round_id}] WCIF에 지정된 누적 기록 제한에 대한 라운드 %{wcif_id}을 찾을 수 없습니다.
        대회의 종목 관리 페이지로 이동하여 %{original_round_id}의 누적 기록 제한에서 %{wcif_id}을 제거하십시오.
        WST는 이 버그(GitHub 문제 #3254)에 대해 알고 있습니다.
      wrong_position_in_results_error: >-
        [%{round_id}] %{person_name}은 잘못된 위치에 있습니다. %{expected_pos}를 기대했지만
        %{pos}를 받았습니다.
    rounds:
      too_many_qualified_warning: >-
        라운드 %{round_id}: 계획된 진출 조건보다 더 많은 선수가 진출했습니다(%{expected} 대신 %{actual},
        조건은 %{condition}이었습니다). 종목 관리 페이지에서 라운드 정보를 업데이트하십시오.
      regulation_9m1_error: >-
        라운드 %{round_id}에는 경쟁자가 99명 이하이지만 후속 라운드가 3개 이상 있습니다 - 이는 규정 9m1에 따라 허용되지
        않습니다.
      regulation_9m2_error: >-
        라운드 %{round_id}에는 경쟁자가 15명 이하이지만 후속 라운드가 2개 이상 있습니다 - 이는 규정 9m2에 따라 허용되지
        않습니다.
      regulation_9m3_error: >-
        라운드 %{round_id}에는 경쟁자가 7명 이하이지만 후속 라운드가 1개 이상 있습니다 - 이는 규정 9m3에 따라 허용되지
        않습니다.
      regulation_9p1_error: '라운드 %{round_id}: 경쟁자 중 25% 미만이 탈락했는데, 이는 규정 9p1에 따라 허용되지
        않습니다.'
      no_competitor_eliminated_error: '라운드 %{round_id}: 규정 9p(2010년 4월 이전 대회)에 따라
        최소 한 명의 경쟁자가 탈락해야 합니다.'
      less_than_twenty_five_percent_eliminated_error: >-
        라운드 %{round_id}: 진출 조건(%{condition})에 따르면, 25%% 미만의 선수가 탈락하게 되며, 이는 규정
        9p1에 따라 허용되지 않습니다. 종목 관리 페이지에서 라운드 정보를 업데이트해 주십시오.
      not_enough_qualified_warning: >-
        라운드 %{round_id}: 종목 데이터에 따르면 최대 %{expected}명이 진출할 수 있었지만 라운드에서 경쟁한 사람은
        %{actual}명 뿐이었습니다. 이에 대해 코멘트를 남겨주십시오(또는 다른 진행 조건을 적용한 경우 종목 데이터를
        수정하십시오).
      competed_not_qualified_error: >-
        라운드 %{round_id}: %{ids}가 경쟁했지만 진출 조건(%{condition})을 충족하지 못했습니다. 진출 조건이
        대회 중에 사용된 내용을 반영하는지 확인하고 필요한 경우 결과를 제거하십시오.
      round_not_found_error: >-
        라운드 %{round_id}을(를) 찾을 수 없습니다. WCA 웹사이트 "종목 수정" 패널과 "WCA Live"가 동기화되어
        있는지 확인하십시오.
      missing_round_results_error: >-
        라운드 %{round_id}에 대한 결과는 없지만 종목 탭에 나열되어 있습니다. 이 라운드가 개최되지 않은 경우 대회의 종목 관리
        페이지에서 라운드를 제거하십시오.
    events:
      not_333_main_event_warning: >-
        이 대회의 선택된 주 종목은 %{main_event_id}입니다. 이는 대회 전에 WCAT에서 승인되었지만, WRT는 대회 이후에
        WCA 대회 요구 사항 정책에 따른 적절한 주 종목 지침이 충족되었는지 확인할 책임이 있습니다. 대회 중에
        %{main_event_id}을(를) 주 종목으로 간주하기 위해 취한 한 가지 조치를 알려주세요(유효한 예: 대회에서 우승한
        것으로 선언, 최대 라운드 수, 최대 상금 금액).
      no_main_event_warning: 이 대회에는 선택된 주 종목이 없습니다. 이것이 맞다는 것을 WRT에 알려주십시오.
      missing_results_warning: >-
        %{event_id}에 대한 결과는 없지만 공식 종목으로 등재되어 있습니다. 종목이 열렸다면 결과를 포함하여 JSON을 다시
        업로드하십시오. 종목이 열리지 않았다면 WRT에 댓글을 남겨주십시오.
    scrambles:
      missing_scrambles_for_round_error: >-
        [%{round_id}] 스크램블이 누락되었습니다. Scrambles Matcher를 사용하여 라운드에 올바른 스크램블을
        추가하십시오.
      missing_scrambles_for_competition_error: 대회를 위한 스크램블이 누락되었습니다. Scrambles 
        Matcher를 사용하여 스크램블을 추가하십시오.
      missing_scrambles_for_group_error: >-
        [%{round_id}] 그룹 %{group_id}: 스크램블이 누락되었습니다. %{expected} 대신 %{actual}만
        감지되었습니다.
      missing_scrambles_for_multi_error: >-
        [%{round_id}] 3x3x3 멀티 블라인드에는 여러 그룹이 있을 수 있지만,  최소 하나의 그룹에는 모든 시도에 대한
        스크램블이 포함되어야 합니다.
      mbld_scrambles_warning: >-
        [%{round_id}] 이번 라운드는 3x3x3 멀티 블라인드 결과를 포함합니다. WRT에서 사용되지 않은 스크램블을 제거할 수
        있도록, 제출 코멘트에 각 스크램블 세트에서 참가자가 실제로 사용한 스크램블의 개수를 명시해 주세요.
      multiple_fmc_groups_warning: >-
        [%{round_id}] 여러 FMC 그룹이 사용되었습니다. 한 그룹의 FMC가 사용된 경우 Scrambles Matcher를
        사용하여 사용되지 않은 스크램블을 선택 취소하십시오. 그렇지 않은 경우 여러 그룹의 FMC가 사용된 이유를 설명하는 WRT에
        주석을 포함하십시오.
      wrong_number_of_scramble_sets_error: >-
        [%{round_id}] 이 라운드의 스크램블 세트 수(%{actual})는 '종목 관리' 탭에 지정된
        수(%{expected})와 다릅니다. '종목 관리' 탭에서 스크램블 세트 개수를 실제 사용된 세트 개수로 조정해 주세요.
    schedule:
      activity_outside_competition_dates_warning: >-
        '%{activity_name}' 활동(코드: %{activity_code})은 개최지의 현지 시간대를 기준으로 대회 일정 기간
        외에 편성되어 있습니다. 대회 일정을 실제 대회 날짜로 업데이트해 주시기 바랍니다.
