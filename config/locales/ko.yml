  incidents_log:
    i18n_disclaimer: '사건 섹션은 영어로만 제공되며, 아래 내용은 번역되지 않습니다.'
    incident: '사건:'
  about_regulations:
    title: 규정에 대하여
    panel1:
      title: 규정
      content1_html: >-
        모든 WCA 대회는 <a href="/regulations/">WCA 규정</a>을 따라야 합니다. 선수는 첫 대회에 참가하기
        전에 규정을 숙지하는 것이 중요합니다.
      content2_html: >-
        WCA 규정 위원회에서 해결한 대회 중 발생한 사건에 대한 중요한 결정은 <a href="/incidents">사건
        기록</a>에서 확인할 수 있습니다.
    panel2:
      title: 번역본
      content1_html: >-
        WCA 규정은 영어로 제공될 뿐만 아니라, WCA 회원들에 의해 여러 언어로 번역되었습니다: <a
        href="/regulations/translations/">번역본</a>.
      content2_html: >-
        <strong>중요</strong>: 번역본은 매우 유용하지만 공식적인 문서는 아닙니다. 대회에서는 WCA 규정의 영어 버전이
        구속력을 갖습니다.
    panel3:
      title: 규정에 관하여 자주 묻는 질문들
      content1_html: >-
        <a href="/faq">자주 묻는 질문들</a> 섹션에서는 WCA 규정에 대한 반복적인 문의 사항에 대한 답변을
        모아놓았습니다.
    panel4:
      title: 주최자 지침
      content1_html: >-
        대회를 주최하는 데 관심이 있거나 이미 대회를 주최할 계획이 있다면 <a
        href="https://documents.worldcubeassociation.org/edudoc/organizer-handbook/organizer-handbook.pdf">주최자
        지침</a>을 읽어보십시오.
      content2_html: 본 문서에는 중요한 정보가 포함되어 있으므로 모든 대회 주최자가 꼭 읽어야 합니다.
  regulations_translations:
    title: 'WCA 규정: 번역본'
    paragraph1: 영어가 아닌 다른 언어를 사용하신다면 이러한 번역이 유용할 수 있습니다.
    paragraph2: >-
      번역본은 WCA 웹사이트에 제공되더라도 공식적인 지위는 없으며, 어떠한 보장도 제공하지 않습니다. 번역본과 (현재 공식) 영어 버전
      사이에 차이가 있는 경우 영어 버전을 사용해야 합니다.
    translations: 번역본
    current: 최신판
    old: 구판
    table_elements:
      version: 버전
      language: 언어
    translating: 규정 번역
    paragraph3_html: >-
      번역본을 추가/업데이트하는 데 관심이 있으시면 <a
      href="https://github.com/thewca/wca-regulations-translations#translation-instructions">번역에
      대한 GitHub 리포지토리의 지침</a>을 참조하십시오.
  media:
    common:
      view_media_page: 모든 미디어 보기
      confirm_delete: 이 미디어를 삭제하시겠습니까?
    new:
      title: 미디어 제출
      review_warning_html: 모든 미디어는 <a href="/media">모든 미디어 페이지</a>에 게시되기 전에 검토를 
        거칩니다.
      guidelines: 지침
      media_guidelines:
        '1': 모든 미디어 콘텐츠는 선택된 대회와 관련이 있어야 합니다.
        '2': '모든 미디어 콘텐츠는 적절하고 깔끔해야 하며, 부적절하거나 불쾌한 내용을 포함해서는 안 됩니다.'
        '3': 미디터 콘텐츠에는 후원사나 광고가 광범위하게 포함되어서는 안 됩니다.
        '4': 모든 미디어 콘텐츠에는 적절하고 설명이 포함된 제목이 있어야 합니다.
    edit:
