    delete:
      confirm_delete: 이 지역 단체 요청을 삭제하시겠습니까?
  score_tools:
    title: WCA 대회를 위한 소프트웨어 도구
    wca_icon_text: WST에서 개발 및 유지 관리
    intro:
      desc: 이 페이지는 WCA 대회에 주최에 도움이 되는 것으로 알려진 도구의 전체 목록은 아닙니다.
      disclaimer: >-
        해당 페이지의 모든 도구가 WST에서 관리되는 것은 아닙니다. 저희는 모든 WCA 관련 소프트웨어를 관리할 수 있는 인력이
        없습니다 :)
      used: >-
        이 목록에 있는 모든 프로그램은 실제 WCA 대회에서 사용되었으며 WCA 웹사이트와 통합되어 있습니다. WCA 계정으로 로그인하여
        다가올 대회의 데이터를 가져올(때로는 업데이트할) 수 있습니다. 각 프로그램의 유지 관리자는 명확하게 기재됩니다.
    before:
      title: 대회 전
      desc: >-
        참가 신청 관리 작업은 WCA 웹사이트에서 직접 할 수 있습니다. 그룹과 자원봉사자를 수동으로 관리하는 것은 시간이 많이 걸릴 수
        있으므로 아래 도구 중 하나를 사용하는 것을 고려해 보십시오.
    during:
      title: 대회 중
      desc: 여기에서는 대회가 진행되는 동안 대회의 결과를 관리할 수 있는 도구를 찾을 수 있습니다.
    after:
      title: 대회 후
      desc: >-
        결과 검증은 웹사이트에서 바로 이루어지지만, TNoodle에서 생성된 스크램블을 WCA 웹사이트에 제출된 실제 결과에 할당하려면
        도구를 사용해야 합니다.
    tools:
      age:
        title: AGE
        description: WCA 대회를 위한 그룹/업무 배정 생성 및 수정 도구
      certificates:
        title: 상장
        description: WCA Live를 사용하여 WCA 대회 상장을 인쇄합니다
      groupifier:
        title: Groupifier
        description: >-
          WCA 대회 주최자를 위한 업무 및 그룹 관리 도구입니다. 주요 기능 중에는 선수를 순위별로 분류하고, 업무(심사,
          스크램블링)를 할당하고, 필요한 스크램블 세트 수를 결정하고, 기록지, 개인 명찰, 요약을 생성하는 기능이 있습니다. 자세한
          내용은 웹사이트를 확인하십시오.
      scorecards:
        title: 기록지
        description: WCA Live를 사용하여 WCA 대회의 기록지를 인쇄합니다
      tnoodle:
        title: TNoodle (스크램블)
        description: >-
          TNoodle은 WCA 대회에 사용되는 공식 스크램블 프로그램입니다. 일반적으로 WCA 대회 전에 WCA 파견위원이
          사용하지만, 사용자 인터페이스를 통해 누구나 모든 WCA 종목에 대한 모든 종류의 스크램블을 생성할 수 있습니다.
      live:
        title: WCA 라이브
        description: WCA 대회를 운영하고 전 세계와 실시간 결과를 공유할 수 있는 플랫폼입니다.
      nightmare:
        title: 결과 스프레드시트
        description: 가끔 문제가 발생하는 경우가 있습니다... 네트워크 접속이 없으면 오래된 스프레드시트를 사용해야 합니다.
      matcher:
        title: Scrambles Matcher
        description: >-
          TNoodle에서 생성된 스크램블을 결과에 할당하는 데 사용할 수 있습니다. WCA 웹사이트(WCA Live 사용 시),
          스프레드시트 또는 독립형 WCIF 파일에서 결과를 가져옵니다. 하나 이상의 TNoodle json 파일에서 스크램블을
          가져옵니다. WCA 제출에 적합한 형식으로 결과를 내보냅니다.
      groups:
        title: Competition groups
        description: 진행 중인 대회들의 참가자 그룹 보기
  logo:
    title: WCA 로고
    intro: >-
      WCA 로고는 2005년 1월 디자인 콘테스트에서 저스틴 이스트먼(Justin Eastman)이 디자인했습니다. 우리는 로고의
      디자인, 색상, 그리고 3x3x3 큐브를 특정해서 보여주지 않는다는 점이 마음에 들었습니다.
    headings:
      usage_guidelines:
        title: 사용 지침
        paragraph:
          acceptable_usage: >-
            WCA 로고의 허용 가능한 사용은 <a
            href="https://documents.worldcubeassociation.org/documents/policies/external/Logo%20Usage.pdf">WCA
            로고 사용 정책</a>에 설명되어 있습니다. 자신의 프로젝트에서 WCA 로고를 사용하기 전에 이 문서를 읽어보십시오.
            WCA 로고 사용에 대한 추가 질문은 <a
            href="mailto:marketing@worldcubeassociation.org">WCA 마케팅 팀</a>으로
            보내주십시오.
          see_below: WCA 로고를 올바르게 사용하기 위한 추가 스타일 지침은 다음과 같습니다
        color:
          title: 색상
          paragraph: WCA 로고는 네 가지 색상 변형이 있습니다. 로고가 배치되는 매체의 배경색에 따라 올바른 색상 변형을 
            사용해야 합니다.
          primary:
            title: 기본
            paragraph: 가능하면 기본 변형을 사용하십시오.
          mono:
            title: 모노
            paragraph: 기본 변형이 적합하지 않을 때만 모노 변형을 사용하십시오.
        logo_only:
          title: 로고만
          paragraph: 'WCA 로고는 로고타입 없이도 사용할 수 있으며, 위의 색상 지침을 따릅니다.'
      download_logo_assets:
        title: 로고 애셋 다운로드
        paragraph: WCA 로고의 고해상도 PNG 및 벡터 버전을 다운로드할 수 있습니다.
        accept_terms_and_conditions: >-
          <a
          href="https://documents.worldcubeassociation.org/documents/policies/external/Logo%20Usage.pdf">WCA
          로고 사용 정책</a>을 읽었으며 이에 동의합니다.
        download_button_text: 로고 애셋 다운로드
