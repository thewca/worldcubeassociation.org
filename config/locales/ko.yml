    legal_tnoodle_api_header: 허용된 TNoodle 버전
    login_message: 로그인하십시오
  merch:
    title: WCA 상품
    paragraphs:
      '1': >-
        WCA의 독점 상품을 구매할 수 있습니다! 티셔츠, 후드티, 스티커, 스택 매트, 백팩 등 다양한 상품을 제공합니다! 클래식
        WCA 로고, 공식 세계 챔피언십 상품, 세계 신기록 디자인을 포함하여 디자인은 지속적으로 업데이트됩니다.
      '2': >-
        상점을 통해 WCA 상품을 구매하는 것은 비영리 자원봉사 조직인 WCA를 지원하는 가장 좋은 방법 중 하나입니다. 우리는 상품의
        모든 수익을 챔피언십, 장비 및 기타 WCA 관련 활동에 추가로 사용합니다.
      '3': >-
        전 세계 어디에서나 저희 상품을 구매하실 수 있습니다. 유럽, 미국, 인도에 직영 매장이 있으며 곧 다른 지역도 매장을 오픈할
        예정입니다!
  database:
    results_export:
      heading: WCA 결과 내보내기
      deprecation_warning: >-
        사용 중단 알림: 결과 내보내기 기능의 %{old_version} 버전은 더 이상 사용되지 않으며,
        %{deprecation_date}부터 지원이 중단될 예정입니다. 그 전에 %{new_version} 버전으로 전환하여
        사용하십시오.
      description: >-
        이 페이지에서는 WCA 결과를 여러 형식으로 다운로드할 수 있도록 제공하므로, 이를 광범위하게 사용하거나 분석할 수 있습니다.
        일반적으로 매 주말마다 결과가 확정되면 업데이트합니다. 파일에는 번호가 매겨지고 날짜가 표시되어 있으므로 최신 버전이 이미 있는지
        확인할 수 있습니다.
      permalink: 퍼머링크
      permalink_note: >-
        참고: Permalink는 특정 버전 내에서 최신 결과 내보내기를 제공합니다. 즉, v2 Permalink는 최신 v2 내보내기를
        반환하지만, v3이 출시되더라도 v2 상태를 유지합니다.
      file_formats:
        sql: SQL 데이터베이스로 가져오기 위한 SQL 문입니다.
        tsv: 'OpenOffice.org, Excel 등의 스프레드시트에 대한 탭으로 구분된 값'
      hint_readme_html: '포함된 %{readme_filename} 파일에는 이용 약관과 일반적인 설명(영어이며 번역되지 않음)이
        포함되어 있습니다:'
    developer_export:
      heading: WST 개발자 내보내기
      description_html: >-
        이 페이지에서는 SQL 덤프로 다운로드할 수 있는 WST 개발자 내보내기를 제공합니다. 자세한 내용은
        %{github_link}에서 확인할 수 있습니다.
      download: 다운로드
