          도구를 사용하는 소프트웨어를 유지 관리하는 개발자에게 권장됩니다.
        receive_delegate_reports: >-
          귀하가 수석 파견위원 또는 WRC/WQAC의 회원인 경우 기본적으로 파견위원 보고서를 받게 됩니다. 참고: 변경 사항이
          적용되기까지 최대 12시간이 걸릴 수 있습니다.
        delegate_reports_region: >-
          모든 보고서를 받으려면 이 필드를 비워두십시오(맨 위의 드롭다운 옵션). 참고: 변경 사항이 적용되기까지 최대 12시간이 걸릴
          수 있습니다.
        otp_attempt: 구성된 모바일 애플리케이션에서 일회용 비밀번호를 확인하거나 복구 코드 중 하나를 입력하십시오.
      dob_contact:
        dob: 생년월일의 올바른 형식은 YYYY-MM-DD입니다.
        document: >-
          귀하의 신원과 정확한 생년월일을 증명하기 위해, 귀하의 이름과 생년월일이 적힌 법적 문서(신분증, 운전 면허증, 학생증,
          여권, 출생증명서 등)의 사진을 첨부해야 합니다. 문서의 내용이 영문이 아니라면 귀하의 지역 파견위원에게 문의하십시오. 신원
          확인에는 최소한의 정보인 귀하의 성명과 생년월일만이 필요하므로, 그 외 개인 정보는 가린 후 보내주셔도 됩니다.
      post:
        body: >-
