        Če ste zainteresirani za organiziranje tekmovanja ali ga že načrtujete,
        preberite <a href="https://documents.worldcubeassociation.org/edudoc/organizer-handbook/organizer-handbook.pdf">smernice
        za organizatorje</a>.
      content2_html: >-
        Ta dokument vsebuje pomembne informacije, prebrati ga mora vsak
        organizator tekmovanj.
  regulations_translations:
    title: 'WCA pravilnik: prevodi'
    paragraph1: >-
      Če govorite kateri koli jezik, razen angleščine, vam bodo ti prevodi morda
      v pomoč.
    paragraph2: >-
      Upoštevajte, da prevodi nimajo uradnega statusa, čeprav so na voljo na
      spletni strani WCA: ne zagotavljajo nobenih jamstev. Če obstaja razlika
      med prevodom in (trenutno uradno) angleško različico, je treba uporabiti
      angleško različico.
    translations: Prevodi
    current: Aktualni
    old: Starejši
    table_elements:
      version: Različica
      language: Jezik
    translating: Prevajanje pravilnika
    paragraph3_html: >-
      Če vas zanima dodajanje ali posodabljanje prevodov, si oglejte <a
      href="https://github.com/thewca/wca-regulations-translations#translation-instructions">navodila
      na GitHub repozitoriju za prevode</a>.
