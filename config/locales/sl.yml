      review_warning_html: >-
        Vsa vsebina mora biti pregledana preden se pojavi na <a
        href="/media">strani z večpredstavnostno vsebino</a>.
      guidelines: Smernice
      media_guidelines:
        '1': Vsa vsebina se mora navezovati na izbrano tekmovanje.
        '2': >-
          Vse vsebina mora biti primerna, čista in ne sme vsebovati žaljivih
          vsebin.
        '3': Vsebina ne sme vsebovati obsežne prisotnosti sponzorjev ali reklam.
        '4': Vsa vsebina mora imeti ustrezne naslove.
