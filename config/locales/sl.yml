      incident:
        title: 'Upoštevajte, da je to javno in mora biti izpolnjeno v angleščini!'
        private_description: >-
          Opis incidenta, ki ga lahko vidijo le delegati. Prosimo, izpolnite v
          angleščini.
        private_wrc_decision: >-
          Končna odločitev WRC, ki lahko vključuje zasebne podrobnosti. Prosimo,
          izpolnite v angleščini.
        public_summary: >-
          Splošen opis incidenta in odločitev, povezanih z njim. Te informacije
          bodo javno prikazane. Prosimo, izpolnite v angleščini.
      user:
        dob: Vnesite datum rojstva tekmovalca v formatu LLLL-MM-DD.
        name: >-
          Pravilno vnesite polno ime tekmovalca, npr. <strong>Janez
          Novak</strong>. Izogibajte se površnim zapisom, kot je <strong>j
          novak</strong>.<br/>Srednja imena (v celoti ali kot začetnice) so
          neobvezna.
        pending_avatar: >-
          Po prenosu novega avatarja morate počakati na odobritev s strani WCA
          ekipe za rezultate.
        registration_notifications_enabled: >-
          Velja le za tekmovanja, ki jih organizirate ali delegirate. To
          nastavitev lahko spremenite za vsako tekmovanje posebej.
        receive_developer_mails: >-
          Omejeno na obvestila ob večjih spremembah med različicami orodij, kot
          so izvozi podatkov, WCIF sheme in javni API-ji. Priporočeno za
          razvijalce programske opreme, ki temeljijo na teh orodjih.
        receive_delegate_reports: >-
          Če ste višji delegat ali član WRC ali WQAC, je prejemanje delegatskih
          poročil privzeto. Opomba: traja lahko do 12 ur, da sprememba stopi v
          veljavo.
        delegate_reports_region: >-
          Če želite prejemati vsa poročila, pustite to polje prazno (prva
          možnost na spustnem seznamu). Opomba: traja lahko do 12 ur, da
          sprememba stopi v veljavo.
        otp_attempt: >-
          Preverite vašo nastavljeno mobilno aplikacijo za enkratno geslo ali
          vnesite eno izmed vaših obnovitvenih kod.
      dob_contact:
        dob: Vaš točen datum rojstva v formatu LLLL-MM-DD
        document: >-
          Kot dokazilo vaše identitete in pravilnega datuma rojstva morate
          priložiti sliko kateregakoli uradnega dokumenta (osebna izkaznica,
          vozniško dovoljenje, potni list, študentska izkaznica, rojstni list,
          ...) na katerem sta vaše ime in datum rojstva jasno razvidna ter
          razumljiva osebi, ki razume angleško (oziroma kontaktirajte vam
          lokalnega WCA delegata, če takega dokumenta nimate). Na dokumentu
          morata biti razvidna vsaj vaše ime in datum rojstva; če želite, lahko
          ostale osebne podatke zakrijete.
      post:
        body: >-
          Uporabite &lt;!-- break --&gt; oznako za prikaz predogleda na domači
          strani. Na objavah na domači strani bo prikazano besedilo, ki se
          nahaja pred tem delilnim znakom. Dejanska objava bo prikazala celotno
          vsebino besedila.
        show_on_homepage: >-
          Pozor! To ni varno za zasebne podatke. Namenjeno je le preprečevanju
          nastajanja zmešnjave na domači strani. Objave, ki niso prikazane na
          domači strani, so še vedno dostopne javnosti preko povezave ali oznak.
      delegate_report:
        schedule_url: >-
          Polna povezava do objavljenega urnika (npr.
          http://www.rubiks.si/wca/2016/index.php?page=schedule)
        equipment: >-
          Število merilnikov časa in prikazovalnikov, uporabljenih na
          tekmovanju. Prosim odstranite vrstico/e opreme, ki ni bila v uporabi.
        summary: >-
          Zgornje točke služijo le kot vodilo za sestavljanje ustreznega
          poročila. Uporabite jih po lastni presoji. Prosimo, izbrišite
          neuporabljene dele!
        venue: >-
          Zgornje točke služijo le kot vodilo za sestavljanje ustreznega
          poročila. Uporabite jih po lastni presoji. Prosimo, izbrišite
          neuporabljene dele!
        organization: >-
          Zgornje točke služijo le kot vodilo za sestavljanje ustreznega
          poročila. Uporabite jih po lastni presoji. Prosimo, izbrišite
          neuporabljene dele!
        incidents: >-
          Prosimo, poročajte o vseh nestandardnih incidentih. Oštevilčite jih
          začenši z 1., tako da se ostali delegati ob komentiranju lahko
          sklicujejo na njihove številke. Tudi, če se vse zdi generično, vseeno
          nanizajte vsaj najvidnejše primere. Prosimo, obkljukajte ustrezna
          polja spodaj, če želite povratno informacijo.
        setup_images: >-
          Naložiti MORATE vsaj %{image_count} slik, ki prikazujejo območja, kjer
          se izvaja mešanje in tekmovanje na tem tekmovanju, najbolje tiste,
          posnete med tekmovanjem (tudi ostale slike so dobrodošle). Izbere
          lahko več datotek hkrati. Slike lahko izbrišete šele, ko je bilo
          naloženih dovolj drugih slik (če želite sliko zamenjati, morate
          najprej naložiti novo, šele potem izbrisati staro). Če slik z območij
          mešanja in tekmovanja, medtem ko sta ti v uporabi, nimate, prosimo,
          razložite zakaj.
        wrc_incidents: >-
          Seznam številk, ki se sklicujejo na incidente, za katere želite dobiti
          povratno informacijo WRC.
        wic_incidents_html: >-
          Seznam številk, ki se sklicujejo na incidente, za katere želite dobiti
          povratno informacijo WIC. <br> <strong>%{wic_incident_alert}</strong>
        wic_incident_alert: >-
          Če je WIC incident občutljiv (vključno z, vendar ne omejeno na:
          kazniva dejanja, nadlegovanje, nasilje, itd.), prosimo, da ga
          izpustite iz poročila in kontaktirate WIC preko e-pošte. Za ostale WIC
          incidente napišite strnjeno, anonimizirano različico incidenta in
          pošljite WIC ostale podrobnosti preko zasebnega kanala. WIC bo vseeno
          podal povratno informacijo na anonimizirano različico z namenom
          splošnega ozaveščanja. Za vse incidente, v katere je bil vključen WCA
          prostovoljec, prosimo, izpustite vse podrobnosti iz poročila in
          kontakirajte WIC preko zasebnega kanala.
        remarks: >-
          Pišite o kakršnih koli drugih podrobnostih, ki bi jih radi delili
          (npr. izboljšanje/upadanje znotraj skupnosti, prihodnji načrti za to
          regijo). Če ste z namenom jedrnatosti v prejšnjih predelih kaj
          izpustili, lahko pišete o tem tu.
      competition_tab:
        name: 'Primeri: potovanje, plačila, nagrade, nastanitve'
      regional_organization:
        website: Mora biti veljaven http(s) URL. HTTPS je priporočen
        logo: 'Mora biti v formatu PNG, v dobri resoluciji, s prozornim ozadjem'
        email: Naj bo seznam e-naslovov vseh direktorjev in vodstvenih delavcev
        bylaws: Mora biti v formatu PDF
        extra_file: >-
          Mora biti v formatu PDF. Če morate dodati več datotek, jih, prosimo,
          združite
