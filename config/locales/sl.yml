  media_and_instagram:
    page_title: Multimedija in Instagram
    general_media_submission:
      title: Oddaja splošnih večpredstavnostnih vsebin
      body_html: >-
        Na <a href="/media">strani z večpredstavnostnimi vsebinami</a> delimo
        članke in slike s tekmovanj. Če imate vsebino, ki bi jo radi delili,
        izpolnite <a href="/media/new">splošni obrazec za oddajo vsebin</a>!
    instagram_submission:
      title: Instagram
      paragraph1_html: >-
        WCA ima <a href="https://www.instagram.com/thewcaofficial/">aktiven
        Instagram</a>! Da bi kar najbolje odražali globalno skupnost kockarjev,
        objavljamo vsebine, ki nam jih pošljejo kockarji z vsega sveta.
      paragraph2: >-
        Če imate visokokakovostne fotografije ali videoposnetke, ki bi jih
        želeli objaviti, kliknite spodnji gumb in izpolnite obrazec! Da lahko
        objavimo vašo vsebino, morate biti njen lastnik in morate dati
        dovoljenje WCA za njeno objavo. Zaradi velikega števila prispevkov, ki
        jih prejmemo, ne moremo objaviti vseh, vendar je tukaj nekaj nasvetov za
        objavo vaše vsebine:
      photo_quality: >-
        Poskrbite, da je kakovost fotografije/videoposnetka dobra. Ni nujno, da
        so posnetki profesionalni, vendar mora biti kakovost vsebine dovolj
        dobra.
      photo_interest: >-
        Vsebina naj bo zanimiva za širše občinstvo. Vsebina, ki je zanimiva le
        za peščico ljudi, ne sodi sem.
      wca_related: >-
        Objavljajte fotografije in videoposnetke, ki so povezani z WCA, saj je
        to bistvo našega računa! Radi vidimo kockarje, ki se zabavajo!
      submit_instagram_content: Oddaj vsebino za Instagram
    instagram_hosting:
      title: Gostovanje na Instagramu
      paragraph1_html: >-
        Včasih članom skupnosti omogočimo, da gostujejo na WCA Instagramu z
        objavljanjem zgodb (angl. stories) s tekmovanja, ki se ga udeležujejo!
        Če ste zainteresirani, kliknite gumb in izpolnite spodnji obrazec. WCA
        ekipa za komunikacijo vas bo kontaktirala, ko bodo posredovane vse
        informacije, če boste izbrani za gostovanje. Če imate kakršna koli
        vprašanja, <a
        href="https://www.worldcubeassociation.org/contact/website">nas
        kontaktirajte</a>.
      paragraph2: >-
        Naš cilj je deliti malo osebne plati vsakega kockarja in vsakega
        tekmovanja. Ne želimo, da je gostovanje veliko breme za ustvarjalca -
        prijetna izkušnja na tekmovanju je na prvem mestu, šele nato pride
        deljenje izkušnje z drugimi.
      paragraph3: 'Vlogo gostitelja lahko povzamemo takole:'
      short_intro: 'Na kratko se predstavite, povejte nekaj o sebi in o tekmovanju.'
      venue_feel: >-
        Posnemite nekaj posnetkov, da gledalci dobijo občutek za prizorišče in
        ljudi. To je lahko le posnetek s tekmovalnega območja.
      people_solving: >-
        Poskusite posneti nekaj posnetkov ljudi, ki rešujejo (po možnosti hitrih
        ljudi v njihovih glavnih disciplinah).
      mini_interviews: >-
        Lahko poskusite opraviti kratke intervjuje z ljudmi (organizatorji,
        delegati itd.), ki želijo povedati, kaj si mislijo o tekmovanju.
      pictures_too: 'Pošiljate lahko tudi slike, ni nujno, da so samo videoposnetki.'
      paragraph4: >-
        Naša komunikacija čez vikend običajno poteka prek WhatsApp skupine.
        Prosimo, poskrbite, da poznate to platformo za sporočanje, ali pa nam
        sporočite, če je ne morete uporabljati, da se lahko dogovorimo za druge
        načrte.
      apply_to_host: Prijavi se za gostovanje
    other_suggestions:
      title: Drugi predlogi?
      body_html: >-
        Imate kakšne druge predloge za Instagram ali druge vsebine na družbenih
        omrežjih? <a
        href="https://www.worldcubeassociation.org/contact/website">Sporočite
        nam</a>!
  footer:
    privacy: Zasebnost
    disclaimer: Omejitev odgovornosti
  api:
    manage_oauth_html: 'Za upravljanje aplikacij OAuth pojdite na %{oauth_link}.'
    token_request_intro: >-
      Tukaj je primer pridobivanja dostopnega žetona z uporabo ID-ja aplikacije,
      skrivnosti odjemalca, vašega e-poštnega naslova WCA in gesla z uporabo
      ukaza curl:
    user_email_placeholder: YOUR_EMAIL
    user_password_placeholder: YOUR_PASSWORD
    user_info_request_intro: >-
      Žeton za dostop OAuth se lahko uporablja do poteka veljavnosti za
      pooblaščene zahteve API-ja. Na primer, za dostop do informacij o vašem
      računu:
    legal_tnoodle_api_header: Legalna različica TNoodle
    login_message: 'Prosim, prijavite se'
  merch:
    title: Promocijski izdelki WCA
    paragraphs:
      '1': >-
        WCA ponuja ekskluzivno blago, ki ga lahko kupite! Od majic, puloverjev s
        kapuco, nalepk, podlog, nahrbtnikov in še več! Naše dizajne nenehno
        posodabljamo, vključno s klasičnim logotipom WCA, uradnimi izdelki
        svetovnega prvenstva in dizajni svetovnih rekordov.
      '2': >-
        Nakup izdelkov WCA v naših trgovinah je eden najboljših načinov, da
        podprete WCA - neprofitno organizacijo, ki jo vodijo prostovoljci. Ves
        dobiček od prodaje izdelkov uporabljamo za nadaljnje financiranje
        prvenstev, opreme in drugih dejavnosti, povezanih z WCA.
      '3': >-
        Naše izdelke lahko kupite po vsem svetu – v neposrednih trgovinah v
        Evropi, Ameriki in Indiji, kmalu pa bodo na voljo še druge!
  database:
    results_export:
      heading: Izvoz WCA rezultatov
      deprecation_warning: >-
        OBVESTILO O ZASTARELOSTI: Različica %{old_version} izvoza rezultatov je
        zastarela, podpora zanjo bo ukinjena %{deprecation_date}. Prosimo,
        uporabite novejšo različico %{new_version}.
      description: >-
        Na tej strani ponujamo rezultate WCA za prenos v več oblikah, da jih
        lahko uporabljate/analizirate v celoti. Običajno jih bomo posodobili po
        vsakem tekmovalnem vikendu, ko bodo rezultati dokončni. Datoteke so
        oštevilčene in datirane, tako da lahko vidite, ali že imate najnovejšo
        različico.
      permalink: permalink
      permalink_note: >-
        Opomba: Stalne povezave (permalink) zagotavljajo najnovejši izvoz
        rezultatov znotraj dane različice – stalna povezava v2 bo vrnila
        najnovejši izvoz v2, vendar bo ostala na v2, tudi ko bo izdana v3.
      file_formats:
        sql: Stavki SQL za uvoz v baze podatkov SQL.
        tsv: >-
          Vrednosti, ločene s tabulatorji, za preglednice v OpenOffice.org,
          Excel itd.
      hint_readme_html: >-
        Priložena datoteka %{readme_filename} vsebuje pogoje uporabe in splošen
        opis (v angleščini, brez prevoda):
    developer_export:
      heading: Izvoz za razvijalce WST
      description_html: >-
        Na tej strani ponujamo izvoz WST za razvijalce za prenos kot SQL dump.
        Podrobnosti najdete na %{github_link}.
      download: Prenesi
  validators:
    persons:
      dob_is_jan_one_warning: >-
        Datum rojstva osebe %{name} je 1. januar, prosimo preverite, ali je
        pravilen.
      dob_is_too_young_warning: '%{name} je star manj kot 3 leta, preverite, ali je
        to pravilno.'
      dob_is_too_old_warning: >-
        %{name} je star približno 100 let, prosimo preverite, ali je to
        pravilno.
      person_doesnt_have_any_results_error: 'Ni rezultatov za %{person_name} z ID-jem
        %{person_id}.'
      results_not_associated_with_any_person_error: 'Na voljo so rezultati za neznano
        osebo z ID-jem %{person_id}'
      whitespace_in_name_error: 'Oseba ''%{name}'' ima presledke na začetku/na koncu
        ali dvojne presledke.'
      person_with_non_existing_wca_id_error: 'Oseba %{name} ima WCA ID, ki ne obstaja:
        %{wca_id}.'
      no_space_before_parenthesis_error: 'Pred odprtim oklepajem v ''%{name}'' mora
        biti presledek.'
      same_person_name_warning: >-
        V podatkovni bazi WCA je že vsaj ena oseba z imenom '%{name}'
        (%{wca_ids}). Prepričajte se, da je vaš '%{name}' druga oseba. Če ni,
        dodelite pravilen WCA ID uporabniškemu računu in ponovno ustvarite
        rezultate v obliki JSON.
      non_matching_dob_warning: >-
        Datum rojstva '%{dob}', naveden za %{name} (%{wca_id}), se ne ujema s
        trenutnim zapisom v zbirki podatkov WCA ('%{expected_dob}'). Če gre za
        napako, jo popravite. V nasprotnem primeru pustite komentar o tem za
        WRT.
      non_matching_gender_warning: >-
        Spol '%{gender}', naveden za %{name} (%{wca_id}), se ne ujema s
        trenutnim zapisom v zbirki podatkov WCA ('%{expected_gender}'). Če gre
        za napako, jo popravite. V nasprotnem primeru pustite komentar o tem za
        WRT.
      empty_gender_warning: >-
        Polje za spol novinca %{name} je prazno. Veljavne vrednosti spola so
        'ženski', 'moški' in 'drugo'. Prosimo, pustite komentar o tem za WRT.
      non_matching_name_warning: >-
        Ime '%{name}', podano za %{wca_id}, se ne ujema s trenutnim zapisom v
        zbirki podatkov WCA ('%{expected_name}').
      non_matching_country_warning: >-
        Država '%{country}', podana za %{name} (%{wca_id}), se ne ujema s
        trenutnim zapisom v zbirki podatkov WCA ('%{expected_country}'). Če gre
        za napako, jo popravite. V nasprotnem primeru pustite komentar o tem za
        WRT.
      multiple_newcomers_with_same_name_warning: >-
        Obstaja več novincev z enakim imenom: %{name}. Prosimo, poskrbite, da so
        vsi rezultati za te tekmovalce pravilni in da so vsi rezultati pravilno
        ločeni z ustreznim ID-jem.
      wrong_parenthesis_type_error: >-
        Oklepaj, uporabljen v '%{name}', je neustrezen znak. Zamenjajte ga z
        navadnim oklepajem '(' ali ')' in z ustreznim razmikom.
      special_characters_in_name_warning: >-
        Ime '%{name}' vsebuje neveljavne posebne znake (kot so številke,
        narekovaji ali drugi simboli). Imena naj vsebujejo samo črke, presledke,
        vezaje, apostrofe, pike in navadne oklepaje.
      suspicious_last_name_warning: >-
        '%{name}' ima kot priimek navedeno '%{suffix}', ki morda ni dejanski
        priimek (npr. generacijska pripona, napisana v celoti). Prosimo,
        potrdite, da je to pravi priimek, ali pa ga ustrezno
        zamenjajte/odstranite.
      successive_uppercase_name_warning: >-
        Ime '%{name}' ima zaporedne velike črke. Prosimo, potrdite, da je to res
        pravilen zapis, ali pa popravite ime.
      lowercase_name_warning: >-
        '%{name}' ima ime z malo začetnico. Prosimo, potrdite, da je to res
        pravilen zapis, ali pa popravite ime.
      missing_period_in_single_letter_middle_name_warning: >-
        '%{name}' ima srednje ime iz ene črke brez kratice in pike. Prosimo,
        potrdite, da je to res pravilen zapis, ali pa ime popravite.
      letter_after_period_warning: >-
        V imenu uporabnika '%{name}' manjka presledek za piko. Prosimo,
        potrdite, da je to res pravilen zapis, ali pa popravite ime.
      single_letter_first_or_last_name_warning: >-
        '%{name}' ima eno samo črko kot ime ali priimek. Prosimo, popravite ime
        ali potrdite, da je to res pravilno ime tekmovalca v skladu z uradnim
        dokumentom.
      single_name_warning: >-
        '%{name}' ima samo eno ime. Prosimo, potrdite, da je to res polno ime
        tekmovalca v skladu z uradnim dokumentom.
      competitor_limit_exceeded_warning: >-
        Število oseb na tekmovanju (%{n_competitors}) presega omejitev
        tekmovalcev (%{competitor_limit}). Rezultate tekmovalcev, ki so se
        prijavili po dosegu omejitve tekmovalcev, je treba odstraniti.
      registration_details_mismatch_warning: >-
        Oseba z ID-jem prijave %{person_id} (%{name}) ima vnešene podatke, ki se
        ne ujemajo z njeno prijavo: %{mismatches}
      missing_matching_registration_warning: 'Oseba %{name} nima ujemajoče prijave.'
      unaccepted_registration_with_results_warning: >-
        Oseba %{name} ima rezultate na tekmovanju, vendar prijava ni označena
        kot »sprejeta«.
    results:
      automatically_position_fixed_info: >-
        [%{round_id}] Položaj osebe %{person_name} je bil samodejno popravljen
        iz %{pos} na %{expected_pos}.
      mbf_result_over_time_limit_warning: >-
        [%{round_id}] Rezultat '%{result}' za %{person_name} je presegel časovno
        omejitev. Preden pošljete rezultate, se prepričajte, da je to posledica
        časovnih kazni, ali pa rezultat popravite na DNF.
      result_after_dns_warning: >-
        [%{round_id}] %{person_name} ima vsaj en rezultat DNS, ki mu sledi
        veljaven rezultat. Prepričajte se, da gre res za DNS, in če je tako,
        pojasnite WRT, kaj se je zgodilo.
      similar_results_warning: >-
        [%{round_id}] Rezultati za %{person_name} so podobni rezultatom za
        %{similar_person_name}. Prosimo, poskrbite, da so ti rezultati pravilno
        zabeleženi za oba tekmovalca.
      met_cutoff_but_missing_results_error: >-
        [%{round_id}] %{person_name} je dosegel odrez, vendar mu manjkajo
        rezultati za drugo fazo kroga. Meja je bila %{cutoff}.
      didnt_meet_cutoff_but_has_results_error: >-
        [%{round_id}] %{person_name} ima vsaj en rezultat za drugo fazo kroga,
        vendar ni dosegel odreza. Meja je bila %{cutoff}.
      wrong_attempts_for_cutoff_error: >-
        [%{round_id}] Za osebo %{person_name} manjka vsaj en poskus v fazi
        odreza. Prosimo, uredite rezultat, da vključite manjkajoče poskuse, ali
        posodobite podatke o krogu na strani Upravljanje disciplin.
      result_over_time_limit_error: >-
        [%{round_id}] Vsaj en rezultat osebe %{person_name} je prekoračil
        časovno omejitev za krog, ki je %{time_limit} na poskus. Vse poskuse, ki
        so prekoračili časovno omejitev, je treba spremeniti v DNF.
      results_over_cumulative_time_limit_error: >-
        [%{round_ids}] Vsota rezultatov osebe %{person_name} presega skupno
        časovno omejitev, ki je bila %{time_limit}.
      undefined_time_limit_warning: >-
        [%{round_id}] Časovna omejitev za ta krog ni določena, validacije
        časovnih omejitev so bile preskočene. To je pričakovano le za tekmovanja
        pred letom 2013.
      suspicious_dnf_warning: >-
        [%{round_ids}] Krog ima skupno časovno omejitev in če ekstrapoliramo na
        podlagi uspešnih reševanj osebe %{person_name}, bi mu ostalo zelo malo
        časa za vsaj enega od njegovih DNF-jev. Prosimo, poskrbite, da sta vsak
        DNF in DNS res pravilna. Če tekmovalec ni začel poskusa ali ni imel
        preostalega časa pred začetkom poskusa, mora biti vnesen kot DNS.
      missing_cumulative_round_id_error: >-
        [%{original_round_id}] Ni mogoče najti kroga %{wcif_id} za skupno
        časovno omejitev, določeno v WCIF. Pojdite na stran Upravljanje
        disciplin in odstranite %{wcif_id} iz skupne časovne omejitve za
        %{original_round_id}. WST ve za to napako (GitHub issue #3254).
      wrong_position_in_results_error: >-
        [%{round_id}] %{person_name} je na napačnem mestu: pričakovan
        %{expected_pos}, dobljen pa %{pos}.
    rounds:
      too_many_qualified_warning: >-
        Krog %{round_id}: kvalificiralo se je več tekmovalcev, kot je bilo
        načrtovano v pogoju za napredovanje (%{actual} namesto %{expected},
        pogoj je bil: %{condition}). Prosimo, posodobite podatke o krogu na
        strani za upravljanje discplin.
      regulation_9m1_error: >-
        Krog %{round_id} ima 99 ali manj tekmovalcev, vendar ima več kot dva
        sledeča kroga, kar ni dovoljeno v skladu s pravilom 9m1.
      regulation_9m2_error: >-
        Krog %{round_id} ima 15 ali manj tekmovalcev, vendar ima več kot en
        sledeči krog, kar ni dovoljeno v skladu s pravilom 9m2.
      regulation_9m3_error: >-
        Krog %{round_id} ima 7 ali manj tekmovalcev, vendar ima vsaj en sledeči
        krog, kar ni dovoljeno v skladu s predpisom 9m3.
      regulation_9p1_error: >-
        Round %{round_id}: Izpadlo je manj kot 25 % tekmovalcev, kar v skladu s
        predpisom 9p1 ni dovoljeno.
      no_competitor_eliminated_error: >-
        Krog %{round_id}: Izločen mora biti vsaj en tekmovalec, kar je zahtevano
        v skladu s pravilom 9p (tekmovanja pred aprilom 2010).
      less_than_twenty_five_percent_eliminated_error: >-
        Krog %{round_id}: glede na pogoj za napredovanje (%{condition}) bi bilo
        izločenih manj kot 25 % % tekmovalcev, kar v skladu s predpisom 9p1 ni
        dovoljeno. Prosimo, posodobite informacije o krogu na strani za
        upravljanje dogodkov.
      not_enough_qualified_warning: >-
        Krog %{round_id}: glede na podatke o disciplinah bi lahko napredovalo
        največ %{expected} tekmovalcev, vendar je v krogu tekmovalo le %{actual}
        tekmovalcev. Prosimo, pustite komentar o tem (ali popravite podatke o
        disciplinah, če ste uporabili drugačen pogoj za napredovanje).
      competed_not_qualified_error: >-
        Krog %{round_id}: %{ids} so tekmovali, čeprav niso izpolnili pogoja za
        napredovanje (%{condition}). Prepričajte se, da pogoj napredovanja
        odraža tisto, kar je bilo uporabljeno med tekmovanjem, in po potrebi
        odstranite rezultate.
      round_not_found_error: >-
        Kroga %{round_id} ni bilo mogoče najti. Prepričajte se, da sta stran
        Urejanje disciplin na spletni strani WCA in WCA Live sinhronizirana.
      missing_round_results_error: >-
        Za krog %{round_id} ni rezultatov, vendar je naveden na zavihku
        disciplin. Če ta krog ni bil izveden, ga odstranite na strani za
        upravljanje disciplin.
    events:
      not_333_main_event_warning: >-
        Izbrani glavna disciplina je %{main_event_id}. Čeprav je WCAT to odobril
        PRED tekmovanjem, je WRT odgovoren za zagotovitev, da so bile PO
        tekmovanju izpolnjene ustrezne smernice za glavno disciplino iz politike
        pogojev za tekmovanja WCA. Navedite eno dejanje, ki je bilo izvedeno, da
        se je disciplina %{main_event_id} obravnavala kot glavna disciplina MED
        tekmovanjem (veljavni primeri: razglašen za zmagovalca tekmovanja,
        največje število krogov, večja nagrada).
      no_main_event_warning: >-
        Za to tekmovanje glavna disciplina ni izbrana. Prosimo, obvestite WRT,
        da je to pravilno.
      missing_results_warning: >-
        Za %{event_id} ni rezultatov, vendar je na seznamu uradnih disciplin. Če
        je bila disciplina izvedena, ponovno naložite svojo datoteko JSON z
        rezultati. Če disciplina ni bila izvedena, pustite komentar za WRT.
    scrambles:
      missing_scrambles_for_round_error: >-
        [%{round_id}] Manjkajoči mešalni algoritmi. Uporabite Scrambles Matcher,
        da v krog dodate pravilne mešalne algoritme.
      missing_scrambles_for_competition_error: >-
        Manjkajo mešalni algoritmi. Uporabite Scrambles Matcher za dodajanje
        mešalnih algoritmov.
      missing_scrambles_for_group_error: >-
        [%{round_id}] Skupina %{group_id}: manjkajoči mešalni algoritmi, zaznane
        so bile le %{actual} namesto %{expected}.
      missing_scrambles_for_multi_error: >-
        [%{round_id}] Čeprav je v disciplini 3x3x3 več kock slepo lahko več
        skupin, mora vsaj ena od skupin vsebovati mešalne algoritme za vse
        poskuse.
      mbld_scrambles_warning: >-
        [%{round_id}] Ta krog vključuje rezultate za disciplino 3x3x3 več kock
        slepo . V komentarju navedite, koliko mešalnih algoritmov iz vsakega
        seta je bilo dejansko uporabljenih, da lahko WRT neuporabljene mešalne
        algoritme odstrani.
      multiple_fmc_groups_warning: >-
        [%{round_id}] Za disciplino 3x3x3 opitimalno je navedenih več skupin. Če
        so bili vsi tekmovalci v eni skupini, prosimo, uporabite Scrambles
        Matcher, da odznačite neuporabljene mešalne algoritme. V nasprotnem
        primeru prosimo, da vključite komentar za WRT, v katerem pojasnite,
        zakaj je bila disciplina 3x3x3 optimalno izvedena v več skupinah.
      wrong_number_of_scramble_sets_error: >-
        [%{round_id}] Ta krog ima drugačno število mešalnih algoritmov
        (%{actual}), kot je določeno na zavihku Upravljanje disciplin
        (%{expected}). Na zavihku Upravljanje disciplin ustrezno popravite
        število uporabljenih mešalnih algoritmov.
    schedule:
      activity_outside_competition_dates_warning: >-
        Dejavnost '%{activity_name}' (koda: %{activity_code}) je načrtovana
        izven datuma tekmovanja v lokalnem časovnem pasu prizorišča. Prosimo,
        posodobite urnik tekmovanja, da bo odražal dejanske datume tekmovanja.
