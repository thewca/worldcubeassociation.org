        En esta página ofrecemos los resultados WCA para descarga en varios
        formatos para que puedan ser usados/analizados. Normalmente actualizamos
        cada semana cuando han acabado las competiciones del fin de semana. Los
        ficheros están numerados y fechados de forma que puedas comprobar si
        tienes ya la versión más reciente.
      permalink: Enlace permanente
      permalink_note: >-
        Los links permanentes entregan la exportación más reciente dentro de una
        versión dada. Por ejemplo, el link permanente de la v2 retornará la
        exportación de v2 más reciente, pero continuará retornando v2 incluso
        cuando se lance la v3.
      file_formats:
        sql: 'Sentencias SQL, para importar en Bases de datos SQL.'
        tsv: >-
          Valores separados por tabulador, para hojas de cálculo en
          OpenOffice.org, Excel, etc.
      hint_readme_html: >-
        El archivo %{readme_filename} incluido contiene los términos de uso y
        una descripción general (en Inglés, no está traducido):
    developer_export:
      heading: Export de Desarrollador WST
      description_html: >-
        En esta página ofrecemos el export de desarrollador WST para descarga
        como SQL dump. Más detalles en %{github_link}.
      download: Descargar
  validators:
    persons:
      dob_is_jan_one_warning: >-
        La fecha de nacimiento de %{name} se ha indicado el 1 de enero. Por
        favor, confirma que es correcto.
      dob_is_too_young_warning: >-
        %{name} parece tener menos de 3 años de edad, por favor verifica que sea
        correcto.
      dob_is_too_old_warning: >-
        %{name} parece tener cerca de 100 años de edad, por favor verifica que
        sea correcto.
      person_doesnt_have_any_results_error: 'No hay resultados para %{person_name}
        con el ID %{person_id}'
      results_not_associated_with_any_person_error: 'Hay resultados para una persona
        desconocida con el ID %{person_id}'
      whitespace_in_name_error: >-
        El nombre "%{name}" tiene espacios al comienzo y/o al final, o espacios
        dobles.
      person_with_non_existing_wca_id_error: '%{name} tiene un WCA ID que no existe:
        %{wca_id}.'
      no_space_before_parenthesis_error: 'Los paréntesis en "%{name}" deben ser precedidos
        por un espacio.'
      same_person_name_warning: >-
        Ya hay al menos una persona llamada "%{name}" en la base de datos de la
        WCA (%{wca_ids}). Por favor, asegúrate de que tu "%{name}" sea una
        persona diferente. En caso contrario, por favor asigna el WCA ID
        correcto al usuario y regenera el archivo de resultados JSON.
      non_matching_dob_warning: >-
        La fecha de nacimiento de %{name} (%{wca_id}) indicada el día %{dob} no
        concide con la registrada en la WCA (%{expected_dob}). Si esto es un
        error, por favor corrígelo. En caso contrario, deja una nota al WRT al
        respecto explicando la situación.
      non_matching_gender_warning: >-
        El género de %{name} (%{wca_id}) indicado como "%{gender}" no coincide
        con lo registrado en la base de datos (%{expected_gender}). Si es un
        error, corrígelo. En caso contrario, deja un comentario al WRT
        explicando la situación.
      empty_gender_warning: >-
        El género del primerizo %{name} está sin completar. Valores válidos para
        este campo son "Femenino", "Masculino", y "Otro". Por favor, deja un
        comentario al WRT explicando la situación.
      non_matching_name_warning: >-
        El nombre "%{name}" indicado para %{wca_id} no coincide con lo registrado
        en la base de datos ("%{expected_name}").
      non_matching_country_warning: >-
        El país de %{name} (%{wca_id}), %{country}, no coincide lo registrado en
        la base de datos ("%{expected_country}"). Si es un error, corrígelo. En
        caso contrario, deja un comentario al WRT explicando la situación.
      multiple_newcomers_with_same_name_warning: >-
        Hay múltiples primerizos con el mismo nombre: %{name}. Por favor,
        asegúrate de que los resultados son correctos para estos competidores y
        que todos los resultados están asignados correctamente a su ID.
      wrong_parenthesis_type_error: >-
        El paréntesis utilizado en "%{name}" es un carácter irregular, por favor
        reemplázalo con un paréntesis regular "(" o ")" y con espacios
        apropiados.
      special_characters_in_name_warning: >-
        El nombre '%{name}' contiene caracteres especiales inválidos (como
        números, comillas, u otros símbolos). Los nombres solo deberían contener
        letras, espacios, guiones, apóstrofes, puntos, y paréntesis regulares.
      suspicious_last_name_warning: >-
        '%{name}' tiene '%{suffix}' como su apellido, lo cual puede no ser su
        apellido real (por ejemplo, un sufijo generacional escrito completo).
        Por favor, confirma que este es su apellido según un documento legal, o
        corrígelo acordemente.
      successive_uppercase_name_warning: >-
        "%{name}" tiene mayúsculas consecutivas en su nombre. Por favor,
        confirma que esta es la ortografía correcta de su nombre o corrígelo.
      lowercase_name_warning: >-
        "%{name}" tiene un nombre en todo minúsculas. Por favor, confirma que es
        la ortografía correcta del nombre o corrígelo.
      missing_period_in_single_letter_middle_name_warning: >-
        "%{name}" tiene un nombre de una sola letra sin punto abreviativo. Por
        favor, confirma que esta es la ortografía correcta del nombre o
        corrígelo (por ejemplo, "John G Malkovich" => "John G. Malkovich").
      letter_after_period_warning: >-
        "%{name}" tiene un punto sin un espacio a continuación en su nombre. Por
        favor, confirma que es la ortografía correcta del nombre o corrígelo.
      single_letter_first_or_last_name_warning: >-
        "%{name}" tiene un nombre o apellido de una sola letra. Por favor,
        corrige el nombre o confirma que este es su nombre legal solicitando un
        documento de identidad oficial.
      single_name_warning: >-
        "%{name}" tiene un solo nombre. Por favor, confirma que este es el
        nombre completo del competidor con un documento de identidad oficial o
        corrígelo.
      competitor_limit_exceeded_warning: >-
        El número de personas en la competición (%{n_competitors}) supera el
        límite de competidores (%{competitor_limit}). Los resultados de los
        competidores registrados una vez se alcanzó el límite de competidores
        deben ser removidos.
      registration_details_mismatch_warning: >-
        La persona con ID de registro %{person_id} (%{name}) tiene datos que no
        coinciden con su registro: %{mismatches}
      missing_matching_registration_warning: '%{name} no tiene un registro correspondiente.'
      unaccepted_registration_with_results_warning: >-
        %{name} tiene resultados en esta competición, pero el registro no está
        marcado como "aceptado".
    results:
      automatically_position_fixed_info: >-
        [%{round_id}] Se corrigió la posición de %{person_name} de %{pos} a
        %{expected_pos} automáticamente.
      automatically_global_position_fixed_info: >-
        [%{round_id}] Se corrigió automáticamente la posición de %{person_name}
        de %{pos} a %{expected_pos}.
      mbf_result_over_time_limit_warning: >-
        [%{round_id}] El resultado "%{result}" de %{person_name} supera el
        tiempo límite. Por favor, asegúrate de que esto sea por penalidades
        antes de enviar los resultados, o cambia el resultado a DNF.
      result_after_dns_warning: >-
        [%{round_id}] %{person_name} tiene al menos un DNS seguido de un
        resultado válido. Por favor, asegúrate de que sea un DNS y si lo es,
        explica lo sucedido al WRT.
      similar_results_warning: >-
        [%{round_id}] Los resultados de %{person_name} son similares a los de
        %{similar_person_name}. Por favor, controla que los resultados sean
        correctos para ambos competidores.
      met_cutoff_but_missing_results_error: >-
        [%{round_id}] %{person_name} pasó el corte pero no tiene resultados para
        sus últimos intentos. El corte era %{cutoff}.
      didnt_meet_cutoff_but_has_results_error: >-
        [%{round_id}] %{person_name} tiene al menos un resultado en sus últimos
        intentos pero no pasó el corte. El corte era %{cutoff}.
      wrong_attempts_for_cutoff_error: >-
        [%{round_id}] %{person_name} no cuenta con al menos uno de los intentos
        de la fase de corte. Por favor, edita los resultados para incluir el o
        los intentos faltantes, o actualiza la información de la ronda en la
        página de "Administrar eventos" (Manage Events).
      result_over_time_limit_error: >-
        [%{round_id}] Al menos un resultado de %{person_name} excede el tiempo
        límite de la ronda, que es %{time_limit} por intento. Todas las
        soluciones que excedan el tiempo límite deben ser cambiadas a DNF.
      results_over_cumulative_time_limit_error: >-
        [%{round_ids}] La suma de resultados de %{person_name} excede el límite
        acumulativo, que era %{time_limit}.
      undefined_time_limit_warning: >-
        [%{round_id}] El tiempo límite de esta ronda es indefinido, se han
        omitido las validaciones de tiempo límite. Esto solo se pretende para
        competiciones antes del 2013.
      suspicious_dnf_warning: >-
        [%{round_ids}] La ronda tiene un límite acumulativo, y al aproximar los
        tiempos de %{person_name} notamos que habría tenido muy poco tiempo
        disponible para al menos uno de sus DNFs. Por favor, asegúrate de que
        cada DNF y DNS es correcto. Si el competidor no comenzó un intento o se
        quedó sin límite acumulativo, debe ser ingresado como DNS (A1a2+++++).
      missing_cumulative_round_id_error: >-
        [%{original_round_id}] No se puede encontrar la ronda %{wcif_id} para el
        límite acumulativo especificado en el WCIF. Por favor, dirígete al menú
        de "Administrar eventos" (Manage Events) y retira %{wcif_id} del límite
        acumulativo de %{original_round_id}. WST está al tanto de este problema
        (issue de GitHub #3254).
      wrong_position_in_results_error: >-
        [%{round_id}] %{person_name} está en la posición incorrecta: se esperó
        %{expected_pos} pero se encontró %{pos}.
      wrong_global_position_in_results_error: >-
        [%{round_id}] %{person_name} está en una posición incorrecta: se esperó
        %{expected_pos} pero se halló %{pos}.
    rounds:
      too_many_qualified_warning: >-
        [%{round_id}] Más competidores clasificaron de lo que se esperaba
        (%{actual} en vez de %{expected}). La condición era "%{condition}". Por
        favor, actualiza la información de la ronda en el menú de "Administrar
        eventos" (Manage Events).
      regulation_9m1_error: >-
        [%{round_id}] La ronda tiene 99 competidores o menos pero más de dos
        rondas subsiguientes, lo cual no se permite por reglamento (9m1). Se
        deben eliminar las rondas inválidas.
      regulation_9m2_error: >-
        [%{round_id}] La ronda tiene 15 competidores o menos pero más de una
        ronda subsiguiente, lo cual no se permite por reglamento (9m2). Se deben
        retirar las rondas inválidas.
      regulation_9m3_error: >-
        [%{round_id}] La ronda tiene 7 competidores o menos pero cuenta con
        rondas subsiguientes, lo cual no se permite por reglamento (9m3). Se
        deben retirar las rondas inválidas.
      regulation_9p1_error: >-
        [%{round_id}] Menos del 25% de los competidores ha sido eliminado, lo
        que no se permite por la regla 9p1.
      no_competitor_eliminated_error: >-
        [%{round_id}] Al menos un competidor debe ser eliminado, por reglamento
        (9p) (competiciones antes de abril del 2010).
      less_than_twenty_five_percent_eliminated_error: >-
        [%{round_id}] Según las condiciones de avance (%{condition}), menos del
        25% de los competidores serían eliminados, lo cual no se permite por
        reglamento (9p1). Por favor, actualiza la información de la ronda en la
        pestaña de "Administrar eventos" (Manage Events) para tener como máximo
        un 75% avanzando de ronda.
      not_enough_qualified_warning: >-
        [%{round_id}] Como mucho %{expected} podrían haber pasado de ronda, pero
        solo %{actual} compitieron. Por favor, deja un comentario explicando la
        situación (o corrige las condiciones de la ronda).
      competed_not_qualified_error: >-
        [%{round_id}] %{ids} compitieron sin conseguir la condición de avance
        (%{condition}). Por favor, asegúrate de que las condiciones de avance
        reflejen lo que se utilizó en la competición, y retira los resultados
        inválidos si es necesario.
      round_not_found_error: >-
        [%{round_id}] No se ha encontrado la ronda. Por favor, asegúrate de
        sincronizar la WCA Live con la pestaña de "Editar eventos".
      missing_round_results_error: >-
        [%{round_id}] No hay resultados para la ronda, pero se lista en la
        pestaña de eventos. Si esta ronda no sucedió, por favor elimínala en la
        pestaña de "Administrar eventos" (Manage Events).
    events:
      not_333_main_event_warning: >-
        El evento principal seleccionado es %{main_event_id}. Aunque esto se
        aprobó por el WCAT ANTES de la competición, el WRT debe asegurarse de
        que se cumplieron las Políticas de Requerimientos de Competiciones de la
        WCA (WCRP) DESPUÉS de celebrada la competición. Por favor, indica al
        menos una acción realizada para tratar a %{main_event_id} como el evento
        principal DURANTE la competición. Algunos ejemplos son: ganador
        anunciado de la competición, mayor cantidad de rondas, mayor premio,
        etc.
      no_main_event_warning: >-
        Ningún evento ha sido seleccionado como evento principal. Por favor,
        indica al WRT que esto es lo correcto o corrígelo en caso de ser
        necesario.
      missing_results_warning: >-
        No hay resultados para %{event_id}. Si el evento se celebró, por favor
        vuelve a subir el archivo JSON con los resultados corregidos. En caso
        contrario, deja un comentario para el WRT explicando la situación.
    scrambles:
      missing_scrambles_for_round_error: >-
        [%{round_id}] Faltan las mezclas para la ronda. Utiliza "Scrambles
        Matcher" para agregarlas.
      missing_scrambles_for_competition_error: >-
        Faltan las mezclas para la competición. Utiliza "Scrambles Matcher" para
        agregar las mezclas.
      missing_scrambles_for_group_error: >-
        [%{round_id}] Grupo %{group_id}: faltan las mezclas. Se detectaron
        %{actual} en vez de %{expected}.
      missing_scrambles_for_multi_error: >-
        [%{round_id}] Si bien se permiten múltiples grupos para 3x3x3 Múltiple a
        Ciegas, al menos uno de los grupos debe contener mezclas para todos los
        intentos.
      mbld_scrambles_warning: >-
        [%{round_id}] Esta ronda tiene resultados de 3x3x3 Múltiple a Ciegas.
        Por favor, especifica en tu comentario cuántas mezclas de cada set
        fueron utilizadas, así el WRT puede remover las que no se utilizaron.
      multiple_fmc_groups_warning: >-
        [%{round_id}] Hay múltiples grupos de 3x3x3 Menos Movimientos. Si solo
        un grupo fue utilizado, usa "Scrambles Matcher" para sacar las mezclas
        sin usar. En caso contrario, deja un comentario al WRT explicando por
        qué se usaron múltiples grupos en 3x3x3 Menos Movimientos.
      wrong_number_of_scramble_sets_error: >-
        [%{round_id}] Esta ronda tiene distinto número de sets de mezcla
        (%{actual}) a lo especificado (%{expected}) en la pestaña de
        "Administrar eventos" (Manage Events). Por favor, ajusta el número a lo
        correcto.
    schedule:
      activity_outside_competition_dates_warning: >-
        La actividad "%{activity_name}" (código: %{activity_code}) sucedería
        fuera del rango de fechas de la competición según la zona horaria local.
        Por favor, actualiza el horario de la competición para reflejar las
        fechas correctas.
