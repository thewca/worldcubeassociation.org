      incident:
        title: >-
          ¡Ten en cuenta que esto es público y que tienes que rellenarlo en inglés!
        private_description: >-
          Una descripción del incidente que sólo podrá ser vista por Delegados.
          Por favor, rellénalo en inglés.
        private_wrc_decision: >-
          La decisión final del WRC, incluyendo detalles privados. Por favor,
          rellénalo en inglés.
        public_summary: >-
          Una descripción general del incidente y su decisión asociada, para
          mostrar públicamente. Por favor, rellénalo en inglés.
      user:
        dob: >-
          Introduce la fecha de nacimiento del competidor con el formato
          AAAA-MM-DD.
        name: >-
          Introduce el nombre completo del competidor correctamente, por ejemplo <strong>Leandro
          Martín López</strong> y no <strong>leandro martin lopez</strong>.<br/>Los
          segundos nombres (ya sean completos o sus iniciales) son opcionales.
        pending_avatar: >-
          Después de subir un nuevo avatar, tendrás que esperar que el Equipo de
          Resultados lo apruebe.
        registration_notifications_enabled: >-
          Esto sólo aplica en competiciones que organizas o delegas, y puede ser
          anulado en cada competición.
        receive_developer_mails: >-
          Esto se limita a notificaciones para cambios de versiones mayores de
          recursos como exportaciones, esquema de WCIF, y APIs públicas. Se
          recomienda para desarrolladores que mantengan software utilizando
          estas herramientas.
        receive_delegate_reports: >-
          Si eres un Delegado Senior o Miembro del WRC o WQAC, recibirás
          informes de delegados de Competiciones WCA de forma predeterminada.
          Nota: el cambio puede demorar hasta 12 horas en hacer efecto.
        delegate_reports_region: >-
          Si quieres recibir todos los informes de delegados de Competiciones
          WCA, deja este campo en blanco (la primera opción del menú
          desplegable). Nota: el cambio puede demorar hasta 12 horas en hacer
          efecto.
        otp_attempt: >-
          Comprueba tu aplicación de móvil configurada para una contraseña de un
          sólo uso, o introduce uno de los códigos de recuperación.
      dob_contact:
        dob: Tu fecha de nacimiento correcta en formato AAAA-MM-DD
        document: >-
          Para demostrar tu identidad y fecha de nacimiento, tienes que adjuntar
          una foto de algún documento legal (DNI, carnet de conducir, carnet de
          estudiante, pasaporte, certificado de nacimiento, etc.) donde tu
          nombre completo y tu fecha de nacimiento sean visibles. Para la
          identificación necesitamos como mínimo tu nombre y tu fecha de
          nacimiento. Puedes desenfocar u ocultar el resto de datos si así lo
          deseas.
      post:
        body: >-
          Utiliza el tag &lt;!-- break --&gt; como marca de lo que se
          previsualiza en la portada. El texto que haya delante de esta marca se
          muestra en la portada. La noticia real muestra todo el texto, incluido
          el que haya detrás de la marca.
        show_on_homepage: >-
          ¡Cuidado! Esto no es seguro para información privada. Solo sirve para
          evitar que la página de inicio se sobrecargue visualmente. Las
          publicaciones que no se muestran en la página de inicio siguen siendo
          accesibles al público via enlace permanente o a través de etiquetas.
      delegate_report:
        schedule_url: >-
          Enlace completo al horario. (Por ejemplo.,
          "https://www.cubingusa.com/usnationals2016/schedule.php".)
        equipment: >-
          Cantidad y tipo de timers y displays utilizados en la competición. Por
          favor, quita las líneas relativas a equipo que no hayas utilizado.
        summary: >-
          Los puntos mencionados anteriormente solo sirven de guía para un
          reporte completo. Úsalos a tu discreción para lo que creas necesario.
          ¡Por favor remueve partes sin usar!
        venue: >-
          Los puntos listados arriba son solo una guía para un informe completo.
          Úsalos a tu discrección como creas oportuno. ¡Por favor elimina los
          puntos no usados!
        organization: >-
          Los puntos listados arriba son sólo para que sirvan de guía para un
          informe completo. úsalos a tu discrección para lo que creas oportuno.
          ¡Por favor elimina los puntos no usados!
        incidents: >-
          Por favor reporta todos los incidentes no genéricos. Numéralos de
          forma tal que otros Delegados puedan referirse a ellos por su número.
          Si todos los incidentes fueron genéricos, enumera al menos los casos
          más notorios. Marca los recuadros apropiados si estás buscando
          retroalimentación de WIC o WRC.
        setup_images: >-
          SE DEBEN incluir al menos %{image_count} imágenes que ilustren la zona
          de mezclas y de competición, preferiblemente durante la misma (otras
          imágenes son bienvenidas también). Puedes elegir múltiples archivos a
          la vez. Puedes eliminar imágenes solo cuando suficientes otras se
          hayan subido (si quieres reemplazar una imagen, necesitas subir la
          nueva primero, y luego eliminar la antigua). Si no tienes imágenes de
          estas zonas en uso, por favor explica la razón.
        wrc_incidents: >-
          Lista de números que referenciando a algún incidente sobre el que te
          gustaría obtener feedback del WRC.
        wic_incidents_html: >-
          Lista de números haciendo referencia a los incidentes en los cuales
          gustarías de recibir retroalimentación del WIC. <br>
          <strong>%{wic_incident_alert}</strong>
        wic_incident_alert: >-
          Si el incidente del WIC es sensible (incluye pero no se limita a:
          crímenes, acoso, agresión, etc.), por favor exclúyelo de tu reporte y
          envíalo al WIC por separado. Para otros incidentes de WIC, utiliza una
          versión breve y anonimizada del mismo y contacta al WIC por privado
          para continuar con el desarrollo del mismo. El WIC dará feedback sobre
          el incidente anonimizado de todas formas para conocimiento general.
          Para todos los incidentes de WIC que involucren a un Voluntario WCA,
          por favor excluye todos los detalles del reporte y contacta al WIC de
          forma privada.
        remarks: >-
          Habla acerca de otros detalles que quieras compartir (por ejemplo,
          progreso / regresión dentro de la comunidad o planes futuros para la
          región). Si por ser conciso dejaste algo sin decir en las secciones
          anteriores, ahora puedes hacerlo.
      competition_tab:
        name: 'Ejemplos: Cómo llegar, Pagos, Premios, Dónde dormir'
      regional_organization:
        website: Debe ser una URL http(s) válida. Se recomienda HTTPS
        logo: >-
          Debe estar en formato PNG, con buena resolución y con fondo
          transparente
        email: >-
          Debería ser una lista de correo conteniendo todos los cargos de la
          Junta directiva
        bylaws: Debe estar en formato PDF
        extra_file: >-
          Debe estar en formato PDF. Si necesitas añadir más ficheros, por favor únelos
          en uno solo
    options:
      registration:
        status:
          accepted: Aceptado
          pending: Lista de espera
          deleted: Borrado
