      '2': >-
        Comprar productos WCA en nuestras tiendas es una de las mejores maneras
        de apoyar a la WCA, una organización sin ánimo de lucro, basada en
        voluntarios. Usamos todas las ganancias para apoyar competiciones,
        comprar materiales y otras actividades relacionadas con la WCA.
      '3': >-
        Puedes comprar nuestra mercadería por todoel mundo - con tiendas
        directas en Europa, América e India ¡y más que abrirán próximamente!
