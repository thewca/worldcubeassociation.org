  merch:
    title: Mercadería WCA
    paragraphs:
      '1': >-
        ¡La WCA tiene productos exclusivos disponibles para comprar! Desde
        camisetas, camperas, pegatinas, mats, mochilas, y más. Nuestros diseños
        se actualizan continuamente incluyendo el clásico logo de la WCA,
        productos de los Campeonatos Mundiales y diseños de los récords
