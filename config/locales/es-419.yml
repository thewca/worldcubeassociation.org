  about_regulations:
    title: Sobre el Reglamento
    panel1:
      title: Reglamento
      content1_html: >-
        Todas las competiciones deber seguir el <a
        href="/regulations/">Reglamento de la WCA</a>. Es importante que los
        competidores lean este reglamento antes de presentarse a su primera
        competición.
      content2_html: >-
        Decisiones importantes sobre incidentes que sucedieron en competiciones
        y han sido resueltos por el Comité Reglamentario WCA se pueden encontrar
        en los <a href="/incidents">Registros de Incidentes</a>.
    panel2:
      title: Traducciones
      content1_html: >-
        El reglamento de la WCA no está disponible solo en inglés: ha sido
        traducido a varios idiomas por miembros de la WCA: <a
        href="/regulations/translations/">Traducciones</a>.
      content2_html: >-
        <strong>Importante</strong>: Aunque las traducciones son de mucha ayuda,
        no son oficiales. En competiciones, la versión en inglés del Reglamento
        de la WCA es vinculante.
    panel3:
      title: Preguntas Frecuentes sobre el Reglamento
      content1_html: >-
        La <a href="/faq">sección de preguntas frecuentes</a> responde a
        múltiples preguntas frecuentes sobre el Reglamento de la WCA.
    panel4:
      title: Manual para organizadores
      content1_html: >-
        Si estás interesado en organizar una competición o ya has planeado
        organizar una, por favor, lee el <a
        href="https://documents.worldcubeassociation.org/edudoc/organizer-handbook/organizer-handbook.pdf">Manual
        para organizadores</a>.
      content2_html: >-
        Este documento contiene información importante y debería ser leído por
        todos los organizadores de competiciones.
  regulations_translations:
    title: 'Reglamento WCA: Traducciones'
    paragraph1: >-
      Si hablas un idioma distinto del inglés, puede que encuentres estas
      traducciones de utilidad.
    paragraph2: >-
      Por favor, ten en cuenta que las traducciones no son oficiales aunque se
      muestren en la web de la WCA: no incorporan ninguna garantía. Si hay
      alguna diferencia entre una traducción y la versión (actual oficial) en
      inglés, la versión en inglés debe prevalecer.
