  faq:
    title: Pertanyaan yang Sering Diajukan
    contact_html: 'Jika tidak ada jawaban yang membantu, harap %{contact_us}!'
    contact_us: kontak kami
    search_for_competition: 'Cari kompetisi di sini:'
    already_logged_in: Anda sudah masuk dengan akun WCA.
    create_an_account: 'Anda dapat membuat akun %{here}.'
    claim_your_wca_id: 'Anda dapat klaim ID WCA Anda %{here}.'
    create_an_account_and_claim: >-
      Buat akun %{here}. Setelah Anda masuk dengan akun baru, Anda akan
      ditanyakan untuk klaim ID WCA Anda.
    answers:
      '1':
        title: Bagaimana cara saya mendapatkan ID WCA dan profil WCA?
        content:
          '1': >-
            Jika Anda belum pernah berkompetisi sebelumnya, silakan ikut sebuah
            <a href='/competitions'>kompetisi</a>! ID WCA dan profil WCA akan
            dibuat setelah hasil kompetisi pertama Anda telah dipublikasi.
      '2':
        title: Bagaimana saya dapat mencari kompetisi WCA?
        content:
          '1': Lihat daftar <a href='/competitions'>kompetisi</a> kami.
      '3':
        title: >-
          Bagaimana cara saya daftar sebuah kompetisi? Siapa yang dapat saya
          hubungi jika saya punya masalah dalam mendaftar kompetisi?
        content:
          '1': >-
            Beberapa kompetisi dibuat pendaftarannya pada situs web WCA di sini,
            tetapi beberapa juga menggunakan sistem sendiri. Anda perlu kontak
            panitia sebuah kompetisi di mana Anda ingin berkompetisi untuk
            menanyakan detail lebih lanjut. %{comp_search_form}
      '4':
        title: >-
          Apa syarat untuk datang ke kompetisi WCA? Apa yang perlu saya ketahui
          sebelum datang ke kompetisi WCA?
        content:
          '1': >-
            Secara umum, tidak banyak syarat untuk berpartisipasi di dalam
            kompetisi WCA. Namun, semua partisipan kompetisi harus memiliki
            pemahaman yang baik tentang <a
            href='https://www.worldcubeassociation.org/regulations/'>Regulasi
            WCA</a>. Jika Bahasa Inggris bukan merupakan bahasa utama Anda dan
            Anda kesulitan untuk mengerti regulasi tersebut, baca <a
            href='https://www.worldcubeassociation.org/regulations/translations/'>Terjemahannya</a>.
      '5':
        title: Bagaimana cara kampung halaman saya memiliki kompetisi WCA?
        content:
          '1': >-
            Jika Anda tertarik dalam mengurus kompetisi, sangat disarankan untuk
            datang minimal satu atau dua kompetisi sebagai kompetitor untuk
            mempelajari pengalaman menjadi panitia.
          '2': >-
            Kompetisi WCA harus mengikuti <a target='_blank'
            href='https://www.worldcubeassociation.org/regulations/'>Regulasi
            WCA</a>. Tim panitia tidak harus tahu seluruh regulasi yang ada,
            namun, pengetahuan mendalam tentang dasar-dasar regulasi dapat
            membantu dalam mengurus kompetisi.
          '3': >-
            Setelah itu, tim panitia harus kontak <a target='_blank'
            href='https://www.worldcubeassociation.org/delegates'>Delegasi
            WCA</a> terdekat. Pengawasan dari Delegasi WCA dibutuhkan untuk
            membuat kompetisi didukung secara resmi oleh WCA. Delegasi WCA akan
            membantu memandu panitia tentang bagaimana cara sukses mengadakan
            kompetisi.
          '4': >-
            Lihat <a target='_blank'
            href='https://documents.worldcubeassociation.org/edudoc/organizer-handbook/organizer-handbook.pdf'>Pedoman
            Panitia Kompetisi WCA</a> untuk mengetahui informasi lebih lanjut.
      '6':
        title: Apa fungsi akun WCA? Apa perbedaan antara akun WCA dan profil 
          WCA?
        content:
          '1': >-
            Anda terhubung dengan ID WCA setelah hasil kompetisi resmi WCA
            pertama Anda telah dipublikasikan.
          '2': >-
            Akun WCA mengizinkan Anda untuk membuktikan kepada kami siapa Anda
            sebenarnya. Akun ini mengizinkan Anda untuk menambahkan gambar ke
            profil WCA Anda, dan mengizinkan Anda untuk mendaftar kompetisi. Hal
            ini dapat mencegah orang-orang yang menganggap dirinya sebagai diri
            Anda.
          '3': '%{current_user_status}'
      '7':
        title: Bagaimana saya mengubah foto profil saya?
        content:
          '1': >-
            Pertama, Anda harus <a
            href='#how-do-i-connect-my-wca-account-with-my-wca-id'>membuat akun
            WCA dan hubungkan ke ID WCA Anda.</a>
          '2': >-
            Setelah Anda menghubungkan akun WCA Anda dengan ID WCA Anda, silakan
            menuju <a href='%{profile_edit_path}'>halaman sunting profil</a>
            ANda untuk mengubah foto profil Anda.
      '8':
        title: Bagaimana saya menghubungkan akun WCA saya dengan ID WCA saya?
        content:
          '1': '%{current_user_claim}'
      '9':
        title: >-
          Saya telah terdaftar dalam kompetisi dan ingin menambah cabang yang
          diikuti, apa yang harus saya lakukan? Bisakah saya membawa pendamping?
        content:
          '1': >-
            Silakan kontak panitia. Anda dapat menemukan informasi kontak pada
            situs web kompetisi. Jika Anda tidak yakin di mana Anda dapat
            menemukannya, cek <a href='/competitions'>daftar kompetisi</a>.
      results:
        title: Kapan hasil kompetisi WCA diunggah ke situs web WCA?
        content:
          '1': >-
            Setelah kompetisi berakhir, Delegasi WCA harus memeriksa ulang semua
            kertas hasil dan data orang untuk menghilangkan kesalahan yang
            mungkin terjadi. Setelah hal ini dilakukan, hasil akan dikirim ke
            Tim Hasil WCA (WRT) yang berkewajiban untuk mengunggah hasil
            kompetisi dan menjaga basis data WCA. Pada akhirnya, WRT mengunggah
            hasil ke basis data WCA sesegera mungkin.
          '2': >-
            Tergantung besarnya kompetisi dan jadwal pribadi Delegasi, semua hal
            ini dapat memakan waktu hanya sehari atau sampai seminggu. Harap
            bersabar.
          '3': >-
            Sebagai tambahan, jika Anda telah menghubungkan akun WCA Anda dengan
            ID WCA Anda (lihat di bawah), Anda dapat mengaktifkan notifikasi
            email tentang pengajuan hasil <a href='%{preferences_edit_path}'>di
            sini</a>.
      regulations1:
        title: Apakah puzzle saya legal untuk dipakai di kompetisi?
        content:
          '1': >-
            Anda dapat menemukan regulasi terkait puzzle dalam <a
            href='https://www.worldcubeassociation.org/regulations/#3'>Pasal
            3</a>. Semua puzzle harus disetujui oleh Delegate WCA. Jika Anda
            tidak yakin, harap bertanya Delegasi kompetisi Anda. Agar lebih
            aman, Anda perlu membawa puzzle cadangan jika Anda tidak
            diperbolehkan memakai puzzle tersebut.
      regulations2:
        title: Bolehkah saya menggunakan puzzle bermagnet dalam kompetisi resmi 
          WCA?
        content:
          '1': >-
            Anda boleh menggunakan puzzle bermagnet selama puzzle tersebut
            memenuhi <a target='_blank'
            href='https://www.worldcubeassociation.org/regulations/'>Regulasi
            WCA</a>. Harap beri perhatian khusus pada <a
            href='https://www.worldcubeassociation.org/regulations/#3h'>Regulasi
            3h</a>.
      regulations3:
        title: >-
          Saya kehilangan Center Cap atau Piece puzzle saya. Apakah saya tetap
          dapat memakainya?
        content:
          '1': >-
            Anda tidak boleh memakai puzzle ini. Puzzle harus bebas dari
            kerusakan atau perbedaan apapun yang secara signifikan dapat
            dibedakan dengan Piece yang sejenis (lihat <a
            href='https://www.worldcubeassociation.org/regulations/#3j'>Regulasi
            3j</a>).
      regulations4:
        title: Pada umur berapa saya bisa mendaftar kompetisi WCA?
        content:
          '1': >-
            Tidak ada batasan umur. Namun, Anda perlu konsultasi dengan orang
            tua Anda sebelum mendaftar (lihat <a
            href='https://www.worldcubeassociation.org/regulations/#2b'>Regulasi
            2b</a>).
  about:
    title: Tentang WCA
    mission_statement: >-
      Misi kami adalah untuk membuat lebih banyak kompetisi pada lebih banyak
      negara dengan lebih banyak orang dan lebih banyak kegembiraan, dengan
      ketentuan yang adil dan setara.
    mission_footer: Pernyataan Misi WCA
    who_we_are_title: Tentang kami
    who_we_are_content_html: >-
      <p>World Cube Association mengendalikan kompetisi puzzle mekanik yang
      dilakukan dengan memutar sebagian potongan puzzle, yang umumnya dikenal
      sebagai 'twisty puzzle'. Twisty puzzle yang paling terkenal adalah Kubus
      Rubik yang diciptakan oleh profesor Rubik dari Hungaria. Sebagian twisty
      puzzle dipilih sebagai cabang resmi WCA.</p> <p>Seiring berkembangnya WCA
      pada dekade belakangan ini, lebih dari 200 ribu orang telah berkompetisi
      pada kompetisi kami. Terlepas dari perkembangan ini, kami tetap menjadi
      organisasi yang hampir sepenuhnya digerakkan oleh sukarelawan, dari
      organisasi lokal sampai Delegasi WCA bahkan sampai Dewan WCA. Kami sangat
      berterima kasih kepada semua yang telah meluangkan waktunya agar WCA dapat
      tetap berjalan. Dengan bantuan finansial lebih, kami berharap agar dapat
      meningkatkan profesionalisme kami ke tingkat yang jauh lebih baik pada
      kompetisi kami seiring lebih banyak diadakannya acara di seluruh
      dunia.</p>
    spirit: >-
      Semangat kami adalah bahwa orang-orang dari seluruh dunia bersenang-senang
      bersama dalam suasana yang bersahabat, saling membantu dan berperilaku
      sportif.
    spirit_footer: Semangat WCA
    our_goals_title: Tujuan kami
    our_goals_content_html: >-
      <p>World Cube Association ingin memberikan kesempatan bagi pemuda-pemuda
      di seluruh dunia agar dapat menjadi anggota atau memimpin komunitas
      melalui peningkatan jangkauan kompetisi 'twisty puzzle'. Kami yakin bahwa
      pengalaman berkompetisi dan berkomunitas dapat meningkatkan kesempatan
      bagi pemuda-pemuda yang berpartisipasi dan mengenalkan cabang puzzle
      kepada kelompok orang baru dapat menguatkan keseluruhan komunitas kami.
      Dokumen yang berisi Visi dan Strategi Dewan untuk WCA dapat dilihat <a
      href="https://documents.worldcubeassociation.org/documents/WCA_Strategic_Plan.pdf">di
      sini</a>.</p>
    whats_next_title: Apa selanjutnya untuk WCA?
    whats_next_content_html: >-
      <p>World Cube Association telah memiliki lebih dari 200 ribu kompetitor
      unik dari 158 wilayah yang berbeda dan kami tidak berencana untuk berhenti
      dalam waktu dekat. Komunitas cubing telah berkembang secara stabil sejak
      WCA terbentuk pada 2004 dan kami ingin mendorong hal ini sampai masa
      mendatang dengan memperbanyak jangkauan kompetisi pada wilayah-wilayah
      baru. Di masa mendatang, kami berharap untuk lebih mendukung komunitas
      kami melalui kolaborasi dan menjangkau orang-orang yang tertarik dengan
      puzzle.</p>
    world_championship_title: Kejuaraan Dunia
    world_championship_content_html: >-
      <p>Setiap dua tahun, kami mengadakan kompetisi yang tujuan utamanya untuk
      menentukan juara dunia. Acara-acara ini membutuhkan perencanaan yang
      sangat matang oleh sukarelawan, begitu juga dengan komitmen finansial yang
      besar untuk memesan venue dan menyiapkan hal-hal yang dibutuhkan.</p>
    contributing_title: Membuat kontribusi
    contributing_content_html: >-
      Anda dapat berdonasi dengan kartu kredit menggunakan Guidestar
      %{here_credit}, atau Paypal %{here_paypal}. Jika Anda lebih memilih untuk
      menulis cek, Anda dapat menuliskannya kepada:
    tax_deductible_note: Donasi merupakan objek pajak di Amerika Serikat.
    other_help_title: Cara lain untuk membantu
    other_help_content_html: >-
      <p>Jika Anda yakin bahwa Anda dapat berkontribusi secara non-finansial
      pada World Cube Association, kami ingin sekali mendengarnya dari Anda!
      Harap kontak kami melalui <a
      href="mailto:communication@worldcubeassociation.org">communication@worldcubeassociation.org</a>.</p>
    donation_banner:
      content: >-
        World Cube Association adalah organisasi bebas pajak 501(c)(3). Sebagai
        organisasi 100% nonprofit yang digerakkan secara sukarela, kami
        menyambut donasi Anda untuk membantu mencapai visi kami dalam membuat
        kompetisi yang lebih menyenangkan di seluruh dunia.
      donate_credit: Donasi dengan kartu kredit
      donate_paypal: Donasi melalui Paypal
      donate_other: Cara lain untuk berdonasi
