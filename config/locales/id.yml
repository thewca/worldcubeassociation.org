        membuat biaya, dan menyampaikan pengembalian dana langsung pada akun
        Stripe Anda.
      stripe_disconnect_info: >-
        Kompetisi ini diatur untuk menerima pembayaran melalui Stripe. Jika Anda
        ingin memutuskan akun Stripe Anda, Anda harus melakukannya dari
        dashboard Stripe terlebih dahulu (pranala di bawah). Catat bahwa hal ini
        akan mencabut akses ke seluruh kompetisi yang menggunakan akun tersebut.
        Sebelum akun Stripe baru dapat dihubungkan, Delegasi kompetisi harus
        menghubungi WCAT untuk menghapus entri tersebut.
      stripe_disconnect_warning: >-
        Perlu diingat bahwa memutuskan akun hanya boleh dilakukan pada situasi
        pengecualian, seperti akun saat ini tidak dapat menerima pembayaran.
      paypal_payment_info: >-
        Akun bisnis PayPal dibutuhkan untuk menerima pembayaran PayPal via laman
        kompetisi. Jika Anda belum punya akun bisnis PayPal, Anda masih dapat
        mengklik tombol di bawah dan Anda akan dipandu untuk melanjutkan proses
        tersebut.
      paypal_connect_warning: >-
        Menghubungkan akun PayPal Anda memberikan situs web WCA kemampuan untuk
        meneruskan pembayaran kepada Anda, dan menyampaikan pengembalian dana
        langsung pada akun PayPal Anda.
      paypal_disconnect_info: >-
        Kompetisi ini diatur untuk menerima pembayaran melalui PayPal. Catat
        bahwa dengan mengklik putuskan di sini tidak akan menghapus izin yang
        sudah Anda berikan kepada WCA - hal ini harus dilakukan dari akun PayPal
        Anda.
      paypal_disconnect_warning: >-
        Perlu diingat bahwa perubahan akun ini hanya boleh dilakukan pada
        situasi pengecualian, seperti akun saat ini tidak dapat menerima
        pembayaran.
