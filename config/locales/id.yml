      teams_committees: Tim dan Komite
      wst_admin:
        name: Admin perangkat lunak
      delegates_html: >-
        <p><strong>Delegasi WCA</strong> adalah sebuah peran dalam Gerakan WCA
        dan ditulis pada Regulasi WCA. Tugas utama Delegasi adalah untuk
        memantau kompetisi atas nama WCA. Delegasi WCA bertanggung jawab dalam
        memastikan seluruh kompetisi WCA dijalankan sesuai misi, regulasi, dan
        semangat WCA. WCA membedakan <strong>Delegasi Senior</strong>,
        <strong>Delegasi Regional</strong>, <strong>Delegasi Tetap</strong>,
        <strong>Delegasi Junior</strong>, dan <strong>Delegasi
        Pelatihan</strong>%{see_link}.</p> <p>Sebagai tugas tambahan Delegasi
        WCA, Delegasi Senior atau Delegasi Regional bertanggung jawab dalam
        mengatur Delegasi WCA di dalam wilayahnya dan dapat dihubungi oleh
        komunitas untuk keperluan regional.</p> <p>Delegasi baru tertulis
        sebagai Delegasi Junior saat pertama kali muncul dalam daftar; setelah
        itu mereka diminta untuk menunjukkan keahlian dalam mengatur Kompetisi
        WCA sebelum diangkat sebagai Delegasi WCA.</p> <p>Delegasi Pelatihan
        dilatih untuk menjadi Delegasi WCA dan hanya dapat mengawasi kompetisi
        yang didatangi oleh Delegasi WCA.</p>
      see_link_html: '(lihat %{link})'
      members_html: >-
        Seluruh kompetitor diangkat menjadi <strong>anggota</strong> WCA secara
        otomatis dalam kompetisi WCA pertama mereka.
