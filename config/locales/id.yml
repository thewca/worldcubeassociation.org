  merch:
    title: Merchandise WCA
    paragraphs:
      '1': >-
        WCA punya merchandise eksklusif yang tersedia untuk dibeli! Dari Kaos,
        Hoodie, Stiker, Stackmat, Ransel, dan banyak lagi! Desain kami
        diperbarui secara konstan termasuk logo WCA klasik, merchandise resmi
        Kejuaraan Dunia, dan desain Rekor Dunia.
      '2': >-
        Membeli merchandise WCA melalui toko kami adalah salah satu cara terbaik
        untuk mendukung WCA - organisasi non-profit yang digerakkan secara
        sukarela. Kami menggunakan semua keuntungan dari merchandise ini untuk
        membantu mendanai kejuaraan, perlengkapan, dan kegiatan WCA lainnya.
      '3': >-
        Anda dapat membeli merchandise kami dari seluruh penjuru dunia -- dengan
        toko-toko langsung di Eropa, Amerika dan India, dan banyak lagi yang
        akan datang!
  database:
    results_export:
      heading: Ekspor Hasil WCA
      description: >-
        Pada laman ini kami menawarkan hasil WCA untuk diunduh dalam beberapa
        format sehingga Anda dapat menggunakannya/menganalisanya secara luas.
        Kami akan memperbaruinya sesering mungkin setiap akhir pekan kompetisi
        di mana hasil telah difinalisasi. Berkas-berkas tersebut diberi nomor
        dan tanggal sehingga Anda dapat melihat apakah Anda sudah memiliki versi
        terbaru.
      permalink: permalink
      file_formats:
        sql: 'Perintah SQL, untuk mengimpor ke dalam basis data SQL.'
        tsv: >-
          Tab-separated value, untuk spreadsheet seperti OpenOffice.org, Excel,
          dsb.
      hint_readme_html: >-
        Berkas %{readme_filename} yang tersedia memuat syarat penggunaan dan
        penjelasan umum (dalam Bahasa Inggris, tidak diterjemahkan):
    developer_export:
