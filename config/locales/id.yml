          Deskripsi keseluruhan dari insiden dan keputusannya untuk ditampilkan
          secara publik. Harap isi dalam Bahasa Inggris.
      user:
        dob: Isi tanggal lahir kompetitor dengan format YYYY-MM-DD.
        name: >-
          Isi nama lengkap kompetitor dengan benar, contohnya <strong>Stefan
          Pochmann</strong>. Tidak sembarangan seperti <strong>s
          pochman</strong>.<br/>Nama tengah (lengkap atau disingkat) tidak
          diharuskan.
        pending_avatar: >-
          Setelah mengunggah avatar baru, Anda harus menunggu Tim Hasil WCA
          untuk disetujui.
        registration_notifications_enabled: >-
          Hal ini hanya berlaku untuk kompetisi yang Anda selenggarakan atau
          delegasikan, dan dapat dibatalkan dalam basis per-kompetisi.
        receive_delegate_reports: >-
          Jika Anda adalah Delegasi Pelatihan, Delegasi Junior, Delegasi Senior,
          atau Anggota WRC atau WQAC, Anda akan mendapat Laporan Delegasi secara
          default. Catatan: perubahan mungkin akan memakan waktu sampai dengan
          satu jam.
        otp_attempt: >-
          Cek aplikasi mobile Anda untuk one-time password (OTP), atau isi
          dengan kode pemulihan Anda.
      dob_contact:
        dob: Tanggal lahir Anda dengan format YYYY-MM-DD
        document: >-
          Untuk membuktikan identitas dan tanggal lahir Anda kepada kami, Anda
          harus menyertakan gambar dari dokumen resmi apapun (kartu identitas,
          surat izin mengemudi, kartu pelajar, paspor, akta kelahiran, dll.) di
          mana nama dan tanggal lahir Anda terlihat dan dapat dimengerti bagi
          orang yang berbahasa Inggris (atau kontak Delegasi WCA terdekat Anda
          jika Anda tidak mempunyai dokumen yang dimaksud). Pada identifikasi
          tersebut kami membutuhkan setidaknya nama dan tanggal lahir Anda; Anda
          diperbolehkan untuk menyensor data pribadi yang lain pada identifikasi
          tersebut.
      post:
        body: >-
          Gunakan tag &lt;!-- break --&gt; untuk memperlihatkan pratinjau pada
          beranda. Postingan apapun pada beranda akan menampilkan semua teks
          sebelum tag pembagi ini. Postingan yang sebenarnya akan memperlihatkan
          seluruh isi postingan.
        show_on_homepage: >-
          Hati-hati! Hal ini tidak aman untuk data pribadi. Hal ini hanya untuk
          mencegah kekacauan pada beranda. Postingan yang tidak ditampilkan pada
          beranda masih dapat diakses oleh publik lewat tautan permanen atau
          tag.
      delegate_report:
        schedule_url: >-
          Tautan lengkap jadwal (contoh:
          https://www.cubingusa.com/usnationals2016/schedule.php)
        equipment: >-
          Banyak dan tipe timer dan display yang dipakai pada kompetisi. Harap
          hapus perlengkapan yang tidak dipakai.
        venue: >-
          Poin-poin yang tertulis di atas hanyalah sebagai pedoman untuk laporan
          lengkap. Gunakan secara bijaksana pada hal yang menurut Anda cocok.
          Harap hapus bagian yang tidak dipakai!
        organization: >-
          Poin-poin yang tertulis di atas hanyalah sebagai pedoman untuk laporan
          lengkap. Gunakan secara bijaksana pada hal yang menurut Anda cocok.
          Harap hapus bagian yang tidak dipakai!
        incidents: >-
          Harap laporkan semua insiden yang bukan merupakan kasus biasa. Beri
          nomor urut pada insiden, dimulai dari 1., sehingga Delegasi lain dapat
          memberikan referensi pada komentar hanya dengan menuliskan nomor.
          Meskipun semua kasus terlihat biasa, tulis kasus yang setidaknya perlu
          ditindaklanjuti. Centang kotak di bawah jika Anda menginginkan umpan
          balik.
        wrc_incidents: >-
          Daftar angka yang mereferensikan insiden yang Anda inginkan untuk
          diberi saran oleh WRC.
        wdc_incidents: >-
          Daftar angka yang mereferensikan insiden yang Anda inginkan untuk
          diberi saran oleh WDC.
        remarks: >-
          Berisi tulisan tentang detail lainnya yang ingin Anda bagikan (contoh:
          peningkatan/penurunan minat komunitas, rencana ke depan untuk wilayah
          ini). Jika Anda menyadari bahwa ada sesuatu yang belum disampaikan
          karena ingin menyampaikannya secara singkat, jangan ragu untuk
          menuliskannya di dalam komentar.
      competition_tab:
        name: 'Contoh: Perjalanan, Pembayaran, Hadiah, Akomodasi'
      person:
      registration:
        administrative_notes: >-
          Catatan tambahan disimpan sebagai bagian untuk mengatur pendaftaran
