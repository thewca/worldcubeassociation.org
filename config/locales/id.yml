  page:
    translators:
      title: Penerjemah
    officers_and_board:
      title: Pengurus & Dewan WCA
      officers_description: >-
        Pengurus WCA menangani tugas yang berkaitan dengan status non-profit
        WCA. Pengurus ini dipilih oleh Dewan WCA. Direktur Eksekutif adalah
        Direktur Utama WCA, Ketua Umum memimpin semua rapat Dewan, Sekretaris
        memelihara dokumen organisasi, dan Bendahara mengelola masalah keuangan
        WCA.
      board_description: >-
        Dewan WCA bertanggung jawab dalam memimpin organisasi secara
        keseluruhan, dan memenuhi segala kewajiban yang tidak dapat dipenuhi
        oleh Tim, Komite, atau Majelis lain.
    teams_committees_councils:
      title: 'Tim, Komite, dan Majelis WCA'
      description: >-
        Tim dan komite WCA adalah bagian yang penting dari organisasi dan
        menjalankan tugas sehari-hari yang dibutuhkan agar organisasi tetap
        berjalan. Komite-komite ini dipilih oleh anggota komunitas WCA, termasuk
        Delegasi WCA dan kompetitor. Setiap tim memiliki ketua yang berperan
        untuk memastikan bahwa tim bekerja dengan semestinya dan memandu anggota
        tim lain. Majelis adalah tipe tim khusus yang berperan sebagai penasihat
        bagi Dewan WCA dan dipilih oleh anggota komunitas, bukan anggota Staf
        WCA. Ketika komite, tim, atau majelis membuka lowongan, informasi
        tentang cara melamar akan diposting pada halaman depan.
      groups_name:
        wat: Tim Arsip WCA
        wct: Tim Komunikasi WCA
        wcat: Tim Pengumuman Kompetisi WCA
        wdc: Komite Disiplin WCA
        wec: Komite Etik WCA
        weat: Tim Asisten Eksekutif WCA
        wfc: Komite Keuangan WCA
        wmt: Tim Marketing WCA
        wqac: Komite Penjaminan Mutu WCA
        wrc: Komite Regulasi WCA
        wrt: Tim Hasil WCA
        wst: Tim Perangkat Lunak WCA
        wsot: Tim Organisasi Olahraga WCA
        wac: Majelis Penasihat WCA
      groups_description:
        wat: >-
          WAT bertanggung jawab dalam mengelola pengembangan dan pemeliharaan
          arsip historis WCA. Mereka mendokumentasikan berbagai peristiwa
          penting dalam speedcubing dan pencapaian penting WCA untuk disajikan
          sebagai bagian dari linimasa WCA yang lebih luas, untuk melestarikan
          warisan WCA dalam speedcubing.
        wct: >-
          Tim Komunikasi WCA (WCT) berperan untuk mengawasi dan mendukung
          komunikasi WCA dengan Komunitas dan publik umum. Komunikasi WCA harus
          berkontribusi pada Tujuan WCA dan mendukung budaya positif secara umum
          seperti keramahan, transparansi, inklusivitas, keterbukaan, dan
          ketanggapan.
        wcat: >-
          Tim Pengumuman Kompetisi WCA (WCAT) berperan untuk menyetujui dan
          mengumumkan Kompetisi WCA yang diajukan oleh delegasi, dan memastikan
          pengumuman tersebut mematuhi standar kualitas WCA. Tim ini juga
          bertanggung jawab dalam menjaga protokol pengajuan kompetisi yang
          tepat dari dokumen-dokumen seperti Kebijakan Kebutuhan Kompetisi WCA.
          WCAT TIDAK bertanggung jawab dalam kepengurusan dan delegasi setiap
          kompetisi.
        wdc: >-
          Komite Disiplin WCA (WDC) melakukan investigasi independen terkait
          Speedcuber Terdaftar dan insiden dalam Kompetisi WCA atau pada
          platform online resmi WCA. Insiden-insiden ini merupakan dugaan
          pelanggaran terhadap Semangat, Pedoman Perilaku, dan/atau Regulasi
          WCA.
        wec: >-
          Komite ini berperan dalam memastikan semua prosedur yang diikuti oleh
          Staf WCA mematuhi Pedoman Perilaku, dan melakukan investigasi
          independen jika perilaku dari anggota-anggota ini tidak sesuai dengan
          Pedoman. WEC adalah pihak yang dipercaya oleh Speedcuber Terdaftar
          yang dapat melaporkan masalah dan meminta penyelidikan. Komite ini
          juga berfungsi sebagai dewan banding jika ada pihak yang tidak setuju
          dengan keputusan yang dibuat oleh Komite Disiplin WCA.
        weat: >-
          Tim ini bertanggung jawab dalam melaksanakan tugas administratif Dewan
          Direktur WCA.
        wfc: >-
          Komite ini bertanggung jawab dalam mengelola keuangan WCA secara
          keseluruhan, termasuk anggaran, laporan, analisis, pembukuan, dan
          pelaporan pajak. Komite ini juga mengelola sumber pemasukan terbesar
          WCA, yaitu Sistem Iuran WCA, serta berbagai program pendanaan yang
          memberikan dukungan kepada komunitas lokal di berbagai tahap
          pembangunan, termasuk Pendanaan Perjalanan, Pendanaan Peralatan, dan
          Dukungan Organisasi Regional.
        wmt: >-
          Tim ini bertanggung jawab dalam mengembangkan dan mengelola Brand WCA,
          mencari sponsor, mendukung distribusi Peralatan Kompetisi WCA, dan
          memasarkan Merchandise WCA.
        wqac: >-
          Komite ini berperan dalam mendukung dan mempromosikan peningkatan
          kualitas secara berkala di dalam WCA, dan juga penerapan standar
          kualitas di seluruh dunia untuk memastikan kualitas tinggi yang
          konsisten dari proses, Staf WCA, Organisasi Regional, Panitia
          Kompetisi, dan Staf Kompetisi.
        wrc: >-
          WRC menangani seluruh masalah yang berhubungan dengan penerapan,
          peningkatan, dan pengembangan Regulasi WCA. Mereka membantu Delegasi
          WCA dalam berbagai masalah prosedur yang terjadi pada kompetisi dan
          memberi keputusan dalam insiden yang belum terselesaikan dan belum
          dibahas.
        wrt: >-
          WRT bertanggung jawab dalam mengelola seluruh data dalam basis data
          WCA, khususnya yang terpenting hasil kompetisi dan data orang.
        wst: >-
          Tim ini bertanggung jawab dalam mengelola perangkat lunak WCA (situs
          web, pengacak, buku kerja, kakas admin).
        wsot: >-
          Tim ini berperan dalam mengawasi dan mendukung pengakuan WCA sebagai
          organisasi olahraga internasional.
        wac: >-
          WCA bertanggung jawab dalam menjaga umpan balik dan komunikasi antara
          Komunitas WCA dengan Staf WCA. Mereka memelihara Forum WCA dan
          merangkum survei serta berupaya untuk meningkatkan jangkauan ke
          seluruh komunitas di seluruh dunia.
