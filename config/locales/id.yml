  incidents_log:
    i18n_disclaimer: >-
      Harap dicatat bahwa bagian insiden hanya tersedia dalam Bahasa Inggris,
      konten di bawah ini tidak diterjemahkan.
    incident: 'Insiden:'
  about_regulations:
    title: Tentang Regulasi
    panel1:
      title: Regulasi
      content1_html: >-
        Seluruh kompetisi harus mematuhi <a href="/regulations/">Regulasi
        WCA</a>. Penting bagi kompetitor untuk membaca regulasi ini sebelum
        mengikuti kompetisi pertama mereka.
      content2_html: >-
        Regulasi WCA dilengkapi dengan <a
        href="/regulations/guidelines.html">Pedoman WCA</a> yang berisi
        klarfikasi dan penjelasan tambahan.
      content3_html: >-
        Keputusan penting tentang insiden yang terjadi di kompetisi yang telah
        diselesaikan oleh Komite Regulasi WCA dapat ditemukan di <a
        href="/incidents">Log Insiden</a>.
    panel2:
      title: Terjemahan
      content1_html: >-
        Regulasi WCA tidak hanya tersedia dalam Bahasa Inggris, anggota WCA
        telah menerjemahkannya ke dalam beberapa bahasa: <a
        href="/regulations/translations/">Terjemahan</a>.
      content2_html: >-
        <strong>Penting</strong>: Meskipun terjemahan sangat membantu,
        terjemahan-terjemahan ini tidak resmi. Dalam kompetisi, Regulasi WCA
        versi Bahasa Inggrislah yang dipakai.
    panel3:
      title: FAQ Regulasi
      content1_html: >-
        <a href="/faq">Bagian FAQ</a> menjawab beberapa pertanyaan yang sering
        diajukan terkait Regulasi WCA.
    panel4:
      title: Pedoman Panitia
      content1_html: >-
        Jika Anda tertarik untuk mengurus kompetisi atau sudah memiliki rencana
        untuk mengurus kompetisi, harap baca <a
        href="https://documents.worldcubeassociation.org/edudoc/organizer-handbook/organizer-handbook.pdf">Pedoman
        Panitia</a> kami.
      content2_html: >-
        Dokumen ini berisi informasi penting dan harus dibaca oleh setiap
        panitia kompetisi.
  regulations_translations:
    title: 'Regulasi dan Pedoman WCA: Terjemahan'
    paragraph1: >-
      Jika Anda berbicara dengan bahasa selain bahasa Inggris, terjemahan ini
      mungkin berguna bagi Anda.
    paragraph2: >-
      Catat bahwa terjemahan tidak memiliki status resmi, meskipun terjemahan
      disediakan pada situs web WCA: kebenaran terjemahan tidak dijamin. Jika
      terdapat perbedaan antara terjemahan dan versi bahasa Inggris (resmi
      terbaru), versi bahasa Inggris yang harus dipakai.
    translations: Terjemahan
    current: Terbaru
    old: Lawas
    table_elements:
      version: Versi
      language: Bahasa
    translating: Menerjemahakan Regulasi
    paragraph3_html: >-
      Jika Anda tertarik untuk menambahkan/memperbarui terjemahan, lihat <a
      href="https://github.com/thewca/wca-regulations-translations#translation-instructions">panduan
      pada repositori Github untuk terjemahan</a>.
  media:
