        бүкіл әлемдегі куберлердің мазмұнын жариялаймыз.
      paragraph2: >-
        Егер сіз жариялағыңыз келетін жоғары сапалы фотосуреттер немесе бейнелер
        болса, төмендегі батырманы басып, форманы толтырыңыз! Мазмұнды
        орналастыру үшін Сіз оның иесі болуыңыз керек және WCA-ға оны жариялауға
        рұқсат беруіңіз керек. Мазмұнның көп мөлшерін алатындықтан, біз бәрін
        орналастыра алмаймыз, бірақ мазмұнды жариялау мүмкіндігін арттыруға
        арналған бірнеше кеңестер бар:
      photo_quality: >-
        Фото/Бейне сапасы жеткілікті жақсы екеніне көз жеткізіңіз. Бұл кәсіби
        жұмыс болуы міндетті емес, бірақ сапасы фото немесе бейнеден алшақтамауы
        керек.
      photo_interest: >-
        Мазмұнды кең аудиторияға қызықты етуге тырысыңыз. Бірнеше адамға қызықты
        мазмұн бұл жерде орын жоқ.
      wca_related: >-
        WCA-ға қатысты фотосуреттер мен бейнелерді жариялаңыз, өйткені бұл
        біздің есептік жазбамыз туралы! Біз куберлердің көңілді болғанын
        көргенді жақсы көреміз!
      submit_instagram_content: Instagram үшін мазмұнды жариялау
    instagram_hosting:
      title: Instagram Жүргізу
      paragraph1_html: >-
        Кейде біз қауымдастық мүшелеріне WCA-ның ресми Instagram аккаунтында
        қатысатын жарыстар туралы әңгімелер жариялауға рұқсат береміз. Егер
        сізді қызықтырса, батырманы басып, нысанды толтырыңыз. WCA байланыс тобы
        сіздің кандидатураңыз мақұлданған жағдайда барлық қажетті ақпарат
        жіберілген кезде сізбен байланысады. Егер сізде сұрақтар болса,
        өтінемін, <a
        href="https://www.worldcubeassociation.org/contact/website">бізге
        хабарласыңыз</a>.
      paragraph2: >-
        Біздің мақсатымыз-әр кубердің және әр жарыстың жеке жағымен бөлісу. Бұл
        демалыс күндері үлкен ауыртпалық болмауы керек және, әрине, сіз бірінші
        кезекте жарыстарға қатысып, содан кейін бөліскеніңізді қалаймыз.
      paragraph3: 'Жүргізушінің рөлін келесідей сипаттауға болады:'
      short_intro: 'Танысу, өзі туралы айту мен жарыстар туралы'
      venue_feel: >-
        Өткізу орны мен адамдар туралы түсінік алуға болатын бірнеше клиптер
        жасаңыз, бұл қатысушылар аймағынан және құрастыру аймағынан кішкентай
        түсірілім болуы мүмкін
      people_solving: >-
        Құрастырудың артында бірнеше адам кадрларын алуға тырысыңыз (жақсырақ
        жылдам адамдар және олардың негізгі пәндері)
      mini_interviews: >-
        Сіз адамдармен (ұйымдастырушылар, делегаттар және т.б.) жарыстар туралы
        не ойлайтыны туралы шағын сұхбат жүргізуге тырысуға болады
      pictures_too: 'Сондай-ақ, суреттерді жіберуге болады, бұл тек бейне болуы міндетті
        емес'
      paragraph4: >-
        Демалыс күндері біздің байланысымыз әдетте WhatsApp-тағы топ арқылы
        жүреді. Осы платформамен таныс екеніңізге көз жеткізіп, оны алдын-ала
        басқа байланыс арнасын ұйымдастыра алу үшін оны пайдалану мүмкіндігі жоқ
        екенін бізге хабарлаңыз.
      apply_to_host: Жүргізуге өтінім беру
    other_suggestions:
      title: Басқа ұсыныстар?
      body_html: >-
        Instagram және басқа әлеуметтік медиа платформаларға арналған басқа
        мазмұн ұсыныстарыңыз бар ма? <a
        href="https://www.worldcubeassociation.org/contact/website">Бұл туралы
        бізге айтыңыз</a>!
  footer:
    privacy: Құпиялылық
    disclaimer: Ескертпе
  api:
    manage_oauth_html: 'OAuth қолданбаларын басқару үшін %{oauth_link} адресіне өтіңіз.'
    token_request_intro: >-
      Төменде Curl көмегімен Қолданба идентификаторы, Клиент құпиясы, WCA
      электрондық поштаңыз және пароліңіз арқылы қолжетімділік токенін алу
      мысалы келтірілген:
    user_email_placeholder: YOUR_EMAIL
    user_password_placeholder: YOUR_PASSWORD
    user_info_request_intro: >-
      OAuth қолжетімділік токенін оның мерзімі аяқталғанға дейін
      авторизацияланған API сұраныстарын жасау үшін пайдалануға болады. Мысалы,
      тіркелгіңіз туралы ақпаратқа қол жеткізу үшін:
    legal_tnoodle_api_header: Заңды TNoodle нұсқасы
    login_message: Жүйеге кіріңіз
  merch:
    title: WCA тауарлары
    paragraphs:
      '1': >-
        WCA-да сатып алуға болатын эксклюзивті тауарлар бар! Футболкалардан,
        капюшондардан, стикерлерден, маттардан, рюкзактардан және т.б. Біздің
        дизайндарымыз үнемі жаңартылып отырады, соның ішінде классикалық WCA
        логотипі, ресми Әлем чемпионатының тауарлары және Әлемдік рекорд
        дизайндары бар.
      '2': >-
        WCA Merch-ті біздің дүкендеріміз арқылы сатып алу — коммерциялық емес,
        еріктілер басқаратын WCA ұйымын қолдаудың ең жақсы тәсілдерінің бірі.
        Біз тауардан түскен барлық пайданы чемпионаттарды, жабдықтарды және
        WCA-ға қатысты басқа да іс-шараларды одан әрі қаржыландыруға
        пайдаланамыз.
      '3': >-
        Сіз біздің тауарларымызды бүкіл әлем бойынша сатып ала аласыз — Еуропа,
        Америка және Үндістанда тікелей дүкендер бар және жақын арада тағы
        басқалары болады!
  database:
    results_export:
      heading: WCA нәтижелерін экспорттау
      deprecation_warning: >-
        ЖОЮ ТУРАЛЫ ЕСКЕРТПЕ: Нәтижелерді экспорттаудың %{old_version} нұсқасы
        тоқтатылды және оны қолдау %{deprecation_date} бастап тоқтатылады. Оған
        дейін %{new_version} нұсқасын қолдануға ауысыңыз.
      description: >-
        Бұл бетте біз WCA нәтижелерін бірнеше форматта жүктеп алуға ұсынамыз,
        сондықтан сіз оларды жалпы пайдалана аласыз/талдауға болады. Біз әдетте
        әрбір жарыс демалыс күндері аяқталғаннан кейін нәтижелерді жаңартамыз.
        Файлдар нөмірленген және даталанған, сондықтан сізде ең жаңа нұсқасы
        бар-жоғын көре аласыз.
      permalink: тұрақты сілтеме
      permalink_note: >-
        Ескерту: Тұрақты сілтемелер берілген нұсқадағы соңғы нәтижелерді
        экспорттайды, яғни v2 тұрақты сілтемесі соңғы v2 экспортын қайтарады,
        бірақ v3 шығарылғанда да v2-де қалады.
      file_formats:
        sql: SQL деректер қорына импорттау үшін SQL операторлары.
        tsv: >-
          OpenOffice.org, Excel және т.б. кестелер үшін беттермен бөлінген
          мәндер.
      hint_readme_html: >-
        Қоса берілген %{readme_filename} файлында пайдалану шарттары мен жалпы
        сипаттамасы бар (ағылшын тілінде, аударылмаған):
    developer_export:
      heading: WST әзірлеуші экспорты
      description_html: >-
        Бұл бетте біз WST әзірлеушісінің экспортын SQL дампы ретінде жүктеп
        алуға ұсынамыз. Толығырақ мына жерден табуға болады: %{github_link}.
      download: Жүктеу
