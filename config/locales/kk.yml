  homepage:
    learn_more: Көбірек білу
    title: World Cube Association қош келдіңіз
    latest_news: Соңғы жаңалықтар
    announcements: Хабарландырулар
    see_all_announcements: Барлық хабарландыруларды қарау
    about_us:
      title: Біз туралы
      text: >-
        World Cube Association (WCA) – бұралатын бөліктерден тұратын механикалық
        басқатырғыштар бойынша жарыстарды ұйымдастыратын ұйым. Бұл
        басқатырғыштар көбінесе "twisty puzzles" (бұралмалы басқатырғыштар) деп
        аталады.
    competitions:
      title: Жарыстар
      text_html: >-
        Өзіңізге жақын жарыстар туралы немесе олардың нәтижелері жайлы біліңіз.
        Қазіргі уақытта жарыста жүрсіз бе және нәтижелерді көргіңіз келе ме?
        %{wca_live_link} сілтемесін тексеріңіз!
    merchandise:
      title: Тауарлар
      ad_new: Жаңа
      text_html: >-
        Жаңа ресми тауарларымызды қараңыз! Біздің дүкенде түрлі киімдер, соның
        ішінде Футболкалар мен Худилер бар.
      link_title: Дүкенге сілтеме
    records:
      title: Рекордтар
      text: Барлық ресми WCA іс-шараларының қазіргі және өткен рекордтарын 
        қараңыз.
    volunteer:
      title: Ерікті
      text: >-
        Қатысыңыз! WCA әртүрлі командаларда еріктілердің бос орындары бар.
        Ерікті болу үшін спидкубер болу міндетті емес.
    faq:
      title: Жиі Қойылатын Сұрақтар
      text: >-
        Көмек қажет болса, біздің Жиі Қойылатын Сұрақтар тізіміне көз
        жүгіртіңіз. Сізде болуы мүмкін көптеген сұрақтардың жауабы сонда бар.
    contact:
      title: Байланыс
      text_html: >-
        Егер бізбен байланысқыңыз келсе, оны байланыс формасы арқылы жасай
        аласыз. WCA-ның әртүрлі процестері туралы сұрақтарыңыз болса, міндетті
        түрде біздің %{faq_link} бөлімін қарап шығыңыз!
      faq: Жиі Қойылатын Сұрақтар
      button: Мені WCA Байланыс формасына апар
    support:
      title: WCA-ны қолдаңыз
      text: >-
        World Cube Association — 501(c)(3) бөліміне сәйкес салықтан босатылған
        коммерциялық емес ұйым. Толығымен еріктілерден құралған ұйым ретінде біз
        жаһандық спидкубинг қауымдастығын қолдау және барлығына әділ әрі қызықты
        жарыс ортасын қамтамасыз ету мақсатымызды жүзеге асыру үшін қайырымдылық
        көмектеріңізді қуана қабылдаймыз.
      button: WCA-ны қалай қолдай алатыныңыз туралы көбірек біліңіз.
