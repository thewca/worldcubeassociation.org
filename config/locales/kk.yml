      wrong_attempts_for_cutoff_error: >-
        [%{round_id}] %{person_name} кесу фазасы үшін кем дегенде бір әрекетті
        жіберіп алды. Жетіспейтін әрекеттерді қосу үшін нәтижені өңдеңіз немесе
        жарыстың Оқиғаларды басқару бетінде раунд ақпаратын жаңартыңыз.
      result_over_time_limit_error: >-
        [%{round_id}] %{person_name} үшін кем дегенде бір нәтиже раунд үшін
        уақыт шегінен асып кетті, ол әр әрекет үшін %{time_limit} құрайды. Уақыт
        шегінен асып кеткен барлық шешімдерді DNF-ке өзгерту керек.
      results_over_cumulative_time_limit_error: >-
        [%{round_ids}] %{person_name} үшін нәтижелердің қосындысы жиынтық уақыт
        шегінен асып кетті, ол %{time_limit} болды.
      undefined_time_limit_warning: >-
        [%{round_id}] Бұл раунд үшін уақыт лимиті анықталмаған, уақыт лимиті
        тексерулері өткізіп жіберілді. Бұл тек 2013 жылға дейінгі жарыстар үшін
        күтілуде .
      suspicious_dnf_warning: >-
        [%{round_ids}] Раундтың жиынтық уақыты бар және %{person_name} сәтті
        шешімдеріне сүйене отырып, олардың кем дегенде бір DNF-іне өте аз уақыт
        қалған болар еді. Әр DNF және DNS дұрыс екеніне көз жеткізіңіз. Егер
        бәсекелес әрекетті бастамаса немесе әрекетті бастауға уақыт қалмаса, оны
        DNS ретінде енгізу керек.
      missing_cumulative_round_id_error: >-
        [%{original_round_id}] WCIF-те көрсетілген жиынтық уақыт лимиті үшін
        %{wcif_id} раундын табу мүмкін емес. Жарыстың Оқиғаларды басқару бетіне
        өтіп, %{original_round_id} үшін жиынтық уақыт шегінен %{wcif_id} алып
        тастаңыз. WST бұл қате туралы біледі (GitHub нөмірі #3254).
      wrong_position_in_results_error: >-
        [%{round_id}] %{person_name} қате позицияда: күтілген %{expected_pos},
        бірақ %{pos} алды.
    rounds:
      too_many_qualified_warning: >-
        %{round_id} раунды: алға жылжу шарты жоспарланғаннан көбірек
        бәсекелестер біліктіліктерін алды (%{expected} орнына %{actual}, шарты:
        %{condition}). Оқиғаларды басқару бетіндегі раунд ақпаратын жаңартыңыз.
      regulation_9m1_error: >-
        %{round_id} раундында 99 немесе одан аз бәсекелес бар, бірақ 9m1
        ережесіне сәйкес рұқсат етілмейтін екіден астам келесі раунд бар.
      regulation_9m2_error: >-
        %{round_id} раундында 15 немесе одан аз бәсекелестер бар, бірақ бірден
        көп келесі раунд бар, бұл 9m2 ережесіне сәйкес рұқсат етілмейді.
      regulation_9m3_error: >-
        %{round_id} раундында 7 немесе одан аз бәсекелес бар, бірақ кем дегенде
        бір келесі раунд бар, бұл 9m3 ережесіне сәйкес рұқсат етілмейді.
      regulation_9p1_error: >-
        %{round_id} раунды: Бәсекелестердің 25%-дан азы шығарылды, бұл 9p1
        ережесіне сәйкес рұқсат етілмейді.
      no_competitor_eliminated_error: >-
        %{round_id} раунды: 9p ережесіне сәйкес талап етілетін кем дегенде бір
        бәсекелестің жеңілуі тиіс (2010 жылдың сәуіріне дейінгі жарыстар).
      less_than_twenty_five_percent_eliminated_error: >-
        %{round_id} раунды: ілгерілеу шартына сәйкес (%{condition}),
        бәсекелестердің 25%-дан азы жойылады, бұл 9p1 ережесіне сәйкес рұқсат
        етілмейді. Оқиғаларды басқару бетіндегі раунд ақпаратын жаңартыңыз.
      not_enough_qualified_warning: >-
        %{round_id} раунды: оқиғалар деректеріне сәйкес, ең көбі %{expected}
        жалғасуы мүмкін еді, бірақ раундта тек %{actual} қатысты. Бұл туралы
        пікір қалдырыңыз (немесе басқа ілгерілеу шартын қолданған болсаңыз,
        оқиғалар деректерін түзетіңіз).
      competed_not_qualified_error: >-
        %{round_id} раунды: %{ids} жарысқа түсті, бірақ әрекет нәтижесінің алға
        жылжу шартына (%{condition}) сәйкес келмеді. Өсу шартының жарыс кезінде
        не қолданылғанын көрсететінін тексеріп, қажет болса, нәтижелерді алып
        тастаңыз.
      round_not_found_error: >-
        %{round_id} раунды табылмады. WCA веб-сайтының Оқиғаларды түзету панелі
        мен WCA Live синхрондалғанын тексеріңіз.
      missing_round_results_error: >-
        %{round_id} раунды үшін нәтиже жоқ, бірақ ол оқиғалар бетінде
        көрсетілген. Егер бұл раунд өткізілмесе, жарыстың іс-шараларды басқару
        бетіндегі раундты өшіріңіз.
    events:
      not_333_main_event_warning: >-
        Таңдалған негізгі оқиға: %{main_event_id}. Бұл жарыс алдында WCAT
        тарапынан мақұлданғанымен, WRT жарыс аяқталғаннан кейін WCA жарыс
        талаптары саясатындағы негізгі іс-шараның тиісті нұсқаулықтарының
        орындалуын қамтамасыз етуге жауапты. %{main_event_id}-ді БӘСЕКЕ АРҚЫЛЫ
        негізгі іс-шара ретінде қарастыру үшін жасалған бір әрекетті көрсетіңіз
        (дұрыс мысалдар: жарыстың жеңімпазы деп жарияланды, раундтар саны көп,
        жүлде үлкенірек).
      no_main_event_warning: >-
        Бұл жарыс үшін негізгі іс-шара таңдалған жоқ. Бұл дұрыс екенін WRT-ге
        хабарлаңыз.
      missing_results_warning: >-
        %{event_id} үшін нәтиже жоқ, бірақ ол ресми оқиға ретінде көрсетілген.
        Егер іс-шара өткізілсе, JSON файлыңызды нәтижелерімен бірге қайта
        жүктеңіз. Егер іс-шара өтпеген болса, WRT үшін пікір қалдырыңыз.
    scrambles:
      missing_scrambles_for_round_error: >-
        [%{round_id}] Скремблдер жоқ. Раундқа дұрыс скремблдерді қосу үшін
        Скремблдер сәйкестендіргішін қолданыңыз.
      missing_scrambles_for_competition_error: >-
        Жарысқа арналған скрамблдар жетіспейді. Скрамблдарды қосу үшін Scrambles
        Matcher қолданыңыз.
      missing_scrambles_for_group_error: >-
        [%{round_id}] %{group_id} тобы: скрамблдар жоқ, %{expected} орнына тек
        %{actual} анықталды.
      missing_scrambles_for_multi_error: >-
        [%{round_id}] Сізде 3x3x3 Multi-Blind-те бірнеше топ болуы мүмкін болса
        да, топтардың кем дегенде біреуінде барлық әрекеттер үшін скрамблдар
        болуы керек.
      multiple_fmc_groups_warning: >-
        [%{round_id}] FMC бірнеше топтары қолданылады. Егер FMC бір тобы
        қолданылған болса, қолданылмаған шифрлерді белгілеуді алып тастау үшін
        Scrambles Matcher-ді пайдаланыңыз. Әйтпесе, неліктен бірнеше FMC топтары
        қолданылғанын түсіндіретін WRT-ге түсініктеме беріңіз.
      wrong_number_of_scramble_sets_error: >-
        [%{round_id}] Бұл раундта Оқиғаларды басқару бетінде көрсетілгеннен
        басқа скрембл жиынтығы бар. Оқиғаларды басқару бетіндегі шифрлау
        жиынтықтарының санын қолданылған жиынтықтар санына сәйкестендіріңіз.
