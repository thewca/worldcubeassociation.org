        '4': Барлық қолданылатын WCA ережелеріне бағыну
        '5': WCA еріктілерінің шешімдерін қабылдау және оларды орындау
        '6': >-
          WCA файлына ағымдағы ережелердің көшірмесін және егер мүмкін болса,
          жарғыны электронды форматта енгізіңіз
