    empty: Қазіргі уақытта WCA ешқандай Аймақтық Ұйымдарды мойындамайды.
    how_to:
      title: WCA Аймақтық Ұйымы ретінде қалай танылуға болады
      description: >-
        WCA әлемдегі әртүрлі аймақтық ұйымдарды таниды. WCA кез - келген
        аймақтық ұйымының мақсаты-WCA жарыстарын ұйымдастыру және аймақтағы WCA
        қызметін қолдау. Аймақтық ұйым құрғысы келетін елдерге өтініш бергенге
        дейін өз аймағындағы WCA-ға өз үлестерін қосу ұсынылады. Сіздің
        аймағыңызда WCA жарысын ұйымдастыруға көмектесу үшін сізге жақын WCA
        Делегатына хабарласыңыз.
    requirements:
      title: WCA Аймақтық Ұйымдарына қойылатын талаптар
      list:
        '1': >-
          Ұйым аймағындағы ресми жарыстарды белсенді түрде ұйымдастырыңыз немесе
          сақтаңыз
        '2': >-
          Егер ұйымның тиісті тобы қажет болса, аймақтық ұйымның құрлығында
          өткізілетін құрлықтық ресми жарыстарға белсенді түрде үлес қосыңыз
        '3': >-
          WCA Жарғысында және ережелерінде көрсетілген мақсаттарды құрметтеу
