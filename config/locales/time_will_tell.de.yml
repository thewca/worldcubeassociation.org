time_will_tell:
  date_range:
    different_months_same_year: '%{from_day} %{from_month} %{sep} %{to_day} %{to_month}'
    different_years: '%{from_day} %{from_month} %{from_year} %{sep} %{to_day} %{to_month}
      %{to_year}'
    same_month: '%{from_day} %{sep} %{to_day} %{month}'
    same_date: '%{from_day} %{month}'
    with_year: '%{date_range} %{year}'
  distance_in_words:
    template: '%{count} %{unit}'
    template_long: '%{rest} und %{last}'
    units:
      second: Sekunde
      minute: Minute
      hour: Stunde
      day: Tag
      month: Monat
      year: Jahr
    special:
      half_an_hour: halbe Stunde
      and_a_half: und einhalb
