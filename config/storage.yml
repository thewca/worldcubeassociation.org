local:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local_private:
  service: Disk
  root: <%= Rails.root.join("tmp/storage-private") %>

s3_default: &s3_default
  service: S3
  access_key_id: <%= AppSecrets.AWS_ACCESS_KEY_ID %>
  secret_access_key: <%= AppSecrets.AWS_SECRET_ACCESS_KEY %>

amazon:
  <<: *s3_default
  bucket: <%= EnvConfig.STORAGE_AWS_BUCKET %>

s3_avatars_public:
  <<: *s3_default
  bucket: <%= EnvConfig.S3_AVATARS_BUCKET %>
  public: true

s3_avatars_private:
  <<: *s3_default
  bucket: <%= EnvConfig.S3_AVATARS_PRIVATE_BUCKET %>

# Deliberately not `public: true`: the bucket blocks public ACLs and is only
# readable through CloudFront via OAC. URLs are built against
# S3_UPLOADS_ASSET_HOST instead.
s3_uploads_public:
  <<: *s3_default
  bucket: <%= EnvConfig.S3_UPLOADS_PUBLIC_BUCKET %>

# Markdown images belonging to private records - delegate reports, mostly.
# Never fronted by the CDN; served through MarkdownImagesController, which
# authorises the viewer before handing out a short-lived presigned URL.
s3_uploads_private:
  <<: *s3_default
  bucket: <%= EnvConfig.S3_UPLOADS_PRIVATE_BUCKET %>
