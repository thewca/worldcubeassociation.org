get:
  summary: Get the current user's eligibility to register for a competition
  description: |
    Whether the calling user may be shown the registration form at all, and which blocker to
    explain to them if not. Complements `registrationConfig`, which describes the steps
    themselves.
  tags:
    - competitions
    - registrations
  operationId: registrationEligibility
  parameters:
    - name: competitionId
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            $ref: '../../schemas/registrations/RegistrationEligibility.yaml'
    '401':
      $ref: '../../errorResponses/NotLoggedIn.yaml'
    '404':
      $ref: '../../errorResponses/CompetitionNotFound.yaml'
