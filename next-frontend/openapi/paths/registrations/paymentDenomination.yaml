get:
  summary: Convert a registration's fee into the denominations a payment needs
  description: |
    What a payment attempt would charge, expressed in every denomination the frontend needs. The
    payment providers each want their own integer format - Stripe has special-case currencies that
    are not simple subunits - so the conversion stays on the server rather than being reimplemented
    per client.
  tags:
    - registrations
    - payments
  operationId: registrationPaymentDenomination
  parameters:
    - name: registrationId
      in: path
      required: true
      schema:
        type: integer
    - name: iso_donation_amount
      in: query
      required: false
      description: Optional donation on top of the entry fee, in the currency's lowest denomination
      schema:
        type: integer
        default: 0
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            type: object
            required:
              - api_amounts
              - human_amount
            properties:
              api_amounts:
                type: object
                required:
                  - stripe
                  - paypal
                properties:
                  stripe:
                    type: integer
                    description: The amount as the Stripe API wants it
                  paypal:
                    type: string
                    description: The amount as the PayPal API wants it, which is a decimal string
              human_amount:
                type: string
                description: The amount formatted for display, including the currency's name
    '401':
      $ref: '../../errorResponses/NotLoggedIn.yaml'
    '4XX':
      $ref: '../../errorResponses/RegistrationError.yaml'
