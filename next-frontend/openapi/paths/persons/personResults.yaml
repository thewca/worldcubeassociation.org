get:
  summary: Get results for a person
  description: >-
    The person's results, optionally narrowed to one event. Paginated by competition, newest
    first, so a page holds every result of `per_page` competitions. Public: no authentication
    required.
  tags:
    - persons
  operationId: v1PersonResults
  parameters:
    - name: wca_id
      in: path
      required: true
      schema:
        type: string
    - name: event_id
      in: query
      required: false
      schema:
        type: string
    - name: page
      in: query
      schema:
        type: integer
      description: Page number to retrieve
    - name: per_page
      in: query
      schema:
        type: integer
      description: Number of competitions per page
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            $ref: '../../schemas/results/V1PersonResults.yaml'
    '404':
      description: No person with this WCA ID
