get:
  summary: Get results for a person
  description: >-
    Every result the person has ever earned, optionally narrowed to one event. Public: no
    authentication required.
  tags:
    - persons
  operationId: v1PersonResults
  parameters:
    - name: wca_id
      in: path
      required: true
      schema:
        type: string
    - name: event_id
      in: query
      required: false
      schema:
        type: string
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            $ref: '../../schemas/results/V1Results.yaml'
    '404':
      description: No person with this WCA ID
