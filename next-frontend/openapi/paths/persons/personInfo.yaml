get:
  summary: Get information for a person
  description: >-
    The person's profile: their public details, personal records, medal and record counts, and
    championship podiums. Public: no authentication required.
  tags:
    - persons
  operationId: v1PersonInfo
  parameters:
    - name: wca_id
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            $ref: '../../schemas/persons/V1PersonInfo.yaml'
    '404':
      description: No person with this WCA ID
