get:
  summary: Get the podiums of a competition
  description: >-
    The first three placed competitors of every event, by `global_pos`. Public: no authentication
    required. Returns an empty array while results have not been posted.
  tags:
    - competitions
    - results
  operationId: v1CompetitionPodiums
  parameters:
    - name: competitionId
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../../schemas/competitions/V1CompetitionPodium.yaml'
    '404':
      $ref: '../../errorResponses/CompetitionNotFound.yaml'
