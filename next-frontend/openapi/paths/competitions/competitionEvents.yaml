get:
  summary: Get competition events in WCIF format
  tags:
    - competitions
  operationId: competitionEvents
  parameters:
    - name: competitionId
      in: path
      required: true
      schema:
        type: string
    - name: wcif_version
      in: query
      description: Which WCIF version to render, by lifecycle name. Defaults to the stable version, the response schema documents the latest one.
      required: false
      schema:
        type: string
        enum: [stable, latest]
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../../schemas/wcif/WcifEvent.yaml'
    '404':
      $ref: '../../errorResponses/CompetitionNotFound.yaml'
