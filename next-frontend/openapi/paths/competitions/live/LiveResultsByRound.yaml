get:
  summary: Gets Information about the Round including the live Results
  tags:
    - live
  operationId: liveByRound
  parameters:
    - name: competitionId
      in: path
      required: true
      schema:
        type: string
    - name: roundId
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: Returns results
      content:
        application/json:
          schema:
            $ref: "../../../schemas/live/LiveRound.yaml"
post:
  summary: Adds a live result for a given round
  parameters:
    - name: competitionId
      in: path
      required: true
      schema:
        type: string
    - name: roundId
      in: path
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../../schemas/live/SubmitLiveResult.yaml'
  responses:
    '202':
      description: Result Accepted
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
    '403':
      $ref: '../../../errorResponses/NotPermitted.yaml'
    '422':
      $ref: '../../../errorResponses/LiveResultRejected.yaml'
patch:
  summary: Updates a live result for a given round
  parameters:
    - name: competitionId
      in: path
      required: true
      schema:
        type: string
    - name: roundId
      in: path
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../../schemas/live/SubmitLiveResult.yaml'
  responses:
    '202':
      description: Result Update Accepted
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
    '403':
      $ref: '../../../errorResponses/NotPermitted.yaml'
    '422':
      $ref: '../../../errorResponses/LiveResultRejected.yaml'
