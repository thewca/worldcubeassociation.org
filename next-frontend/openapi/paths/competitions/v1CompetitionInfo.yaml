get:
  summary: Get the details of a competition
  description: >-
    Public for announced competitions. Unannounced competitions are only returned to users who can
    manage them, and an OAuth token additionally needs the `manage_competitions` scope; everyone
    else gets the same 404 as for a competition that does not exist.
  tags:
    - competitions
  operationId: v1CompetitionInfo
  parameters:
    - name: competitionId
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            $ref: '../../schemas/competitions/V1CompetitionInfo.yaml'
    '404':
      $ref: '../../errorResponses/CompetitionNotFound.yaml'
