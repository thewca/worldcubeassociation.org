get:
  summary: Get the posted results of a competition
  description: >-
    Every round of the competition with its results nested, ordered by event and then by round
    number. Public: no authentication required. Returns an empty array while results have not been
    posted.
  tags:
    - competitions
    - results
  operationId: v1CompetitionResults
  parameters:
    - name: competitionId
      in: path
      required: true
      schema:
        type: string
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../../schemas/competitions/V1CompetitionRound.yaml'
    '404':
      $ref: '../../errorResponses/CompetitionNotFound.yaml'
