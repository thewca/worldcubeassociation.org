get:
  summary: Get a list of competitions with the details needed to oversee their announcement, delegate report and results
  tags:
    - competitions
  operationId: adminCompetitionList
  security:
    - bearerAuth: []
  parameters:
    - name: page
      in: query
      schema:
        type: integer
      description: Page number to retrieve
    - name: per_page
      in: query
      schema:
        type: integer
      description: Number of results per page
    - name: include_cancelled
      in: query
      schema:
        type: boolean
    - name: championship_only
      in: query
      schema:
        type: boolean
      description: Only return championships
    - name: continent
      in: query
      schema:
        type: string
    - name: country_iso2
      in: query
      schema:
        type: string
    - name: delegate
      in: query
      schema:
        type: string
    - name: event_ids[]
      in: query
      schema:
        type: array
        items:
          type: string
    - name: start
      in: query
      schema:
        type: string
        format: datetime
    - name: end
      in: query
      schema:
        type: string
        format: datetime
    - name: admin_status
      in: query
      schema:
        type: string
      description: "Only return competitions whose delegate report or results are overdue by the given severity: `warning` or `danger`"
    - name: q
      in: query
      schema:
        type: string
    - name: sort
      in: query
      schema:
        type: string
    - name: ongoing_and_future
      in: query
      schema:
        type: string
        format: datetime
    - name: scoretaking_software
      in: query
      schema:
        type: string
        enum: [external, wca_live, internal]
  responses:
    '200':
      description: Successful response
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../../schemas/competitions/AdminCompetitionIndex.yaml'
    '401':
      $ref: '../../errorResponses/NotLoggedIn.yaml'
    '403':
      $ref: '../../errorResponses/NotPermitted.yaml'
