type: object
description: General information about a person, along with a summary of their results.
required:
  - wca_id
  - name
  - gender
  - country_iso2
  - user_id
  - delegate_status
  - url
  - teams
  - avatar
  - competition_count
  - event_ids_with_results
  - ranks_by_event
  - medals
  - records
  - completed_solves_count
  - championship_podium_results
  - previous_persons
properties:
  wca_id:
    type: string
    example: "2005REYN01"
  name:
    type: string
    example: "Tim Reynolds"
  gender:
    type: string
    example: "m"
  country_iso2:
    type: string
    example: "US"
  user_id:
    type: [integer, "null"]
    description: Null for a person who has no WCA account.
    example: 1
  delegate_status:
    type: [string, "null"]
    description: Null for a person who is not a delegate, or who has no WCA account at all.
    example: "delegate"
  teams:
    type: array
    items:
      $ref: '../users/V1TeamMembership.yaml'
  url:
    type: string
    format: uri
    example: "https://www.worldcubeassociation.org/persons/2005REYN01"
  avatar:
    $ref: '../users/UserAvatar.yaml'
  competition_count:
    type: integer
    example: 42
  event_ids_with_results:
    type: array
    description: >-
      Every event the person has a result in, including events they never had a successful solve
      in, ordered by event rank.
    items:
      type: string
    example: ["333", "222", "444"]
  ranks_by_event:
    type: object
    description: >-
      The person's ranks in official events, keyed by event id. An event the person has no single
      for is absent.
    additionalProperties:
      type: object
      description: A person can have a single in an event without an average, never the other way round.
      required:
        - single
      properties:
        single:
          $ref: '../results/V1Rank.yaml'
        average:
          $ref: '../results/V1Rank.yaml'
  medals:
    $ref: '../results/Medals.yaml'
  records:
    $ref: '../results/Records.yaml'
  completed_solves_count:
    type: integer
    example: 1337
  championship_podium_results:
    $ref: './V1ChampionshipPodiums.yaml'
  previous_persons:
    type: array
    description: The names and regions the person competed under before their current ones, most recent first.
    items:
      type: object
      required:
        - name
        - country_iso2
      properties:
        name:
          type: string
          example: "Tim Reynolds"
        country_iso2:
          type: string
          example: "CA"
