oneOf:
  - type: object
    properties:
      type:
        type: string
        enum: [registrations]
    required:
      - type
  - type: object
    properties:
      type:
        type: string
        enum: [round]
      roundId:
        type: string
      resultCondition:
        $ref: './WcifResultCondition.yaml'
    required:
      - type
      - roundId
  - type: object
    properties:
      type:
        type: string
        enum: [linkedRounds]
      roundIds:
        type: array
        items:
          type: string
      resultCondition:
        $ref: './WcifResultCondition.yaml'
    required:
      - type
      - roundIds
