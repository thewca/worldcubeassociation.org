allOf:
  - $ref: './BaseLiveResult.yaml'
  - type: object
    required:
      - global_pos
      - local_pos
      - round_wcif_id
    properties:
      round_wcif_id:
        type: string
      global_pos:
        type:
          - integer
          - "null"
      local_pos:
        type:
          - integer
          - "null"
      forecast_statistics:
        type:
          - object
          - "null"
        properties:
          best_possible_average:
            type: integer
          worst_possible_average:
            type: integer
          projected_average:
            type: integer
