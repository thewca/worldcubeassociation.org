type: object
properties:
  id:
    type: string
    example: "333-r1"
  format:
    type: string
    enum: [ '1', '2', '3', 'a', 'm' ]
  timeLimit:
    $ref: '../wcif/WcifTimeLimit.yaml'
  cutoff:
    $ref: '../wcif/WcifCutoffV2.yaml'
  linkedRounds:
    type: array
    items:
      type: string
  participationRuleset:
    $ref: '../wcif/WcifParticipationRuleset.yaml'
  scrambleSetCount:
    type: integer
  scrambleSets:
    type: array
    items:
      $ref: '../wcif/WcifScrambleSet.yaml'
  extensions:
    type: array
required:
  - id
  - format
